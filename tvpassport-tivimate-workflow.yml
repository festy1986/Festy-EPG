name: TVPassport-Tivimate

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-tvpassport
  cancel-in-progress: false

jobs:
  build-tvpassport-tivimate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Build TVPassport channel source from guide plus raw IDs
        run: |
          mkdir -p epg/sites/tvpassport.com

          node <<'EOFJS'
          const fs = require('fs')

          const sourcePath = 'guides/TVPassport.xml'
          const rawPath = 'guides/TVPassportRAW.xml'
          const outputPath = 'epg/sites/tvpassport.com/festy-tvpassport.channels.xml'

          const aliases = {
            'ABC.BOSTON.us': ['WCVB.TV', 'WCVB', 'ABC WCVB', 'ABC Boston'],
            'ABC.PORTLAND.us': ['WMTW.TV', 'WMTW', 'ABC WMTW', 'ABC Portland'],
            'CBS.BOSTON.us': ['WBZ.TV', 'WBZ', 'CBS WBZ', 'CBS Boston'],
            'CBS.PORTLAND.us': ['WGME.TV', 'WGME', 'CBS WGME', 'CBS Portland'],
            'CW.BOSTON.us': ['WLVI.TV', 'WLVI', 'CW Boston'],
            'FOX.BOSTON.us': ['WFXT', 'WFXT.TV', 'FOX Boston'],
            'FOX.PORTLAND.us': ['WGME.TV.DT2', 'WGME.DT2', 'WGME 13.2', 'FOX Portland'],
            'NBC.BOSTON.us': ['WBTS.CD', 'WBTS', 'NBC Boston'],
            'NBC.PORTLAND.us': ['WCSH', 'WCSH.TV', 'NBC Portland'],
            'COMET.us': ['WPFO.DT3', 'WPFO 23.3', 'Comet TV'],
            'LAFF.us': ['WMTW.TV.DT3', 'WMTW.DT3', 'Laff TV'],
            'METV.us': ['WMTW.TV.DT2', 'WMTW.DT2', 'MeTV'],
            'GRIT.us': ['WIPL.DT4', 'WIPL 35.4', 'Grit TV'],
            'HEROES.AND.ICONS.us': ['WPXT.DT2', 'H&I', 'Heroes and Icons'],
            'ION.us': ['WIPL.DT1', 'ION Television'],
            'ION.MYSTERY.us': ['WPXT.DT3', 'Ion Mystery', 'Court TV Mystery'],
            'ION.PLUS.us': ['WIPL.DT5', 'Ion Plus'],
            'COURT.TV.us': ['WIPL.DT2', 'Court TV'],
            'ANTENNA.TV.us': ['WGME.TV.DT4', 'Antenna TV'],
            'COZI.TV.us': ['WCSH.DT2', 'WCSH 6.2', 'Cozi TV'],

            'NEW.ENGLAND.CABLE.NEWS.us': ['NECN', 'New England Cable News'],
            'MS.NOW.us': ['MSNBC', 'MS Now'],
            'NESN.us': ['New England Sports Network', 'NESN'],
            'NESN.PLUS.us': ['NESN+', 'NESN Plus', 'New England Sports Network Plus'],
            'ESPN2.us': ['ESPN 2', 'ESPN2'],
            'WE.TV.us': ['WE', 'WE tv'],
            'FOX.NEWS.CHANNEL.us': ['Fox News', 'Fox News Channel'],
            'NAT.GEO.us': ['National Geographic', 'Nat Geo'],
            'TRUTV.us': ['truTV', 'Tru TV'],
            'E.us': ['E!', 'E Entertainment'],
            'AXS.TV.us': ['AXS', 'AXS TV'],
            'MTV2.us': ['MTV 2', 'MTV2'],
            'DISCOVERY.SCIENCE.us': ['Science Channel', 'Discovery Science'],
            'INVESTIGATION.DISCOVERY.us': ['ID', 'Investigation Discovery'],
            'HALLMARK.MYSTERY.us': ['Hallmark Movies & Mysteries', 'Hallmark Mystery'],
            'CRIME.AND.INVESTIGATION.us': ['Crime+Investigation', 'Crime & Investigation', 'CI'],
            'AMC.PLUS.us': ['AMC+', 'AMC Plus'],
            'FOX.SPORTS.1.us': ['FS1', 'Fox Sports 1'],
            'FOX.SPORTS.2.us': ['FS2', 'Fox Sports 2'],
            'CBS.SPORTS.NETWORK.us': ['CBSSN', 'CBS Sports Network'],
            'ESPN.NEWS.us': ['ESPNews', 'ESPN News'],
            'NBA.TV.us': ['NBATV', 'NBA TV'],
            'UP.TV.us': ['UP', 'UP TV'],
            'AWE.us': ['A Wealth of Entertainment', 'AWE'],
            'GREAT.AMERICAN.FAMILY.us': ['GAF', 'Great American Family'],

            'HBO.US.us': ['HBO', 'HBO US', 'Home Box Office'],
            'HBO.CANADA.ca': ['HBO Canada', 'Crave HBO'],
            'HBO.2.CANADA.ca': ['HBO 2 Canada', 'Crave HBO2'],
            'SHOWTIME.BET.us': ['SHOBET', 'SHOxBET', 'Showtime BET'],
            'SHOWTIME.EXTREME.us': ['SHOX', 'Showtime Extreme'],
            'SHOWTIME.FAMILY.ZONE.us': ['SHOFAM', 'Showtime Family Zone'],
            'SHOWTIME.NEXT.us': ['SHONEXT', 'Showtime Next'],
            'SHOWTIME.SHOWCASE.us': ['SHOSHOCASE', 'Showtime Showcase'],
            'STARZ.US.us': ['STARZ', 'Starz US'],
            'STARZ.CANADA.ca': ['Starz Canada', 'Crave Starz'],
            'STARZ.2.CANADA.ca': ['Starz 2 Canada'],
            'STARZ.INBLACK.us': ['Starz In Black', 'Starz inBlack'],
            'MOVIEPLEX.us': ['MoviePlex', 'MPLEX'],
            'RETROPLEX.us': ['RetroPlex', 'RPlex'],
            'INDIEPLEX.us': ['IndiePlex', 'IPlex'],
            'MGM.us': ['MGM+', 'Epix', 'MGM'],
            'MGM.HITS.us': ['MGM+ Hits', 'MGM Hits'],
            'MGM.MARQUEE.us': ['MGM+ Marquee', 'MGM Marquee'],
            'MGM.DRIVE.IN.us': ['MGM Drive-In', 'MGM+ Drive-In'],
            'SONY.MOVIES.us': ['Sony Movie Channel', 'Sony Movies'],
            'HOLLYWOOD.SUITE.70S.ca': ['Hollywood Suite 70s', "Hollywood Suite 70's", 'HS70'],
            'HOLLYWOOD.SUITE.80S.ca': ['Hollywood Suite 80s', "Hollywood Suite 80's", 'HS80'],
            'HOLLYWOOD.SUITE.2000S.ca': ['Hollywood Suite 2000s', "Hollywood Suite 2000's", 'HS2000'],
            'HOLLYWOOD.SUITE.2010S.ca': ['Hollywood Suite 2010s', "Hollywood Suite 2010's", 'HS2010']
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function attr(attrs, name) {
            const m = attrs.match(new RegExp(`${name}="([^"]*)"`, 'i'))
            return m ? decodeXml(m[1]).trim() : ''
          }

          function cleanBody(body) {
            const display = body.match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/i)
            if (display) return decodeXml(display[1].replace(/<[^>]+>/g, '').trim())
            return decodeXml(body.replace(/<url>[\s\S]*?<\/url>/gi, '').replace(/<[^>]+>/g, '').trim())
          }

          function norm(s) {
            return decodeXml(s)
              .replace(/\.us$/i, '')
              .replace(/\.ca$/i, '')
              .replace(/\bHD\b/gi, '')
              .replace(/&/g, 'AND')
              .replace(/\+/g, 'PLUS')
              .replace(/[^A-Z0-9]+/gi, '.')
              .replace(/^\.+|\.+$/g, '')
              .toUpperCase()
          }

          function parseChannels(xml) {
            return [...xml.matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)].map(m => {
              const attrs = m[1]
              const body = m[2]
              return {
                id: attr(attrs, 'id') || attr(attrs, 'xmltv_id'),
                xmltv_id: attr(attrs, 'xmltv_id') || attr(attrs, 'id'),
                site_id: attr(attrs, 'site_id') || attr(attrs, 'site-id'),
                name: cleanBody(body)
              }
            })
          }

          if (!fs.existsSync(sourcePath)) {
            console.error(`Missing ${sourcePath}`)
            process.exit(1)
          }
          if (!fs.existsSync(rawPath)) {
            console.error(`Missing ${rawPath}`)
            process.exit(1)
          }

          const sourceChannels = parseChannels(fs.readFileSync(sourcePath, 'utf8'))
          const rawChannels = parseChannels(fs.readFileSync(rawPath, 'utf8'))

          const rawById = new Map()
          const rawByName = new Map()

          for (const ch of rawChannels) {
            if (ch.xmltv_id && ch.site_id) rawById.set(norm(ch.xmltv_id), ch)
            if (ch.id && ch.site_id) rawById.set(norm(ch.id), ch)
            if (ch.name && ch.site_id) rawByName.set(norm(ch.name), ch)
          }

          const out = []
          const missing = []
          const seen = new Set()

          for (const src of sourceChannels) {
            const wantedId = src.id || src.xmltv_id
            const wantedName = src.name || wantedId
            let siteId = src.site_id
            let match = null

            if (!siteId) {
              const keys = [wantedId, wantedName, ...(aliases[wantedId] || [])].map(norm)
              for (const key of keys) {
                match = rawById.get(key) || rawByName.get(key)
                if (match) break
              }
              if (match) siteId = match.site_id
            }

            if (!wantedId || !siteId) {
              missing.push(`${wantedId || '(no id)'} (${wantedName})`)
              continue
            }

            const key = `${wantedId}|${siteId}`
            if (seen.has(key)) continue
            seen.add(key)

            out.push(`  <channel site="tvpassport.com" lang="en" xmltv_id="${escapeXml(wantedId)}" site_id="${escapeXml(siteId)}">${escapeXml(wantedName)}</channel>`)
          }

          console.log(`Source channels: ${sourceChannels.length}`)
          console.log(`Raw channels: ${rawChannels.length}`)
          console.log(`Built channels: ${out.length}`)
          console.log(`Missing site_id after raw lookup: ${missing.length}`)

          if (missing.length) {
            console.log('\nMissing site_id:')
            missing.forEach(x => console.log(`- ${x}`))
            process.exit(1)
          }

          if (out.length < 100) {
            console.error(`Refusing to run: expected at least 100 channels, built ${out.length}`)
            process.exit(1)
          }

          fs.writeFileSync(outputPath, `<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n${out.join('\n')}\n</channels>\n`)
          EOFJS

      - name: Write enriched TVPassport config
        run: |
          cat > epg/sites/tvpassport.com/tvpassport.com.config.js <<'EOFJS'
          const axios = require('axios')
          const dayjs = require('dayjs')
          const cheerio = require('cheerio')
          const utc = require('dayjs/plugin/utc')
          const timezone = require('dayjs/plugin/timezone')
          const customParseFormat = require('dayjs/plugin/customParseFormat')

          dayjs.extend(utc)
          dayjs.extend(timezone)
          dayjs.extend(customParseFormat)

          module.exports = {
            site: 'tvpassport.com',
            days: 3,
            delay: 500,

            url({ channel, date }) {
              return `https://www.tvpassport.com/tv-listings/stations/${channel.site_id}/${date.format('YYYY-MM-DD')}`
            },

            async request() {
              return {
                timeout: Number(process.env.TVPASSPORT_SCHEDULE_TIMEOUT || 30000),
                headers: {
                  Cookie: await getCookie(),
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            parser({ content, channel, date }) {
              const programs = []
              const currentTimezone = parseCurrentTimezone(content)
              const items = parseItems(content)

              console.log(`[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${items.length}`)

              for (const item of items) {
                const $item = cheerio.load(item)
                const start = parseStart($item, currentTimezone)
                const duration = parseDuration($item)
                const stop = start.add(duration, 'm')

                let title = cleanTitle(parseTitle($item))
                let episodeTitle = cleanSpaces(parseSubTitle($item))
                if (title === 'Movie' || title === 'Cinéma') {
                  title = episodeTitle
                  episodeTitle = ''
                }

                const description = cleanSpaces(parseDescription($item))
                const releaseYear = parseYear($item)
                const programType = classifyProgramType({ $item, title, episodeTitle, releaseYear, duration })

                const finalDescription = buildPackedDescription({
                  programType,
                  episodeTitle,
                  episodeCode: '',
                  description,
                  airDate: '',
                  releaseYear,
                  suppressDisplayDate: false
                })

                programs.push({
                  title,
                  description: finalDescription,
                  image: parseImage($item),
                  rating: parseRating($item),
                  actors: parseActors($item),
                  guest: parseGuest($item),
                  director: parseDirector($item),
                  start,
                  stop,
                  category: buildCategories(programType, parseCategory($item))
                })
              }

              return programs
            }
          }

          async function getCookie() {
            const res = await axios.get('https://www.tvpassport.com/tv-listings')
            const setCookie = res.headers['set-cookie']
            if (!setCookie || setCookie.length === 0) return ''
            return setCookie.map(cookie => cookie.split(';')[0]).join('; ')
          }

          function parseDescription($item) { return $item('*').data('description') || '' }
          function parseImage($item) {
            const showpicture = $item('*').data('showpicture')
            if (!showpicture) return null
            return new URL(showpicture, 'https://cdn.tvpassport.com/image/show/960x540/').href
          }
          function parseTitle($item) { return String($item('*').data('showname') || '') }
          function parseSubTitle($item) { return String($item('*').data('episodetitle') || '') }
          function parseYear($item) { return String($item('*').data('year') || '') }
          function parseCategory($item) {
            const showtype = $item('*').data('showtype')
            return showtype ? String(showtype).split(', ').filter(Boolean) : []
          }
          function parseActors($item) {
            const cast = $item('*').data('cast')
            return cast ? String(cast).split(', ').filter(Boolean) : []
          }
          function parseDirector($item) {
            const director = $item('*').data('director')
            return director ? String(director).split(', ').filter(Boolean) : []
          }
          function parseGuest($item) {
            const guest = $item('*').data('guest')
            return guest ? String(guest).split(', ').filter(Boolean) : []
          }
          function parseRating($item) {
            const rating = $item('*').data('rating')
            return rating ? { system: 'MPA', value: String(rating).replace(/^TV/, 'TV-') } : null
          }
          function parseStart($item, currentTimezone) {
            return dayjs.tz($item('*').data('st'), 'YYYY-MM-DD HH:mm:ss', currentTimezone)
          }
          function parseDuration($item) { return parseInt($item('*').data('duration') || 0) }
          function parseItems(content) {
            if (!content) return []
            const $ = cheerio.load(content)
            return $('.station-listings .list-group-item').toArray()
          }
          function parseCurrentTimezone(content) {
            if (!content) return 'America/New_York'
            const $ = cheerio.load(content)
            return $('#timezone_selector').val() || 'America/New_York'
          }

          function classifyProgramType({ $item, title, episodeTitle, releaseYear, duration }) {
            const haystack = [title, parseCategory($item), $item('*').data('showtype')].flat().filter(Boolean).join(' ').toLowerCase()
            if (/movie|film|cinema/.test(haystack)) return 'movie'
            if (episodeTitle) return 'series'
            if (duration >= 75 && releaseYear) return 'movie'
            return 'program'
          }

          function buildCategories(programType, tvpassportCategories) {
            const categories = []
            if (programType === 'movie') categories.push('Movie')
            else if (programType === 'series') categories.push('Series')
            else categories.push('Program')
            for (const c of tvpassportCategories || []) {
              if (c && !categories.some(x => x.toLowerCase() === c.toLowerCase())) categories.push(c)
            }
            return categories
          }

          function buildPackedDescription({ programType, episodeTitle, episodeCode, description, airDate, releaseYear, suppressDisplayDate }) {
            const parts = []
            let prefix = ''
            if (programType === 'series') {
              if (episodeTitle && episodeCode) prefix = `${episodeTitle} - ${episodeCode}`
              else if (episodeTitle) prefix = episodeTitle
              else if (episodeCode) prefix = episodeCode
            }
            if (prefix) parts.push(prefix)
            if (description) parts.push(description)
            let finalDescription = cleanPackedDescription(parts.join('. '))
            if (programType === 'movie') {
              if (releaseYear && !descriptionIncludesDisplayDate(finalDescription, releaseYear)) {
                finalDescription = finalDescription ? `${finalDescription} (${releaseYear})` : `(${releaseYear})`
              }
              return finalDescription
            }
            if (programType === 'series') {
              if (airDate && !suppressDisplayDate && !descriptionIncludesDisplayDate(finalDescription, airDate)) {
                finalDescription = finalDescription ? `${finalDescription} (${airDate})` : `(${airDate})`
              }
              return finalDescription
            }
            const dateOrYear = suppressDisplayDate ? releaseYear : (airDate || releaseYear)
            if (dateOrYear && !descriptionIncludesDisplayDate(finalDescription, dateOrYear)) {
              finalDescription = finalDescription ? `${finalDescription} (${dateOrYear})` : `(${dateOrYear})`
            }
            return finalDescription
          }

          function cleanTitle(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }
          function cleanSpaces(value) {
            return String(value || '').replace(/\s+/g, ' ').replace(/\s+([.,!?;:])/g, '$1').replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2').trim()
          }
          function cleanPackedDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }
          function descriptionIncludesDisplayDate(description, dateOrYear) {
            if (!description || !dateOrYear) return false
            const escaped = String(dateOrYear).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            return new RegExp(`\\(${escaped}\\)\\s*$`).test(description) || description.includes(String(dateOrYear))
          }
          EOFJS

      - name: Grab TVPassport guide
        run: |
          cd epg
          rm -f ../guides/TVPassport.xml
          npx tsx scripts/commands/epg/grab.ts \
            --channels=sites/tvpassport.com/festy-tvpassport.channels.xml \
            --output="../guides/TVPassport.xml" \
            --days=3 \
            --maxConnections=4
          cd ..

      - name: Fill missing TVPassport metadata from TVMaze
        run: |
          node <<'EOFJS'
          const fs = require('fs')

          const guidePath = 'guides/TVPassport.xml'
          const cachePath = 'guides/.tvmaze-tvpassport-cache.json'
          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(guidePath, 'utf8')
          let cache = {}
          if (fs.existsSync(cachePath)) {
            try { cache = JSON.parse(fs.readFileSync(cachePath, 'utf8')) } catch { cache = {} }
          }

          const stats = { programmes: 0, searchedShows: 0, matchedShows: 0, enriched: 0, skippedMovies: 0 }
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

          function escapeXml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
          function decodeXml(s) { return String(s || '').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>') }
          function stripTags(s) { return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim()) }
          function getTag(block, tag) { const m = block.match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i')); return m ? stripTags(m[1]) : '' }
          function getTags(block, tag) { return [...block.matchAll(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'gi'))].map(m => stripTags(m[1])).filter(Boolean) }
          function hasTag(block, tag) { return new RegExp(`<${tag}\\b`, 'i').test(block) }
          function hasCategory(block, category) { return getTags(block, 'category').some(c => c.toLowerCase() === category.toLowerCase()) }
          function hasAnyCategory(block) { return hasTag(block, 'category') }
          function insertBeforeProgrammeEnd(block, tagXml) { return block.replace(/<\/programme>\s*$/i, `${tagXml}\n</programme>`) }
          function replaceTag(block, tag, value) {
            const tagXml = `  <${tag} lang="en">${escapeXml(value)}</${tag}>`
            if (hasTag(block, tag)) return block.replace(new RegExp(`<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`, 'i'), tagXml.trim())
            return insertBeforeProgrammeEnd(block, tagXml)
          }
          function normalize(s) { return String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim() }
          function isMovie(block) { return hasCategory(block, 'Movie') || hasCategory(block, 'Film') }
          function cleanTitleForSearch(title) { return String(title || '').replace(/\s+/g, ' ').replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '').replace(/\s*\((New|Live|Repeat)\)\s*$/i, '').trim() }
          function getStartDate(block) { const m = block.match(/start="(\d{8})/i); return m ? `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}` : '' }
          function needsTvmaze(block) {
            if (isMovie(block)) return false
            const desc = getTag(block, 'desc')
            if (!hasAnyCategory(block)) return true
            if (!desc) return true
            return !/\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/.test(desc)
          }
          function scoreShow(title, show) { const a = normalize(title), b = normalize(show?.name || ''); if (!a || !b) return 0; if (a === b) return 100; if (a.includes(b) || b.includes(a)) return 80; return 0 }
          function showIsMovieLike(show) { const type = String(show?.type || '').toLowerCase(); return type === 'movie' || type === 'film' }
          async function fetchJsonWithRetries(url, label) {
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(url, { headers: { 'User-Agent': 'festy-epg-tvpassport-tvmaze-fill-missing-only/1.0' } })
                if (response.status === 404) return null
                if (response.status === 429 || response.status >= 500) throw new Error(`HTTP ${response.status}`)
                if (!response.ok) return null
                return await response.json()
              } catch (err) {
                if (attempt === 4) { console.log(`[TVMAZE FAIL] ${label} | ${err.message}`); return null }
                await sleep(1000 * attempt + Math.floor(Math.random() * 500))
              }
            }
            return null
          }
          async function tvmazeSearchShow(title) {
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]
            const result = await fetchJsonWithRetries(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`, `search ${title}`)
            const candidates = Array.isArray(result) ? result.map(x => x.show).filter(Boolean) : []
            let best = null, bestScore = 0
            for (const show of candidates) {
              if (showIsMovieLike(show)) continue
              const score = scoreShow(title, show)
              if (score > bestScore) { best = show; bestScore = score }
            }
            if (bestScore < 80) best = null
            cache[key] = best
            await sleep(250)
            return best
          }
          async function tvmazeEpisodes(showId) {
            const key = `episodes:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]
            const episodes = await fetchJsonWithRetries(`https://api.tvmaze.com/shows/${showId}/episodes`, `episodes ${showId}`)
            cache[key] = Array.isArray(episodes) ? episodes : []
            await sleep(250)
            return cache[key]
          }
          function getPackedEpisodeTitleFromDesc(desc) {
            const cleaned = cleanPackedDescription(desc).replace(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/, '').trim()
            const firstSentence = cleaned.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            if (!first || first.length > 80) return ''
            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            if (prefixMatch) return prefixMatch[1].trim()
            if (/^S\d+E\d+$/i.test(first)) return ''
            return first
          }
          function findEpisodeForProgramme(episodes, block) {
            const desc = getTag(block, 'desc')
            const subtitle = getTag(block, 'sub-title')
            const codeMatch = desc.match(/\bS(\d+)E(\d+)\b/i)
            if (codeMatch) {
              const byCode = episodes.find(ep => Number(ep.season) === Number(codeMatch[1]) && Number(ep.number) === Number(codeMatch[2]))
              if (byCode) return byCode
            }
            const titleCandidates = [subtitle, getPackedEpisodeTitleFromDesc(desc)].filter(Boolean).map(normalize)
            for (const t of titleCandidates) {
              const byName = episodes.find(ep => normalize(ep.name) === t)
              if (byName) return byName
            }
            const scheduleDate = getStartDate(block)
            if (scheduleDate) return episodes.find(ep => ep.airdate === scheduleDate) || null
            return null
          }
          function formatDateDisplay(date) { return /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? `${date.slice(5,7)}/${date.slice(8,10)}/${date.slice(0,4)}` : '' }
          function buildEpisodeCode(season, episode) { const s = Number(season), e = Number(episode); return Number.isFinite(s) && Number.isFinite(e) && s > 0 && e > 0 ? `S${s}E${e}` : '' }
          function cleanSummary(value) { return decodeXml(String(value || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()) }
          function cleanPackedDescription(value) { return String(value || '').replace(/\s+/g, ' ').replace(/\s+([.,!?;:])/g, '$1').replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2').replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)').trim() }
          function descHas(desc, value) { return Boolean(value && normalize(desc).includes(normalize(value))) }
          function buildPackedDescription(existingDesc, show, episode) {
            const existing = cleanPackedDescription(existingDesc)
            if (!episode) return existing
            const episodeName = cleanSummary(episode.name || '')
            const episodeCode = buildEpisodeCode(episode.season, episode.number)
            const episodeSummary = cleanSummary(episode.summary || '')
            const showSummary = cleanSummary(show.summary || '')
            const displayDate = formatDateDisplay(episode.airdate)
            let desc = existing
            const parts = []
            if (episodeName && !descHas(desc, episodeName)) parts.push(episodeName)
            if (episodeCode && !new RegExp(`\\b${episodeCode}\\b`, 'i').test(desc)) {
              if (parts.length) parts[0] = `${parts[0]} - ${episodeCode}`
              else parts.push(episodeCode)
            }
            if (!desc || desc === episodeName || desc === episodeCode) parts.push(episodeSummary || showSummary || '')
            if (desc && parts.length) desc = `${parts.join('. ')}. ${desc}`
            else if (!desc) desc = parts.join('. ')
            if (displayDate && !desc.includes(displayDate)) desc = desc ? `${desc} (${displayDate})` : `(${displayDate})`
            return cleanPackedDescription(desc)
          }
          function enrichBlock(block, show, episode) {
            let updated = block
            let changed = false
            if (!hasAnyCategory(updated)) {
              updated = insertBeforeProgrammeEnd(updated, '  <category lang="en">Series</category>')
              changed = true
            }
            const existingDesc = getTag(updated, 'desc')
            const packed = buildPackedDescription(existingDesc, show, episode)
            if (packed && packed !== existingDesc) {
              updated = replaceTag(updated, 'desc', packed)
              changed = true
            }
            if (changed) stats.enriched++
            return updated
          }

          async function main() {
            const parts = xml.split(/(<programme\b[\s\S]*?<\/programme>)/gi)
            const out = []
            for (const part of parts) {
              if (!/^<programme\b/i.test(part)) { out.push(part); continue }
              stats.programmes++
              let block = part
              const title = cleanTitleForSearch(getTag(block, 'title'))
              if (!title || isMovie(block) || !needsTvmaze(block)) { if (isMovie(block)) stats.skippedMovies++; out.push(block); continue }
              stats.searchedShows++
              const show = await tvmazeSearchShow(title)
              if (!show || showIsMovieLike(show)) { out.push(block); continue }
              stats.matchedShows++
              const episodes = await tvmazeEpisodes(show.id)
              const episode = findEpisodeForProgramme(episodes, block)
              block = enrichBlock(block, show, episode)
              out.push(block)
            }
            fs.writeFileSync(guidePath, out.join(''))
            fs.writeFileSync(cachePath, JSON.stringify(cache, null, 2))
            console.log('[TVMAZE] missing-only enrichment complete')
            console.log(JSON.stringify(stats, null, 2))
          }
          main().catch(err => { console.error(err); process.exit(1) })
          EOFJS

      - name: Validate TVPassport output
        run: |
          CH=$(grep -c '<channel ' guides/TVPassport.xml || true)
          PR=$(grep -c '<programme ' guides/TVPassport.xml || true)
          DESC=$(grep -c '<desc ' guides/TVPassport.xml || true)
          echo "TVPassport channels: $CH"
          echo "TVPassport programmes: $PR"
          echo "TVPassport descriptions: $DESC"
          if [ "$CH" -lt 100 ]; then echo "Invalid TVPassport output - expected at least 100 channels"; exit 1; fi
          if [ "$PR" -lt 1 ]; then echo "Invalid TVPassport output - no programmes"; exit 1; fi
          if [ "$DESC" -lt 1 ]; then echo "Invalid TVPassport output - no descriptions"; exit 1; fi

      - name: Apply custom logos to TVPassport guide
        run: |
          if [ -f scripts/apply-custom-logos.cjs ]; then
            node scripts/apply-custom-logos.cjs guides/TVPassport.xml
          else
            echo "No custom logo script found; skipping"
          fi

      - name: Commit and push TVPassport guide safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/TVPassport.xml guides/.tvmaze-tvpassport-cache.json
          if git diff --cached --quiet; then
            echo "No TVPassport guide changes to commit"
            exit 0
          fi
          git commit -m "Update TVPassport guide"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed, retrying after rebase..."
            sleep 5
          done
          echo "Push failed after retries"
          exit 1
