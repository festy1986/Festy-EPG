name: Quarantine Network Test Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-list:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create quarantined test channel list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("guides/tvguide.xml")
          out = Path("guides/quarantine-network-test.xml")

          raw = source.read_text(encoding="utf-8", errors="ignore")

          wanted = ["HBO", "SHOWTIME", "SHO", "CNN", "FX", "FXX", "MTV"]

          channel_re = re.compile(
              r'<channel\s+site="tvguide\.com"\s+lang="en"\s+xmltv_id="([^"]+)"\s+site_id="([^"]+)">([^<]+)</channel>'
          )

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              "<channels>",
          ]

          counters = {}
          seen = set()

          for xmltv_id, site_id, name in channel_re.findall(raw):
              haystack = f"{xmltv_id} {name}".upper()

              if not any(x in haystack for x in wanted):
                  continue

              key = (xmltv_id, site_id)
              if key in seen:
                  continue
              seen.add(key)

              family = re.sub(r"[^A-Z0-9]+", ".", name.upper()).strip(".")
              if not family:
                  family = re.sub(r"[^A-Z0-9]+", ".", xmltv_id.upper()).strip(".")

              counters[family] = counters.get(family, 0) + 1
              number = counters[family]

              test_id = f"QT.{family}.{number}.us"
              display = f"QT {name} {number}"

              lines.append(
                  f'  <channel site="tvguide.com" lang="en" xmltv_id="{test_id}" site_id="{site_id}">{display}</channel>'
              )

          lines.append("</channels>")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print(f"Wrote {out}")
          print(f"Candidate count: {len(lines) - 3}")
          PY

      - name: Commit quarantined guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/quarantine-network-test.xml
          git commit -m "Add quarantined network test guide" || exit 0
          git push
