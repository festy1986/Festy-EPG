name: Build 24/7 Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build XMLTV Guide
      run: |

        python3 <<'PY'

        import json
        import gzip
        import os
        import re
        import xml.etree.ElementTree as ET
        from datetime import datetime, timedelta, timezone


        CHANNELS = "xtream-epg/channels.json"
        MAP = "xtream-epg/channel-map.txt"

        OUTPUT = "guides/24-7.xml.gz"
        LIST = "guides/24-7-channel-list.txt"


        os.makedirs("guides", exist_ok=True)


        with open(CHANNELS, "r", encoding="utf-8") as f:
            channels = json.load(f)



        categories = {}

        if os.path.exists(MAP):

            with open(
                MAP,
                "r",
                encoding="utf-8",
                errors="ignore"
            ) as f:

                for line in f:

                    parts = [
                        x.strip()
                        for x in line.split("|")
                    ]

                    if len(parts) >= 2:
                        categories[parts[0]] = parts[1]



        def clean_name(name):

            if not name:
                return "UNKNOWN"

            name = str(name).strip()


            if name in [
                "",
                "/",
                "-"
            ]:
                return "UNKNOWN"


            name = re.sub(
                r'^(US|UK|CA|GB)\s*:\s*',
                '',
                name,
                flags=re.I
            )


            name = re.sub(
                r'[#♬]+',
                '',
                name
            )


            remove_words = [

                "24/7",
                "RAW",
                "LIVE",
                "EXCLUSIVE",
                "60FPS",
                "60 FPS",
                "4K",
                "8K",
                "HD",
                "FHD",
                "UHD"

            ]


            for word in remove_words:

                name = re.sub(
                    r'\b' + re.escape(word) + r'\b',
                    '',
                    name,
                    flags=re.I
                )


            name = re.sub(
                r'\s+',
                ' ',
                name
            ).strip(" -_# ")


            if not name:
                return "UNKNOWN"


            return name



        def is_sports(cid):

            category = categories.get(
                str(cid),
                ""
            ).lower()


            return any(
                word in category
                for word in [
                    "sport",
                    "ppv",
                    "event"
                ]
            )



        tv = ET.Element(
            "tv",
            {
                "generator-info-name":
                "Festy 24/7 XMLTV"
            }
        )


        now = datetime.now(
            timezone.utc
        ).replace(
            minute=0,
            second=0,
            microsecond=0
        )


        channel_list = []



        with open(
            LIST,
            "w",
            encoding="utf-8"
        ) as listing:


            for ch in channels:

                cid = str(
                    ch.get(
                        "stream_id",
                        ""
                    )
                )


                if not cid:
                    continue


                raw_name = ch.get(
                    "name",
                    "UNKNOWN"
                )


                display_name = clean_name(
                    raw_name
                )


                channel_list.append(
                    (
                        cid,
                        raw_name,
                        display_name
                    )
                )


                listing.write(
                    f"{cid} | {raw_name} | {display_name}\n"
                )



        #
        # CHANNELS FIRST
        #

        for cid, raw_name, display_name in channel_list:


            channel = ET.SubElement(
                tv,
                "channel",
                {
                    "id": cid
                }
            )


            ET.SubElement(
                channel,
                "display-name"
            ).text = display_name



        #
        # PROGRAMMES SECOND
        #

        for cid, raw_name, display_name in channel_list:


            block_hours = 2 if is_sports(cid) else 24


            for offset in range(
                0,
                24 * 7,
                block_hours
            ):


                start = now + timedelta(
                    hours=offset
                )


                stop = start + timedelta(
                    hours=block_hours
                )


                programme = ET.SubElement(
                    tv,
                    "programme",
                    {
                        "channel": cid,
                        "start":
                        start.strftime(
                            "%Y%m%d%H%M%S +0000"
                        ),
                        "stop":
                        stop.strftime(
                            "%Y%m%d%H%M%S +0000"
                        )
                    }
                )


                ET.SubElement(
                    programme,
                    "title"
                ).text = display_name



        tree = ET.ElementTree(tv)

        ET.indent(tree)


        xml_file = "24-7.xml"


        tree.write(
            xml_file,
            encoding="utf-8",
            xml_declaration=True
        )


        with open(
            xml_file,
            "rb"
        ) as source:

            with gzip.open(
                OUTPUT,
                "wb"
            ) as target:

                target.write(
                    source.read()
                )


        print(
            f"Created {len(channel_list)} channels"
        )

        print(
            OUTPUT
        )

        PY



    - name: Validate XMLTV
      run: |

        gunzip -c guides/24-7.xml.gz > /tmp/24-7.xml

        python3 - <<'PY'

        import xml.etree.ElementTree as ET

        ET.parse("/tmp/24-7.xml")

        print("XMLTV VALID")

        PY



    - name: Commit Guide

      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"


        git add guides/24-7.xml.gz guides/24-7-channel-list.txt


        git commit -m "Update 24/7 XMLTV guide" || exit 0


        git push
