name: Build 24/7 Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build XMLTV Guide
      run: |

        python3 <<'PY'

        import json
        import gzip
        import os
        import re
        import xml.etree.ElementTree as ET
        from datetime import datetime, timedelta, timezone


        CHANNELS = "xtream-epg/channels.json"

        OUTPUT = "guides/24-7.xml.gz"
        LIST = "guides/24-7-channel-list.txt"


        os.makedirs("guides", exist_ok=True)


        with open(CHANNELS, "r", encoding="utf-8") as f:
            channels = json.load(f)



        def clean_name(name):

            if not name:
                return "UNKNOWN"


            name = str(name).strip()


            if name in ["", "-", "/"]:
                return "UNKNOWN"


            # Remove only stream quality/junk tags
            junk = [
                "24/7",
                "RAW",
                "LIVE",
                "HD",
                "FHD",
                "UHD",
                "4K",
                "8K"
            ]


            for item in junk:

                name = re.sub(
                    r"\b" + re.escape(item) + r"\b",
                    "",
                    name,
                    flags=re.I
                )


            name = re.sub(
                r"\s+",
                " ",
                name
            ).strip(" -_ ")


            return name if name else "UNKNOWN"




        tv = ET.Element(
            "tv",
            {
                "generator-info-name":
                "Festy 24/7 XMLTV"
            }
        )


        now = datetime.now(
            timezone.utc
        ).replace(
            minute=0,
            second=0,
            microsecond=0
        )


        channel_list = []


        with open(
            LIST,
            "w",
            encoding="utf-8"
        ) as listing:


            for ch in channels:


                cid = str(
                    ch.get(
                        "stream_id",
                        ""
                    )
                )


                if not cid:
                    continue


                # ONLY use channel name
                raw_name = ch.get(
                    "name",
                    "UNKNOWN"
                )


                display = clean_name(
                    raw_name
                )


                channel_list.append(
                    (
                        cid,
                        display
                    )
                )


                listing.write(
                    f"{cid} | {display}\n"
                )




        # CHANNELS

        for cid, display in channel_list:


            channel = ET.SubElement(
                tv,
                "channel",
                {
                    "id": cid
                }
            )


            ET.SubElement(
                channel,
                "display-name"
            ).text = display




        # PROGRAMMES

        for cid, display in channel_list:


            for offset in range(
                0,
                24 * 7,
                24
            ):


                start = now + timedelta(
                    hours=offset
                )


                stop = start + timedelta(
                    hours=24
                )


                programme = ET.SubElement(
                    tv,
                    "programme",
                    {
                        "channel": cid,
                        "start":
                            start.strftime(
                                "%Y%m%d%H%M%S +0000"
                            ),
                        "stop":
                            stop.strftime(
                                "%Y%m%d%H%M%S +0000"
                            )
                    }
                )


                ET.SubElement(
                    programme,
                    "title"
                ).text = display



        tree = ET.ElementTree(tv)

        ET.indent(tree)


        xml_file = "24-7.xml"


        tree.write(
            xml_file,
            encoding="utf-8",
            xml_declaration=True
        )



        with open(
            xml_file,
            "rb"
        ) as source:

            with gzip.open(
                OUTPUT,
                "wb"
            ) as target:

                target.write(
                    source.read()
                )



        print(
            f"Created {len(channel_list)} channels"
        )

        print(
            OUTPUT
        )


        PY



    - name: Validate XMLTV
      run: |

        gunzip -c guides/24-7.xml.gz > /tmp/24-7.xml

        python3 - <<'PY'

        import xml.etree.ElementTree as ET

        ET.parse("/tmp/24-7.xml")

        print("XMLTV VALID")

        PY



    - name: Commit Guide

      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"


        git add guides/24-7.xml.gz guides/24-7-channel-list.txt


        git commit -m "Update 24/7 XMLTV guide" || exit 0


        git push
