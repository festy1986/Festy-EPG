name: Build 24/7 Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build XMLTV Guide
      run: |

        python3 <<'PY'

        import json
        import gzip
        import os
        import re
        import xml.etree.ElementTree as ET
        from datetime import datetime, timedelta, timezone


        CHANNELS = "xtream-epg/channels.json"

        OUTPUT = "guides/24-7.xml.gz"
        LIST = "guides/24-7-channel-list.txt"


        os.makedirs("guides", exist_ok=True)



        with open(CHANNELS,"r",encoding="utf-8") as f:
            channels=json.load(f)



        def clean_name(name):

            if not name:
                return "UNKNOWN"


            name=str(name).strip()


            remove=[
                "24/7",
                "RAW",
                "LIVE",
                "EXCLUSIVE",
                "60FPS",
                "4K",
                "8K",
                "HD",
                "FHD",
                "UHD"
            ]


            for word in remove:

                name=re.sub(
                    r"\b"+re.escape(word)+r"\b",
                    "",
                    name,
                    flags=re.I
                )


            name=re.sub(
                r"\s+",
                " ",
                name
            ).strip(" -_")



            return name or "UNKNOWN"




        #
        # XMLTV ID CREATOR
        #
        # Example:
        # A&E -> AANDE.us
        # AMC HD -> AMC.us
        #
        def make_id(name):

            name=clean_name(name)

            name=name.upper()

            name=name.replace("&","AND")

            name=re.sub(
                r"[^A-Z0-9]+",
                ".",
                name
            )

            name=name.strip(".")


            return name + ".us"




        #
        # BUILD CHANNEL LIST
        #

        used=set()

        channel_list=[]


        for ch in channels:


            name=clean_name(
                ch.get(
                    "name",
                    ""
                )
            )


            if not name:
                continue



            cid=make_id(name)



            #
            # prevent duplicate IDs
            #
            base=cid
            count=2


            while cid in used:

                cid=f"{base}.{count}"

                count+=1



            used.add(cid)



            channel_list.append(
                (
                    cid,
                    name
                )
            )





        tv=ET.Element(
            "tv",
            {
                "date":
                datetime.now().strftime("%Y%m%d"),
                "generator-info-name":
                "Festy 24/7 XMLTV"
            }
        )



        #
        # CHANNELS
        #

        for cid,name in channel_list:


            channel=ET.SubElement(
                tv,
                "channel",
                {
                    "id":cid
                }
            )


            ET.SubElement(
                channel,
                "display-name"
            ).text=name






        #
        # PROGRAMMES
        #

        now=datetime.now(
            timezone.utc
        ).replace(
            minute=0,
            second=0,
            microsecond=0
        )



        for cid,name in channel_list:


            for offset in range(
                0,
                24*7,
                24
            ):


                start=now+timedelta(
                    hours=offset
                )


                stop=start+timedelta(
                    hours=24
                )



                programme=ET.SubElement(
                    tv,
                    "programme",
                    {
                        "channel":cid,
                        "start":
                        start.strftime(
                            "%Y%m%d%H%M%S +0000"
                        ),
                        "stop":
                        stop.strftime(
                            "%Y%m%d%H%M%S +0000"
                        )
                    }
                )


                ET.SubElement(
                    programme,
                    "title"
                ).text=name



                ET.SubElement(
                    programme,
                    "desc"
                ).text=f"{name} 24/7"



        #
        # WRITE XML
        #

        tree=ET.ElementTree(tv)

        ET.indent(tree)


        xml="24-7.xml"


        tree.write(
            xml,
            encoding="utf-8",
            xml_declaration=True
        )



        with open(xml,"rb") as src:

            with gzip.open(
                OUTPUT,
                "wb"
            ) as dst:

                dst.write(
                    src.read()
                )




        with open(
            LIST,
            "w",
            encoding="utf-8"
        ) as f:

            for cid,name in channel_list:

                f.write(
                    f"{cid} | {name}\n"
                )



        print(
            f"Created {len(channel_list)} channels"
        )


        PY



    - name: Validate XMLTV
      run: |

        gunzip -c guides/24-7.xml.gz > /tmp/24-7.xml

        python3 - <<'PY'

        import xml.etree.ElementTree as ET

        ET.parse("/tmp/24-7.xml")

        print("XMLTV VALID")

        PY



    - name: Commit Guide

      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        git add guides/24-7.xml.gz guides/24-7-channel-list.txt

        git commit -m "Update 24/7 XMLTV guide" || exit 0

        git push
