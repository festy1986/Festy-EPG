name: Build 24/7 Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build XMLTV
      run: |

        python3 <<'PY'

        import json
        import gzip
        import os
        import re
        import xml.etree.ElementTree as ET
        from datetime import datetime, timedelta


        CHANNELS = "xtream-epg/channels.json"
        MAP = "xtream-epg/channel-map.txt"

        OUTPUT = "guides/24-7.xml.gz"
        LIST = "guides/24-7-channel-list.txt"


        os.makedirs(
            "guides",
            exist_ok=True
        )


        with open(CHANNELS,"r",encoding="utf-8") as f:
            channels=json.load(f)


        #
        # Load category information
        #

        categories={}

        if os.path.exists(MAP):

            with open(
                MAP,
                "r",
                encoding="utf-8",
                errors="ignore"
            ) as f:

                for line in f:

                    parts=[
                        x.strip()
                        for x in line.split("|")
                    ]

                    if len(parts)>=4:

                        cid=parts[0]

                        categories[cid]=parts[1]



        def clean_name(name):

            name=re.sub(
                r'^(US|CA|UK|GB):\s*',
                '',
                name,
                flags=re.I
            )

            remove=[
                "4K",
                "8K",
                "HD",
                "FHD",
                "UHD",
                "RAW",
                "LIVE",
                "EXCLUSIVE"
            ]

            for word in remove:

                name=re.sub(
                    r'\b'+word+r'\b',
                    '',
                    name,
                    flags=re.I
                )


            name=re.sub(
                r'\s+',
                ' ',
                name
            )


            return name.strip(" #-")



        def is_sports(cid):

            cat=categories.get(cid,"").lower()

            if any(
                x in cat
                for x in [
                    "sport",
                    "ppv",
                    "event"
                ]
            ):
                return True

            return False



        tv=ET.Element(
            "tv",
            {
                "generator-info-name":
                "Festy 24/7 Guide"
            }
        )


        now=datetime.utcnow()


        created=0


        with open(
            LIST,
            "w",
            encoding="utf-8"
        ) as out:


            for ch in channels:


                cid=str(
                    ch.get("stream_id")
                )


                if not cid:
                    continue


                raw=ch.get(
                    "name",
                    "Unknown Channel"
                )


                name=clean_name(raw)



                #
                # channel entry
                #

                channel=ET.SubElement(
                    tv,
                    "channel",
                    {
                        "id":cid
                    }
                )


                ET.SubElement(
                    channel,
                    "display-name"
                ).text=raw



                out.write(
                    f"{cid} | {raw}\n"
                )



                sports=is_sports(cid)


                days=7


                if sports:

                    block=2

                else:

                    block=24



                total_hours=days*24


                for hour in range(
                    0,
                    total_hours,
                    block
                ):


                    start=now+timedelta(
                        hours=hour
                    )

                    end=start+timedelta(
                        hours=block
                    )


                    programme=ET.SubElement(
                        tv,
                        "programme",
                        {
                            "start":
                            start.strftime(
                                "%Y%m%d%H%M%S +0000"
                            ),

                            "stop":
                            end.strftime(
                                "%Y%m%d%H%M%S +0000"
                            ),

                            "channel":
                            cid
                        }
                    )


                    ET.SubElement(
                        programme,
                        "title"
                    ).text=name



                created+=1



        tree=ET.ElementTree(tv)

        ET.indent(tree)


        temp="guide.xml"


        tree.write(
            temp,
            encoding="utf-8",
            xml_declaration=True
        )


        with open(
            temp,
            "rb"
        ) as src:

            with gzip.open(
                OUTPUT,
                "wb"
            ) as dst:

                dst.write(
                    src.read()
                )



        print(
            "Created channels:",
            created
        )

        print(
            OUTPUT
        )

        PY



    - name: Commit Guide

      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"


        git add guides/24-7.xml.gz guides/24-7-channel-list.txt


        git commit -m "Update 24/7 guide" || exit 0


        git push
