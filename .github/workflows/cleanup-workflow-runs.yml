name: Clean Workflow Run History

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow run history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          current_run_id = str(os.environ["CURRENT_RUN_ID"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "festy-epg-workflow-run-cleanup",
          }

          def api(method, url):
              request = urllib.request.Request(
                  url,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read().decode("utf-8")
                      return response.status, body
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  return error.code, body

          print(f"Repository: {repo}")
          print(f"Current cleanup run: {current_run_id}")
          print()
          print("This deletes GitHub Actions RUN HISTORY only.")
          print("It does NOT delete workflow YAML files or repository contents.")
          print()

          total_deleted = 0
          total_failed = 0

          while True:
              status, body = api(
                  "GET",
                  f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page=1",
              )

              if status != 200:
                  raise SystemExit(
                      f"Could not list workflow runs. HTTP {status}\n{body}"
                  )

              data = json.loads(body)
              runs = data.get("workflow_runs", [])

              targets = [
                  run for run in runs
                  if str(run.get("id")) != current_run_id
              ]

              if not targets:
                  break

              deleted_this_pass = 0

              for run in targets:
                  run_id = str(run.get("id"))
                  name = run.get("name", "")
                  run_status = run.get("status", "")
                  conclusion = run.get("conclusion") or ""

                  print(
                      f"Deleting: {run_id} | {name} | "
                      f"{run_status} | {conclusion}"
                  )

                  delete_status, delete_body = api(
                      "DELETE",
                      f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  )

                  if delete_status == 204:
                      print(f"Deleted: {run_id}")
                      deleted_this_pass += 1
                      total_deleted += 1
                  else:
                      print(
                          f"Could not delete: {run_id} | "
                          f"HTTP {delete_status}"
                      )

                      if delete_body:
                          print(delete_body)

                      total_failed += 1

              if deleted_this_pass == 0:
                  print()
                  print(
                      "No additional runs could be deleted. "
                      "Stopping to avoid an endless loop."
                  )
                  break

          print()
          print("Cleanup finished.")
          print(f"Runs deleted: {total_deleted}")
          print(f"Delete attempts that failed: {total_failed}")
          print(
              "The current cleanup run remains visible because "
              "it cannot delete itself while it is executing."
          )
          PY
