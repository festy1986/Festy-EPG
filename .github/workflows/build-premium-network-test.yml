name: Build Premium Network Test Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build candidate channel list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("guides/tvguide.xml")
          out = Path("guides/network-test.xml")

          raw = source.read_text(encoding="utf-8", errors="ignore")

          wanted_terms = [
              "HBO",
              "SHOWTIME",
              "SHO",
              "CNN",
              "FX",
              "FXX",
              "MTV",
          ]

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              "<channels>",
          ]

          seen = set()
          counters = {}

          channel_re = re.compile(
              r'<channel\s+site="tvguide\.com"\s+lang="en"\s+xmltv_id="([^"]+)"\s+site_id="([^"]+)">([^<]+)</channel>'
          )

          for xmltv_id, site_id, display in channel_re.findall(raw):
              haystack = f"{xmltv_id} {display}".upper()

              if not any(term in haystack for term in wanted_terms):
                  continue

              key = (xmltv_id, site_id)
              if key in seen:
                  continue
              seen.add(key)

              family = display.upper()
              family = re.sub(r"[^A-Z0-9]+", ".", family).strip(".")
              if not family:
                  family = re.sub(r"[^A-Z0-9]+", ".", xmltv_id.upper()).strip(".")

              counters[family] = counters.get(family, 0) + 1
              n = counters[family]

              test_id = f"TEST.{family}.{n}.us"
              test_name = f"TEST {display} {n}"

              lines.append(
                  f'  <channel site="tvguide.com" lang="en" xmltv_id="{test_id}" site_id="{site_id}">{test_name}</channel>'
              )

          lines.append("</channels>")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print(f"Wrote {out}")
          print(f"Total candidates: {len(lines) - 3}")
          PY

      - name: Show candidate list
        run: cat guides/network-test.xml

      - name: Commit candidate list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/network-test.xml
          git commit -m "Add network candidate test guide" || exit 0
          git push
