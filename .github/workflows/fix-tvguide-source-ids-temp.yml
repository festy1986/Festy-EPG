name: TEMP-Fix-TVGuide-Source-IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-source-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix HBO HBO Movies History IDs in source guide only
        run: |
          node <<'EOF'
          const fs = require('fs')

          const file = 'guides/tvguidetivimate.xml'

          let xml = fs.readFileSync(file, 'utf8')

          const fixes = [
            {
              id: 'HBO.us',
              site_id: '9100002976#9200008780'
            },
            {
              id: 'HBO.MOVIES.us',
              site_id: '9100002976#9233009491'
            },
            {
              id: 'HIST.us',
              site_id: '9100002976#9233008002'
            }
          ]

          for (const fix of fixes) {
            const re = new RegExp(
              `<channel([^>]*\\bid="${fix.id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}"[^>]*)>`,
              'i'
            )

            xml = xml.replace(re, match => {
              if (/site_id="/i.test(match)) {
                return match.replace(/site_id="[^"]*"/i, `site_id="${fix.site_id}"`)
              }

              return match.replace('<channel', `<channel site_id="${fix.site_id}"`)
            })
          }

          fs.writeFileSync(file, xml)

          console.log('Updated source IDs:')
          for (const fix of fixes) {
            const check = xml.match(new RegExp(`<channel[^>]*id="${fix.id}"[^>]*>`, 'i'))
            console.log(check ? check[0] : `MISSING ${fix.id}`)
          }
          EOF

      - name: Commit source guide fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/tvguidetivimate.xml

          if git diff --cached --quiet; then
            echo "No source guide changes to commit"
            exit 0
          fi

          git commit -m "Fix TVGuide source IDs for HBO and History"
          git push origin HEAD:main
