name: IPTV Org Full Guide Inspection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptvorg-full-inspection
  cancel-in-progress: false

jobs:
  download-full-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete IPTV-org guide
        shell: bash
        run: |
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            "https://iptv-epg.org/files/epg-us.xml.gz" \
            -o "guides/iptvorg-inspection.xml.gz"

          test -s "guides/iptvorg-inspection.xml.gz"

          echo "Complete IPTV-org guide downloaded"

          ls -lh "guides/iptvorg-inspection.xml.gz"

      - name: Verify compressed guide
        shell: bash
        run: |
          gzip -t \
            "guides/iptvorg-inspection.xml.gz"

          echo "GZIP validation passed"

      - name: Inspect guide counts without creating an uncompressed file
        shell: bash
        run: |
          CHANNELS=$(gzip -dc \
            "guides/iptvorg-inspection.xml.gz" |
            grep -c '<channel ' || true)

          PROGRAMMES=$(gzip -dc \
            "guides/iptvorg-inspection.xml.gz" |
            grep -c '<programme ' || true)

          echo "IPTV-org channels: $CHANNELS"
          echo "IPTV-org programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "IPTV-org guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "IPTV-org guide contains no programmes"
            exit 1
          fi

      - name: Confirm only compressed guide is staged
        shell: bash
        run: |
          git add \
            "guides/iptvorg-inspection.xml.gz"

          git status --short

          if git diff --cached --name-only | grep -q \
            "guides/iptvorg.xml"; then
            echo "ERROR: Old uncompressed IPTV-org guide detected"
            exit 1
          fi

      - name: Commit complete IPTV-org guide
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No IPTV-org guide changes to commit"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git commit \
            -m "Add complete IPTV-org guide for inspection"

      - name: Push complete IPTV-org guide
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Synchronizing with remote before retry..."

            git fetch origin main

            git rebase origin/main

            echo "Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
