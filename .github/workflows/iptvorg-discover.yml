name: IPTV Org Guide Inspection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptvorg-inspection
  cancel-in-progress: false

jobs:
  inspect-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPTV-org EPG source
        shell: bash
        run: |
          mkdir -p /tmp/iptvorg

          curl -L --fail --retry 5 --retry-delay 10 \
            "https://iptv-epg.org/files/epg-us.xml.gz" \
            -o "/tmp/iptvorg/source.xml.gz"

          test -s "/tmp/iptvorg/source.xml.gz"

          echo "IPTV-org EPG source downloaded successfully"

          ls -lh "/tmp/iptvorg/source.xml.gz"

      - name: Create inspection channel list
        shell: bash
        run: |
          mkdir -p guides

          head -n 10 \
            "guides/iptvorg-channels.txt" \
            > "guides/iptvorg-inspect-channels.txt"

          test -s "guides/iptvorg-inspect-channels.txt"

          echo "Channels selected for inspection:"
          cat "guides/iptvorg-inspect-channels.txt"

      - name: Extract selected IPTV-org channels
        shell: bash
        run: |
          gzip -dc \
            "/tmp/iptvorg/source.xml.gz" |
          awk '
            BEGIN {
              while (
                (getline line <
                "guides/iptvorg-inspect-channels.txt") > 0
              ) {
                split(line, parts, " | ")
                wanted[parts[1]] = 1
              }

              close(
                "guides/iptvorg-inspect-channels.txt"
              )

              in_channel = 0
              in_programme = 0
              keep_channel = 0
              keep_programme = 0
              buffer = ""
            }

            /<channel[[:space:]]/ {
              in_channel = 1
              keep_channel = 0
              channel_id = ""
              buffer = $0 "\n"

              if (match($0, /id="[^"]+"/)) {
                channel_id = substr(
                  $0,
                  RSTART + 4,
                  RLENGTH - 5
                )

                if (channel_id in wanted) {
                  keep_channel = 1
                }
              }

              next
            }

            in_channel {
              buffer = buffer $0 "\n"

              if (/<\/channel>/) {
                if (keep_channel) {
                  channels = channels buffer
                }

                in_channel = 0
                buffer = ""
              }

              next
            }

            /<programme[[:space:]]/ {
              in_programme = 1
              keep_programme = 0
              buffer = $0 "\n"

              if (match($0, /channel="[^"]+"/)) {
                programme_channel = substr(
                  $0,
                  RSTART + 9,
                  RLENGTH - 10
                )

                if (programme_channel in wanted) {
                  keep_programme = 1
                }
              }

              next
            }

            in_programme {
              buffer = buffer $0 "\n"

              if (/<\/programme>/) {
                if (keep_programme) {
                  programmes = programmes buffer
                }

                in_programme = 0
                buffer = ""
              }

              next
            }

            END {
              print "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
              print "<tv>"

              printf "%s", channels
              printf "%s", programmes

              print "</tv>"
            }
          ' > "guides/iptvorg-inspection.xml"

          test -s "guides/iptvorg-inspection.xml"

          echo "Inspection guide created:"
          ls -lh "guides/iptvorg-inspection.xml"

      - name: Validate IPTV-org inspection guide
        shell: bash
        run: |
          CHANNELS=$(grep -c \
            '<channel ' \
            "guides/iptvorg-inspection.xml" || true)

          PROGRAMMES=$(grep -c \
            '<programme ' \
            "guides/iptvorg-inspection.xml" || true)

          echo "Inspection channels: $CHANNELS"
          echo "Inspection programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Inspection guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Inspection guide contains no programmes"
            exit 1
          fi

      - name: Commit IPTV-org inspection guide
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            "guides/iptvorg-inspection.xml" \
            "guides/iptvorg-inspect-channels.txt"

          if git diff --cached --quiet; then
            echo "No IPTV-org inspection changes to commit"
            exit 0
          fi

          git commit \
            -m "Update IPTV-org inspection guide"

      - name: Push IPTV-org inspection guide
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Synchronizing with remote before retry..."

            git fetch origin main

            git rebase origin/main

            echo "Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
