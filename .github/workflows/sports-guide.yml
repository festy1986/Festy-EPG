name: Sports Guide

on:
  workflow_dispatch:

  schedule:
    - cron: '45 0 * * *'
    - cron: '45 4 * * *'
    - cron: '45 8 * * *'
    - cron: '45 12 * * *'
    - cron: '45 16 * * *'
    - cron: '45 20 * * *'

permissions:
  contents: write

concurrency:
  group: festy-epg-build-queue
  cancel-in-progress: false

jobs:
  sports-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL is missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME is missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD is missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"

      - name: Install Python dependencies
        run: |
          python -m pip install requests

      - name: Test Xtream provider
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/test_xtream.py

      - name: Test provider EPG
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/test_epg.py

      - name: Generate sports guide
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/generate_sports.py

      - name: Commit and push sports guide
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add guides/sports.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update sports guide"

          git push
