name: Sports Guide

on:
  workflow_dispatch:

  schedule:
    - cron: '45 0 * * *'
    - cron: '45 4 * * *'
    - cron: '45 8 * * *'
    - cron: '45 12 * * *'
    - cron: '45 16 * * *'
    - cron: '45 20 * * *'


permissions:
  contents: write


concurrency:
  group: festy-epg-build-queue
  cancel-in-progress: false


jobs:

  sports-guide:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"


          if [ -z "$XTREAM_URL" ]; then

            echo "XTREAM_URL is missing"

            exit 1

          fi


          if [ -z "$XTREAM_USERNAME" ]; then

            echo "XTREAM_USERNAME is missing"

            exit 1

          fi


          if [ -z "$XTREAM_PASSWORD" ]; then

            echo "XTREAM_PASSWORD is missing"

            exit 1

          fi


          echo "XTREAM_URL exists"

          echo "XTREAM_USERNAME exists"

          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Generate sports guide

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          cat > /tmp/generate_sports.py <<'PYTHON'

          import os
          import re
          import html
          import time
          import requests
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from difflib import SequenceMatcher


          CHANNEL_FILE = "config/sports_channels.txt"

          OUTPUT_FILE = "guides/sports.xml"

          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          EASTERN_ZONE = ZoneInfo(
              "America/New_York"
          )


          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://",
                  1
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          os.makedirs(
              "guides",
              exist_ok=True
          )


          session = requests.Session()


          session.headers.update(
              {
                  "User-Agent":
                  "Mozilla/5.0"
              }
          )


          def clean_text(
              text
          ):

              if not text:

                  return ""


              text = html.unescape(
                  str(text)
              )


              text = re.sub(
                  r"<[^>]+>",
                  "",
                  text
              )


              text = text.replace(
                  "\n",
                  " "
              )


              text = text.replace(
                  "\r",
                  " "
              )


              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )


              return text.strip()


          def format_time(
              event_datetime
          ):

              return event_datetime.strftime(
                  "%-I:%M %p"
              )


          def normalize_matchup(
              text
          ):

              if not text:

                  return ""


              text = clean_text(
                  text
              )


              text = re.sub(
                  r"\s+[xX]\s+",
                  " vs. ",
                  text
              )


              text = re.sub(
                  r"\s+@\s+",
                  " vs. ",
                  text
              )


              text = re.sub(
                  r"\s+\bv\b\s+",
                  " vs. ",
                  text,
                  flags=re.IGNORECASE
              )


              text = re.sub(
                  r"\s+vs\s*\.?\s+",
                  " vs. ",
                  text,
                  flags=re.IGNORECASE
              )


              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )


              return text.strip(
                  " -|:;"
              )


          def clean_channel_name(
              name
          ):

              name = clean_text(
                  name
              )


              def convert_time(
                  match
              ):

                  hour = int(
                      match.group(1)
                  )


                  minute = int(
                      match.group(2)
                  )


                  suffix = (

                      "AM"

                      if hour < 12

                      else "PM"

                  )


                  display_hour = hour % 12


                  if display_hour == 0:

                      display_hour = 12


                  return (

                      f"{display_hour}:"

                      f"{minute:02d} "

                      f"{suffix}"

                  )


              name = re.sub(

                  r"\b([01]?\d|2[0-3]):([0-5]\d)\b",

                  convert_time,

                  name

              )


              name = re.sub(

                  r"\s+[xX]\s+",

                  " vs. ",

                  name

              )


              name = re.sub(

                  r"\s+@\s+",

                  " vs. ",

                  name

              )


              name = re.sub(

                  r"\s+vs\s*\.?\s+",

                  " vs. ",

                  name,

                  flags=re.IGNORECASE

              )


              name = re.sub(

                  r"\s*\|\s*",

                  " | ",

                  name

              )


              name = re.sub(

                  r"\s*;\s*",

                  " ; ",

                  name

              )


              name = re.sub(

                  r"\s+",

                  " ",

                  name

              )


              return name.strip(

                  " -|:;"

              )


          def remove_event_metadata(
              text
          ):

              if not text:

                  return ""


              text = clean_text(
                  text
              )


              text = re.split(

                  r"\bStart\s*:",

                  text,

                  maxsplit=1,

                  flags=re.IGNORECASE

              )[0]


              text = re.split(

                  r"\bStop\s*:",

                  text,

                  maxsplit=1,

                  flags=re.IGNORECASE

              )[0]


              text = re.sub(

                  r"\s*\|\s*$",

                  "",

                  text

              )


              text = re.sub(

                  r"\s*;\s*$",

                  "",

                  text

              )


              return normalize_matchup(
                  text
              )


          def extract_start_datetime(
              text
          ):

              if not text:

                  return None


              text = clean_text(
                  text
              )


              patterns = [

                  r"Start\s*:\s*"

                  r"(\d{4}-\d{2}-\d{2})"

                  r"\s+"

                  r"(\d{2}:\d{2}(?::\d{2})?)",


                  r"start\s*=\s*"

                  r"(\d{4}-\d{2}-\d{2})"

                  r"\s+"

                  r"(\d{2}:\d{2}(?::\d{2})?)",


                  r"(\d{4}-\d{2}-\d{2})"

                  r"\s+"

                  r"(\d{2}:\d{2}:\d{2})"

              ]


              for pattern in patterns:


                  match = re.search(

                      pattern,

                      text,

                      flags=re.IGNORECASE

                  )


                  if not match:

                      continue


                  date_part = match.group(
                      1
                  )


                  time_part = match.group(
                      2
                  )


                  if len(time_part) == 5:

                      time_part += ":00"


                  try:

                      return datetime.strptime(

                          f"{date_part} "

                          f"{time_part}",

                          "%Y-%m-%d %H:%M:%S"

                      )


                  except ValueError:

                      continue


              return None


          def get_server_timezone():

              url = (

                  f"{XTREAM_URL}/player_api.php"

                  f"?username={USERNAME}"

                  f"&password={PASSWORD}"

              )


              response = session.get(

                  url,

                  timeout=60

              )


              response.raise_for_status()


              data = response.json()


              timezone_name = (

                  data.get(

                      "server_info",

                      {}

                  ).get(

                      "timezone"

                  )

              )


              if not timezone_name:

                  print(

                      "Provider timezone unavailable."

                  )


                  print(

                      "Using UTC."

                  )


                  return "UTC"


              print(

                  f"Provider timezone: "

                  f"{timezone_name}"

              )


              return timezone_name


          def convert_to_eastern(

              naive_datetime,

              provider_timezone

          ):

              if not naive_datetime:

                  return None


              try:

                  source_zone = ZoneInfo(

                      provider_timezone

                  )


              except Exception:

                  source_zone = timezone.utc


              source_datetime = (

                  naive_datetime.replace(

                      tzinfo=source_zone

                  )

              )


              return (

                  source_datetime.astimezone(

                      EASTERN_ZONE

                  )

              )


          def normalize_team_name(
              text
          ):

              text = clean_text(
                  text
              ).lower()


              text = re.sub(

                  r"[^a-z0-9 ]",

                  " ",

                  text

              )


              stop_words = {

                  "live",

                  "hd",

                  "sd",

                  "fhd",

                  "uhd",

                  "4k",

                  "channel",

                  "tv",

                  "network",

                  "sports",

                  "sport",

                  "event",

                  "game",

                  "match",

                  "today",

                  "tomorrow"

              }


              words = [

                  word

                  for word in text.split()

                  if word not in stop_words

              ]


              return " ".join(
                  words
              )


          def extract_matchup(
              text
          ):

              text = clean_text(
                  text
              )


              text = re.sub(

                  r"\bStart\s*:.*$",

                  "",

                  text,

                  flags=re.IGNORECASE

              )


              text = re.sub(

                  r"\bStop\s*:.*$",

                  "",

                  text,

                  flags=re.IGNORECASE

              )


              text = re.sub(

                  r"\b\d{4}-\d{2}-\d{2}\b",

                  "",

                  text

              )


              text = re.sub(

                  r"\b\d{1,2}:\d{2}"

                  r"(?::\d{2})?"

                  r"\s*(AM|PM)?\b",

                  "",

                  text,

                  flags=re.IGNORECASE

              )


              return normalize_matchup(
                  text
              )


          def matchup_parts(
              text
          ):

              text = extract_matchup(
                  text
              )


              parts = re.split(

                  r"\s+vs\.\s+",

                  text,

                  flags=re.IGNORECASE

              )


              if len(parts) != 2:

                  return []


              return [

                  normalize_team_name(

                      parts[0]

                  ),

                  normalize_team_name(

                      parts[1]

                  )

              ]


          def team_matches(

              wanted_team,

              actual_team

          ):

              wanted_team = normalize_team_name(

                  wanted_team

              )


              actual_team = normalize_team_name(

                  actual_team

              )


              if not wanted_team or not actual_team:

                  return False


              if (

                  wanted_team in actual_team

                  or actual_team in wanted_team

              ):

                  return True


              return (

                  SequenceMatcher(

                      None,

                      wanted_team,

                      actual_team

                  ).ratio()

                  >=

                  0.72

              )


          def get_public_events(
              matchup,
              date_value
          ):

              """

              Uses TheSportsDB public event search.

              The matchup from the channel name is the

              search source. The date is used as the

              date key.

              """

              parts = matchup_parts(
                  matchup
              )


              if len(parts) != 2:

                  return []


              first = parts[0]

              second = parts[1]


              date_text = date_value.strftime(

                  "%Y-%m-%d"

              )


              searches = [

                  f"{first} vs {second}",

                  f"{second} vs {first}"

              ]


              results = []


              for search_text in searches:


                  url = (

                      "https://www.thesportsdb.com/"

                      "api/v1/json/3/"

                      "searchevents.php"

                      f"?e={requests.utils.quote(search_text)}"

                      f"&d={date_text}"

                  )


                  try:


                      response = session.get(

                          url,

                          timeout=30

                      )


                      if response.status_code != 200:

                          continue


                      data = response.json()


                      events = (

                          data.get(

                              "event",

                              []

                          )

                          or []

                      )


                      results.extend(
                          events
                      )


                  except Exception:

                      continue


              return results


          def find_verified_game(

              provider_matchup,

              preferred_date

          ):

              provider_parts = matchup_parts(

                  provider_matchup

              )


              if len(provider_parts) != 2:

                  return None


              date_values = [

                  preferred_date,

                  preferred_date - timedelta(

                      days=1

                  ),

                  preferred_date + timedelta(

                      days=1

                  )

              ]


              for date_value in date_values:


                  events = get_public_events(

                      provider_matchup,

                      date_value

                  )


                  for event in events:


                      home_team = clean_text(

                          event.get(

                              "strHomeTeam",

                              ""

                          )

                      )


                      away_team = clean_text(

                          event.get(

                              "strAwayTeam",

                              ""

                          )

                      )


                      if not home_team or not away_team:

                          continue


                      if not (

                          (

                              team_matches(

                                  provider_parts[0],

                                  home_team

                              )

                              and

                              team_matches(

                                  provider_parts[1],

                                  away_team

                              )

                          )

                          or

                          (

                              team_matches(

                                  provider_parts[0],

                                  away_team

                              )

                              and

                              team_matches(

                                  provider_parts[1],

                                  home_team

                              )

                          )

                      ):

                          continue


                      event_date_text = clean_text(

                          event.get(

                              "dateEvent",

                              ""

                          )

                      )


                      event_time_text = clean_text(

                          event.get(

                              "strTime",

                              ""

                          )

                      )


                      if not event_date_text or not event_time_text:

                          continue


                      try:

                          naive_datetime = datetime.strptime(

                              f"{event_date_text} "

                              f"{event_time_text}",

                              "%Y-%m-%d %H:%M:%S"

                          )


                      except ValueError:

                          continue


                      event_datetime = (

                          naive_datetime.replace(

                              tzinfo=timezone.utc

                          ).astimezone(

                              EASTERN_ZONE

                          )

                      )


                      return {

                          "away": away_team,

                          "home": home_team,

                          "datetime": event_datetime

                      }


              return None


          def get_day_label(

              event_datetime

          ):

              today = datetime.now(

                  EASTERN_ZONE

              ).date()


              event_date = event_datetime.date()


              if event_date == today:

                  return "Today"


              if event_date == (

                  today + timedelta(

                      days=1

                  )

              ):

                  return "Tomorrow"


              return event_datetime.strftime(

                  "%A"

              )


          def get_epg(

              stream_id

          ):

              epg_url = (

                  f"{XTREAM_URL}/player_api.php"

                  f"?username={USERNAME}"

                  f"&password={PASSWORD}"

                  f"&action=get_short_epg"

                  f"&stream_id={stream_id}"

                  f"&limit=5"

              )


              try:

                  response = session.get(

                      epg_url,

                      timeout=30

                  )


                  if response.status_code != 200:

                      return None


                  data = response.json()


                  listings = data.get(

                      "epg_listings",

                      []

                  )


                  if listings:

                      return listings[0]


              except Exception:

                  return None


              return None


          print(

              f"Loading channel source: "

              f"{CHANNEL_FILE}"

          )


          wanted = {}


          with open(

              CHANNEL_FILE,

              "r",

              encoding="utf-8"

          ) as f:


              for line in f:


                  line = line.strip()


                  if not line:

                      continue


                  parts = [

                      x.strip()

                      for x in line.split("|")

                  ]


                  if len(parts) < 2:

                      continue


                  channel_id = parts[0]


                  display_name = " ".join(

                      parts[1:]

                  )


                  wanted[channel_id] = display_name


          print(

              f"Requested channels: "

              f"{len(wanted)}"

          )


          provider_timezone = (

              get_server_timezone()

          )


          streams_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )


          streams = None


          for attempt in range(

              1,

              6

          ):


              try:


                  print(

                      "Downloading provider channels "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      streams_url,

                      timeout=(30, 600)

                  )


                  response.raise_for_status()


                  streams = response.json()


                  break


              except Exception as error:


                  print(

                      f"Download failed: {error}"

                  )


                  if attempt < 5:

                      time.sleep(10)


          if streams is None:

              raise SystemExit(

                  "Unable to download provider channels."

              )


          provider = {}


          for stream in streams:


              stream_id = str(

                  stream.get(

                      "stream_id"

                  )

              )


              provider[stream_id] = stream


          eastern_now = datetime.now(

              EASTERN_ZONE

          )


          guide_start = eastern_now.replace(

              hour=0,

              minute=0,

              second=0,

              microsecond=0

          )


          guide_end = guide_start + timedelta(

              days=1

          )


          print(

              "Preparing sports events..."

          )


          event_jobs = {}


          for channel_id, requested_name in wanted.items():


              if channel_id not in provider:

                  continue


              stream = provider[

                  channel_id

              ]


              provider_name = clean_text(

                  stream.get(

                      "name",

                      requested_name

                  )

              )


              epg = get_epg(

                  channel_id

              )


              epg_title = ""


              epg_description = ""


              if epg:


                  epg_title = clean_text(

                      epg.get(

                          "title",

                          ""

                      )

                  )


                  epg_description = clean_text(

                      epg.get(

                          "description",

                          ""

                      )

                  )


              source_text = epg_title


              if not source_text:

                  source_text = provider_name


              provider_datetime = (

                  extract_start_datetime(

                      source_text

                  )

              )


              if not provider_datetime:

                  provider_datetime = (

                      extract_start_datetime(

                          provider_name

                      )

                  )


              provider_eastern = None


              if provider_datetime:

                  provider_eastern = (

                      convert_to_eastern(

                          provider_datetime,

                          provider_timezone

                      )

                  )


              lookup_date = (

                  provider_eastern.date()

                  if provider_eastern

                  else eastern_now.date()

              )


              matchup = extract_matchup(

                  source_text

              )


              event_jobs[channel_id] = {

                  "requested_name": requested_name,

                  "provider_name": provider_name,

                  "source_text": source_text,

                  "epg_description": epg_description,

                  "lookup_date": lookup_date,

                  "matchup": matchup,

                  "provider_eastern": provider_eastern

              }


          print(

              f"Verifying "

              f"{len(event_jobs)} "

              "sports events online..."

          )


          verified_events = {}


          with ThreadPoolExecutor(

              max_workers=15

          ) as executor:


              futures = {


                  executor.submit(

                      find_verified_game,

                      job["matchup"],

                      job["lookup_date"]

                  ): channel_id


                  for channel_id, job

                  in event_jobs.items()

              }


              for future in as_completed(

                  futures

              ):


                  channel_id = futures[

                      future

                  ]


                  try:


                      verified_events[

                          channel_id

                      ] = future.result()


                  except Exception as error:


                      print(

                          f"Lookup failed for "

                          f"{channel_id}: "

                          f"{error}"

                      )


          tv = ET.Element(

              "tv",

              {

                  "generator-info-name":

                  "Festy Sports Guide"

              }

          )


          matched = 0


          for channel_id, requested_name in wanted.items():


              if channel_id not in provider:

                  continue


              matched += 1


              stream = provider[

                  channel_id

              ]


              provider_name = clean_channel_name(

                  stream.get(

                      "name",

                      requested_name

                  )

              )


              channel = ET.SubElement(

                  tv,

                  "channel",

                  {

                      "id":

                      channel_id

                  }

              )


              display = ET.SubElement(

                  channel,

                  "display-name"

              )


              display.text = provider_name


          print(

              "Creating 2-hour programme blocks..."

          )


          for channel_id, requested_name in wanted.items():


              if channel_id not in provider:

                  continue


              stream = provider[

                  channel_id

              ]


              job = event_jobs.get(

                  channel_id,

                  {}

              )


              provider_name = job.get(

                  "provider_name",

                  clean_text(

                      stream.get(

                          "name",

                          requested_name

                      )

                  )

              )


              source_text = job.get(

                  "source_text",

                  provider_name

              )


              matchup = job.get(

                  "matchup",

                  extract_matchup(

                      source_text

                  )

              )


              provider_eastern = job.get(

                  "provider_eastern"

              )


              verified = verified_events.get(

                  channel_id

              )


              if verified:


                  away = verified["away"]

                  home = verified["home"]

                  event_datetime = verified["datetime"]


                  matchup = (

                      f"{away} vs. {home}"

                  )


                  title_text = (

                      f"{matchup} "

                      f"({format_time(event_datetime)})"

                  )


                  date_text = event_datetime.strftime(

                      "%m/%d/%Y"

                  )


                  day_label = get_day_label(

                      event_datetime

                  )


                  description_text = (

                      f"{matchup} — "

                      f"{day_label}, "

                      f"{date_text}"

                  )


              else:


                  cleaned_matchup = (

                      normalize_matchup(

                          matchup

                      )

                  )


                  if not cleaned_matchup:

                      cleaned_matchup = (

                          clean_text(

                              source_text

                          )

                      )


                  event_datetime = (

                      provider_eastern

                  )


                  title_text = cleaned_matchup


                  if event_datetime:


                      title_text = (

                          f"{cleaned_matchup} "

                          f"({format_time(event_datetime)})"

                      )


                  if event_datetime:


                      date_text = event_datetime.strftime(

                          "%m/%d/%Y"

                      )


                      day_label = get_day_label(

                          event_datetime

                      )


                      description_text = (

                          f"{cleaned_matchup} — "

                          f"{day_label}, "

                          f"{date_text}"

                      )


                  else:


                      description_text = (

                          cleaned_matchup

                      )


              current_start = guide_start


              while current_start < guide_end:


                  current_stop = (

                      current_start

                      + timedelta(

                          hours=2

                      )

                  )


                  if current_stop > guide_end:

                      current_stop = guide_end


                  programme = ET.SubElement(

                      tv,

                      "programme",

                      {

                          "start":

                          current_start.strftime(

                              "%Y%m%d%H%M%S %z"

                          ),

                          "stop":

                          current_stop.strftime(

                              "%Y%m%d%H%M%S %z"

                          ),

                          "channel":

                          channel_id

                      }

                  )


                  title = ET.SubElement(

                      programme,

                      "title"

                  )


                  title.text = title_text


                  desc = ET.SubElement(

                      programme,

                      "desc"

                  )


                  desc.text = description_text


                  current_start = current_stop


          print(

              "Writing XMLTV file..."

          )


          tree = ET.ElementTree(

              tv

          )


          ET.indent(

              tree,

              space="  "

          )


          tree.write(

              OUTPUT_FILE,

              encoding="utf-8",

              xml_declaration=True

          )


          print(

              ""

          )


          print(

              "Sports guide complete."

          )


          print(

              f"Matched channels: {matched}"

          )


