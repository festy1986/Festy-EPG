name: Fix Tivimate Known Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-known-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Patch known Tivimate channels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file_path = Path("guides/tvguidetivimateguide.xml")

          text = file_path.read_text(encoding="utf-8")

          fixes = {
              "HIST.us": {
                  "site_id": "9100002976#9233008002",
                  "display": "HISTORY",
              },
              "FYIHD.us": {
                  "site_id": "9100002976#9233000161",
                  "display": "FYI",
              },
              "RETRPLEXHD.us": {
                  "site_id": "9100002976#9200006666",
                  "display": "RETROPLEX",
              },
          }

          def channel_line(xmltv_id, site_id, display):
              return f'  <channel site="tvguide.com" lang="en" xmltv_id="{xmltv_id}" site_id="{site_id}">{display}</channel>'

          for xmltv_id, data in fixes.items():
              pattern = re.compile(
                  rf'\s*<channel\s+site="tvguide\.com"\s+lang="en"\s+xmltv_id="{re.escape(xmltv_id)}"\s+site_id="[^"]+">[^<]*</channel>',
                  re.MULTILINE,
              )

              replacement = "\n" + channel_line(xmltv_id, data["site_id"], data["display"])

              if pattern.search(text):
                  text = pattern.sub(replacement, text, count=1)
              else:
                  if "</channels>" in text:
                      text = text.replace("</channels>", channel_line(xmltv_id, data["site_id"], data["display"]) + "\n</channels>")
                  elif "</tv>" in text:
                      first_programme = text.find("<programme ")
                      if first_programme != -1:
                          text = text[:first_programme] + channel_line(xmltv_id, data["site_id"], data["display"]) + "\n" + text[first_programme:]
                      else:
                          text = text.replace("</tv>", channel_line(xmltv_id, data["site_id"], data["display"]) + "\n</tv>")
                  else:
                      text = text.rstrip() + "\n" + channel_line(xmltv_id, data["site_id"], data["display"]) + "\n"

          file_path.write_text(text, encoding="utf-8")
          PY

      - name: Show diff
        run: git diff -- guides/tvguidetivimateguide.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/tvguidetivimateguide.xml
          git commit -m "Fix known Tivimate channel display names" || exit 0
          git push
