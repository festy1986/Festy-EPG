name: Match Every Channel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  match-every-channel:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then

            echo "XTREAM_URL missing"

            exit 1

          fi

          if [ -z "$XTREAM_USERNAME" ]; then

            echo "XTREAM_USERNAME missing"

            exit 1

          fi

          if [ -z "$XTREAM_PASSWORD" ]; then

            echo "XTREAM_PASSWORD missing"

            exit 1

          fi

          echo "XTREAM_URL exists"

          echo "XTREAM_USERNAME exists"

          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |

          python -m pip install requests

      - name: Generate matched provider groups
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import re
          import time
          import requests


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize Xtream URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          # ---------------------------------
          # Session
          # ---------------------------------

          session = requests.Session()


          session.headers.update(

              {

                  "User-Agent": "Mozilla/5.0"

              }

          )


          # ---------------------------------
          # Download provider categories
          # ---------------------------------

          categories_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_categories"

          )


          categories = None


          for attempt in range(1, 6):

              try:


                  print(

                      f"Downloading provider groups "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      categories_url,

                      timeout=(30, 300)

                  )


                  response.raise_for_status()


                  categories = response.json()


                  break


              except Exception as e:


                  print(e)


                  time.sleep(10)


          if categories is None:

              raise SystemExit(

                  "Provider group download failed"

              )


          if not isinstance(categories, list):

              print(

                  "Unexpected provider response:"

              )


              print(categories)


              raise SystemExit(1)


          print("")

          print(

              f"Provider groups: "

              f"{len(categories)}"

          )


          # ---------------------------------
          # Match CA / UK / US groups
          # ---------------------------------

          matched_categories = []


          for category in categories:


              category_id = str(

                  category.get(

                      "category_id",

                      ""

                  )

              ).strip()


              category_name = str(

                  category.get(

                      "category_name",

                      ""

                  )

              ).strip()


              if not category_id or not category_name:

                  continue


              name_upper = category_name.upper()


              # Match country prefixes or names

              if (

                  re.search(

                      r"(^|[^A-Z])CA([^A-Z]|$)",

                      name_upper

                  )

                  or re.search(

                      r"(^|[^A-Z])UK([^A-Z]|$)",

                      name_upper

                  )

                  or re.search(

                      r"(^|[^A-Z])US([^A-Z]|$)",

                      name_upper

                  )

                  or "CANADA" in name_upper

                  or "UNITED KINGDOM" in name_upper

                  or "UNITED STATES" in name_upper

              ):


                  matched_categories.append(

                      {

                          "category_id":

                          category_id,


                          "category_name":

                          category_name

                      }

                  )


          matched_categories.sort(

              key=lambda item:

              (

                  item["category_name"].upper(),

                  item["category_id"]

              )

          )


          # ---------------------------------
          # Write output
          # ---------------------------------

          with open(

              "matcheverychannel.txt",

              "w",

              encoding="utf-8"

          ) as file:


              file.write(

                  "MATCHED PROVIDER CHANNEL GROUPS\n"

              )


              file.write(

                  "================================\n\n"

              )


              file.write(

                  "CA / UK / US GROUPS\n"

              )


              file.write(

                  "==================\n\n"

              )


              for category in matched_categories:


                  file.write(

                      f'[{category["category_id"]}] '

                      f'{category["category_name"]}\n'

                  )


          print("")

          print(

              f"Matched CA / UK / US groups: "

              f"{len(matched_categories)}"

          )


          print("")

          print(

              "Matched groups:"

          )


          for category in matched_categories:


              print(

                  f'[{category["category_id"]}] '

                  f'{category["category_name"]}'

              )


          print("")

          print(

              "Created matcheverychannel.txt"

          )

          PY

      - name: Commit and push matched groups
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add matcheverychannel.txt

          git commit -m "Update matched provider channel groups" || echo "No changes"

          git push
