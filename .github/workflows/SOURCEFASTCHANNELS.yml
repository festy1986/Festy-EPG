name: SOURCEFASTCHANNELS

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

concurrency:
  group: sourcefastchannels
  cancel-in-progress: false

jobs:
  extract-source-fast-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Jessman FAST source
        run: |
          mkdir -p sourcefastchannels

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7dayiptv/USFast.xml \
            -o sourcefastchannels/USFast.xml

          test -s sourcefastchannels/USFast.xml

          echo "Jessman FAST source downloaded successfully"
          ls -lh sourcefastchannels/USFast.xml

      - name: Extract every source FAST channel
        run: |
          node <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath =
            'sourcefastchannels/USFast.xml'

          const outputPath =
            'SOURCEFASTCHANNELS.txt'

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function getTag(block, tag) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>([\\s\\S]*?)</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                    .replace(
                      /<[^>]+>/g,
                      ''
                    )
                    .trim()
                )
              : ''
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                attribute +
                '\\s*=\\s*"([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          async function main() {
            const input =
              fs.createReadStream(
                inputPath,
                {
                  encoding: 'utf8'
                }
              )

            const rl =
              readline.createInterface(
                {
                  input,
                  crlfDelay: Infinity
                }
              )

            const channels = []

            let insideChannel =
              false

            let channelBuffer =
              ''

            for await (
              const line of rl
            ) {
              if (
                !insideChannel
              ) {
                if (
                  line.includes(
                    '<channel '
                  )
                ) {
                  insideChannel =
                    true

                  channelBuffer =
                    line +
                    '\n'

                  if (
                    line.includes(
                      '</channel>'
                    )
                  ) {
                    insideChannel =
                      false

                    const block =
                      channelBuffer

                    const id =
                      getAttribute(
                        block,
                        'id'
                      )

                    const displayName =
                      getTag(
                        block,
                        'display-name'
                      )

                    const iconBlock =
                      block.match(
                        /<icon\b[^>]*>/i
                      )

                    const icon =
                      iconBlock
                        ? getAttribute(
                            iconBlock[0],
                            'src'
                          )
                        : ''

                    const url =
                      getTag(
                        block,
                        'url'
                      )

                    if (
                      id ||
                      displayName
                    ) {
                      channels.push(
                        {
                          id,
                          displayName,
                          icon,
                          url
                        }
                      )
                    }

                    channelBuffer =
                      ''
                  }
                }
              } else {
                channelBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  const block =
                    channelBuffer

                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayName =
                    getTag(
                      block,
                      'display-name'
                    )

                  const iconBlock =
                    block.match(
                      /<icon\b[^>]*>/i
                    )

                  const icon =
                    iconBlock
                      ? getAttribute(
                          iconBlock[0],
                          'src'
                        )
                      : ''

                  const url =
                    getTag(
                      block,
                      'url'
                    )

                  if (
                    id ||
                    displayName
                  ) {
                    channels.push(
                      {
                        id,
                        displayName,
                        icon,
                        url
                      }
                    )
                  }

                  channelBuffer =
                    ''
                }
              }
            }

            channels.sort(
              (
                a,
                b
              ) =>
                a.displayName.localeCompare(
                  b.displayName,
                  undefined,
                  {
                    sensitivity: 'base'
                  }
                )
            )

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding: 'utf8'
                }
              )

            function write(
              value
            ) {
              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  if (
                    output.write(
                      value
                    )
                  ) {
                    resolve()
                  } else {
                    output.once(
                      'drain',
                      resolve
                    )

                    output.once(
                      'error',
                      reject
                    )
                  }
                }
              )
            }

            await write(
              'SOURCE FAST CHANNELS\n'
            )

            await write(
              'Generated: ' +
              new Date().toISOString() +
              '\n'
            )

            await write(
              'Total channels: ' +
              channels.length +
              '\n'
            )

            await write(
              '\n'
            )

            for (
              const channel of channels
            ) {
              await write(
                [
                  channel.displayName ||
                    '(no display name)',
                  channel.id ||
                    '(no channel id)',
                  channel.icon ||
                    '(no icon)',
                  channel.url ||
                    '(no url)'
                ].join(
                  ' | '
                ) +
                '\n'
              )
            }

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.end(
                  resolve
                )
              }
            )

            console.log(
              'SOURCE FAST channels found: ' +
              channels.length
            )

            console.log(
              'Output: ' +
              outputPath
            )
          }

          main().catch(
            error => {
              console.error(
                error
              )

              process.exit(
                1
              )
            }
          )
          EOF

      - name: Validate SOURCEFASTCHANNELS
        run: |
          test -s SOURCEFASTCHANNELS.txt

          CHANNEL_COUNT=$(grep -c ' | ' SOURCEFASTCHANNELS.txt || true)

          echo "Channels written: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 1 ]; then
            echo "No channels were extracted"
            exit 1
          fi

      - name: Show SOURCEFASTCHANNELS preview
        run: |
          echo "First 25 channels:"
          head -n 30 SOURCEFASTCHANNELS.txt

          echo ""
          echo "File size:"
          ls -lh SOURCEFASTCHANNELS.txt

      - name: Commit SOURCEFASTCHANNELS
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add SOURCEFASTCHANNELS.txt

          if git diff --cached --quiet; then
            echo "No SOURCEFASTCHANNELS changes to commit"
            exit 0
          fi

          git commit -m "Update SOURCEFASTCHANNELS"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Fetching latest remote changes..."

            git fetch origin main

            if git rebase origin/main; then
              echo "Rebase succeeded"
            else
              echo "Rebase failed. Aborting rebase."
              git rebase --abort || true
            fi

            echo "Waiting before retry..."
            sleep 10
          done

          echo "Push failed after all retries"
          exit 1
