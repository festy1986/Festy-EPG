name: TVGuide-HBO-HISTORY-Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run TVGuide test
        run: |
          cat > test.cjs <<'EOF'
          const fs = require('fs')

          const PROVIDER = '9100002976'
          const API_KEY = 'DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc'

          const channels = [
            { name: 'HISTORY', id: 'HIST.us', source: '9233008002' },
            { name: 'HBO', id: 'HBO.us', source: '9200004886' },
            { name: 'HBO MOVIES', id: 'HBO.MOVIES.us', source: '9233009866' }
          ]

          function startOfTodayUTC() {
            const d = new Date()
            return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000)
          }

          async function fetchJson(url) {
            const res = await fetch(url, {
              headers: {
                Referer: 'https://www.tvguide.com/',
                'User-Agent': 'Mozilla/5.0'
              }
            })
            const text = await res.text()
            try {
              return JSON.parse(text)
            } catch {
              return { error: text }
            }
          }

          ;(async () => {
            const start = startOfTodayUTC()

            const results = []

            for (const ch of channels) {
              const url = `https://backend.tvguide.com/tvschedules/tvguide/${PROVIDER}/web?start=${start}&duration=1440&channelSourceIds=${ch.source}&apiKey=${API_KEY}`

              console.log('\n==============================')
              console.log(ch.name)
              console.log(url)

              const json = await fetchJson(url)

              fs.writeFileSync(`${ch.id}.json`, JSON.stringify(json, null, 2))

              const items = json?.data?.items || []
              const item = items.find(i =>
                String(i.sourceId || i.channel?.sourceId || '') === ch.source
              )

              const count = item?.programSchedules?.length || 0

              console.log(`items returned: ${items.length}`)
              console.log(`matching sourceId: ${item ? 'YES' : 'NO'}`)
              console.log(`programSchedules: ${count}`)

              results.push({
                channel: ch.name,
                items: items.length,
                match: !!item,
                schedules: count
              })
            }

            fs.writeFileSync('summary.json', JSON.stringify(results, null, 2))

            console.log('\n=== SUMMARY ===')
            console.log(results)
          })()
          EOF

          node test.cjs

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: tvguide-debug
          path: |
            *.json
