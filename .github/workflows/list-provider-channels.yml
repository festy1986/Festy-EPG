name: List Provider Channels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-provider-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |
          echo "Checking provider credentials..."

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "Provider credentials loaded successfully"

      - name: Install Python requirements
        run: |
          python -m pip install requests

      - name: Create provider channel list
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import requests
          import json
          from urllib.parse import urlparse

          base_url = os.environ["XTREAM_URL"].rstrip("/")
          username = os.environ["XTREAM_USERNAME"]
          password = os.environ["XTREAM_PASSWORD"]

          params = {
              "username": username,
              "password": password,
              "action": "get_live_streams"
          }

          print("Requesting provider channel list...")

          response = requests.get(
              base_url,
              params=params,
              timeout=120
          )

          print("HTTP status:", response.status_code)

          response.raise_for_status()

          data = response.json()

          if not isinstance(data, list):
              print("Unexpected provider response:")
              print(json.dumps(data, indent=2)[:5000])
              raise SystemExit("Provider did not return a channel list")

          os.makedirs("provider_channels", exist_ok=True)

          with open(
              "provider_channels/channels.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(data, f, indent=2)

          with open(
              "provider_channels/channels.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for channel in sorted(
                  data,
                  key=lambda x: (
                      str(x.get("category_name", "")).lower(),
                      str(x.get("name", "")).lower()
                  )
              ):

                  name = str(channel.get("name", "")).strip()
                  stream_id = channel.get("stream_id", "")
                  category = str(
                      channel.get("category_name", "")
                  ).strip()

                  f.write(
                      f"{category} | {name} | "
                      f"stream_id={stream_id}\n"
                  )

          categories = {}

          for channel in data:
              category = str(
                  channel.get("category_name", "")
              ).strip() or "Uncategorized"

              categories[category] = categories.get(category, 0) + 1

          with open(
              "provider_channels/category_summary.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for category, count in sorted(
                  categories.items(),
                  key=lambda x: x[0].lower()
              ):

                  f.write(f"{count:5} | {category}\n")

          print()
          print("Provider channel list retrieved successfully")
          print("Total channels:", len(data))
          print("Total categories:", len(categories))
          print()
          print("Category summary:")

          for category, count in sorted(
              categories.items(),
              key=lambda x: x[0].lower()
          ):

              print(f"{count:5} | {category}")
          PY

      - name: Upload provider channel list
        uses: actions/upload-artifact@v4
        with:
          name: provider-channel-list
          path: provider_channels/
          retention-days: 7
