name: Test Provider Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-provider-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |
          python -m pip install requests

      - name: Download US UK CA provider channels
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import re
          import html
          import requests

          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")
          USERNAME = os.environ["XTREAM_USERNAME"]
          PASSWORD = os.environ["XTREAM_PASSWORD"]

          OUTPUT_FILE = "fast/fastchannels.txt"

          os.makedirs(
              "fast",
              exist_ok=True
          )

          session = requests.Session()

          session.headers.update(
              {
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print(
              "Downloading complete provider live channel list..."
          )

          streams_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )

          response = session.get(

              streams_url,

              timeout=(30, 300)

          )

          print(
              f"HTTP status: {response.status_code}"
          )

          response.raise_for_status()

          streams = response.json()

          if not isinstance(streams, list):

              raise RuntimeError(

                  "Provider response was not a channel list"

              )

          print(

              f"Total provider channels received: "

              f"{len(streams)}"

          )

          def clean_name(name):

              if not name:

                  return ""

              name = html.unescape(

                  str(name)

              )

              name = re.sub(

                  r"<.*?>",

                  "",

                  name

              )

              name = re.sub(

                  r"\s+",

                  " ",

                  name

              )

              return name.strip()

          channels = []

          country_counts = {

              "US": 0,

              "UK": 0,

              "CA": 0

          }

          for stream in streams:

              stream_id = str(

                  stream.get(

                      "stream_id",

                      ""

                  )

              ).strip()

              name = clean_name(

                  stream.get(

                      "name",

                      ""

                  )

              )

              if not stream_id or not name:

                  continue

              match = re.match(

                  r"^(US|UK|CA):\s*",

                  name,

                  re.IGNORECASE

              )

              if not match:

                  continue

              country = match.group(

                  1

              ).upper()

              country_counts[country] += 1

              channels.append(

                  (

                      stream_id,

                      name

                  )

              )

          channels.sort(

              key=lambda item:

              item[1].lower()

          )

          with open(

              OUTPUT_FILE,

              "w",

              encoding="utf-8"

          ) as output:

              for stream_id, name in channels:

                  output.write(

                      f"{stream_id}|{name}\n"

                  )

          print("")

          print(

              "Filtered provider channel dump complete"

          )

          print("")

          print(

              f"US channels: "

              f"{country_counts['US']}"

          )

          print(

              f"UK channels: "

              f"{country_counts['UK']}"

          )

          print(

              f"CA channels: "

              f"{country_counts['CA']}"

          )

          print("")

          print(

              "Total US/UK/CA channels written: "

              f"{len(channels)}"

          )

          print("")

          print(

              f"Output file: "

              f"{OUTPUT_FILE}"

          )

          PY

      - name: Show channel dump
        run: |

          echo "Channel file created:"

          ls -lh fast/fastchannels.txt

          echo ""

          echo "First 20 channels:"

          head -20 fast/fastchannels.txt

          echo ""

          echo "Total channels:"

          wc -l fast/fastchannels.txt

      - name: Commit and push channel list
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fastchannels.txt

          if git diff --cached --quiet; then

            echo "No changes"

          else

            git commit -m "Update FAST provider channel list"

            git push

          fi
