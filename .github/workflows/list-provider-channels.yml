name: Test FAST Provider Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-provider-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Verify provider credentials
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |
          echo "Provider credentials loaded"

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements
        run: |
          python -m pip install requests


      - name: Test provider connection
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import requests

          username = os.environ["XTREAM_USERNAME"]
          password = os.environ["XTREAM_PASSWORD"]

          base_url = "http://cf.shop4uu.xyz:80"

          url = (
              f"{base_url}/player_api.php"
              f"?username={username}"
              f"&password={password}"
          )

          print("Testing provider API...")
          print("Provider host: cf.shop4uu.xyz")

          response = requests.get(
              url,
              timeout=60
          )

          print(f"HTTP status: {response.status_code}")

          response.raise_for_status()

          data = response.json()

          if "user_info" not in data:
              print("Unexpected provider response:")
              print(data)
              raise SystemExit(1)

          user_info = data["user_info"]
          server_info = data.get("server_info", {})

          print("Provider connection successful")
          print(f"Account status: {user_info.get('status')}")
          print(f"Active connections: {user_info.get('active_cons')}")
          print(f"Maximum connections: {user_info.get('max_connections')}")
          print(f"Server: {server_info.get('url')}")
          print(f"Server time: {server_info.get('time_now')}")


      - name: Download complete provider channel list
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |
          python - <<'PY'
          import os
          import requests
          import json

          username = os.environ["XTREAM_USERNAME"]
          password = os.environ["XTREAM_PASSWORD"]

          base_url = "http://cf.shop4uu.xyz:80"

          url = (
              f"{base_url}/player_api.php"
              f"?username={username}"
              f"&password={password}"
              f"&action=get_live_streams"
          )

          print("Requesting complete provider channel list...")

          response = requests.get(
              url,
              timeout=120
          )

          print(f"HTTP status: {response.status_code}")

          response.raise_for_status()

          channels = response.json()

          if not isinstance(channels, list):
              print("Unexpected provider response:")
              print(channels)
              raise SystemExit(1)

          print(f"Provider channels found: {len(channels)}")

          with open("fastchannels.txt", "w", encoding="utf-8") as file:
              for channel in channels:
                  file.write(
                      json.dumps(
                          channel,
                          ensure_ascii=False
                      )
                      + "\n"
                  )

          print("Saved complete provider channel list to fastchannels.txt")
          PY


      - name: Display channel summary
        run: |

          echo "fastchannels.txt created"

          echo
          echo "Total provider channel records:"
          wc -l fastchannels.txt

          echo
          echo "First 10 provider channel records:"
          head -n 10 fastchannels.txt


      - name: Commit provider channel list
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fastchannels.txt

          git commit -m "Update FAST provider channel list" || echo "No changes"

          git push
