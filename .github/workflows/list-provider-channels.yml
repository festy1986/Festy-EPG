name: FAST Channel List

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-channel-list
  cancel-in-progress: false

jobs:
  get-fast-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |
          python -m pip install requests

      - name: Get provider channel list
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import requests
          from urllib.parse import urlparse

          XTREAM_URL = os.environ["XTREAM_URL"]
          USERNAME = os.environ["XTREAM_USERNAME"]
          PASSWORD = os.environ["XTREAM_PASSWORD"]

          print("Requesting provider channel list...")

          parsed = urlparse(XTREAM_URL)

          print(f"Provider host: {parsed.netloc}")

          params = {
              "username": USERNAME,
              "password": PASSWORD,
              "action": "get_live_streams"
          }

          response = requests.get(
              XTREAM_URL,
              params=params,
              timeout=120
          )

          print(f"HTTP status: {response.status_code}")

          response.raise_for_status()

          data = response.json()

          if not isinstance(data, list):
              print("Unexpected provider response:")
              print(str(data)[:1000])
              raise SystemExit(1)

          print(f"Provider channels returned: {len(data)}")

          os.makedirs("fast", exist_ok=True)

          with open("fast/fastchannels.txt", "w", encoding="utf-8") as output:

              for channel in data:

                  name = str(
                      channel.get("name")
                      or channel.get("stream_display_name")
                      or ""
                  ).strip()

                  if not name:
                      continue

                  output.write(name + "\n")

          print("Created fast/fastchannels.txt")

          PY

      - name: Show generated channel list
        run: |

          echo "Channel list file:"

          wc -l fast/fastchannels.txt

          echo

          echo "First 20 channels:"

          head -20 fast/fastchannels.txt

          echo

          echo "Last 20 channels:"

          tail -20 fast/fastchannels.txt

      - name: Commit and push channel list
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add fast/fastchannels.txt

          git commit -m "Update FAST channel list" || echo "No changes"

          git push
