name: Test Provider Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-provider-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |

          python -m pip install requests

      - name: Download provider channels with groups
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import re
          import html
          import requests

          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")
          USERNAME = os.environ["XTREAM_USERNAME"]
          PASSWORD = os.environ["XTREAM_PASSWORD"]

          OUTPUT_FILE = "fast/fastchannels.txt"

          os.makedirs(
              "fast",
              exist_ok=True
          )

          session = requests.Session()

          session.headers.update(
              {
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print(
              "Downloading complete provider channel list..."
          )

          streams_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )

          response = session.get(

              streams_url,

              timeout=(30, 300)

          )

          print(

              f"HTTP status: "

              f"{response.status_code}"

          )

          response.raise_for_status()

          streams = response.json()

          if not isinstance(

              streams,

              list

          ):

              raise RuntimeError(

                  "Provider response was not a channel list"

              )

          print(

              f"Total provider channels received: "

              f"{len(streams)}"

          )

          def clean_name(name):

              if not name:

                  return ""

              name = html.unescape(

                  str(name)

              )

              name = re.sub(

                  r"<.*?>",

                  "",

                  name

              )

              name = re.sub(

                  r"\s+",

                  " ",

                  name

              )

              return name.strip()

          channels = []

          groups = {}

          for stream in streams:

              stream_id = str(

                  stream.get(

                      "stream_id",

                      ""

                  )

              ).strip()

              name = clean_name(

                  stream.get(

                      "name",

                      ""

                  )

              )

              group = clean_name(

                  stream.get(

                      "category_name",

                      ""

                  )

              )

              if not stream_id or not name:

                  continue

              if not group:

                  group = "NO GROUP"

              channels.append(

                  {

                      "id": stream_id,

                      "name": name,

                      "group": group

                  }

              )

              if group not in groups:

                  groups[group] = 0

              groups[group] += 1

          channels.sort(

              key=lambda item: (

                  item["group"].lower(),

                  item["name"].lower()

              )

          )

          with open(

              OUTPUT_FILE,

              "w",

              encoding="utf-8"

          ) as output:

              current_group = None

              for channel in channels:

                  group = channel["group"]

                  if group != current_group:

                      output.write("\n")

                      output.write(

                          f"# ===== {group} =====\n"

                      )

                      current_group = group

                  output.write(

                      f"{channel['id']}|"

                      f"{channel['name']}|"

                      f"{group}\n"

                  )

          print("")

          print(

              "Provider channel dump complete"

          )

          print("")

          print(

              f"Total channels written: "

              f"{len(channels)}"

          )

          print("")

          print(

              f"Total groups found: "

              f"{len(groups)}"

          )

          print("")

          print(

              "GROUP SUMMARY"

          )

          print(

              "============="

          )

          for group, count in sorted(

              groups.items(),

              key=lambda item:

              item[0].lower()

          ):

              print(

                  f"{count:6}  {group}"

              )

          print("")

          print(

              f"Output file: "

              f"{OUTPUT_FILE}"

          )

          PY

      - name: Show channel dump
        run: |

          echo "Channel file created:"

          ls -lh fast/fastchannels.txt

          echo ""

          echo "Total lines:"

          wc -l fast/fastchannels.txt

          echo ""

          echo "First 100 lines:"

          head -100 fast/fastchannels.txt

      - name: Commit and push channel list
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fastchannels.txt

          if git diff --cached --quiet; then

            echo "No changes"

          else

            git commit -m "Update FAST provider channel list"

            git push

          fi
