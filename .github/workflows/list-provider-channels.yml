name: FAST Channel Source Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-fast-source-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download selected provider channels

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import json
          import time
          import requests


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize provider URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if (

              ":80" not in XTREAM_URL

              and

              ":443" not in XTREAM_URL

          ):

              XTREAM_URL += ":80"


          # ---------------------------------
          # Exact groups requested
          # ---------------------------------

          selected_groups = {

              "CA| CANADA WEST PPV",

              "CA| CANADA ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| CBC PPV",

              "CA| CFL PPV",

              "CA| DAZN PPV",

              "CA| DAZN PPV ⱽᴵᴾ",

              "CA| FUBO PPV ᴿᴬᵂ",

              "CA| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| ROGERS SUPER SPORTS PACK EN",

              "CA| SPORTS EN",

              "CA| SPORTSNET PPV",

              "CA| SPORTSNET+ PPV",

              "CA| TSN SPORT ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| TSN+ PPV",

              "CA| VICTORY+ PPV",

              "UK| AMAZON PRIME PPV",

              "UK| DAZN PPV",

              "UK| DAZN PPV VIP",

              "UK| ESPN+ PPV",

              "UK| MC VIDEO ᴴᴰ",

              "UK| MUSIC ᴴᴰ/ᴿᴬᵂ",

              "UK| PPV EVENT",

              "UK| PPV EVENT ⁽ᴮᴷ⁾",

              "UK| PRIME VIDEO SERIES ᴿᴬᵂ",

              "UK| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "UK| SPORT SD",

              "UK| SPORT SD ⱽᴵᴾ",

              "UK| SPORT ʰᵉᵛᶜ",

              "UK| SPORT ᴴᴰ",

              "UK| SPORT ᴴᴰ ⱽᴵᴾ",

              "UK| SPORT ᴿᴬᵂ",

              "UK| SPORT ᴿᴬᵂ ⱽᴵᴾ ᴰᴼᴸᴮᵞ ᴬᵁᴰᴵᴼ",

              "UK| TNT SPORT EVENT",

              "UK| TNT SPORT SD ⱽᴵᴾ",

              "UK| TNT SPORT ᴴᴰ ⱽᴵᴾ",

              "UK| TNT SPORT ᴿᴬᵂ ⱽᴵᴾ ᴰᴼᴸᴮᵞ ᴬᵁᴰᴵᴼ",

              "UK| UFC PPV",

              "US| DAZN PPV",

              "US| ESPN+ PPV",

              "US| ESPN+ PPV ⱽᴵᴾ",

              "US| MLB PPV",

              "US| MLB TEAM PPV",

              "US| NBA PPV",

              "US| NBA TEAM PPV",

              "US| NFL PPV",

              "US| NFL REPLAY",

              "US| NHL PPV",

              "US| NHL REPLAY",

              "US| NHL TEAM PPV",

              "US| PPV EVENT",

              "US| PPV EVENT ⁽ᴮᴷ⁾",

              "US| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| ROKU ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| SPORT ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| TUBI ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| UFC PPV"

          }


          print("")

          print(

              f"Selected groups: "

              f"{len(selected_groups)}"

          )


          # ---------------------------------
          # Create session
          # ---------------------------------

          session = requests.Session()


          session.headers.update({

              "User-Agent": "Mozilla/5.0"

          })


          # ---------------------------------
          # API helper
          # ---------------------------------

          def provider_request(action):

              url = (

                  f"{XTREAM_URL}/player_api.php"

                  f"?username={USERNAME}"

                  f"&password={PASSWORD}"

                  f"&action={action}"

              )


              for attempt in range(1, 6):

                  try:

                      print("")

                      print(

                          f"Downloading {action} "

                          f"(attempt {attempt}/5)..."

                      )


                      response = session.get(

                          url,

                          timeout=(30, 600)

                      )


                      print(

                          f"HTTP status: "

                          f"{response.status_code}"

                      )


                      response.raise_for_status()


                      data = response.json()


                      return data


                  except Exception as error:

                      print("")

                      print(

                          f"Attempt {attempt} failed: "

                          f"{error}"

                      )


                      if attempt < 5:

                          time.sleep(15)


              raise SystemExit(

                  f"Provider request failed: {action}"

              )


          # ---------------------------------
          # Download categories
          # ---------------------------------

          categories = provider_request(

              "get_live_categories"

          )


          if not isinstance(categories, list):

              raise SystemExit(

                  "Provider categories response was not a list"

              )


          print("")

          print(

              f"Total provider categories: "

              f"{len(categories)}"

          )


          # ---------------------------------
          # Match selected category names
          # ---------------------------------

          selected_category_ids = set()

          matched_category_names = {}


          for category in categories:

              category_id = str(

                  category.get(

                      "category_id",

                      ""

                  )

              )


              category_name = str(

                  category.get(

                      "category_name",

                      ""

                  )

              )


              if category_name in selected_groups:

                  selected_category_ids.add(

                      category_id

                  )


                  matched_category_names[

                      category_id

                  ] = category_name


          print("")

          print(

              "Matching categories:"

          )


          for category_id in sorted(

              matched_category_names,

              key=lambda value:

                  matched_category_names[value].casefold()

          ):

              print(

                  f"{matched_category_names[category_id]}"

                  f" | category_id={category_id}"

              )


          print("")

          print(

              f"Matched categories: "

              f"{len(selected_category_ids)}"

          )


          if not selected_category_ids:

              print("")

              print(

                  "No categories matched."

              )


              print("")

              print(

                  "Provider categories containing "

                  "sport-related terms:"

              )


              for category in categories:

                  name = str(

                      category.get(

                          "category_name",

                          ""

                      )

                  )


                  upper = name.upper()


                  if any(

                      term in upper

                      for term in [

                          "SPORT",

                          "PPV",

                          "DAZN",

                          "NHL",

                          "NFL",

                          "NBA",

                          "MLB",

                          "TSN",

                          "TNT",

                          "UFC",

                          "PRIME",

                          "ESPN"

                      ]

                  ):

                      print(

                          repr(name)

                      )


              raise SystemExit(

                  "No provider categories matched"

              )


          # ---------------------------------
          # Download all live channels
          # ---------------------------------

          streams = provider_request(

              "get_live_streams"

          )


          if not isinstance(streams, list):

              raise SystemExit(

                  "Provider streams response was not a list"

              )


          print("")

          print(

              f"Total provider channels: "

              f"{len(streams)}"

          )


          # ---------------------------------
          # Match channels by category_id
          # ---------------------------------

          matched_channels = []


          for stream in streams:

              category_id = str(

                  stream.get(

                      "category_id",

                      ""

                  )

              )


              if category_id in selected_category_ids:

                  matched_channels.append(stream)


          print("")

          print(

              f"Channels from selected groups: "

              f"{len(matched_channels)}"

          )


          if not matched_channels:

              raise SystemExit(

                  "No channels matched selected category IDs"

              )


          # ---------------------------------
          # Sort channels
          # ---------------------------------

          matched_channels.sort(

              key=lambda stream: (

                  matched_category_names.get(

                      str(

                          stream.get(

                              "category_id",

                              ""

                          )

                      ),

                      ""

                  ).casefold(),

                  str(

                      stream.get(

                          "name",

                          ""

                      )

                  ).casefold(),

                  str(

                      stream.get(

                          "stream_id",

                          ""

                      )

                  )

              )

          )


          # ---------------------------------
          # Create fast directory
          # ---------------------------------

          os.makedirs(

              "fast",

              exist_ok=True

          )


          output_file = "fast/fast.txt"


          # ---------------------------------
          # Write complete provider records
          # ---------------------------------

          with open(

              output_file,

              "w",

              encoding="utf-8"

          ) as file:


              for stream in matched_channels:

                  file.write(

                      json.dumps(

                          stream,

                          ensure_ascii=False,

                          separators=(

                              ",",

                              ":"

                          )

                      )

                      + "\n"

                  )


          # ---------------------------------
          # Count channels by group
          # ---------------------------------

          group_counts = {}


          for stream in matched_channels:

              category_id = str(

                  stream.get(

                      "category_id",

                      ""

                  )

              )


              group_name = matched_category_names.get(

                  category_id,

                  category_id

              )


              group_counts[group_name] = (

                  group_counts.get(

                      group_name,

                      0

                  )

                  + 1

              )


          # ---------------------------------
          # Results
          # ---------------------------------

          print("")

          print(

              "======================================"

          )

          print(

              "FAST SOURCE CHANNEL LIST CREATED"

          )

          print(

              "======================================"

          )


          print("")

          print(

              f"Channels written: "

              f"{len(matched_channels)}"

          )


          print("")

          print(

              "Channels by group:"

          )


          for group in sorted(

              group_counts,

              key=lambda value: value.casefold()

          ):

              print(

                  f"{group}: "

                  f"{group_counts[group]}"

              )


          print("")

          print(

              f"Created: "

              f"{output_file}"

          )


          print("")

          print(

              "File size:"

          )


          print(

              os.path.getsize(

                  output_file

              ),

              "bytes"

          )

          PY


      - name: Show FAST source file

        run: |

          echo "======================================"

          echo "FAST SOURCE FILE"

          echo "======================================"

          echo ""

          echo "Channel records:"

          wc -l fast/fast.txt

          echo ""

          echo "File size:"

          ls -lh fast/fast.txt

          echo ""

          echo "First 5 records:"

          head -n 5 fast/fast.txt


      - name: Commit and push FAST source list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fast.txt

          git commit -m "Update FAST source channel list" || echo "No changes"

          git push
