name: FAST Channel Source Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-fast-source-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download provider channels from selected groups

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import json
          import time
          import requests


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize provider URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(

                  "https://",

                  "http://"

              )


          if (

              ":80" not in XTREAM_URL

              and

              ":443" not in XTREAM_URL

          ):

              XTREAM_URL += ":80"


          # ---------------------------------
          # EXACT GROUP NAMES
          #
          # These are the provider group names
          # to keep.
          # ---------------------------------

          selected_groups = {

              "CA| CANADA WEST PPV",

              "CA| CANADA ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| CBC PPV",

              "CA| CFL PPV",

              "CA| DAZN PPV",

              "CA| DAZN PPV ⱽᴵᴾ",

              "CA| FUBO PPV ᴿᴬᵂ",

              "CA| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| ROGERS SUPER SPORTS PACK EN",

              "CA| SPORTS EN",

              "CA| SPORTSNET PPV",

              "CA| SPORTSNET+ PPV",

              "CA| TSN SPORT ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "CA| TSN+ PPV",

              "CA| VICTORY+ PPV",

              "UK| AMAZON PRIME PPV",

              "UK| DAZN PPV",

              "UK| DAZN PPV VIP",

              "UK| ESPN+ PPV",

              "UK| MC VIDEO ᴴᴰ",

              "UK| MUSIC ᴴᴰ/ᴿᴬᵂ",

              "UK| PPV EVENT",

              "UK| PPV EVENT ⁽ᴮᴷ⁾",

              "UK| PRIME VIDEO SERIES ᴿᴬᵂ",

              "UK| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "UK| SPORT SD",

              "UK| SPORT SD ⱽᴵᴾ",

              "UK| SPORT ʰᵉᵛᶜ",

              "UK| SPORT ᴴᴰ",

              "UK| SPORT ᴴᴰ ⱽᴵᴾ",

              "UK| SPORT ᴿᴬᵂ",

              "UK| SPORT ᴿᴬᵂ ⱽᴵᴾ ᴰᴼᴸᴮᵞ ᴬᵁᴰᴵᴼ",

              "UK| TNT SPORT EVENT",

              "UK| TNT SPORT SD ⱽᴵᴾ",

              "UK| TNT SPORT ᴴᴰ ⱽᴵᴾ",

              "UK| TNT SPORT ᴿᴬᵂ ⱽᴵᴾ ᴰᴼᴸᴮᵞ ᴬᵁᴰᴵᴼ",

              "UK| UFC PPV",

              "US| DAZN PPV",

              "US| ESPN+ PPV",

              "US| ESPN+ PPV ⱽᴵᴾ",

              "US| MLB PPV",

              "US| MLB TEAM PPV",

              "US| NBA PPV",

              "US| NBA TEAM PPV",

              "US| NFL PPV",

              "US| NFL REPLAY",

              "US| NHL PPV",

              "US| NHL REPLAY",

              "US| NHL TEAM PPV",

              "US| PPV EVENT",

              "US| PPV EVENT ⁽ᴮᴷ⁾",

              "US| PRIME ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| ROKU ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| SPORT ᴴᴰ/ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| TUBI ᴿᴬᵂ ⁶⁰ᶠᵖˢ",

              "US| UFC PPV"

          }


          print("")

          print(

              f"Selected groups: "

              f"{len(selected_groups)}"

          )


          # ---------------------------------
          # Session
          # ---------------------------------

          session = requests.Session()


          session.headers.update({

              "User-Agent": "Mozilla/5.0"

          })


          # ---------------------------------
          # Provider API
          # ---------------------------------

          api_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )


          streams = None


          for attempt in range(1, 6):

              try:

                  print("")

                  print(

                      f"Downloading provider channels "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      api_url,

                      timeout=(30, 600)

                  )


                  print(

                      f"HTTP status: "

                      f"{response.status_code}"

                  )


                  response.raise_for_status()


                  streams = response.json()


                  break


              except Exception as error:

                  print("")

                  print(

                      f"Attempt {attempt} failed: "

                      f"{error}"

                  )


                  if attempt < 5:

                      time.sleep(15)


          if streams is None:

              raise SystemExit(

                  "Provider channel download failed"

              )


          if not isinstance(streams, list):

              raise SystemExit(

                  "Provider response was not a list"

              )


          print("")

          print(

              f"Total provider channels: "

              f"{len(streams)}"

          )


          # ---------------------------------
          # Count every category exactly as
          # returned by the provider
          # ---------------------------------

          category_counts = {}


          for stream in streams:

              category = str(

                  stream.get(

                      "category_name",

                      ""

                  )

              )


              category_counts[category] = (

                  category_counts.get(

                      category,

                      0

                  )

                  + 1

              )


          # ---------------------------------
          # Show exact matching groups
          # ---------------------------------

          print("")

          print(

              "Exact group matches found:"

          )


          found_groups = set()


          for category in category_counts:

              if category in selected_groups:

                  found_groups.add(category)

                  print(

                      f"{category}: "

                      f"{category_counts[category]} channels"

                  )


          print("")

          print(

              f"Matching groups: "

              f"{len(found_groups)}"

          )


          # ---------------------------------
          # Pull every channel from the groups
          # ---------------------------------

          matched_channels = []


          for stream in streams:

              category = str(

                  stream.get(

                      "category_name",

                      ""

                  )

              )


              if category in selected_groups:

                  matched_channels.append(stream)


          if not matched_channels:

              print("")

              print(

                  "No channels matched."

              )


              print("")

              print(

                  "The provider returned these actual "

                  "group names containing sport-related "

                  "content:"

              )


              for category in sorted(

                  category_counts,

                  key=lambda value: value.casefold()

              ):

                  upper = category.upper()


                  if any(

                      keyword in upper

                      for keyword in [

                          "SPORT",

                          "PPV",

                          "DAZN",

                          "NHL",

                          "NFL",

                          "NBA",

                          "MLB",

                          "TSN",

                          "TNT",

                          "UFC",

                          "PRIME",

                          "ESPN"

                      ]

                  ):

                      print(

                          repr(category)

                      )


              raise SystemExit(

                  "No channels matched the selected groups"

              )


          # ---------------------------------
          # Sort by group, then channel name
          # ---------------------------------

          matched_channels.sort(

              key=lambda stream: (

                  str(

                      stream.get(

                          "category_name",

                          ""

                      )

                  ).casefold(),

                  str(

                      stream.get(

                          "name",

                          ""

                      )

                  ).casefold(),

                  str(

                      stream.get(

                          "stream_id",

                          ""

                      )

                  )

              )

          )


          # ---------------------------------
          # Create output directory
          # ---------------------------------

          os.makedirs(

              "fast",

              exist_ok=True

          )


          output_file = "fast/fast.txt"


          # ---------------------------------
          # Save every provider record
          #
          # Each line contains the complete
          # provider JSON record, including:
          #
          # stream_id
          # name
          # category_id
          # category_name
          # stream_type
          # stream_icon
          # epg_channel_id
          # tv_archive
          # tv_archive_duration
          # and all other identifiers
          # returned by the provider.
          # ---------------------------------

          with open(

              output_file,

              "w",

              encoding="utf-8"

          ) as file:


              for stream in matched_channels:

                  file.write(

                      json.dumps(

                          stream,

                          ensure_ascii=False,

                          separators=(

                              ",",

                              ":"

                          )

                      )

                      + "\n"

                  )


          # ---------------------------------
          # Final results
          # ---------------------------------

          print("")

          print(

              "======================================"

          )

          print(

              "FAST SOURCE CHANNEL LIST CREATED"

          )

          print(

              "======================================"

          )


          print("")

          print(

              f"Channels written: "

              f"{len(matched_channels)}"

          )


          print("")

          print(

              f"Output file: "

              f"{output_file}"

          )


          print("")

          print(

              "Channels by group:"

          )


          final_counts = {}


          for stream in matched_channels:

              group = str(

                  stream.get(

                      "category_name",

                      ""

                  )

              )


              final_counts[group] = (

                  final_counts.get(

                      group,

                      0

                  )

                  + 1

              )


          for group in sorted(

              final_counts,

              key=lambda value: value.casefold()

          ):

              print(

                  f"{group}: "

                  f"{final_counts[group]}"

              )


          print("")

          print(

              "File size:"

          )


          print(

              os.path.getsize(

                  output_file

              ),

              "bytes"

          )

          PY


      - name: Show FAST source file

        run: |

          echo "======================================"

          echo "FAST SOURCE FILE"

          echo "======================================"

          echo ""

          echo "Channel records:"

          wc -l fast/fast.txt

          echo ""

          echo "File size:"

          ls -lh fast/fast.txt

          echo ""

          echo "First 5 records:"

          head -n 5 fast/fast.txt


      - name: Commit and push FAST source list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fast.txt

          git commit -m "Update FAST source channel list" || echo "No changes"

          git push
