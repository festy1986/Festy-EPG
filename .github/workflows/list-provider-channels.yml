name: FAST Channel List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-fast-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download selected FAST channels

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import json
          import requests
          import time


          # ---------------------------------
          # Provider credentials
          # ---------------------------------

          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize provider URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          # ---------------------------------
          # Input and output
          # ---------------------------------

          GROUP_FILE = "fast/fastgroups.txt"

          OUTPUT_FILE = "fast/fastchannels.txt"


          # ---------------------------------
          # Load selected groups
          # ---------------------------------

          if not os.path.exists(GROUP_FILE):

              raise SystemExit(

                  f"Missing {GROUP_FILE}"

              )


          selected_groups = set()


          with open(

              GROUP_FILE,

              "r",

              encoding="utf-8"

          ) as file:

              for line in file:

                  group = line.strip()


                  if group:

                      selected_groups.add(group)


          if not selected_groups:

              raise SystemExit(

                  "No groups found in fast/fastgroups.txt"

              )


          print("")

          print(

              f"Selected groups: "

              f"{len(selected_groups)}"

          )


          # ---------------------------------
          # Session
          # ---------------------------------

          session = requests.Session()


          session.headers.update({

              "User-Agent": "Mozilla/5.0"

          })


          # ---------------------------------
          # Download provider channels
          # ---------------------------------

          API_URL = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )


          streams = None


          for attempt in range(1, 6):

              try:

                  print("")

                  print(

                      f"Downloading provider channels "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      API_URL,

                      timeout=(30, 600)

                  )


                  print(

                      f"HTTP status: "

                      f"{response.status_code}"

                  )


                  response.raise_for_status()


                  streams = response.json()


                  break


              except Exception as error:

                  print("")

                  print(

                      f"Attempt {attempt} failed: "

                      f"{error}"

                  )


                  if attempt < 5:

                      time.sleep(15)


          if streams is None:

              raise SystemExit(

                  "Provider channel download failed"

              )


          if not isinstance(streams, list):

              raise SystemExit(

                  "Provider response was not a channel list"

              )


          print("")

          print(

              f"Total provider channels: "

              f"{len(streams)}"

          )


          # ---------------------------------
          # Filter channels by selected groups
          # ---------------------------------

          matched_channels = []


          group_counts = {}


          for stream in streams:


              if not isinstance(stream, dict):

                  continue


              category_name = str(

                  stream.get(

                      "category_name",

                      ""

                  )

              ).strip()


              if category_name not in selected_groups:

                  continue


              matched_channels.append(stream)


              group_counts[category_name] = (

                  group_counts.get(

                      category_name,

                      0

                  )

                  + 1

              )


          if not matched_channels:

              raise SystemExit(

                  "No channels matched the selected groups"

              )


          # ---------------------------------
          # Sort channels
          # ---------------------------------

          matched_channels.sort(

              key=lambda channel: (

                  str(

                      channel.get(

                          "category_name",

                          ""

                      )

                  ).lower(),

                  str(

                      channel.get(

                          "name",

                          ""

                      )

                  ).lower(),

                  str(

                      channel.get(

                          "stream_id",

                          ""

                      )

                  )

              )

          )


          # ---------------------------------
          # Save complete provider records
          # ---------------------------------

          os.makedirs(

              "fast",

              exist_ok=True

          )


          with open(

              OUTPUT_FILE,

              "w",

              encoding="utf-8"

          ) as file:


              for channel in matched_channels:

                  file.write(

                      json.dumps(

                          channel,

                          ensure_ascii=False,

                          separators=(

                              ",",

                              ":"

                          )

                      )

                      + "\n"

                  )


          # ---------------------------------
          # Display results
          # ---------------------------------

          print("")

          print(

              "======================================"

          )

          print(

              "FAST CHANNEL RESULTS"

          )

          print(

              "======================================"

          )


          print("")

          print(

              f"Matched channels: "

              f"{len(matched_channels)}"

          )


          print("")

          print(

              "Channels by group:"

          )


          for group in sorted(

              group_counts,

              key=lambda value: value.lower()

          ):

              print(

                  f"{group}: "

                  f"{group_counts[group]}"

              )


          print("")

          print(

              f"Created: "

              f"{OUTPUT_FILE}"

          )


          print("")

          print(

              "First 10 channels:"

          )


          for channel in matched_channels[:10]:

              print(

                  json.dumps(

                      channel,

                      ensure_ascii=False,

                      indent=2

                  )

              )

          PY


      - name: Show FAST channel file information

        run: |

          echo "======================================"

          echo "FAST CHANNEL FILE"

          echo "======================================"

          echo ""

          wc -l fast/fastchannels.txt

          echo ""

          ls -lh fast/fastchannels.txt

          echo ""

          echo "First 5 records:"

          head -n 5 fast/fastchannels.txt


      - name: Commit and push FAST channel list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fastchannels.txt

          git commit -m "Update FAST channel list" || echo "No changes"

          git push
