name: FAST Group List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-fast-groups:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download provider groups

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import requests
          import time


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize provider URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          session = requests.Session()

          session.headers.update({

              "User-Agent": "Mozilla/5.0"

          })


          def download_api(action):

              url = (

                  f"{XTREAM_URL}/player_api.php"

                  f"?username={USERNAME}"

                  f"&password={PASSWORD}"

                  f"&action={action}"

              )


              for attempt in range(1, 6):

                  try:

                      print(

                          f"Downloading {action} "

                          f"(attempt {attempt}/5)..."

                      )


                      response = session.get(

                          url,

                          timeout=(30, 600)

                      )


                      print(

                          f"{action} HTTP status: "

                          f"{response.status_code}"

                      )


                      response.raise_for_status()


                      data = response.json()


                      if not isinstance(data, list):

                          raise RuntimeError(

                              f"{action} did not return a list"

                          )


                      print(

                          f"{action} returned "

                          f"{len(data)} records"

                      )


                      return data


                  except Exception as error:

                      print(

                          f"{action} attempt {attempt} failed: "

                          f"{error}"

                      )


                      if attempt < 5:

                          time.sleep(15)


              raise SystemExit(

                  f"Failed to download {action}"

              )


          # ---------------------------------
          # Download all provider categories
          # ---------------------------------

          categories = download_api(

              "get_live_categories"

          )


          # ---------------------------------
          # Build category ID -> name lookup
          # ---------------------------------

          category_names = {}


          for category in categories:

              if not isinstance(category, dict):

                  continue


              category_id = str(

                  category.get(

                      "category_id",

                      ""

                  )

              ).strip()


              category_name = str(

                  category.get(

                      "category_name",

                      ""

                  )

              ).strip()


              if category_id and category_name:

                  category_names[

                      category_id

                  ] = category_name


          print("")

          print(

              f"Category names found: "

              f"{len(category_names)}"

          )


          # ---------------------------------
          # Download all live channels
          # ---------------------------------

          streams = download_api(

              "get_live_streams"

          )


          print("")

          print(

              f"Total provider channels: "

              f"{len(streams)}"

          )


          # ---------------------------------
          # Match every channel to its group
          # ---------------------------------

          groups = set()

          channels_without_group = 0


          for stream in streams:

              if not isinstance(stream, dict):

                  continue


              category_id = str(

                  stream.get(

                      "category_id",

                      ""

                  )

              ).strip()


              if category_id in category_names:

                  groups.add(

                      category_names[category_id]

                  )

              else:

                  channels_without_group += 1


          # ---------------------------------
          # Save unique groups
          # ---------------------------------

          if not groups:

              print("")

              print(

                  "No groups were matched."

              )


              print("")

              print(

                  "Sample channel data:"

              )


              for stream in streams[:3]:

                  print(stream)


              raise SystemExit(

                  "No channel groups were found"

              )


          sorted_groups = sorted(

              groups,

              key=lambda value: value.lower()

          )


          output_file = "fast/fastgroups.txt"


          os.makedirs(

              "fast",

              exist_ok=True

          )


          with open(

              output_file,

              "w",

              encoding="utf-8"

          ) as file:

              for group in sorted_groups:

                  file.write(

                      group

                      + "\n"

                  )


          print("")

          print(

              f"Unique groups found: "

              f"{len(sorted_groups)}"

          )


          print(

              f"Channels without a matched group: "

              f"{channels_without_group}"

          )


          print("")

          print(

              f"Created: "

              f"{output_file}"

          )


          print("")

          print(

              "First 25 groups:"

          )


          for group in sorted_groups[:25]:

              print(

                  f"  {group}"

              )

          PY


      - name: Show group list

        run: |

          echo "======================================"

          echo "FAST GROUP LIST"

          echo "======================================"

          echo ""

          cat fast/fastgroups.txt

          echo ""

          echo "======================================"

          echo "Total groups:"

          wc -l fast/fastgroups.txt

          echo "======================================"


      - name: Commit and push group list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add fast/fastgroups.txt

          git commit -m "Update FAST group list" || echo "No changes"

          git push
