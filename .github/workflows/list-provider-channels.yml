name: Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-test
  cancel-in-progress: false

jobs:

  test-provider:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download provider channel list

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import requests
          from urllib.parse import urlparse

          base_url = os.environ["XTREAM_URL"].strip().rstrip("/")
          username = os.environ["XTREAM_USERNAME"]
          password = os.environ["XTREAM_PASSWORD"]

          print("Downloading provider channel list...")

          # Use the same provider credentials as the working 24/7 workflow.
          # The M3U endpoint is used here instead of player_api.php because
          # the provider is returning HTTP 520 to direct API requests.

          url = (
              f"{base_url}/get.php"
              f"?username={username}"
              f"&password={password}"
              f"&type=m3u_plus"
              f"&output=ts"
          )

          print(f"Provider host: {urlparse(base_url).netloc}")

          response = requests.get(
              url,
              timeout=300,
              stream=True,
              headers={
                  "User-Agent": "VLC/3.0.20 LibVLC/3.0.20"
              }
          )

          print(f"HTTP status: {response.status_code}")

          response.raise_for_status()

          os.makedirs("fast", exist_ok=True)

          output_path = "fast/fastchannels.txt"

          channel_names = set()

          current_name = ""

          for raw_line in response.iter_lines(decode_unicode=True):

              if not raw_line:
                  continue

              line = raw_line.strip()

              if line.startswith("#EXTINF:"):

                  current_name = line.split(",", 1)[1].strip()

                  if current_name:
                      channel_names.add(current_name)

          if not channel_names:
              raise RuntimeError(
                  "No channels were found in the provider M3U response"
              )

          sorted_channels = sorted(
              channel_names,
              key=lambda value: value.lower()
          )

          with open(output_path, "w", encoding="utf-8") as file:

              for channel in sorted_channels:
                  file.write(channel + "\n")

          print(f"Provider channels found: {len(sorted_channels)}")
          print(f"Written to: {output_path}")

          PY


      - name: Validate provider channel dump

        run: |

          if [ ! -f fast/fastchannels.txt ]; then

            echo "fast/fastchannels.txt was not created"

            exit 1

          fi


          CHANNELS=$(grep -cve '^[[:space:]]*$' fast/fastchannels.txt || true)


          echo "Provider channels written: $CHANNELS"


          if [ "$CHANNELS" -lt 1 ]; then

            echo "No provider channels were found"

            exit 1

          fi


          echo ""

          echo "First 20 channels:"

          head -20 fast/fastchannels.txt


      - name: Commit provider channel list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add fast/fastchannels.txt


          if git diff --cached --quiet; then

            echo "No channel list changes"

            exit 0

          fi


          git commit -m "Update FAST provider channel list"


          git push
