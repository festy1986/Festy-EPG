name: Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-test
  cancel-in-progress: false

jobs:

  test-provider:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Verify provider credentials

        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then
            echo "XTREAM_URL missing"
            exit 1
          fi

          if [ -z "$XTREAM_USERNAME" ]; then
            echo "XTREAM_USERNAME missing"
            exit 1
          fi

          if [ -z "$XTREAM_PASSWORD" ]; then
            echo "XTREAM_PASSWORD missing"
            exit 1
          fi

          echo "XTREAM_URL exists"
          echo "XTREAM_USERNAME exists"
          echo "XTREAM_PASSWORD exists"


      - name: Install Python requirements

        run: |

          python -m pip install requests


      - name: Download provider channel list

        env:

          XTREAM_URL: ${{ secrets.XTREAM_URL }}

          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}

          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import re
          import html
          import time
          import requests


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize Xtream URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          print("Provider URL normalized")

          print(
              "Provider host:",
              re.sub(
                  r"^https?://",
                  "",
                  XTREAM_URL
              )
          )


          # ---------------------------------
          # Session
          # ---------------------------------

          session = requests.Session()

          session.headers.update(
              {
                  "User-Agent": "Mozilla/5.0"
              }
          )


          # ---------------------------------
          # Provider API
          # ---------------------------------

          streams_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )


          streams = None


          for attempt in range(1, 6):

              try:

                  print(
                      f"Downloading provider channels "
                      f"(attempt {attempt}/5)..."
                  )


                  response = session.get(

                      streams_url,

                      timeout=(30, 300)

                  )


                  print(
                      "HTTP status:",
                      response.status_code
                  )


                  response.raise_for_status()


                  streams = response.json()


                  break


              except Exception as error:

                  print(
                      "Provider request failed:",
                      error
                  )


                  if attempt < 5:

                      print(
                          "Retrying in 10 seconds..."
                      )


                      time.sleep(10)


          if streams is None:

              raise SystemExit(
                  "Provider channel download failed"
              )


          if not isinstance(streams, list):

              raise SystemExit(
                  "Provider response was not a channel list"
              )


          print(
              "Provider channels received:",
              len(streams)
          )


          # ---------------------------------
          # Create channel list
          # ---------------------------------

          os.makedirs(
              "fast",
              exist_ok=True
          )


          output_file = (
              "fast/fastchannels.txt"
          )


          channels = []


          for stream in streams:

              if not isinstance(stream, dict):

                  continue


              name = stream.get(
                  "name",
                  ""
              )


              name = html.unescape(
                  str(name)
              )


              name = re.sub(
                  r"<.*?>",
                  "",
                  name
              )


              name = re.sub(
                  r"\s+",
                  " ",
                  name
              )


              name = name.strip()


              if not name:

                  continue


              channels.append(name)


          channels = sorted(
              set(channels),
              key=lambda value: value.lower()
          )


          if not channels:

              raise SystemExit(
                  "No channel names were found"
              )


          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as file:

              for channel in channels:

                  file.write(
                      channel + "\n"
                  )


          print("")

          print(
              "Channel dump complete"
          )


          print(
              "Total unique channels:",
              len(channels)
          )


          print(
              "Created:",
              output_file
          )


          print("")

          print(
              "First 25 channels:"
          )


          for channel in channels[:25]:

              print(
                  channel
              )


          PY


      - name: Validate provider channel list

        run: |

          if [ ! -f fast/fastchannels.txt ]; then

            echo "fast/fastchannels.txt was not created"

            exit 1

          fi


          CHANNELS=$(

            grep -cve '^[[:space:]]*$' \

            fast/fastchannels.txt \

            || true

          )


          echo ""

          echo "Provider channels written: $CHANNELS"


          if [ "$CHANNELS" -lt 1 ]; then

            echo "Channel list is empty"

            exit 1

          fi


          echo ""

          echo "Channel list file:"

          ls -lh fast/fastchannels.txt


      - name: Commit and push channel list

        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add fast/fastchannels.txt


          if git diff --cached --quiet; then

            echo "No channel list changes"

            exit 0

          fi


          git commit -m "Update FAST provider channel list"


          git push
