name: Force Cancel Stuck Run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel run 29711500691
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             repos/${{ github.repository }}/actions/runs/29711500691/force-cancel
          echo "Force-cancel request sent for workflow run 29711500691."
