name: TEST Provider Category Inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory-provider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found"

      - name: Download category lists and full M3U
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p config/provider-inventory
          mkdir -p test/provider-inventory

          BASE_URL="${XTREAM_URL%/}"

          API_URL="${BASE_URL}/player_api.php?username=${XTREAM_USERNAME}&password=${XTREAM_PASSWORD}"

          M3U_URL="${BASE_URL}/get.php?username=${XTREAM_USERNAME}&password=${XTREAM_PASSWORD}&type=m3u_plus&output=ts"

          echo "Downloading all live TV groups..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/live-categories.json \
            "${API_URL}&action=get_live_categories"

          echo "Downloading all movie/VOD categories..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/vod-categories.json \
            "${API_URL}&action=get_vod_categories"

          echo "Downloading all series categories..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/series-categories.json \
            "${API_URL}&action=get_series_categories"

          echo "Downloading complete provider M3U..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 1800 \
            --output test/provider-inventory/provider-full.m3u \
            "$M3U_URL"

          test -s test/provider-inventory/live-categories.json
          test -s test/provider-inventory/vod-categories.json
          test -s test/provider-inventory/series-categories.json
          test -s test/provider-inventory/provider-full.m3u

          echo "All provider inventory files downloaded"

      - name: Create readable category lists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_dir = Path("test/provider-inventory")
          output_dir = Path("config/provider-inventory")

          output_dir.mkdir(parents=True, exist_ok=True)

          category_sources = [
              (
                  "LIVE TV GROUPS",
                  source_dir / "live-categories.json",
                  output_dir / "live-groups.txt",
              ),
              (
                  "MOVIE / VOD CATEGORIES",
                  source_dir / "vod-categories.json",
                  output_dir / "vod-categories.txt",
              ),
              (
                  "SERIES CATEGORIES",
                  source_dir / "series-categories.json",
                  output_dir / "series-categories.txt",
              ),
          ]

          summary_lines = [
              "PROVIDER CATEGORY INVENTORY",
              "===========================",
              "",
          ]

          for heading, source_path, output_path in category_sources:
              try:
                  data = json.loads(
                      source_path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )
                  )
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      f"Invalid JSON returned for {heading}: {error}"
                  )

              if not isinstance(data, list):
                  raise SystemExit(
                      f"Expected a category list for {heading}, "
                      f"but provider returned: {type(data).__name__}"
                  )

              categories = []

              for item in data:
                  if not isinstance(item, dict):
                      continue

                  category_id = str(
                      item.get("category_id", "")
                  ).strip()

                  category_name = str(
                      item.get("category_name", "")
                  ).strip()

                  parent_id = str(
                      item.get("parent_id", "")
                  ).strip()

                  if not category_name:
                      continue

                  categories.append({
                      "id": category_id,
                      "name": category_name,
                      "parent_id": parent_id,
                  })

              def sort_key(item):
                  name = item["name"].upper()

                  try:
                      numeric_id = int(item["id"])
                  except (TypeError, ValueError):
                      numeric_id = 999999999

                  return name, numeric_id

              categories.sort(key=sort_key)

              output_lines = [
                  heading,
                  "=" * len(heading),
                  "",
                  f"Total categories: {len(categories):,}",
                  "",
                  "CATEGORY ID | CATEGORY NAME",
                  "------------|--------------",
              ]

              for category in categories:
                  output_lines.append(
                      f'{category["id"]} | {category["name"]}'
                  )

              output_path.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8",
              )

              summary_lines.extend([
                  heading,
                  "-" * len(heading),
                  f"Total: {len(categories):,}",
                  f"File: {output_path}",
                  "",
              ])

              print(
                  f"{heading}: {len(categories):,} categories"
              )

          m3u_path = source_dir / "provider-full.m3u"

          m3u_size = m3u_path.stat().st_size

          with m3u_path.open(
              "r",
              encoding="utf-8",
              errors="replace",
          ) as file:
              first_lines = []

              for _ in range(30):
                  line = file.readline()

                  if not line:
                      break

                  first_lines.append(line.rstrip("\n"))

          sample_path = output_dir / "provider-m3u-sample.txt"

          sample_lines = [
              "PROVIDER M3U FORMAT SAMPLE",
              "==========================",
              "",
              f"Full M3U size: {m3u_size:,} bytes",
              "",
              "First 30 lines:",
              "---------------",
              *first_lines,
          ]

          sample_path.write_text(
              "\n".join(sample_lines) + "\n",
              encoding="utf-8",
          )

          summary_path = output_dir / "inventory-summary.txt"

          summary_lines.extend([
              "FULL M3U",
              "--------",
              f"Downloaded size: {m3u_size:,} bytes",
              "The complete M3U is kept only as a workflow artifact.",
              "A 30-line format sample is committed to the repository.",
              "",
          ])

          summary_path.write_text(
              "\n".join(summary_lines) + "\n",
              encoding="utf-8",
          )

          print(f"Created {summary_path}")
          print(f"Created {sample_path}")
          PY

      - name: Display inventory summary
        run: |
          echo
          cat config/provider-inventory/inventory-summary.txt

          echo
          echo "Generated category files:"
          ls -lh config/provider-inventory

          echo
          echo "Complete provider M3U:"
          ls -lh test/provider-inventory/provider-full.m3u

      - name: Upload complete provider inventory
        uses: actions/upload-artifact@v4
        with:
          name: provider-inventory
          path: |
            test/provider-inventory/live-categories.json
            test/provider-inventory/vod-categories.json
            test/provider-inventory/series-categories.json
            test/provider-inventory/provider-full.m3u
          retention-days: 7

      - name: Commit readable category lists
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/provider-inventory/

          if git diff --cached --quiet; then
            echo "No inventory changes to commit"
            exit 0
          fi

          git commit -m "Update provider category inventory"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Inventory pushed successfully"
              exit 0
            fi

            sleep 5
          done

          echo "Failed to push inventory after 3 attempts"
          exit 1
