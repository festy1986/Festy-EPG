name: TEST Provider Category Inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory-provider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found"

      - name: Download category lists
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p test/provider-inventory
          mkdir -p config/provider-inventory

          BASE_URL="${XTREAM_URL%/}"

          API_URL="${BASE_URL}/player_api.php?username=${XTREAM_USERNAME}&password=${XTREAM_PASSWORD}"

          echo "Downloading all live TV groups..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/live-categories.json \
            "${API_URL}&action=get_live_categories"

          echo "Downloading all movie/VOD categories..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/vod-categories.json \
            "${API_URL}&action=get_vod_categories"

          echo "Downloading all series categories..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            --output test/provider-inventory/series-categories.json \
            "${API_URL}&action=get_series_categories"

          test -s test/provider-inventory/live-categories.json
          test -s test/provider-inventory/vod-categories.json
          test -s test/provider-inventory/series-categories.json

          echo "All category lists downloaded successfully"

      - name: Create readable category lists
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          source_dir = Path("test/provider-inventory")
          output_dir = Path("config/provider-inventory")

          output_dir.mkdir(parents=True, exist_ok=True)

          category_sources = [
              (
                  "LIVE TV GROUPS",
                  source_dir / "live-categories.json",
                  output_dir / "live-groups.txt",
              ),
              (
                  "MOVIE / VOD CATEGORIES",
                  source_dir / "vod-categories.json",
                  output_dir / "vod-categories.txt",
              ),
              (
                  "SERIES CATEGORIES",
                  source_dir / "series-categories.json",
                  output_dir / "series-categories.txt",
              ),
          ]

          summary_lines = [
              "PROVIDER CATEGORY INVENTORY",
              "===========================",
              "",
          ]

          for heading, source_path, output_path in category_sources:
              raw_text = source_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              try:
                  data = json.loads(raw_text)
              except json.JSONDecodeError as error:
                  print(raw_text[:1000])

                  raise SystemExit(
                      f"Invalid JSON returned for {heading}: {error}"
                  )

              if not isinstance(data, list):
                  raise SystemExit(
                      f"Expected a list for {heading}, "
                      f"but received {type(data).__name__}"
                  )

              categories = []

              for item in data:
                  if not isinstance(item, dict):
                      continue

                  category_id = str(
                      item.get("category_id", "")
                  ).strip()

                  category_name = str(
                      item.get("category_name", "")
                  ).strip()

                  parent_id = str(
                      item.get("parent_id", "")
                  ).strip()

                  if not category_name:
                      continue

                  categories.append({
                      "id": category_id,
                      "name": category_name,
                      "parent_id": parent_id,
                  })

              categories.sort(
                  key=lambda item: (
                      item["name"].casefold(),
                      item["id"],
                  )
              )

              output_lines = [
                  heading,
                  "=" * len(heading),
                  "",
                  f"Total categories: {len(categories):,}",
                  "",
                  "CATEGORY ID | CATEGORY NAME",
                  "------------|--------------",
              ]

              for category in categories:
                  output_lines.append(
                      f'{category["id"]} | {category["name"]}'
                  )

              output_path.write_text(
                  "\n".join(output_lines) + "\n",
                  encoding="utf-8",
              )

              summary_lines.extend([
                  heading,
                  "-" * len(heading),
                  f"Total categories: {len(categories):,}",
                  f"File: {output_path}",
                  "",
              ])

              print(
                  f"{heading}: {len(categories):,} categories"
              )

          summary_path = output_dir / "inventory-summary.txt"

          summary_path.write_text(
              "\n".join(summary_lines) + "\n",
              encoding="utf-8",
          )

          print(f"Created {summary_path}")
          PY

      - name: Display category inventory
        run: |
          set -euo pipefail

          echo
          cat config/provider-inventory/inventory-summary.txt

          echo
          echo "Generated files:"
          ls -lh config/provider-inventory

          echo
          echo "Live groups preview:"
          head -n 40 config/provider-inventory/live-groups.txt

          echo
          echo "VOD categories preview:"
          head -n 40 config/provider-inventory/vod-categories.txt

          echo
          echo "Series categories preview:"
          head -n 40 config/provider-inventory/series-categories.txt

      - name: Commit category inventory
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/provider-inventory/

          if git diff --cached --quiet; then
            echo "No category changes to commit"
            exit 0
          fi

          git commit -m "Update provider category inventory"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Category inventory pushed successfully"
              exit 0
            fi

            sleep 5
          done

          echo "Failed to push inventory after 3 attempts"
          exit 1
