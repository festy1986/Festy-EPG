name: Canada Combined TiviMate READY

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write

concurrency:
  group: canada-combined-tivimate
  cancel-in-progress: false

jobs:
  build-canada-combined:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fresh Jessman Canada guide
        run: |
          mkdir -p canadacombined/source
          mkdir -p canadacombined/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7dayiptv/Canada.xml \
            -o canadacombined/source/jessman.xml

          test -s canadacombined/source/jessman.xml

          echo "Fresh Jessman Canada guide downloaded"
          ls -lh canadacombined/source/jessman.xml

      - name: Download fresh IPTV-EPG.org Canada guide
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-ca.xml.gz \
            -o canadacombined/source/iptvorg.xml.gz

          test -s canadacombined/source/iptvorg.xml.gz

          echo "Fresh IPTV-EPG.org Canada guide downloaded"
          ls -lh canadacombined/source/iptvorg.xml.gz

      - name: Process and rebuild Canada Combined guide
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cat > /tmp/build_canada_combined.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const jessmanPath =
            'canadacombined/source/jessman.xml'

          const iptvOrgPath =
            'canadacombined/source/iptvorg.xml.gz'

          const outputPath =
            'canadacombined/work/canada-combined.xml'

          const now =
            new Date()

          const pastCutoff =
            new Date(
              now.getTime() -
              3 *
              24 *
              60 *
              60 *
              1000
            )

          const cutoff =
            new Date(
              now.getTime() +
              7 *
              24 *
              60 *
              60 *
              1000
            )

          const providerPath =
            'config/canada_channels.txt'

          const providerChannels = []
          const providerById = new Map()
          const jessmanChannels = new Map()
          const iptvOrgChannels = new Map()

          function channelMatchKey(value) {
            const ignored = new Set([
              'ca', 'canada', 'en', 'fr', 'hd', 'sd', 'channel', 'tv',
              'television', 'east', 'west', 'network', 'the'
            ])

            return String(value || '')
              .toLowerCase()
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/g, ' ')
              .split(/\s+/)
              .filter(token => token && !ignored.has(token))
              .join(' ')
          }

          function loadProviderChannels() {
            const lines = fs.readFileSync(providerPath, 'utf8').split(/\r?\n/)

            for (const line of lines) {
              if (!line.trim() || line.trim().startsWith('#')) continue
              const parts = line.split('|').map(value => value.trim())
              if (parts.length !== 4 || !/^\d+$/.test(parts[0]) || !parts[3]) continue

              const provider = {
                id: parts[0],
                categoryId: parts[1],
                epgId: parts[2],
                displayName: parts[3],
                key: channelMatchKey(parts[3])
              }

              if (!provider.key || providerById.has(provider.id)) continue
              providerChannels.push(provider)
              providerById.set(provider.id, provider)
            }

            if (!providerChannels.length) {
              throw new Error(`No valid Canada provider channels found in ${providerPath}`)
            }
          }

          function findProviders(displayNames, excludedIds) {
            const sourceKeys = new Set(displayNames.map(channelMatchKey).filter(Boolean))
            return providerChannels.filter(provider =>
              !excludedIds.has(provider.id) && sourceKeys.has(provider.key)
            )
          }

          const jessman =
            new Map()

          const iptvOrg =
            new Map()

          const channelHeaders =
            new Map()

          const jessmanIdToName =
            new Map()

          let jessmanChannelsFound =
            0

          let iptvOrgChannelsFound =
            0

          let jessmanProgrammesScanned =
            0

          let iptvOrgProgrammesScanned =
            0

          let jessmanProgrammesKept =
            0

          let iptvOrgProgrammesKept =
            0

          let jessmanProgrammesSkipped =
            0

          let iptvOrgProgrammesSkipped =
            0

          let jessmanDescriptionsChanged =
            0

          let iptvOrgDescriptionsChanged =
            0

          let jessmanActorsRemoved =
            0

          let iptvOrgActorsRemoved =
            0

          let jessmanCreditsRemoved =
            0

          let iptvOrgCreditsRemoved =
            0

          let jessmanEpisodeNumbersConverted =
            0

          let iptvOrgEpisodeNumbersConverted =
            0

          let jessmanOriginalAirDatesUsed =
            0

          let iptvOrgOriginalAirDatesUsed =
            0

          let jessmanIptvMatches =
            0

          let iptvOnlyProgrammes =
            0

          let jessmanOnlyProgrammes =
            0

          let iptvFieldsUsed =
            0

          let tvmazeMatches =
            0

          let tvmazeFieldsUsed =
            0

          let tmdbMatches =
            0

          let tmdbFieldsUsed =
            0

          let combinedProgrammes =
            0

          function decodeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&amp;/g,
                '&'
              )
              .replace(
                /&quot;/g,
                '"'
              )
              .replace(
                /&apos;/g,
                "'"
              )
              .replace(
                /&lt;/g,
                '<'
              )
              .replace(
                /&gt;/g,
                '>'
              )
          }

          function escapeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&/g,
                '&amp;'
              )
              .replace(
                /</g,
                '&lt;'
              )
              .replace(
                />/g,
                '&gt;'
              )
              .replace(
                /"/g,
                '&quot;'
              )
              .replace(
                /'/g,
                '&apos;'
              )
          }

          function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function removeEmbeddedCredits(
            value
          ) {
            let result =
              cleanSpaces(
                value
              )

            const protectedDates =
              []

            result =
              result.replace(
                /\(\d{2}\/\d{2}\/\d{4}\)/g,
                match => {
                  const token =
                    '__AIRDATE_' +
                    protectedDates.length +
                    '__'

                  protectedDates.push(
                    match
                  )

                  return token
                }
              )

            result =
              result.replace(
                /\([^()]*\)/g,
                ''
              )

            result =
              result.replace(
                /\s+[A-Z][A-Za-z.'-]*(?:\s*,\s*[A-Z][A-Za-z.'-]*)*(?:\s+(?:and|&)\s+[A-Z][A-Za-z.'-]*)\s+(?:star|stars|starring)\.?\s*$/i,
                ''
              )

            result =
              result.replace(
                /\s+(?:with|featuring|featuring performances by|with performances by)\s+[^.!?]*[.!?]?\s*$/i,
                ''
              )

            result =
              result.replace(
                /\s+\*+\s*$/g,
                ''
              )

            result =
              result.replace(
                /\s+\.\s*$/g,
                ''
              )

            result =
              result.replace(
                /\s{2,}/g,
                ' '
              )
                .trim()

            result =
              result.replace(
                /__AIRDATE_(\d+)__/g,
                (
                  match,
                  index
                ) =>
                  protectedDates[
                    Number(
                      index
                    )
                  ] ||
                  ''
              )

            return cleanSpaces(
              result
            )
          }

          function normalizeChannelName(
            value
          ) {
            return cleanSpaces(
              value
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              episodeNumber
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const fromStructured =
              parseOriginalAirDate(
                structured
              )

            if (
              fromStructured
            ) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''

            if (
              episodeTitle &&
              episodeNumber
            ) {
              result =
                episodeTitle +
                ' - ' +
                episodeNumber
            } else if (
              episodeTitle
            ) {
              result =
                episodeTitle
            } else if (
              episodeNumber
            ) {
              result =
                episodeNumber
            }

            if (
              description
            ) {
              result =
                result
                  ? result +
                    '. ' +
                    description
                  :
                    description
            }

            if (
              airDate
            ) {
              result =
                result
                  ? result +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'
            }

            return cleanSpaces(
              result
            )
          }

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          function cleanProgrammeBlock(
            block,
            source
          ) {
            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const airDate =
              extractAirDate(
                block
              )

            const cleanedOriginalDescription =
              removeEmbeddedCredits(
                originalDescription
              )

            const description =
              buildDescription(
                episodeTitle,
                episodeNumber,
                cleanedOriginalDescription,
                airDate
              )

            if (
              description !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }
            }

            if (
              episodeNumber
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanEpisodeNumbersConverted++
              } else {
                iptvOrgEpisodeNumbersConverted++
              }
            }

            if (
              airDate
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanOriginalAirDatesUsed++
              } else {
                iptvOrgOriginalAirDatesUsed++
              }
            }

            let output =
              block

            output =
              replaceTag(
                output,
                'title',
                cleanSpaces(
                  getTag(
                    block,
                    'title'
                  )
                    .replace(
                      /\s+\(\d{4}\)\s*$/,
                      ''
                    )
                )
              )

            output =
              replaceTag(
                output,
                'desc',
                description
              )

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            return {
              block:
                output,

              title:
                cleanSpaces(
                  getTag(
                    block,
                    'title'
                  )
                    .replace(
                      /\s+\(\d{4}\)\s*$/,
                      ''
                    )
                ),

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon:
                getAttribute(
                  block.match(
                    /<icon\b[^>]*>/i
                  )?.[0] ||
                  '',
                  'src'
                )
            }
          }

          function processProgramme(
            block,
            source,
            canonicalChannel
          ) {
            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesScanned++
            } else {
              iptvOrgProgrammesScanned++
            }

            const scanned = source === 'jessman'
              ? jessmanProgrammesScanned
              : iptvOrgProgrammesScanned

            if (scanned % 5000 === 0) {
              console.log(`${source}: ${scanned} selected programme blocks processed`)
            }

            const start =
              getAttribute(
                block,
                'start'
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < pastCutoff ||
              startDate >= cutoff
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanProgrammesSkipped++
              } else {
                iptvOrgProgrammesSkipped++
              }

              return null
            }

            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesKept++
            } else {
              iptvOrgProgrammesKept++
            }

            const cleaned =
              cleanProgrammeBlock(
                block,
                source
              )

            // Source IDs are used only while reading the upstream guide.
            // The output must use the provider stream ID from canada_channels.txt.
            const channel = canonicalChannel

            const key =
              [
                canonicalChannel,
                start,
                normalizeTitle(
                  cleaned.title
                )
              ].join(
                '|'
              )

            return {
              source,

              channel,

              canonicalChannel,

              start,

              stop:
                getAttribute(
                  block,
                  'stop'
                ),

              title:
                cleaned.title,

              episodeTitle:
                cleaned.episodeTitle,

              episodeNumber:
                cleaned.episodeNumber,

              airDate:
                cleaned.airDate,

              description:
                cleaned.description,

              icon:
                cleaned.icon,

              block:
                cleaned.block,

              key
            }
          }

          function parseXmlStream(
            stream,
            callback
          ) {
            return new Promise(
              (
                resolve,
                reject
              ) => {
                const rl =
                  readline.createInterface(
                    {
                      input:
                        stream,

                      crlfDelay:
                        Infinity
                    }
                  )

                let insideChannel =
                  false

                let channelBuffer =
                  ''

                let insideProgramme =
                  false

                let programmeBuffer =
                  ''

                ;(async () => {
                  try {
                    for await (
                      const line of rl
                    ) {
                      if (
                        !insideChannel &&
                        !insideProgramme &&
                        line.includes(
                          '<channel '
                        )
                      ) {
                        insideChannel =
                          true

                        channelBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideChannel
                      ) {
                        channelBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        line.includes(
                          '<programme '
                        )
                      ) {
                        insideProgramme =
                          true

                        programmeBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideProgramme
                      ) {
                        programmeBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }
                      }
                    }

                    resolve()
                  } catch (
                    error
                  ) {
                    reject(
                      error
                    )
                  }
                })()
              }
            )
          }

          // Reads complete XML blocks directly. This keeps the Combined FAST
          // matching and curation rules intact while avoiding a slow await for
          // every line in the large Canada source files.
          function parseXmlText(xml, callback, source) {
            let channelsRead = 0
            let programmesRead = 0

            for (const match of xml.matchAll(/<channel\b[^>]*>[\s\S]*?<\/channel>/gi)) {
              channelsRead++
              callback('channel', match[0])
            }
            console.log(`${source}: read ${channelsRead} channel blocks`)

            for (const match of xml.matchAll(/<programme\b[^>]*>[\s\S]*?<\/programme>/gi)) {
              programmesRead++
              callback('programme', match[0])
              if (programmesRead % 25000 === 0) {
                console.log(`${source}: read ${programmesRead} programme blocks`)
              }
            }
            console.log(`${source}: read ${programmesRead} programme blocks total`)
          }

          // Jessman Canada is over 600 MB, beyond Node's maximum single string
          // size. Stream it safely while still reporting real progress.
          function parseXmlFastStream(stream, callback, source) {
            return new Promise((resolve, reject) => {
              const rl = readline.createInterface({ input: stream, crlfDelay: Infinity })
              let insideChannel = false
              let channelBuffer = ''
              let insideProgramme = false
              let programmeBuffer = ''
              let channelBlocks = 0
              let programmeBlocks = 0

              const finishChannel = () => {
                insideChannel = false
                channelBlocks++
                callback('channel', channelBuffer)
                channelBuffer = ''
              }
              const finishProgramme = () => {
                insideProgramme = false
                programmeBlocks++
                callback('programme', programmeBuffer)
                programmeBuffer = ''
                if (programmeBlocks % 25000 === 0) console.log(`${source}: read ${programmeBlocks} programme blocks`)
              }

              rl.on('line', line => {
                if (!insideChannel && !insideProgramme && line.includes('<channel ')) {
                  insideChannel = true
                  channelBuffer = line + '\n'
                  if (line.includes('</channel>')) finishChannel()
                  return
                }
                if (insideChannel) {
                  channelBuffer += line + '\n'
                  if (line.includes('</channel>')) finishChannel()
                  return
                }
                if (!insideProgramme && line.includes('<programme ')) {
                  insideProgramme = true
                  programmeBuffer = line + '\n'
                  if (line.includes('</programme>')) finishProgramme()
                  return
                }
                if (insideProgramme) {
                  programmeBuffer += line + '\n'
                  if (line.includes('</programme>')) finishProgramme()
                }
              })
              rl.once('close', () => {
                console.log(`${source}: read ${channelBlocks} channels and ${programmeBlocks} programme blocks`)
                resolve()
              })
              rl.once('error', reject)
              stream.once('error', reject)
            })
          }

          async function loadJessman() {
            await parseXmlFastStream(
              fs.createReadStream(jessmanPath),
              (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayNames =
                    getAllTags(
                      block,
                      'display-name'
                    )

                  const providers =
                    findProviders(
                      displayNames,
                      new Set(jessmanChannels.keys())
                    )

                  if (!providers.length) {
                    return
                  }

                  jessmanChannelsFound++

                  jessmanIdToName.set(
                    id,
                    providers.map(provider => provider.id)
                  )

                  providers.forEach((provider, index) => {
                    jessmanChannels.set(provider.id, provider)

                    channelHeaders.set('jessman:' + provider.id, {
                      source: 'jessman',
                      id: provider.id,
                      canonicalChannel: provider.id,
                      displayName: providers.length > 1
                        ? `${provider.displayName} ${index + 1}`
                        : provider.displayName,
                      block
                    })

                    console.log(
                      'Jessman channel matched: ' + provider.displayName +
                      ' -> ' + id + ' -> TiViMate ID ' + provider.id
                    )
                  })

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const canonicalChannels =
                  jessmanIdToName.get(
                    channel
                  )

                if (
                  !canonicalChannels
                ) {
                  return
                }

                for (const canonicalChannel of canonicalChannels) {
                  const programme = processProgramme(block, 'jessman', canonicalChannel)
                  if (!programme) continue
                  if (!jessman.has(canonicalChannel)) jessman.set(canonicalChannel, new Map())
                  jessman.get(canonicalChannel).set(programme.key, programme)
                }
              },
              'Jessman'
            )
          }

          async function loadIptvOrg() {
            const input = fs.createReadStream(iptvOrgPath)
            const gunzip = zlib.createGunzip()
            input.pipe(gunzip)

            await parseXmlFastStream(
              gunzip,
              (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const alreadySelected = new Set([
                    ...jessmanChannels.keys(),
                    ...Array.from(iptvOrgChannels.values()).flatMap(providers => providers.map(provider => provider.id))
                  ])

                  const providers =
                    findProviders(
                      getAllTags(block, 'display-name'),
                      alreadySelected
                    )

                  if (!providers.length) {
                    return
                  }

                  iptvOrgChannelsFound++

                  iptvOrgChannels.set(id, providers)

                  providers.forEach((provider, index) => {
                    channelHeaders.set('iptv:' + provider.id, {
                      source: 'iptvorg',
                      id: provider.id,
                      canonicalChannel: provider.id,
                      displayName: providers.length > 1
                        ? `${provider.displayName} ${index + 1}`
                        : provider.displayName,
                      block
                    })
                  })

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const providers = iptvOrgChannels.get(channel)

                if (!providers) {
                  return
                }

                for (const provider of providers) {
                  const canonicalChannel = provider.id
                  const programme = processProgramme(block, 'iptvorg', canonicalChannel)
                  if (!programme) continue
                  if (!iptvOrg.has(canonicalChannel)) iptvOrg.set(canonicalChannel, new Map())
                  iptvOrg.get(canonicalChannel).set(programme.key, programme)
                }
              },
              'IPTV-EPG.org'
            )
          }

          function fillMissingField(
            target,
            field,
            value,
            source
          ) {
            if (
              target[field]
            ) {
              return false
            }

            if (
              !value
            ) {
              return false
            }

            target[field] =
              value

            if (
              source ===
              'iptvorg'
            ) {
              iptvFieldsUsed++
            }

            if (
              source ===
              'tvmaze'
            ) {
              tvmazeFieldsUsed++
            }

            if (
              source ===
              'tmdb'
            ) {
              tmdbFieldsUsed++
            }

            return true
          }

          function mergeMissingFields(
            target,
            source,
            sourceName
          ) {
            fillMissingField(
              target,
              'episodeTitle',
              source.episodeTitle,
              sourceName
            )

            fillMissingField(
              target,
              'episodeNumber',
              source.episodeNumber,
              sourceName
            )

            fillMissingField(
              target,
              'description',
              source.description,
              sourceName
            )

            fillMissingField(
              target,
              'airDate',
              source.airDate,
              sourceName
            )

            fillMissingField(
              target,
              'icon',
              source.icon,
              sourceName
            )
          }

          const tvmazeCache =
            new Map()

          const tvmazeEpisodeCache =
            new Map()

          const tmdbCache =
            new Map()

          const tmdbEpisodeCache =
            new Map()

          const METADATA_CONCURRENCY = 2

          function sleep(
            milliseconds
          ) {
            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  milliseconds
                )
            )
          }

          async function fetchJson(
            url,
            headers = {}
          ) {
            try {
              const response =
                await fetch(
                  url,
                  {
                    headers
                  }
                )

              if (
                !response.ok
              ) {
                return null
              }

              return await response.json()
            } catch (
              error
            ) {
              return null
            }
          }

          async function getTvmazeShow(
            title
          ) {
            const key =
              normalizeTitle(
                title
              )

            if (
              tvmazeCache.has(
                key
              )
            ) {
              return tvmazeCache.get(
                key
              )
            }

            const data =
              await fetchJson(
                'https://api.tvmaze.com/search/shows?q=' +
                encodeURIComponent(
                  title
                )
              )

            await sleep(
              250
            )

            const result =
              data &&
              data.length
                ? data[0].show
                : null

            tvmazeCache.set(
              key,
              result
            )

            return result
          }

          async function enrichFromTvmaze(
            programme
          ) {
            if (
              programme.episodeTitle &&
              programme.description &&
              programme.airDate &&
              programme.icon
            ) {
              return
            }

            if (
              !programme.episodeNumber
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const show =
              await getTvmazeShow(
                programme.title
              )

            if (
              !show
            ) {
              return
            }

            const episodeKey =
              show.id + ':' + match[1] + ':' + match[2]

            let episodeData =
              tvmazeEpisodeCache.get(episodeKey)

            if (episodeData === undefined) {
              episodeData = await fetchJson(
                'https://api.tvmaze.com/shows/' + show.id +
                '/episodebynumber?season=' + Number(match[1]) +
                '&number=' + Number(match[2])
              )
              tvmazeEpisodeCache.set(episodeKey, episodeData)
              await sleep(250)
            }

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            used =
              fillMissingField(
                programme,
                'episodeTitle',
                cleanSpaces(
                  episodeData.name
                ),
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'description',
                cleanSpaces(
                  episodeData.summary
                    ? episodeData.summary
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                    : ''
                ),
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'airDate',
                episodeData.airdate
                  ? episodeData.airdate
                    .split(
                      '-'
                    )
                    .reverse()
                    .join(
                      '/'
                    )
                  : '',
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'icon',
                episodeData.image
                  ? (
                    episodeData.image.original ||
                    episodeData.image.medium
                  )
                  : '',
                'tvmaze'
              ) ||
              used

            if (
              used
            ) {
              tvmazeMatches++
            }
          }

          async function enrichFromTmdb(
            programme
          ) {
            if (
              !process.env.TMDB_API_TOKEN
            ) {
              return
            }

            if (
              !programme.episodeNumber
            ) {
              return
            }

            if (
              programme.episodeTitle &&
              programme.description &&
              programme.airDate
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const cacheKey =
              normalizeTitle(
                programme.title
              )

            let show =
              tmdbCache.get(
                cacheKey
              )

            if (
              !show
            ) {
              const searchData =
                await fetchJson(
                  'https://api.themoviedb.org/3/search/tv?query=' +
                  encodeURIComponent(
                    programme.title
                  ),
                  {
                    Authorization:
                      'Bearer ' +
                      process.env.TMDB_API_TOKEN,

                    accept:
                      'application/json'
                  }
                )

              show =
                searchData &&
                searchData.results &&
                searchData.results.length
                  ? searchData.results[0]
                  : null

              tmdbCache.set(
                cacheKey,
                show
              )

              await sleep(
                250
              )
            }

            if (
              !show
            ) {
              return
            }

            const episodeKey =
              show.id + ':' + match[1] + ':' + match[2]

            let episodeData =
              tmdbEpisodeCache.get(episodeKey)

            if (episodeData === undefined) {
              episodeData = await fetchJson(
                'https://api.themoviedb.org/3/tv/' + show.id +
                '/season/' + Number(match[1]) + '/episode/' + Number(match[2]),
                {
                  Authorization: 'Bearer ' + process.env.TMDB_API_TOKEN,
                  accept: 'application/json'
                }
              )
              tmdbEpisodeCache.set(episodeKey, episodeData)
              await sleep(250)
            }

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            used =
              fillMissingField(
                programme,
                'episodeTitle',
                cleanSpaces(
                  episodeData.name
                ),
                'tmdb'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'description',
                cleanSpaces(
                  episodeData.overview
                ),
                'tmdb'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'airDate',
                episodeData.air_date
                  ? episodeData.air_date
                    .split(
                      '-'
                    )
                    .reverse()
                    .join(
                      '/'
                    )
                  : '',
                'tmdb'
              ) ||
              used

            if (
              used
            ) {
              tmdbMatches++
            }
          }

          async function enrichInBatches(
            programmes,
            enrich,
            label
          ) {
            let nextIndex = 0
            let completed = 0

            async function worker() {
              while (true) {
                const index = nextIndex++
                if (index >= programmes.length) return
                await enrich(programmes[index])
                completed++
                if (completed % 500 === 0) {
                  console.log(`${label}: ${completed}/${programmes.length} programmes checked`)
                }
              }
            }

            await Promise.all(
              Array.from(
                { length: METADATA_CONCURRENCY },
                worker
              )
            )
          }

          async function buildFinalProgrammes() {
            const finalProgrammes =
              new Map()

            for (
              const programmes of
              jessman.values()
            ) {
              for (
                const programme of
                programmes.values()
              ) {
                finalProgrammes.set(
                  programme.key,
                  {
                    ...programme
                  }
                )
              }
            }

            for (
              const programmes of
              iptvOrg.values()
            ) {
              for (
                const programme of
                programmes.values()
              ) {
                const existing =
                  finalProgrammes.get(
                    programme.key
                  )

                if (
                  existing
                ) {
                  jessmanIptvMatches++

                  mergeMissingFields(
                    existing,
                    programme,
                    'iptvorg'
                  )

                  continue
                }

                finalProgrammes.set(
                  programme.key,
                  {
                    ...programme
                  }
                )

                iptvOnlyProgrammes++
              }
            }

            for (
              const programme of
              finalProgrammes.values()
            ) {
              if (
                programme.source ===
                'jessman'
              ) {
                jessmanOnlyProgrammes++
              }
            }

            const programmesToEnrich =
              Array.from(finalProgrammes.values())

            console.log(`TVMaze: checking ${programmesToEnrich.length} programmes with ${METADATA_CONCURRENCY} workers`)
            await enrichInBatches(programmesToEnrich, enrichFromTvmaze, 'TVMaze')

            console.log(`TMDB: checking ${programmesToEnrich.length} programmes with ${METADATA_CONCURRENCY} workers`)
            await enrichInBatches(programmesToEnrich, enrichFromTmdb, 'TMDB')

            return finalProgrammes
          }

          function buildChannel(
            channelHeader
          ) {
            let block =
              channelHeader.block

            const originalId =
              getAttribute(
                block,
                'id'
              )

            if (
              originalId !==
              channelHeader.id
            ) {
              block =
                block.replace(
                  /(<channel\b[^>]*\bid=")[^"]*(")/i,
                  '$1' +
                  escapeXml(
                    channelHeader.id
                  ) +
                  '$2'
                )
            }

            const displayName =
              channelHeader.displayName

            if (
              getAllTags(
                block,
                'display-name'
              ).length
            ) {
              block =
                block.replace(
                  /(<display-name\b[^>]*>)[\s\S]*?(<\/display-name>)/i,
                  '$1' +
                  escapeXml(
                    displayName
                  ) +
                  '$2'
                )
            }

            return block.trimEnd() +
              '\n'
          }

          function buildProgramme(
            programme
          ) {
            let block =
              programme.block

            const channel =
              programme.channel

            block =
              block.replace(
                /(\bchannel=")[^"]*(")/i,
                '$1' +
                escapeXml(
                  channel
                ) +
                '$2'
              )

            return block.trimEnd() +
              '\n'
          }

