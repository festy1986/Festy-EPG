name: TVguide-Tivimate

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-main
  cancel-in-progress: false

jobs:
  build-tvguide-tivimate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Build TiviMate channel source from guide plus raw IDs
        run: |
          mkdir -p epg/sites/tvguide.com

          node <<'EOF'
          const fs = require('fs')

          const sourcePath = 'guides/tvguidetivimate.xml'
          const rawPath = 'guides/tvguide.xml'
          const outputPath = 'epg/sites/tvguide.com/festy-tivimate.channels.xml'

          const aliases = {
            'MS.NOW.us': ['MSNBC.us'],
            'ESPN.NEWS.us': ['ESPN.NEWS.us', 'ESPNEWS.us'],
            'CBS.SPORTS.NETWORK.us': ['CBS.SPORTS.NETWORK.us', 'CBSSN.us'],
            'USA.NETWORK.us': ['USA.NETWORK.us', 'USA.us'],
            'PARAMOUNT.NETWORK.us': ['PARAMOUNT.NETWORK.us'],
            'COMEDY.CENTRAL.us': ['COMEDY.CENTRAL.us'],
            'BBC.AMERICA.us': ['BBC.AMERICA.us'],
            'FOOD.NETWORK.us': ['FOOD.NETWORK.us'],
            'TRAVEL.CHANNEL.us': ['TRAVEL.CHANNEL.us'],
            'DISCOVERY.LIFE.us': ['DISCOVERY.LIFE.us'],
            'DISCOVERY.FAMILY.us': ['DISCOVERY.FAMILY.us'],
            'DISCOVERY.SCIENCE.us': ['DISCOVERY.SCIENCE.us'],
            'INVESTIGATION.DISCOVERY.us': ['INVESTIGATION.DISCOVERY.us'],
            'ANIMAL.PLANET.us': ['ANIMAL.PLANET.us'],
            'NATIONAL.GEOGRAPHIC.us': ['NATIONAL.GEOGRAPHIC.us'],
            'NAT.GEO.WILD.us': ['NAT.GEO.WILD.us'],
            'SMITHSONIAN.CHANNEL.us': ['SMITHSONIAN.CHANNEL.us'],
            'THE.WEATHER.CHANNEL.us': ['THE.WEATHER.CHANNEL.us'],
            'GREAT.AMERICAN.FAMILY.us': ['GREAT.AMERICAN.FAMILY.us'],
            'DISNEY.CHANNEL.us': ['DISNEY.CHANNEL.us'],
            'CARTOON.NETWORK.us': ['CARTOON.NETWORK.us'],
            'HALLMARK.CHANNEL.us': ['HALLMARK.CHANNEL.us'],
            'HALLMARK.MYSTERY.us': ['HALLMARK.MYSTERY.us'],
            'GAME.SHOW.NETWORK.us': ['GAME.SHOW.NETWORK.us'],
            'COOKING.CHANNEL.us': ['COOKING.CHANNEL.us'],
            'OUTDOOR.CHANNEL.us': ['OUTDOOR.CHANNEL.us'],
            'AMERICAN.HEROES.CHANNEL.us': ['AMERICAN.HEROES.CHANNEL.us'],
            'CRIME.AND.INVESTIGATION.us': ['CRIME.AND.INVESTIGATION.us'],
            'PARAMOUNTPLUS.WITH.SHOWTIME.us': ['PARAMOUNTPLUS.WITH.SHOWTIME.us'],
            'SHOWTIME.2.us': ['SHOWTIME.2.us'],
            'SHOWTIME.EXTREME.us': ['SHOWTIME.EXTREME.us'],
            'SHOWTIME.FAMILY.ZONE.us': ['SHOWTIME.FAMILY.ZONE.us'],
            'SHOWTIME.NEXT.us': ['SHOWTIME.NEXT.us'],
            'SHOWTIME.WOMEN.us': ['SHOWTIME.WOMEN.us'],
            'SHOWTIME.SHOWCASE.us': ['SHOWTIME.SHOWCASE.us'],
            'THE.MOVIE.CHANNEL.us': ['THE.MOVIE.CHANNEL.us'],
            'TMC.XTRA.us': ['TMC.XTRA.us'],
            'STARZ.EDGE.us': ['STARZ.EDGE.us'],
            'STARZ.CINEMA.us': ['STARZ.CINEMA.us'],
            'STARZ.COMEDY.us': ['STARZ.COMEDY.us'],
            'STARZ.ENCORE.us': ['STARZ.ENCORE.us'],
            'STARZ.ENCORE.ACTION.us': ['STARZ.ENCORE.ACTION.us'],
            'STARZ.ENCORE.BLACK.us': ['STARZ.ENCORE.BLACK.us'],
            'STARZ.ENCORE.CLASSIC.us': ['STARZ.ENCORE.CLASSIC.us'],
            'STARZ.ENCORE.SUSPENSE.us': ['STARZ.ENCORE.SUSPENSE.us'],
            'STARZ.ENCORE.FAMILY.us': ['STARZ.ENCORE.FAMILY.us'],
            'STARZ.INBLACK.us': ['STARZ.INBLACK.us'],
            'MGMPLUS.HITS.us': ['MGMPLUS.HITS.us'],
            'MGMPLUS.MARQUEE.us': ['MGMPLUS.MARQUEE.us'],
            'MGMPLUS.DRIVE.IN.us': ['MGMPLUS.DRIVE.IN.us']
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function attr(attrs, name) {
            const m = attrs.match(new RegExp(`${name}="([^"]*)"`, 'i'))
            return m ? decodeXml(m[1]).trim() : ''
          }

          function cleanBody(body) {
            const display = body.match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/i)
            if (display) return decodeXml(display[1].replace(/<[^>]+>/g, '').trim())
            return decodeXml(body.replace(/<url>[\s\S]*?<\/url>/gi, '').replace(/<[^>]+>/g, '').trim())
          }

          function norm(s) {
            return decodeXml(s)
              .replace(/\.us$/i, '')
              .replace(/&/g, 'AND')
              .replace(/\+/g, 'PLUS')
              .replace(/[^A-Z0-9]+/gi, '.')
              .replace(/^\.+|\.+$/g, '')
              .toUpperCase()
          }

          function parseChannels(xml) {
            return [...xml.matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)].map(m => {
              const attrs = m[1]
              const body = m[2]
              return {
                id: attr(attrs, 'id') || attr(attrs, 'xmltv_id'),
                xmltv_id: attr(attrs, 'xmltv_id') || attr(attrs, 'id'),
                site_id: attr(attrs, 'site_id') || attr(attrs, 'site-id'),
                name: cleanBody(body)
              }
            })
          }

          if (!fs.existsSync(sourcePath)) {
            console.error(`Missing ${sourcePath}`)
            process.exit(1)
          }

          if (!fs.existsSync(rawPath)) {
            console.error(`Missing ${rawPath}`)
            process.exit(1)
          }

          const sourceChannels = parseChannels(fs.readFileSync(sourcePath, 'utf8'))
          const rawChannels = parseChannels(fs.readFileSync(rawPath, 'utf8'))

          const rawById = new Map()
          const rawByName = new Map()

          for (const ch of rawChannels) {
            if (ch.xmltv_id && ch.site_id) rawById.set(norm(ch.xmltv_id), ch)
            if (ch.name && ch.site_id) rawByName.set(norm(ch.name), ch)
          }

          const out = []
          const missing = []
          const seen = new Set()

          for (const src of sourceChannels) {
            const wantedId = src.id || src.xmltv_id
            const wantedName = src.name || wantedId

            let siteId = src.site_id
            let match = null

            if (!siteId) {
              const keys = [wantedId, wantedName, ...(aliases[wantedId] || [])].map(norm)

              for (const key of keys) {
                match = rawById.get(key) || rawByName.get(key)
                if (match) break
              }

              if (match) siteId = match.site_id
            }

            if (!wantedId || !siteId) {
              missing.push(`${wantedId || '(no id)'} (${wantedName})`)
              continue
            }

            const key = `${wantedId}|${siteId}`
            if (seen.has(key)) continue
            seen.add(key)

            out.push(
              `  <channel site="tvguide.com" lang="en" xmltv_id="${escapeXml(wantedId)}" site_id="${escapeXml(siteId)}">${escapeXml(wantedName)}</channel>`
            )
          }

          console.log(`Source channels: ${sourceChannels.length}`)
          console.log(`Raw channels: ${rawChannels.length}`)
          console.log(`Built channels: ${out.length}`)
          console.log(`Missing site_id after raw lookup: ${missing.length}`)

          if (missing.length) {
            console.log('\nMissing site_id:')
            missing.forEach(x => console.log(`- ${x}`))
            process.exit(1)
          }

          if (out.length < 123) {
            console.error(`Refusing to run: expected at least 123 channels, built ${out.length}`)
            process.exit(1)
          }

          fs.writeFileSync(
            outputPath,
            `<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n${out.join('\n')}\n</channels>\n`
          )
          EOF

      - name: Write enriched TVGuide config
        run: |
          cat > epg/sites/tvguide.com/tvguide.com.config.js <<'EOF'
          const axios = require('axios')
          const dayjs = require('dayjs')

          const SCHEDULE_TIMEOUT = Number(process.env.TVGUIDE_SCHEDULE_TIMEOUT || 8000)

          module.exports = {
            site: 'tvguide.com',
            delay: 200,
            days: 14,

            url({ date, channel }) {
              const [providerId, sourceId] = String(channel.site_id).split('#')
              return `https://backend.tvguide.com/tvschedules/tvguide/${providerId}/web?start=${date.startOf('d').unix()}&duration=1440&channelSourceIds=${sourceId}&apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`
            },

            request: {
              method: 'GET',
              timeout: SCHEDULE_TIMEOUT,
              cache: { ttl: 60 * 60 * 1000 },
              headers() {
                return {
                  Referer: 'https://www.tvguide.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            async parser({ content, channel, date }) {
              const data = JSON.parse(content)
              const items = data?.data?.items || []
              const sourceId = String(channel.site_id).split('#').pop()

              const match = items.find(item =>
                String(item.sourceId || item.channelSourceId || item.id || item.channel?.sourceId || '') === sourceId
              )

              const schedules = match?.programSchedules || []

              console.log(`[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${schedules.length}`)

              const programs = []
              const batchSize = 10

              for (let i = 0; i < schedules.length; i += batchSize) {
                const batch = schedules.slice(i, i + batchSize)

                const results = await Promise.all(
                  batch.map(async item => {
                    const details = await loadProgramDetails(item, channel)

                    const title = cleanTitle(item.title || details.title || '')
                    const episodeTitle = cleanSpaces(details.episodeTitle || details.subtitle || details.subTitle || '')
                    const description = cleanSpaces(details.description || item.description || '')

                    const seasonNumber = details.seasonNumber || details.season || ''
                    const episodeNumber = details.episodeNumber || details.episode || ''
                    const episodeCode = buildEpisodeCode(seasonNumber, episodeNumber)

                    const releaseYear = details.releaseYear || details.year || ''
                    const airDate =
                      formatTVGuideDate(details.originalAirDate || details.airDate || details.episodeAirDate) ||
                      formatUnixDate(details.originalAirTime || details.firstAired)

                    const programType = classifyProgramType({
                      item,
                      details,
                      episodeTitle,
                      seasonNumber,
                      episodeNumber,
                      airDate,
                      releaseYear
                    })

                    const suppressDisplayDate = shouldSuppressDisplayDate({
                      title,
                      description,
                      programType,
                      item,
                      details,
                      airDate
                    })

                    const finalDescription = buildPackedDescription({
                      programType,
                      episodeTitle,
                      episodeCode,
                      description,
                      airDate,
                      releaseYear,
                      suppressDisplayDate
                    })

                    const program = {
                      title,
                      description: finalDescription,
                      start: dayjs.unix(item.startTime),
                      stop: dayjs.unix(item.endTime),
                      category: buildCategories(programType)
                    }

                    // Keep TiviMate display clean: title-only row, all episode/date metadata packed in <desc>.
                    // Do not emit separate sub-title, episode-num, or date fields here, because TiviMate
                    // may use them to rebuild/duplicate display text outside the packed description.

                    return program
                  })
                )

                programs.push(...results)
              }

              return programs
            }
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function isRetryableDetailError(err) {
            const status = err.response?.status
            const code = err.code
            const message = String(err.message || '')

            if ([408, 429, 500, 502, 503, 504].includes(status)) return true
            if (['ECONNABORTED', 'ETIMEDOUT', 'ECONNRESET', 'ENOTFOUND', 'EAI_AGAIN'].includes(code)) return true
            if (/timeout|aborted|network|socket|reset/i.test(message)) return true

            return false
          }

          async function fetchProgramDetailsOnce(url, channelName, title, timeout, label, attempt, attempts) {
            try {
              const response = await axios.get(url, {
                timeout,
                headers: {
                  Referer: 'https://www.tvguide.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              })

              if (attempt > 1 || label.includes('MICRO')) {
                console.log(`[${label} OK] ${channelName} | ${title} | attempt=${attempt}/${attempts}`)
              }

              return {
                ok: true,
                value: response.data?.data?.item || {}
              }
            } catch (err) {
              const status = err.response?.status || err.code || err.message || 'unknown'

              if (err.response?.status === 404) {
                console.log(`[${label} MISSING] ${channelName} | ${title} | 404`)
                return {
                  ok: true,
                  value: {}
                }
              }

              return {
                ok: false,
                retryable: isRetryableDetailError(err),
                status
              }
            }
          }

          async function tryProgramDetails(url, channelName, title, options) {
            const { label, attempts, timeout, baseDelay, maxDelay } = options

            for (let attempt = 1; attempt <= attempts; attempt++) {
              const result = await fetchProgramDetailsOnce(url, channelName, title, timeout, label, attempt, attempts)

              if (result.ok) return result.value

              if (!result.retryable) {
                console.log(`[${label} FAIL] ${channelName} | ${title} | ${result.status}`)
                return null
              }

              if (attempt < attempts) {
                const delay = Math.min(maxDelay, baseDelay * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 500)
                console.log(`[${label} RETRY] ${channelName} | ${title} | ${result.status} | attempt=${attempt}/${attempts} | wait=${delay}ms`)
                await sleep(delay)
              } else {
                console.log(`[${label} EXHAUSTED] ${channelName} | ${title} | ${result.status} | attempts=${attempts}`)
              }
            }

            return null
          }

          async function loadProgramDetails(item, channel) {
            if (!item.programDetails) return {}

            const url = item.programDetails.includes('?')
              ? `${item.programDetails}&apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`
              : `${item.programDetails}?apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`

            const channelName = channel?.name || 'Unknown channel'
            const title = item.title || 'Unknown title'

            const fastResult = await tryProgramDetails(url, channelName, title, {
              label: 'DETAIL FAST',
              attempts: 1,
              timeout: 8000,
              baseDelay: 0,
              maxDelay: 0
            })

            if (fastResult) return fastResult

            const backupResult = await tryProgramDetails(url, channelName, title, {
              label: 'DETAIL BACKUP',
              attempts: 5,
              timeout: 8000,
              baseDelay: 750,
              maxDelay: 30000
            })

            if (backupResult) return backupResult

            console.log(`[DETAIL MICRO PASS] ${channelName} | ${title} | starting slow cleanup pass`)

            const microResult = await tryProgramDetails(url, channelName, title, {
              label: 'DETAIL MICRO',
              attempts: 4,
              timeout: 20000,
              baseDelay: 5000,
              maxDelay: 60000
            })

            if (microResult) return microResult

            console.log(`[DETAIL FINAL MISS] ${channelName} | ${title} | no details after fast + backup + micro`)
            return {}
          }

          function classifyProgramType({ item, details, episodeTitle, seasonNumber, episodeNumber, airDate, releaseYear }) {
            const haystack = [
              item.type,
              item.programType,
              item.entityType,
              item.category,
              item.subcategory,
              item.genres,
              details.type,
              details.programType,
              details.entityType,
              details.category,
              details.subcategory,
              details.genres,
              details.seriesId,
              details.showId,
              details.episodeId
            ]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            const hasEpisodeSignals = Boolean(
              episodeTitle ||
              seasonNumber ||
              episodeNumber ||
              details.episodeNumber ||
              details.seasonNumber ||
              details.episodeTitle ||
              details.subtitle ||
              details.subTitle ||
              details.originalAirDate ||
              details.episodeAirDate ||
              details.seriesId ||
              details.showId ||
              details.episodeId
            )

            if (/mini[\s-]?series|limited series|limited-series/.test(haystack)) return 'miniseries'
            if (/series|episode|tv show|television|scripted|reality|documentary series/.test(haystack)) return 'series'
            if (hasEpisodeSignals) return 'series'
            if (/movie|film|feature film|cinema/.test(haystack)) return 'movie'

            const durationMinutes = getDurationMinutes(item)
            if (durationMinutes >= 75 && releaseYear && !airDate && !hasEpisodeSignals) return 'movie'

            return 'program'
          }

          function getDurationMinutes(item) {
            const start = Number(item.startTime || 0)
            const end = Number(item.endTime || 0)
            if (!start || !end || end <= start) return 0
            return Math.round((end - start) / 60)
          }

          function buildCategories(programType) {
            if (programType === 'movie') return ['Movie']
            if (programType === 'miniseries') return ['Miniseries', 'Series']
            if (programType === 'series') return ['Series']
            return ['Program']
          }

          function shouldSuppressDisplayDate({ title, description, programType, item, details, airDate }) {
            if (!airDate) return false

            const haystack = [
              title,
              description,
              item?.title,
              item?.type,
              item?.programType,
              item?.entityType,
              item?.category,
              item?.subcategory,
              item?.genres,
              details?.type,
              details?.programType,
              details?.entityType,
              details?.category,
              details?.subcategory,
              details?.genres
            ]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            const liveOrCurrent = /\b(live|news|newscast|weather|sports|game|match|tournament|football|basketball|baseball|hockey|soccer|golf|tennis|racing|wwe|ufc|mma|boxing|pregame|postgame|post-game|pre-game)\b/.test(haystack)
            if (!liveOrCurrent) return false

            const scheduleDate = item?.startTime ? dayjs.unix(Number(item.startTime)) : null
            const parsedAirDate = parseDisplayDate(airDate)

            if (!scheduleDate || !scheduleDate.isValid() || !parsedAirDate || !parsedAirDate.isValid()) return true

            // For live/current news and sports, the original air date is usually just the broadcast date.
            // Suppress it when it is close to the scheduled airing. Keep it when it is genuinely old.
            return Math.abs(scheduleDate.diff(parsedAirDate, 'day')) <= 45
          }

          function parseDisplayDate(value) {
            const raw = String(value || '').trim()
            const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
            if (!m) return dayjs(raw)
            return dayjs(`${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`)
          }

          function buildPackedDescription({ programType, episodeTitle, episodeCode, description, airDate, releaseYear, suppressDisplayDate }) {
            const parts = []

            let prefix = ''
            if (programType === 'series' || programType === 'miniseries') {
              if (episodeTitle && episodeCode) prefix = `${episodeTitle} - ${episodeCode}`
              else if (episodeTitle) prefix = episodeTitle
              else if (episodeCode) prefix = episodeCode
            }

            if (prefix) parts.push(prefix)
            if (description) parts.push(description)

            let finalDescription = cleanPackedDescription(parts.join('. '))

            if (programType === 'movie') {
              if (releaseYear && !descriptionIncludesDisplayDate(finalDescription, releaseYear)) {
                finalDescription = finalDescription ? `${finalDescription} (${releaseYear})` : `(${releaseYear})`
              }
              return finalDescription
            }

            if (programType === 'series' || programType === 'miniseries') {
              if (airDate && !suppressDisplayDate && !descriptionIncludesDisplayDate(finalDescription, airDate)) {
                finalDescription = finalDescription ? `${finalDescription} (${airDate})` : `(${airDate})`
              }
              return finalDescription
            }

            const dateOrYear = suppressDisplayDate ? releaseYear : (airDate || releaseYear)
            if (dateOrYear && !descriptionIncludesDisplayDate(finalDescription, dateOrYear)) {
              finalDescription = finalDescription
                ? `${finalDescription} (${dateOrYear})`
                : `(${dateOrYear})`
            }

            return finalDescription
          }

          function cleanPackedDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }

          function descriptionIncludesDisplayDate(description, dateOrYear) {
            if (!description || !dateOrYear) return false
            const escaped = String(dateOrYear).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            return new RegExp(`\\(${escaped}\\)\\s*$`).test(description) || description.includes(String(dateOrYear))
          }

          function buildEpisodeCode(seasonNumber, episodeNumber) {
            const s = String(seasonNumber || '').trim()
            const e = String(episodeNumber || '').trim()

            if (!s && !e) return ''
            if (s && e) return `S${s}E${e}`
            if (e) return `E${e}`
            return `S${s}`
          }

          function cleanTitle(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function formatTVGuideDate(value) {
            const raw = String(value || '').trim()
            if (!raw) return ''

            const tvMatch = raw.match(/\/Date\((\d+)\)\//)
            if (tvMatch) {
              return dayjs(Number(tvMatch[1])).format('MM/DD/YYYY')
            }

            const parsed = dayjs(raw)
            if (parsed.isValid()) return parsed.format('MM/DD/YYYY')

            return ''
          }

          function formatUnixDate(value) {
            if (!value) return ''
            const parsed = dayjs.unix(Number(value))
            return parsed.isValid() ? parsed.format('MM/DD/YYYY') : ''
          }

          function normalizeXmltvDate(value) {
            const parsed = dayjs(value)
            if (!parsed.isValid()) return ''
            return parsed.format('YYYYMMDD')
          }
          EOF

      - name: Grab TiviMate guide with schedule recovery
        run: |
          cd epg

          rm -f ../guides/tvguidetivimateguide.xml
          rm -f ../guides/tvguidetivimateguide.working.xml
          rm -f ../guides/tvguidetivimateguide.pass*.xml
          rm -f ../guides/tvguidetivimateguide.pass*.log
          rm -f ../guides/tvguidetivimateguide.pass*.count
          rm -f ../guides/tvguidetivimateguide.pass*.missing.json
          rm -f ../guides/tvguidetivimateguide.pass*.retry.channels.xml
          rm -f ../guides/tvguidetivimateguide.tvmaze-missing.json

          cat > scripts/tivimate-recovery.cjs <<'EOF'
          const fs = require('fs')

          const command = process.argv[2]

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function attr(attrs, name) {
            const m = String(attrs || '').match(new RegExp(`${name}="([^"]*)"`, 'i'))
            return m ? decodeXml(m[1]).trim() : ''
          }

          function stripTags(s) {
            return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim())
          }

          function getTag(block, tag) {
            const m = String(block || '').match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i'))
            return m ? stripTags(m[1]) : ''
          }

          function getTags(block, tag) {
            return [...String(block || '').matchAll(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'gi'))]
              .map(m => stripTags(m[1]))
              .filter(Boolean)
          }

          function hasTag(block, tag) {
            return new RegExp(`<${tag}\\b`, 'i').test(String(block || ''))
          }

          function cleanBody(body) {
            const display = String(body || '').match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/i)
            if (display) return stripTags(display[1])
            return stripTags(String(body || '').replace(/<url>[\s\S]*?<\/url>/gi, ''))
          }

          function parseChannels(xml) {
            return [...String(xml || '').matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)].map(m => {
              const attrs = m[1]
              const body = m[2]
              const xmltvId = attr(attrs, 'xmltv_id') || attr(attrs, 'id')
              return {
                block: m[0],
                id: attr(attrs, 'id') || xmltvId,
                xmltv_id: xmltvId,
                site_id: attr(attrs, 'site_id') || attr(attrs, 'site-id'),
                name: cleanBody(body)
              }
            })
          }

          function parseProgrammes(xml) {
            return [...String(xml || '').matchAll(/<programme\b[\s\S]*?<\/programme>/gi)].map(m => m[0])
          }

          function programmeKey(block) {
            const header = String(block || '').match(/^<programme\b([^>]*)>/i)
            const attrs = header ? header[1] : ''
            const channel = attr(attrs, 'channel')
            const start = attr(attrs, 'start')
            const stop = attr(attrs, 'stop')
            const title = getTag(block, 'title')
            return `${channel}|${start}|${stop}|${title}`
          }

          function channelOfProgramme(block) {
            const header = String(block || '').match(/^<programme\b([^>]*)>/i)
            return header ? attr(header[1], 'channel') : ''
          }

          function dateOfProgramme(block) {
            const header = String(block || '').match(/^<programme\b([^>]*)>/i)
            const start = header ? attr(header[1], 'start') : ''
            return start.slice(0, 8)
          }

          function isMovie(block) {
            return getTags(block, 'category').some(c => /^(movie|film)$/i.test(c))
          }

          function isSeries(block) {
            return getTags(block, 'category').some(c => /^(series|miniseries)$/i.test(c))
          }

          function splitDesc(desc) {
            const cleaned = String(desc || '').replace(/\s+/g, ' ').trim()
            const dateMatch = cleaned.match(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/)
            const withoutDate = dateMatch ? cleaned.slice(0, dateMatch.index).trim() : cleaned
            const firstSentence = withoutDate.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            const prefix = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            const codeOnly = first.match(/^(S\d+E\d+|S\d+|E\d+)$/i)

            return {
              raw: cleaned,
              hasDate: Boolean(dateMatch),
              hasEpisodeCode: /\bS\d+E\d+\b/i.test(cleaned),
              hasEpisodeTitle: Boolean(prefix && prefix[1]) || Boolean(first && !codeOnly && first.length <= 80),
              hasBody: Boolean(withoutDate && (!first || withoutDate.length > first.length + 2))
            }
          }

          function missingFields(block) {
            const missing = []
            const title = getTag(block, 'title')
            const desc = getTag(block, 'desc')
            const categories = getTags(block, 'category')
            const parts = splitDesc(desc)

            if (!title) missing.push('title')
            if (!categories.length) missing.push('category')
            if (!desc) missing.push('description')

            if (desc && isSeries(block)) {
              if (!parts.hasEpisodeTitle) missing.push('episodeTitle')
              if (!parts.hasEpisodeCode) missing.push('episodeCode')
              if (!parts.hasDate) missing.push('airDate')
            }

            if (desc && isMovie(block)) {
              if (!parts.hasDate) missing.push('releaseYear')
            }

            return [...new Set(missing)]
          }

          function completionScore(block) {
            const missing = missingFields(block)
            const desc = getTag(block, 'desc')
            let score = 0
            if (getTag(block, 'title')) score += 10
            if (hasTag(block, 'category')) score += 10
            if (desc) score += 20
            if (splitDesc(desc).hasEpisodeTitle) score += 5
            if (splitDesc(desc).hasEpisodeCode) score += 5
            if (splitDesc(desc).hasDate) score += 5
            score -= missing.length
            return score
          }

          function parseZeroProgramDays(logText, channels) {
            const out = []
            const byName = new Map()
            for (const ch of channels) {
              if (ch.name) byName.set(ch.name.toLowerCase(), ch)
            }

            for (const line of String(logText || '').split(/\r?\n/)) {
              const m = line.match(/\[PULL\]\s+(.+?)\s+\|\s+(\d{4}-\d{2}-\d{2})\s+\|\s+programs=0/i)
              if (!m) continue

              const name = m[1].trim()
              const date = m[2].replace(/-/g, '')
              const ch = byName.get(name.toLowerCase())

              out.push({
                channel: ch?.xmltv_id || name,
                date,
                missing: ['programmes'],
                reason: 'programs=0'
              })
            }

            return out
          }

          function writeRetryChannels(allChannelsPath, missingPath, outputPath) {
            const channelsXml = fs.readFileSync(allChannelsPath, 'utf8')
            const missing = JSON.parse(fs.readFileSync(missingPath, 'utf8'))
            const channels = parseChannels(channelsXml)
            const needed = new Set(missing.map(x => x.channel).filter(Boolean))
            const out = channels.filter(ch => needed.has(ch.xmltv_id) || needed.has(ch.id) || needed.has(ch.name))

            fs.writeFileSync(
              outputPath,
              `<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n${out.map(ch => `  ${ch.block.replace(/\n/g, '\n  ')}`).join('\n')}\n</channels>\n`
            )

            console.log(`[RECOVERY] retry channels written: ${out.length}`)
          }

          function analyze({ channelsPath, guidePath, logPath, missingPath, retryChannelsPath }) {
            const channelsXml = fs.readFileSync(channelsPath, 'utf8')
            const guideXml = fs.existsSync(guidePath) ? fs.readFileSync(guidePath, 'utf8') : ''
            const logText = logPath && fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : ''
            const channels = parseChannels(channelsXml)
            const programmes = parseProgrammes(guideXml)

            const missing = []
            const seenProgrammeChannels = new Set()

            for (const block of programmes) {
              const channel = channelOfProgramme(block)
              const date = dateOfProgramme(block)
              if (channel) seenProgrammeChannels.add(channel)

              const fields = missingFields(block)
              if (fields.length) {
                missing.push({
                  channel,
                  date,
                  title: getTag(block, 'title'),
                  start: (String(block).match(/start="([^"]+)"/i) || [])[1] || '',
                  stop: (String(block).match(/stop="([^"]+)"/i) || [])[1] || '',
                  missing: fields,
                  reason: 'metadata'
                })
              }
            }

            for (const ch of channels) {
              if (ch.xmltv_id && !seenProgrammeChannels.has(ch.xmltv_id)) {
                missing.push({
                  channel: ch.xmltv_id,
                  date: '',
                  title: ch.name,
                  start: '',
                  stop: '',
                  missing: ['programmes'],
                  reason: 'no-programmes-for-channel'
                })
              }
            }

            missing.push(...parseZeroProgramDays(logText, channels))

            const deduped = []
            const seen = new Set()

            for (const item of missing) {
              const key = `${item.channel}|${item.date}|${item.start}|${item.stop}|${item.title}|${item.missing.join(',')}`
              if (seen.has(key)) continue
              seen.add(key)
              deduped.push(item)
            }

            fs.writeFileSync(missingPath, JSON.stringify(deduped, null, 2))
            console.log(`[RECOVERY] incomplete programme/day targets: ${deduped.length}`)

            if (retryChannelsPath) {
              writeRetryChannels(channelsPath, missingPath, retryChannelsPath)
            }
          }

          function merge({ basePath, retryPath, outputPath }) {
            if (!fs.existsSync(retryPath)) {
              fs.copyFileSync(basePath, outputPath)
              console.log('[RECOVERY] no retry file to merge')
              return
            }

            const baseXml = fs.readFileSync(basePath, 'utf8')
            const retryXml = fs.readFileSync(retryPath, 'utf8')

            const baseProgrammes = parseProgrammes(baseXml)
            const retryProgrammes = parseProgrammes(retryXml)

            const baseByKey = new Map()
            for (const block of baseProgrammes) {
              baseByKey.set(programmeKey(block), block)
            }

            let improved = 0
            let added = 0

            for (const retryBlock of retryProgrammes) {
              const key = programmeKey(retryBlock)
              const existing = baseByKey.get(key)

              if (!existing) {
                baseByKey.set(key, retryBlock)
                added++
                continue
              }

              const existingScore = completionScore(existing)
              const retryScore = completionScore(retryBlock)

              if (retryScore > existingScore) {
                baseByKey.set(key, retryBlock)
                improved++
              }
            }

            let mergedXml = baseXml

            for (const original of baseProgrammes) {
              const key = programmeKey(original)
              const replacement = baseByKey.get(key)
              if (replacement && replacement !== original) {
                mergedXml = mergedXml.replace(original, replacement)
              }
            }

            const originalKeys = new Set(baseProgrammes.map(programmeKey))
            const additions = [...baseByKey.entries()]
              .filter(([key]) => !originalKeys.has(key))
              .map(([, block]) => block)

            if (additions.length) {
              mergedXml = mergedXml.replace(/<\/tv>\s*$/i, `${additions.join('\n')}\n</tv>\n`)
            }

            fs.writeFileSync(outputPath, mergedXml)
            console.log(`[RECOVERY] merged retry data: improved=${improved}, added=${added}`)
          }

          if (command === 'analyze') {
            analyze({
              channelsPath: process.argv[3],
              guidePath: process.argv[4],
              logPath: process.argv[5],
              missingPath: process.argv[6],
              retryChannelsPath: process.argv[7]
            })
          } else if (command === 'merge') {
            merge({
              basePath: process.argv[3],
              retryPath: process.argv[4],
              outputPath: process.argv[5]
            })
          } else {
            console.error(`Unknown command: ${command}`)
            process.exit(1)
          }
          EOF

          run_pass() {
            PASS_NAME="$1"
            MAX_CONNECTIONS="$2"
            SCHEDULE_TIMEOUT="$3"
            CHANNELS_FILE="$4"

            echo ""
            echo "============================================================"
            echo "Starting $PASS_NAME"
            echo "maxConnections=$MAX_CONNECTIONS"
            echo "TVGUIDE_SCHEDULE_TIMEOUT=$SCHEDULE_TIMEOUT"
            echo "channels=$CHANNELS_FILE"
            echo "============================================================"

            export TVGUIDE_SCHEDULE_TIMEOUT="$SCHEDULE_TIMEOUT"

            CHANNEL_COUNT=$(grep -c '<channel ' "$CHANNELS_FILE" || true)
            if [ "$CHANNEL_COUNT" -lt 1 ]; then
              echo "$PASS_NAME has no retry channels; skipping"
              echo "0" > "../guides/tvguidetivimateguide.${PASS_NAME}.programmes.count"
              echo "0" > "../guides/tvguidetivimateguide.${PASS_NAME}.descriptions.count"
              echo "0" > "../guides/tvguidetivimateguide.${PASS_NAME}.issues.count"
              return 0
            fi

            set +e
            npx tsx scripts/commands/epg/grab.ts \
              --channels="$CHANNELS_FILE" \
              --output="../guides/tvguidetivimateguide.${PASS_NAME}.xml" \
              --days=14 \
              --maxConnections="$MAX_CONNECTIONS" \
              2>&1 | tee "../guides/tvguidetivimateguide.${PASS_NAME}.log"

            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -ne 0 ]; then
              echo "$PASS_NAME exited with status $STATUS"
            fi

            if [ ! -f "../guides/tvguidetivimateguide.${PASS_NAME}.xml" ]; then
              echo "$PASS_NAME did not create an XML file"
              echo "0" > "../guides/tvguidetivimateguide.${PASS_NAME}.programmes.count"
              echo "0" > "../guides/tvguidetivimateguide.${PASS_NAME}.descriptions.count"
              echo "999999" > "../guides/tvguidetivimateguide.${PASS_NAME}.issues.count"
              return 0
            fi

            PR=$(grep -c '<programme ' "../guides/tvguidetivimateguide.${PASS_NAME}.xml" || true)
            DESC=$(grep -c '<desc ' "../guides/tvguidetivimateguide.${PASS_NAME}.xml" || true)

            ISSUE_COUNT=$(grep -Eic 'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' "../guides/tvguidetivimateguide.${PASS_NAME}.log" || true)

            echo "$PR" > "../guides/tvguidetivimateguide.${PASS_NAME}.programmes.count"
            echo "$DESC" > "../guides/tvguidetivimateguide.${PASS_NAME}.descriptions.count"
            echo "$ISSUE_COUNT" > "../guides/tvguidetivimateguide.${PASS_NAME}.issues.count"

            echo "$PASS_NAME programmes: $PR"
            echo "$PASS_NAME descriptions: $DESC"
            echo "$PASS_NAME possible schedule/detail issues: $ISSUE_COUNT"
          }

          run_pass "pass1-fast" 10 8000 "sites/tvguide.com/festy-tivimate.channels.xml"

          cp "../guides/tvguidetivimateguide.pass1-fast.xml" "../guides/tvguidetivimateguide.working.xml"

          node scripts/tivimate-recovery.cjs analyze \
            "sites/tvguide.com/festy-tivimate.channels.xml" \
            "../guides/tvguidetivimateguide.working.xml" \
            "../guides/tvguidetivimateguide.pass1-fast.log" \
            "../guides/tvguidetivimateguide.pass1-fast.missing.json" \
            "../guides/tvguidetivimateguide.pass2-backup.retry.channels.xml"

          PASS2_RETRY_CHANNELS=$(grep -c '<channel ' "../guides/tvguidetivimateguide.pass2-backup.retry.channels.xml" || true)

          if [ "$PASS2_RETRY_CHANNELS" -gt 0 ]; then
            echo ""
            echo "Fast pass left incomplete metadata or missing days; running backup only for retry channels..."
            run_pass "pass2-backup" 5 15000 "../guides/tvguidetivimateguide.pass2-backup.retry.channels.xml"

            node scripts/tivimate-recovery.cjs merge \
              "../guides/tvguidetivimateguide.working.xml" \
              "../guides/tvguidetivimateguide.pass2-backup.xml" \
              "../guides/tvguidetivimateguide.working.xml"
          else
            echo ""
            echo "Fast pass found no incomplete metadata or missing days. Skipping backup pass."
          fi

          node scripts/tivimate-recovery.cjs analyze \
            "sites/tvguide.com/festy-tivimate.channels.xml" \
            "../guides/tvguidetivimateguide.working.xml" \
            "../guides/tvguidetivimateguide.pass2-backup.log" \
            "../guides/tvguidetivimateguide.pass2-backup.missing.json" \
            "../guides/tvguidetivimateguide.pass3-micro.retry.channels.xml"

          PASS3_RETRY_CHANNELS=$(grep -c '<channel ' "../guides/tvguidetivimateguide.pass3-micro.retry.channels.xml" || true)

          if [ "$PASS3_RETRY_CHANNELS" -gt 0 ]; then
            echo ""
            echo "Backup pass still left incomplete metadata or missing days; running micro only for remaining retry channels..."
            run_pass "pass3-micro" 2 30000 "../guides/tvguidetivimateguide.pass3-micro.retry.channels.xml"

            node scripts/tivimate-recovery.cjs merge \
              "../guides/tvguidetivimateguide.working.xml" \
              "../guides/tvguidetivimateguide.pass3-micro.xml" \
              "../guides/tvguidetivimateguide.working.xml"
          else
            echo ""
            echo "No remaining incomplete metadata or missing days. Skipping micro schedule pass."
          fi

          cp "../guides/tvguidetivimateguide.working.xml" "../guides/tvguidetivimateguide.xml"

          node scripts/tivimate-recovery.cjs analyze \
            "sites/tvguide.com/festy-tivimate.channels.xml" \
            "../guides/tvguidetivimateguide.xml" \
            "../guides/tvguidetivimateguide.pass3-micro.log" \
            "../guides/tvguidetivimateguide.tvmaze-missing.json"

          FINAL_PR=$(grep -c '<programme ' "../guides/tvguidetivimateguide.xml" || true)
          FINAL_DESC=$(grep -c '<desc ' "../guides/tvguidetivimateguide.xml" || true)
          FINAL_MISSING=$(node -e "const fs=require('fs'); const p='../guides/tvguidetivimateguide.tvmaze-missing.json'; console.log(fs.existsSync(p) ? JSON.parse(fs.readFileSync(p)).length : 0)")

          echo ""
          echo "============================================================"
          echo "Selected final schedule: incremental merged TVGuide output"
          echo "Final programmes: $FINAL_PR"
          echo "Final descriptions: $FINAL_DESC"
          echo "Final TVMaze-allowed missing targets: $FINAL_MISSING"
          echo "============================================================"

          echo ""
          echo "Pass summary:"
          for PASS in pass1-fast pass2-backup pass3-micro; do
            if [ -f "../guides/tvguidetivimateguide.${PASS}.programmes.count" ]; then
              echo "$PASS:"
              echo "  programmes:   $(cat ../guides/tvguidetivimateguide.${PASS}.programmes.count)"
              echo "  descriptions: $(cat ../guides/tvguidetivimateguide.${PASS}.descriptions.count)"
              echo "  issues:       $(cat ../guides/tvguidetivimateguide.${PASS}.issues.count)"
            fi
          done

          cd ..

      - name: Fill missing TiviMate metadata from TVMaze
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/tvguidetivimateguide.xml'
          const cachePath = 'guides/.tvmaze-tivimate-cache.json'

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(guidePath, 'utf8')
          let cache = {}

          if (fs.existsSync(cachePath)) {
            try {
              cache = JSON.parse(fs.readFileSync(cachePath, 'utf8'))
            } catch {
              cache = {}
            }
          }

          const allowedMissingPath = 'guides/tvguidetivimateguide.tvmaze-missing.json'
          let allowedMissing = []

          if (fs.existsSync(allowedMissingPath)) {
            try {
              allowedMissing = JSON.parse(fs.readFileSync(allowedMissingPath, 'utf8'))
            } catch {
              allowedMissing = []
            }
          }

          const stats = {
            programmes: 0,
            skippedMovies: 0,
            searchedShows: 0,
            matchedShows: 0,
            enriched: 0,
            addedCategories: 0,
            addedSubtitles: 0,
            addedEpisodeNums: 0,
            addedDates: 0,
            addedDescriptions: 0
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function stripTags(s) {
            return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim())
          }

          function getTag(block, tag) {
            const m = block.match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i'))
            return m ? stripTags(m[1]) : ''
          }

          function getTags(block, tag) {
            return [...block.matchAll(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'gi'))]
              .map(m => stripTags(m[1]))
              .filter(Boolean)
          }

          function hasTag(block, tag) {
            return new RegExp(`<${tag}\\b`, 'i').test(block)
          }

          function hasCategory(block, category) {
            return getTags(block, 'category').some(c => c.toLowerCase() === category.toLowerCase())
          }

          function hasAnyCategory(block) {
            return hasTag(block, 'category')
          }

          function getStartDate(block) {
            const m = block.match(/start="(\d{8})/i)
            if (!m) return ''
            return `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}`
          }

          function getStartRaw(block) {
            const m = block.match(/start="([^"]+)"/i)
            return m ? m[1] : ''
          }

          function getStopRaw(block) {
            const m = block.match(/stop="([^"]+)"/i)
            return m ? m[1] : ''
          }

          function getChannelRaw(block) {
            const m = block.match(/channel="([^"]+)"/i)
            return m ? decodeXml(m[1]) : ''
          }

          function getAllowedMissingFields(block) {
            const channel = getChannelRaw(block)
            const start = getStartRaw(block)
            const stop = getStopRaw(block)
            const date = start.slice(0, 8)
            const title = cleanTitleForSearch(getTag(block, 'title'))

            for (const item of allowedMissing) {
              if (!item || item.channel !== channel) continue
              if (item.start && item.start !== start) continue
              if (item.stop && item.stop !== stop) continue
              if (item.title && title && cleanTitleForSearch(item.title) !== title) continue
              if (!item.start && item.date && item.date !== date) continue
              return Array.isArray(item.missing) ? item.missing : []
            }

            return []
          }

          function cleanTitleForSearch(title) {
            return String(title || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function isMovie(block) {
            if (hasCategory(block, 'Movie')) return true
            if (hasCategory(block, 'Film')) return true
            return false
          }

          function needsTvmaze(block) {
            if (!hasAnyCategory(block)) return true

            const desc = getTag(block, 'desc')
            if (!desc) return true

            // Strict rule: TVMaze may only fill fields TVGuide did not find.
            // It must not rebuild descriptions because an episode title/code is missing.
            // The only packed-desc edit allowed after TVGuide is appending a missing airdate.
            const hasPackedDisplayDate = /\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/.test(desc)
            if (!hasPackedDisplayDate) return true

            return false
          }

          function tvmazeShowIsMovieLike(show) {
            const type = String(show?.type || '').toLowerCase()
            return type === 'movie' || type === 'film'
          }

          function tvmazeShowIsMiniseries(show) {
            const type = String(show?.type || '').toLowerCase()
            const name = String(show?.name || '').toLowerCase()
            const summary = String(show?.summary || '').toLowerCase()

            return (
              type.includes('mini') ||
              type.includes('limited') ||
              name.includes('miniseries') ||
              summary.includes('miniseries') ||
              summary.includes('limited series')
            )
          }

          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function scoreShow(title, show) {
            const a = normalize(title)
            const b = normalize(show?.name || '')
            if (!a || !b) return 0
            if (a === b) return 100
            if (a.includes(b) || b.includes(a)) return 80
            return 0
          }

          async function tvmazeSearchShow(title) {
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]

            const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`
            const result = await fetchJsonWithRetries(url, `search ${title}`)
            const candidates = Array.isArray(result) ? result.map(x => x.show).filter(Boolean) : []

            let best = null
            let bestScore = 0

            for (const show of candidates) {
              if (tvmazeShowIsMovieLike(show)) continue

              const score = scoreShow(title, show)
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null

            cache[key] = best
            await sleep(250)
            return best
          }

          async function tvmazeEpisodes(showId) {
            const key = `episodes:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]

            const url = `https://api.tvmaze.com/shows/${showId}/episodes`
            const episodes = await fetchJsonWithRetries(url, `episodes ${showId}`)
            cache[key] = Array.isArray(episodes) ? episodes : []
            await sleep(250)
            return cache[key]
          }

          async function fetchJsonWithRetries(url, label) {
            const attempts = 4

            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    'User-Agent': 'festy-epg-tvmaze-tivimate-fill-missing-only/1.0'
                  }
                })

                if (response.status === 404) return null
                if (response.status === 429 || response.status >= 500) {
                  throw new Error(`HTTP ${response.status}`)
                }

                if (!response.ok) return null

                return await response.json()
              } catch (err) {
                if (attempt === attempts) {
                  console.log(`[TVMAZE FAIL] ${label} | ${err.message}`)
                  return null
                }

                const delay = 1000 * attempt + Math.floor(Math.random() * 500)
                console.log(`[TVMAZE RETRY] ${label} | ${err.message} | attempt=${attempt}/${attempts}`)
                await sleep(delay)
              }
            }

            return null
          }

          function findEpisodeForProgramme(episodes, block) {
            const scheduleDate = getStartDate(block)
            const subtitle = getTag(block, 'sub-title')
            const desc = getTag(block, 'desc')

            const codeMatch = desc.match(/\bS(\d+)E(\d+)\b/i)
            if (codeMatch) {
              const season = Number(codeMatch[1])
              const number = Number(codeMatch[2])
              const byCode = episodes.find(ep => Number(ep.season) === season && Number(ep.number) === number)
              if (byCode) return byCode
            }

            if (subtitle) {
              const subNorm = normalize(subtitle)
              const byName = episodes.find(ep => normalize(ep.name) === subNorm)
              if (byName) return byName
            }

            const packedTitle = getPackedEpisodeTitleFromDesc(desc)
            if (packedTitle) {
              const packedNorm = normalize(packedTitle)
              const byPackedTitle = episodes.find(ep => normalize(ep.name) === packedNorm)
              if (byPackedTitle) return byPackedTitle
            }

            // Last fallback only. The schedule date is the current rerun date, so it is usually
            // not the original TVMaze airdate for syndicated/retro channels.
            if (scheduleDate) {
              const exact = episodes.find(ep => ep.airdate === scheduleDate)
              if (exact) return exact
            }

            return null
          }

          function getPackedEpisodeTitleFromDesc(desc) {
            const cleaned = cleanPackedTvmazeDescription(desc)
              .replace(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/, '')
              .trim()
            if (!cleaned) return ''

            const firstSentence = cleaned.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            if (!first) return ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            if (prefixMatch) return prefixMatch[1].trim()

            if (/^S\d+E\d+$/i.test(first)) return ''
            if (first.length > 80) return ''
            return first
          }

          function xmltvNs(season, episode) {
            const s = Number(season)
            const e = Number(episode)
            if (!Number.isFinite(s) || !Number.isFinite(e) || s < 1 || e < 1) return ''
            return `${s - 1}.${e - 1}.`
          }

          function formatDateXmltv(date) {
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return ''
            return date.replace(/-/g, '')
          }

          function cleanTvmazeSummary(value) {
            return decodeXml(String(value || '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim())
          }

          function formatDateDisplay(date) {
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return ''
            return `${date.slice(5, 7)}/${date.slice(8, 10)}/${date.slice(0, 4)}`
          }

          function buildTvmazeEpisodeCode(season, episode) {
            const s = Number(season)
            const e = Number(episode)
            if (!Number.isFinite(s) || !Number.isFinite(e) || s < 1 || e < 1) return ''
            return `S${s}E${e}`
          }

          function descHasEpisodeName(desc, episodeName) {
            if (!desc || !episodeName) return false
            const descNorm = normalize(desc)
            const nameNorm = normalize(episodeName)
            return Boolean(nameNorm && descNorm.includes(nameNorm))
          }

          function descHasEpisodeCode(desc, season, episode) {
            const code = buildTvmazeEpisodeCode(season, episode)
            if (!desc || !code) return false
            return new RegExp(`\\b${code}\\b`, 'i').test(desc)
          }

          function descHasDisplayDate(desc, airdate) {
            const displayDate = formatDateDisplay(airdate)
            if (!desc || !displayDate) return false
            return desc.includes(`(${displayDate})`) || desc.includes(displayDate)
          }

          function cleanPackedTvmazeDescription(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }

          function splitTrailingDisplayDate(desc) {
            const cleaned = cleanPackedTvmazeDescription(desc)
            const match = cleaned.match(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/)
            if (!match) return { body: cleaned, dateText: '' }
            return {
              body: cleaned.slice(0, match.index).trim(),
              dateText: match[1]
            }
          }

          function parsePackedDescription(desc) {
            const split = splitTrailingDisplayDate(desc)
            const withoutDate = split.body
            const firstSentence = withoutDate.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            const rest = firstSentence && firstSentence[0].length < withoutDate.length
              ? withoutDate.slice(firstSentence[0].length).trim()
              : ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            if (prefixMatch) {
              return {
                episodeTitle: prefixMatch[1].trim(),
                episodeCode: prefixMatch[2].toUpperCase(),
                body: rest,
                dateText: split.dateText,
                hadPrefix: true
              }
            }

            const codeOnlyMatch = first.match(/^(S\d+E\d+|S\d+|E\d+)$/i)
            if (codeOnlyMatch) {
              return {
                episodeTitle: '',
                episodeCode: codeOnlyMatch[1].toUpperCase(),
                body: rest,
                dateText: split.dateText,
                hadPrefix: true
              }
            }

            // A first sentence that exactly matches the TVMaze episode name is an existing title-only prefix.
            return {
              episodeTitle: '',
              episodeCode: '',
              body: withoutDate,
              dateText: split.dateText,
              hadPrefix: false
            }
          }

          function buildTvmazePackedDescription(existingDesc, show, episode) {
            const existing = cleanPackedTvmazeDescription(existingDesc)
            const parsed = parsePackedDescription(existing)

            const episodeName = cleanTvmazeSummary(episode?.name || '')
            const episodeCode = buildTvmazeEpisodeCode(episode?.season, episode?.number)
            const episodeSummary = cleanTvmazeSummary(episode?.summary || '')
            const showSummary = cleanTvmazeSummary(show?.summary || '')
            const displayDate = formatDateDisplay(episode?.airdate)

            let titlePart = parsed.episodeTitle
            let codePart = parsed.episodeCode
            let bodyPart = parsed.body
            let datePart = parsed.dateText

            // If TVGuide packed the episode title as the first sentence, e.g.
            // "Thanksgiving. The Taylor family...", recognize it as the episode title
            // instead of treating it as synopsis text.
            const packedTitle = getPackedEpisodeTitleFromDesc(existing)
            if (!titlePart && episodeName && packedTitle && normalize(packedTitle) === normalize(episodeName)) {
              titlePart = packedTitle
              const firstSentence = bodyPart.match(/^(.+?)(?:\.\s+|$)/)
              if (firstSentence) bodyPart = bodyPart.slice(firstSentence[0].length).trim()
            }

            // If TVGuide already put the episode title in the desc, leave it.
            // If it is missing and TVMaze has it, add only that missing title.
            if (!titlePart && episodeName && !descHasEpisodeName(existing, episodeName)) {
              titlePart = episodeName
            }

            // If TVGuide already put SxxExx in the desc, leave it.
            // If it is missing and TVMaze has it, add only that missing code.
            if (!codePart && episodeCode && !descHasEpisodeCode(existing, episode?.season, episode?.number)) {
              codePart = episodeCode
            }

            // If TVGuide already gave a real description body, leave it untouched.
            // If the body is missing or the whole desc was only metadata, add only the missing synopsis.
            if (!bodyPart || bodyPart === titlePart || bodyPart === codePart || bodyPart === `${titlePart} - ${codePart}`) {
              bodyPart = episodeSummary || showSummary || ''
            }

            // If TVGuide already put the date/year at the end, leave it.
            // If it is missing and TVMaze has an airdate, add only that missing date.
            if (!datePart && displayDate && !descHasDisplayDate(existing, episode?.airdate)) {
              datePart = displayDate
            }

            const parts = []
            if (titlePart && codePart) parts.push(`${titlePart} - ${codePart}`)
            else if (titlePart) parts.push(titlePart)
            else if (codePart) parts.push(codePart)

            if (bodyPart) {
              const bodyNorm = normalize(bodyPart)
              const prefixNorm = normalize(parts[0] || '')
              if (!prefixNorm || bodyNorm !== prefixNorm) parts.push(bodyPart)
            }

            let desc = cleanPackedTvmazeDescription(parts.join('. '))
            if (datePart) desc = desc ? `${desc} (${datePart})` : `(${datePart})`
            return cleanPackedTvmazeDescription(desc)
          }

          function replaceTag(block, tag, value) {
            const escaped = escapeXml(value)
            const tagXml = `  <${tag} lang="en">${escaped}</${tag}>`

            if (hasTag(block, tag)) {
              return block.replace(new RegExp(`<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`, 'i'), tagXml.trim())
            }

            return insertBeforeProgrammeEnd(block, tagXml)
          }

          function insertBeforeProgrammeEnd(block, tagXml) {
            return block.replace(/<\/programme>\s*$/i, `${tagXml}\n</programme>`)
          }

          function enrichBlockMissingOnly(block, show, episode) {
            let updated = block
            let changed = false

            if (!hasAnyCategory(updated)) {
              const category = tvmazeShowIsMiniseries(show) ? 'Miniseries' : 'Series'
              updated = insertBeforeProgrammeEnd(updated, `  <category lang="en">${category}</category>`)
              changed = true
              stats.addedCategories++
            }

            // Field-level fill only:
            // Keep every TVGuide-provided desc component that already exists.
            // Add only missing episode title, missing SxxExx, missing synopsis, or missing airdate.
            // Never replace TVGuide's existing synopsis just because one metadata piece is missing.
            const existingDesc = getTag(updated, 'desc')
            const packedDesc = buildTvmazePackedDescription(existingDesc, show, episode)

            if (packedDesc && packedDesc !== existingDesc) {
              updated = replaceTag(updated, 'desc', packedDesc)
              changed = true
              stats.addedDescriptions++
            }

            if (changed) stats.enriched++
            return updated
          }

          async function main() {
            const parts = xml.split(/(<programme\b[\s\S]*?<\/programme>)/gi)
            const out = []

            for (const part of parts) {
              if (!/^<programme\b/i.test(part)) {
                out.push(part)
                continue
              }

              stats.programmes++

              let block = part
              const title = cleanTitleForSearch(getTag(block, 'title'))

              if (!title) {
                out.push(block)
                continue
              }

              const allowedMissingFields = getAllowedMissingFields(block)

              if (!allowedMissingFields.length) {
                out.push(block)
                continue
              }

              if (isMovie(block)) {
                stats.skippedMovies++
                out.push(block)
                continue
              }

              stats.searchedShows++
              const show = await tvmazeSearchShow(title)

              if (!show) {
                out.push(block)
                continue
              }

              if (tvmazeShowIsMovieLike(show)) {
                stats.skippedMovies++
                out.push(block)
                continue
              }

              stats.matchedShows++

              const episodes = await tvmazeEpisodes(show.id)
              const episode = findEpisodeForProgramme(episodes, block)

              block = enrichBlockMissingOnly(block, show, episode)
              out.push(block)
            }

            fs.writeFileSync(guidePath, out.join(''))
            fs.writeFileSync(cachePath, JSON.stringify(cache, null, 2))

            console.log('[TVMAZE] missing-only enrichment complete')
            console.log(`[TVMAZE] programmes scanned: ${stats.programmes}`)
            console.log(`[TVMAZE] allowed missing targets: ${allowedMissing.length}`)
            console.log(`[TVMAZE] movies skipped: ${stats.skippedMovies}`)
            console.log(`[TVMAZE] shows searched: ${stats.searchedShows}`)
            console.log(`[TVMAZE] shows matched: ${stats.matchedShows}`)
            console.log(`[TVMAZE] programmes enriched: ${stats.enriched}`)
            console.log(`[TVMAZE] categories added: ${stats.addedCategories}`)
            console.log(`[TVMAZE] subtitles added: ${stats.addedSubtitles}`)
            console.log(`[TVMAZE] episode nums added: ${stats.addedEpisodeNums}`)
            console.log(`[TVMAZE] dates added: ${stats.addedDates}`)
            console.log(`[TVMAZE] descriptions added: ${stats.addedDescriptions}`)
          }

          main().catch(err => {
            console.error(err)
            process.exit(1)
          })
          EOF

      - name: Validate TiviMate output
        run: |
          CH=$(grep -c '<channel ' guides/tvguidetivimateguide.xml || true)
          PR=$(grep -c '<programme ' guides/tvguidetivimateguide.xml || true)
          DESC=$(grep -c '<desc ' guides/tvguidetivimateguide.xml || true)

          echo "TiviMate channels: $CH"
          echo "TiviMate programmes: $PR"
          echo "TiviMate descriptions: $DESC"

          if [ "$CH" -lt 123 ]; then
            echo "Invalid TiviMate output - expected at least 123 channels"
            exit 1
          fi

          if [ "$PR" -lt 1 ]; then
            echo "Invalid TiviMate output - no programmes"
            exit 1
          fi

          if [ "$DESC" -lt 1 ]; then
            echo "Invalid TiviMate output - no descriptions"
            exit 1
          fi

      - name: Apply custom logos to TiviMate guide
        run: |
          node scripts/apply-custom-logos.cjs guides/tvguidetivimateguide.xml

      - name: Commit and push TiviMate guide safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/tvguidetivimateguide.xml guides/.tvmaze-tivimate-cache.json

          if git diff --cached --quiet; then
            echo "No TiviMate guide changes to commit"
            exit 0
          fi

          git commit -m "Update TiviMate guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, retrying after rebase..."
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
