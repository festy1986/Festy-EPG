name: Convert logo files to clean PNG names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-logos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin webp

      - name: Convert logos to PNG
        run: |
          convert "logos/ScreenPix_Action.webp" "logos/ScreenPix Action.png"
          convert "logos/ScreenPix_Voices_2019.webp" "logos/ScreenPix Voices.png"
          convert "logos/ScreenPix_logo_2019.webp" "logos/ScreenPix.png"

          rsvg-convert "logos/MGM+.svg" -o "logos/MGM+.png"
          rsvg-convert "logos/MGM+_Drive-In_2023.svg" -o "logos/MGM+ Drive-In.png"
          rsvg-convert "logos/MGM+_Hits_2023.svg" -o "logos/MGM+ Hits.png"
          rsvg-convert "logos/MGM+_Marquee_2023.svg" -o "logos/MGM+ Marquee.png"

          convert "logos/Movieplex_logo_old.webp" "logos/MoviePlex.png"
          rsvg-convert "logos/Indieplex_logo.svg" -o "logos/IndiePlex.png"

      - name: Delete original files
        run: |
          rm -f "logos/ScreenPix_Action.webp"
          rm -f "logos/ScreenPix_Voices_2019.webp"
          rm -f "logos/ScreenPix_logo_2019.webp"

          rm -f "logos/MGM+.svg"
          rm -f "logos/MGM+_Drive-In_2023.svg"
          rm -f "logos/MGM+_Hits_2023.svg"
          rm -f "logos/MGM+_Marquee_2023.svg"

          rm -f "logos/Movieplex_logo_old.webp"
          rm -f "logos/Indieplex_logo.svg"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add logos/

          git commit -m "Convert logo files to clean PNG names" || exit 0

          git push
