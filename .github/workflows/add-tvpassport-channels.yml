name: Add TVPassport channels and convert logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tvpassport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin webp

      - run: |
          rsvg-convert "logos/Home_Network_2024_green.svg" -o "logos/Home Network.png"
          rsvg-convert "logos/Military_History_Channel_2005.svg" -o "logos/Military History.png"
          convert "logos/MeTV282021%29.webp" "logos/MeTV Plus.png"
          convert "logos/lifetime real woman.png" "logos/Lifetime Real Women East.png"
          rsvg-convert "logos/The_Movie_Channel_1997.svg" -o "logos/The Movie Channel.png"
          convert "logos/starz encore westerns.png" "logos/Starz Encore Westerns.png"

          rm -f "logos/Home_Network_2024_green.svg"
          rm -f "logos/Military_History_Channel_2005.svg"
          rm -f "logos/MeTV282021%29.webp"
          rm -f "logos/lifetime real woman.png"
          rm -f "logos/The_Movie_Channel_1997.svg"
          rm -f "logos/starz encore westerns.png"

      - run: |
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Home%20Network.png" site="tvpassport.com" site_id="hgtv-canada-hd/8793" lang="en" xmltv_id="">Home Network</channel>' guides/TVPassport.channels.xml
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Military%20History.png" site="tvpassport.com" site_id="military-history/5271" lang="en" xmltv_id="">Military History</channel>' guides/TVPassport.channels.xml
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MeTV%20Plus.png" site="tvpassport.com" site_id="metv-plus/36199" lang="en" xmltv_id="">MeTV Plus</channel>' guides/TVPassport.channels.xml
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Lifetime%20Real%20Women%20East.png" site="tvpassport.com" site_id="lifetime-real-women-east/2707" lang="en" xmltv_id="">Lifetime Real Women East</channel>' guides/TVPassport.channels.xml
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/The%20Movie%20Channel.png" site="tvpassport.com" site_id="" lang="en" xmltv_id="">The Movie Channel</channel>' guides/TVPassport.channels.xml
          sed -i '/<\/channels>/i <channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Starz%20Encore%20Westerns.png" site="tvpassport.com" site_id="starz-encore-westerns--eastern/1959" lang="en" xmltv_id="StarzEncoreWesterns.us@East">Starz Encore Westerns - Eastern</channel>' guides/TVPassport.channels.xml

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guides/TVPassport.channels.xml logos/
          git commit -m "Add TVPassport channels and convert logos" || exit 0
          git push
