name: Fix MGM Plex channel logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert RetroPlex logo
        run: |
          rsvg-convert "logos/Retroplex_logo.svg" -o "logos/RetroPlex.png"
          rm -f "logos/Retroplex_logo.svg"

      - name: Add logos to XML channels
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("*.xml"))

          replacements = {
              "MGMPLUS.HITS.us": {
                  "name": "MGM+ HITS",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Hits.png",
              },
              "MGMPLUS.MARQUEE.us": {
                  "name": "MGM+ MARQUEE",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Marquee.png",
              },
              "MGMPLUS.DRIVE.IN.us": {
                  "name": "MGM+ DRIVE-IN",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Drive-In.png",
              },
              "MOVIEPLEX.us": {
                  "name": "MOVIEPLEX",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MoviePlex.png",
              },
              "INDIEPLEX.us": {
                  "name": "INDIEPLEX",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/IndiePlex.png",
              },
              "RETROPLEX.us": {
                  "name": "RETROPLEX",
                  "logo": "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/RetroPlex.png",
              },
          }

          for path in files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text

              for channel_id, data in replacements.items():
                  pattern = re.compile(
                      rf'<channel id="{re.escape(channel_id)}">.*?</channel>',
                      re.DOTALL
                  )

                  replacement = (
                      f'<channel id="{channel_id}">'
                      f'<display-name>{data["name"]}</display-name>'
                      f'<icon src="{data["logo"]}"/>'
                      f'<url>https://tvguide.com</url>'
                      f'</channel>'
                  )

                  text = pattern.sub(replacement, text)

              if text != original:
                  path.write_text(text, encoding="utf-8")

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix MGM Plex XML channel logos" || exit 0
          git push
