name: Festy TVGuide OTA

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-main
  cancel-in-progress: false

jobs:
  build-festy-tvguide-ota:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Build OTA channel source from RAW
        run: |
          mkdir -p epg/sites/tvguide.com

          node <<'EOF'
          const fs = require('fs')

          const inputPath = 'guides/OTALocalsguide.raw.xml'
          const outputPath = 'epg/sites/tvguide.com/festy-ota.channels.xml'
          const OTA_PROVIDER_ID = '9100000664'

          const wanted = {
            'WCBB-DT': 'PBS',
            'WCSH': 'NBC PORTLAND',
            'WGME': 'CBS PORTLAND',
            'WGME-DT2': 'FOX PORTLAND',
            'WPME': 'ION',
            'WIPL-DT2': 'COURT TV',
            'WIPL-DT4': 'GRIT',
            'WIPL-DT5': 'ION PLUS',
            'WIPL-DT7': 'GAME SHOW NETWORK',
            'WMTW': 'ABC PORTLAND',
            'WMTW-DT2': 'METV',
            'WMTW-DT3': 'LAFF',
            'WPFO-DT2': 'CHARGE',
            'WPFO-DT3': 'COMET',
            'WPXT-DT2': 'HEROES & ICONS',
            'WPXT-DT3': 'ION MYSTERY'
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function xmltvId(name) {
            return String(name)
              .toUpperCase()
              .replace(/&/g, 'AND')
              .replace(/\+/g, 'PLUS')
              .replace(/[^A-Z0-9]+/g, '.')
              .replace(/^\.+|\.+$/g, '') + '.us'
          }

          if (!fs.existsSync(inputPath)) {
            console.error(`Missing ${inputPath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(inputPath, 'utf8')
          const channelBlocks = [...xml.matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)]

          const outputChannels = []
          const found = new Set()

          for (const match of channelBlocks) {
            const attrs = match[1]
            const body = match[2]

            const idMatch = attrs.match(/id="([^"]+)"/i)
            if (!idMatch) continue

            const siteIdRaw = decodeXml(idMatch[1]).trim()
            const names = [...body.matchAll(/<display-name[^>]*>([\s\S]*?)<\/display-name>/gi)]
              .map(m => decodeXml(m[1].replace(/<[^>]+>/g, '').trim()))
              .filter(Boolean)

            const shortName = names[0]
            if (!shortName) continue
            if (!wanted[shortName]) continue

            const sourceId = siteIdRaw.split('#').pop()
            const siteId = `${OTA_PROVIDER_ID}#${sourceId}`
            const finalName = wanted[shortName]

            outputChannels.push(
              `  <channel site="tvguide.com" lang="en" xmltv_id="${escapeXml(xmltvId(finalName))}" site_id="${escapeXml(siteId)}">${escapeXml(finalName)}</channel>`
            )

            found.add(shortName)
            console.log(`[ADD] ${finalName} <= ${shortName} | ${siteId}`)
          }

          const missing = Object.keys(wanted).filter(name => !found.has(name))

          if (missing.length) {
            console.log('\nMissing selected OTA channels:')
            missing.forEach(name => console.log(`- ${name}`))
            process.exit(1)
          }

          if (outputChannels.length !== 16) {
            console.error(`Expected exactly 16 OTA channels, built ${outputChannels.length}`)
            process.exit(1)
          }

          fs.writeFileSync(
            outputPath,
            `<?xml version="1.0" encoding="UTF-8"?>\n<channels>\n${outputChannels.join('\n')}\n</channels>\n`
          )

          console.log(`Built ${outputChannels.length} OTA channels`)
          EOF

      - name: Write enriched TVGuide OTA config
        run: |
          cat > epg/sites/tvguide.com/tvguide.com.config.js <<'EOF'
          const axios = require('axios')
          const dayjs = require('dayjs')

          const SCHEDULE_TIMEOUT = Number(process.env.TVGUIDE_SCHEDULE_TIMEOUT || 8000)

          module.exports = {
            site: 'tvguide.com',
            delay: 200,
            days: 14,

            url({ date, channel }) {
              const [providerId, sourceId] = String(channel.site_id).split('#')
              return `https://backend.tvguide.com/tvschedules/tvguide/${providerId}/web?start=${date.startOf('d').unix()}&duration=1440&channelSourceIds=${sourceId}&apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`
            },

            request: {
              method: 'GET',
              timeout: SCHEDULE_TIMEOUT,
              cache: { ttl: 60 * 60 * 1000 },
              headers() {
                return {
                  Referer: 'https://www.tvguide.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            async parser({ content, channel, date }) {
              const data = JSON.parse(content)
              const items = data?.data?.items || []
              const sourceId = String(channel.site_id).split('#').pop()

              const match = items.find(item =>
                String(item.sourceId || item.channelSourceId || item.id || item.channel?.sourceId || '') === sourceId
              )

              const schedules = match?.programSchedules || []

              console.log(`[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${schedules.length}`)

              const programs = []
              const batchSize = 10

              for (let i = 0; i < schedules.length; i += batchSize) {
                const batch = schedules.slice(i, i + batchSize)

                const results = await Promise.all(
                  batch.map(async item => {
                    const details = await loadProgramDetails(item)

                    const title = cleanTitle(item.title || details.title || '')
                    const episodeTitle = cleanSpaces(details.episodeTitle || details.subtitle || details.subTitle || '')
                    const description = cleanSpaces(details.description || item.description || '')

                    const seasonNumber = details.seasonNumber || details.season || ''
                    const episodeNumber = details.episodeNumber || details.episode || ''
                    const episodeCode = buildEpisodeCode(seasonNumber, episodeNumber)

                    const releaseYear = details.releaseYear || details.year || ''
                    const airDate =
                      formatTVGuideDate(details.originalAirDate || details.airDate || details.episodeAirDate) ||
                      formatUnixDate(details.originalAirTime || details.firstAired)

                    const programType = classifyProgramType({
                      item,
                      details,
                      episodeTitle,
                      seasonNumber,
                      episodeNumber,
                      airDate,
                      releaseYear
                    })

                    const suppressDisplayDate = shouldSuppressDisplayDate({
                      title,
                      description,
                      programType,
                      item,
                      details,
                      airDate
                    })

                    const finalDescription = buildPackedDescription({
                      programType,
                      episodeTitle,
                      episodeCode,
                      description,
                      airDate,
                      releaseYear,
                      suppressDisplayDate
                    })

                    const program = {
                      title,
                      description: finalDescription,
                      start: dayjs.unix(item.startTime),
                      stop: dayjs.unix(item.endTime),
                      category: buildCategories(programType)
                    }

                    // Keep display metadata packed in <desc> only.
                    // Do not emit separate sub-title, episode-num, or date tags,
                    // because the target guide display reads title + desc.

                    return program
                  })
                )

                programs.push(...results)
              }

              return programs
            }
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function isRetryableDetailError(err) {
            const status = err.response?.status
            const code = err.code
            const message = String(err.message || '')

            if ([408, 429, 500, 502, 503, 504].includes(status)) return true
            if (['ECONNABORTED', 'ETIMEDOUT', 'ECONNRESET', 'ENOTFOUND', 'EAI_AGAIN'].includes(code)) return true
            if (/timeout|aborted|network|socket|reset/i.test(message)) return true

            return false
          }

          async function fetchProgramDetailsOnce(url, title, timeout, label, attempt, attempts) {
            try {
              const response = await axios.get(url, {
                timeout,
                headers: {
                  Referer: 'https://www.tvguide.com/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              })

              if (attempt > 1 || label.includes('MICRO')) {
                console.log(`[${label} OK] ${title} | attempt=${attempt}/${attempts}`)
              }

              return {
                ok: true,
                value: response.data?.data?.item || {}
              }
            } catch (err) {
              const status = err.response?.status || err.code || err.message || 'unknown'

              if (err.response?.status === 404) {
                console.log(`[${label} MISSING] ${title} | 404`)
                return {
                  ok: true,
                  value: {}
                }
              }

              return {
                ok: false,
                retryable: isRetryableDetailError(err),
                status
              }
            }
          }

          async function tryProgramDetails(url, title, options) {
            const { label, attempts, timeout, baseDelay, maxDelay } = options

            for (let attempt = 1; attempt <= attempts; attempt++) {
              const result = await fetchProgramDetailsOnce(url, title, timeout, label, attempt, attempts)

              if (result.ok) return result.value

              if (!result.retryable) {
                console.log(`[${label} FAIL] ${title} | ${result.status}`)
                return null
              }

              if (attempt < attempts) {
                const delay = Math.min(maxDelay, baseDelay * Math.pow(2, attempt - 1)) + Math.floor(Math.random() * 500)
                console.log(`[${label} RETRY] ${title} | ${result.status} | attempt=${attempt}/${attempts} | wait=${delay}ms`)
                await sleep(delay)
              } else {
                console.log(`[${label} EXHAUSTED] ${title} | ${result.status} | attempts=${attempts}`)
              }
            }

            return null
          }

          async function loadProgramDetails(item) {
            if (!item.programDetails) return {}

            const url = item.programDetails.includes('?')
              ? `${item.programDetails}&apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`
              : `${item.programDetails}?apiKey=DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc`

            const title = item.title || 'Unknown title'

            const fastResult = await tryProgramDetails(url, title, {
              label: 'DETAIL FAST',
              attempts: 1,
              timeout: 8000,
              baseDelay: 0,
              maxDelay: 0
            })

            if (fastResult) return fastResult

            const retryResult = await tryProgramDetails(url, title, {
              label: 'DETAIL BACKUP',
              attempts: 5,
              timeout: 8000,
              baseDelay: 750,
              maxDelay: 30000
            })

            if (retryResult) return retryResult

            console.log(`[DETAIL MICRO PASS] ${title} | starting slow cleanup pass`)

            const microResult = await tryProgramDetails(url, title, {
              label: 'DETAIL MICRO',
              attempts: 4,
              timeout: 20000,
              baseDelay: 5000,
              maxDelay: 60000
            })

            if (microResult) return microResult

            console.log(`[DETAIL FINAL MISS] ${title} | no details after fast + backup + micro`)
            return {}
          }

          function classifyProgramType({ item, details, episodeTitle, seasonNumber, episodeNumber, airDate, releaseYear }) {
            const haystack = [
              item.type,
              item.programType,
              item.entityType,
              item.category,
              item.subcategory,
              item.genres,
              details.type,
              details.programType,
              details.entityType,
              details.category,
              details.subcategory,
              details.genres,
              details.seriesId,
              details.showId,
              details.episodeId
            ]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            const hasEpisodeSignals = Boolean(
              episodeTitle ||
              seasonNumber ||
              episodeNumber ||
              details.episodeNumber ||
              details.seasonNumber ||
              details.episodeTitle ||
              details.subtitle ||
              details.subTitle ||
              details.originalAirDate ||
              details.episodeAirDate ||
              details.seriesId ||
              details.showId ||
              details.episodeId
            )

            if (/mini[\s-]?series|limited series|limited-series/.test(haystack)) return 'miniseries'
            if (/series|episode|tv show|television|scripted|reality|documentary series/.test(haystack)) return 'series'
            if (hasEpisodeSignals) return 'series'
            if (/movie|film|feature film|cinema/.test(haystack)) return 'movie'

            const durationMinutes = getDurationMinutes(item)
            if (durationMinutes >= 75 && releaseYear && !airDate && !hasEpisodeSignals) return 'movie'

            return 'program'
          }

          function getDurationMinutes(item) {
            const start = Number(item.startTime || 0)
            const end = Number(item.endTime || 0)
            if (!start || !end || end <= start) return 0
            return Math.round((end - start) / 60)
          }

          function buildCategories(programType) {
            if (programType === 'movie') return ['Movie']
            if (programType === 'miniseries') return ['Miniseries', 'Series']
            if (programType === 'series') return ['Series']
            return ['Program']
          }

          function shouldSuppressDisplayDate({ title, description, programType, item, details, airDate }) {
            if (!airDate) return false

            const haystack = [
              title,
              description,
              item?.title,
              item?.type,
              item?.programType,
              item?.entityType,
              item?.category,
              item?.subcategory,
              item?.genres,
              details?.type,
              details?.programType,
              details?.entityType,
              details?.category,
              details?.subcategory,
              details?.genres
            ]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            const liveOrCurrent = /\b(live|news|newscast|weather|sports|game|match|tournament|football|basketball|baseball|hockey|soccer|golf|tennis|racing|wwe|ufc|mma|boxing|pregame|postgame|post-game|pre-game)\b/.test(haystack)
            if (!liveOrCurrent) return false

            const scheduleDate = item?.startTime ? dayjs.unix(Number(item.startTime)) : null
            const parsedAirDate = parseDisplayDate(airDate)

            if (!scheduleDate || !scheduleDate.isValid() || !parsedAirDate || !parsedAirDate.isValid()) return true

            // For live/current news and sports, the original air date is usually just the broadcast date.
            // Suppress it when it is close to the scheduled airing. Keep it when it is genuinely old.
            return Math.abs(scheduleDate.diff(parsedAirDate, 'day')) <= 45
          }

          function parseDisplayDate(value) {
            const raw = String(value || '').trim()
            const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
            if (!m) return dayjs(raw)
            return dayjs(`${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`)
          }

          function buildPackedDescription({ programType, episodeTitle, episodeCode, description, airDate, releaseYear, suppressDisplayDate }) {
            const parts = []

            let prefix = ''
            if (programType === 'series' || programType === 'miniseries') {
              if (episodeTitle && episodeCode) prefix = `${episodeTitle} - ${episodeCode}`
              else if (episodeTitle) prefix = episodeTitle
              else if (episodeCode) prefix = episodeCode
            }

            if (prefix) parts.push(prefix)
            if (description) parts.push(description)

            let finalDescription = cleanPackedDescription(parts.join('. '))

            if (programType === 'movie') {
              if (releaseYear && !descriptionIncludesDisplayDate(finalDescription, releaseYear)) {
                finalDescription = finalDescription ? `${finalDescription} (${releaseYear})` : `(${releaseYear})`
              }
              return finalDescription
            }

            if (programType === 'series' || programType === 'miniseries') {
              if (airDate && !suppressDisplayDate && !descriptionIncludesDisplayDate(finalDescription, airDate)) {
                finalDescription = finalDescription ? `${finalDescription} (${airDate})` : `(${airDate})`
              }
              return finalDescription
            }

            const dateOrYear = suppressDisplayDate ? releaseYear : (airDate || releaseYear)
            if (dateOrYear && !descriptionIncludesDisplayDate(finalDescription, dateOrYear)) {
              finalDescription = finalDescription
                ? `${finalDescription} (${dateOrYear})`
                : `(${dateOrYear})`
            }

            return finalDescription
          }

          function cleanPackedDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.??\s*$/i, ' ($1)')
              .trim()
          }

          function descriptionIncludesDisplayDate(description, dateOrYear) {
            if (!description || !dateOrYear) return false
            const escaped = String(dateOrYear).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            return new RegExp(`\\(${escaped}\\)\\s*$`).test(description) || description.includes(String(dateOrYear))
          }

          function buildEpisodeCode(seasonNumber, episodeNumber) {
            const s = String(seasonNumber || '').trim()
            const e = String(episodeNumber || '').trim()

            if (!s && !e) return ''
            if (s && e) return `S${s}E${e}`
            if (e) return `E${e}`
            return `S${s}`
          }

          function cleanTitle(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function formatTVGuideDate(value) {
            const raw = String(value || '').trim()
            if (!raw) return ''

            const tvMatch = raw.match(/\/Date\((\d+)\)\//)
            if (tvMatch) {
              return dayjs(Number(tvMatch[1])).format('MM/DD/YYYY')
            }

            const parsed = dayjs(raw)
            if (parsed.isValid()) return parsed.format('MM/DD/YYYY')

            return ''
          }

          function formatUnixDate(value) {
            if (!value) return ''
            const parsed = dayjs.unix(Number(value))
            return parsed.isValid() ? parsed.format('MM/DD/YYYY') : ''
          }

          function normalizeXmltvDate(value) {
            const parsed = dayjs(value)
            if (!parsed.isValid()) return ''
            return parsed.format('YYYYMMDD')
          }
          EOF

      - name: Grab TVGuide OTA guide with schedule recovery
        run: |
          cd epg

          rm -f ../guides/OTALocalsguide.xml
          rm -f ../guides/OTALocalsguide.pass*.xml
          rm -f ../guides/OTALocalsguide.pass*.log
          rm -f ../guides/OTALocalsguide.pass*.count

          run_pass() {
            PASS_NAME="$1"
            MAX_CONNECTIONS="$2"
            SCHEDULE_TIMEOUT="$3"

            echo ""
            echo "============================================================"
            echo "Starting $PASS_NAME"
            echo "maxConnections=$MAX_CONNECTIONS"
            echo "TVGUIDE_SCHEDULE_TIMEOUT=$SCHEDULE_TIMEOUT"
            echo "============================================================"

            export TVGUIDE_SCHEDULE_TIMEOUT="$SCHEDULE_TIMEOUT"

            set +e
            npx tsx scripts/commands/epg/grab.ts \
              --channels=sites/tvguide.com/festy-ota.channels.xml \
              --output="../guides/OTALocalsguide.${PASS_NAME}.xml" \
              --days=14 \
              --maxConnections="$MAX_CONNECTIONS" \
              2>&1 | tee "../guides/OTALocalsguide.${PASS_NAME}.log"

            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -ne 0 ]; then
              echo "$PASS_NAME exited with status $STATUS"
            fi

            if [ ! -f "../guides/OTALocalsguide.${PASS_NAME}.xml" ]; then
              echo "$PASS_NAME did not create an XML file"
              echo "0" > "../guides/OTALocalsguide.${PASS_NAME}.programmes.count"
              echo "0" > "../guides/OTALocalsguide.${PASS_NAME}.descriptions.count"
              echo "999999" > "../guides/OTALocalsguide.${PASS_NAME}.schedule_issues.count"
              return 0
            fi

            PR=$(grep -c '<programme ' "../guides/OTALocalsguide.${PASS_NAME}.xml" || true)
            DESC=$(grep -c '<desc ' "../guides/OTALocalsguide.${PASS_NAME}.xml" || true)

            ISSUE_COUNT=$(grep -Eic 'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' "../guides/OTALocalsguide.${PASS_NAME}.log" || true)

            echo "$PR" > "../guides/OTALocalsguide.${PASS_NAME}.programmes.count"
            echo "$DESC" > "../guides/OTALocalsguide.${PASS_NAME}.descriptions.count"
            echo "$ISSUE_COUNT" > "../guides/OTALocalsguide.${PASS_NAME}.schedule_issues.count"

            echo "$PASS_NAME programmes: $PR"
            echo "$PASS_NAME descriptions: $DESC"
            echo "$PASS_NAME possible schedule/detail issues: $ISSUE_COUNT"
          }

          run_pass "pass1-fast" 10 8000

          PASS1_ISSUES=$(cat ../guides/OTALocalsguide.pass1-fast.schedule_issues.count)

          if [ "$PASS1_ISSUES" -gt 0 ]; then
            echo ""
            echo "Fast pass had possible issues, running backup schedule pass..."
            run_pass "pass2-backup" 5 15000
          else
            echo ""
            echo "Fast pass had no obvious schedule issues. Skipping backup pass."
          fi

          BEST_PASS="pass1-fast"
          BEST_PR=$(cat ../guides/OTALocalsguide.pass1-fast.programmes.count)
          BEST_DESC=$(cat ../guides/OTALocalsguide.pass1-fast.descriptions.count)
          BEST_ISSUES=$(cat ../guides/OTALocalsguide.pass1-fast.schedule_issues.count)

          if [ -f ../guides/OTALocalsguide.pass2-backup.programmes.count ]; then
            PASS2_PR=$(cat ../guides/OTALocalsguide.pass2-backup.programmes.count)
            PASS2_DESC=$(cat ../guides/OTALocalsguide.pass2-backup.descriptions.count)
            PASS2_ISSUES=$(cat ../guides/OTALocalsguide.pass2-backup.schedule_issues.count)

            if [ "$PASS2_PR" -gt "$BEST_PR" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            elif [ "$PASS2_PR" -eq "$BEST_PR" ] && [ "$PASS2_DESC" -gt "$BEST_DESC" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            elif [ "$PASS2_PR" -eq "$BEST_PR" ] && [ "$PASS2_DESC" -eq "$BEST_DESC" ] && [ "$PASS2_ISSUES" -lt "$BEST_ISSUES" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            fi
          fi

          if [ "$BEST_ISSUES" -gt 0 ]; then
            echo ""
            echo "Best pass still had possible issues, running slow micro schedule pass..."
            run_pass "pass3-micro" 2 30000
          else
            echo ""
            echo "Best pass has no obvious schedule issues. Skipping micro schedule pass."
          fi

          BEST_PASS="pass1-fast"
          BEST_PR=$(cat ../guides/OTALocalsguide.pass1-fast.programmes.count)
          BEST_DESC=$(cat ../guides/OTALocalsguide.pass1-fast.descriptions.count)
          BEST_ISSUES=$(cat ../guides/OTALocalsguide.pass1-fast.schedule_issues.count)

          for PASS in pass2-backup pass3-micro; do
            if [ -f "../guides/OTALocalsguide.${PASS}.programmes.count" ]; then
              CANDIDATE_PR=$(cat "../guides/OTALocalsguide.${PASS}.programmes.count")
              CANDIDATE_DESC=$(cat "../guides/OTALocalsguide.${PASS}.descriptions.count")
              CANDIDATE_ISSUES=$(cat "../guides/OTALocalsguide.${PASS}.schedule_issues.count")

              if [ "$CANDIDATE_PR" -gt "$BEST_PR" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -gt "$BEST_DESC" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -eq "$BEST_DESC" ] && [ "$CANDIDATE_ISSUES" -lt "$BEST_ISSUES" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              fi
            fi
          done

          echo ""
          echo "============================================================"
          echo "Selected best schedule pass: $BEST_PASS"
          echo "Best programmes: $BEST_PR"
          echo "Best descriptions: $BEST_DESC"
          echo "Best possible issues: $BEST_ISSUES"
          echo "============================================================"

          cp "../guides/OTALocalsguide.${BEST_PASS}.xml" "../guides/OTALocalsguide.xml"

          echo ""
          echo "Pass summary:"
          for PASS in pass1-fast pass2-backup pass3-micro; do
            if [ -f "../guides/OTALocalsguide.${PASS}.programmes.count" ]; then
              echo "$PASS:"
              echo "  programmes:   $(cat ../guides/OTALocalsguide.${PASS}.programmes.count)"
              echo "  descriptions: $(cat ../guides/OTALocalsguide.${PASS}.descriptions.count)"
              echo "  issues:       $(cat ../guides/OTALocalsguide.${PASS}.schedule_issues.count)"
            fi
          done

          cd ..

      - name: Fill missing OTA metadata from TMDB, then TVMaze
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          node <<'EOFJS'
          const fs = require('fs')

          const guidePath = 'guides/OTALocalsguide.xml'
          const cachePath = 'guides/.tvmaze-ota-cache.json'
          const tmdbApiKey = process.env.TMDB_API_KEY || ''

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(guidePath, 'utf8')
          let cache = { tmdb: {}, tvmaze: {} }

          if (fs.existsSync(cachePath)) {
            try {
              const loaded = JSON.parse(fs.readFileSync(cachePath, 'utf8'))
              if (loaded && typeof loaded === 'object' && (loaded.tmdb || loaded.tvmaze)) {
                cache = { tmdb: loaded.tmdb || {}, tvmaze: loaded.tvmaze || {} }
              } else if (loaded && typeof loaded === 'object') {
                // Backward-compatible with the old TVMaze-only cache format.
                cache = { tmdb: {}, tvmaze: loaded }
              }
            } catch {
              cache = { tmdb: {}, tvmaze: {} }
            }
          }

          const stats = {
            programmes: 0,
            moviesSkipped: 0,
            tmdbSkippedNoKey: 0,
            tmdbShowsSearched: 0,
            tmdbShowsMatched: 0,
            tmdbEpisodesMatched: 0,
            tmdbProgrammesEnriched: 0,
            tvmazeShowsSearched: 0,
            tvmazeShowsMatched: 0,
            tvmazeEpisodesMatched: 0,
            tvmazeProgrammesEnriched: 0,
            tmdbAddedCategory: 0,
            tmdbAddedEpisodeTitle: 0,
            tmdbAddedEpisodeCode: 0,
            tmdbAddedDate: 0,
            tmdbAddedDescription: 0,
            tvmazeAddedCategory: 0,
            tvmazeAddedEpisodeTitle: 0,
            tvmazeAddedEpisodeCode: 0,
            tvmazeAddedDate: 0,
            tvmazeAddedDescription: 0,
            categoriesAdded: 0,
            descriptionsChanged: 0
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function stripTags(s) {
            return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim())
          }

          function getTag(block, tag) {
            const m = block.match(new RegExp(`<${tag}\\b[^>]*>([\s\S]*?)<\/${tag}>`, 'i'))
            return m ? stripTags(m[1]) : ''
          }

          function getTags(block, tag) {
            return [...block.matchAll(new RegExp(`<${tag}\\b[^>]*>([\s\S]*?)<\/${tag}>`, 'gi'))]
              .map(m => stripTags(m[1]))
              .filter(Boolean)
          }

          function hasTag(block, tag) {
            return new RegExp(`<${tag}\\b`, 'i').test(block)
          }

          function hasCategory(block, category) {
            return getTags(block, 'category').some(c => c.toLowerCase() === category.toLowerCase())
          }

          function hasAnyCategory(block) {
            return hasTag(block, 'category')
          }

          function isMovie(block) {
            return hasCategory(block, 'Movie') || hasCategory(block, 'Film')
          }

          function cleanTitleForSearch(title) {
            return String(title || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/\+/g, 'plus')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function sameNorm(a, b) {
            return normalize(a) === normalize(b)
          }

          function scoreName(title, candidate) {
            const a = normalize(title)
            const b = normalize(candidate)
            if (!a || !b) return 0
            if (a === b) return 100
            if (a.includes(b) || b.includes(a)) return 82
            const aw = new Set(a.split(' ').filter(Boolean))
            const bw = b.split(' ').filter(Boolean)
            const overlap = bw.filter(w => aw.has(w)).length
            return Math.round((overlap / Math.max(aw.size, bw.length, 1)) * 75)
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function cleanSummary(value) {
            return decodeXml(String(value || '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim())
          }

          function formatDateDisplay(date) {
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return ''
            return `${date.slice(5, 7)}/${date.slice(8, 10)}/${date.slice(0, 4)}`
          }

          function getStartDate(block) {
            const m = block.match(/start="(\d{8})/i)
            if (!m) return ''
            return `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}`
          }

          function parseEpisodeCode(value) {
            const m = String(value || '').match(/\bS(\d+)E(\d+)\b/i)
            if (!m) return null
            return { season: Number(m[1]), episode: Number(m[2]), code: `S${Number(m[1])}E${Number(m[2])}` }
          }

          function buildEpisodeCode(season, episode) {
            const s = Number(season)
            const e = Number(episode)
            if (!Number.isFinite(s) || !Number.isFinite(e) || s < 1 || e < 1) return ''
            return `S${s}E${e}`
          }

          function parsePackedDescription(desc) {
            const original = cleanSpaces(desc)
            let working = original
            let dateText = ''

            const dateMatch = working.match(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/)
            if (dateMatch) {
              dateText = dateMatch[1]
              working = working.slice(0, dateMatch.index).trim()
            }

            let episodeTitle = ''
            let episodeCode = ''
            let body = working
            const firstSentence = working.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            const rest = firstSentence && firstSentence[0].length < working.length
              ? working.slice(firstSentence[0].length).trim()
              : ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            const codeOnlyMatch = first.match(/^(S\d+E\d+|S\d+|E\d+)$/i)

            if (prefixMatch) {
              episodeTitle = prefixMatch[1].trim()
              episodeCode = prefixMatch[2].toUpperCase()
              body = rest
            } else if (codeOnlyMatch) {
              episodeCode = codeOnlyMatch[1].toUpperCase()
              body = rest
            } else if (first && rest && first.length <= 80 && !/[!?]$/.test(first)) {
              // Provider often packs episode title as the first sentence.
              // Treat it as provider-owned episode title, but keep the body untouched.
              episodeTitle = first
              body = rest
            } else {
              const code = parseEpisodeCode(working)
              if (code) episodeCode = code.code
              body = working
            }

            return {
              original,
              episodeTitle,
              episodeCode,
              body,
              dateText
            }
          }

          function descHasDisplayDate(desc, date) {
            const display = formatDateDisplay(date)
            if (!desc || !display) return false
            return desc.includes(`(${display})`) || desc.includes(display)
          }

          function buildPackedDescription(parts) {
            const prefixParts = []
            if (parts.episodeTitle) prefixParts.push(parts.episodeTitle)
            if (parts.episodeCode) {
              if (prefixParts.length) prefixParts[0] = `${prefixParts[0]} - ${parts.episodeCode}`
              else prefixParts.push(parts.episodeCode)
            }

            const out = []
            if (prefixParts[0]) out.push(prefixParts[0])
            if (parts.body) {
              const prefixNorm = normalize(prefixParts[0] || '')
              const bodyNorm = normalize(parts.body)
              if (!prefixNorm || prefixNorm !== bodyNorm) out.push(parts.body)
            }

            let finalDesc = cleanSpaces(out.join('. '))
            if (parts.dateText) finalDesc = finalDesc ? `${finalDesc} (${parts.dateText})` : `(${parts.dateText})`
            return cleanSpaces(finalDesc)
          }

          function replaceTag(block, tag, value) {
            const escaped = escapeXml(value)
            const tagXml = `  <${tag} lang="en">${escaped}</${tag}>`
            if (hasTag(block, tag)) {
              return block.replace(new RegExp(`<${tag}\\b[^>]*>[\s\S]*?<\/${tag}>`, 'i'), tagXml.trim())
            }
            return insertBeforeProgrammeEnd(block, tagXml)
          }

          function insertBeforeProgrammeEnd(block, tagXml) {
            return block.replace(/<\/programme>\s*$/i, `${tagXml}\n</programme>`)
          }

          function missingPieces(block) {
            const desc = getTag(block, 'desc')
            const parsed = parsePackedDescription(desc)
            return {
              missingCategory: !hasAnyCategory(block),
              missingEpisodeTitle: !parsed.episodeTitle,
              missingEpisodeCode: !parsed.episodeCode,
              missingBody: !parsed.body,
              missingDate: !parsed.dateText,
              parsed
            }
          }

          function needsEnrichment(block) {
            const m = missingPieces(block)
            return m.missingCategory || m.missingEpisodeTitle || m.missingEpisodeCode || m.missingBody || m.missingDate
          }

          async function fetchJson(url, label, headers = {}) {
            const attempts = 4
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, { headers })
                if (response.status === 404) return null
                if (response.status === 429 || response.status >= 500) throw new Error(`HTTP ${response.status}`)
                if (!response.ok) return null
                return await response.json()
              } catch (err) {
                if (attempt === attempts) {
                  console.log(`[FETCH FAIL] ${label} | ${err.message}`)
                  return null
                }
                const delay = 800 * attempt + Math.floor(Math.random() * 400)
                console.log(`[FETCH RETRY] ${label} | ${err.message} | attempt=${attempt}/${attempts}`)
                await sleep(delay)
              }
            }
            return null
          }

          function tmdbUrl(path, params = {}) {
            const url = new URL(`https://api.themoviedb.org/3${path}`)
            url.searchParams.set('api_key', tmdbApiKey)
            url.searchParams.set('language', 'en-US')
            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, value)
            }
            return url.href
          }

          async function tmdbSearchShow(title) {
            if (!tmdbApiKey) return null
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]

            stats.tmdbShowsSearched++
            const data = await fetchJson(tmdbUrl('/search/tv', { query: title }), `tmdb search ${title}`, { 'User-Agent': 'festy-epg-ota-tmdb-tvmaze-missing-only/1.0' })
            const results = Array.isArray(data?.results) ? data.results : []

            let best = null
            let bestScore = 0
            for (const show of results) {
              const score = Math.max(scoreName(title, show.name), scoreName(title, show.original_name))
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null
            if (best) stats.tmdbShowsMatched++

            cache.tmdb[key] = best
            await sleep(125)
            return best
          }

          async function tmdbShowDetails(showId) {
            if (!tmdbApiKey || !showId) return null
            const key = `details:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]
            const details = await fetchJson(tmdbUrl(`/tv/${showId}`), `tmdb details ${showId}`, { 'User-Agent': 'festy-epg-ota-tmdb-tvmaze-missing-only/1.0' })
            cache.tmdb[key] = details || null
            await sleep(125)
            return cache.tmdb[key]
          }

          async function tmdbSeason(showId, seasonNumber) {
            if (!tmdbApiKey || !showId || !seasonNumber) return null
            const key = `season:${showId}:${seasonNumber}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]
            const season = await fetchJson(tmdbUrl(`/tv/${showId}/season/${seasonNumber}`), `tmdb season ${showId}/${seasonNumber}`, { 'User-Agent': 'festy-epg-ota-tmdb-tvmaze-missing-only/1.0' })
            cache.tmdb[key] = season || null
            await sleep(125)
            return cache.tmdb[key]
          }

          async function tmdbFindEpisode(show, parsed) {
            if (!show?.id) return null

            const code = parseEpisodeCode(parsed.episodeCode)
            if (code) {
              const season = await tmdbSeason(show.id, code.season)
              const episode = season?.episodes?.find(ep => Number(ep.episode_number) === code.episode)
              if (episode) return episode
            }

            const episodeTitle = parsed.episodeTitle
            if (!episodeTitle) return null

            const details = await tmdbShowDetails(show.id)
            const seasons = Array.isArray(details?.seasons) ? details.seasons : []
            const regularSeasons = seasons
              .map(s => Number(s.season_number))
              .filter(n => Number.isFinite(n) && n > 0)
              .slice(0, 60)

            for (const seasonNumber of regularSeasons) {
              const season = await tmdbSeason(show.id, seasonNumber)
              const episodes = Array.isArray(season?.episodes) ? season.episodes : []
              const exact = episodes.find(ep => sameNorm(ep.name, episodeTitle))
              if (exact) return exact
              const fuzzy = episodes.find(ep => scoreName(episodeTitle, ep.name) >= 92)
              if (fuzzy) return fuzzy
            }

            return null
          }

          async function tmdbEnrichState(state, title, block) {
            if (!tmdbApiKey) {
              stats.tmdbSkippedNoKey++
              return state
            }

            const show = await tmdbSearchShow(title)
            if (!show) return state

            const details = await tmdbShowDetails(show.id)
            const episode = await tmdbFindEpisode(show, state)
            if (episode) stats.tmdbEpisodesMatched++

            let changed = false
            const next = { ...state }

            if (!next.category) {
              const type = String(details?.type || '').toLowerCase()
              next.category = type.includes('mini') ? 'Miniseries' : 'Series'
              changed = true
              stats.tmdbAddedCategory++
            }

            if (episode) {
              if (!next.episodeTitle && episode.name) { next.episodeTitle = cleanSummary(episode.name); changed = true; stats.tmdbAddedEpisodeTitle++ }
              if (!next.episodeCode) {
                const code = buildEpisodeCode(episode.season_number, episode.episode_number)
                if (code) { next.episodeCode = code; changed = true; stats.tmdbAddedEpisodeCode++ }
              }
              if (!next.dateText && episode.air_date) {
                const display = formatDateDisplay(episode.air_date)
                if (display) { next.dateText = display; changed = true; stats.tmdbAddedDate++ }
              }
              if (!next.body && episode.overview) { next.body = cleanSummary(episode.overview); changed = true; stats.tmdbAddedDescription++ }
            }

            if (!next.body && details?.overview) { next.body = cleanSummary(details.overview); changed = true; stats.tmdbAddedDescription++ }

            if (changed) stats.tmdbProgrammesEnriched++
            return next
          }

          async function tvmazeSearchShow(title) {
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache.tvmaze, key)) return cache.tvmaze[key]

            stats.tvmazeShowsSearched++
            const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`
            const result = await fetchJson(url, `tvmaze search ${title}`, { 'User-Agent': 'festy-epg-ota-tmdb-tvmaze-missing-only/1.0' })
            const candidates = Array.isArray(result) ? result.map(x => x.show).filter(Boolean) : []

            let best = null
            let bestScore = 0
            for (const show of candidates) {
              const type = String(show?.type || '').toLowerCase()
              if (type === 'movie' || type === 'film') continue
              const score = scoreName(title, show.name)
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null
            if (best) stats.tvmazeShowsMatched++

            cache.tvmaze[key] = best
            await sleep(250)
            return best
          }

          async function tvmazeEpisodes(showId) {
            const key = `episodes:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache.tvmaze, key)) return cache.tvmaze[key]

            const episodes = await fetchJson(`https://api.tvmaze.com/shows/${showId}/episodes`, `tvmaze episodes ${showId}`, { 'User-Agent': 'festy-epg-ota-tmdb-tvmaze-missing-only/1.0' })
            cache.tvmaze[key] = Array.isArray(episodes) ? episodes : []
            await sleep(250)
            return cache.tvmaze[key]
          }

          async function tvmazeFindEpisode(show, state, block) {
            if (!show?.id) return null
            const episodes = await tvmazeEpisodes(show.id)
            const code = parseEpisodeCode(state.episodeCode)
            if (code) {
              const byCode = episodes.find(ep => Number(ep.season) === code.season && Number(ep.number) === code.episode)
              if (byCode) return byCode
            }

            if (state.episodeTitle) {
              const byTitle = episodes.find(ep => sameNorm(ep.name, state.episodeTitle)) ||
                episodes.find(ep => scoreName(state.episodeTitle, ep.name) >= 92)
              if (byTitle) return byTitle
            }

            const scheduleDate = getStartDate(block)
            if (scheduleDate) {
              const byDate = episodes.find(ep => ep.airdate === scheduleDate)
              if (byDate) return byDate
            }

            return null
          }

          async function tvmazeEnrichState(state, title, block) {
            const show = await tvmazeSearchShow(title)
            if (!show) return state

            const episode = await tvmazeFindEpisode(show, state, block)
            if (episode) stats.tvmazeEpisodesMatched++

            let changed = false
            const next = { ...state }

            if (!next.category) {
              const type = String(show?.type || '').toLowerCase()
              next.category = type.includes('mini') || type.includes('limited') ? 'Miniseries' : 'Series'
              changed = true
              stats.tvmazeAddedCategory++
            }

            if (episode) {
              if (!next.episodeTitle && episode.name) { next.episodeTitle = cleanSummary(episode.name); changed = true; stats.tvmazeAddedEpisodeTitle++ }
              if (!next.episodeCode) {
                const code = buildEpisodeCode(episode.season, episode.number)
                if (code) { next.episodeCode = code; changed = true; stats.tvmazeAddedEpisodeCode++ }
              }
              if (!next.dateText && episode.airdate) {
                const display = formatDateDisplay(episode.airdate)
                if (display) { next.dateText = display; changed = true; stats.tvmazeAddedDate++ }
              }
              if (!next.body && episode.summary) { next.body = cleanSummary(episode.summary); changed = true }
            }

            if (!next.body && show?.summary) { next.body = cleanSummary(show.summary); changed = true }

            if (changed) stats.tvmazeProgrammesEnriched++
            return next
          }

          function stateFromBlock(block) {
            const desc = getTag(block, 'desc')
            const parsed = parsePackedDescription(desc)
            const categories = getTags(block, 'category')
            return {
              episodeTitle: parsed.episodeTitle,
              episodeCode: parsed.episodeCode,
              body: parsed.body,
              dateText: parsed.dateText,
              category: categories[0] || '',
              originalDesc: parsed.original
            }
          }

          function applyStateMissingOnly(block, before, after) {
            let updated = block
            let changed = false

            if (!before.category && after.category && !hasAnyCategory(updated)) {
              updated = insertBeforeProgrammeEnd(updated, `  <category lang="en">${escapeXml(after.category)}</category>`)
              changed = true
              stats.categoriesAdded++
            }

            const beforeDesc = buildPackedDescription(before)
            const afterDesc = buildPackedDescription(after)
            const existingDesc = getTag(updated, 'desc')

            if (afterDesc && afterDesc !== existingDesc && afterDesc !== beforeDesc) {
              updated = replaceTag(updated, 'desc', afterDesc)
              changed = true
              stats.descriptionsChanged++
            }

            return { block: updated, changed }
          }

          async function main() {
            const parts = xml.split(/(<programme\b[\s\S]*?<\/programme>)/gi)
            const out = []

            for (const part of parts) {
              if (!/^<programme\b/i.test(part)) {
                out.push(part)
                continue
              }

              stats.programmes++
              let block = part
              const title = cleanTitleForSearch(getTag(block, 'title'))

              if (!title || isMovie(block) || !needsEnrichment(block)) {
                if (isMovie(block)) stats.moviesSkipped++
                out.push(block)
                continue
              }

              const providerState = stateFromBlock(block)
              let currentState = { ...providerState }

              currentState = await tmdbEnrichState(currentState, title, block)
              currentState = await tvmazeEnrichState(currentState, title, block)

              const applied = applyStateMissingOnly(block, providerState, currentState)
              out.push(applied.block)
            }

            fs.writeFileSync(guidePath, out.join(''))
            fs.writeFileSync(cachePath, JSON.stringify(cache, null, 2))

            console.log('[TMDB+TVMAZE] missing-only enrichment complete')
            console.log(`[TMDB+TVMAZE] programmes scanned: ${stats.programmes}`)
            console.log(`[TMDB+TVMAZE] movies skipped: ${stats.moviesSkipped}`)
            console.log(`[TMDB+TVMAZE] tmdb skipped no key: ${stats.tmdbSkippedNoKey}`)
            console.log(`[TMDB+TVMAZE] tmdb shows searched: ${stats.tmdbShowsSearched}`)
            console.log(`[TMDB+TVMAZE] tmdb shows matched: ${stats.tmdbShowsMatched}`)
            console.log(`[TMDB+TVMAZE] tmdb episodes matched: ${stats.tmdbEpisodesMatched}`)
            console.log(`[TMDB+TVMAZE] tmdb programmes enriched: ${stats.tmdbProgrammesEnriched}`)
            console.log(`[TMDB+TVMAZE] tvmaze shows searched: ${stats.tvmazeShowsSearched}`)
