name: TVGuide-HBO-SourceID-Quarantine-Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan HBO source IDs only
        run: |
          mkdir -p quarantine-tvguide-hbo-scan

          cat > quarantine-tvguide-hbo-scan/scan.cjs <<'EOF'
          const fs = require('fs')

          const PROVIDER = '9100002976'
          const API_KEY = 'DI9elXhZ3bU6ujsA2gXEKOANyncXGUGc'

          const SEARCH_TERMS = [
            'HBO',
            'HOME BOX',
            'MAX'
          ]

          function startOfTodayUTC() {
            const d = new Date()
            return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000)
          }

          async function fetchJson(url) {
            const res = await fetch(url, {
              headers: {
                Referer: 'https://www.tvguide.com/',
                'User-Agent': 'Mozilla/5.0'
              }
            })

            const text = await res.text()

            try {
              return {
                ok: res.ok,
                status: res.status,
                json: JSON.parse(text)
              }
            } catch {
              return {
                ok: false,
                status: res.status,
                text
              }
            }
          }

          function extractName(item) {
            return [
              item.fullName,
              item.name,
              item.callSign,
              item.channel?.fullName,
              item.channel?.name,
              item.channel?.callSign
            ].filter(Boolean).join(' | ')
          }

          function extractSourceId(item) {
            return String(
              item.sourceId ||
              item.channelSourceId ||
              item.id ||
              item.channel?.sourceId ||
              ''
            )
          }

          ;(async () => {
            const start = startOfTodayUTC()
            const url = `https://backend.tvguide.com/tvschedules/tvguide/${PROVIDER}/web?start=${start}&duration=1440&apiKey=${API_KEY}`

            console.log('QUARANTINED HBO SOURCE ID SCAN')
            console.log('Provider:', PROVIDER)
            console.log('URL:', url)

            const result = await fetchJson(url)

            fs.writeFileSync(
              'quarantine-tvguide-hbo-scan/raw-provider-response.json',
              JSON.stringify(result, null, 2)
            )

            const items = result.json?.data?.items || []

            console.log('Total provider items returned:', items.length)

            const matches = items
              .map(item => {
                const name = extractName(item)
                const sourceId = extractSourceId(item)
                const schedules = Array.isArray(item.programSchedules)
                  ? item.programSchedules.length
                  : 0

                return {
                  sourceId,
                  name,
                  schedules
                }
              })
              .filter(x => {
                const haystack = `${x.name} ${x.sourceId}`.toUpperCase()
                return SEARCH_TERMS.some(term => haystack.includes(term))
              })

            fs.writeFileSync(
              'quarantine-tvguide-hbo-scan/hbo-sourceid-matches.json',
              JSON.stringify(matches, null, 2)
            )

            console.log('')
            console.log('=== HBO / MAX MATCHES ===')

            if (!matches.length) {
              console.log('No HBO/MAX matches found in this provider-wide response.')
            }

            for (const m of matches) {
              console.log(`${m.sourceId} | ${m.name} | schedules=${m.schedules}`)
            }

            console.log('')
            console.log('Wrote:')
            console.log('quarantine-tvguide-hbo-scan/raw-provider-response.json')
            console.log('quarantine-tvguide-hbo-scan/hbo-sourceid-matches.json')
          })()
          EOF

          cd quarantine-tvguide-hbo-scan
          node scan.cjs

      - name: Upload quarantined scan results
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-tvguide-hbo-scan
          path: quarantine-tvguide-hbo-scan/
