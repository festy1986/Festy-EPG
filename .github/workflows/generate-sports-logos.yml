name: Build Sports Logos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-logo-builder
  cancel-in-progress: false

jobs:
  build-sports-logos:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow


      - name: Build sports logo library
        run: |

          python - <<'PY'

          import os
          import re
          import time
          import requests

          from io import BytesIO

          from PIL import (
              Image,
              ImageDraw
          )


          API_URL = (
              "https://www.thesportsdb.com/"
              "api/v1/json/123"
          )


          OUTPUT_ROOT = (
              "sports-logos"
          )


          LEAGUES = {

              "MLB":
              "MLB",

              "NBA":
              "NBA",

              "NFL":
              "NFL",

              "NHL":
              "NHL"

          }


          session = requests.Session()


          session.headers.update(

              {

                  "User-Agent":
                  "Festy Sports Logo Builder"

              }

          )


          def clean_filename(
              text
          ):

              text = str(
                  text
                  or ""
              )


              text = re.sub(
                  r"[^A-Za-z0-9]+",
                  "_",
                  text
              )


              text = re.sub(
                  r"_+",
                  "_",
                  text
              )


              return text.strip(
                  "_"
              )


          def api_get(
              endpoint,
              params=None
          ):

              url = (
                  f"{API_URL}/"
                  f"{endpoint}"
              )


              for attempt in range(
                  1,
                  4
              ):

                  try:

                      response = session.get(
                          url,
                          params=params,
                          timeout=60
                      )


                      if response.status_code == 429:

                          print(
                              "API rate limit reached."
                          )


                          time.sleep(
                              65
                          )


                          continue


                      response.raise_for_status()


                      return response.json()


                  except Exception as e:

                      print(
                          f"API request failed "
                          f"({attempt}/3):"
                      )


                      print(
                          e
                      )


                      if attempt < 3:

                          time.sleep(
                              10
                          )


              return {}


          def download_image(
              url
          ):

              if not url:

                  return None


              try:

                  response = session.get(
                      url,
                      timeout=60
                  )


                  response.raise_for_status()


                  return Image.open(

                      BytesIO(
                          response.content
                      )

                  ).convert(
                      "RGBA"
                  )


              except Exception as e:

                  print(
                      "Unable to download image:"
                  )


                  print(
                      url
                  )


                  print(
                      e
                  )


                  return None


          def resize_logo(
              image
          ):

              image = image.copy()


              image.thumbnail(

                  (
                      420,
                      420
                  ),

                  Image.Resampling.LANCZOS

              )


              return image


          def create_matchup_logo(

              away_logo,

              home_logo

          ):

              canvas_width = 1000

              canvas_height = 500


              canvas = Image.new(

                  "RGBA",

                  (

                      canvas_width,

                      canvas_height

                  ),

                  (

                      255,

                      255,

                      255,

                      0

                  )

              )


              away_logo = resize_logo(

                  away_logo

              )


              home_logo = resize_logo(

                  home_logo

              )


              away_x = (

                  40

                  +

                  (

                      420

                      -

                      away_logo.width

                  )

                  // 2

              )


              away_y = (

                  (

                      canvas_height

                      -

                      away_logo.height

                  )

                  // 2

              )


              home_x = (

                  540

                  +

                  (

                      420

                      -

                      home_logo.width

                  )

                  // 2

              )


              home_y = (

                  (

                      canvas_height

                      -

                      home_logo.height

                  )

                  // 2

              )


              canvas.alpha_composite(

                  away_logo,

                  (

                      away_x,

                      away_y

                  )

              )


              canvas.alpha_composite(

                  home_logo,

                  (

                      home_x,

                      home_y

                  )

              )


              draw = ImageDraw.Draw(

                  canvas

              )


              draw.text(

                  (

                      500,

                      250

                  ),

                  "VS",

                  anchor="mm"

              )


              return canvas


          def get_teams(
              league_name
          ):

              data = api_get(

                  "search_all_teams.php",

                  {

                      "l":
                      league_name

                  }

              )


              return (

                  data.get(
                      "teams",
                      []
                  )

                  or []

              )


          def get_team_schedule(
              team_id,
              endpoint
          ):

              data = api_get(

                  endpoint,

                  {

                      "id":
                      team_id

                  }

              )


              return (

                  data.get(
                      "events",
                      []
                  )

                  or []

              )


          total_teams = 0

          total_matchups = 0

          skipped_existing = 0

          failed_images = 0

          schedule_events = 0


          for folder_name, league_name in LEAGUES.items():


              print()


              print(
                  "===================================="
              )


              print(
                  f"PROCESSING {folder_name}"
              )


              print(
                  "===================================="
              )


              teams = get_teams(

                  league_name

              )


              if not teams:

                  print(
                      f"No teams found for "
                      f"{league_name}"
                  )


                  continue


              team_records = []


              for team in teams:


                  team_id = (

                      team.get(
                          "idTeam"
                      )

                      or ""

                  )


                  team_name = (

                      team.get(
                          "strTeam"
                      )

                      or ""

                  )


                  team_badge = (

                      team.get(
                          "strTeamBadge"
                      )

                      or team.get(
                          "strTeamLogo"
                      )

                      or ""

                  )


                  if not team_id:

                      continue


                  if not team_name:

                      continue


                  team_records.append(

                      {

                          "id":
                          str(
                              team_id
                          ),

                          "name":
                          team_name,

                          "folder":
                          clean_filename(
                              team_name
                          ),

                          "badge":
                          team_badge

                      }

                  )


              print(

                  f"Teams found: "
                  f"{len(team_records)}"

              )


              loaded_teams = []


              for team in team_records:


                  team_folder_path = os.path.join(

                      OUTPUT_ROOT,

                      folder_name,

                      team["folder"]

                  )


                  os.makedirs(

                      team_folder_path,

                      exist_ok=True

                  )


                  individual_logo_path = os.path.join(

                      team_folder_path,

                      f"{team['folder']}.png"

                  )


                  individual_logo = None


                  if os.path.exists(

                      individual_logo_path

                  ):

                      try:

                          individual_logo = Image.open(

                              individual_logo_path

                          ).convert(

                              "RGBA"

                          )


                          print(

                              f"Existing logo: "
                              f"{team['name']}"

                          )


                      except Exception:

                          individual_logo = None


                  if individual_logo is None:


                      print(

                          f"Downloading logo: "
                          f"{team['name']}"

                      )


                      individual_logo = download_image(

                          team["badge"]

                      )


                      if individual_logo is None:

                          failed_images += 1

                          continue


                      individual_logo.save(

                          individual_logo_path,

                          "PNG"

                      )


                      time.sleep(

                          2

                      )


                  loaded_teams.append(

                      (

                          team,

                          individual_logo

                      )

                  )


              total_teams += len(

                  loaded_teams

              )


              team_lookup = {

                  team["id"]:
                  (

                      team,

                      logo

                  )

                  for team, logo

                  in loaded_teams

              }


              print(

                  "Reading past and upcoming "
                  "team schedules..."

              )


              matchup_pairs = set()


              for team, logo in loaded_teams:


                  team_id = team["id"]


                  upcoming_events = get_team_schedule(

                      team_id,

                      "eventsnext.php"

                  )


                  time.sleep(

                      2

                  )


                  previous_events = get_team_schedule(

                      team_id,

                      "eventslast.php"

                  )


                  time.sleep(

                      2

                  )


                  events = (

                      upcoming_events

                      +

                      previous_events

                  )


                  schedule_events += len(

                      events

                  )


                  for event in events:


                      home_id = str(

                          event.get(

                              "idHomeTeam",

                              ""

                          )

                      )


                      away_id = str(

                          event.get(

                              "idAwayTeam",

                              ""

                          )

                      )


                      if not home_id:

                          continue


                      if not away_id:

                          continue


                      if home_id == away_id:

                          continue


                      if home_id not in team_lookup:

                          continue


                      if away_id not in team_lookup:

                          continue


                      matchup_pairs.add(

                          (

                              away_id,

                              home_id

                          )

                      )


              print(

                  f"Schedule matchups found: "
                  f"{len(matchup_pairs)}"

              )


              for away_id, home_id in sorted(

                  matchup_pairs

              ):


                  away_team, away_logo = team_lookup[

                      away_id

                  ]


                  home_team, home_logo = team_lookup[

                      home_id

                  ]


                  matchup_filename = (

                      f"{away_team['folder']}"

                      f"_vs_"

                      f"{home_team['folder']}"

                      f".png"

                  )


                  matchup_path = os.path.join(

                      OUTPUT_ROOT,

                      folder_name,

                      away_team["folder"],

                      matchup_filename

                  )


                  if os.path.exists(

                      matchup_path

                  ):

                      skipped_existing += 1

                      continue


                  matchup_logo = create_matchup_logo(

                      away_logo,

                      home_logo

                  )


                  matchup_logo.save(

                      matchup_path,

                      "PNG"

                  )


                  total_matchups += 1


                  print(

                      f"Created: "
                      f"{folder_name}/"
                      f"{away_team['folder']}/"
                      f"{matchup_filename}"

                  )


              print(

                  f"Finished {folder_name}"

              )


          print()


          print(

              "===================================="

          )


          print(

              "SPORTS LOGO BUILD COMPLETE"

          )


          print(

              "===================================="

          )


          print(

              f"Teams stored: "
              f"{total_teams}"

          )


          print(

              f"Schedule events checked: "
              f"{schedule_events}"

          )


          print(

              f"New matchup logos created: "
              f"{total_matchups}"

          )


          print(

              f"Existing matchup logos skipped: "
              f"{skipped_existing}"

          )


          print(

              f"Failed images: "
              f"{failed_images}"

          )

          PY


      - name: Commit and push sports logos
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"


          git add sports-logos/


          if git diff --cached --quiet; then

            echo "No new sports logos to commit"

            exit 0

          fi


          git commit -m "Build sports logo library"


          git push
