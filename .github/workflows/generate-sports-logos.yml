name: Build Sports Logos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-logo-builder
  cancel-in-progress: false

jobs:
  build-sports-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Build sports logo library
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import requests

          from io import BytesIO
          from PIL import Image, ImageOps, ImageDraw


          API_URL = "https://www.thesportsdb.com/api/v1/json/123"

          OUTPUT_ROOT = "sports-logos"


          LEAGUES = {
              "MLB": "MLB",
              "NBA": "NBA",
              "NFL": "NFL",
              "NHL": "NHL",
          }


          session = requests.Session()

          session.headers.update(
              {
                  "User-Agent":
                  "Festy Sports Logo Builder"
              }
          )


          def clean_filename(text):

              text = str(
                  text
                  or ""
              )


              text = re.sub(
                  r"[^A-Za-z0-9]+",
                  "_",
                  text
              )


              text = re.sub(
                  r"_+",
                  "_",
                  text
              )


              return text.strip(
                  "_"
              )


          def download_image(url):

              if not url:

                  return None


              try:

                  response = session.get(
                      url,
                      timeout=60
                  )


                  response.raise_for_status()


                  return Image.open(
                      BytesIO(
                          response.content
                      )
                  ).convert(
                      "RGBA"
                  )


              except Exception as e:

                  print(
                      f"Unable to download image:"
                      f" {url}"
                  )


                  print(
                      e
                  )


                  return None


          def resize_logo(image):

              image = image.copy()


              image.thumbnail(
                  (
                      420,
                      420
                  ),
                  Image.Resampling.LANCZOS
              )


              return image


          def create_matchup_logo(

              away_logo,

              home_logo

          ):

              canvas_width = 1000

              canvas_height = 500


              canvas = Image.new(

                  "RGBA",

                  (

                      canvas_width,

                      canvas_height

                  ),

                  (

                      255,

                      255,

                      255,

                      0

                  )

              )


              away_logo = resize_logo(

                  away_logo

              )


              home_logo = resize_logo(

                  home_logo

              )


              away_x = (

                  40

                  +

                  (

                      420

                      -

                      away_logo.width

                  )

                  // 2

              )


              away_y = (

                  (

                      canvas_height

                      -

                      away_logo.height

                  )

                  // 2

              )


              home_x = (

                  540

                  +

                  (

                      420

                      -

                      home_logo.width

                  )

                  // 2

              )


              home_y = (

                  (

                      canvas_height

                      -

                      home_logo.height

                  )

                  // 2

              )


              canvas.alpha_composite(

                  away_logo,

                  (

                      away_x,

                      away_y

                  )

              )


              canvas.alpha_composite(

                  home_logo,

                  (

                      home_x,

                      home_y

                  )

              )


              draw = ImageDraw.Draw(

                  canvas

              )


              draw.text(

                  (

                      500,

                      250

                  ),

                  "VS",

                  anchor="mm"

              )


              return canvas


          def get_teams(

              league_name

          ):

              url = (

                  f"{API_URL}"

                  f"/search_all_teams.php"

              )


              response = session.get(

                  url,

                  params={

                      "l":

                      league_name

                  },

                  timeout=60

              )


              response.raise_for_status()


              data = response.json()


              return (

                  data.get(

                      "teams",

                      []

                  )

                  or []

              )


          total_teams = 0

          total_matchups = 0

          skipped_existing = 0

          failed_images = 0


          for folder_name, league_name in LEAGUES.items():

              print()

              print(

                  "===================================="

              )

              print(

                  f"Processing {folder_name}"

              )

              print(

                  "===================================="

              )


              teams = get_teams(

                  league_name

              )


              if not teams:

                  print(

                      f"No teams found for {league_name}"

                  )


                  continue


              team_records = []


              for team in teams:

                  team_name = (

                      team.get(

                          "strTeam"

                      )

                      or ""

                  )


                  team_badge = (

                      team.get(

                          "strTeamBadge"

                      )

                      or team.get(

                          "strTeamLogo"

                      )

                      or ""

                  )


                  if not team_name:

                      continue


                  team_folder = clean_filename(

                      team_name

                  )


                  team_records.append(

                      {

                          "name":

                          team_name,

                          "folder":

                          team_folder,

                          "badge":

                          team_badge

                      }

                  )


              print(

                  f"Teams found: "

                  f"{len(team_records)}"

              )


              loaded_teams = []


              for team in team_records:

                  team_folder_path = os.path.join(

                      OUTPUT_ROOT,

                      folder_name,

                      team["folder"]

                  )


                  os.makedirs(

                      team_folder_path,

                      exist_ok=True

                  )


                  individual_logo_path = os.path.join(

                      team_folder_path,

                      f"{team['folder']}.png"

                  )


                  if os.path.exists(

                      individual_logo_path

                  ):

                      try:

                          individual_logo = Image.open(

                              individual_logo_path

                          ).convert(

                              "RGBA"

                          )


                          loaded_teams.append(

                              (

                                  team,

                                  individual_logo

                              )

                          )


                          print(

                              f"Existing logo: "

                              f"{team['name']}"

                          )


                          continue


                      except Exception:

                          pass


                  print(

                      f"Downloading logo: "

                      f"{team['name']}"

                  )


                  individual_logo = download_image(

                      team["badge"]

                  )


                  if individual_logo is None:

                      failed_images += 1

                      continue


                  individual_logo.save(

                      individual_logo_path,

                      "PNG"

                  )


                  loaded_teams.append(

                      (

                          team,

                          individual_logo

                      )

                  )


                  time.sleep(

                      0.25

                  )


              total_teams += len(

                  loaded_teams

              )


              for away_team, away_logo in loaded_teams:

                  for home_team, home_logo in loaded_teams:

                      if away_team["folder"] == home_team["folder"]:

                          continue


                      matchup_filename = (

                          f"{away_team['folder']}"

                          f"_vs_"

                          f"{home_team['folder']}"

                          f".png"

                      )


                      matchup_path = os.path.join(

                          OUTPUT_ROOT,

                          folder_name,

                          away_team["folder"],

                          matchup_filename

                      )


                      if os.path.exists(

                          matchup_path

                      ):

                          skipped_existing += 1

                          continue


                      matchup_logo = create_matchup_logo(

                          away_logo,

                          home_logo

                      )


                      matchup_logo.save(

                          matchup_path,

                          "PNG"

                      )


                      total_matchups += 1


                  print(

                      f"Created matchups for "

                      f"{away_team['name']}"

                  )


          print()

          print(

              "===================================="

          )

          print(

              "SPORTS LOGO BUILD COMPLETE"

          )

          print(

              "===================================="

          )


          print(

              f"Teams stored: "

              f"{total_teams}"

          )


          print(

              f"New matchup logos created: "

              f"{total_matchups}"

          )


          print(

              f"Existing matchup logos skipped: "

              f"{skipped_existing}"

          )


          print(

              f"Failed images: "

              f"{failed_images}"

          )

          PY

      - name: Commit and push sports logos
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add sports-logos/

          if git diff --cached --quiet; then
            echo "No new sports logos to commit"
            exit 0
          fi

          git commit -m "Build sports logo library"

          git push
