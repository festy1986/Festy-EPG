name: Matched Channel Guide

on:
  workflow_dispatch:

  schedule:
    - cron: "10 4 * * *"
    - cron: "10 16 * * *"

permissions:
  contents: write

concurrency:
  group: festy-epg-build-queue
  cancel-in-progress: false
  queue: max

jobs:

  matched-guide:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then

            echo "XTREAM_URL missing"

            exit 1

          fi

          if [ -z "$XTREAM_USERNAME" ]; then

            echo "XTREAM_USERNAME missing"

            exit 1

          fi

          if [ -z "$XTREAM_PASSWORD" ]; then

            echo "XTREAM_PASSWORD missing"

            exit 1

          fi

          echo "XTREAM_URL exists"

          echo "XTREAM_USERNAME exists"

          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |

          python -m pip install requests

      - name: Generate matched channel guide
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python config/generate_matched_guide.py

      - name: Commit and push guide
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add guides/matched.xml

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update matched channel guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, fetching latest main and rebasing..."

            git fetch origin main
            git rebase origin/main

            sleep 5
          done

          echo "Push failed after retries"
          exit 1
