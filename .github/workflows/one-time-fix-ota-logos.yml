name: One-Time Fix ION Family and Court TV Logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Rename old ION Plus PNG to ION and convert real ION Plus SVG
        run: |
          if [ -f "logos/ION Plus.png" ]; then
            git mv "logos/ION Plus.png" "logos/ION.png"
          fi

          rsvg-convert "logos/Ion_Plus.svg" -o "logos/ION Plus.png"

      - name: Apply ION, ION Plus, and Court TV logos
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/OTALocalsguide.xml'

          const logos = {
            'COURT TV': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Court%20TV.png',
            'ION': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION.png',
            'ION PLUS': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION%20Plus.png'
          }

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          let xml = fs.readFileSync(guidePath, 'utf8')
          let applied = 0

          xml = xml.replace(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/g, (full, attrs, body) => {
            const m = body.match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/i)
            if (!m) return full

            const name = m[1]
              .replace(/<[^>]+>/g, '')
              .replace(/&amp;/g, '&')
              .trim()

            const logo = logos[name]
            if (!logo) return full

            const newBody = /<icon\b[^>]*\/>/i.test(body)
              ? body.replace(/<icon\b[^>]*\/>/i, `<icon src="${logo}"/>`)
              : body.replace(/(<display-name[^>]*>[\s\S]*?<\/display-name>)/i, `$1<icon src="${logo}"/>`)

            applied++
            console.log(`[logo] ${name} <= ${logo}`)
            return `<channel${attrs}>${newBody}</channel>`
          })

          fs.writeFileSync(guidePath, xml)
          console.log(`Applied ${applied} logos`)
          EOF

      - name: Recompress OTA guide
        run: |
          gzip -c guides/OTALocalsguide.xml > guides/OTALocalsguide.xml.gz

      - name: Commit one-time logo fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/OTALocalsguide.xml guides/OTALocalsguide.xml.gz
          git add logos/ION.png "logos/ION Plus.png" logos/Ion_Plus.svg
          git add -u logos

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "One-time fix ION family and Court TV logos"
          git push
