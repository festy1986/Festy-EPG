name: Repository Workflow Dependency Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run repository workflow dependency audit
        run: |
          python repo_audit.py

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo_audit_report.txt repo_audit.json

          git diff --cached --quiet || git commit -m "Update repository workflow dependency audit"

          git push
