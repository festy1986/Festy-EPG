name: Repository Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create workflow audit script
        run: |
          cat > repository_audit.py <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime

          ROOT = Path.cwd()

          IGNORE_DIRS = {
              ".git",
              "node_modules",
              "__pycache__",
              ".venv",
              "venv"
          }

          def relative(path):
              return str(
                  path.relative_to(ROOT)
              ).replace("\\", "/")

          def read_file(path):
              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  return ""

          def scan_all_files():
              files = []

              for path in ROOT.rglob("*"):
                  if not path.is_file():
                      continue

                  if any(
                      part in IGNORE_DIRS
                      for part in path.parts
                  ):
                      continue

                  files.append(path)

              return sorted(
                  files,
                  key=lambda path: relative(path).lower()
              )

          def extract_matches(pattern, text):
              return sorted(
                  set(
                      re.findall(
                          pattern,
                          text,
                          re.IGNORECASE
                      )
                  )
              )

          def extract_urls(text):
              return sorted(
                  set(
                      re.findall(
                          r"https?://[^\s\"'<>]+",
                          text
                      )
                  )
              )

          def extract_secrets(text):
              return sorted(
                  set(
                      re.findall(
                          r"secrets\.([A-Z0-9_]+)",
                          text
                      )
                  )
              )

          def extract_actions(text):
              return sorted(
                  set(
                      re.findall(
                          r"uses:\s*([^\s#]+)",
                          text
                      )
                  )
              )

          def extract_workflow_name(text):
              match = re.search(
                  r"(?m)^name:\s*(.+)$",
                  text
              )

              if match:
                  return match.group(1).strip()

              return "Unnamed Workflow"

          def extract_triggers(text):
              triggers = []

              if re.search(
                  r"(?m)^\s+workflow_dispatch:",
                  text
              ):
                  triggers.append(
                      "workflow_dispatch"
                  )

              if re.search(
                  r"(?m)^\s+schedule:",
                  text
              ):
                  triggers.append(
                      "schedule"
                  )

              if re.search(
                  r"(?m)^\s+push:",
                  text
              ):
                  triggers.append(
                      "push"
                  )

              if re.search(
                  r"(?m)^\s+pull_request:",
                  text
              ):
                  triggers.append(
                      "pull_request"
                  )

              if re.search(
                  r"(?m)^\s+repository_dispatch:",
                  text
              ):
                  triggers.append(
                      "repository_dispatch"
                  )

              if re.search(
                  r"(?m)^\s+workflow_call:",
                  text
              ):
                  triggers.append(
                      "workflow_call"
                  )

              return triggers

          def extract_jobs(text):
              jobs = []

              match = re.search(
                  r"(?ms)^jobs:\s*(.*)$",
                  text
              )

              if not match:
                  return jobs

              jobs_text = match.group(1)

              for job in re.findall(
                  r"(?m)^  ([A-Za-z0-9_-]+):\s*$",
                  jobs_text
              ):
                  jobs.append(job)

              return sorted(
                  set(jobs)
              )

          def extract_file_references(text):
              references = set()

              patterns = [
                  r"[\w./-]+\.py",
                  r"[\w./-]+\.js",
                  r"[\w./-]+\.ts",
                  r"[\w./-]+\.sh",
                  r"[\w./-]+\.json",
                  r"[\w./-]+\.txt",
                  r"[\w./-]+\.xml",
                  r"[\w./-]+\.xml\.gz",
                  r"[\w./-]+\.m3u",
                  r"[\w./-]+\.m3u8",
                  r"[\w./-]+\.csv",
                  r"[\w./-]+\.zip",
                  r"[\w./-]+\.gz",
                  r"[\w./-]+\.yml",
                  r"[\w./-]+\.yaml",
                  r"guides/[\w./-]+",
                  r"scripts/[\w./-]+",
                  r"channels/[\w./-]+",
                  r"config/[\w./-]+",
                  r"source/[\w./-]+",
                  r"output/[\w./-]+",
                  r"combinedfast/[\w./-]+",
                  r"iptvorg/[\w./-]+",
                  r"fast/[\w./-]+"
              ]

              for pattern in patterns:
                  for value in re.findall(
                      pattern,
                      text,
                      re.IGNORECASE
                  ):
                      references.add(value)

              return sorted(
                  references
              )

          def extract_shell_commands(text):
              commands = []

              in_run_block = False

              for line in text.splitlines():

                  if re.match(
                      r"^\s*run:\s*\|",
                      line
                  ):
                      in_run_block = True
                      continue

                  if in_run_block:

                      if line and not line.startswith(
                          " "
                      ):
                          in_run_block = False

                      elif line.strip():
                          commands.append(
                              line.strip()
                          )

              return commands

          def find_workflow_references(
              workflow_text,
              all_files
          ):
              found = []

              for path in all_files:

                  name = relative(path)

                  if name.startswith(
                      ".github/workflows/"
                  ):
                      continue

                  filename = path.name

                  if filename in workflow_text:
                      found.append(name)
                      continue

                  if name in workflow_text:
                      found.append(name)
                      continue

                  if (
                      "./" + name
                  ) in workflow_text:
                      found.append(name)

              return sorted(
                  set(found)
              )

          all_files = scan_all_files()

          workflow_files = []

          for path in all_files:

              name = relative(path)

              if not name.startswith(
                  ".github/workflows/"
              ):
                  continue

              if path.suffix.lower() not in {
                  ".yml",
                  ".yaml"
              }:
                  continue

              workflow_files.append(path)

          workflows = []

          workflow_file_users = {}

          for path in workflow_files:

              workflow_path = relative(path)

              text = read_file(path)

              references = find_workflow_references(
                  text,
                  all_files
              )

              workflow = {
                  "name": extract_workflow_name(
                      text
                  ),
                  "file": workflow_path,
                  "triggers": extract_triggers(
                      text
                  ),
                  "jobs": extract_jobs(
                      text
                  ),
                  "actions": extract_actions(
                      text
                  ),
                  "secrets": extract_secrets(
                      text
                  ),
                  "urls": extract_urls(
                      text
                  ),
                  "file_references": references,
                  "shell_commands": extract_shell_commands(
                      text
                  )
              }

              workflows.append(workflow)

              for reference in references:

                  if reference not in workflow_file_users:
                      workflow_file_users[
                          reference
                      ] = []

                  workflow_file_users[
                      reference
                  ].append(
                      workflow_path
                  )

          for reference in workflow_file_users:

              workflow_file_users[
                  reference
              ] = sorted(
                  set(
                      workflow_file_users[
                          reference
                      ]
                  )
              )

          file_map = []

          for path in all_files:

              name = relative(path)

              users = workflow_file_users.get(
                  name,
                  []
              )

              file_map.append({
                  "file": name,
                  "workflow_users": users,
                  "workflow_count": len(users),
                  "status": (
                      "WORKFLOW_DEPENDENCY"
                      if users
                      else "NOT_REFERENCED_BY_WORKFLOW"
                  )
              })

          shared_files = []

          for file_name, users in workflow_file_users.items():

              if len(users) > 1:

                  shared_files.append({
                      "file": file_name,
                      "used_by": users
                  })

          workflow_groups = {}

          for workflow in workflows:

              for reference in workflow[
                  "file_references"
              ]:

                  if reference not in workflow_groups:
                      workflow_groups[
                          reference
                      ] = []

                  workflow_groups[
                      reference
                  ].append(
                      workflow["file"]
                  )

          report = {
              "generated": datetime.now().isoformat(),
              "repository": str(ROOT),
              "summary": {
                  "total_files": len(all_files),
                  "total_workflows": len(
                      workflows
                  ),
                  "files_referenced_by_workflows": sum(
                      1
                      for item in file_map
                      if item[
                          "workflow_count"
                      ] > 0
                  ),
                  "files_not_referenced_by_workflows": sum(
                      1
                      for item in file_map
                      if item[
                          "workflow_count"
                      ] == 0
                  ),
                  "shared_files": len(
                      shared_files
                  )
              },
              "workflows": workflows,
              "shared_files": shared_files,
              "file_map": file_map
          }

          Path(
              "repo_audit.json"
          ).write_text(
              json.dumps(
                  report,
                  indent=2
              ),
              encoding="utf-8"
          )

          with open(
              "repo_audit_report.txt",
              "w",
              encoding="utf-8"
          ) as output:

              output.write(
                  "REPOSITORY WORKFLOW AUDIT\n"
              )

              output.write(
                  "==========================\n\n"
              )

              output.write(
                  "Generated: "
                  + report["generated"]
                  + "\n\n"
              )

              output.write(
                  "SUMMARY\n"
              )

              output.write(
                  "=======\n"
              )

              for key, value in report[
                  "summary"
              ].items():

                  output.write(
                      f"{key}: {value}\n"
                  )

              output.write(
                  "\n\nALL WORKFLOWS\n"
              )

              output.write(
                  "=============\n"
              )

              for number, workflow in enumerate(
                  workflows,
                  start=1
              ):

                  output.write(
                      "\n"
                      + str(number)
                      + ". "
                      + workflow["name"]
                      + "\n"
                  )

                  output.write(
                      "-" * (
                          len(
                              workflow["name"]
                          ) + 3
                      )
                      + "\n"
                  )

                  output.write(
                      "File: "
                      + workflow["file"]
                      + "\n"
                  )

                  output.write(
                      "Triggers: "
                      + (
                          ", ".join(
                              workflow[
                                  "triggers"
                              ]
                          )
                          or "None detected"
                      )
                      + "\n"
                  )

                  output.write(
                      "Jobs: "
                      + (
                          ", ".join(
                              workflow[
                                  "jobs"
                              ]
                          )
                          or "None detected"
                      )
                      + "\n"
                  )

                  output.write(
                      "\nActions:\n"
                  )

                  for item in workflow[
                      "actions"
                  ]:

                      output.write(
                          "  - "
                          + item
                          + "\n"
                      )

                  output.write(
                      "\nSecrets:\n"
                  )

                  for item in workflow[
                      "secrets"
                  ]:

                      output.write(
                          "  - "
                          + item
                          + "\n"
                      )

                  output.write(
                      "\nURLs:\n"
                  )

                  for item in workflow[
                      "urls"
                  ]:

                      output.write(
                          "  - "
                          + item
                          + "\n"
                      )

                  output.write(
                      "\nRepository files referenced:\n"
                  )

                  for item in workflow[
                      "file_references"
                  ]:

                      output.write(
                          "  - "
                          + item
                          + "\n"
                      )

                  output.write(
                      "\nShell commands:\n"
                  )

                  for item in workflow[
                      "shell_commands"
                  ]:

                      output.write(
                          "  - "
                          + item
                          + "\n"
                      )

              output.write(
                  "\n\nFILES SHARED BY MULTIPLE WORKFLOWS\n"
              )

              output.write(
                  "===================================\n"
              )

              for item in shared_files:

                  output.write(
                      "\n"
                      + item["file"]
                      + "\n"
                  )

                  for workflow in item[
                      "used_by"
                  ]:

                      output.write(
                          "  - "
                          + workflow
                          + "\n"
                      )

              output.write(
                  "\n\nFILES NOT REFERENCED BY ANY WORKFLOW\n"
              )

              output.write(
                  "=====================================\n"
              )

              output.write(
                  "These are REVIEW CANDIDATES ONLY.\n"
              )

              output.write(
                  "Nothing is automatically deleted.\n\n"
              )

              for item in file_map:

                  if item[
                      "workflow_count"
                  ] != 0:
                      continue

                  output.write(
                      item["file"]
                      + "\n"
                  )

      - name: Run workflow audit
        run: |
          python repository_audit.py

      - name: Commit audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add repo_audit.json
          git add repo_audit_report.txt

          git commit -m "Update repository workflow audit" || echo "No changes to commit"

          git push
