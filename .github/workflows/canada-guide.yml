name: Canada Guide

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'

permissions:
  contents: write

concurrency:
  group: canada-guide
  cancel-in-progress: false

jobs:
  build-canada-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fresh Canadian IPTV-org guide
        run: |
          set -euo pipefail
          mkdir -p canada/source canada/work guides

          echo "Downloading fresh IPTV-org Canada guide..."
          curl -L --fail --retry 5 --retry-delay 10 \
            --progress-bar \
            https://iptv-org.github.io/epg/guides/ca.xml.gz \
            -o canada/source/ca.xml.gz

          test -s canada/source/ca.xml.gz
          gzip -t canada/source/ca.xml.gz
          ls -lh canada/source/ca.xml.gz

      - name: Rebuild and enrich Canada guide
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > /tmp/build_canada_guide.js <<'EOF'
          const fs = require('fs')
          const zlib = require('zlib')

          const INPUT = 'canada/source/ca.xml.gz'
          const OUTPUT = 'canada/work/canada.xml'

          const TVMAZE_WORKERS = 4
          const TMDB_WORKERS = 3

          const stats = {
            channelsFound: 0,
            channelsWritten: 0,
            frenchChannelsRemoved: 0,
            programmesFound: 0,
            programmesRebuilt: 0,
            programmesWritten: 0,
            frenchProgrammesRemoved: 0,

            tvmazeShowsQueued: 0,
            tvmazeShowsCompleted: 0,
            tvmazeShowsSearched: 0,
            tvmazeShowsMatched: 0,
            tvmazeEpisodeListsDownloaded: 0,

            matchedTitleAndCode: 0,
            matchedTitleOnly: 0,
            matchedCodeOnly: 0,
            matchedDescription: 0,
            matchedAirDateFallback: 0,
            correctedBadCode: 0,
            noConfidentMatch: 0,

            filledEpisodeTitles: 0,
            filledEpisodeNumbers: 0,
            filledAirDates: 0,
            appendedDescriptionTitles: 0,
            appendedDescriptionNumbers: 0,
            appendedDescriptionDates: 0,

            tmdbMoviesQueued: 0,
            tmdbMoviesCompleted: 0,
            tmdbMoviesSearched: 0,
            tmdbMoviesMatched: 0,
            tmdbYearsAdded: 0
          }

          const showSearchCache = new Map()
          const episodeCache = new Map()
          const movieCache = new Map()

          let stage = 'starting'
          let rebuildDone = 0
          let writeDone = 0

          function clean(value) {
            return String(value || '').replace(/\s+/g, ' ').trim()
          }

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;')
          }

          function normalize(value) {
            return clean(value)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function compactKey(value) {
            return normalize(value).replace(/\s+/g, '')
          }

          function attr(block, name) {
            const match = block.match(new RegExp('\\b' + name + '="([^"]*)"', 'i'))
            return match ? decodeXml(match[1]) : ''
          }

          function tag(block, name) {
            const match = block.match(new RegExp('<' + name + '\\b[^>]*>([\\s\\S]*?)</' + name + '>', 'i'))
            return match ? clean(decodeXml(match[1].replace(/<[^>]+>/g, ' '))) : ''
          }

          function tagRaw(block, name) {
            const match = block.match(new RegExp('<' + name + '\\b[^>]*>([\\s\\S]*?)</' + name + '>', 'i'))
            return match ? match[0] : ''
          }

          function systemTag(block, system) {
            const match = block.match(new RegExp(
              '<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>([\\s\\S]*?)</episode-num>',
              'i'
            ))
            return match ? clean(decodeXml(match[1])) : ''
          }

          function replaceOrAddTag(block, name, value, lang = '') {
            const expression = new RegExp('<' + name + '\\b[^>]*>[\\s\\S]*?</' + name + '>', 'i')
            const langText = lang ? ' lang="' + lang + '"' : ''
            const replacement = '<' + name + langText + '>' + escapeXml(value) + '</' + name + '>'

            if (expression.test(block)) return block.replace(expression, replacement)
            return block.replace(/<\/programme>\s*$/i, '  ' + replacement + '\n</programme>')
          }

          function addTag(block, xml) {
            return block.replace(/<\/programme>\s*$/i, '  ' + xml + '\n</programme>')
          }

          function removeEpisodeSystem(block, system) {
            return block.replace(
              new RegExp('\\s*<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>[\\s\\S]*?</episode-num>', 'gi'),
              ''
            )
          }

          function replaceEpisodeSystem(block, system, value) {
            const expression = new RegExp(
              '<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>[\\s\\S]*?</episode-num>',
              'i'
            )
            const replacement = '<episode-num system="' + system + '">' + escapeXml(value) + '</episode-num>'
            if (expression.test(block)) return block.replace(expression, replacement)
            return addTag(block, replacement)
          }

          function categories(block) {
            return [...block.matchAll(/<category\b[^>]*>([\s\S]*?)<\/category>/gi)]
              .map(match => normalize(decodeXml(match[1].replace(/<[^>]+>/g, ' '))))
              .filter(Boolean)
          }

          function isMovie(block) {
            return categories(block).some(value => value === 'movie' || value === 'film')
          }

          function cleanSeriesTitle(value) {
            return clean(value)
              .replace(/\s+\((?:18|19|20)\d{2}\)\s*$/, '')
              .replace(/\s*[.\-–—:]?\s*S(?:eason)?\s*\d{1,3}\s*E(?:pisode)?\s*\d{1,3}\s*$/i, '')
              .trim()
          }

          function normalizeEpisodeCode(value) {
            const text = clean(value)
            let match = text.match(/^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i)
            if (match) return 'S' + String(Number(match[1])).padStart(2, '0') + 'E' + String(Number(match[2])).padStart(2, '0')

            match = text.match(/^(\d{1,3})\.(\d{1,3})\.?$/)
            if (match) {
              return 'S' + String(Number(match[1]) + 1).padStart(2, '0') +
                'E' + String(Number(match[2]) + 1).padStart(2, '0')
            }

            match = text.match(/S(?:eason)?\s*(\d{1,3})\D+E(?:pisode)?\s*(\d{1,3})/i)
            if (match) {
              return 'S' + String(Number(match[1])).padStart(2, '0') +
                'E' + String(Number(match[2])).padStart(2, '0')
            }

            return ''
          }

          function episodeCode(block) {
            return normalizeEpisodeCode(
              systemTag(block, 'common') ||
              systemTag(block, 'onscreen') ||
              systemTag(block, 'xmltv_ns')
            )
          }

          function parseDateTag(block) {
            const value = tag(block, 'date')
            if (/^\d{8}$/.test(value)) {
              return value.slice(0, 4) + '-' + value.slice(4, 6) + '-' + value.slice(6, 8)
            }
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value
            if (/^\d{4}$/.test(value)) return value
            return ''
          }

          function displayDate(value) {
            const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/)
            return match ? match[2] + '/' + match[3] + '/' + match[1] : ''
          }

          function compactDate(value) {
            const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/)
            return match ? match[1] + match[2] + match[3] : ''
          }

          function isFrenchOnlyChannel(block) {
            const names = [...block.matchAll(/<display-name\b[^>]*>([\s\S]*?)<\/display-name>/gi)]
              .map(match => normalize(decodeXml(match[1].replace(/<[^>]+>/g, ' '))))
            const text = normalize(attr(block, 'id') + ' ' + names.join(' '))

            if (/\blang="fr(?:-[a-z]+)?"/i.test(block) && !/\blang="en(?:-[a-z]+)?"/i.test(block)) {
              return true
            }

            return [
              /\bici radio canada\b/, /\bradio canada\b/, /\btele quebec\b/,
              /\btva\b/, /\bnoovo\b/, /\btv5 quebec\b/, /\bunis tv\b/,
              /\bcanal vie\b/, /\bcanal d\b/, /\baddik tv\b/,
              /\bseries plus\b/, /\brds(?: 2| info)?\b/, /\btva sports\b/,
              /\bhistoria\b/, /\bevasion\b/, /\bexplora\b/, /\blcn\b/,
              /\bmeteo media\b/, /\bami tele\b/, /\bprise 2\b/
            ].some(pattern => pattern.test(text))
          }

          function excludedFromSeriesEnrichment(programme) {
            if (programme.movie) return true

            const values = categories(programme.block)
            if (values.some(value => [
              /\bsports?\b/, /\bnews\b/, /\bcurrent affairs\b/, /\bweather\b/,
              /\bshopping\b/, /\binfomercial\b/, /\bpaid programming\b/,
              /\breligion\b/, /\breligious\b/, /\bconcert\b/, /\bawards?\b/
            ].some(pattern => pattern.test(value)))) return true

            const combined = normalize(programme.title + ' ' + programme.episodeTitle)
            return [
              /\blive\b/, /\bnews\b/, /\bweather\b/, /\bsports?\b/,
              /\bshopping\b/, /\binfomercial\b/, /\bpaid programming\b/,
              /\bto be announced\b/, /\btba\b/, /\bno information\b/,
              /\bprogramme information\b/, /\bsign off\b/, /\bclosedown\b/
            ].some(pattern => pattern.test(combined))
          }

          function wordSet(value) {
            return new Set(
              normalize(value)
                .split(' ')
                .filter(word => word.length > 2)
            )
          }

          function tokenSimilarity(leftValue, rightValue) {
            const left = wordSet(leftValue)
            const right = wordSet(rightValue)
            if (!left.size || !right.size) return 0

            let overlap = 0
            for (const word of left) if (right.has(word)) overlap++

            const precision = overlap / left.size
            const recall = overlap / right.size
            if (!precision || !recall) return 0
            return 2 * precision * recall / (precision + recall)
          }

          function levenshteinRatio(leftValue, rightValue) {
            const left = normalize(leftValue)
            const right = normalize(rightValue)
            if (!left || !right) return 0

            const rows = left.length + 1
            const cols = right.length + 1
            const matrix = Array.from({ length: rows }, () => new Uint16Array(cols))

            for (let i = 0; i < rows; i++) matrix[i][0] = i
            for (let j = 0; j < cols; j++) matrix[0][j] = j

            for (let i = 1; i < rows; i++) {
              for (let j = 1; j < cols; j++) {
                const cost = left[i - 1] === right[j - 1] ? 0 : 1
                matrix[i][j] = Math.min(
                  matrix[i - 1][j] + 1,
                  matrix[i][j - 1] + 1,
                  matrix[i - 1][j - 1] + cost
                )
              }
            }

            return 1 - matrix[left.length][right.length] / Math.max(left.length, right.length)
          }

          function descriptionScore(left, right) {
            const token = tokenSimilarity(left, right)
            const edit = levenshteinRatio(left, right)
            return token * 0.78 + edit * 0.22
          }

          function episodeCodeFromMaze(episode) {
            if (!episode || episode.season == null || episode.number == null) return ''
            return 'S' + String(Number(episode.season)).padStart(2, '0') +
              'E' + String(Number(episode.number)).padStart(2, '0')
          }

          function episodeSummary(episode) {
            return clean(String(episode && episode.summary || '').replace(/<[^>]+>/g, ' '))
          }

          class AdaptiveLimiter {
            constructor(name, options = {}) {
              this.name = name
              this.delay = options.initialDelay || 200
              this.minDelay = options.minDelay || 80
              this.maxDelay = options.maxDelay || 8000
              this.successes = 0
              this.failures = 0
              this.nextAllowed = 0
              this.lock = Promise.resolve()
            }

            async wait() {
              let release
              const previous = this.lock
              this.lock = new Promise(resolve => { release = resolve })
              await previous

              const now = Date.now()
              const sleepFor = Math.max(0, this.nextAllowed - now)
              if (sleepFor) await new Promise(resolve => setTimeout(resolve, sleepFor))
              this.nextAllowed = Date.now() + this.delay
              release()
            }

            success() {
              this.successes++
              if (this.successes % 8 === 0) {
                this.delay = Math.max(this.minDelay, Math.floor(this.delay * 0.9))
              }
            }

            slowDown(multiplier = 1.7) {
              this.failures++
              this.delay = Math.min(this.maxDelay, Math.ceil(this.delay * multiplier))
            }
          }

          const tvmazeLimiter = new AdaptiveLimiter('TVMaze', {
            initialDelay: 180,
            minDelay: 75,
            maxDelay: 8000
          })

          const tmdbLimiter = new AdaptiveLimiter('TMDB', {
            initialDelay: 220,
            minDelay: 100,
            maxDelay: 10000
          })

          async function fetchJson(url, label, limiter, retries = 7) {
            const retryQueue = []
            for (let attempt = 1; attempt <= retries; attempt++) {
              await limiter.wait()

              try {
                const response = await fetch(url, {
                  headers: { 'User-Agent': 'festy-canada-guide/6.0' }
                })

                if (response.status === 404) {
                  limiter.success()
                  return null
                }

                if (response.status === 429 || response.status >= 500) {
                  limiter.slowDown(response.status === 429 ? 2.0 : 1.5)
                  const retryAfter = Number(response.headers.get('retry-after') || 0) * 1000
                  const backoff = Math.min(30000, 500 * (2 ** (attempt - 1)))
                  retryQueue.push({
                    attempt,
                    status: response.status,
                    wait: Math.max(retryAfter, backoff)
                  })
                  const item = retryQueue.shift()
                  console.log(
                    '[' + limiter.name + ' RETRY] ' + label +
                    ' | attempt=' + item.attempt +
                    ' | status=' + item.status +
                    ' | wait=' + item.wait + 'ms' +
                    ' | delay=' + limiter.delay + 'ms'
                  )
                  await new Promise(resolve => setTimeout(resolve, item.wait))
                  continue
                }

                if (!response.ok) {
                  limiter.slowDown(1.25)
                  console.log('[' + limiter.name + ' HTTP ' + response.status + '] ' + label)
                  return null
                }

                limiter.success()
                return await response.json()
              } catch (error) {
                limiter.slowDown(1.5)
                const backoff = Math.min(30000, 500 * (2 ** (attempt - 1)))
                retryQueue.push({ attempt, status: 'network', wait: backoff })
                const item = retryQueue.shift()
                console.log(
                  '[' + limiter.name + ' NETWORK RETRY] ' + label +
                  ' | attempt=' + item.attempt +
                  ' | wait=' + item.wait + 'ms' +
                  ' | delay=' + limiter.delay + 'ms' +
                  ' | error=' + error.message
                )
                await new Promise(resolve => setTimeout(resolve, item.wait))
              }
            }

            console.log('[' + limiter.name + ' FAILED] ' + label)
            return null
          }

          async function getShow(title) {
            const cacheKey = compactKey(title)
            if (showSearchCache.has(cacheKey)) return showSearchCache.get(cacheKey)

            stats.tvmazeShowsSearched++
            const results = await fetchJson(
              'https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(title),
              title,
              tvmazeLimiter
            )

            const shows = Array.isArray(results)
              ? results.map(item => item.show).filter(Boolean)
              : []

            const exact = shows.find(show => compactKey(show.name) === cacheKey)
            const close = shows
              .map(show => ({ show, score: tokenSimilarity(show.name, title) }))
              .filter(item => item.score >= 0.8)
              .sort((a, b) => b.score - a.score)[0]

            const show = exact || (close && close.show) || null
            showSearchCache.set(cacheKey, show)

            if (show) stats.tvmazeShowsMatched++
            return show
          }

          async function getEpisodes(showId) {
            if (episodeCache.has(showId)) return episodeCache.get(showId)

            const result = await fetchJson(
              'https://api.tvmaze.com/shows/' + showId + '/episodes?specials=1',
              'show ' + showId,
              tvmazeLimiter
            )

            const episodes = Array.isArray(result) ? result : []
            episodeCache.set(showId, episodes)
            if (episodes.length) stats.tvmazeEpisodeListsDownloaded++
            return episodes
          }

          function findByTitle(episodes, title) {
            if (!title) return []
            const wanted = compactKey(title)
            return episodes.filter(episode => compactKey(episode.name) === wanted)
          }

          function findByCode(episodes, code) {
            if (!code) return []
            return episodes.filter(episode => episodeCodeFromMaze(episode) === code)
          }

          function findByAirDate(episodes, dateValue) {
            if (!dateValue || !/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) return []
            return episodes.filter(episode => episode.airdate === dateValue)
          }

          function matchProgramme(programme, episodes) {
            const titleMatches = findByTitle(episodes, programme.episodeTitle)
            const codeMatches = findByCode(episodes, programme.episodeCode)

            // Rule 1: episode title and SxxExx agree.
            if (programme.episodeTitle && programme.episodeCode) {
              const agreed = titleMatches.find(
                episode => episodeCodeFromMaze(episode) === programme.episodeCode
              )
              if (agreed) {
                return { episode: agreed, method: 'title-and-code', correctCode: false }
              }

              // Rule 2: title and SxxExx disagree. Trust title.
              if (titleMatches.length === 1) {
                return { episode: titleMatches[0], method: 'title-only', correctCode: true }
              }

              // Ambiguous repeated titles: use description to resolve title matches.
              if (titleMatches.length > 1 && programme.description) {
                const ranked = titleMatches
                  .map(episode => ({
                    episode,
                    score: descriptionScore(programme.description, episodeSummary(episode))
                  }))
                  .sort((a, b) => b.score - a.score)

                if (
                  ranked[0] &&
                  ranked[0].score >= 0.58 &&
                  (!ranked[1] || ranked[0].score - ranked[1].score >= 0.1)
                ) {
                  return { episode: ranked[0].episode, method: 'title-only', correctCode: true }
                }
              }

              return null
            }

            // Rule 3: episode title only.
            if (programme.episodeTitle) {
              if (titleMatches.length === 1) {
                return { episode: titleMatches[0], method: 'title-only', correctCode: false }
              }

              if (titleMatches.length > 1 && programme.description) {
                const ranked = titleMatches
                  .map(episode => ({
                    episode,
                    score: descriptionScore(programme.description, episodeSummary(episode))
                  }))
                  .sort((a, b) => b.score - a.score)

                if (
                  ranked[0] &&
                  ranked[0].score >= 0.58 &&
                  (!ranked[1] || ranked[0].score - ranked[1].score >= 0.1)
                ) {
                  return { episode: ranked[0].episode, method: 'title-only', correctCode: false }
                }
              }
            }

            // Rule 4: SxxExx only.
            if (programme.episodeCode && codeMatches.length === 1) {
              return { episode: codeMatches[0], method: 'code-only', correctCode: false }
            }

            // Rule 5: neither exists, or earlier matching was inconclusive.
            if (programme.description) {
              const ranked = episodes
                .map(episode => ({
                  episode,
                  score: descriptionScore(programme.description, episodeSummary(episode))
                }))
                .filter(item => item.score >= 0.62)
                .sort((a, b) => b.score - a.score)

              if (
                ranked[0] &&
                (!ranked[1] || ranked[0].score - ranked[1].score >= 0.1)
              ) {
                return {
                  episode: ranked[0].episode,
                  method: 'description',
                  correctCode: false
                }
              }
            }

            // Rule 6: original air date is the final fallback.
            const dateMatches = findByAirDate(episodes, programme.airDate)
            if (dateMatches.length === 1) {
              return {
                episode: dateMatches[0],
                method: 'airdate',
                correctCode: false
              }
            }

            return null
          }

          function hasDescriptionTitle(description, title) {
            if (!description || !title) return false
            return normalize(description).includes(normalize(title))
          }

          function hasDescriptionCode(description, code) {
            if (!description || !code) return false
            return normalizeEpisodeCode(description) === code ||
              new RegExp(
                '\\bS0*' + Number(code.slice(1, 3)) +
                '\\s*E0*' + Number(code.slice(4, 6)) + '\\b',
                'i'
              ).test(description)
          }

          function hasDescriptionDate(description, dateValue) {
            if (!description || !dateValue) return false
            return description.includes(displayDate(dateValue))
          }

          function appendMissingDescriptionPieces(programme) {
            let description = clean(programme.description)
            const prefix = []

            if (programme.episodeTitle && !hasDescriptionTitle(description, programme.episodeTitle)) {
              prefix.push(programme.episodeTitle)
              stats.appendedDescriptionTitles++
            }

            if (programme.episodeCode && !hasDescriptionCode(description, programme.episodeCode)) {
              if (prefix.length) {
                prefix[prefix.length - 1] += ' - ' + programme.episodeCode
              } else {
                prefix.push(programme.episodeCode)
              }
              stats.appendedDescriptionNumbers++
            }

            if (prefix.length) {
              description = prefix.join('. ') + (description ? '. ' + description : '')
            }

            if (
              programme.airDate &&
              /^\d{4}-\d{2}-\d{2}$/.test(programme.airDate) &&
              !hasDescriptionDate(description, programme.airDate)
            ) {
              description = clean(description).replace(/[.\s]+$/, '')
              description += (description ? '. ' : '') + '(' + displayDate(programme.airDate) + ')'
              stats.appendedDescriptionDates++
            }

            return clean(description)
          }

          function enrichProgramme(programme, matched) {
            const episode = matched.episode
            const mazeTitle = clean(episode.name)
            const mazeCode = episodeCodeFromMaze(episode)
            const mazeAirDate = episode.airdate || ''

            if (matched.method === 'title-and-code') stats.matchedTitleAndCode++
            if (matched.method === 'title-only') stats.matchedTitleOnly++
            if (matched.method === 'code-only') stats.matchedCodeOnly++
            if (matched.method === 'description') stats.matchedDescription++
            if (matched.method === 'airdate') stats.matchedAirDateFallback++

            // Existing IPTV-org title is authoritative.
            if (!programme.episodeTitle && mazeTitle) {
              programme.episodeTitle = mazeTitle
              stats.filledEpisodeTitles++
            }

            // Existing code is authoritative except when the title proves it is wrong.
            if (matched.correctCode && mazeCode && programme.episodeCode !== mazeCode) {
              programme.episodeCode = mazeCode
              stats.correctedBadCode++
            } else if (!programme.episodeCode && mazeCode) {
              programme.episodeCode = mazeCode
              stats.filledEpisodeNumbers++
            }

            // Air date is filled only when missing.
            if (!programme.airDate && mazeAirDate) {
              programme.airDate = mazeAirDate
              stats.filledAirDates++
            }

            // TVMaze never replaces the IPTV-org synopsis.
            programme.description = appendMissingDescriptionPieces(programme)
          }

          async function enrichSeriesGroup(group) {
            const show = await getShow(group[0].title)
            if (!show) {
              stats.noConfidentMatch += group.filter(programme => !excludedFromSeriesEnrichment(programme)).length
              return
            }

            const episodes = await getEpisodes(show.id)
            if (!episodes.length) {
              stats.noConfidentMatch += group.filter(programme => !excludedFromSeriesEnrichment(programme)).length
              return
            }

            for (const programme of group) {
              if (excludedFromSeriesEnrichment(programme)) continue

              const needsAnything =
                !programme.episodeTitle ||
                !programme.episodeCode ||
                !programme.airDate ||
                !hasDescriptionTitle(programme.description, programme.episodeTitle) ||
                !hasDescriptionCode(programme.description, programme.episodeCode) ||
                !hasDescriptionDate(programme.description, programme.airDate)

              if (!needsAnything) continue

              const matched = matchProgramme(programme, episodes)
              if (!matched) {
                stats.noConfidentMatch++
                continue
              }

              enrichProgramme(programme, matched)
            }
          }

          function movieYear(programme) {
            const dateValue = parseDateTag(programme.block)
            if (/^(18|19|20)\d{2}$/.test(dateValue)) return dateValue

            const titleMatch = programme.title.match(/\(((?:18|19|20)\d{2})\)\s*$/)
            if (titleMatch) return titleMatch[1]

            const descMatch = programme.description.match(/\(((?:18|19|20)\d{2})\)\s*$/)
            return descMatch ? descMatch[1] : ''
          }

          async function getMovieYear(title) {
            const cacheKey = compactKey(title)
            if (movieCache.has(cacheKey)) return movieCache.get(cacheKey)

            const apiKey = process.env.TMDB_API_KEY || ''
            if (!apiKey) {
              movieCache.set(cacheKey, '')
              return ''
            }

            stats.tmdbMoviesSearched++
            const result = await fetchJson(
              'https://api.themoviedb.org/3/search/movie?api_key=' +
                encodeURIComponent(apiKey) +
                '&query=' + encodeURIComponent(title) +
                '&include_adult=false&language=en-US&page=1',
              title,
              tmdbLimiter
            )

            const items = Array.isArray(result && result.results) ? result.results : []
            const exact = items.find(
              item =>
                compactKey(item.title) === cacheKey ||
                compactKey(item.original_title) === cacheKey
            )

            const selected = exact || items[0] || null
            const year = selected && selected.release_date
              ? String(selected.release_date).match(/^(18|19|20)\d{2}/)?.[0] || ''
              : ''

            movieCache.set(cacheKey, year)
            if (year) stats.tmdbMoviesMatched++
            return year
          }

          async function enrichMovieGroup(group) {
            const year = await getMovieYear(group[0].title)
            if (!year) return

            for (const programme of group) {
              if (movieYear(programme)) continue
              programme.movieYear = year
              stats.tmdbYearsAdded++

              let description = clean(programme.description)
              if (!new RegExp('\\(' + year + '\\)\\s*$').test(description)) {
                description = description.replace(/\s*\((?:18|19|20)\d{2}\)\s*$/, '')
                description += (description ? ' ' : '') + '(' + year + ')'
              }
              programme.description = clean(description)
            }
          }

          function heartbeat() {
            console.log(
              '[HEARTBEAT] stage=' + stage +
              ' | rebuild=' + rebuildDone + '/' + stats.programmesFound +
              ' | TVMaze shows=' + stats.tvmazeShowsCompleted + '/' + stats.tvmazeShowsQueued +
              ' | title+code=' + stats.matchedTitleAndCode +
              ' | title=' + stats.matchedTitleOnly +
              ' | code=' + stats.matchedCodeOnly +
              ' | description=' + stats.matchedDescription +
              ' | corrected=' + stats.correctedBadCode +
              ' | no-match=' + stats.noConfidentMatch +
              ' | TVMaze delay=' + tvmazeLimiter.delay + 'ms' +
              ' | TMDB=' + stats.tmdbMoviesCompleted + '/' + stats.tmdbMoviesQueued +
              ' | TMDB delay=' + tmdbLimiter.delay + 'ms' +
              ' | writing=' + writeDone + '/' + stats.programmesRebuilt
            )
          }

          async function runWorkers(queue, workerCount, handler, counterName, label) {
            let cursor = 0

            async function worker(workerNumber) {
              while (true) {
                const index = cursor++
                if (index >= queue.length) return

                const item = queue[index]
                await handler(item)
                stats[counterName]++

                if (stats[counterName] % 50 === 0 || stats[counterName] === queue.length) {
                  console.log(
                    '[' + label + '] worker=' + workerNumber +
                    ' | completed=' + stats[counterName] + '/' + queue.length
                  )
                }
              }
            }

            await Promise.all(
              Array.from(
                { length: Math.min(workerCount, Math.max(1, queue.length)) },
                (_, index) => worker(index + 1)
              )
            )
          }

          async function main() {
            const heartbeatTimer = setInterval(heartbeat, 15000)

            stage = 'decompressing source'
            heartbeat()

            const source = zlib.gunzipSync(fs.readFileSync(INPUT)).toString('utf8')
            const declaration = (source.match(/^\s*<\?xml[\s\S]*?\?>/) || [
              '<?xml version="1.0" encoding="UTF-8"?>'
            ])[0]
            const rootOpen = (source.match(/<tv\b[^>]*>/i) || ['<tv>'])[0]

            const channelBlocks = [...source.matchAll(/<channel\b[\s\S]*?<\/channel>/gi)]
              .map(match => match[0])
            const programmeBlocks = [...source.matchAll(/<programme\b[\s\S]*?<\/programme>/gi)]
              .map(match => match[0])

            stats.channelsFound = channelBlocks.length
            stats.programmesFound = programmeBlocks.length

            stage = 'filtering Canada channels'
            const removedIds = new Set()
            const channels = []

            for (const block of channelBlocks) {
              const id = attr(block, 'id')
              if (id && isFrenchOnlyChannel(block)) {
                removedIds.add(id)
                stats.frenchChannelsRemoved++
              } else {
                channels.push(block)
                stats.channelsWritten++
              }
            }

            // PHASE 1: Rebuild every programme first, with no TVMaze or TMDB.
            stage = 'rebuilding complete guide'
            const programmes = []

            for (const originalBlock of programmeBlocks) {
              const channelId = attr(originalBlock, 'channel')
              if (removedIds.has(channelId)) {
                stats.frenchProgrammesRemoved++
                continue
              }

              let block = originalBlock
              const sourceTitle = tag(block, 'title')
              const movie = isMovie(block)
              const rebuiltTitle = movie ? clean(sourceTitle) : cleanSeriesTitle(sourceTitle)

              if (rebuiltTitle && rebuiltTitle !== sourceTitle) {
                block = replaceOrAddTag(block, 'title', rebuiltTitle, 'en')
              }

              // Prevent TiviMate from appending S/E to the series title.
              block = removeEpisodeSystem(block, 'xmltv_ns')

              const programme = {
                block,
                title: rebuiltTitle,
                movie,
                episodeTitle: tag(block, 'sub-title'),
                episodeCode: episodeCode(block),
                description: tag(block, 'desc'),
                airDate: parseDateTag(block),
                movieYear: ''
              }

              // Missing metadata stays blank during rebuilding.
              programmes.push(programme)
              rebuildDone++
              stats.programmesRebuilt++

              if (rebuildDone % 10000 === 0) {
                console.log(
                  '[REBUILD] Programme ' + rebuildDone + ' / ' + stats.programmesFound
                )
              }
            }

            // PHASE 2: Build series and movie lookup tables.
            stage = 'building lookup tables'
            const seriesGroups = new Map()
            const movieGroups = new Map()

            for (const programme of programmes) {
              const groupKey = compactKey(programme.title)
              if (!groupKey) continue

              const target = programme.movie ? movieGroups : seriesGroups
              if (!target.has(groupKey)) target.set(groupKey, [])
              target.get(groupKey).push(programme)
            }

            // PHASE 3: Parallel, adaptive, programme-by-programme TVMaze enrichment.
            const seriesQueue = [...seriesGroups.values()]
              .filter(group =>
                group.some(programme => {
                  if (excludedFromSeriesEnrichment(programme)) return false
                  return (
                    !programme.episodeTitle ||
                    !programme.episodeCode ||
                    !programme.airDate ||
                    !hasDescriptionTitle(programme.description, programme.episodeTitle) ||
                    !hasDescriptionCode(programme.description, programme.episodeCode) ||
                    !hasDescriptionDate(programme.description, programme.airDate)
                  )
                })
              )

            stats.tvmazeShowsQueued = seriesQueue.length
            stage = 'TVMaze enrichment'
            heartbeat()

            await runWorkers(
              seriesQueue,
              TVMAZE_WORKERS,
              enrichSeriesGroup,
              'tvmazeShowsCompleted',
              'TVMAZE'
            )

            // PHASE 4: Parallel adaptive TMDB year enrichment.
            const movieQueue = [...movieGroups.values()]
              .filter(group => group.some(programme => !movieYear(programme)))

            stats.tmdbMoviesQueued = movieQueue.length
            stage = 'TMDB movie enrichment'
            heartbeat()

            if (process.env.TMDB_API_KEY) {
              await runWorkers(
                movieQueue,
                TMDB_WORKERS,
                enrichMovieGroup,
                'tmdbMoviesCompleted',
                'TMDB'
              )
            } else {
              console.log('[TMDB] TMDB_API_KEY is missing; movie year enrichment skipped.')
            }

            // PHASE 5: Write final XML while preserving all untouched XMLTV tags.
            stage = 'writing final XML'
            heartbeat()

            const finalProgrammes = []

            for (const programme of programmes) {
              let block = programme.block

              if (programme.episodeTitle && !tag(block, 'sub-title')) {
                block = replaceOrAddTag(block, 'sub-title', programme.episodeTitle, 'en')
              }

              const currentCode = episodeCode(block)
              if (programme.episodeCode && currentCode !== programme.episodeCode) {
                block = replaceEpisodeSystem(block, 'common', programme.episodeCode)
              }

              if (
                programme.airDate &&
                /^\d{4}-\d{2}-\d{2}$/.test(programme.airDate) &&
                !tag(block, 'date')
              ) {
                block = addTag(block, '<date>' + compactDate(programme.airDate) + '</date>')
              }

              if (programme.movieYear && !tag(block, 'date')) {
                block = addTag(block, '<date>' + programme.movieYear + '</date>')
              }

              if (programme.description && programme.description !== tag(block, 'desc')) {
                block = replaceOrAddTag(block, 'desc', programme.description, 'en')
              }

              // Always remove xmltv_ns because it causes TiviMate title leakage.
              block = removeEpisodeSystem(block, 'xmltv_ns')

              finalProgrammes.push(block)
              writeDone++
              stats.programmesWritten++

              if (writeDone % 10000 === 0) {
                console.log(
                  '[WRITE] Programme ' + writeDone + ' / ' + stats.programmesRebuilt
                )
              }
            }

            fs.writeFileSync(
              OUTPUT,
              [declaration, rootOpen, ...channels, ...finalProgrammes, '</tv>', ''].join('\n'),
              'utf8'
            )

            stage = 'complete'
            clearInterval(heartbeatTimer)
            heartbeat()

            console.log('==================================================')
            console.log('CANADA GUIDE COMPLETE')
            console.log('==================================================')
            console.log('Downloaded programmes: ' + stats.programmesFound)
            console.log('Rebuilt programmes: ' + stats.programmesRebuilt)
            console.log('Written programmes: ' + stats.programmesWritten)
            console.log('')
            console.log('TVMaze')
            console.log('  Workers: ' + TVMAZE_WORKERS)
            console.log('  Shows queued: ' + stats.tvmazeShowsQueued)
            console.log('  Shows completed: ' + stats.tvmazeShowsCompleted)
            console.log('  Shows searched: ' + stats.tvmazeShowsSearched)
            console.log('  Shows matched: ' + stats.tvmazeShowsMatched)
            console.log('  Episode lists: ' + stats.tvmazeEpisodeListsDownloaded)
            console.log('  SxxExx + Title: ' + stats.matchedTitleAndCode)
            console.log('  Title only: ' + stats.matchedTitleOnly)
            console.log('  SxxExx only: ' + stats.matchedCodeOnly)
            console.log('  Description: ' + stats.matchedDescription)
            console.log('  Air-date fallback: ' + stats.matchedAirDateFallback)
            console.log('  Corrected bad SxxExx: ' + stats.correctedBadCode)
            console.log('  No confident match: ' + stats.noConfidentMatch)
            console.log('  Episode titles filled: ' + stats.filledEpisodeTitles)
            console.log('  Episode numbers filled: ' + stats.filledEpisodeNumbers)
            console.log('  Air dates filled: ' + stats.filledAirDates)
            console.log('  Final adaptive delay: ' + tvmazeLimiter.delay + ' ms')
            console.log('')
            console.log('TMDB')
            console.log('  Workers: ' + TMDB_WORKERS)
            console.log('  Movies queued: ' + stats.tmdbMoviesQueued)
            console.log('  Movies completed: ' + stats.tmdbMoviesCompleted)
            console.log('  Movies searched: ' + stats.tmdbMoviesSearched)
            console.log('  Movies matched: ' + stats.tmdbMoviesMatched)
            console.log('  Years added: ' + stats.tmdbYearsAdded)
            console.log('  Final adaptive delay: ' + tmdbLimiter.delay + ' ms')
            console.log('')
            console.log('Canada French filtering')
            console.log('  Channels removed: ' + stats.frenchChannelsRemoved)
            console.log('  Programmes removed: ' + stats.frenchProgrammesRemoved)
            console.log('')
            console.log('Output: ' + OUTPUT)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

          node --check /tmp/build_canada_guide.js
          node /tmp/build_canada_guide.js

      - name: Validate rebuilt guide
        run: |
          set -euo pipefail

          test -s canada/work/canada.xml
          grep -q '<tv' canada/work/canada.xml
          grep -q '<channel' canada/work/canada.xml
          grep -q '<programme' canada/work/canada.xml

          SOURCE_CHANNELS="$(gzip -dc canada/source/ca.xml.gz | grep -c '<channel' || true)"
          SOURCE_PROGRAMMES="$(gzip -dc canada/source/ca.xml.gz | grep -c '<programme' || true)"
          OUTPUT_CHANNELS="$(grep -c '<channel' canada/work/canada.xml || true)"
          OUTPUT_PROGRAMMES="$(grep -c '<programme' canada/work/canada.xml || true)"

          echo "Source channels: ${SOURCE_CHANNELS}"
          echo "Output channels: ${OUTPUT_CHANNELS}"
          echo "Source programmes: ${SOURCE_PROGRAMMES}"
          echo "Output programmes: ${OUTPUT_PROGRAMMES}"

          if [ "${OUTPUT_CHANNELS}" -lt 1 ]; then
            echo "Validation failed: no channels were written."
            exit 1
          fi

          if [ "${OUTPUT_PROGRAMMES}" -lt 1 ]; then
            echo "Validation failed: no programmes were written."
            exit 1
          fi

          cp canada/work/canada.xml guides/canada.xml
          gzip -9 -c guides/canada.xml > guides/canada.xml.gz

          gzip -t guides/canada.xml.gz
          ls -lh guides/canada.xml guides/canada.xml.gz

      - name: Commit updated Canada guide
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/canada.xml guides/canada.xml.gz

          if git diff --cached --quiet; then
            echo "No Canada guide changes to commit."
            exit 0
          fi

          git commit -m "Update Canada guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 5))
          done

          echo "Push failed after five attempts."
          exit 1
