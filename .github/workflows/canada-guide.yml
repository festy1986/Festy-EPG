name: Canada Guide

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'

permissions:
  contents: write

concurrency:
  group: canada-guide
  cancel-in-progress: false

jobs:
  build-canada-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fresh Canadian IPTV-org guide
        run: |
          set -e
          mkdir -p canada/source canada/work guides

          echo "Downloading fresh IPTV-org Canada guide..."
          curl -L --fail --retry 5 --retry-delay 10 \
            --progress-bar \
            https://iptv-epg.org/files/epg-ca.xml.gz \
            -o canada/source/epg-ca.xml.gz

          test -s canada/source/epg-ca.xml.gz
          gzip -t canada/source/epg-ca.xml.gz
          echo "Download complete:"
          ls -lh canada/source/epg-ca.xml.gz

      - name: Rebuild guide with adaptive TVMaze and TMDB enrichment
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > /tmp/build_canada_guide.js <<'EOF'
          const fs = require('fs')
          const zlib = require('zlib')

          const inputPath = 'canada/source/epg-ca.xml.gz'
          const outputPath = 'canada/work/canada.xml'
          const WORKERS = 4

          const stats = {
            channelsFound: 0,
            channelsWritten: 0,
            frenchChannelsRemoved: 0,
            programmesFound: 0,
            programmesWritten: 0,
            frenchProgrammesRemoved: 0,
            titlesCleaned: 0,
            descriptionsFormatted: 0,
            tvmazeShowsChecked: 0,
            tvmazeShowsMatched: 0,
            tvmazeProgrammesMatched: 0,
            tvmazeFieldsFilled: 0,
            tvmazeEpisodeTitlesFilled: 0,
            tvmazeEpisodeNumbersFilled: 0,
            tvmazeDescriptionsFilled: 0,
            tvmazeAirDatesFilled: 0,
            enrichmentCandidates: 0,
            enrichmentGroupsSkippedComplete: 0,
            enrichmentGroupsSkippedType: 0,
            enrichmentGroupsSkippedCategory: 0,
            tvmazeRateLimits: 0,
            tvmazeHttpErrors: 0,
            tvmazeNetworkErrors: 0,
            movieCandidates: 0,
            movieTitlesMatched: 0,
            movieYearsFilled: 0,
            movieLookupFailures: 0
          }

          let currentStage = 'starting'
          let groupsCompleted = 0
          let totalGroups = 0

          // Local caches for this workflow only. Nothing is read from or written to TVGuide.
          const showCache = new Map()
          const episodesCache = new Map()
          const tmdbMovieCache = new Map()

          function cleanSpaces(value) {
            return String(value || '').replace(/\s+/g, ' ').trim()
          }

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;')
          }

          function normalize(value) {
            return cleanSpaces(value)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function normalizedKey(value) {
            return normalize(value).replace(/\s+/g, '')
          }

          function attr(block, name) {
            const match = block.match(new RegExp('\\b' + name + '="([^"]*)"', 'i'))
            return match ? decodeXml(match[1]) : ''
          }

          function tag(block, name) {
            const match = block.match(new RegExp('<' + name + '\\b[^>]*>([\\s\\S]*?)</' + name + '>', 'i'))
            return match ? cleanSpaces(decodeXml(match[1].replace(/<[^>]+>/g, ' '))) : ''
          }

          function tagBySystem(block, system) {
            const match = block.match(new RegExp('<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>([\\s\\S]*?)</episode-num>', 'i'))
            return match ? cleanSpaces(decodeXml(match[1])) : ''
          }

          function replaceFirstTag(block, name, value, language = 'en') {
            const expression = new RegExp('<' + name + '\\b[^>]*>[\\s\\S]*?</' + name + '>', 'i')
            const replacement = '<' + name + ' lang="' + language + '">' + escapeXml(value) + '</' + name + '>'
            return expression.test(block)
              ? block.replace(expression, replacement)
              : block.replace(/<\/programme>\s*$/i, '  ' + replacement + '\n</programme>')
          }

          function addBeforeProgrammeEnd(block, xml) {
            return block.replace(/<\/programme>\s*$/i, '  ' + xml + '\n</programme>')
          }

          function removeEpisodeSystem(block, system) {
            return block.replace(
              new RegExp('\\s*<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>[\\s\\S]*?</episode-num>', 'gi'),
              ''
            )
          }

          function cleanSeriesTitle(value) {
            return cleanSpaces(value)
              .replace(/\s+\((?:19|20)\d{2}\)\s*$/, '')
              .replace(/\s*[.\-–—:]?\s*S(?:eason)?\s*\d{1,3}\s*E(?:pisode)?\s*\d{1,3}\s*$/i, '')
              .trim()
          }

          function normalizeEpisode(value) {
            const text = cleanSpaces(value)
            let match = text.match(/^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i)
            if (match) return 'S' + Number(match[1]) + 'E' + Number(match[2])
            match = text.match(/^(\d{1,3})\.(\d{1,3})\.?$/)
            if (match) return 'S' + (Number(match[1]) + 1) + 'E' + (Number(match[2]) + 1)
            return ''
          }

          function episodeNumber(block) {
            return normalizeEpisode(
              tagBySystem(block, 'common') ||
              tagBySystem(block, 'onscreen') ||
              tagBySystem(block, 'xmltv_ns')
            )
          }

          function compactDate(block) {
            const value = tag(block, 'date')
            const match = value.match(/^(\d{4})(\d{2})(\d{2})$/)
            return match ? match[2] + '/' + match[3] + '/' + match[1] : ''
          }

          function displayDate(iso) {
            const match = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/)
            return match ? match[2] + '/' + match[3] + '/' + match[1] : ''
          }

          function isFrenchOnlyChannel(block) {
            const id = normalize(attr(block, 'id'))
            const names = [...block.matchAll(/<display-name\b[^>]*>([\s\S]*?)<\/display-name>/gi)]
              .map(match => normalize(decodeXml(match[1].replace(/<[^>]+>/g, ' '))))
            const text = [id, ...names].join(' ')

            if (/\blang="fr(?:-[a-z]+)?"/i.test(block) && !/\blang="en(?:-[a-z]+)?"/i.test(block)) return true

            const patterns = [
              /\bici\s+radio\s+canada\b/,
              /\bradio\s+canada\b/,
              /\btele\s+quebec\b/,
              /\btva(?:\s|$)/,
              /\bnoovo\b/,
              /\btv5\s+quebec\b/,
              /\bunis\s+tv\b/,
              /\bcanal\s+vie\b/,
              /\bcanal\s+d\b/,
              /\baddik\s*tv\b/,
              /\bseries\s+plus\b/,
              /\brds(?:\s*2|\s*info)?\b/,
              /\btva\s+sports\b/,
              /\bhistoria\b/,
              /\bevasion\b/,
              /\bexplora\b/,
              /\blcn\b/,
              /\bmeteo\s*media\b/,
              /\bami\s*tele\b/,
              /\bprise\s*2\b/,
              /\bmax\b.*\bquebec\b/
            ]
            return patterns.some(pattern => pattern.test(text))
          }

          function isMovie(block) {
            const categories = [...block.matchAll(/<category\b[^>]*>([\s\S]*?)<\/category>/gi)]
              .map(match => normalize(decodeXml(match[1])))
            return categories.some(value => value === 'movie' || value === 'film')
          }

          function stripExistingDisplayPrefix(description, episodeTitle, episodeCode) {
            let result = cleanSpaces(description)
            if (!result) return ''

            const escapedTitle = episodeTitle ? episodeTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : ''
            const escapedCode = episodeCode ? episodeCode.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : ''

            if (escapedTitle && escapedCode) {
              result = result.replace(new RegExp('^' + escapedTitle + '\\s*[-–—:]\\s*' + escapedCode + '\\.?\\s*', 'i'), '')
              result = result.replace(new RegExp('^' + escapedCode + '\\s*[-–—:]\\s*' + escapedTitle + '\\.?\\s*', 'i'), '')
            }
            if (escapedCode) result = result.replace(new RegExp('^' + escapedCode + '\\.?\\s*', 'i'), '')
            if (escapedTitle) result = result.replace(new RegExp('^' + escapedTitle + '\\.?\\s*', 'i'), '')
            return cleanSpaces(result)
          }

          function formatDescription({ episodeTitle, episodeCode, description, airDate, movie, year }) {
            const body = stripExistingDisplayPrefix(description, episodeTitle, episodeCode)
            const parts = []

            if (!movie && episodeTitle && episodeCode) parts.push(episodeTitle + ' - ' + episodeCode)
            else if (!movie && episodeTitle) parts.push(episodeTitle)
            else if (!movie && episodeCode) parts.push(episodeCode)

            if (body) parts.push(body.replace(/[.\s]+$/, ''))
            let result = parts.join('. ')

            if (movie && year) {
              result = result.replace(/\s*\((?:19|20)\d{2}\)\s*$/, '')
              result += (result ? ' ' : '') + '(' + year + ')'
            } else if (!movie && airDate) {
              result = result.replace(/\s*\(\d{2}\/\d{2}\/\d{4}\)\s*$/, '')
              result += (result ? ' ' : '') + '(' + airDate + ')'
            }

            return cleanSpaces(result)
          }


          function categories(block) {
            return [...block.matchAll(/<category\b[^>]*>([\s\S]*?)<\/category>/gi)]
              .map(match => normalize(decodeXml(match[1].replace(/<[^>]+>/g, ' '))))
              .filter(Boolean)
          }

          function hasCategory(block, patterns) {
            const values = categories(block)
            return values.some(value => patterns.some(pattern => pattern.test(value)))
          }

          function isExcludedFromSeriesEnrichment(programme) {
            const block = programme.originalBlock
            const title = normalize(programme.title)
            const subtitle = normalize(programme.episodeTitle)
            const combined = cleanSpaces(title + ' ' + subtitle)

            // Movies never go through TVMaze series enrichment.
            if (programme.movie) return 'movie'

            // These programmes keep the original IPTV-org metadata and only receive
            // the normal display cleanup. They are never sent to TVMaze.
            if (hasCategory(block, [
              /\bsports?\b/, /\bnews\b/, /\bcurrent affairs\b/, /\bweather\b/,
              /\bshopping\b/, /\binfomercial\b/, /\bpaid programming\b/,
              /\breligion\b/, /\breligious\b/, /\bconcert\b/,
              /\bawards?\b/
            ])) return 'category'

            if ([
              /\blive\b/, /\bnews\b/, /\bweather\b/, /\bsports?\b/,
              /\bshopping\b/, /\binfomercial\b/, /\bpaid programming\b/,
              /\bto be announced\b/, /\btba\b/, /\bno information\b/,
              /\bprogramme information\b/, /\bsign off\b/, /\bclosedown\b/
            ].some(pattern => pattern.test(combined))) return 'category'

            return ''
          }

          function needsEnrichment(programme) {
            return !programme.episodeTitle ||
              !programme.episodeCode ||
              !programme.description ||
              !programme.airDate
          }

          class AdaptiveApiClient {
            constructor(name, options = {}) {
              this.name = name
              this.delayMs = options.startDelayMs || 500
              this.minDelayMs = options.minDelayMs || 75
              this.maxDelayMs = options.maxDelayMs || 15000
              this.successesToSpeedUp = options.successesToSpeedUp || 20
              this.speedUpFactor = options.speedUpFactor || 0.90
              this.slowDownFactor = options.slowDownFactor || 1.80
              this.nextRequestAt = 0
              this.successStreak = 0
              this.requests = 0
              this.matches = 0
              this.rateLimits = 0
              this.retries = 0
              this.temporaryFailures = 0
              this.permanentFailures = 0
              this.retryQueue = []
            }

            sleep(ms) {
              return new Promise(resolve => setTimeout(resolve, ms))
            }

            async waitTurn() {
              const now = Date.now()
              const wait = Math.max(0, this.nextRequestAt - now)
              this.nextRequestAt = Math.max(now, this.nextRequestAt) + this.delayMs
              if (wait > 0) await this.sleep(wait)
            }

            speedUp() {
              this.successStreak++
              if (this.successStreak < this.successesToSpeedUp) return
              const oldDelay = this.delayMs
              this.delayMs = Math.max(this.minDelayMs, Math.round(this.delayMs * this.speedUpFactor))
              this.successStreak = 0
              if (this.delayMs !== oldDelay) {
                console.log('[' + this.name + ' SPEED UP] delay=' + oldDelay + 'ms -> ' + this.delayMs + 'ms')
              }
            }

            slowDown(retryAfterMs = 0) {
              const oldDelay = this.delayMs
              this.delayMs = Math.min(
                this.maxDelayMs,
                Math.max(Math.round(this.delayMs * this.slowDownFactor), retryAfterMs || 0)
              )
              this.successStreak = 0
              console.log('[' + this.name + ' SLOW DOWN] delay=' + oldDelay + 'ms -> ' + this.delayMs + 'ms')
            }

            isTemporaryStatus(status) {
              return status === 408 || status === 425 || status === 429 || status >= 500
            }

            retryAfterMs(response) {
              const raw = response.headers.get('retry-after')
              if (!raw) return 0
              const seconds = Number(raw)
              if (Number.isFinite(seconds)) return Math.max(0, seconds * 1000)
              const date = Date.parse(raw)
              return Number.isFinite(date) ? Math.max(0, date - Date.now()) : 0
            }

            async requestJson(task, isRetry = false) {
              await this.waitTurn()
              this.requests++

              try {
                const response = await fetch(task.url, task.options || {})

                if (response.status === 404) {
                  this.speedUp()
                  return { ok: true, data: null, noMatch: true }
                }

                if (this.isTemporaryStatus(response.status)) {
                  const retryAfter = this.retryAfterMs(response)
                  if (response.status === 429) this.rateLimits++
                  this.temporaryFailures++
                  this.slowDown(retryAfter)
                  if (retryAfter > 0) await this.sleep(retryAfter)
                  return { ok: false, temporary: true, status: response.status }
                }

                if (!response.ok) {
                  this.permanentFailures++
                  console.log('[' + this.name + ' PERMANENT ERROR] HTTP ' + response.status + ' | ' + task.label)
                  return { ok: false, permanent: true, status: response.status }
                }

                const data = await response.json()
                this.speedUp()
                return { ok: true, data }
              } catch (error) {
                this.temporaryFailures++
                this.slowDown()
                console.log('[' + this.name + ' NETWORK ERROR] ' + task.label + ' | ' + error.message)
                return { ok: false, temporary: true, error: error.message }
              }
            }

            async execute(task) {
              const result = await this.requestJson(task, false)
              if (result.temporary) this.retryQueue.push(task)
              return result
            }

            async drainRetries(maxPasses = 4) {
              let recovered = 0

              for (let pass = 1; pass <= maxPasses && this.retryQueue.length; pass++) {
                const pending = this.retryQueue.splice(0)
                console.log('[' + this.name + ' RETRY ' + pass + '] queued=' + pending.length +
                  ' | delay=' + this.delayMs + 'ms')

                // Give the API a recovery pause before retrying the rate-limited batch.
                await this.sleep(Math.min(this.maxDelayMs, Math.max(2000, this.delayMs * 3)))

                for (let index = 0; index < pending.length; index++) {
                  const task = pending[index]
                  this.retries++
                  const result = await this.requestJson(task, true)

                  if (result.ok) {
                    recovered++
                    if (typeof task.onRecovered === 'function') await task.onRecovered(result.data)
                  } else if (result.temporary) {
                    this.retryQueue.push(task)
                  }

                  if ((index + 1) % 25 === 0 || index + 1 === pending.length) {
                    console.log('[' + this.name + ' RETRY ' + pass + '] completed=' +
                      (index + 1) + '/' + pending.length +
                      ' | recovered=' + recovered +
                      ' | remaining=' + this.retryQueue.length +
                      ' | delay=' + this.delayMs + 'ms')
                  }
                }
              }

              return recovered
            }

            status() {
              return 'delay=' + this.delayMs + 'ms' +
                ' | requests=' + this.requests +
                ' | 429s=' + this.rateLimits +
                ' | retries=' + this.retries +
                ' | retryQueue=' + this.retryQueue.length +
                ' | tempFailures=' + this.temporaryFailures +
                ' | permanentFailures=' + this.permanentFailures
            }
          }

          const tvmazeClient = new AdaptiveApiClient('TVMAZE', {
            startDelayMs: 550,
            minDelayMs: 110,
            maxDelayMs: 15000,
            successesToSpeedUp: 20
          })

          const tmdbClient = new AdaptiveApiClient('TMDB', {
            startDelayMs: 250,
            minDelayMs: 60,
            maxDelayMs: 15000,
            successesToSpeedUp: 25
          })

          async function fetchJson(url, label = url) {
            const task = {
              url,
              label,
              options: {
                headers: { 'User-Agent': 'festy-epg-fill-missing-only/4.0' }
              }
            }

            // TVMaze lookups are retried here so recovered JSON flows back into the
            // exact programme currently being enriched instead of being discarded.
            for (let pass = 0; pass < 6; pass++) {
              const result = await tvmazeClient.requestJson(task, pass > 0)

              if (result.ok) return result.data
              if (result.permanent) return null

              tvmazeClient.retries++
              const recoveryPause = Math.min(
                tvmazeClient.maxDelayMs,
                Math.max(2000, tvmazeClient.delayMs * (pass + 2))
              )
              console.log('[TVMAZE RETRY] pass=' + (pass + 1) + '/6' +
                ' | title=' + label +
                ' | waiting=' + recoveryPause + 'ms' +
                ' | delay=' + tvmazeClient.delayMs + 'ms')
              await tvmazeClient.sleep(recoveryPause)
            }

            console.log('[TVMAZE UNRECOVERED] keeping original IPTV-org metadata | ' + label)
            return null
          }

          function extractExistingYear(programme) {
            const dateTag = firstTag(programme.originalBlock, 'date')
            const direct = normalize(dateTag).match(/\b(18|19|20)\d{2}\b/)
            if (direct) return direct[0]

            const desc = normalize(programme.description)
            const inDescription = desc.match(/\((18|19|20)\d{2}\)\s*$/)
            if (inDescription) return inDescription[0].replace(/[()]/g, '')

            return ''
          }

          function needsMovieYear(programme) {
            return programme.movie && !extractExistingYear(programme)
          }

          function addMovieYear(programme, year) {
            if (!year || extractExistingYear(programme)) return false

            if (/<date\b[^>]*>[\s\S]*?<\/date>/i.test(programme.originalBlock)) {
              programme.originalBlock = replaceFirstTag(programme.originalBlock, 'date', year)
            } else {
              programme.originalBlock = programme.originalBlock.replace(
                /<\/programme>\s*$/i,
                '  <date>' + escapeXml(year) + '</date>\n</programme>'
              )
            }

            programme.airDate = year
            return true
          }

          function chooseTmdbMovie(results, title) {
            const wanted = normalizedKey(title)
            return (
              results.find(item => normalizedKey(item.title) === wanted) ||
              results.find(item => normalizedKey(item.original_title) === wanted) ||
              results[0] ||
              null
            )
          }

          async function enrichMovieGroup(group) {
            const title = group[0].title
            const apiKey = process.env.TMDB_API_KEY || ''
            if (!apiKey) throw new Error('Missing required GitHub secret: TMDB_API_KEY')

            const cacheKey = normalizedKey(title)
            if (tmdbMovieCache.has(cacheKey)) {
              const cached = tmdbMovieCache.get(cacheKey)
              if (cached && cached.year) {
                stats.movieTitlesMatched++
                for (const programme of group) {
                  if (addMovieYear(programme, cached.year)) stats.movieYearsFilled++
                }
              }
              return
            }

            const task = {
              url: 'https://api.themoviedb.org/3/search/movie?api_key=' +
                encodeURIComponent(apiKey) +
                '&query=' + encodeURIComponent(title) +
                '&include_adult=false&language=en-US&page=1',
              label: title,
              options: {
                headers: {
                  Accept: 'application/json',
                  'User-Agent': 'festy-epg-movie-enrichment/4.1'
                }
              },
              onRecovered: async data => {
                const results = Array.isArray(data && data.results) ? data.results : []
                const match = chooseTmdbMovie(results, title)
                const year = match && match.release_date
                  ? String(match.release_date).match(/^(18|19|20)\d{2}/)?.[0] || ''
                  : ''
                tmdbMovieCache.set(cacheKey, year ? { year } : null)
                if (year) {
                  stats.movieTitlesMatched++
                  for (const programme of group) {
                    if (addMovieYear(programme, year)) stats.movieYearsFilled++
                  }
                }
              }
            }

            const result = await tmdbClient.execute(task)
            if (!result.ok) return

            const results = Array.isArray(result.data && result.data.results)
              ? result.data.results
              : []
            const match = chooseTmdbMovie(results, title)
            const year = match && match.release_date
              ? String(match.release_date).match(/^(18|19|20)\d{2}/)?.[0] || ''
              : ''

            tmdbMovieCache.set(cacheKey, year ? { year } : null)
            if (year) {
              stats.movieTitlesMatched++
              for (const programme of group) {
                if (addMovieYear(programme, year)) stats.movieYearsFilled++
              }
            }
          }

          async function getShow(title) {
            const key = normalizedKey(title)
            if (showCache.has(key)) return showCache.get(key)
            stats.tvmazeShowsChecked++
            const results = await fetchJson('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(title))
            const shows = Array.isArray(results) ? results.map(item => item.show).filter(Boolean) : []
            const exact = shows.find(show => normalizedKey(show.name) === key) || null
            showCache.set(key, exact)
            if (exact) stats.tvmazeShowsMatched++
            return exact
          }

          async function getEpisodes(showId) {
            if (episodesCache.has(showId)) return episodesCache.get(showId)
            const result = await fetchJson('https://api.tvmaze.com/shows/' + showId + '/episodes?specials=1')
            const episodes = Array.isArray(result) ? result : []
            episodesCache.set(showId, episodes)
            return episodes
          }

          function uniqueEpisodeByTitle(episodes, title) {
            const key = normalizedKey(title)
            if (!key) return null
            const matches = episodes.filter(episode => normalizedKey(episode.name) === key)
            return matches.length === 1 ? matches[0] : null
          }

          function episodeByCode(episodes, code) {
            const match = String(code || '').match(/^S(\d+)E(\d+)$/i)
            if (!match) return null
            return episodes.find(episode =>
              Number(episode.season) === Number(match[1]) &&
              Number(episode.number) === Number(match[2])
            ) || null
          }

          function episodeCode(episode) {
            if (!episode || episode.season == null || episode.number == null) return ''
            return 'S' + Number(episode.season) + 'E' + Number(episode.number)
          }

          function tvmazeSummary(episode) {
            return cleanSpaces(String(episode && episode.summary || '').replace(/<[^>]+>/g, ' '))
          }

          async function enrichGroup(group) {
            const first = group[0]
            if (!first || first.movie) return
            const show = await getShow(first.title)
            if (!show) return
            const episodes = await getEpisodes(show.id)
            if (!episodes.length) return

            for (const programme of group) {
              if (isExcludedFromSeriesEnrichment(programme)) continue
              if (!needsEnrichment(programme)) continue

              let episode = null
              if (programme.episodeCode) episode = episodeByCode(episodes, programme.episodeCode)
              if (!episode && programme.episodeTitle) episode = uniqueEpisodeByTitle(episodes, programme.episodeTitle)
              if (!episode) continue

              stats.tvmazeProgrammesMatched++

              if (!programme.episodeTitle && episode.name) {
                programme.episodeTitle = cleanSpaces(episode.name)
                stats.tvmazeEpisodeTitlesFilled++
                stats.tvmazeFieldsFilled++
              }
              if (!programme.episodeCode && episodeCode(episode)) {
                programme.episodeCode = episodeCode(episode)
                stats.tvmazeEpisodeNumbersFilled++
                stats.tvmazeFieldsFilled++
              }
              if (!programme.description && tvmazeSummary(episode)) {
                programme.description = tvmazeSummary(episode)
                stats.tvmazeDescriptionsFilled++
                stats.tvmazeFieldsFilled++
              }
              if (!programme.airDate && displayDate(episode.airdate)) {
                programme.airDate = displayDate(episode.airdate)
                stats.tvmazeAirDatesFilled++
                stats.tvmazeFieldsFilled++
              }
            }
          }

          function heartbeat() {
            console.log('[PROGRESS] stage=' + currentStage +
              ' | groups=' + groupsCompleted + '/' + totalGroups +
              ' | TVMaze: ' + tvmazeClient.status() +
              ' | TMDB: ' + tmdbClient.status() +
              ' | series matches=' + stats.tvmazeProgrammesMatched +
              ' | series fields=' + stats.tvmazeFieldsFilled +
              ' | movie years=' + stats.movieYearsFilled)
          }

          async function main() {
            currentStage = 'decompressing fresh IPTV-org guide'
            heartbeat()
            const source = zlib.gunzipSync(fs.readFileSync(inputPath)).toString('utf8')

            const declaration = (source.match(/^\s*<\?xml[\s\S]*?\?>/) || ['<?xml version="1.0" encoding="UTF-8"?>'])[0]
            const rootOpen = (source.match(/<tv\b[^>]*>/i) || ['<tv>'])[0]

            currentStage = 'reading channels and programmes'
            const channelBlocks = [...source.matchAll(/<channel\b[\s\S]*?<\/channel>/gi)].map(match => match[0])
            const programmeBlocks = [...source.matchAll(/<programme\b[\s\S]*?<\/programme>/gi)].map(match => match[0])
            stats.channelsFound = channelBlocks.length
            stats.programmesFound = programmeBlocks.length
            heartbeat()

            const removedIds = new Set()
            const keptChannels = []
            for (const block of channelBlocks) {
              const id = attr(block, 'id')
              if (id && isFrenchOnlyChannel(block)) {
                removedIds.add(id)
                stats.frenchChannelsRemoved++
              } else {
                keptChannels.push(block)
                stats.channelsWritten++
              }
            }

            const programmes = []
            for (const originalBlock of programmeBlocks) {
              const channel = attr(originalBlock, 'channel')
              if (removedIds.has(channel)) {
                stats.frenchProgrammesRemoved++
                continue
              }

              const rawTitle = tag(originalBlock, 'title')
              const title = cleanSeriesTitle(rawTitle)
              const movie = isMovie(originalBlock)
              const yearMatch = rawTitle.match(/\(((?:19|20)\d{2})\)\s*$/)
              programmes.push({
                originalBlock,
                title,
                movie,
                year: yearMatch ? yearMatch[1] : '',
                episodeTitle: tag(originalBlock, 'sub-title'),
                episodeCode: episodeNumber(originalBlock),
                description: tag(originalBlock, 'desc'),
                airDate: compactDate(originalBlock)
              })
            }

            currentStage = 'rebuilding from original IPTV-org metadata'
            heartbeat()

            const groups = new Map()
            for (const programme of programmes) {
              const key = normalizedKey(programme.title)
              if (!groups.has(key)) groups.set(key, [])
              groups.get(key).push(programme)
            }

            const queue = []
            for (const group of groups.values()) {
              const validCandidates = group.filter(programme => !isExcludedFromSeriesEnrichment(programme))

              if (!validCandidates.length) {
                const reasons = group.map(isExcludedFromSeriesEnrichment)
                if (reasons.includes('movie')) {
                  // Movies are enriched separately through TMDB.
                } else if (reasons.includes('type')) stats.enrichmentGroupsSkippedType++
                else stats.enrichmentGroupsSkippedCategory++
                continue
              }

              if (!validCandidates.some(needsEnrichment)) {
                stats.enrichmentGroupsSkippedComplete++
                continue
              }

              queue.push(group)
              stats.enrichmentCandidates++
            }

            totalGroups = queue.length
            let nextIndex = 0
            currentStage = 'TVMaze enrichment pass after rebuild'
            const timer = setInterval(heartbeat, 15000)

            async function worker(workerNumber) {
              while (true) {
                const index = nextIndex++
                if (index >= queue.length) return
                const group = queue[index]
                await enrichGroup(group)
                groupsCompleted++
                if (groupsCompleted % 100 === 0 || groupsCompleted === totalGroups) {
                  console.log('[TVMAZE] worker=' + workerNumber +
                    ' | completed=' + groupsCompleted + '/' + totalGroups +
                    ' | current=' + group[0].title +
                    ' | matches=' + stats.tvmazeProgrammesMatched +
                    ' | fields=' + stats.tvmazeFieldsFilled +
                    ' | 429s=' + stats.tvmazeRateLimits)
                }
              }
            }

            await Promise.all(Array.from({ length: Math.min(WORKERS, queue.length) }, (_, index) => worker(index + 1)))
            clearInterval(timer)
            currentStage = 'TVMaze retry verification complete'
            heartbeat()


            currentStage = 'TMDB movie enrichment pass'
            heartbeat()

            const movieGroups = new Map()
            for (const programme of programmes) {
              if (!needsMovieYear(programme)) continue
              const key = normalizedKey(programme.title)
              if (!movieGroups.has(key)) movieGroups.set(key, [])
              movieGroups.get(key).push(programme)
            }

            stats.movieCandidates = movieGroups.size
            let movieDone = 0
            const movieTimer = setInterval(heartbeat, 15000)

            for (const group of movieGroups.values()) {
              await enrichMovieGroup(group)
              movieDone++

              if (movieDone % 25 === 0 || movieDone === stats.movieCandidates) {
                console.log('[TMDB] completed=' + movieDone + '/' + stats.movieCandidates +
                  ' | current=' + group[0].title +
                  ' | matched=' + stats.movieTitlesMatched +
                  ' | years filled=' + stats.movieYearsFilled +
                  ' | ' + tmdbClient.status())
              }
            }

            currentStage = 'TMDB retry passes'
            heartbeat()
            await tmdbClient.drainRetries(4)
            clearInterval(movieTimer)

            currentStage = 'writing final enriched XMLTV guide'
            heartbeat()
            const rebuiltProgrammes = []

            for (const programme of programmes) {
              let block = programme.originalBlock

              if (programme.title && programme.title !== tag(block, 'title')) {
                block = replaceFirstTag(block, 'title', programme.title)
                stats.titlesCleaned++
              }

              if (programme.episodeTitle && !tag(block, 'sub-title')) {
                block = replaceFirstTag(block, 'sub-title', programme.episodeTitle)
              }

              if (programme.episodeCode && !episodeNumber(block)) {
                block = addBeforeProgrammeEnd(block, '<episode-num system="common">' + escapeXml(programme.episodeCode) + '</episode-num>')
              }

              if (programme.airDate && !tag(block, 'date')) {
                const parts = programme.airDate.match(/^(\d{2})\/(\d{2})\/(\d{4})$/)
                if (parts) block = addBeforeProgrammeEnd(block, '<date>' + parts[3] + parts[1] + parts[2] + '</date>')
              }

              const formatted = formatDescription(programme)
              if (formatted && formatted !== tag(block, 'desc')) {
                block = replaceFirstTag(block, 'desc', formatted)
                stats.descriptionsFormatted++
              }

              // Prevent TiviMate from appending S/E to the title. Keep/add common instead.
              block = removeEpisodeSystem(block, 'xmltv_ns')

              rebuiltProgrammes.push(block)
              stats.programmesWritten++
              if (stats.programmesWritten % 10000 === 0) heartbeat()
            }

            const output = [
              declaration,
              rootOpen,
              ...keptChannels,
              ...rebuiltProgrammes,
              '</tv>',
              ''
            ].join('\n')

            fs.writeFileSync(outputPath, output, 'utf8')

            currentStage = 'complete'
            heartbeat()
            console.log('')
            console.log('========================================')
            console.log('CANADA GUIDE COMPLETE')
            console.log('========================================')
            for (const [key, value] of Object.entries(stats)) console.log(key + ': ' + value)
            console.log('Output: ' + outputPath)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

          node /tmp/build_canada_guide.js

      - name: Validate rebuilt guide against source
        run: |
          set -e
          gzip -dc canada/source/epg-ca.xml.gz > canada/work/original.xml

          ORIGINAL_CHANNELS=$(grep -c '<channel ' canada/work/original.xml || true)
          ORIGINAL_PROGRAMMES=$(grep -c '<programme ' canada/work/original.xml || true)
          OUTPUT_CHANNELS=$(grep -c '<channel ' canada/work/canada.xml || true)
          OUTPUT_PROGRAMMES=$(grep -c '<programme ' canada/work/canada.xml || true)

          echo "Original channels: $ORIGINAL_CHANNELS"
          echo "Output channels:   $OUTPUT_CHANNELS"
          echo "Original programmes: $ORIGINAL_PROGRAMMES"
          echo "Output programmes:   $OUTPUT_PROGRAMMES"

          test "$OUTPUT_CHANNELS" -gt 0
          test "$OUTPUT_PROGRAMMES" -gt 0

          # The output may only be smaller because French-only channels were removed.
          if [ "$OUTPUT_PROGRAMMES" -lt $((ORIGINAL_PROGRAMMES * 70 / 100)) ]; then
            echo "ERROR: More than 30% of the original programme data disappeared."
            exit 1
          fi

          node -e "require('fs').readFileSync('canada/work/canada.xml','utf8'); console.log('Output XML file is readable')"
          grep -q 'channel="AandE.ca"' canada/work/canada.xml
          grep -q 'channel="CartoonNetwork.ca"' canada/work/canada.xml
          echo "A&E and Cartoon Network listings are present."

      - name: Compress Canada guide
        run: |
          gzip -c canada/work/canada.xml > guides/canada.xml.gz
          gzip -t guides/canada.xml.gz
          ls -lh guides/canada.xml.gz

      - name: Commit and push Canada guide
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/canada.xml.gz

          if git diff --cached --quiet; then
            echo "No Canada guide changes to commit"
            exit 0
          fi

          git commit -m "Update Canada guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 10
          done

          echo "Push failed after all retries"
          exit 1
