# .github/workflows/one-time-fix-tvguidetivimate-source-logos.yml
name: One-time fix tvguidetivimate source logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-source-logos-once:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix logos inside guides/tvguidetivimate.xml
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/tvguidetivimate.xml'

          const fixes = {
            'FS1.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/FOX%20Sports%201%20HD.png',
            'FS2.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/FOX%20Sports%202.png',
            'DISCOVERY.SCIENCE.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Science%20HD.png',
            'SMITHSONIAN.CHANNEL.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/smithsonian%20channel%20extra.png',
            'LMN.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/lifetime%20movie%20network.png',
            'POP.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Pop%20Network%20HD.png',
            'VICE.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Vice_TV.webp',
            'CRIME.AND.INVESTIGATION.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Crime%20%26%20Investigation%20Network%20HD.png',
            'HALLMARK.DRAMA.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Hallmark%20Family.png',
            'CINEMAX.ACTION.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Action_2025.svg',
            'NESN.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Sports%20Network.png',
            'NESN.PLUS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Sports%20Network%20Plus%20HD.png',
            'NECN.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Cable%20News.png'
          }

          function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function upsertIcon(channelBlock, logoUrl) {
            const icon = `<icon src="${escapeXml(logoUrl)}"/>`

            if (/<icon\b[^>]*\/?>/i.test(channelBlock)) {
              return channelBlock.replace(/<icon\b[^>]*\/?>/i, icon)
            }

            if (/<display-name\b[^>]*>[\s\S]*?<\/display-name>/i.test(channelBlock)) {
              return channelBlock.replace(
                /(<display-name\b[^>]*>[\s\S]*?<\/display-name>)/i,
                `$1${icon}`
              )
            }

            return channelBlock.replace(/(<channel\b[^>]*>)/i, `$1${icon}`)
          }

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          let xml = fs.readFileSync(guidePath, 'utf8')
          let fixed = 0
          const missing = []

          for (const [id, logoUrl] of Object.entries(fixes)) {
            const re = new RegExp(
              `<channel\\b[^>]*\\bid="${escapeRegExp(id)}"[^>]*>[\\s\\S]*?<\\/channel>`,
              'i'
            )

            if (!re.test(xml)) {
              missing.push(id)
              continue
            }

            xml = xml.replace(re, block => {
              fixed++
              return upsertIcon(block, logoUrl)
            })
          }

          fs.writeFileSync(guidePath, xml)

          console.log(`Fixed logos in ${guidePath}: ${fixed}`)

          if (missing.length) {
            console.error('Missing target channels:')
            missing.forEach(id => console.error(`- ${id}`))
            process.exit(1)
          }
          EOF

      - name: Delete this one-time workflow
        run: |
          rm -f .github/workflows/one-time-fix-tvguidetivimate-source-logos.yml

      - name: Commit source logo fixes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/tvguidetivimate.xml
          git add .github/workflows/one-time-fix-tvguidetivimate-source-logos.yml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Fix source TiviMate logos"
          git push
