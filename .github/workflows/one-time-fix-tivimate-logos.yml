name: TVPassport Extra Logo Patch

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */12 * * *"

permissions:
  contents: write

concurrency:
  group: tvpassport-extra-logo-patch
  cancel-in-progress: false

jobs:
  patch-extra-tvpassport-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert logo SVG files to PNG
        run: |
          find logos -type f -name "*.svg" -print0 | while IFS= read -r -d '' svg; do
            png="${svg%.svg}.png"
            echo "Converting $svg -> $png"
            rsvg-convert "$svg" -o "$png"
          done

      - name: Decompress TVPassport gz guide
        run: |
          if [ -f guides/TVPassport.xml.gz ]; then
            gunzip -c guides/TVPassport.xml.gz > guides/TVPassport.xml
          fi

      - name: Patch TVPassport logos in XML outputs
        run: |
          node <<'EOFJS'
          const fs = require('fs')
          const zlib = require('zlib')

          const files = [
            'guides/TVPassport.xml',
            'guides/TVPassportRAW.xml'
          ]

          const logoMap = {
            'CBSSportsNetworkUSA.us@SD': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/CBS%20Sports%20Network%20HD.png',
            'CINEMAX.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax.png',
            'CINEMAX.CLASSICS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Classics_2025.png',
            'CINEMAX.HITS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Hits_2025.png',
            'CookingChannel.us@SD': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cooking.png',
            'CW.BOSTON.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/cw.png',
            'DiscoveryChannel.us@East': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/discovery.png',
            'FXM.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/FX%20Movie%20HD.png',
            'E.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/E!.png',
            'HBOSignature.us@East': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/HBO%20Drama.png',
            'NAT.GEO.WILD.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/National%20Geographic%20Wild.png',
            'NBATV.us@SD': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/NBA%20TV%20HD.png',
            'NHLNetwork.us@SD': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/NHL%20Network%20HD.png',
            'PARAMOUNT.PLUS.SHOWTIME.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Paramount%2B%20with%20Showtime.png',
            'SHOWTIME.BET.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/showtime%20bet.png',
            'SONY.MOVIES.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Sony_Movies_2019.png',
            'UP.TV.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Up%20Entertainment%20HD.png',
            'USA.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/usa%20network.png'
          }

          const nameLogoMap = {
            'HBO': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/HBO.png',
            'MTV': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MTV.png',
            'Cozi': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cozi%20TV.png',
            'Antenna': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Antenna%20TV.png'
          }

          const renameMap = {
            'SONY.MOVIES.us': 'Sony Movies'
          }

          function patchIcon(block, logo) {
            if (block.includes('<icon ')) {
              return block.replace(/<icon[^>]*\/>/, `<icon src="${logo}"/>`)
            }

            return block.replace(
              /(<display-name[^>]*>[\s\S]*?<\/display-name>)/,
              `$1\n    <icon src="${logo}"/>`
            )
          }

          function getDisplayName(block) {
            const m = block.match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/)
            return m ? m[1].replace(/&amp;/g, '&').trim() : ''
          }

          function patchBlock(block) {
            for (const [id, logo] of Object.entries(logoMap)) {
              if (block.includes(`id="${id}"`) || block.includes(`channel="${id}"`)) {
                let patched = patchIcon(block, logo)

                if (renameMap[id]) {
                  patched = patched.replace(
                    /<display-name[^>]*>[\s\S]*?<\/display-name>/,
                    `<display-name>${renameMap[id]}</display-name>`
                  )
                }

                return patched
              }
            }

            const name = getDisplayName(block)
            if (nameLogoMap[name]) {
              return patchIcon(block, nameLogoMap[name])
            }

            return block
          }

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`Skipping missing ${file}`)
              continue
            }

            let xml = fs.readFileSync(file, 'utf8')
            if (!xml.trim()) {
              console.log(`Skipping empty ${file}`)
              continue
            }

            const before = xml

            xml = xml.replace(/<channel\b[\s\S]*?<\/channel>/g, patchBlock)

            fs.writeFileSync(file, xml)

            console.log(xml !== before ? `Patched ${file}` : `No changes in ${file}`)
          }

          if (fs.existsSync('guides/TVPassport.xml')) {
            const xml = fs.readFileSync('guides/TVPassport.xml')
            if (xml.length > 0) {
              fs.writeFileSync('guides/TVPassport.xml.gz', zlib.gzipSync(xml))
              console.log('Rebuilt guides/TVPassport.xml.gz')
            }
          }
          EOFJS

      - name: Commit and push extra TVPassport logo patches
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add logos/*.png
          git add guides/TVPassport.xml guides/TVPassportRAW.xml guides/TVPassport.xml.gz

          if git diff --cached --quiet; then
            echo "No extra TVPassport logo changes to commit"
            exit 0
          fi

          git commit -m "Patch extra TVPassport logos"
          git pull --rebase origin main
          git push origin HEAD:main
