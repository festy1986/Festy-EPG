name: One-time fix OTA local raw logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ota-local-raw-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix OTA local raw logos
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/OTALocalsguide.raw.xml'

          const fixes = {
            '9100000664#9233005477': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/PBS.png',
            '9100000664#9233006796': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WCSH-DT%20Portland%2C%20Maine%20(NBC).png',
            '9100000664#9233001666': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WGME-DT%20Portland%2C%20Maine%20(CBS).png',
            '9100000664#9233003676': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WGME-DT2%20Portland%2C%20Maine%20(FOX).png',
            '9100000664#9233005846': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Court%20TV.png',
            '9100000664#9200008618': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION%20Plus.png',
            '9100000664#9266021286': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Game%20Show%20Network%20HD.png',
            '9100000664#9200014312': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT%20Poland%20Spring%2C%20Maine%20(ABC).png',
            '9100000664#9200016252': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT2%20Poland%20Spring%2C%20Maine%20(MeTV).png',
            '9100000664#9266073627': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT3%20Poland%20Spring%2C%20Maine%20(Laff).png',
            '9100000664#9200018453': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/charge!.png',
            '9100000664#9200005724': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WPFO-DT3%20Waterville%2C%20Maine.%20(Comet).png',
            '9100000664#9233005684': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION.png',
            '9100000664#9200020338': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Heroes%20%26%20Icons%20Network.png',
            '9100000664#9200017556': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WPXT-DT3%20Portland%2C%20Maine%20(ION%20Mystery).png'
          }

          function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function upsertIcon(block, logoUrl) {
            const icon = `<icon src="${escapeXml(logoUrl)}"/>`

            if (/<icon\b[^>]*\/?>/i.test(block)) {
              return block.replace(/<icon\b[^>]*\/?>/i, icon)
            }

            return block.replace(
              /((?:\s*<display-name\b[^>]*>[\s\S]*?<\/display-name>)+)/i,
              `$1\n    ${icon}`
            )
          }

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          let xml = fs.readFileSync(guidePath, 'utf8')
          let fixed = 0
          const missing = []

          for (const [id, logoUrl] of Object.entries(fixes)) {
            const re = new RegExp(
              `<channel\\b[^>]*\\bid="${escapeRegExp(id)}"[^>]*>[\\s\\S]*?<\\/channel>`,
              'i'
            )

            const match = xml.match(re)

            if (!match) {
              missing.push(id)
              continue
            }

            xml = xml.replace(match[0], upsertIcon(match[0], logoUrl))
            fixed++
          }

          fs.writeFileSync(guidePath, xml)

          console.log(`Fixed OTA raw logos: ${fixed}`)

          if (missing.length) {
            console.log('\nMissing raw IDs:')
            missing.forEach(id => console.log(`- ${id}`))
          }
          EOF

      - name: Delete this one-time workflow
        run: |
          rm -f .github/workflows/one-time-fix-ota-local-raw-logos.yml

      - name: Commit OTA local raw logo fixes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Fix OTA local raw logos"
          git push
