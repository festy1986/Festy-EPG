// scripts/apply-ota-local-logos-from-source.cjs
const fs = require('fs')

const sourcePath = process.argv[2] || 'guides/OTALocalsguide.xml'
const targetPath = process.argv[3] || 'guides/OTALocalsguide.raw.xml'

if (!fs.existsSync(sourcePath)) {
  console.error(`Missing source file: ${sourcePath}`)
  process.exit(1)
}

if (!fs.existsSync(targetPath)) {
  console.error(`Missing target file: ${targetPath}`)
  process.exit(1)
}

function escapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
}

function escapeXml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
}

function decodeXml(value) {
  return String(value)
    .replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
}

function getAttr(attrs, name) {
  const match = attrs.match(new RegExp(`${name}="([^"]*)"`, 'i'))
  return match ? decodeXml(match[1]).trim() : ''
}

function getDisplayName(body) {
  const match = body.match(/<display-name\b[^>]*>([\s\S]*?)<\/display-name>/i)
  return match ? decodeXml(match[1].replace(/<[^>]+>/g, '').trim()) : ''
}

function getIconSrc(body) {
  const match = body.match(/<icon\b[^>]*\bsrc="([^"]+)"[^>]*\/?>/i)
  return match ? decodeXml(match[1]).trim() : ''
}

function normalize(value) {
  return decodeXml(value)
    .replace(/\.us$/i, '')
    .replace(/&/g, 'AND')
    .replace(/\+/g, 'PLUS')
    .replace(/[^A-Z0-9]+/gi, '.')
    .replace(/^\.+|\.+$/g, '')
    .toUpperCase()
}

function parseChannels(xml) {
  return [...xml.matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)].map(match => {
    const attrs = match[1]
    const body = match[2]

    return {
      block: match[0],
      id: getAttr(attrs, 'id'),
      displayName: getDisplayName(body),
      icon: getIconSrc(body)
    }
  })
}

function upsertIcon(channelBlock, logoUrl) {
  const icon = `<icon src="${escapeXml(logoUrl)}"/>`

  if (/<icon\b[^>]*\/?>/i.test(channelBlock)) {
    return channelBlock.replace(/<icon\b[^>]*\/?>/i, icon)
  }

  if (/<display-name\b[^>]*>[\s\S]*?<\/display-name>/i.test(channelBlock)) {
    return channelBlock.replace(
      /(<display-name\b[^>]*>[\s\S]*?<\/display-name>)/i,
      `$1${icon}`
    )
  }

  return channelBlock.replace(/(<channel\b[^>]*>)/i, `$1${icon}`)
}

const sourceXml = fs.readFileSync(sourcePath, 'utf8')
let targetXml = fs.readFileSync(targetPath, 'utf8')

const sourceChannels = parseChannels(sourceXml)
const targetChannels = parseChannels(targetXml)

const logoById = new Map()
const logoByName = new Map()

for (const channel of sourceChannels) {
  if (!channel.icon) continue
  if (!channel.icon.includes('raw.githubusercontent.com/festy1986/festy-epg/main/logos/')) continue

  if (channel.id) logoById.set(normalize(channel.id), channel.icon)
  if (channel.displayName) logoByName.set(normalize(channel.displayName), channel.icon)
}

let applied = 0
const noSourceLogo = []

for (const target of targetChannels) {
  const logo =
    logoById.get(normalize(target.id)) ||
    logoByName.get(normalize(target.displayName))

  if (!logo) {
    noSourceLogo.push(`${target.id || '(no id)'} (${target.displayName || 'no name'})`)
    continue
  }

  targetXml = targetXml.replace(target.block, upsertIcon(target.block, logo))
  applied++
}

fs.writeFileSync(targetPath, targetXml)

console.log(`Source channels scanned: ${sourceChannels.length}`)
console.log(`Target channels scanned: ${targetChannels.length}`)
console.log(`Logos applied to ${targetPath}: ${applied}`)

if (noSourceLogo.length) {
  console.log('\nNo matching GitHub logo found in source:')
  noSourceLogo.forEach(item => console.log(`- ${item}`))
}
