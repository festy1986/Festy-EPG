name: One-time copy missing TiviMate logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-missing-logos-once:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy selected logos into guides/tvguidetivimate.xml
        run: |
          node <<'EOF'
          const fs = require('fs')
          const https = require('https')
          const path = require('path')

          const sourcePath = 'guides/tvguidetivimateguide.xml'
          const targetPath = 'guides/tvguidetivimate.xml'

          const natGeoWildSourceUrl = 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/National_Geographic_Wild_2018.svg'
          const natGeoWildProperFile = 'logos/National Geographic Wild.svg'
          const natGeoWildDisplayUrl = 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/National%20Geographic%20Wild.svg'

          const targetIds = [
            'NAT.GEO.WILD.us',
            'GREAT.AMERICAN.FAMILY.us',
            'THE.MOVIE.CHANNEL.us',
            'TMC.XTRA.us',
            'STARZ.ENCORE.SUSPENSE.us',
            'MGMPLUS.HITS.us',
            'MGMPLUS.MARQUEE.us',
            'MGMPLUS.DRIVE.IN.us',
            'MOVIEPLEX.us',
            'INDIEPLEX.us',
            'ESPN2.us',
            'TRUTV.us',
            'A&E.us',
            'FX.MOVIE.CHANNEL.us',
            'SyFy.us',
            'MAGNOLIA.NETWORK.us',
            'DESTINATION.AMERICA.us',
            'FOX.NEWS.CHANNEL.us',
            'E!.us',
            'MTV2.us',
            'UPTV.us',
            'AXS.TV.us',
            'HBO.HITS.us',
            'HBO.DRAMA.us',
            'CINEMAX.HITS.us',
            'CINEMAX.CLASSICS.us',
            'SHOXBET.us',
            'STARZ.KIDS.And.FAMILY.us',
            'MGM+.us',
            'NBC.SPORTS.BOSTON.us',
            'NFL.NETWORK.us',
            'NHL.NETWORK.us',
            'MLB.NETWORK.us',
            'NBA.TV.us',
            'TV.LAND.us',
            'DISCOVERY.CHANNEL.us',
            'CNN.us',
            'FREEFRM.us',
            'FX.us',
            'FYIHD.us',
            'HBO.us',
            'HBO.MOVIES.us',
            'HIST.us',
            'MTV.us',
            'RETRPLEXHD.us',
            'SHOWTIME.SHOWCASE.us'
          ]

          function escapeRegExp(value) {
            return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          }

          function escapeXml(value) {
            return String(value)
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function decodeXml(value) {
            return String(value)
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function xmlId(id) {
            return escapeXml(id)
          }

          function findChannelBlock(xml, id) {
            const idPattern = escapeRegExp(xmlId(id))
            const re = new RegExp(
              `<channel\\b[^>]*\\bid="${idPattern}"[^>]*>[\\s\\S]*?<\\/channel>`,
              'i'
            )
            const match = xml.match(re)
            return match ? match[0] : ''
          }

          function getIconSrc(block) {
            const match = block.match(/<icon\b[^>]*\bsrc="([^"]+)"[^>]*\/?>/i)
            return match ? decodeXml(match[1]) : ''
          }

          function upsertIcon(block, logoUrl) {
            const icon = `<icon src="${escapeXml(logoUrl)}"/>`

            if (/<icon\b[^>]*\/?>/i.test(block)) {
              return block.replace(/<icon\b[^>]*\/?>/i, icon)
            }

            if (/<display-name\b[^>]*>[\s\S]*?<\/display-name>/i.test(block)) {
              return block.replace(
                /(<display-name\b[^>]*>[\s\S]*?<\/display-name>)/i,
                `$1${icon}`
              )
            }

            return block.replace(/(<channel\b[^>]*>)/i, `$1${icon}`)
          }

          function download(url, destination) {
            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream(destination)

              https.get(url, response => {
                if (response.statusCode !== 200) {
                  file.close()
                  fs.rmSync(destination, { force: true })
                  reject(new Error(`Download failed ${response.statusCode}: ${url}`))
                  return
                }

                response.pipe(file)

                file.on('finish', () => {
                  file.close(resolve)
                })
              }).on('error', error => {
                file.close()
                fs.rmSync(destination, { force: true })
                reject(error)
              })
            })
          }

          async function main() {
            if (!fs.existsSync(sourcePath)) {
              console.error(`Missing source file: ${sourcePath}`)
              process.exit(1)
            }

            if (!fs.existsSync(targetPath)) {
              console.error(`Missing target file: ${targetPath}`)
              process.exit(1)
            }

            fs.mkdirSync(path.dirname(natGeoWildProperFile), { recursive: true })

            if (fs.existsSync(natGeoWildProperFile)) {
              fs.rmSync(natGeoWildProperFile, { force: true })
              console.log(`Deleted existing ${natGeoWildProperFile}`)
            }

            await download(natGeoWildSourceUrl, natGeoWildProperFile)
            console.log(`Downloaded ${natGeoWildProperFile}`)

            const sourceXml = fs.readFileSync(sourcePath, 'utf8')
            let targetXml = fs.readFileSync(targetPath, 'utf8')

            let copied = 0
            let manualFixed = 0
            const missingInSource = []
            const missingLogoInSource = []
            const missingInTarget = []

            for (const id of targetIds) {
              const targetBlock = findChannelBlock(targetXml, id)

              if (!targetBlock) {
                missingInTarget.push(id)
                continue
              }

              if (id === 'NAT.GEO.WILD.us') {
                targetXml = targetXml.replace(targetBlock, upsertIcon(targetBlock, natGeoWildDisplayUrl))
                manualFixed++
                continue
              }

              const sourceBlock = findChannelBlock(sourceXml, id)
              if (!sourceBlock) {
                missingInSource.push(id)
                continue
              }

              const logoUrl = getIconSrc(sourceBlock)
              if (!logoUrl || !logoUrl.includes('raw.githubusercontent.com/festy1986/festy-epg/main/logos/')) {
                missingLogoInSource.push(id)
                continue
              }

              targetXml = targetXml.replace(targetBlock, upsertIcon(targetBlock, logoUrl))
              copied++
            }

            fs.writeFileSync(targetPath, targetXml)

            console.log(`Copied GitHub logos into ${targetPath}: ${copied}`)
            console.log(`Manual NAT GEO WILD fixes: ${manualFixed}`)

            if (missingInSource.length) {
              console.log('\nMissing channel in source guide:')
              missingInSource.forEach(id => console.log(`- ${id}`))
            }

            if (missingLogoInSource.length) {
              console.log('\nSource channel exists but has no GitHub logo:')
              missingLogoInSource.forEach(id => console.log(`- ${id}`))
            }

            if (missingInTarget.length) {
              console.log('\nMissing channel in target guide:')
              missingInTarget.forEach(id => console.log(`- ${id}`))
            }

            console.log('\nFinished copying available logos.')
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

      - name: Delete this one-time workflow
        run: |
          rm -f .github/workflows/one-time-copy-missing-tivimate-logos.yml

      - name: Commit logo copy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Copy missing TiviMate logos"
          git push
