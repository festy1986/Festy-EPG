name: TVPassport Channels Logo Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvpassport-channels-logo-sync
  cancel-in-progress: false

jobs:
  sync-channel-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync logos from gz guide into curated channel list
        run: |
          node <<'EOFJS'
          const fs = require('fs')
          const zlib = require('zlib')

          const channelsPath = 'guides/TVPassport.channels.xml'
          const gzPath = 'guides/TVPassport.xml.gz'

          if (!fs.existsSync(channelsPath)) {
            console.error(`Missing ${channelsPath}`)
            process.exit(1)
          }

          if (!fs.existsSync(gzPath)) {
            console.error(`Missing ${gzPath}`)
            process.exit(1)
          }

          const channelsXml = fs.readFileSync(channelsPath, 'utf8')
          const guideXml = zlib.gunzipSync(fs.readFileSync(gzPath)).toString('utf8')

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeAttr(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function getAttr(block, name) {
            const match = block.match(new RegExp(`${name}="([^"]*)"`, 'i'))
            return match ? decodeXml(match[1]) : ''
          }

          function getText(block) {
            return decodeXml(
              block
                .replace(/<[^>]+>/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
            )
          }

          function normalize(value) {
            return decodeXml(value)
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          const logosById = new Map()
          const logosByName = new Map()

          for (const match of guideXml.matchAll(/<channel\b[\s\S]*?<\/channel>/gi)) {
            const block = match[0]
            const id = getAttr(block, 'id')
            const icon = block.match(/<icon\b[^>]*src="([^"]+)"/i)
            const name = block.match(/<display-name\b[^>]*>([\s\S]*?)<\/display-name>/i)

            if (!icon) continue

            const logo = decodeXml(icon[1])
            if (id) logosById.set(id, logo)
            if (name) logosByName.set(normalize(name[1]), logo)
          }

          let added = 0
          let updated = 0

          const output = channelsXml.replace(/<channel\b[^>]*>[\s\S]*?<\/channel>/gi, block => {
            const xmltvId = getAttr(block, 'xmltv_id')
            const name = getText(block)

            const logo =
              logosById.get(xmltvId) ||
              logosByName.get(normalize(name))

            if (!logo) return block

            if (/\slogo="/i.test(block)) {
              const next = block.replace(/\slogo="[^"]*"/i, ` logo="${escapeAttr(logo)}"`)
              if (next !== block) updated++
              return next
            }

            added++
            return block.replace(/<channel\b/i, `<channel logo="${escapeAttr(logo)}"`)
          })

          fs.writeFileSync(channelsPath, output)

          console.log(`Added logos: ${added}`)
          console.log(`Updated logos: ${updated}`)
          EOFJS

      - name: Commit synced channel logos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/TVPassport.channels.xml

          if git diff --cached --quiet; then
            echo "No channel logo sync changes to commit"
            exit 0
          fi

          git commit -m "Sync TVPassport channel logos"
          git pull --rebase origin main
          git push origin HEAD:main
