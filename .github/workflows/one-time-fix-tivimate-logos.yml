name: TVPassport GitHub Logo Patch

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */12 * * *"

permissions:
  contents: write

concurrency:
  group: tvpassport-github-logo-patch
  cancel-in-progress: false

jobs:
  patch-tvpassport-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch TVPassport logos
        run: |
          node <<'EOFJS'
          const fs = require('fs')
          const zlib = require('zlib')

          const files = [
            'guides/TVPassport.xml',
            'guides/TVPassportRAW.xml'
          ]

          const logoMap = {
            'FOX.SPORTS.1.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/FOX%20Sports%201%20HD.png',
            'FOX.SPORTS.2.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/FOX%20Sports%202.png',
            'DISCOVERY.SCIENCE.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Science%20HD.png',
            'SMITHSONIAN.CHANNEL.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/smithsonian%20channel%20extra.png',
            'LMN.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/lifetime%20movie%20network.png',
            'POP.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Pop%20Network%20HD.png',
            'VICE.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Vice_TV.webp',
            'CRIME.AND.INVESTIGATION.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Crime%20%26%20Investigation%20Network%20HD.png',
            'HALLMARK.DRAMA.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Hallmark%20Family.png',
            'CINEMAX.ACTION.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Action_2025.svg',
            'NESN.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Sports%20Network.png',
            'NESN.PLUS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Sports%20Network%20Plus%20HD.png',
            'NEW.ENGLAND.CABLE.NEWS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/New%20England%20Cable%20News.png',
            'NBC.PORTLAND.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WCSH-DT%20Portland%2C%20Maine%20(NBC).png',
            'CBS.PORTLAND.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WGME-DT%20Portland%2C%20Maine%20(CBS).png',
            'FOX.PORTLAND.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WGME-DT2%20Portland%2C%20Maine%20(FOX).png',
            'ABC.PORTLAND.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT%20Poland%20Spring%2C%20Maine%20(ABC).png',
            'METV.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT2%20Poland%20Spring%2C%20Maine%20(MeTV).png',
            'LAFF.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WMTW-DT3%20Poland%20Spring%2C%20Maine%20(Laff).png',
            'COMET.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/WPFO-DT3%20Waterville%2C%20Maine.%20(Comet).png',
            'PBS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/PBS.png',
            'COURT.TV.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Court%20TV.png',
            'ION.PLUS.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION%20Plus.png',
            'GAME.SHOW.NETWORK.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Game%20Show%20Network%20HD.png',
            'CHARGE.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/charge!.png',
            'ION.us': 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ION.png'
          }

          function patchChannel(block, id, logo) {
            if (!block.includes(`id="${id}"`)) return block

            if (block.includes('<icon ')) {
              return block.replace(/<icon[^>]*\/>/, `<icon src="${logo}"/>`)
            }

            return block.replace(
              /(<display-name[^>]*>[\s\S]*?<\/display-name>)/,
              `$1\n    <icon src="${logo}"/>`
            )
          }

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`Skipping missing ${file}`)
              continue
            }

            let xml = fs.readFileSync(file, 'utf8')
            if (!xml.trim()) {
              console.log(`Skipping empty ${file}`)
              continue
            }

            const before = xml

            for (const [id, logo] of Object.entries(logoMap)) {
              xml = xml.replace(/<channel\b[\s\S]*?<\/channel>/g, block =>
                patchChannel(block, id, logo)
              )
            }

            fs.writeFileSync(file, xml)

            if (xml !== before) {
              console.log(`Patched ${file}`)
            } else {
              console.log(`No logo changes needed in ${file}`)
            }
          }

          if (fs.existsSync('guides/TVPassport.channels.xml')) {
            let source = fs.readFileSync('guides/TVPassport.channels.xml', 'utf8')

            source = source.replace(
              /<channel[^>]*xmltv_id="SMITHSONIAN\.CHANNEL\.us"[^>]*>[\s\S]*?<\/channel>/,
              '<channel site="tvpassport.com" site_id="smithsonian-channel-usa-hd/6237" lang="en" xmltv_id="SMITHSONIAN.CHANNEL.us">Smithsonian Channel USA HD</channel>'
            )

            fs.writeFileSync('guides/TVPassport.channels.xml', source)
          }

          if (fs.existsSync('guides/TVPassport.xml')) {
            const xml = fs.readFileSync('guides/TVPassport.xml')
            if (xml.length > 0) {
              fs.writeFileSync('guides/TVPassport.xml.gz', zlib.gzipSync(xml))
            }
          }
          EOFJS

      - name: Commit and push patched TVPassport logos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/TVPassport.xml guides/TVPassport.xml.gz guides/TVPassportRAW.xml guides/TVPassport.channels.xml

          if git diff --cached --quiet; then
            echo "No TVPassport logo changes to commit"
            exit 0
          fi

          git commit -m "Patch TVPassport GitHub logos"
          git pull --rebase origin main
          git push origin HEAD:main
