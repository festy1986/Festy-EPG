name: Fix CINESONY TVGuide Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-cinesony:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Convert CINESONY logo and update TiviMate channel
        run: |
          set -e

          OLD_LOGO="logos/Sony_Cine_2021_Logo.webp"
          NEW_LOGO="logos/cinesony.png"
          GUIDE="guides/tvguidetivimate.xml"

          if [ ! -f "$OLD_LOGO" ]; then
            echo "Missing $OLD_LOGO"
            exit 1
          fi

          if [ ! -f "$GUIDE" ]; then
            echo "Missing $GUIDE"
            exit 1
          fi

          magick "$OLD_LOGO" "$NEW_LOGO"

          if [ ! -s "$NEW_LOGO" ]; then
            echo "PNG conversion failed"
            exit 1
          fi

          rm -f "$OLD_LOGO"

          CHANNEL='<channel id="CINESONY.us" site_id="9100002976#9200015867"><display-name>CINESONY</display-name><icon src="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/cinesony.png"/><url>https://tvguide.com</url></channel>'

          if grep -q 'id="CINESONY.us"' "$GUIDE"; then
            perl -0pi -e 's|<channel id="CINESONY\.us"[^>]*>.*?</channel>|'"$CHANNEL"'|s' "$GUIDE"
          else
            perl -0pi -e 's|</tv>|'"$CHANNEL"'\n</tv>|' "$GUIDE"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guides/tvguidetivimate.xml logos

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Fix CINESONY TVGuide logo"
          git push
