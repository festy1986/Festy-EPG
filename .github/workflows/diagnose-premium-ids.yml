name: Diagnose Premium Channel IDs

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Diagnose HBO and Showtime candidates
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          guide_file = Path("guides/tvguidetivimateguide.xml")

          candidates = [
              # HBO known named feeds
              ("HBO.HITS.us", "9100002976#9233013492", "HBO HITS / possible HBO MOVIES"),
              ("HBO.DRAMA.us", "9100002976#9200002532", "HBO DRAMA"),
              ("HBO.COMEDY.us", "9100002976#9233003785", "HBO COMEDY"),

              # HBO duplicate HBO.us feeds - these need identification
              ("HBO.us", "9100002976#9233009491", "HBO candidate 1"),
              ("HBO.us", "9100002976#9233001970", "HBO candidate 2"),
              ("HBO.us", "9100002976#9200000652", "HBO candidate 3"),
              ("HBO.us", "9100002976#9233011831", "HBO candidate 4"),
              ("HBO.us", "9100002976#9233000263", "HBO candidate 5"),
              ("HBO.us", "9100002976#9200009688", "HBO candidate 6"),
              ("HBO.us", "9100002976#9200016631", "HBO candidate 7"),
              ("HBO.us", "9100002976#9233009922", "HBO candidate 8"),

              # Showtime known named feeds
              ("SHOWTIME.SHOWCASE.us", "9100002976#9233017279", "SHOWTIME SHOWCASE current"),
              ("SHOWTIME.EXTREME.us", "9100002976#9233015495", "SHOWTIME EXTREME"),
              ("SHOWTIME.NEXT.us", "9100002976#9200016686", "SHOWTIME NEXT"),
              ("SHOWTIME.WOMEN.us", "9100002976#9200002975", "SHOWTIME WOMEN"),
              ("SHOWTIME.FAMILY.ZONE.us", "9100002976#9200000968", "SHOWTIME FAMILY ZONE"),
              ("SHOXBET.us", "9100002976#9200022063", "SHOXBET"),

              # Showtime duplicate SHO.us feeds - these need identification
              ("SHO.us", "9100002976#9233003805", "SHO candidate 1"),
              ("SHO.us", "9100002976#9233015599", "SHO candidate 2"),
              ("SHO.us", "9100002976#9200002670", "SHO candidate 3"),
              ("SHO.us", "9100002976#9200000854", "SHO candidate 4"),
              ("SHO.us", "9100002976#9200004693", "SHO candidate 5"),
              ("SHO.us", "9100002976#9233005988", "SHO candidate 6"),
              ("SHO.us", "9100002976#9233009930", "SHO candidate 7"),
              ("SHO.us", "9100002976#9200012474", "SHO candidate 8"),
          ]

          text = guide_file.read_text(encoding="utf-8", errors="ignore")

          def strip_tags(s):
              return re.sub(r"<[^>]+>", "", s).replace("&amp;", "&").replace("&apos;", "'").replace("&quot;", '"').strip()

          print("")
          print("=== Premium candidate programme samples ===")
          print("")

          for xmltv_id, site_id, label in candidates:
              print("=" * 90)
              print(f"{label}")
              print(f"xmltv_id={xmltv_id}")
              print(f"site_id={site_id}")

              channel_found = (
                  f'id="{xmltv_id}"' in text
                  or f'xmltv_id="{xmltv_id}"' in text
              )
              print(f"in_tivimate_guide={channel_found}")

              # IMPORTANT:
              # Current generated guide programme entries key off channel="xmltv_id".
              # So duplicated HBO.us / SHO.us entries will all currently collapse together.
              prog_pattern = re.compile(
                  rf'<programme[^>]+channel="{re.escape(xmltv_id)}"[^>]*>.*?</programme>',
                  re.S
              )

              matches = prog_pattern.findall(text)[:15]

              if not matches:
                  print("programmes_found=0")
                  print("")
                  continue

              print(f"programmes_found_sample={len(matches)}")
              print("sample_schedule:")

              for p in matches:
                  start = re.search(r'start="([^"]+)"', p)
                  stop = re.search(r'stop="([^"]+)"', p)
                  title = re.search(r'<title[^>]*>(.*?)</title>', p, re.S)
                  desc = re.search(r'<desc[^>]*>(.*?)</desc>', p, re.S)

                  start = start.group(1) if start else ""
                  stop = stop.group(1) if stop else ""
                  title = strip_tags(title.group(1)) if title else ""
                  desc = strip_tags(desc.group(1))[:180] if desc else ""

                  print(f"  {start} -> {stop} | {title} | {desc}")

              print("")

          print("=" * 90)
          print("NOTE:")
          print("If multiple HBO.us or SHO.us candidates show the same sample schedule,")
          print("that means the output guide collapsed them under the same xmltv_id.")
          print("Then the fix is NOT just site_id; we need unique output ids/display names")
          print("for each candidate while testing, e.g. HBO.TEST.1.us, SHO.TEST.1.us.")
          print("=" * 90)
          PY
