name: Build Sports Logos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-logo-builder
  cancel-in-progress: false

jobs:
  build-sports-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Build sports logo library
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import requests

          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont


          OUTPUT_ROOT = "sports-logos"


          LEAGUES = {
              "MLB": {
                  "sport": "baseball",
                  "league": "mlb"
              },
              "NBA": {
                  "sport": "basketball",
                  "league": "nba"
              },
              "NFL": {
                  "sport": "football",
                  "league": "nfl"
              },
              "NHL": {
                  "sport": "hockey",
                  "league": "nhl"
              }
          }


          session = requests.Session()


          session.headers.update(
              {
                  "User-Agent":
                  "Mozilla/5.0 Festy Sports Logo Builder"
              }
          )


          def clean_filename(text):

              text = str(
                  text
                  or ""
              )


              text = re.sub(
                  r"[^A-Za-z0-9]+",
                  "_",
                  text
              )


              text = re.sub(
                  r"_+",
                  "_",
                  text
              )


              return text.strip(
                  "_"
              )


          def download_image(url):

              if not url:

                  return None


              try:

                  response = session.get(
                      url,
                      timeout=60
                  )


                  response.raise_for_status()


                  image = Image.open(
                      BytesIO(
                          response.content
                      )
                  )


                  return image.convert(
                      "RGBA"
                  )


              except Exception as e:

                  print(
                      "Unable to download logo:"
                  )


                  print(
                      url
                  )


                  print(
                      e
                  )


                  return None


          def resize_logo(image):

              image = image.copy()


              image.thumbnail(
                  (
                      420,
                      420
                  ),
                  Image.Resampling.LANCZOS
              )


              return image


          def create_matchup_logo(

              away_logo,

              home_logo

          ):

              canvas_width = 1000

              canvas_height = 500


              canvas = Image.new(

                  "RGBA",

                  (

                      canvas_width,

                      canvas_height

                  ),

                  (

                      255,

                      255,

                      255,

                      0

                  )

              )


              away_logo = resize_logo(

                  away_logo

              )


              home_logo = resize_logo(

                  home_logo

              )


              away_x = (

                  40

                  +

                  (

                      420

                      -

                      away_logo.width

                  )

                  // 2

              )


              away_y = (

                  (

                      canvas_height

                      -

                      away_logo.height

                  )

                  // 2

              )


              home_x = (

                  540

                  +

                  (

                      420

                      -

                      home_logo.width

                  )

                  // 2

              )


              home_y = (

                  (

                      canvas_height

                      -

                      home_logo.height

                  )

                  // 2

              )


              canvas.alpha_composite(

                  away_logo,

                  (

                      away_x,

                      away_y

                  )

              )


              canvas.alpha_composite(

                  home_logo,

                  (

                      home_x,

                      home_y

                  )

              )


              draw = ImageDraw.Draw(

                  canvas

              )


              try:

                  font = ImageFont.truetype(

                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf",

                      64

                  )


              except Exception:

                  font = None


              draw.text(

                  (

                      500,

                      250

                  ),

                  "VS",

                  anchor="mm",

                  font=font

              )


              return canvas


          def get_teams(

              sport,

              league

          ):

              url = (

                  "https://site.api.espn.com/apis/site/v2/"

                  f"sports/{sport}/{league}/teams"

              )


              response = session.get(

                  url,

                  timeout=60

              )


              response.raise_for_status()


              data = response.json()


              sports = data.get(

                  "sports",

                  []

              )


              if not sports:

                  return []


              leagues = sports[0].get(

                  "leagues",

                  []

              )


              if not leagues:

                  return []


              teams = leagues[0].get(

                  "teams",

                  []

              )


              results = []


              for item in teams:

                  team = item.get(

                      "team",

                      {}

                  )


                  team_name = (

                      team.get(

                          "displayName"

                      )

                      or team.get(

                          "name"

                      )

                      or ""

                  )


                  abbreviation = (

                      team.get(

                          "abbreviation"

                      )

                      or ""

                  )


                  logos = team.get(

                      "logos",

                      []

                  )


                  logo_url = ""


                  if logos:

                      logo_url = (

                          logos[0].get(

                              "href",

                              ""

                          )

                      )


                  if not team_name or not logo_url:

                      continue


                  results.append(

                      {

                          "name":

                          team_name,

                          "abbreviation":

                          abbreviation,

                          "folder":

                          clean_filename(

                              team_name

                          ),

                          "logo_url":

                          logo_url

                      }

                  )


              return results


          total_teams = 0

          total_matchups = 0

          skipped_existing = 0

          downloaded_logos = 0

          failed_logos = 0


          for league_name, league_info in LEAGUES.items():

              print()

              print(

                  "========================================"

              )

              print(

                  f"PROCESSING {league_name}"

              )

              print(

                  "========================================"

              )


              teams = get_teams(

                  league_info["sport"],

                  league_info["league"]

              )


              print(

                  f"Teams found: {len(teams)}"

              )


              if not teams:

                  print(

                      f"No teams returned for {league_name}"

                  )

                  continue


              loaded_teams = []


              for team in teams:

                  team_folder_path = os.path.join(

                      OUTPUT_ROOT,

                      league_name,

                      team["folder"]

                  )


                  os.makedirs(

                      team_folder_path,

                      exist_ok=True

                  )


                  individual_logo_path = os.path.join(

                      team_folder_path,

                      f"{team['folder']}.png"

                  )


                  individual_logo = None


                  if os.path.exists(

                      individual_logo_path

                  ):

                      try:

                          individual_logo = Image.open(

                              individual_logo_path

                          ).convert(

                              "RGBA"

                          )


                          print(

                              f"Existing team logo: "

                              f"{team['name']}"

                          )


                      except Exception:

                          individual_logo = None


                  if individual_logo is None:

                      print(

                          f"Downloading team logo: "

                          f"{team['name']}"

                      )


                      individual_logo = download_image(

                          team["logo_url"]

                      )


                      if individual_logo is None:

                          failed_logos += 1

                          continue


                      individual_logo.save(

                          individual_logo_path,

                          "PNG"

                      )


                      downloaded_logos += 1


                      time.sleep(

                          0.25

                      )


                  loaded_teams.append(

                      (

                          team,

                          individual_logo

                      )

                  )


              total_teams += len(

                  loaded_teams

              )


              print()

              print(

                  f"Creating matchup logos for "

                  f"{len(loaded_teams)} teams"

              )


              for away_team, away_logo in loaded_teams:

                  away_folder = os.path.join(

                      OUTPUT_ROOT,

                      league_name,

                      away_team["folder"]

                  )


                  for home_team, home_logo in loaded_teams:

                      if (

                          away_team["folder"]

                          ==

                          home_team["folder"]

                      ):

                          continue


                      matchup_filename = (

                          f"{away_team['folder']}"

                          f"_vs_"

                          f"{home_team['folder']}"

                          f".png"

                      )


                      matchup_path = os.path.join(

                          away_folder,

                          matchup_filename

                      )


                      if os.path.exists(

                          matchup_path

                      ):

                          skipped_existing += 1

                          continue


                      matchup_logo = create_matchup_logo(

                          away_logo,

                          home_logo

                      )


                      matchup_logo.save(

                          matchup_path,

                          "PNG"

                      )


                      total_matchups += 1


                  print(

                      f"Completed matchup logos for: "

                      f"{away_team['name']}"

                  )


          print()

          print(

              "========================================"

          )

          print(

              "SPORTS LOGO BUILD COMPLETE"

          )

          print(

              "========================================"

          )


          print(

              f"Teams stored: "

              f"{total_teams}"

          )


          print(

              f"Individual logos downloaded: "

              f"{downloaded_logos}"

          )


          print(

              f"New matchup logos created: "

              f"{total_matchups}"

          )


          print(

              f"Existing matchup logos skipped: "

              f"{skipped_existing}"

          )


          print(

              f"Failed logos: "

              f"{failed_logos}"

          )

          PY

      - name: Commit and push sports logos
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add sports-logos/

          if git diff --cached --quiet; then
            echo "No new sports logos to commit"
            exit 0
          fi

          git commit -m "Build sports logo library"

          git push
