name: Run Channel Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run cleanup
        run: python cleanup.py

      - name: Upload cleaned file
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-channels
          path: channels_clean.txt
