name: Canada Channel List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-canada-channel-list:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete Canada channel master list
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          python3 - <<'PY'

          import os
          import re
          import requests
          from pathlib import Path


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          XTREAM_USERNAME = os.environ["XTREAM_USERNAME"]

          XTREAM_PASSWORD = os.environ["XTREAM_PASSWORD"]


          OUTPUT_FILE = Path(
              "config/canada_channels.txt"
          )


          session = requests.Session()


          def api_request(action):

              response = session.get(

                  XTREAM_URL,

                  params={

                      "username":
                          XTREAM_USERNAME,

                      "password":
                          XTREAM_PASSWORD,

                      "action":
                          action

                  },

                  timeout=120

              )

              response.raise_for_status()

              return response.json()


          print(
              "Loading provider categories..."
          )


          categories = api_request(
              "get_live_categories"
          )


          print(
              "Provider categories:",
              len(categories)
          )


          canada_categories = []


          for category in categories:

              category_id = str(
                  category.get(
                      "category_id",
                      ""
                  )
              ).strip()


              category_name = str(
                  category.get(
                      "category_name",
                      ""
                  )
              ).strip()


              if not category_id:

                  continue


              if not category_name:

                  continue


              normalized = re.sub(

                  r"[^a-z0-9]+",

                  " ",

                  category_name.lower()

              ).strip()


              tokens = set(
                  normalized.split()
              )


              is_canada = (

                  "ca" in tokens

                  or

                  "canada" in tokens

                  or

                  "canadian" in tokens

              )


              if is_canada:

                  canada_categories.append(

                      {

                          "category_id":
                              category_id,

                          "category_name":
                              category_name

                      }

                  )


          print()

          print(
              "Canada categories found:",
              len(canada_categories)
          )


          if not canada_categories:

              raise SystemExit(
                  "No CA/Canada categories found"
              )


          print()

          print(
              "Canada categories:"
          )


          for category in canada_categories:

              print(

                  f'{category["category_id"]} | '

                  f'{category["category_name"]}'

              )


          print()

          print(
              "Loading all provider live streams..."
          )


          streams = api_request(
              "get_live_streams"
          )


          print(
              "Provider live streams:",
              len(streams)
          )


          canada_category_ids = {

              category["category_id"]

              for category in canada_categories

          }


          grouped_channels = {

              category["category_id"]:
                  []

              for category in canada_categories

          }


          for stream in streams:

              category_id = str(

                  stream.get(

                      "category_id",

                      ""

                  )

              ).strip()


              if category_id not in canada_category_ids:

                  continue


              stream_id = str(

                  stream.get(

                      "stream_id",

                      ""

                  )

              ).strip()


              channel_name = str(

                  stream.get(

                      "name",

                      ""

                  )

              ).strip()


              if not stream_id:

                  continue


              if not channel_name:

                  continue


              grouped_channels[category_id].append(

                  {

                      "name":
                          channel_name,

                      "stream_id":
                          stream_id

                  }

              )


          total_channels = sum(

              len(channels)

              for channels

              in grouped_channels.values()

          )


          print()

          print(

              "Canada channels found:",

              total_channels

          )


          OUTPUT_FILE.parent.mkdir(

              parents=True,

              exist_ok=True

          )


          with OUTPUT_FILE.open(

              "w",

              encoding="utf-8"

          ) as file:


              file.write(

                  "# Complete provider Canada channel master list\n"

              )

              file.write(

                  "# Generated automatically by the Canada Channel List workflow\n"

              )

              file.write(

                  "# Format: CHANNEL NAME | PROVIDER CHANNEL ID\n\n"

              )


              for category in canada_categories:


                  category_id = category["category_id"]

                  category_name = category["category_name"]


                  channels = grouped_channels.get(

                      category_id,

                      []

                  )


                  file.write(

                      f"[{category_name}]\n"

                  )


                  file.write(

                      f"# CATEGORY ID: {category_id}\n"

                  )


                  file.write(

                      f"# CHANNELS: {len(channels)}\n"

                  )


                  file.write(

                      "\n"

                  )


                  seen = set()


                  for channel in channels:


                      channel_key = (

                          channel["name"],

                          channel["stream_id"]

                      )


                      if channel_key in seen:

                          continue


                      seen.add(

                          channel_key

                      )


                      file.write(

                          f'{channel["name"]} | '

                          f'{channel["stream_id"]}\n'

                      )


                  file.write(

                      "\n"

                  )


          print()

          print(

              "Canada channel master written to:",

              OUTPUT_FILE

          )

          print(

              "Canada categories written:",

              len(canada_categories)

          )

          print(

              "Canada channels written:",

              total_channels

          )

          PY


      - name: Show generated Canada master
        run: |

          echo "============================================================"

          echo "GENERATED CANADA MASTER"

          echo "============================================================"

          wc -l config/canada_channels.txt

          echo ""

          cat config/canada_channels.txt


      - name: Commit and push Canada channel master
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add config/canada_channels.txt


          if git diff --cached --quiet; then

            echo "No changes to Canada channel master"

            exit 0

          fi


          git commit \
            -m "Update Canada channel master"


          git fetch origin main


          for attempt in 1 2 3 4 5; do

            echo "Push attempt $attempt"


            if git push origin HEAD:main; then

              echo "Push succeeded"

              exit 0

            fi


            echo "Push failed, rebasing..."


            git fetch origin main

            git rebase origin/main


            sleep 5

          done


          echo "Push failed after retries"

          exit 1
