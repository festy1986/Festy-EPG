name: TEST Canada Channel List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test-canada-channel-list:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found"

      - name: Get ALL provider groups and channels
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          mkdir -p config
          mkdir -p test

          BASE_URL="${XTREAM_URL%/}"

          echo "Getting ALL provider live categories..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_categories" \
            "$BASE_URL/player_api.php" \
            -o test/all_categories.json

          test -s test/all_categories.json

          echo "Getting ALL provider live channels..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_streams" \
            "$BASE_URL/player_api.php" \
            -o test/all_live_streams.json

          test -s test/all_live_streams.json

          echo "Building COMPLETE CA / CANADA channel list..."

          python3 - <<'PY'

          import json
          import re

          with open(
              "test/all_categories.json",
              "r",
              encoding="utf-8"
          ) as file:

              categories = json.load(file)

          with open(
              "test/all_live_streams.json",
              "r",
              encoding="utf-8"
          ) as file:

              streams = json.load(file)

          canada_categories = {}

          for category in categories:

              category_id = str(
                  category.get(
                      "category_id",
                      ""
                  )
              ).strip()

              category_name = str(
                  category.get(
                      "category_name",
                      ""
                  )
              ).strip()

              if not category_id or not category_name:

                  continue

              normalized_name = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  category_name.lower()
              ).strip()

              words = set(
                  normalized_name.split()
              )

              is_canada_category = (

                  "canada" in words

                  or "ca" in words

                  or normalized_name.startswith("ca ")

                  or normalized_name.startswith("ca-")

                  or normalized_name.startswith("ca:")

                  or normalized_name.startswith("ca/")

                  or normalized_name.startswith("ca|")

                  or normalized_name.endswith(" ca")

                  or normalized_name.endswith(" canada")

                  or " canada " in f" {normalized_name} "

                  or " ca " in f" {normalized_name} "

              )

              if is_canada_category:

                  canada_categories[
                      category_id
                  ] = category_name

          grouped_channels = {}

          for category_id, category_name in canada_categories.items():

              grouped_channels[
                  category_id
              ] = {

                  "category_name":
                      category_name,

                  "channels":
                      []

              }

          for stream in streams:

              category_id = str(
                  stream.get(
                      "category_id",
                      ""
                  )
              ).strip()

              if category_id not in canada_categories:

                  continue

              channel_name = str(
                  stream.get(
                      "name",
                      ""
                  )
              ).strip()

              stream_id = str(
                  stream.get(
                      "stream_id",
                      ""
                  )
              ).strip()

              epg_channel_id = str(
                  stream.get(
                      "epg_channel_id",
                      ""
                  )
              ).strip()

              if not channel_name:

                  continue

              grouped_channels[
                  category_id
              ][
                  "channels"
              ].append(

                  {

                      "category_id":
                          category_id,

                      "category_name":
                          canada_categories[
                              category_id
                          ],

                      "name":
                          channel_name,

                      "stream_id":
                          stream_id,

                      "epg_channel_id":
                          epg_channel_id

                  }

              )

          with open(
              "config/canada_channels.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "# COMPLETE CANADA / CA PROVIDER CHANNEL EXPORT\n"
              )

              file.write(
                  "# FORMAT: STREAM ID | CATEGORY ID | EPG CHANNEL ID | CHANNEL NAME\n"
              )

              file.write(
                  "# EVERY PROVIDER GROUP MATCHING CA OR CANADA\n"
              )

              file.write(
                  "# THIS FILE IS OVERWRITTEN ON EVERY RUN\n"
              )

              file.write(
                  "\n"
              )

              for category_id in sorted(

                  grouped_channels,

                  key=lambda value:

                      grouped_channels[
                          value
                      ][
                          "category_name"
                      ].lower()

              ):

                  category_name = grouped_channels[
                      category_id
                  ][
                      "category_name"
                  ]

                  channels = grouped_channels[
                      category_id
                  ][
                      "channels"
                  ]

                  file.write(
                      category_id
                      + " | "
                      + category_id
                      + " |  | ###### "
                      + category_name
                      + " ######\n"
                  )

                  for channel in channels:

                      file.write(

                          channel[
                              "stream_id"
                          ]

                          + " | "

                          + channel[
                              "category_id"
                          ]

                          + " | "

                          + channel[
                              "epg_channel_id"
                          ]

                          + " | "

                          + channel[
                              "name"
                          ]

                          + "\n"

                      )

                  file.write(
                      "\n"
                  )

          total_groups = len(
              grouped_channels
          )

          total_channels = sum(

              len(
                  group[
                      "channels"
                  ]
              )

              for group in
              grouped_channels.values()

          )

          print()

          print(
              "============================================================"
          )

          print(
              "COMPLETE CANADA / CA CHANNEL EXPORT"
          )

          print(
              "============================================================"
          )

          print(
              "CA / Canada groups found:",
              total_groups
          )

          print(
              "Channels found in CA / Canada groups:",
              total_channels
          )

          print()

          for category_id in sorted(

              grouped_channels,

              key=lambda value:

                  grouped_channels[
                      value
                  ][
                      "category_name"
                  ].lower()

          ):

              category_name = grouped_channels[
                  category_id
              ][
                  "category_name"
              ]

              channel_count = len(

                  grouped_channels[
                      category_id
                  ][
                      "channels"
                  ]

              )

              print(

                  category_name,

                  "| CATEGORY ID:",

                  category_id,

                  "| CHANNELS:",

                  channel_count

              )

          print()

          print(
              "Output:",
              "config/canada_channels.txt"
          )

          PY

          echo
          echo "Canada channel export complete"

          echo
          echo "Generated file:"
          ls -lh config/canada_channels.txt

          echo
          echo "Preview:"
          cat config/canada_channels.txt

      - name: Commit TEST Canada channel list
        run: |

          git config --global user.name "github-actions"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/canada_channels.txt

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Update complete Canada channel list"

            git pull \
              --rebase \
              origin main

            git push \
              origin HEAD:main

          fi
