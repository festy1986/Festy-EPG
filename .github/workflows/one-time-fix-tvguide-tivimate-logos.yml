name: One-Time Fix TVGuide TiviMate Logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tvguide-logos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image converters
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp

      - name: Convert SVG and WEBP logos to PNG
        run: |
          rsvg-convert "logos/Great_American_Family.svg" -o "logos/Great American Family.png"
          rsvg-convert "logos/UPtv_2018_logo.svg" -o "logos/UPTV.png"
          rsvg-convert "logos/HBO_Hits_2025.svg" -o "logos/HBO Hits.png"
          rsvg-convert "logos/HBO_Drama_2025.svg" -o "logos/HBO Drama.png"
          rsvg-convert "logos/Cinemax_Hits_2025.svg" -o "logos/Cinemax Hits.png"
          rsvg-convert "logos/Cinemax_Classics_2025.svg" -o "logos/Cinemax Classics.png"
          rsvg-convert "logos/HBO_Movies_2025.svg" -o "logos/HBO Movies.png"
          dwebp "logos/Starz_Encore_Suspense_2022.webp" -o "logos/STARZ Encore Suspense.png"

      - name: Apply TVGuide TiviMate logo mappings
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/tvguidetivimateguide.xml'
          const base = 'https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/'

          const enc = name => base + encodeURIComponent(name).replace(/'/g, '%27')

          const logos = {
            'NESN': enc('New England Sports Network.png'),
            'NESN PLUS': enc('New England Sports Network Plus HD.png'),
            'DISCOVERY SCIENCE': enc('Science HD.png'),
            'NAT GEO WILD': enc('National Geographic Wild.png'),
            'SMITHSONIAN CHANNEL': enc('smithsonian channel extra.png'),
            'LMN': enc('lifetime movie network.png'),
            'POP': enc('Pop Network HD.png'),
            'VICE': enc('vice1.png'),
            'GREAT AMERICAN FAMILY': enc('Great American Family.png'),
            'CRIME AND INVESTIGATION': enc('Crime & Investigation Network HD.png'),
            'STARZ ENCORE SUSPENSE': enc('STARZ Encore Suspense.png'),
            'NECN': enc('New England Cable News.png'),
            'ESPN2': enc('ESPN2.png'),
            'FS1': enc('FOX Sports 1 HD.png'),
            'FS2': enc('FOX Sports 2.png'),
            'TRUTV': enc('truTV.png'),
            'A&E': enc('A&E.png'),
            'FX MOVIE CHANNEL': enc('FX Movie HD.png'),
            'SyFy': enc('Syfy HD.png'),
            'MAGNOLIA NETWORK': enc('MAGNOLIA Network HD.png'),
            'DESTINATION AMERICA': enc('Destination America.png'),
            'FOX NEWS CHANNEL': enc('Fox News.png'),
            'E!': enc('E!.png'),
            'MTV2': enc('MTV2 HD.png'),
            'HALLMARK DRAMA': enc('Hallmark Family.png'),
            'UPTV': enc('UPTV.png'),
            'AXS TV': enc('AXS TV.png'),
            'HBO HITS': enc('HBO Hits.png'),
            'HBO DRAMA': enc('HBO Drama.png'),
            'CINEMAX HITS': enc('Cinemax Hits.png'),
            'CINEMAX CLASSICS': enc('Cinemax Classics.png'),
            'SHOXBET': enc('showtime bet.png'),
            'STARZ KIDS & FAMILY': enc('STARZ Kids & Family.png'),
            'NBC SPORTS BOSTON': enc('NBC Sports Boston.png'),
            'NFL NETWORK': enc('NFL Network.png'),
            'NHL NETWORK': enc('NHL Network HD.png'),
            'MLB NETWORK': enc('MLB Network HD.png'),
            'NBA TV': enc('NBA TV HD.png'),
            'TV LAND': enc('TV Land.png'),
            'DISCOVERY CHANNEL': enc('discovery.png'),
            'CNN': enc('CNN HD.png'),
            'FREEFORM': enc('freeform.png'),
            'FX': enc('FX.png'),
            'FYI': enc('FYI HD.png'),
            'HBO': enc('HBO.png'),
            'HBO MOVIES': enc('HBO Movies.png'),
            'HISTORY': enc('History HD.png'),
            'MTV': enc('MTV.png'),
            'SHOWTIME SHOWCASE': enc('SHOWTIME SHOWCASE.png')
          }

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          let xml = fs.readFileSync(guidePath, 'utf8')
          let applied = 0

          xml = xml.replace(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/g, (full, attrs, body) => {
            const m = body.match(/<display-name[^>]*>([\s\S]*?)<\/display-name>/i)
            if (!m) return full

            const name = m[1]
              .replace(/<[^>]+>/g, '')
              .replace(/&amp;/g, '&')
              .trim()

            const logo = logos[name]
            if (!logo) return full

            const newBody = /<icon\b[^>]*\/>/i.test(body)
              ? body.replace(/<icon\b[^>]*\/>/i, `<icon src="${logo}"/>`)
              : body.replace(/(<display-name[^>]*>[\s\S]*?<\/display-name>)/i, `$1<icon src="${logo}"/>`)

            applied++
            console.log(`[logo] ${name} <= ${logo}`)
            return `<channel${attrs}>${newBody}</channel>`
          })

          fs.writeFileSync(guidePath, xml)
          console.log(`Applied ${applied} logos`)
          EOF

      - name: Recompress TiviMate guide
        run: |
          gzip -c guides/tvguidetivimateguide.xml > guides/tvguidetivimateguide.xml.gz

      - name: Commit one-time TVGuide logo fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/tvguidetivimateguide.xml guides/tvguidetivimateguide.xml.gz
          git add "logos/Great American Family.png"
          git add "logos/UPTV.png"
          git add "logos/HBO Hits.png"
          git add "logos/HBO Drama.png"
          git add "logos/Cinemax Hits.png"
          git add "logos/Cinemax Classics.png"
          git add "logos/HBO Movies.png"
          git add "logos/STARZ Encore Suspense.png"

          if git diff --cached --quiet; then
            echo "No logo changes to commit"
            exit 0
          fi

          git commit -m "One-time fix TVGuide TiviMate logos"
          git push
