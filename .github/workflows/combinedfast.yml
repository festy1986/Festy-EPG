name: Combined FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write

concurrency:
  group: combinedfast
  cancel-in-progress: false

jobs:
  build-combinedfast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting Combined FAST processing..."
          sleep 60

      - name: Download fresh Jessman FAST guide
        run: |
          mkdir -p combinedfast/source
          mkdir -p combinedfast/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o combinedfast/source/jessman.xml

          test -s combinedfast/source/jessman.xml

          echo "Fresh Jessman FAST guide downloaded"
          ls -lh combinedfast/source/jessman.xml

      - name: Download fresh IPTV-org guide
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-us.xml.gz \
            -o combinedfast/source/iptvorg.xml.gz

          test -s combinedfast/source/iptvorg.xml.gz

          echo "Fresh IPTV-org FAST guide downloaded"
          ls -lh combinedfast/source/iptvorg.xml.gz

      - name: Process and rebuild Combined FAST guide
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cat > /tmp/build_combinedfast.js <<'EOF'
          const fs =
            require(
              'fs'
            )

          const readline =
            require(
              'readline'
            )

          const zlib =
            require(
              'zlib'
            )

          const inputJessman =
            'combinedfast/source/jessman.xml'

          const inputIptv =
            'combinedfast/source/iptvorg.xml.gz'

          const outputPath =
            'combinedfast/work/combinedfast.xml'

          const now =
            new Date()

          const pastCutoff =
            new Date(
              now.getTime() -
              3 *
              24 *
              60 *
              60 *
              1000
            )

          const cutoff =
            new Date(
              now.getTime() +
              14 *
              24 *
              60 *
              60 *
              1000
            )

          /*
           * ============================================================
           * CHANNEL DEFINITIONS
           *
           * Jessman is matched by the actual Jessman channel ID.
           *
           * IPTV-org is matched by the actual IPTV-org channel ID.
           *
           * The canonicalChannel value is used only for cross-source
           * matching and reporting.
           * ============================================================
           */

          const jessmanChannels = {
            '139574': {
              canonicalChannel:
                'MGM Presents',

              displayName:
                'MGM Presents 2'
            },

            '145846': {
              canonicalChannel:
                'Scares by Shudder',

              displayName:
                'Scares by Shudder 2'
            },

            '116607': {
              canonicalChannel:
                'Screambox TV',

              displayName:
                'Screambox TV 2'
            },

            '138450': {
              canonicalChannel:
                'Universal Monsters',

              displayName:
                'Universal Monsters 2'
            },

            '157054': {
              canonicalChannel:
                'Miramax Movie Channel',

              displayName:
                'Miramax Movie Channel 2'
            }
          }

          const iptvOrgChannels = {
            'MGMPresents.us': {
              canonicalChannel:
                'MGM Presents',

              displayName:
                'MGM Presents'
            },

            'MGMPresentsAction.us': {
              canonicalChannel:
                'MGM Presents Action',

              displayName:
                'MGM Presents Action'
            },

            'MGMPresentsHorror.us': {
              canonicalChannel:
                'MGM Presents Horror',

              displayName:
                'MGM Presents Horror'
            },

            'ScaresbyShudder.us': {
              canonicalChannel:
                'Scares by Shudder',

              displayName:
                'Scares by Shudder'
            },

            'ScreamboxTV.us': {
              canonicalChannel:
                'Screambox TV',

              displayName:
                'Screambox TV'
            },

            'UniversalMonsters.pluto': {
              canonicalChannel:
                'Universal Monsters',

              displayName:
                'Universal Monsters'
            },

            'MiramaxMovieChannel.us': {
              canonicalChannel:
                'Miramax Movie Channel',

              displayName:
                'Miramax Movie Channel'
            }
          }

          /*
           * ============================================================
           * STORAGE
           *
           * Jessman and IPTV-org remain separate.
           *
           * Existing metadata is never overwritten by cross-reference
           * data from the other source.
           *
           * Cross-reference only fills missing fields.
           * ============================================================
           */

          const jessmanProgrammes =
            []

          const iptvOrgProgrammes =
            []

          const jessmanChannelsFound =
            new Map()

          const iptvOrgChannelsFound =
            new Map()

          /*
           * ============================================================
           * PER-CHANNEL TALLY
           * ============================================================
           */

          const jessmanChannelStats =
            new Map()

          const iptvOrgChannelStats =
            new Map()

          function createChannelStats(
            source,
            id,
            canonicalChannel,
            displayName
          ) {
            return {
              source,

              id,

              canonicalChannel,

              displayName,

              found:
                false,

              programmesScanned:
                0,

              programmesSkipped:
                0,

              programmesRetained:
                0,

              descriptionsChanged:
                0,

              actorsRemoved:
                0,

              creditsRemoved:
                0,

              episodeNumbersConverted:
                0,

              originalAirDatesUsed:
                0,

              fieldsFilledFromOtherSource:
                0,

              tvmazeFieldsUsed:
                0,

              tmdbFieldsUsed:
                0
            }
          }

          for (
            const [
              id,
              channel
            ]
            of
            Object.entries(
              jessmanChannels
            )
          ) {
            jessmanChannelStats.set(
              id,
              createChannelStats(
                'Jessman',
                id,
                channel.canonicalChannel,
                channel.displayName
              )
            )
          }

          for (
            const [
              id,
              channel
            ]
            of
            Object.entries(
              iptvOrgChannels
            )
          ) {
            iptvOrgChannelStats.set(
              id,
              createChannelStats(
                'IPTV-org',
                id,
                channel.canonicalChannel,
                channel.displayName
              )
            )
          }

          /*
           * ============================================================
           * COUNTERS
           * ============================================================
           */

          let jessmanProgrammesScanned =
            0

          let iptvOrgProgrammesScanned =
            0

          let jessmanProgrammesSkipped =
            0

          let iptvOrgProgrammesSkipped =
            0

          let jessmanDescriptionsChanged =
            0

          let iptvOrgDescriptionsChanged =
            0

          let jessmanActorsRemoved =
            0

          let iptvOrgActorsRemoved =
            0

          let jessmanCreditsRemoved =
            0

          let iptvOrgCreditsRemoved =
            0

          let jessmanEpisodeNumbersConverted =
            0

          let iptvOrgEpisodeNumbersConverted =
            0

          let jessmanOriginalAirDatesUsed =
            0

          let iptvOrgOriginalAirDatesUsed =
            0

          let jessmanFieldsFilledFromIptv =
            0

          let iptvFieldsFilledFromJessman =
            0

          let tvmazeMatches =
            0

          let tvmazeFieldsUsed =
            0

          let tmdbMatches =
            0

          let tmdbFieldsUsed =
            0

          let totalFieldsFilled =
            0

          /*
           * ============================================================
           * XML HELPERS
           * ============================================================
           */

          function decodeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&amp;/g,
                '&'
              )
              .replace(
                /&quot;/g,
                '"'
              )
              .replace(
                /&apos;/g,
                "'"
              )
              .replace(
                /&lt;/g,
                '<'
              )
              .replace(
                /&gt;/g,
                '>'
              )
          }

          function escapeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&/g,
                '&amp;'
              )
              .replace(
                /</g,
                '&lt;'
              )
              .replace(
                />/g,
                '&gt;'
              )
              .replace(
                /"/g,
                '&quot;'
              )
              .replace(
                /'/g,
                '&apos;'
              )
          }

          function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          /*
           * ============================================================
           * DATE AND EPISODE HELPERS
           * ============================================================
           */

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let value =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !value
            ) {
              value =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !value
            ) {
              value =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              value
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              getTag(
                block,
                'sub-title'
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              getTag(
                block,
                'desc'
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const original =
              parseOriginalAirDate(
                structured
              )

            if (
              original
            ) {
              return original
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          /*
           * ============================================================
           * FINAL DESCRIPTION CLEANUP
           * ============================================================
           */

          function cleanEmbeddedCredits(
            description
          ) {
            let result =
              cleanSpaces(
                description
              )

            const protectedDates =
              []

            result =
              result.replace(
                /\(\d{2}\/\d{2}\/\d{4}\)/g,
                match => {
                  const token =
                    '__AIRDATE_' +
                    protectedDates.length +
                    '__'

                  protectedDates.push(
                    match
                  )

                  return token
                }
              )

            result =
              result.replace(
                /\s*\([^()]{2,200}\)/g,
                ''
              )

            result =
              result.replace(
                /\s{2,}/g,
                ' '
              )

            for (
              let index = 0;
              index <
              protectedDates.length;
              index++
            ) {
              result =
                result.replace(
                  '__AIRDATE_' +
                  index +
                  '__',
                  protectedDates[index]
                )
            }

            return cleanSpaces(
              result
            )
          }

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''

            const cleanedDescription =
              cleanEmbeddedCredits(
                description
              )

            if (
              episodeTitle &&
              episodeNumber
            ) {
              result =
                episodeTitle +
                ' - ' +
                episodeNumber
            } else if (
              episodeTitle
            ) {
              result =
                episodeTitle
            } else if (
              episodeNumber
            ) {
              result =
                episodeNumber
            }

            if (
              cleanedDescription
            ) {
              result =
                result
                  ? result +
                    '. ' +
                    cleanedDescription
                  :
                    cleanedDescription
            }

            if (
              airDate
            ) {
              result =
                result
                  ? result +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'
            }

            return cleanEmbeddedCredits(
              cleanSpaces(
                result
              )
            )
          }

          /*
           * ============================================================
           * XML TAG HELPERS
           * ============================================================
           */

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          /*
           * ============================================================
           * CLEAN PROGRAMME
           * ============================================================
           */

          function cleanProgrammeBlock(
            block,
            source,
            channelId
          ) {
            const originalDescription =
              getTag(
                block,
                'desc'
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const airDate =
              extractAirDate(
                block
              )

            const description =
              buildDescription(
                episodeTitle,
                episodeNumber,
                originalDescription,
                airDate
              )

            const stats =
              source ===
              'jessman'
                ? jessmanChannelStats.get(
                    channelId
                  )
                : iptvOrgChannelStats.get(
                    channelId
                  )

            if (
              description !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }

              if (
                stats
              ) {
                stats.descriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }

              if (
                stats
              ) {
                stats.actorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }

              if (
                stats
              ) {
                stats.creditsRemoved++
              }
            }

            let output =
              block

            const title =
              cleanSpaces(
                getTag(
                  block,
                  'title'
                ).replace(
                  /\s+\(\d{4}\)\s*$/,
                  ''
                )
              )

            output =
              replaceTag(
                output,
                'title',
                title
              )

            output =
              replaceTag(
                output,
                'desc',
                description
              )

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            const icon =
              getAttribute(
                block.match(
                  /<icon\b[^>]*>/i
                )?.[0] ||
                '',
                'src'
              )

            return {
              block:
                output,

              title,

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon,

              source
            }
          }

          /*
           * ============================================================
           * STREAMING XML PARSER
           * ============================================================
           */

          async function parseXmlStream(
            stream,
            callback
          ) {
            const rl =
              readline.createInterface(
                {
                  input:
                    stream,

                  crlfDelay:
                    Infinity
                }
              )

            let insideChannel =
              false

            let channelBuffer =
              ''

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            for await (
              const line of
              rl
            ) {
              if (
                !insideChannel &&
                !insideProgramme &&
                line.includes(
                  '<channel '
                )
              ) {
                insideChannel =
                  true

                channelBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                insideChannel
              ) {
                channelBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                line.includes(
                  '<programme '
                )
              ) {
                insideProgramme =
                  true

                programmeBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }

                continue
              }

              if (
                insideProgramme
              ) {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }
              }
            }
          }

          /*
           * ============================================================
           * LOAD JESSMAN
           * ============================================================
           */

          async function loadJessman() {
            const jessmanIdToName =
              new Map()

            await parseXmlStream(
              fs.createReadStream(
                inputJessman
              ),

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const configured =
                    jessmanChannels[
                      id
                    ]

                  if (
                    !configured
                  ) {
                    return
                  }

                  const stats =
                    jessmanChannelStats.get(
                      id
                    )

                  if (
                    stats
                  ) {
                    stats.found =
                      true
                  }

                  jessmanIdToName.set(
                    id,
                    configured.canonicalChannel
                  )

                  let outputChannel =
                    block

                  outputChannel =
                    outputChannel.replace(
                      /(<display-name\b[^>]*>)[\s\S]*?(<\/display-name>)/i,
                      '$1' +
                      escapeXml(
                        configured.displayName
                      ) +
                      '$2'
                    )

                  jessmanChannelsFound.set(
                    configured.canonicalChannel,
                    {
                      id,

                      canonicalChannel:
                        configured.canonicalChannel,

                      displayName:
                        configured.displayName,

                      block:
                        outputChannel
                    }
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const canonicalChannel =
                  jessmanIdToName.get(
                    channel
                  )

                if (
                  !canonicalChannel
                ) {
                  return
                }

                jessmanProgrammesScanned++

                const stats =
                  jessmanChannelStats.get(
                    channel
                  )

                if (
                  stats
                ) {
                  stats.programmesScanned++
                }

                const start =
                  getAttribute(
                    block,
                    'start'
                  )

                const startDate =
                  parseXmltvDate(
                    start
                  )

                if (
                  !startDate ||
                  startDate <
                  pastCutoff ||
                  startDate >=
                  cutoff
                ) {
                  jessmanProgrammesSkipped++

                  if (
                    stats
                  ) {
                    stats.programmesSkipped++
                  }

                  return
                }

                const cleaned =
                  cleanProgrammeBlock(
                    block,
                    'jessman',
                    channel
                  )

                jessmanProgrammes.push(
                  {
                    source:
                      'jessman',

                    channel,

                    canonicalChannel,

                    start,

                    stop:
                      getAttribute(
                        block,
                        'stop'
                      ),

                    title:
                      cleaned.title,

                    episodeTitle:
                      cleaned.episodeTitle,

                    episodeNumber:
                      cleaned.episodeNumber,

                    airDate:
                      cleaned.airDate,

                    description:
                      cleaned.description,

                    icon:
                      cleaned.icon,

                    block:
                      cleaned.block
                  }
                )

                if (
                  stats
                ) {
                  stats.programmesRetained++
                }
              }
            )
          }

          /*
           * ============================================================
           * LOAD IPTV-ORG
           * ============================================================
           */

          async function loadIptvOrg() {
            const input =
              fs.createReadStream(
                inputIptv
              )

            const gunzip =
              zlib.createGunzip()

            input.pipe(
              gunzip
            )

            await parseXmlStream(
              gunzip,

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const configured =
                    iptvOrgChannels[
                      id
                    ]

                  if (
                    !configured
                  ) {
                    return
                  }

                  const stats =
                    iptvOrgChannelStats.get(
                      id
                    )

                  if (
                    stats
                  ) {
                    stats.found =
                      true
                  }

                  iptvOrgChannelsFound.set(
                    id,
                    {
                      id,

                      canonicalChannel:
                        configured.canonicalChannel,

                      displayName:
                        configured.displayName,

                      block
                    }
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const configured =
                  iptvOrgChannels[
                    channel
                  ]

                if (
                  !configured
                ) {
                  return
                }

                iptvOrgProgrammesScanned++

                const stats =
                  iptvOrgChannelStats.get(
                    channel
                  )

                if (
                  stats
                ) {
                  stats.programmesScanned++
                }

                const canonicalChannel =
                  configured.canonicalChannel

                const start =
                  getAttribute(
                    block,
                    'start'
                  )

                const startDate =
                  parseXmltvDate(
                    start
                  )

                if (
                  !startDate ||
                  startDate <
                  pastCutoff ||
                  startDate >=
                  cutoff
                ) {
                  iptvOrgProgrammesSkipped++

                  if (
                    stats
                  ) {
                    stats.programmesSkipped++
                  }

                  return
                }

                const cleaned =
                  cleanProgrammeBlock(
                    block,
                    'iptvorg',
                    channel
                  )

                iptvOrgProgrammes.push(
                  {
                    source:
                      'iptvorg',

                    channel,

                    canonicalChannel,

                    start,

                    stop:
                      getAttribute(
                        block,
                        'stop'
                      ),

                    title:
                      cleaned.title,

                    episodeTitle:
                      cleaned.episodeTitle,

                    episodeNumber:
                      cleaned.episodeNumber,

                    airDate:
                      cleaned.airDate,

                    description:
                      cleaned.description,

                    icon:
                      cleaned.icon,

                    block:
                      cleaned.block
                  }
                )

                if (
                  stats
                ) {
                  stats.programmesRetained++
                }
              }
            )
          }

          /*
           * ============================================================
           * MATCHING
           * ============================================================
           */

          function programmeMatchKey(
            programme
          ) {
            return [
              programme.canonicalChannel
                .replace(
                  /\s+2$/i,
                  ''
                ),

              programme.start,

              normalizeTitle(
                programme.title
              )
            ].join(
              '|'
            )
          }

          function extractDescriptionBody(
            description
          ) {
            let value =
              cleanSpaces(
                description
              )

            value =
              value.replace(
                /^.+?\s+-\s+S\d+E\d+\.\s*/i,
                ''
              )

            value =
              value.replace(
                /^S\d+E\d+\.\s*/i,
                ''
              )

            value =
              value.replace(
                /\s+\(\d{2}\/\d{2}\/\d{4}\)\s*$/,
                ''
              )

            return cleanSpaces(
              value
            )
          }

          function applyDescription(
            programme
          ) {
            const description =
              buildDescription(
                programme.episodeTitle,
                programme.episodeNumber,
                extractDescriptionBody(
                  programme.description
                ),
                programme.airDate
              )

            programme.description =
              description

            programme.block =
              replaceTag(
                programme.block,
                'desc',
                description
              )
          }

          function fillMissingFromSource(
            target,
            source
          ) {
            const fields =
              [
                'episodeTitle',
                'episodeNumber',
                'description',
                'airDate',
                'icon'
              ]

            let filled =
              false

            for (
              const field of
              fields
            ) {
              if (
                target[field]
              ) {
                continue
              }

              if (
                !source[field]
              ) {
                continue
              }

              target[field] =
                source[field]

              filled =
                true

              totalFieldsFilled++

              if (
                target.source ===
                'jessman'
              ) {
                jessmanFieldsFilledFromIptv++

                const stats =
                  jessmanChannelStats.get(
                    target.channel
                  )

                if (
                  stats
                ) {
                  stats.fieldsFilledFromOtherSource++
                }
              } else {
                iptvFieldsFilledFromJessman++

                const stats =
                  iptvOrgChannelStats.get(
                    target.channel
                  )

                if (
                  stats
                ) {
                  stats.fieldsFilledFromOtherSource++
                }
              }
            }

            return filled
          }

          function crossReferenceSources() {
            const iptvIndex =
              new Map()

            for (
              const programme of
              iptvOrgProgrammes
            ) {
              const key =
                programmeMatchKey(
                  programme
                )

              if (
                !iptvIndex.has(
                  key
                )
              ) {
                iptvIndex.set(
                  key,
                  []
                )
              }

              iptvIndex.get(
                key
              ).push(
                programme
              )
            }

            const jessmanIndex =
              new Map()

            for (
              const programme of
              jessmanProgrammes
            ) {
              const key =
                programmeMatchKey(
                  programme
                )

              if (
                !jessmanIndex.has(
                  key
                )
              ) {
                jessmanIndex.set(
                  key,
                  []
                )
              }

              jessmanIndex.get(
                key
              ).push(
                programme
              )
            }

            for (
              const jessman of
              jessmanProgrammes
            ) {
              const matches =
                iptvIndex.get(
                  programmeMatchKey(
                    jessman
                  )
                ) ||
                []

              for (
                const iptv of
                matches
              ) {
                if (
                  fillMissingFromSource(
                    jessman,
                    iptv
                  )
                ) {
                  applyDescription(
                    jessman
                  )

                  break
                }
              }
            }

            for (
              const iptv of
              iptvOrgProgrammes
            ) {
              const matches =
                jessmanIndex.get(
                  programmeMatchKey(
                    iptv
                  )
                ) ||
                []

              for (
                const jessman of
                matches
              ) {
                if (
                  fillMissingFromSource(
                    iptv,
                    jessman
                  )
                ) {
                  applyDescription(
                    iptv
                  )

                  break
                }
              }
            }
          }

          /*
           * ============================================================
           * ENRICHMENT
           * ============================================================
           */

          const tvmazeCache =
            new Map()

          const tmdbCache =
            new Map()

          function sleep(
            milliseconds
          ) {
            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  milliseconds
                )
            )
          }

          async function fetchJson(
            url,
            headers = {}
          ) {
            try {
              const response =
                await fetch(
                  url,
                  {
                    headers
                  }
                )

              if (
                !response.ok
              ) {
                return null
              }

              return await response.json()
            } catch (
              error
            ) {
              return null
            }
          }

          async function getTvmazeShow(
            title
          ) {
            const key =
              normalizeTitle(
                title
              )

            if (
              tvmazeCache.has(
                key
              )
            ) {
              return tvmazeCache.get(
                key
              )
            }

            const data =
              await fetchJson(
                'https://api.tvmaze.com/search/shows?q=' +
                encodeURIComponent(
                  title
                )
              )

            await sleep(
              250
            )

            const result =
              data &&
              data.length
                ? data[0].show
                : null

            tvmazeCache.set(
              key,
              result
            )

            return result
          }

          async function enrichFromTvmaze(
            programme
          ) {
            if (
              !programme.episodeNumber
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const show =
              await getTvmazeShow(
                programme.title
              )

            if (
              !show
            ) {
              return
            }

            const episodeData =
              await fetchJson(
                'https://api.tvmaze.com/shows/' +
                show.id +
                '/episodebynumber?season=' +
                Number(
                  match[1]
                ) +
                '&number=' +
                Number(
                  match[2]
                )
              )

            await sleep(
              250
            )

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            if (
              !programme.episodeTitle &&
              episodeData.name
            ) {
              programme.episodeTitle =
                cleanSpaces(
                  episodeData.name
                )

              tvmazeFieldsUsed++
              totalFieldsFilled++

              const stats =
                programme.source ===
                'jessman'
                  ? jessmanChannelStats.get(
                      programme.channel
                    )
                  : iptvOrgChannelStats.get(
                      programme.channel
                    )

              if (
                stats
              ) {
                stats.tvmazeFieldsUsed++
              }

              used =
                true
            }

            if (
              !programme.description &&
              episodeData.summary
            ) {
              programme.description =
                cleanSpaces(
                  episodeData.summary
                    .replace(
                      /<[^>]+>/g,
                      ''
                    )
                )

              tvmazeFieldsUsed++
              totalFieldsFilled++

              const stats =
                programme.source ===
                'jessman'
                  ? jessmanChannelStats.get(
                      programme.channel
                    )
                  : iptvOrgChannelStats.get(
                      programme.channel
                    )

              if (
                stats
              ) {
                stats.tvmazeFieldsUsed++
              }

              used =
                true
            }

            if (
              !programme.airDate &&
              episodeData.airdate
            ) {
              programme.airDate =
                episodeData.airdate
                  .split(
                    '-'
                  )
                  .reverse()
                  .join(
                    '/'
                  )

              tvmazeFieldsUsed++
              totalFieldsFilled++

              const stats =
                programme.source ===
                'jessman'
                  ? jessmanChannelStats.get(
                      programme.channel
                    )
                  : iptvOrgChannelStats.get(
                      programme.channel
                    )

              if (
                stats
              ) {
                stats.tvmazeFieldsUsed++
              }

              used =
                true
            }

            if (
              !programme.icon &&
              episodeData.image
            ) {
              programme.icon =
                episodeData.image.original ||
                episodeData.image.medium ||
                ''

              if (
                programme.icon
              ) {
                tvmazeFieldsUsed++
                totalFieldsFilled++

                const stats =
                  programme.source ===
                  'jessman'
                    ? jessmanChannelStats.get(
                        programme.channel
                      )
                    : iptvOrgChannelStats.get(
                        programme.channel
                      )

                if (
                  stats
                ) {
                  stats.tvmazeFieldsUsed++
                }

                used =
                  true
              }
            }

            if (
              used
            ) {
              tvmazeMatches++

              applyDescription(
                programme
              )
            }
          }

          async function getTmdbShow(
            title
          ) {
            const token =
              process.env.TMDB_API_TOKEN

            if (
              !token
            ) {
              return null
            }

            const key =
              normalizeTitle(
                title
              )

            if (
              tmdbCache.has(
                key
              )
            ) {
              return tmdbCache.get(
                key
              )
            }

            const data =
              await fetchJson(
                'https://api.themoviedb.org/3/search/tv?query=' +
                encodeURIComponent(
                  title
                ),

                {
                  Authorization:
                    'Bearer ' +
                    token,

                  accept:
                    'application/json'
                }
              )

            await sleep(
              250
            )

            const result =
              data &&
              data.results &&
              data.results.length
                ? data.results[0]
                : null

            tmdbCache.set(
              key,
              result
            )

            return result
          }

          async function enrichFromTmdb(
            programme
          ) {
            const show =
              await getTmdbShow(
                programme.title
              )

            if (
              !show
            ) {
              return
            }

            let used =
              false

            if (
              !programme.icon &&
              show.poster_path
            ) {
              programme.icon =
                'https://image.tmdb.org/t/p/original' +
                show.poster_path

              tmdbFieldsUsed++
              totalFieldsFilled++

              const stats =
                programme.source ===
                'jessman'
                  ? jessmanChannelStats.get(
                      programme.channel
                    )
                  : iptvOrgChannelStats.get(
                      programme.channel
                    )

              if (
                stats
              ) {
                stats.tmdbFieldsUsed++
              }

              used =
                true
            }

            if (
              !programme.description &&
              show.overview
            ) {
              programme.description =
                cleanSpaces(
                  show.overview
                )

              tmdbFieldsUsed++
              totalFieldsFilled++

              const stats =
                programme.source ===
                'jessman'
                  ? jessmanChannelStats.get(
                      programme.channel
                    )
                  : iptvOrgChannelStats.get(
                      programme.channel
                    )

              if (
                stats
              ) {
                stats.tmdbFieldsUsed++
              }

              used =
                true
            }

            if (
              used
            ) {
              tmdbMatches++

              applyDescription(
                programme
              )
            }
          }

          async function enrichAll() {
            const allProgrammes =
              [
                ...jessmanProgrammes,
                ...iptvOrgProgrammes
              ]

            for (
              const programme of
              allProgrammes
            ) {
              await enrichFromTvmaze(
                programme
              )

              if (
                !programme.description ||
                !programme.icon
              ) {
                await enrichFromTmdb(
                  programme
                )
              }
            }
          }

          /*
           * ============================================================
           * FINAL OUTPUT
           * ============================================================
           */

          function buildChannelBlock(
            channel
          ) {
            return channel.block
          }

          function buildProgrammeBlock(
            programme
          ) {
            let finalDescription =
              buildDescription(
                programme.episodeTitle,
                programme.episodeNumber,
                extractDescriptionBody(
                  programme.description
                ),
                programme.airDate
              )

            finalDescription =
              cleanEmbeddedCredits(
                finalDescription
              )

            programme.description =
              finalDescription

            let block =
              programme.block

            block =
              replaceTag(
                block,
                'title',
                programme.title
              )

            block =
              replaceTag(
                block,
                'desc',
                finalDescription
              )

            if (
              programme.icon
            ) {
              const iconRegex =
                /<icon\b[^>]*>/i

              if (
                iconRegex.test(
                  block
                )
              ) {
                block =
                  block.replace(
                    iconRegex,
                    '<icon src="' +
                    escapeXml(
                      programme.icon
                    ) +
                    '">'
                  )
              }
            }

            return block
          }

          async function writeOutput() {
            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding:
                    'utf8'
                }
              )

            function write(
              value
            ) {
              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  if (
                    output.write(
                      value
                    )
                  ) {
                    resolve()
                  } else {
                    output.once(
                      'drain',
                      resolve
                    )

                    output.once(
                      'error',
                      reject
                    )
                  }
                }
              )
            }

            await write(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
            )

            await write(
              '<tv generator-info-name="Combined FAST">\n'
            )

            for (
              const channel of
              jessmanChannelsFound.values()
            ) {
              await write(
                buildChannelBlock(
                  channel
                )
              )
            }

            for (
              const channel of
              iptvOrgChannelsFound.values()
            ) {
              await write(
                buildChannelBlock(
                  channel
                )
              )
            }

            const allProgrammes =
              [
                ...jessmanProgrammes,
                ...iptvOrgProgrammes
              ]

            allProgrammes.sort(
              (
                a,
                b
              ) =>
                parseXmltvDate(
                  a.start
                ) -
                parseXmltvDate(
                  b.start
                )
            )

            for (
              const programme of
              allProgrammes
            ) {
              await write(
                buildProgrammeBlock(
                  programme
                )
              )
            }

            await write(
              '</tv>\n'
            )

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.end(
                  resolve
                )
              }
            )
          }

