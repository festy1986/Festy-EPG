          async function loadIptvOrg() {
            console.log(
              '========================================'
            )

            console.log(
              'LOADING COMPLETE IPTV-ORG GUIDE'
            )

            console.log(
              '========================================'
            )

            const input =
              fs.createReadStream(
                iptvOrgPath
              )

            const gunzip =
              zlib.createGunzip()

            input.pipe(
              gunzip
            )

            await parseXmlStream(
              gunzip,

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  if (
                    !iptvOrgChannels[id]
                  ) {
                    return
                  }

                  const channel =
                    iptvOrgChannels[id]

                  iptvOrgChannelsFound.set(
                    id,
                    {
                      id,

                      canonicalChannel:
                        channel.displayName,

                      displayName:
                        channel.displayName,

                      block
                    }
                  )

                  console.log(
                    'IPTV-org channel found: ' +
                    id +
                    ' -> ' +
                    channel.displayName
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                if (
                  !iptvOrgChannels[channel]
                ) {
                  return
                }

                iptvOrgProgrammesScanned++

                const canonicalChannel =
                  iptvOrgChannels[
                    channel
                  ].displayName

                const start =
                  getAttribute(
                    block,
                    'start'
                  )

                const startDate =
                  parseXmltvDate(
                    start
                  )

                if (
                  !startDate ||
                  startDate < lowerCutoff ||
                  startDate >= upperCutoff
                ) {
                  iptvOrgProgrammesSkipped++

                  return
                }

                const cleaned =
                  cleanProgrammeBlock(
                    block,
                    'iptvorg'
                  )

                iptvOrgProgrammesKept++

                iptvOrgProgrammes.push(
                  {
                    source:
                      'iptvorg',

                    channel,

                    canonicalChannel,

                    start,

                    stop:
                      getAttribute(
                        block,
                        'stop'
                      ),

                    title:
                      cleaned.title,

                    episodeTitle:
                      cleaned.episodeTitle,

                    episodeNumber:
                      cleaned.episodeNumber,

                    airDate:
                      cleaned.airDate,

                    description:
                      cleaned.description,

                    icon:
                      cleaned.icon,

                    block:
                      cleaned.block
                  }
                )
              }
            )

            console.log(
              'IPTV-org programmes retained: ' +
              iptvOrgProgrammes.length
            )
          }

          /*
           * ============================================================
           * CROSS-SOURCE MISSING-FIELD LOOKUP
           * ============================================================
           */

          function fillMissingFromSource(
            target,
            source
          ) {
            let filled =
              0

            const fields =
              [
                'episodeTitle',
                'episodeNumber',
                'description',
                'airDate',
                'icon'
              ]

            for (
              const field of
              fields
            ) {
              if (
                target[field]
              ) {
                continue
              }

              if (
                !source[field]
              ) {
                continue
              }

              target[field] =
                source[field]

              filled++

              totalFieldsFilled++

              if (
                target.source ===
                'jessman'
              ) {
                jessmanFieldsFilledFromIptv++
              } else {
                iptvFieldsFilledFromJessman++
              }
            }

            if (
              filled
            ) {
              target.block =
                replaceTag(
                  target.block,
                  'desc',
                  buildDescription(
                    target.episodeTitle,
                    target.episodeNumber,
                    extractDescriptionBody(
                      target.description
                    ),
                    target.airDate
                  )
                )
            }

            return filled
          }

          function extractDescriptionBody(
            description
          ) {
            let value =
              cleanSpaces(
                description
              )

            value =
              value.replace(
                /^.+?\s+-\s+S\d+E\d+\.\s*/i,
                ''
              )

            value =
              value.replace(
                /^S\d+E\d+\.\s*/i,
                ''
              )

            value =
              value.replace(
                /\s+\(\d{2}\/\d{2}\/\d{4}\)\s*$/,
                ''
              )

            return cleanSpaces(
              value
            )
          }

          function applyDescription(
            programme
          ) {
            const description =
              buildDescription(
                programme.episodeTitle,
                programme.episodeNumber,
                extractDescriptionBody(
                  programme.description
                ),
                programme.airDate
              )

            programme.description =
              description

            programme.block =
              replaceTag(
                programme.block,
                'desc',
                description
              )
          }

          function crossReferenceSources() {
            console.log(
              '========================================'
            )

            console.log(
              'CROSS-REFERENCING MISSING FIELDS'
            )

            console.log(
              '========================================'
            )

            const iptvIndex =
              new Map()

            for (
              const programme of
              iptvOrgProgrammes
            ) {
              const key =
                programmeMatchKey(
                  programme
                )

              if (
                !iptvIndex.has(
                  key
                )
              ) {
                iptvIndex.set(
                  key,
                  []
                )
              }

              iptvIndex.get(
                key
              ).push(
                programme
              )
            }

            const jessmanIndex =
              new Map()

            for (
              const programme of
              jessmanProgrammes
            ) {
              const key =
                programmeMatchKey(
                  programme
                )

              if (
                !jessmanIndex.has(
                  key
                )
              ) {
                jessmanIndex.set(
                  key,
                  []
                )
              }

              jessmanIndex.get(
                key
              ).push(
                programme
              )
            }

            for (
              const jessman of
              jessmanProgrammes
            ) {
              const key =
                programmeMatchKey(
                  jessman
                )

              const matches =
                iptvIndex.get(
                  key
                ) ||
                []

              for (
                const iptv of
                matches
              ) {
                if (
                  fillMissingFromSource(
                    jessman,
                    iptv
                  )
                ) {
                  applyDescription(
                    jessman
                  )

                  break
                }
              }
            }

            for (
              const iptv of
              iptvOrgProgrammes
            ) {
              const key =
                programmeMatchKey(
                  iptv
                )

              const matches =
                jessmanIndex.get(
                  key
                ) ||
                []

              for (
                const jessman of
                matches
              ) {
                if (
                  fillMissingFromSource(
                    iptv,
                    jessman
                  )
                ) {
                  applyDescription(
                    iptv
                  )

                  break
                }
              }
            }

            console.log(
              'Jessman fields filled from IPTV-org: ' +
              jessmanFieldsFilledFromIptv
            )

            console.log(
              'IPTV-org fields filled from Jessman: ' +
              iptvFieldsFilledFromJessman
            )
          }

          /*
           * ============================================================
           * TVMAZE AND TMDB ENRICHMENT
           * ============================================================
           */

          const tvmazeCache =
            new Map()

          const tmdbCache =
            new Map()

          function sleep(
            milliseconds
          ) {
            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  milliseconds
                )
            )
          }

          async function fetchJson(
            url,
            headers = {}
          ) {
            try {
              const response =
                await fetch(
                  url,
                  {
                    headers
                  }
                )

              if (
                !response.ok
              ) {
                return null
              }

              return await response.json()
            } catch (
              error
            ) {
              return null
            }
          }

          async function getTvmazeShow(
            title
          ) {
            const key =
              normalizeTitle(
                title
              )

            if (
              tvmazeCache.has(
                key
              )
            ) {
              return tvmazeCache.get(
                key
              )
            }

            const data =
              await fetchJson(
                'https://api.tvmaze.com/search/shows?q=' +
                encodeURIComponent(
                  title
                )
              )

            await sleep(
              250
            )

            const result =
              data &&
              data.length
                ? data[0].show
                : null

            tvmazeCache.set(
              key,
              result
            )

            return result
          }

          async function enrichFromTvmaze(
            programme
          ) {
            if (
              !programme.episodeNumber
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const show =
              await getTvmazeShow(
                programme.title
              )

            if (
              !show
            ) {
              return
            }

            const episodeData =
              await fetchJson(
                'https://api.tvmaze.com/shows/' +
                show.id +
                '/episodebynumber?season=' +
                Number(
                  match[1]
                ) +
                '&number=' +
                Number(
                  match[2]
                )
              )

            await sleep(
              250
            )

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            if (
              !programme.episodeTitle &&
              episodeData.name
            ) {
              programme.episodeTitle =
                cleanSpaces(
                  episodeData.name
                )

              tvmazeFieldsUsed++

              totalFieldsFilled++

              used =
                true
            }

            if (
              !programme.description &&
              episodeData.summary
            ) {
              programme.description =
                cleanSpaces(
                  episodeData.summary
                    .replace(
                      /<[^>]+>/g,
                      ''
                    )
                )

              tvmazeFieldsUsed++

              totalFieldsFilled++

              used =
                true
            }

            if (
              !programme.airDate &&
              episodeData.airdate
            ) {
              programme.airDate =
                episodeData.airdate
                  .split(
                    '-'
                  )
                  .reverse()
                  .join(
                    '/'
                  )

              tvmazeFieldsUsed++

              totalFieldsFilled++

              used =
                true
            }

            if (
              !programme.icon &&
              episodeData.image
            ) {
              programme.icon =
                episodeData.image.original ||
                episodeData.image.medium ||
                ''

              if (
                programme.icon
              ) {
                tvmazeFieldsUsed++

                totalFieldsFilled++

                used =
                  true
              }
            }

            if (
              used
            ) {
              tvmazeMatches++

              applyDescription(
                programme
              )
            }
          }
                    function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function normalizeChannelName(
            value
          ) {
            return cleanSpaces(
              value
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          /*
           * ============================================================
           * DATE AND EPISODE HELPERS
           * ============================================================
           */

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              episodeNumber
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const fromStructured =
              parseOriginalAirDate(
                structured
              )

            if (
              fromStructured
            ) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          /*
           * ============================================================
           * REMOVE ONLY UNWANTED PARENTHETICAL CAST/CREDIT TEXT
           *
           * The date appended by this workflow, for example:
           *
           *     (07/18/2026)
           *
           * is preserved.
           *
           * Parentheses containing actors, directors, hosts, narrators,
           * cast lists, or similar embedded source credits are removed
           * from the description.
           *
           * This is applied to BOTH Jessman and IPTV-org.
           * ============================================================
           */

          function cleanEmbeddedCredits(
            description
          ) {
            let result =
              cleanSpaces(
                description
              )
          
            const protectedDates =
              []
          
            result =
              result.replace(
                /\(\d{2}\/\d{2}\/\d{4}\)/g,
                match => {
                  const token =
                    '__AIRDATE_' +
                    protectedDates.length +
                    '__'
          
                  protectedDates.push(
                    match
                  )
          
                  return token
                }
              )
          
            result =
              result.replace(
                /\s*\([^()]{2,200}\)/g,
                ''
              )
          
            result =
              result.replace(
                /\s{2,}/g,
                ' '
              )
          
            for (
              let index = 0;
              index <
              protectedDates.length;
              index++
            ) {
              result =
                result.replace(
                  '__AIRDATE_' +
                  index +
                  '__',
                  protectedDates[index]
                )
            }
          
            return cleanSpaces(
              result
            )
          }

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''
          
            let cleanedDescription =
              cleanSpaces(
                description
              )
          
            cleanedDescription =
              cleanedDescription.replace(
                /\s*\([^()]*\)/g,
                ''
              )
          
            cleanedDescription =
              cleanSpaces(
                cleanedDescription
              )
          
            if (
              episodeTitle &&
              episodeNumber
            ) {
              result =
                episodeTitle +
                ' - ' +
                episodeNumber
            } else if (
              episodeTitle
            ) {
              result =
                episodeTitle
            } else if (
              episodeNumber
            ) {
              result =
                episodeNumber
            }
          
            if (
              cleanedDescription
            ) {
              result =
                result
                  ? result +
                    '. ' +
                    cleanedDescription
                  :
                    cleanedDescription
            }
          
            if (
              airDate
            ) {
              result =
                result
                  ? result +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'
            }
          
            return cleanSpaces(
              result
            )
          }

          /*
           * ============================================================
           * XML TAG MODIFICATION HELPERS
           * ============================================================
           */

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          /*
           * ============================================================
           * CLEAN ONE PROGRAMME
           * ============================================================
           */

          function cleanProgrammeBlock(
            block,
            source
          ) {
            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const airDate =
              extractAirDate(
                block
              )

            const description =
              buildDescription(
                episodeTitle,
                episodeNumber,
                originalDescription,
                airDate
              )

            if (
              description !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }
            }

            if (
              episodeNumber
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanEpisodeNumbersConverted++
              } else {
                iptvOrgEpisodeNumbersConverted++
              }
            }

            if (
              airDate
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanOriginalAirDatesUsed++
              } else {
                iptvOrgOriginalAirDatesUsed++
              }
            }

            let output =
              block

            const title =
              cleanSpaces(
                getTag(
                  block,
                  'title'
                )
                  .replace(
                    /\s+\(\d{4}\)\s*$/,
                    ''
                  )
              )

            output =
              replaceTag(
                output,
                'title',
                title
              )

            output =
              replaceTag(
                output,
                'desc',
                description
              )

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            const icon =
              getAttribute(
                block.match(
                  /<icon\b[^>]*>/i
                )?.[0] ||
                '',
                'src'
              )

            return {
              block:
                output,

              title,

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon,

              source
            }
          }

          /*
           * ============================================================
           * PROGRAMME MATCHING
           * ============================================================
           */

          function programmeMatchKey(
            programme
          ) {
            return [
              programme.canonicalChannel,
              programme.start,
              normalizeTitle(
                programme.title
              )
            ].join(
              '|'
            )
          }

          /*
           * ============================================================
           * STREAMING XML PARSER
           * ============================================================
           */

          async function parseXmlStream(
            stream,
            callback
          ) {
            const rl =
              readline.createInterface(
                {
                  input:
                    stream,

                  crlfDelay:
                    Infinity
                }
              )

            let insideChannel =
              false

            let channelBuffer =
              ''

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            for await (
              const line of rl
            ) {
              if (
                !insideChannel &&
                !insideProgramme &&
                line.includes(
                  '<channel '
                )
              ) {
                insideChannel =
                  true

                channelBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                insideChannel
              ) {
                channelBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                line.includes(
                  '<programme '
                )
              ) {
                insideProgramme =
                  true

                programmeBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }

                continue
              }

              if (
                insideProgramme
              ) {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }
              }
            }
          }

          /*
           * ============================================================
           * LOAD JESSMAN
           * ============================================================
           */

          async function loadJessman() {
            console.log(
              '========================================'
            )

            console.log(
              'LOADING COMPLETE JESSMAN GUIDE'
            )

            console.log(
              '========================================'
            )

            const jessmanIdToName =
              new Map()

            await parseXmlStream(
              fs.createReadStream(
                jessmanPath
              ),

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayNames =
                    getAllTags(
                      block,
                      'display-name'
                    )

                  const normalizedNames =
                    displayNames.map(
                      normalizeChannelName
                    )

                  let matchedName =
                    ''

                  for (
                    const targetName of
                    Object.keys(
                      jessmanChannels
                    )
                  ) {
                    if (
                      normalizedNames.includes(
                        normalizeChannelName(
                          targetName
                        )
                      )
                    ) {
                      matchedName =
                        targetName

                      break
                    }
                  }

                  if (
                    !matchedName
                  ) {
                    return
                  }

                  jessmanIdToName.set(
                    id,
                    matchedName
                  )

                  jessmanChannelsFound.set(
                    matchedName,
                    {
                      id,

                      canonicalChannel:
                        matchedName,

                      displayName:
                        jessmanChannels[
                          matchedName
                        ].displayName,

                      block
                    }
                  )

                  console.log(
                    'Jessman channel found: ' +
                    matchedName +
                    ' -> ' +
                    id
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const canonicalChannel =
                  jessmanIdToName.get(
                    channel
                  )

                if (
                  !canonicalChannel
                ) {
                  return
                }

                jessmanProgrammesScanned++

                const start =
                  getAttribute(
                    block,
                    'start'
                  )

                const startDate =
                  parseXmltvDate(
                    start
                  )

                if (
                  !startDate ||
                  startDate < pastCutoff ||
                  startDate >= cutoff
                ) {
                  jessmanProgrammesSkipped++

                  return
                }

                const cleaned =
                  cleanProgrammeBlock(
                    block,
                    'jessman'
                  )

                jessmanProgrammesKept++

                jessmanProgrammes.push(
                  {
                    source:
                      'jessman',

                    channel,

                    canonicalChannel,

                    start,

                    stop:
                      getAttribute(
                        block,
                        'stop'
                      ),

                    title:
                      cleaned.title,

                    episodeTitle:
                      cleaned.episodeTitle,

                    episodeNumber:
                      cleaned.episodeNumber,

                    airDate:
                      cleaned.airDate,

                    description:
                      cleaned.description,

                    icon:
                      cleaned.icon,

                    block:
                      cleaned.block
                  }
                )
              }
            )

            console.log(
              'Jessman programmes retained: ' +
              jessmanProgrammes.length
            )
          }
