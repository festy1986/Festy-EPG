name: Combined FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write

concurrency:
  group: combinedfast
  cancel-in-progress: false

jobs:
  build-combinedfast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting Combined FAST processing..."
          sleep 60

      - name: Download fresh Jessman FAST guide
        run: |
          mkdir -p combinedfast/source
          mkdir -p combinedfast/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o combinedfast/source/jessman.xml

          test -s combinedfast/source/jessman.xml

          echo "Fresh Jessman FAST guide downloaded"
          ls -lh combinedfast/source/jessman.xml

      - name: Download fresh IPTV-org guide
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-us.xml.gz \
            -o combinedfast/source/iptvorg.xml.gz

          test -s combinedfast/source/iptvorg.xml.gz

          echo "Fresh IPTV-org FAST guide downloaded"
          ls -lh combinedfast/source/iptvorg.xml.gz

      - name: Process and rebuild Combined FAST guide
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cat > /tmp/build_combinedfast.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const jessmanPath =
            'combinedfast/source/jessman.xml'

          const iptvOrgPath =
            'combinedfast/source/iptvorg.xml.gz'

          const outputPath =
            'combinedfast/work/combinedfast.xml'

          const now =
            new Date()

          /*
           * ============================================================
           * PROGRAMME RETENTION WINDOW
           *
           * Keep:
           * - the previous 12 hours
           * - all current programming
           * - the next 14 days
           *
           * Jessman and IPTV-org are each filtered independently.
           * ============================================================
           */

          const lowerCutoff =
            new Date(
              now.getTime() -
              12 *
              60 *
              60 *
              1000
            )

          const upperCutoff =
            new Date(
              now.getTime() +
              14 *
              24 *
              60 *
              60 *
              1000
            )

          /*
           * ============================================================
           * CHANNEL DEFINITIONS
           * ============================================================
           */

          const jessmanChannels = {
            'MGM Presents': {
              displayName:
                'MGM Presents 2'
            },

            'Scares by Shudder': {
              displayName:
                'Scares by Shudder 2'
            },

            'Screambox TV': {
              displayName:
                'Screambox TV 2'
            },

            'Universal Monsters': {
              displayName:
                'Universal Monsters 2'
            },

            'Miramax Movie Channel': {
              displayName:
                'Miramax Movie Channel 2'
            }
          }

          const iptvOrgChannels = {
            'MGMPresents.us': {
              displayName:
                'MGM Presents'
            },

            'MGMPresentsAction.us': {
              displayName:
                'MGM Presents Action'
            },

            'MGMPresentsHorror.us': {
              displayName:
                'MGM Presents Horror'
            },

            'ScaresbyShudder.us': {
              displayName:
                'Scares by Shudder'
            },

            'ScreamboxTV.us': {
              displayName:
                'Screambox TV'
            },

            'UniversalMonsters.pluto': {
              displayName:
                'Universal Monsters'
            },

            'MiramaxMovieChannel.us': {
              displayName:
                'Miramax Movie Channel'
            }
          }

          /*
           * ============================================================
           * SEPARATE SOURCE STORAGE
           *
           * These are deliberately separate.
           *
           * Jessman records never become IPTV-org records.
           * IPTV-org records never become Jessman records.
           * No cross-source deduplication occurs.
           * No source record is deleted because another source has a
           * matching programme.
           * ============================================================
           */

          const jessmanProgrammes =
            []

          const iptvOrgProgrammes =
            []

          const jessmanChannelsFound =
            new Map()

          const iptvOrgChannelsFound =
            new Map()

          /*
           * ============================================================
           * COUNTERS
           * ============================================================
           */

          let jessmanProgrammesScanned =
            0

          let iptvOrgProgrammesScanned =
            0

          let jessmanProgrammesKept =
            0

          let iptvOrgProgrammesKept =
            0

          let jessmanProgrammesSkipped =
            0

          let iptvOrgProgrammesSkipped =
            0

          let jessmanDescriptionsChanged =
            0

          let iptvOrgDescriptionsChanged =
            0

          let jessmanActorsRemoved =
            0

          let iptvOrgActorsRemoved =
            0

          let jessmanCreditsRemoved =
            0

          let iptvOrgCreditsRemoved =
            0

          let jessmanEpisodeNumbersConverted =
            0

          let iptvOrgEpisodeNumbersConverted =
            0

          let jessmanOriginalAirDatesUsed =
            0

          let iptvOrgOriginalAirDatesUsed =
            0

          let jessmanFieldsFilledFromIptv =
            0

          let iptvFieldsFilledFromJessman =
            0

          let tvmazeMatches =
            0

          let tvmazeFieldsUsed =
            0

          let tmdbMatches =
            0

          let tmdbFieldsUsed =
            0

          let totalFieldsFilled =
            0

          let combinedProgrammes =
            0

          /*
           * ============================================================
           * XML HELPERS
           * ============================================================
           */

          function decodeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&amp;/g,
                '&'
              )
              .replace(
                /&quot;/g,
                '"'
              )
              .replace(
                /&apos;/g,
                "'"
              )
              .replace(
                /&lt;/g,
                '<'
              )
              .replace(
                /&gt;/g,
                '>'
              )
          }

          function escapeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&/g,
                '&amp;'
              )
              .replace(
                /</g,
                '&lt;'
              )
              .replace(
                />/g,
                '&gt;'
              )
              .replace(
                /"/g,
                '&quot;'
              )
              .replace(
                /'/g,
                '&apos;'
              )
          }

          function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function normalizeChannelName(
            value
          ) {
            return cleanSpaces(
              value
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          /*
           * ============================================================
           * DATE AND EPISODE HELPERS
           * ============================================================
           */

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              episodeNumber
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const fromStructured =
              parseOriginalAirDate(
                structured
              )

            if (
              fromStructured
            ) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          /*
           * ============================================================
           * DESCRIPTION CLEANUP
           *
           * Remove embedded cast/crew names in parentheses, such as:
           *
           *   (Christopher Lee)
           *
           *   (Christopher Lee, Reb Brown, Annie McEnroe)
           *
           * Date parentheses are preserved:
           *
           *   (07/18/2026)
           *
           * Legitimate descriptive parentheses are preserved.
           * ============================================================
           */

          function cleanEmbeddedCredits(
            description
          ) {
            let result =
              cleanSpaces(
                description
              )

            result =
              result.replace(
                /\(\s*(?=[A-Z][^()]*)(?:(?:[A-Z][A-Za-z.'’-]*\s+){1,6}[A-Z][A-Za-z.'’-]*(?:\s*,\s*(?:[A-Z][A-Za-z.'’-]*\s+){1,6}[A-Z][A-Za-z.'’-]*)*)\s*\)/g,
                ''
              )

            return cleanSpaces(
              result
            )
          }

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''

            const cleanedDescription =
              cleanEmbeddedCredits(
                description
              )

            if (
              episodeTitle &&
              episodeNumber
            ) {
              result =
                episodeTitle +
                ' - ' +
                episodeNumber
            } else if (
              episodeTitle
            ) {
              result =
                episodeTitle
            } else if (
              episodeNumber
            ) {
              result =
                episodeNumber
            }

            if (
              cleanedDescription
            ) {
              result =
                result
                  ? result +
                    '. ' +
                    cleanedDescription
                  :
                    cleanedDescription
            }

            if (
              airDate
            ) {
              result =
                result
                  ? result +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'
            }

            return cleanSpaces(
              result
            )
          }

          /*
           * ============================================================
           * XML TAG MODIFICATION HELPERS
           * ============================================================
           */

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          /*
           * ============================================================
           * CLEAN ONE PROGRAMME
           * ============================================================
           */

          function cleanProgrammeBlock(
            block,
            source
          ) {
            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const airDate =
              extractAirDate(
                block
              )

            const description =
              buildDescription(
                episodeTitle,
                episodeNumber,
                originalDescription,
                airDate
              )

            if (
              description !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }
            }

            if (
              episodeNumber
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanEpisodeNumbersConverted++
              } else {
                iptvOrgEpisodeNumbersConverted++
              }
            }

            if (
              airDate
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanOriginalAirDatesUsed++
              } else {
                iptvOrgOriginalAirDatesUsed++
              }
            }

            let output =
              block

            const title =
              cleanSpaces(
                getTag(
                  block,
                  'title'
                )
                  .replace(
                    /\s+\(\d{4}\)\s*$/,
                    ''
                  )
              )

            output =
              replaceTag(
                output,
                'title',
                title
              )

            output =
              replaceTag(
                output,
                'desc',
                description
              )

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            const icon =
              getAttribute(
                block.match(
                  /<icon\b[^>]*>/i
                )?.[0] ||
                '',
                'src'
              )

            return {
              block:
                output,

              title,

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon,

              source
            }
          }

          /*
           * ============================================================
           * PROGRAMME MATCHING
           *
           * ONLY for finding missing metadata.
           *
           * No records are merged or deleted.
           * ============================================================
           */

          function programmeMatchKey(
            programme
          ) {
            return [
              programme.canonicalChannel,
              programme.start,
              normalizeTitle(
                programme.title
              )
            ].join(
              '|'
            )
          }

          /*
           * ============================================================
           * STREAMING XML PARSER
           * ============================================================
           */

          async function parseXmlStream(
            stream,
            callback
          ) {
            const rl =
              readline.createInterface(
                {
                  input:
                    stream,

                  crlfDelay:
                    Infinity
                }
              )

            let insideChannel =
              false

            let channelBuffer =
              ''

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            for await (
              const line of rl
            ) {
              if (
                !insideChannel &&
                !insideProgramme &&
                line.includes(
                  '<channel '
                )
              ) {
                insideChannel =
                  true

                channelBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                insideChannel
              ) {
                channelBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</channel>'
                  )
                ) {
                  insideChannel =
                    false

                  await callback(
                    'channel',
                    channelBuffer
                  )

                  channelBuffer =
                    ''
                }

                continue
              }

              if (
                line.includes(
                  '<programme '
                )
              ) {
                insideProgramme =
                  true

                programmeBuffer =
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }

                continue
              }

              if (
                insideProgramme
              ) {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  await callback(
                    'programme',
                    programmeBuffer
                  )

                  programmeBuffer =
                    ''
                }
              }
            }
          }

          /*
           * ============================================================
           * LOAD JESSMAN
           * ============================================================
           */

          async function loadJessman() {
            console.log(
              '========================================'
            )

            console.log(
              'LOADING COMPLETE JESSMAN GUIDE'
            )

            console.log(
              '========================================'
            )

            const jessmanIdToName =
              new Map()

            await parseXmlStream(
              fs.createReadStream(
                jessmanPath
              ),

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayNames =
                    getAllTags(
                      block,
                      'display-name'
                    )

                  const normalizedNames =
                    displayNames.map(
                      normalizeChannelName
                    )

                  let matchedName =
                    ''

                  for (
                    const targetName of
                    Object.keys(
                      jessmanChannels
                    )
                  ) {
                    if (
                      normalizedNames.includes(
                        normalizeChannelName(
                          targetName
                        )
                      )
                    ) {
                      matchedName =
                        targetName

                      break
                    }
                  }

                  if (
                    !matchedName
                  ) {
                    return
                  }

                  jessmanIdToName.set(
                    id,
                    matchedName
                  )

                  jessmanChannelsFound.set(
                    matchedName,
                    {
                      id,

                      canonicalChannel:
                        matchedName,

                      displayName:
                        jessmanChannels[
                          matchedName
                        ].displayName,

                      block
                    }
                  )

                  console.log(
                    'Jessman channel found: ' +
                    matchedName +
                    ' -> ' +
                    id
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const canonicalChannel =
                  jessmanIdToName.get(
                    channel
                  )

                if (
                  !canonicalChannel
                ) {
                  return
                }

                jessmanProgrammesScanned++

                const start =
                  getAttribute(
                    block,
                    'start'
                  )

                const startDate =
                  parseXmltvDate(
                    start
                  )

                if (
                  !startDate ||
                  startDate < lowerCutoff ||
                  startDate >= upperCutoff
                ) {
                  jessmanProgrammesSkipped++

                  return
                }

                const cleaned =
                  cleanProgrammeBlock(
