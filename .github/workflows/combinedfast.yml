name: Combined FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write

concurrency:
  group: combinedfast
  cancel-in-progress: false

jobs:
  build-combinedfast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting Combined FAST processing..."
          sleep 60

      - name: Download fresh Jessman FAST guide
        run: |
          mkdir -p combinedfast/source
          mkdir -p combinedfast/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o combinedfast/source/jessman.xml

          test -s combinedfast/source/jessman.xml

          echo "Fresh Jessman FAST guide downloaded"
          ls -lh combinedfast/source/jessman.xml

      - name: Download fresh IPTV-org guide
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-us.xml.gz \
            -o combinedfast/source/iptvorg.xml.gz

          test -s combinedfast/source/iptvorg.xml.gz

          echo "Fresh IPTV-org guide downloaded"
          ls -lh combinedfast/source/iptvorg.xml.gz

      - name: Process selected channels and combine metadata
        run: |
          cat > /tmp/build_combinedfast.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const jessmanPath = 'combinedfast/source/jessman.xml'
          const iptvOrgPath = 'combinedfast/source/iptvorg.xml.gz'
          const outputPath = 'combinedfast/work/combinedfast.xml'

          const now = new Date()

          const cutoff = new Date(
            now.getTime() +
            14 *
            24 *
            60 *
            60 *
            1000
          )

          const jessmanChannels = {
            'MGMPresents(MGMPRES).us':
              'MGM Presents',

            'ScaresbyShudder(SBSHUDD).us':
              'Scares by Shudder',

            'ScreamboxTV(SBOXTV).us':
              'Screambox TV',

            'UniversalMonsters(UNIMON).us':
              'Universal Monsters',

            'MiramaxMovieChannel(MMC).us':
              'Miramax Movie Channel'
          }

          const iptvOrgChannels = {
            'MGMPresents.us':
              'MGM Presents',

            'MGMPresentsAction.us':
              'MGM Presents Action',

            'MGMPresentsHorror.us':
              'MGM Presents Horror',

            'ScaresbyShudder.us':
              'Scares by Shudder',

            'ScreamboxTV.us':
              'Screambox TV',

            'UniversalMonsters.pluto':
              'Universal Monsters',

            'MiramaxMovieChannel.us':
              'Miramax Movie Channel'
          }

          const jessman = new Map()
          const iptvOrg = new Map()
          const channelHeaders = new Map()

          let jessmanChannelsFound = 0
          let iptvOrgChannelsFound = 0
          let jessmanProgrammesFound = 0
          let iptvOrgProgrammesFound = 0
          let combinedProgrammes = 0
          let enrichmentMatches = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;')
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function getAttribute(block, attribute) {
            const regex = new RegExp(
              '\\b' +
              attribute +
              '="([^"]*)"',
              'i'
            )

            const match = block.match(regex)

            return match
              ? decodeXml(match[1])
              : ''
          }

          function getTag(block, tag) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b[^>]*>' +
              '([\\s\\S]*?)' +
              '</' +
              tag +
              '>',
              'i'
            )

            const match = block.match(regex)

            if (!match) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(/<[^>]+>/g, '')
              )
            )
          }

          function getTagBySystem(block, tag, system) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b' +
              '[^>]*\\bsystem="' +
              system +
              '"' +
              '[^>]*>' +
              '([\\s\\S]*?)' +
              '</' +
              tag +
              '>',
              'i'
            )

            const match = block.match(regex)

            if (!match) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(/<[^>]+>/g, '')
              )
            )
          }

          function parseXmltvDate(value) {
            const match = String(value || '').match(
              /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
            )

            if (!match) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(match[1]),
                Number(match[2]) - 1,
                Number(match[3]),
                Number(match[4]),
                Number(match[5]),
                Number(match[6])
              )
            )
          }

          function parseAirDate(value) {
            const match = String(value || '').match(
              /^(\d{4})-(\d{2})-(\d{2})/
            )

            if (!match) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(value) {
            const match = String(value || '').match(
              /^(\d{4})(\d{2})(\d{2})$/
            )

            if (!match) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(value) {
            const match = String(value || '').match(
              /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
            )

            if (!match) {
              return ''
            }

            return (
              'S' +
              Number(match[1]) +
              'E' +
              Number(match[2])
            )
          }

          function extractJessmanEpisode(block) {
            let episode = getTagBySystem(
              block,
              'episode-num',
              'common'
            )

            if (!episode) {
              episode = getTagBySystem(
                block,
                'episode-num',
                'onscreen'
              )
            }

            return normalizeEpisode(episode)
          }

          function extractJessmanAirDate(block) {
            const structured = getTagBySystem(
              block,
              'episode-num',
              'original-air-date'
            )

            const fromStructured = parseAirDate(
              structured
            )

            if (fromStructured) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(block, 'date')
            )
          }

          function extractIptvOrgEpisode(block) {
            return normalizeEpisode(
              getTag(block, 'episode-num')
            )
          }

          function extractIptvOrgEpisodeTitle(block) {
            const description = getTag(
              block,
              'desc'
            )

            const match = description.match(
              /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
            )

            if (!match) {
              return ''
            }

            return cleanSpaces(match[1])
          }

          function normalizeTitle(value) {
            return cleanSpaces(value)
              .replace(/\s+\(\d{4}\)\s*$/, '')
              .trim()
          }

          function programmeKey(
            title,
            episodeTitle,
            episodeNumber
          ) {
            return [
              normalizeTitle(title).toLowerCase(),
              cleanSpaces(episodeTitle).toLowerCase(),
              normalizeEpisode(episodeNumber).toLowerCase()
            ].join('|')
          }

          function extractJessmanProgramme(block) {
            const channel = getAttribute(
              block,
              'channel'
            )

            if (!jessmanChannels[channel]) {
              return null
            }

            const start = getAttribute(
              block,
              'start'
            )

            const startDate = parseXmltvDate(
              start
            )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              return null
            }

            const title = normalizeTitle(
              getTag(block, 'title')
            )

            const episodeTitle = cleanSpaces(
              getTag(block, 'sub-title')
            )

            const episodeNumber =
              extractJessmanEpisode(block)

            const airDate =
              extractJessmanAirDate(block)

            const description = cleanSpaces(
              getTag(block, 'desc')
            )

            return {
              channel,

              channelName:
                jessmanChannels[channel],

              start,

              stop:
                getAttribute(
                  block,
                  'stop'
                ),

              title,

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon:
                getAttribute(
                  getTag(block, 'icon'),
                  'src'
                ),

              key:
                programmeKey(
                  title,
                  episodeTitle,
                  episodeNumber
                ),

              block
            }
          }

          function extractIptvOrgProgramme(block) {
            const channel = getAttribute(
              block,
              'channel'
            )

            if (!iptvOrgChannels[channel]) {
              return null
            }

            const start = getAttribute(
              block,
              'start'
            )

            const startDate = parseXmltvDate(
              start
            )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              return null
            }

            const title = normalizeTitle(
              getTag(block, 'title')
            )

            const episodeNumber =
              extractIptvOrgEpisode(block)

            const episodeTitle =
              extractIptvOrgEpisodeTitle(block)

            const description = cleanSpaces(
              getTag(block, 'desc')
            )

            return {
              channel,

              channelName:
                iptvOrgChannels[channel],

              start,

              stop:
                getAttribute(
                  block,
                  'stop'
                ),

              title,

              episodeTitle,

              episodeNumber,

              airDate: '',

              description,

              icon:
                getAttribute(
                  getTag(block, 'icon'),
                  'src'
                ),

              key:
                programmeKey(
                  title,
                  episodeTitle,
                  episodeNumber
                ),

              block
            }
          }

          function parseXmlStream(stream, callback) {
            return new Promise(
              (
                resolve,
                reject
              ) => {
                const rl =
                  readline.createInterface({
                    input: stream,
                    crlfDelay: Infinity
                  })

                let insideChannel = false
                let channelBuffer = ''

                let insideProgramme = false
                let programmeBuffer = ''

                ;(async () => {
                  try {
                    for await (
                      const line of rl
                    ) {
                      if (
                        !insideChannel &&
                        !insideProgramme &&
                        line.includes('<channel ')
                      ) {
                        insideChannel = true
                        channelBuffer = line + '\n'

                        if (
                          line.includes('</channel>')
                        ) {
                          insideChannel = false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer = ''
                        }

                        continue
                      }

                      if (insideChannel) {
                        channelBuffer += line + '\n'

                        if (
                          line.includes('</channel>')
                        ) {
                          insideChannel = false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer = ''
                        }

                        continue
                      }

                      if (
                        line.includes('<programme ')
                      ) {
                        insideProgramme = true
                        programmeBuffer = line + '\n'

                        if (
                          line.includes('</programme>')
                        ) {
                          insideProgramme = false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer = ''
                        }

                        continue
                      }

                      if (insideProgramme) {
                        programmeBuffer += line + '\n'

                        if (
                          line.includes('</programme>')
                        ) {
                          insideProgramme = false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer = ''
                        }
                      }
                    }

                    resolve()
                  } catch (error) {
                    reject(error)
                  }
                })()
              }
            )
          }

          async function loadJessman() {
            await parseXmlStream(
              fs.createReadStream(jessmanPath),

              async (
                type,
                block
              ) => {
                if (
                  type === 'channel'
                ) {
                  const id = getAttribute(
                    block,
                    'id'
                  )

                  if (
                    jessmanChannels[id]
                  ) {
                    jessmanChannelsFound++

                    channelHeaders.set(
                      jessmanChannels[id],
                      block
                    )
                  }

                  return
                }

                const programme =
                  extractJessmanProgramme(
                    block
                  )

                if (!programme) {
                  return
                }

                jessmanProgrammesFound++

                if (
                  !jessman.has(
                    programme.channelName
                  )
                ) {
                  jessman.set(
                    programme.channelName,
                    new Map()
                  )
                }

                jessman.get(
                  programme.channelName
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          async function loadIptvOrg() {
            const input =
              fs.createReadStream(
                iptvOrgPath
              )

            const gunzip =
              zlib.createGunzip()

            input.pipe(gunzip)

            await parseXmlStream(
              gunzip,

              async (
                type,
                block
              ) => {
                if (
                  type === 'channel'
                ) {
                  const id = getAttribute(
                    block,
                    'id'
                  )

                  if (
                    iptvOrgChannels[id]
                  ) {
                    iptvOrgChannelsFound++

                    if (
                      !channelHeaders.has(
                        iptvOrgChannels[id]
                      )
                    ) {
                      channelHeaders.set(
                        iptvOrgChannels[id],
                        block
                      )
                    }
                  }

                  return
                }

                const programme =
                  extractIptvOrgProgramme(
                    block
                  )

                if (!programme) {
                  return
                }

                iptvOrgProgrammesFound++

                if (
                  !iptvOrg.has(
                    programme.channelName
                  )
                ) {
                  iptvOrg.set(
                    programme.channelName,
                    new Map()
                  )
                }

                iptvOrg.get(
                  programme.channelName
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          function makeDescription(programme) {
            let result = ''

            if (
              programme.episodeTitle &&
              programme.episodeNumber
            ) {
              result =
                programme.episodeTitle +
                ' - ' +
                programme.episodeNumber
            } else if (
              programme.episodeTitle
            ) {
              result =
                programme.episodeTitle
            } else if (
              programme.episodeNumber
            ) {
              result =
                programme.episodeNumber
            }

            if (
              programme.description
            ) {
              result +=
                result
                  ? '. ' +
                    programme.description
                  :
                    programme.description
            }

            if (
              programme.airDate
            ) {
              result +=
                result
                  ? ' (' +
                    programme.airDate +
                    ')'
                  :
                    '(' +
                    programme.airDate +
                    ')'
            }

            return cleanSpaces(result)
          }

          function buildProgramme(programme) {
            const title = normalizeTitle(
              programme.title
            )

            const description =
              makeDescription(programme)

            let output =
              '<programme ' +
              'start="' +
              escapeXml(programme.start) +
              '" ' +
              'stop="' +
              escapeXml(programme.stop) +
              '" ' +
              'channel="' +
              escapeXml(programme.channel) +
              '">' +
              '\n'

            if (
              programme.episodeTitle
            ) {
              output +=
                '  <sub-title ' +
                'lang="en">' +
                escapeXml(
                  programme.episodeTitle
                ) +
                '</sub-title>\n'
            }

            if (description) {
              output +=
                '  <desc ' +
                'lang="en">' +
                escapeXml(
                  description
                ) +
                '</desc>\n'
            }

            if (
              programme.episodeNumber
            ) {
              output +=
                '  <episode-num ' +
                'system="onscreen">' +
                escapeXml(
                  programme.episodeNumber
                ) +
                '</episode-num>\n'
            }

            if (
              programme.airDate
            ) {
              output +=
                '  <date>' +
                escapeXml(
                  programme.airDate
                ) +
                '</date>\n'
            }

            if (
              programme.icon
            ) {
              output +=
                '  <icon src="' +
                escapeXml(
                  programme.icon
                ) +
                '" />\n'
            }

            output +=
              '  <title ' +
              'lang="en">' +
              escapeXml(title) +
              '</title>\n'

            output +=
              '</programme>\n'

            return output
          }

          function buildChannel(channelName) {
            const source =
              channelHeaders.get(
                channelName
              )

            if (!source) {
              return ''
            }

            const id = getAttribute(
              source,
              'id'
            )

            const displayName =
              getTag(
                source,
                'display-name'
              )

            const icon =
              getAttribute(
                getTag(
                  source,
                  'icon'
                ),
                'src'
              )

            let output =
              '<channel id="' +
              escapeXml(id) +
              '">' +
              '\n'

            output +=
              '  <display-name>' +
              escapeXml(
                displayName ||
                channelName
              ) +
              '</display-name>\n'

            if (icon) {
              output +=
                '  <icon src="' +
                escapeXml(icon) +
                '" />\n'
            }

            output +=
              '</channel>\n'

            return output
          }

          async function main() {
            await loadJessman()
            await loadIptvOrg()

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding: 'utf8'
                }
              )

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                )

                output.write(
                  '<tv generator-info-name="Combined FAST">\n'
                )

                for (
                  const channelName of
                  channelHeaders.keys()
                ) {
                  output.write(
                    buildChannel(
                      channelName
                    )
                  )
                }

                const allChannels =
                  new Set([
                    ...jessman.keys(),
                    ...iptvOrg.keys()
                  ])

                for (
                  const channelName of
                  allChannels
                ) {
                  const merged = new Map()

                  const jessmanProgrammeMap =
                    jessman.get(
                      channelName
                    ) ||
                    new Map()

                  const iptvOrgProgrammeMap =
                    iptvOrg.get(
                      channelName
                    ) ||
                    new Map()

                  for (
                    const [
                      key,
                      programme
                    ] of
                    jessmanProgrammeMap
                  ) {
                    merged.set(
                      key,
                      {
                        ...programme
                      }
                    )
                  }

                  for (
                    const [
                      key,
                      programme
                    ] of
                    iptvOrgProgrammeMap
                  ) {
                    if (
                      merged.has(key)
                    ) {
                      const existing =
                        merged.get(key)

                      merged.set(
                        key,
                        {
                          ...existing,

                          episodeTitle:
                            existing.episodeTitle ||
                            programme.episodeTitle,

                          episodeNumber:
                            existing.episodeNumber ||
                            programme.episodeNumber,

                          airDate:
                            existing.airDate ||
                            programme.airDate,

                          description:
                            existing.description ||
                            programme.description,

                          icon:
                            existing.icon ||
                            programme.icon
                        }
                      )

                      enrichmentMatches++
                    } else {
                      merged.set(
                        key,
                        programme
                      )
                    }
                  }

                  const programmes =
                    Array.from(
                      merged.values()
                    ).sort(
                      (
                        a,
                        b
                      ) =>
                        a.start.localeCompare(
                          b.start
                        )
                    )

                  for (
                    const programme of
                    programmes
                  ) {
                    output.write(
                      buildProgramme(
                        programme
                      )
                    )

                    combinedProgrammes++
                  }
                }

                output.write(
                  '</tv>\n'
                )

                output.end(resolve)

                output.once(
                  'error',
                  reject
                )
              }
            )

            console.log(
              'Combined FAST processing complete'
            )

            console.log(
              'Jessman channels found: ' +
              jessmanChannelsFound
            )

            console.log(
              'IPTV-org channels found: ' +
              iptvOrgChannelsFound
            )

            console.log(
              'Jessman programmes found: ' +
              jessmanProgrammesFound
            )

            console.log(
              'IPTV-org programmes found: ' +
              iptvOrgProgrammesFound
            )

            console.log(
              'Metadata matches: ' +
              enrichmentMatches
            )

            console.log(
              'Combined programmes: ' +
              combinedProgrammes
            )

            console.log(
              'Output: ' +
              outputPath
            )
          }

          main().catch(
            error => {
              console.error(error)
              process.exit(1)
            }
          )
          EOF

          node /tmp/build_combinedfast.js

      - name: Validate Combined FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' combinedfast/work/combinedfast.xml || true)
          PROGRAMMES=$(grep -c '<programme ' combinedfast/work/combinedfast.xml || true)

          echo "Combined FAST channels: $CHANNELS"
          echo "Combined FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Combined FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Combined FAST guide contains no programmes"
            exit 1
          fi

          test -s combinedfast/work/combinedfast.xml

      - name: Compress Combined FAST guide
        run: |
          gzip -c \
            combinedfast/work/combinedfast.xml \
            > guides/combinedfast.xml.gz

          test -s guides/combinedfast.xml.gz

          echo "Combined FAST guide:"
          ls -lh guides/combinedfast.xml.gz

      - name: Commit and push Combined FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/combinedfast.xml.gz

          if git diff --cached --quiet; then
            echo "No Combined FAST guide changes to commit"
            exit 0
          fi

          git commit \
            -m "Update Combined FAST guide"

          git fetch origin main

          if ! git rebase origin/main; then
            echo "Rebase failed"
            exit 1
          fi

          git push origin HEAD:main
