name: Combined FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '45 17 * * *'

permissions:
  contents: write

concurrency:
  group: combinedfast
  cancel-in-progress: false

jobs:
  build-combinedfast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting Combined FAST processing..."
          sleep 60

      - name: Download fresh Jessman FAST guide
        run: |
          mkdir -p combinedfast/source
          mkdir -p combinedfast/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o combinedfast/source/jessman.xml

          test -s combinedfast/source/jessman.xml

          echo "Fresh Jessman FAST guide downloaded"
          ls -lh combinedfast/source/jessman.xml

      - name: Download fresh IPTV-org guide
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-us.xml.gz \
            -o combinedfast/source/iptvorg.xml.gz

          test -s combinedfast/source/iptvorg.xml.gz

          echo "Fresh IPTV-org guide downloaded"
          ls -lh combinedfast/source/iptvorg.xml.gz

      - name: Process selected channels and combine metadata
        run: |
          cat > /tmp/build_combinedfast.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const jessmanPath =
            'combinedfast/source/jessman.xml'

          const iptvOrgPath =
            'combinedfast/source/iptvorg.xml.gz'

          const outputPath =
            'combinedfast/work/combinedfast.xml'

          const now =
            new Date()

          const cutoff =
            new Date(
              now.getTime() +
              14 *
              24 *
              60 *
              60 *
              1000
            )

          /*
           * IMPORTANT:
           *
           * Jessman channel IDs are NOT hardcoded.
           *
           * The workflow scans the Jessman channel list and
           * matches the actual display-name found in the feed.
           *
           * This prevents the previous problem where:
           *
           * Jessman channels found: 0
           *
           * happened because the assumed IDs did not match
           * the IDs actually used by the current Jessman feed.
           */

          const jessmanChannels = {
            'MGM Presents': {
              displayName: 'MGM Presents 2'
            },

            'Scares by Shudder': {
              displayName: 'Scares by Shudder 2'
            },

            'Screambox TV': {
              displayName: 'Screambox TV 2'
            },

            'Universal Monsters': {
              displayName: 'Universal Monsters 2'
            },

            'Miramax Movie Channel': {
              displayName: 'Miramax Movie Channel 2'
            }
          }

          const iptvOrgChannels = {
            'MGMPresents.us': {
              displayName: 'MGM Presents'
            },

            'MGMPresentsAction.us': {
              displayName: 'MGM Presents Action'
            },

            'MGMPresentsHorror.us': {
              displayName: 'MGM Presents Horror'
            },

            'ScaresbyShudder.us': {
              displayName: 'Scares by Shudder'
            },

            'ScreamboxTV.us': {
              displayName: 'Screambox TV'
            },

            'UniversalMonsters.pluto': {
              displayName: 'Universal Monsters'
            },

            'MiramaxMovieChannel.us': {
              displayName: 'Miramax Movie Channel'
            }
          }

          const jessman =
            new Map()

          const iptvOrg =
            new Map()

          const channelHeaders =
            new Map()

          const jessmanIdToName =
            new Map()

          let jessmanChannelsFound =
            0

          let iptvOrgChannelsFound =
            0

          let jessmanProgrammesScanned =
            0

          let iptvOrgProgrammesScanned =
            0

          let jessmanProgrammesKept =
            0

          let iptvOrgProgrammesKept =
            0

          let jessmanProgrammesSkipped =
            0

          let iptvOrgProgrammesSkipped =
            0

          let jessmanDescriptionsChanged =
            0

          let iptvOrgDescriptionsChanged =
            0

          let jessmanActorsRemoved =
            0

          let iptvOrgActorsRemoved =
            0

          let jessmanCreditsRemoved =
            0

          let iptvOrgCreditsRemoved =
            0

          let jessmanEpisodeNumbersConverted =
            0

          let iptvOrgEpisodeNumbersConverted =
            0

          let jessmanOriginalAirDatesUsed =
            0

          let iptvOrgOriginalAirDatesUsed =
            0

          let jessmanEnrichmentMatches =
            0

          let iptvOrgEnrichmentMatches =
            0

          let combinedProgrammes =
            0

          function decodeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&amp;/g,
                '&'
              )
              .replace(
                /&quot;/g,
                '"'
              )
              .replace(
                /&apos;/g,
                "'"
              )
              .replace(
                /&lt;/g,
                '<'
              )
              .replace(
                /&gt;/g,
                '>'
              )
          }

          function escapeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&/g,
                '&amp;'
              )
              .replace(
                /</g,
                '&lt;'
              )
              .replace(
                />/g,
                '&gt;'
              )
              .replace(
                /"/g,
                '&quot;'
              )
              .replace(
                /'/g,
                '&apos;'
              )
          }

          function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function normalizeChannelName(
            value
          ) {
            return cleanSpaces(
              value
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              episodeNumber
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const fromStructured =
              parseOriginalAirDate(
                structured
              )

            if (
              fromStructured
            ) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .trim()
          }

          function programmeKey(
            title,
            episodeTitle,
            episodeNumber
          ) {
            return [
              normalizeTitle(
                title
              ).toLowerCase(),

              cleanSpaces(
                episodeTitle
              ).toLowerCase(),

              normalizeEpisode(
                episodeNumber
              ).toLowerCase()
            ].join(
              '|'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function processProgramme(
            block,
            source
          ) {
            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesScanned++
            } else {
              iptvOrgProgrammesScanned++
            }

            const start =
              getAttribute(
                block,
                'start'
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanProgrammesSkipped++
              } else {
                iptvOrgProgrammesSkipped++
              }

              return null
            }

            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesKept++
            } else {
              iptvOrgProgrammesKept++
            }

            const channel =
              getAttribute(
                block,
                'channel'
              )

            const originalTitle =
              normalizeTitle(
                getTag(
                  block,
                  'title'
                )
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const airDate =
              extractAirDate(
                block
              )

            let newDescription =
              originalDescription

            if (
              episodeTitle &&
              episodeNumber
            ) {
              newDescription =
                episodeTitle +
                ' - ' +
                episodeNumber +
                (
                  originalDescription
                    ? '. ' +
                      originalDescription
                    : ''
                )

              if (
                source ===
                'jessman'
              ) {
                jessmanEpisodeNumbersConverted++
              } else {
                iptvOrgEpisodeNumbersConverted++
              }
            } else if (
              episodeTitle
            ) {
              newDescription =
                episodeTitle +
                (
                  originalDescription
                    ? '. ' +
                      originalDescription
                    : ''
                )
            } else if (
              episodeNumber
            ) {
              newDescription =
                episodeNumber +
                (
                  originalDescription
                    ? '. ' +
                      originalDescription
                    : ''
                )
            }

            if (
              airDate
            ) {
              newDescription =
                newDescription
                  ? newDescription +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'

              if (
                source ===
                'jessman'
              ) {
                jessmanOriginalAirDatesUsed++
              } else {
                iptvOrgOriginalAirDatesUsed++
              }
            }

            if (
              newDescription !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }
            }

            let cleaned =
              block

            cleaned =
              replaceTag(
                cleaned,
                'title',
                originalTitle
              )

            cleaned =
              replaceTag(
                cleaned,
                'desc',
                newDescription
              )

            cleaned =
              removeTag(
                cleaned,
                'actor'
              )

            cleaned =
              removeTag(
                cleaned,
                'credits'
              )

            cleaned =
              removeTag(
                cleaned,
                'sub-title'
              )

            cleaned =
              removeTag(
                cleaned,
                'episode-num'
              )

            cleaned =
              removeTag(
                cleaned,
                'date'
              )

            return {
              source,

              channel,

              start,

              stop:
                getAttribute(
                  block,
                  'stop'
                ),

              title:
                originalTitle,

              episodeTitle,

              episodeNumber,

              airDate,

              description:
                newDescription,

              icon:
                getAttribute(
                  getTag(
                    block,
                    'icon'
                  ),
                  'src'
                ),

              key:
                programmeKey(
                  originalTitle,
                  episodeTitle,
                  episodeNumber
                ),

              block:
                cleaned
            }
          }

          function parseXmlStream(
            stream,
            callback
          ) {
            return new Promise(
              (
                resolve,
                reject
              ) => {
                const rl =
                  readline.createInterface(
                    {
                      input:
                        stream,

                      crlfDelay:
                        Infinity
                    }
                  )

                let insideChannel =
                  false

                let channelBuffer =
                  ''

                let insideProgramme =
                  false

                let programmeBuffer =
                  ''

                ;(async () => {
                  try {
                    for await (
                      const line of rl
                    ) {
                      if (
                        !insideChannel &&
                        !insideProgramme &&
                        line.includes(
                          '<channel '
                        )
                      ) {
                        insideChannel =
                          true

                        channelBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideChannel
                      ) {
                        channelBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        line.includes(
                          '<programme '
                        )
                      ) {
                        insideProgramme =
                          true

                        programmeBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideProgramme
                      ) {
                        programmeBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }
                      }
                    }

                    resolve()
                  } catch (
                    error
                  ) {
                    reject(
                      error
                    )
                  }
                })()
              }
            )
          }

          async function loadJessman() {
            await parseXmlStream(
              fs.createReadStream(
                jessmanPath
              ),

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayNames =
                    getAllTags(
                      block,
                      'display-name'
                    )

                  const normalizedNames =
                    displayNames.map(
                      normalizeChannelName
                    )

                  let matchedName =
                    ''

                  for (
                    const targetName of
                    Object.keys(
                      jessmanChannels
                    )
                  ) {
                    const normalizedTarget =
                      normalizeChannelName(
                        targetName
                      )

                    if (
                      normalizedNames.includes(
                        normalizedTarget
                      )
                    ) {
                      matchedName =
                        targetName

                      break
                    }
                  }

                  if (
                    !matchedName
                  ) {
                    return
                  }

                  jessmanChannelsFound++

                  jessmanIdToName.set(
                    id,
                    matchedName
                  )

                  channelHeaders.set(
                    id,
                    {
                      source:
                        'jessman',

                      id,

                      displayName:
                        jessmanChannels[
                          matchedName
                        ].displayName,

                      block
                    }
                  )

                  console.log(
                    'Jessman channel matched: ' +
                    matchedName +
                    ' -> ' +
                    id
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                if (
                  !jessmanIdToName.has(
                    channel
                  )
                ) {
                  return
                }

                const programme =
                  processProgramme(
                    block,
                    'jessman'
                  )

                if (
                  !programme
                ) {
                  return
                }

                if (
                  !jessman.has(
                    channel
                  )
                ) {
                  jessman.set(
                    channel,
                    new Map()
                  )
                }

                jessman.get(
                  channel
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          async function loadIptvOrg() {
            const input =
              fs.createReadStream(
                iptvOrgPath
              )

            const gunzip =
              zlib.createGunzip()

            input.pipe(
              gunzip
            )

            await parseXmlStream(
              gunzip,

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  if (
                    !iptvOrgChannels[id]
                  ) {
                    return
                  }

                  iptvOrgChannelsFound++

                  const channel =
                    iptvOrgChannels[id]

                  channelHeaders.set(
                    id,
                    {
                      source:
                        'iptvorg',

                      id,

                      displayName:
                        channel.displayName,

                      block
                    }
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                if (
                  !iptvOrgChannels[channel]
                ) {
                  return
                }

                const programme =
                  processProgramme(
                    block,
                    'iptvorg'
                  )

                if (
                  !programme
                ) {
                  return
                }

                if (
                  !iptvOrg.has(
                    channel
                  )
                ) {
                  iptvOrg.set(
                    channel,
                    new Map()
                  )
                }

                iptvOrg.get(
                  channel
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          function buildChannel(
            channelHeader
          ) {
            const source =
              channelHeader.block

            const icon =
              getAttribute(
                getTag(
                  source,
                  'icon'
                ),
                'src'
              )

            let output =
              '<channel id="' +
              escapeXml(
                channelHeader.id
              ) +
              '">' +
              '\n'

            output +=
              '  <display-name>' +
              escapeXml(
                channelHeader.displayName
              ) +
              '</display-name>\n'

            if (
              icon
            ) {
              output +=
                '  <icon src="' +
                escapeXml(
                  icon
                ) +
                '" />\n'
            }

            output +=
              '</channel>\n'

            return output
          }

          function buildProgramme(
            programme
          ) {
            let output =
              '<programme ' +
              'start="' +
              escapeXml(
                programme.start
              ) +
              '" ' +
              'stop="' +
              escapeXml(
                programme.stop
              ) +
              '" ' +
              'channel="' +
              escapeXml(
                programme.channel
              ) +
              '">' +
              '\n'

            if (
              programme.description
            ) {
              output +=
                '  <desc lang="en">' +
                escapeXml(
                  programme.description
                ) +
                '</desc>\n'
            }

            output +=
              '  <title lang="en">' +
              escapeXml(
                programme.title
              ) +
              '</title>\n'

            output +=
              '</programme>\n'

            return output
          }

          async function main() {
            await loadJessman()

            await loadIptvOrg()

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding:
                    'utf8'
                }
              )

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                )

                output.write(
                  '<tv generator-info-name="Combined FAST">\n'
                )

                for (
                  const channelHeader of
                  channelHeaders.values()
                ) {
                  output.write(
                    buildChannel(
                      channelHeader
                    )
                  )
                }

                const jessmanByKey =
                  new Map()

                for (
                  const programmes of
                  jessman.values()
                ) {
                  for (
                    const programme of
                    programmes.values()
                  ) {
                    jessmanByKey.set(
                      getEnrichmentKey(
                        programme
                      ),
                      programme
                    )
                  }
                }

                const iptvOrgByKey =
                  new Map()

                for (
                  const programmes of
                  iptvOrg.values()
                ) {
                  for (
                    const programme of
                    programmes.values()
                  ) {
                    iptvOrgByKey.set(
                      getEnrichmentKey(
                        programme
                      ),
                      programme
                    )
                  }
                }

                for (
                  const programme of
                  jessmanByKey.values()
                ) {
                  const iptvMatch =
                    iptvOrgByKey.get(
                      getEnrichmentKey(
                        programme
                      )
                    )

                  if (
                    iptvMatch
                  ) {
                    jessmanEnrichmentMatches++

                    if (
                      !programme.description &&
                      iptvMatch.description
                    ) {
                      programme.description =
                        iptvMatch.description
                    }

                    if (
                      !programme.icon &&
                      iptvMatch.icon
                    ) {
                      programme.icon =
                        iptvMatch.icon
                    }
                  }
                }

                for (
                  const programme of
                  iptvOrgByKey.values()
                ) {
                  const jessmanMatch =
                    jessmanByKey.get(
                      getEnrichmentKey(
                        programme
                      )
                    )

                  if (
                    jessmanMatch
                  ) {
                    iptvOrgEnrichmentMatches++

                    if (
                      !programme.description &&
                      jessmanMatch.description
                    ) {
                      programme.description =
                        jessmanMatch.description
                    }

                    if (
                      !programme.icon &&
                      jessmanMatch.icon
                    ) {
                      programme.icon =
                        jessmanMatch.icon
                    }
                  }
                }

                const orderedChannels =
                  [
                    ...channelHeaders.keys()
                  ]

                for (
                  const channelId of
                  orderedChannels
                ) {
                  const channelHeader =
                    channelHeaders.get(
                      channelId
                    )

                  let programmes

                  if (
                    channelHeader.source ===
                    'jessman'
                  ) {
                    programmes =
                      jessman.get(
                        channelId
                      ) ||
                      new Map()
                  } else {
                    programmes =
                      iptvOrg.get(
                        channelId
                      ) ||
                      new Map()
                  }

                  const sorted =
                    Array.from(
                      programmes.values()
                    ).sort(
                      (
                        a,
                        b
                      ) =>
                        a.start.localeCompare(
                          b.start
                        )
                    )

                  for (
                    const programme of
                    sorted
                  ) {
                    output.write(
                      buildProgramme(
                        programme
                      )
                    )

                    combinedProgrammes++
                  }
                }

                output.write(
                  '</tv>\n'
                )

                output.end(
                  resolve
                )

                output.once(
                  'error',
                  reject
                )
              }
            )

            const totalProgrammesScanned =
              jessmanProgrammesScanned +
              iptvOrgProgrammesScanned

            const totalProgrammesKept =
              jessmanProgrammesKept +
              iptvOrgProgrammesKept

            const totalProgrammesSkipped =
              jessmanProgrammesSkipped +
              iptvOrgProgrammesSkipped

            const totalDescriptionsChanged =
              jessmanDescriptionsChanged +
              iptvOrgDescriptionsChanged

            const totalActorsRemoved =
              jessmanActorsRemoved +
              iptvOrgActorsRemoved

            const totalCreditsRemoved =
              jessmanCreditsRemoved +
              iptvOrgCreditsRemoved

            const totalEpisodeNumbersConverted =
              jessmanEpisodeNumbersConverted +
              iptvOrgEpisodeNumbersConverted

            const totalOriginalAirDatesUsed =
              jessmanOriginalAirDatesUsed +
              iptvOrgOriginalAirDatesUsed

            const totalEnrichmentMatches =
              jessmanEnrichmentMatches +
              iptvOrgEnrichmentMatches

            console.log('')

            console.log(
              '========================================'
            )

            console.log(
              'COMBINED FAST PROCESSING COMPLETE'
            )

            console.log(
              '========================================'
            )

            console.log('')

            console.log(
              'CHANNELS'
            )

            console.log(
              'Jessman channels found: ' +
              jessmanChannelsFound
            )

            console.log(
              'IPTV-org channels found: ' +
              iptvOrgChannelsFound
            )

            console.log(
              'Total channels written: ' +
              channelHeaders.size
            )

            console.log('')

            console.log(
              'JESSMAN PROGRAMMES'
            )

            console.log(
              'Programmes scanned: ' +
              jessmanProgrammesScanned
            )

            console.log(
              'Programmes kept: ' +
              jessmanProgrammesKept
            )

            console.log(
              'Programmes skipped: ' +
              jessmanProgrammesSkipped
            )

            console.log(
              'Descriptions changed: ' +
              jessmanDescriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              jessmanActorsRemoved
            )

            console.log(
              'Credits removed: ' +
              jessmanCreditsRemoved
            )

            console.log(
              'Episode numbers converted: ' +
              jessmanEpisodeNumbersConverted
            )

            console.log(
              'Original air dates used: ' +
              jessmanOriginalAirDatesUsed
            )

            console.log(
              'Jessman enrichment matches: ' +
              jessmanEnrichmentMatches
            )

            console.log('')

            console.log(
              'IPTV-ORG PROGRAMMES'
            )

            console.log(
              'Programmes scanned: ' +
              iptvOrgProgrammesScanned
            )

            console.log(
              'Programmes kept: ' +
              iptvOrgProgrammesKept
            )

            console.log(
              'Programmes skipped: ' +
              iptvOrgProgrammesSkipped
            )

            console.log(
              'Descriptions changed: ' +
              iptvOrgDescriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              iptvOrgActorsRemoved
            )

            console.log(
              'Credits removed: ' +
              iptvOrgCreditsRemoved
            )

            console.log(
              'Episode numbers converted: ' +
              iptvOrgEpisodeNumbersConverted
            )

            console.log(
              'Original air dates used: ' +
              iptvOrgOriginalAirDatesUsed
            )

            console.log(
              'IPTV-org enrichment matches: ' +
              iptvOrgEnrichmentMatches
            )

            console.log('')

            console.log(
              'COMBINED TOTALS'
            )

            console.log(
              'Programmes scanned: ' +
              totalProgrammesScanned
            )

            console.log(
              'Programmes kept: ' +
              totalProgrammesKept
            )

            console.log(
              'Programmes skipped: ' +
              totalProgrammesSkipped
            )

            console.log(
              'Descriptions changed: ' +
              totalDescriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              totalActorsRemoved
            )

            console.log(
              'Credits removed: ' +
              totalCreditsRemoved
            )

            console.log(
              'Episode numbers converted: ' +
              totalEpisodeNumbersConverted
            )

            console.log(
              'Original air dates used: ' +
              totalOriginalAirDatesUsed
            )

            console.log(
              'Total enrichment matches: ' +
              totalEnrichmentMatches
            )

            console.log(
              'Combined programmes written: ' +
              combinedProgrammes
            )

            console.log('')

            console.log(
              'Output: ' +
              outputPath
            )
          }

          function getEnrichmentKey(
            programme
          ) {
            return programme.key
          }

          main().catch(
            error => {
              console.error(
                error
              )

              process.exit(
                1
              )
            }
          )
          EOF

          node /tmp/build_combinedfast.js

      - name: Validate Combined FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' combinedfast/work/combinedfast.xml || true)
          PROGRAMMES=$(grep -c '<programme ' combinedfast/work/combinedfast.xml || true)

          echo "Combined FAST channels: $CHANNELS"
          echo "Combined FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Combined FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Combined FAST guide contains no programmes"
            exit 1
          fi

          test -s combinedfast/work/combinedfast.xml

      - name: Compress Combined FAST guide
        run: |
          gzip -c \
            combinedfast/work/combinedfast.xml \
            > guides/combinedfast.xml.gz

          test -s guides/combinedfast.xml.gz

          echo "Combined FAST guide:"
          ls -lh guides/combinedfast.xml.gz

      - name: Commit and push Combined FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/combinedfast.xml.gz

          if git diff --cached --quiet; then
            echo "No Combined FAST guide changes to commit"
            exit 0
          fi

          git commit \
            -m "Update Combined FAST guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Synchronizing with remote before retry..."

            git fetch origin main

            git rebase origin/main

            echo "Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
