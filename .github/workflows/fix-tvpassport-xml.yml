name: Fix TVPassport XML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tvpassport:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin webp

      - name: Convert logos
        run: |
          [ -f "logos/Retroplex_logo.svg" ] && rsvg-convert "logos/Retroplex_logo.svg" -o "logos/RetroPlex.png" || true
          [ -f "logos/ScreenPix_Action.webp" ] && convert "logos/ScreenPix_Action.webp" "logos/ScreenPix Action.png" || true
          [ -f "logos/ScreenPix_Voices_2019.webp" ] && convert "logos/ScreenPix_Voices_2019.webp" "logos/ScreenPix Voices.png" || true
          [ -f "logos/ScreenPix_logo_2019.webp" ] && convert "logos/ScreenPix_logo_2019.webp" "logos/ScreenPix.png" || true
          [ -f "logos/MGM+.svg" ] && rsvg-convert "logos/MGM+.svg" -o "logos/MGM+.png" || true
          [ -f "logos/MGM+_Drive-In_2023.svg" ] && rsvg-convert "logos/MGM+_Drive-In_2023.svg" -o "logos/MGM+ Drive-In.png" || true
          [ -f "logos/MGM+_Hits_2023.svg" ] && rsvg-convert "logos/MGM+_Hits_2023.svg" -o "logos/MGM+ Hits.png" || true
          [ -f "logos/MGM+_Marquee_2023.svg" ] && rsvg-convert "logos/MGM+_Marquee_2023.svg" -o "logos/MGM+ Marquee.png" || true
          [ -f "logos/Movieplex_logo_old.webp" ] && convert "logos/Movieplex_logo_old.webp" "logos/MoviePlex.png" || true
          [ -f "logos/Indieplex_logo.svg" ] && rsvg-convert "logos/Indieplex_logo.svg" -o "logos/IndiePlex.png" || true
          rm -f "logos/Retroplex_logo.svg"
          rm -f "logos/ScreenPix_Action.webp"
          rm -f "logos/ScreenPix_Voices_2019.webp"
          rm -f "logos/ScreenPix_logo_2019.webp"
          rm -f "logos/MGM+.svg"
          rm -f "logos/MGM+_Drive-In_2023.svg"
          rm -f "logos/MGM+_Hits_2023.svg"
          rm -f "logos/MGM+_Marquee_2023.svg"
          rm -f "logos/Movieplex_logo_old.webp"
          rm -f "logos/Indieplex_logo.svg"

      - name: Fix TVPassport channels XML
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("guides/TVPassport.channels.xml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("</channel><channel", "</channel>\n<channel")

          fixes = {
              "Home Network": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Home%20Network.png" site="tvpassport.com" site_id="hgtv-canada-hd/8793" lang="en" xmltv_id="HOME.NETWORK.ca">Home Network</channel>',
              "Military History": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Military%20History.png" site="tvpassport.com" site_id="military-history/5271" lang="en" xmltv_id="MILITARY.HISTORY.us">Military History</channel>',
              "MeTV Plus": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MeTV%20Plus.png" site="tvpassport.com" site_id="metv-plus/36199" lang="en" xmltv_id="METV.PLUS.us">MeTV Plus</channel>',
              "Lifetime Real Women East": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Lifetime%20Real%20Women%20East.png" site="tvpassport.com" site_id="lifetime-real-women-east/2707" lang="en" xmltv_id="LIFETIME.REAL.WOMEN.us">Lifetime Real Women East</channel>',
              "The Movie Channel": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/The%20Movie%20Channel.png" site="tvpassport.com" site_id="the-movie-channel-hd/7138" lang="en" xmltv_id="THE.MOVIE.CHANNEL.ca">The Movie Channel</channel>',
              "Starz Encore Westerns - Eastern": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Starz%20Encore%20Westerns.png" site="tvpassport.com" site_id="starz-encore-westerns--eastern/1959" lang="en" xmltv_id="STARZ.ENCORE.WESTERNS.us">Starz Encore Westerns - Eastern</channel>',
              "RetroPlex": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/RetroPlex.png" site="tvpassport.com" site_id="retroplex-hd/8837" lang="en" xmltv_id="RETROPLEX.us">RetroPlex</channel>',
              "IndiePlex": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/IndiePlex.png" site="tvpassport.com" site_id="indieplex-hd/9026" lang="en" xmltv_id="INDIEPLEX.us">IndiePlex</channel>',
              "MoviePlex": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MoviePlex.png" site="tvpassport.com" site_id="movieplex-hd--eastern/11443" lang="en" xmltv_id="MOVIEPLEX.us">MoviePlex</channel>',
              "MGM": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B.png" site="tvpassport.com" site_id="mgm-hd--east/7610" lang="en" xmltv_id="MGMPLUS.us">MGM+</channel>',
              "MGM Drive-In": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Drive-In.png" site="tvpassport.com" site_id="mgm-drive-in-hd/33934" lang="en" xmltv_id="MGMPLUS.DRIVE.IN.us">MGM+ Drive-In</channel>',
              "MGM Hits": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Hits.png" site="tvpassport.com" site_id="mgm-hits-hd--east/11615" lang="en" xmltv_id="MGMPLUS.HITS.us">MGM+ Hits</channel>',
              "MGM Marquee": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/MGM%2B%20Marquee.png" site="tvpassport.com" site_id="mgm-marquee-hd/11616" lang="en" xmltv_id="MGMPLUS.MARQUEE.us">MGM+ Marquee</channel>',
              "ScreenPix": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ScreenPix.png" site="tvpassport.com" site_id="screenpix/34659" lang="en" xmltv_id="SCREENPIX.us">ScreenPix</channel>',
              "ScreenPix Action": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ScreenPix%20Action.png" site="tvpassport.com" site_id="screenpix-action/34660" lang="en" xmltv_id="SCREENPIX.ACTION.us">ScreenPix Action</channel>',
              "ScreenPix Voices": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ScreenPix%20Voices.png" site="tvpassport.com" site_id="screenpix-voices/34662" lang="en" xmltv_id="SCREENPIX.VOICES.us">ScreenPix Voices</channel>',
              "ScreenPix Westerns": '<channel logo="https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/ScreenPix%20Westerns.png" site="tvpassport.com" site_id="screenpix-westerns/34661" lang="en" xmltv_id="SCREENPIX.WESTERNS.us">ScreenPix Westerns</channel>'
          }

          lines = text.splitlines()
          new_lines = []

          for line in lines:
              stripped = line.strip()
              replaced = False
              for name, fixed in fixes.items():
                  if stripped.startswith("<channel ") and stripped.endswith(f">{name}</channel>"):
                      new_lines.append(fixed)
                      replaced = True
                      break
              if not replaced:
                  new_lines.append(stripped)

          text = "\n".join(new_lines)

          for fixed in fixes.values():
              name = fixed.split(">")[-2].split("<")[0]
              if name not in text:
                  text = text.replace("</channels>", fixed + "\n</channels>")

          path.write_text(text + "\n", encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guides/TVPassport.channels.xml logos/
          git commit -m "Fix TVPassport XML logos and ids" || exit 0
          git push
