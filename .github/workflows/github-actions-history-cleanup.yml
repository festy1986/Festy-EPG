name: Clean GitHub Actions History

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — do not delete anything"
        required: false
        type: boolean
        default: false
      delete_caches:
        description: "Also delete all GitHub Actions caches"
        required: false
        type: boolean
        default: true
  schedule:
    # Runs every day at 6:20 AM Eastern during daylight saving time.
    # GitHub cron uses UTC.
    - cron: "20 10 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: clean-github-actions-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete completed runs and temporary Actions storage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      DELETE_CACHES: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_caches || true }}

    steps:
      - name: Explain safety boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "This job deletes only GitHub Actions run history, logs, attached artifacts, and optionally Actions caches."
          echo "It does NOT checkout, edit, commit, push, or delete repository files."
          echo "Protected current run ID: ${CURRENT_RUN_ID}"
          echo "Dry run: ${DRY_RUN}"
          echo "Delete caches: ${DELETE_CACHES}"

      - name: Delete all completed workflow runs
        shell: bash
        run: |
          set -uo pipefail

          deleted=0
          failed=0
          skipped=0

          echo "Loading completed workflow runs..."

          mapfile -t run_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/actions/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[].id'
          )

          echo "Completed runs found: ${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            if [[ "${run_id}" == "${CURRENT_RUN_ID}" ]]; then
              echo "Skipping current cleanup run: ${run_id}"
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "[DRY RUN] Would delete workflow run ${run_id}"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
              echo "Deleted workflow run ${run_id}"
              deleted=$((deleted + 1))
            else
              echo "WARNING: Could not delete workflow run ${run_id}"
              failed=$((failed + 1))
            fi
          done

          echo "Run cleanup complete: deleted=${deleted}, skipped=${skipped}, failed=${failed}"

          if (( failed > 0 )); then
            echo "Some runs could not be deleted, but cleanup will continue."
          fi

      - name: Delete all GitHub Actions caches
        if: ${{ env.DELETE_CACHES == 'true' }}
        shell: bash
        run: |
          set -uo pipefail

          deleted=0
          failed=0
          skipped=0

          echo "Loading Actions caches..."

          mapfile -t cache_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/actions/caches?per_page=100" \
              --jq '.actions_caches[].id'
          )

          echo "Caches found: ${#cache_ids[@]}"

          for cache_id in "${cache_ids[@]}"; do
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "[DRY RUN] Would delete Actions cache ${cache_id}"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/actions/caches/${cache_id}" >/dev/null 2>&1; then
              echo "Deleted Actions cache ${cache_id}"
              deleted=$((deleted + 1))
            else
              echo "WARNING: Could not delete Actions cache ${cache_id}"
              failed=$((failed + 1))
            fi
          done

          echo "Cache cleanup complete: deleted=${deleted}, skipped=${skipped}, failed=${failed}"

      - name: Final summary
        shell: bash
        run: |
          echo "Cleanup finished."
          echo "Repository workflows, guides, logos, configuration, scripts, and every other committed file were untouched."
