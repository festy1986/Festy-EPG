name: Test Major League Channel Names

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-provider-names:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Read current MLB NFL NBA NHL names
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: python config/test_major_league_channel_names.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-league-channel-name-test
          path: |
            major-league-channel-names.txt
            major-league-channel-names.csv
          if-no-files-found: warn
