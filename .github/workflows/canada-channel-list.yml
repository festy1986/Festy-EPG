name: Update Canada Channel IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-canada-channel-ids:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found"

      - name: Get provider live channels and match Canada list
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          test -f config/canada_channels.txt

          mkdir -p test

          BASE_URL="${XTREAM_URL%/}"

          echo "Getting all provider live channels..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_streams" \
            "$BASE_URL/player_api.php" \
            -o test/live_streams.json

          test -s test/live_streams.json

          echo "Matching config/canada_channels.txt against provider channels..."

          python3 - <<'PY'

          import json
          import re
          import unicodedata

          INPUT_FILE = "config/canada_channels.txt"
          STREAM_FILE = "test/live_streams.json"
          OUTPUT_FILE = "config/canada_channels.txt"


          def normalize(value):

              value = str(value or "")

              value = unicodedata.normalize(
                  "NFKC",
                  value
              )

              value = value.strip().lower()

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value


          def clean_name(value):

              value = str(value or "").strip()

              value = re.sub(
                  r"^\s*\d+\s*\|\s*",
                  "",
                  value
              )

              value = re.sub(
                  r"^\s*id\s*=\s*['\"]?[^'\"]+['\"]?\s*",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              return value.strip()


          print(
              "Reading existing Canada channel list..."
          )

          requested_channels = []

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              for raw_line in file:

                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  channel_name = clean_name(
                      line
                  )

                  if not channel_name:
                      continue

                  if not channel_name.upper().startswith(
                      "CA:"
                  ):

                      continue

                  requested_channels.append(
                      channel_name
                  )


          print(
              "Canada channels requested:",
              len(
                  requested_channels
              )
          )


          print(
              "Reading provider channels..."
          )

          with open(
              STREAM_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              provider_streams = json.load(
                  file
              )


          provider_channels = []

          for stream in provider_streams:

              stream_id = str(
                  stream.get(
                      "stream_id",
                      ""
                  )
              ).strip()

              provider_name = str(
                  stream.get(
                      "name",
                      ""
                  )
              ).strip()

              if not stream_id:
                  continue

              if not provider_name:
                  continue

              provider_channels.append(
                  {
                      "stream_id":
                          stream_id,

                      "name":
                          provider_name,

                      "normalized":
                          normalize(
                              provider_name
                          )
                  }
              )


          exact_matches = {}

          for provider_channel in provider_channels:

              normalized_name = provider_channel[
                  "normalized"
              ]

              if normalized_name not in exact_matches:

                  exact_matches[
                      normalized_name
                  ] = provider_channel


          matched = []

          unmatched = []

          seen_output = set()


          for requested_name in requested_channels:

              normalized_requested = normalize(
                  requested_name
              )

              match = exact_matches.get(
                  normalized_requested
              )


              if match:

                  output_line = (
                      match["stream_id"]
                      + " | "
                      + requested_name
                  )

                  output_key = normalize(
                      output_line
                  )

                  if output_key not in seen_output:

                      matched.append(
                          output_line
                      )

                      seen_output.add(
                          output_key
                      )

              else:

                  unmatched.append(
                      requested_name
                  )


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "# CANADA CHANNEL LIST\n"
              )

              file.write(
                  "# FORMAT: PROVIDER STREAM ID | CHANNEL NAME\n"
              )

              file.write(
                  "#\n"
              )

              for line in matched:

                  file.write(
                      line
                      + "\n"
                  )


          print()
          print(
              "Canada channels matched:",
              len(
                  matched
              )
          )

          print(
              "Canada channels NOT matched:",
              len(
                  unmatched
              )
          )


          if unmatched:

              print()
              print(
                  "UNMATCHED CHANNELS:"
              )

              for channel_name in unmatched:

                  print(
                      " -",
                      channel_name
                  )


          print()
          print(
              "Updated:",
              OUTPUT_FILE
          )

          PY

          echo
          echo "Updated Canada channel list:"
          cat config/canada_channels.txt

      - name: Commit updated Canada channel IDs
        run: |

          git config --global user.name \
            "github-actions"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/canada_channels.txt

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Update Canada channel IDs"

            git pull \
              --rebase \
              origin main

            git push \
              origin HEAD:main

          fi
