name: Canada Channel IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  canada-channel-ids:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found"

      - name: Get all provider groups and channels
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          test -f config/canada_channels.txt

          mkdir -p test

          BASE_URL="${XTREAM_URL%/}"

          echo "Getting all provider live categories..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_categories" \
            "$BASE_URL/player_api.php" \
            -o test/canada_categories.json

          test -s test/canada_categories.json

          echo "Getting all provider live channels..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_streams" \
            "$BASE_URL/player_api.php" \
            -o test/canada_live_streams.json

          test -s test/canada_live_streams.json

          echo "Matching channels from config/canada_channels.txt..."

          python3 - <<'PY'

          import json
          import re
          from collections import defaultdict

          CHANNEL_FILE = "config/canada_channels.txt"

          with open(
              "test/canada_categories.json",
              "r",
              encoding="utf-8"
          ) as file:

              categories = json.load(file)

          with open(
              "test/canada_live_streams.json",
              "r",
              encoding="utf-8"
          ) as file:

              streams = json.load(file)

          def normalize(value):

              value = str(
                  value
                  or ""
              ).upper()

              value = value.replace(
                  "&",
                  " AND "
              )

              value = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  value
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()

          def clean_requested_name(value):

              value = str(
                  value
                  or ""
              ).strip()

              value = re.sub(
                  r"^\s*CA\s*:\s*",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              return value.strip()

          def similarity_tokens(value):

              return set(
                  normalize(value).split()
              )

          requested_channels = []

          with open(
              CHANNEL_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              for line in file:

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  if "|" in line:

                      left, right = line.split(
                          "|",
                          1
                      )

                      line = right.strip()

                  channel_name = clean_requested_name(
                      line
                  )

                  if not channel_name:
                      continue

                  requested_channels.append(
                      channel_name
                  )

          unique_requested = []

          seen_requested = set()

          for channel_name in requested_channels:

              normalized = normalize(
                  channel_name
              )

              if normalized in seen_requested:
                  continue

              seen_requested.add(
                  normalized
              )

              unique_requested.append(
                  channel_name
              )

          category_names = {}

          for category in categories:

              category_id = str(
                  category.get(
                      "category_id",
                      ""
                  )
              ).strip()

              category_name = str(
                  category.get(
                      "category_name",
                      ""
                  )
              ).strip()

              if category_id:

                  category_names[
                      category_id
                  ] = category_name

          all_channels = []

          for stream in streams:

              channel_name = str(
                  stream.get(
                      "name",
                      ""
                  )
              ).strip()

              stream_id = str(
                  stream.get(
                      "stream_id",
                      ""
                  )
              ).strip()

              category_id = str(
                  stream.get(
                      "category_id",
                      ""
                  )
              ).strip()

              if not channel_name:
                  continue

              if not stream_id:
                  continue

              all_channels.append(
                  {
                      "name":
                          channel_name,

                      "stream_id":
                          stream_id,

                      "category_id":
                          category_id,

                      "category_name":
                          category_names.get(
                              category_id,
                              ""
                          )
                  }
              )

          def score_match(
              requested,
              provider
          ):

              requested_normalized = normalize(
                  requested
              )

              provider_normalized = normalize(
                  provider
              )

              if not requested_normalized:
                  return 0

              if not provider_normalized:
                  return 0

              if requested_normalized == provider_normalized:

                  return 1000

              requested_tokens = similarity_tokens(
                  requested
              )

              provider_tokens = similarity_tokens(
                  provider
              )

              if not requested_tokens:
                  return 0

              intersection = (
                  requested_tokens
                  &
                  provider_tokens
              )

              score = (
                  len(intersection)
                  * 100
              )

              if requested_normalized in provider_normalized:

                  score += 300

              if provider_normalized in requested_normalized:

                  score += 200

              requested_without_hd = re.sub(
                  r"\bHD\b",
                  "",
                  requested_normalized
              ).strip()

              provider_without_hd = re.sub(
                  r"\bHD\b",
                  "",
                  provider_normalized
              ).strip()

              if (
                  requested_without_hd
                  and
                  requested_without_hd
                  ==
                  provider_without_hd
              ):

                  score += 500

              return score

          matches = {}

          unmatched = []

          for requested in unique_requested:

              best_channel = None

              best_score = 0

              for provider_channel in all_channels:

                  current_score = score_match(
                      requested,
                      provider_channel[
                          "name"
                      ]
                  )

                  if current_score > best_score:

                      best_score = current_score

                      best_channel = provider_channel

              if best_channel is not None and best_score >= 100:

                  matches[
                      normalize(
                          requested
                      )
                  ] = {
                      "requested":
                          requested,

                      "provider":
                          best_channel,

                      "score":
                          best_score
                  }

              else:

                  unmatched.append(
                      requested
                  )

          output_lines = []

          output_lines.append(
              "# CANADA / CA CHANNEL LIST"
          )

          output_lines.append(
              "# MATCHED AGAINST ALL PROVIDER GROUPS AND CHANNELS"
          )

          output_lines.append(
              "# FORMAT: STREAM_ID | FULL PROVIDER CHANNEL NAME"
          )

          output_lines.append(
              "#"
          )

          output_lines.append(
              "# Original requested channel names are preserved as comments"
          )

          output_lines.append(
              "# so the list can be cross-checked and manually edited."
          )

          output_lines.append(
              ""
          )

          for requested in unique_requested:

              key = normalize(
                  requested
              )

              match = matches.get(
                  key
              )

              if not match:

                  output_lines.append(
                      "# UNMATCHED: "
                      + requested
                  )

                  continue

              provider = match[
                  "provider"
              ]

              category_name = provider[
                  "category_name"
              ]

              if category_name:

                  output_lines.append(
                      "# GROUP: "
                      + category_name
                  )

              output_lines.append(
                  "# REQUESTED: CA: "
                  + requested
              )

              output_lines.append(
                  provider[
                      "stream_id"
                  ]
                  + " | "
                  + provider[
                      "name"
                  ]
              )

              output_lines.append(
                  ""
              )

          with open(
              CHANNEL_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(
                      output_lines
                  )
                  + "\n"
              )

          print()
          print(
              "Requested channels:",
              len(
                  unique_requested
              )
          )

          print(
              "Matched channels:",
              len(
                  matches
              )
          )

          print(
              "Unmatched channels:",
              len(
                  unmatched
              )
          )

          print()

          if unmatched:

              print(
                  "UNMATCHED CHANNELS:"
              )

              for channel_name in unmatched:

                  print(
                      " -",
                      channel_name
                  )

          print()
          print(
              "Updated:",
              CHANNEL_FILE
          )

          PY

          echo
          echo "Canada channel ID matching complete"

          echo
          echo "Updated file:"
          ls -lh config/canada_channels.txt

          echo
          echo "Preview:"
          cat config/canada_channels.txt

      - name: Commit Canada channel IDs
        run: |

          git config --global user.name "github-actions"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/canada_channels.txt

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit \
              -m "Update Canada channel IDs"

            git pull \
              --rebase \
              origin main

            git push \
              origin HEAD:main

          fi
