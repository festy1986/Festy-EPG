name: Fetch curated 24/7 channel logos

on:
  workflow_dispatch:
  push:
    paths:
      - config/247-curated-list.txt

permissions:
  contents: write

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Fetch logos in batches of three
        env:
          CURATED_LIST: config/247-curated-list.txt
          BATCH_SIZE: '3'
          BATCH_WAIT_SECONDS: '3'
        run: |
          set -u -o pipefail
          api='https://logos.fandom.com/api.php'
          agent='festy-epg-247logos/1.0'
          mkdir -p 247logos
          [[ -f "$CURATED_LIST" ]] || { echo "Missing $CURATED_LIST" >&2; exit 1; }
          [[ -s 247logos/review.csv ]] || printf 'channel_id,channel_name,reason\n' > 247logos/review.csv
          [[ -s 247logos/fallbacks.csv ]] || printf 'channel_id,channel_name\n' > 247logos/fallbacks.csv

          clean_name() { sed -E 's/^[A-Za-z]{2,3}:[[:space:]]*//' <<< "$1"; }
          slug() { clean_name "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g'; }
          normalise() { tr '[:upper:]' '[:lower:]' <<< "$1" | sed -E 's/[^a-z0-9]//g'; }
          csv() { sed 's/"/""/g' <<< "$1" | tr -d '\n'; }
          review() { printf '"%s","%s","%s"\n' "$(csv "$1")" "$(csv "$2")" "$(csv "$3")" >> 247logos/review.csv; }
          render_fallback_png() {
            local title="$1" target="$2"
            convert -size 1200x675 xc:'#1c1c1c' -stroke '#e50914' -strokewidth 6 -fill none -draw 'roundrectangle 25,25 1175,650 18,18' -stroke none -fill white -font DejaVu-Sans-Bold -gravity center -pointsize 72 -annotate 0 "$title" "$target"
          }
          fallback() {
            local id="$1" title="$2" target="$3"
            render_fallback_png "$title" "$target"
            grep -Fq "\"${id}\"," 247logos/fallbacks.csv || printf '"%s","%s"\n' "$(csv "$id")" "$(csv "$title")" >> 247logos/fallbacks.csv
          }
          request() { curl --silent --fail --location --user-agent "$agent" "$@"; }
          checkpoint() {
            git add -A 247logos
            git diff --cached --quiet && return 0
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Checkpoint curated 24/7 channel logos"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          }

          # Replace only the prior fallback SVGs listed in fallbacks.csv with PNGs.
          while IFS=, read -r quoted_id quoted_title; do
            id=${quoted_id//\"/}; title=${quoted_title%\"}; title=${title#\"}
            for old_svg in 247logos/"$id"-*.svg; do
              [[ -f "$old_svg" ]] || continue
              render_fallback_png "$title" "${old_svg%.svg}.png"
              rm -f "$old_svg"
            done
          done < <(tail -n +2 247logos/fallbacks.csv)

          process_channel() {
            local channel_id="$1" original_name="$2" title key prefix page wanted image asset image_url mime extension duplicate
            channel_id=$(sed -E 's/^[[:space:]]+|[[:space:]]+$//g' <<< "$channel_id")
            original_name=$(sed -E 's/^[[:space:]]+|[[:space:]]+$//g' <<< "$original_name")
            [[ "$channel_id" =~ ^[0-9]+$ ]] || return 0
            title=$(clean_name "$original_name")
            key=$(slug "$original_name")
            prefix="${channel_id}-${key}"
            compgen -G "247logos/${prefix}.*" > /dev/null && return 0

            duplicate=$(find 247logos -maxdepth 1 -type f -name "*-${key}.*" ! -name review.csv ! -name fallbacks.csv -print -quit)
            if [[ -n "$duplicate" ]]; then
              cp "$duplicate" "247logos/${prefix}.${duplicate##*.}"
              return 0
            fi

            page=$(request --get "$api" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode "titles=${title// /_}" --data-urlencode redirects=1 | jq -r '.query.pages[0] | select(.missing != true) | .title // empty' 2>/dev/null || true)
            if [[ -z "$page" ]]; then
              wanted=$(normalise "$title")
              page=$(request --get "$api" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode list=search --data-urlencode "srsearch=\"${title}\"" --data-urlencode srnamespace=0 --data-urlencode srlimit=10 | jq -r --arg wanted "$wanted" '[.query.search[] | select((.title | ascii_downcase | gsub("[^a-z0-9]"; "")) == $wanted)][0].title // empty' 2>/dev/null || true)
            fi
            if [[ -z "$page" ]]; then
              review "$channel_id" "$original_name" 'no exact Logopedia page found'; fallback "$channel_id" "$title" "247logos/${prefix}.png"; return 0
            fi

            image=$(request --get "$api" --data-urlencode action=parse --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode "page=$page" --data-urlencode prop=images | jq -r '[.parse.images[] | select(test("logo"; "i") and (test("card|intertitle|screenshot|promo|background"; "i") | not))][0] // .parse.images[0] // empty' 2>/dev/null || true)
            if [[ -z "$image" ]]; then
              review "$channel_id" "$original_name" 'Logopedia page has no image'; fallback "$channel_id" "$title" "247logos/${prefix}.png"; return 0
            fi

            asset=$(request --get "$api" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode "titles=File:$image" --data-urlencode prop=imageinfo --data-urlencode 'iiprop=url|mime' | jq -r '.query.pages[0].imageinfo[0] | select(.) | [.url,.mime] | @tsv' 2>/dev/null || true)
            if [[ -z "$asset" ]]; then
              review "$channel_id" "$original_name" 'Logopedia image URL unavailable'; fallback "$channel_id" "$title" "247logos/${prefix}.png"; return 0
            fi
            image_url=${asset%%$'\t'*}; mime=${asset#*$'\t'}
            case "$mime" in image/png) extension=.png;; image/jpeg) extension=.jpg;; image/webp) extension=.webp;; image/gif) extension=.gif;; image/svg+xml) extension=.svg;; *) extension=.png;; esac
            if ! request -o "247logos/${prefix}${extension}" "$image_url"; then
              rm -f "247logos/${prefix}${extension}"; review "$channel_id" "$original_name" 'Logopedia image download unavailable'; fallback "$channel_id" "$title" "247logos/${prefix}.png"
            fi
          }

          total=$(grep -Ec '^[[:space:]]*[0-9]+[[:space:]]*\|' "$CURATED_LIST" || true)
          echo "Found $total channels. Processing $BATCH_SIZE at a time, then waiting $BATCH_WAIT_SECONDS seconds."
          pids=(); batch=0; completed_batches=0
          while IFS='|' read -r id name; do
            [[ "$id" =~ [0-9] ]] || continue
            process_channel "$id" "$name" & pids+=("$!"); batch=$((batch + 1))
            if [[ "$batch" -eq "$BATCH_SIZE" ]]; then
              for pid in "${pids[@]}"; do wait "$pid" || true; done
              pids=(); batch=0; completed_batches=$((completed_batches + 1))
              # Save progress after every 50 batches (about 150 channels).
              if (( completed_batches % 50 == 0 )); then checkpoint; fi
              sleep "$BATCH_WAIT_SECONDS"
            fi
          done < "$CURATED_LIST"
          for pid in "${pids[@]}"; do wait "$pid" || true; done

          logos=$(find 247logos -maxdepth 1 -type f ! -name review.csv ! -name fallbacks.csv | wc -l)
          fallbacks=$(( $(wc -l < 247logos/fallbacks.csv) - 1 ))
          echo "Completed: $logos logo files, $fallbacks text fallbacks."
          {
            echo '## Curated logo fetch complete'
            echo "- Curated channels: $total"
            echo "- Logo files: $logos"
            echo "- Text fallbacks: $fallbacks"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated logos
        run: |
          git add -A 247logos
          if git diff --cached --quiet; then echo "No new logos to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add curated 24/7 channel logos"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
