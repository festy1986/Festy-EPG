name: Generate 24/7 Guide

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate 24/7 guide
        run: python generate_247.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}


      - name: Commit generated guide and metadata cache
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add guides/24-7.xml metadata_cache.json

          git diff --cached --quiet || git commit -m "Update 24/7 guide and metadata cache"

          git push
