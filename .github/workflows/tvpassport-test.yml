name: TVPassport TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tvpassport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Create TEST TVPassport channel source
        run: |
          mkdir -p epg/sites/tvpassport.com

          cat > epg/sites/tvpassport.com/festy-tvpassport-test.channels.xml <<'EOFXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channels>
            <channel site="tvpassport.com" site_id="fox-wfxt-boston-ma-hd/3657" xmltv_id="FOX..us">FOX Boston</channel>
            <channel site="tvpassport.com" site_id="nbc-wbtscd-nashua-nh-hd/30964" xmltv_id="NBC.BOSTON.us">NBC Boston</channel>
            <channel site="tvpassport.com" site_id="adult-swim--east-hd/7336" xmltv_id="ADULT.SWIM.us">Adult Swim</channel>
            <channel site="tvpassport.com" site_id="home-network-hd/8793" xmltv_id="HOME.NETWORK.ca">Home Network</channel>
            <channel site="tvpassport.com" site_id="cbs-wbz-boston-ma-hd/3653" xmltv_id="CBS.BOSTON.us">CBS Boston</channel>
          </channels>
          EOFXML

          echo "TEST channels:"
          cat epg/sites/tvpassport.com/festy-tvpassport-test.channels.xml

      - name: Write diagnostic TVPassport config
        run: |
          cat > epg/sites/tvpassport.com/tvpassport.com.config.js <<'EOFJS'
          const axios = require('axios')
          const dayjs = require('dayjs')
          const cheerio = require('cheerio')
          const utc = require('dayjs/plugin/utc')
          const timezone = require('dayjs/plugin/timezone')
          const customParseFormat = require('dayjs/plugin/customParseFormat')

          dayjs.extend(utc)
          dayjs.extend(timezone)
          dayjs.extend(customParseFormat)

          module.exports = {
            site: 'tvpassport.com',
            days: 14,

            url({ channel, date }) {
              return `https://www.tvpassport.com/tv-listings/stations/${channel.site_id}/${date.format('YYYY-MM-DD')}`
            },

            async request() {
              return {
                timeout: 30000,
                headers: {
                  Cookie: await getCookie(),
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            parser({ content, channel, date }) {
              const programs = []
              const currentTimezone = parseCurrentTimezone(content)
              const items = parseItems(content)

              const rawStarts = items
                .map(item => {
                  const $item = cheerio.load(item)
                  return $item('*').data('st')
                })
                .filter(Boolean)
                .map(String)
                .sort()

              const firstReturned = rawStarts.length ? rawStarts[0] : 'NONE'
              const lastReturned = rawStarts.length ? rawStarts[rawStarts.length - 1] : 'NONE'

              console.log(
                `[PULL] ${channel.name} | requested=${date.format('YYYY-MM-DD')} | ` +
                `programs=${items.length} | returned=${firstReturned} -> ${lastReturned} | ` +
                `timezone=${currentTimezone}`
              )

              for (const item of items) {
                const $item = cheerio.load(item)
                const start = parseStart($item, currentTimezone)
                const duration = parseDuration($item)
                const stop = start.add(duration, 'm')

                const title = parseTitle($item)
                const description = parseDescription($item)

                programs.push({
                  title,
                  description,
                  start,
                  stop
                })
              }

              return programs
            }
          }

          async function getCookie() {
            const res = await axios.get('https://www.tvpassport.com/tv-listings')
            const setCookie = res.headers['set-cookie']

            if (!setCookie || setCookie.length === 0) return ''

            const cookies = setCookie.map(cookie => cookie.split(';')[0])
            return cookies.join('; ')
          }

          function parseDescription($item) {
            return $item('*').data('description') || ''
          }

          function parseTitle($item) {
            return $item('*').data('showname')?.toString() || ''
          }

          function parseStart($item, currentTimezone) {
            const time = $item('*').data('st')
            return dayjs.tz(time, 'YYYY-MM-DD HH:mm:ss', currentTimezone)
          }

          function parseDuration($item) {
            const duration = $item('*').data('duration')
            return parseInt(duration || 0, 10)
          }

          function parseItems(content) {
            if (!content) return []

            const $ = cheerio.load(content)
            return $('[data-st][data-duration][data-showname]').toArray()
          }

          function parseCurrentTimezone(content) {
            if (!content) return 'America/New_York'

            const $ = cheerio.load(content)
            return $('#timezone_selector').val() || 'America/New_York'
          }
          EOFJS

      - name: Grab TEST TVPassport guide
        run: |
          cd epg

          rm -f ../TVPassport.TEST.xml
          rm -f ../TVPassport.TEST.log

          EASTERN_TODAY=$(TZ=America/New_York date +%Y-%m-%d)

          echo "Starting TEST guide from: $EASTERN_TODAY"
          echo "Requesting 14 days"

          export CURR_DATE="${EASTERN_TODAY}T12:00:00Z"

          set +e

          npx tsx scripts/commands/epg/grab.ts \
            --channels=sites/tvpassport.com/festy-tvpassport-test.channels.xml \
            --output="../TVPassport.TEST.xml" \
            --days=14 \
            --maxConnections=5 \
            2>&1 | tee "../TVPassport.TEST.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "============================================================"
          echo "DIAGNOSTIC PULL RESULTS"
          echo "============================================================"

          grep '\[PULL\]' ../TVPassport.TEST.log || true

          echo ""
          echo "============================================================"
          echo "DUPLICATE / DATE SUMMARY"
          echo "============================================================"

          cd ..

          node <<'EOFJS'
          const fs = require('fs')

          const path = 'TVPassport.TEST.xml'

          if (!fs.existsSync(path)) {
            console.log('TEST XML was not created.')
            process.exit(0)
          }

          const xml = fs.readFileSync(path, 'utf8')

          const channels = [
            ['FOX Boston', 'FOX..us'],
            ['NBC Boston', 'NBC.BOSTON.us'],
            ['Adult Swim', 'ADULT.SWIM.us'],
            ['Home Network', 'HOME.NETWORK.ca'],
            ['CBS Boston', 'CBS.BOSTON.us']
          ]

          for (const [name, id] of channels) {
            const escapedId = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')

            const blocks = [
              ...xml.matchAll(
                new RegExp(
                  `<programme\\b[^>]*channel="${escapedId}"[^>]*>[\\s\\S]*?<\\/programme>`,
                  'gi'
                )
              )
            ].map(match => match[0])

            const pairs = new Set()
            const starts = []
            const stops = []

            for (const block of blocks) {
              const open = block.match(/^<programme\b([^>]*)>/i)?.[1] || ''

              const start = open.match(/\bstart="([^"]+)"/i)?.[1] || ''
              const stop = open.match(/\bstop="([^"]+)"/i)?.[1] || ''

              if (start || stop) {
                pairs.add(`${start}|${stop}`)
              }

              if (start) starts.push(start)
              if (stop) stops.push(stop)
            }

            starts.sort()
            stops.sort()

            console.log('')
            console.log(name)
            console.log(`  programme rows: ${blocks.length}`)
            console.log(`  unique start/stop pairs: ${pairs.size}`)
            console.log(`  earliest start: ${starts.length ? starts[0] : 'NONE'}`)
            console.log(`  latest stop: ${stops.length ? stops[stops.length - 1] : 'NONE'}`)
          }
          EOFJS

          echo ""
          echo "grab.ts exit status: $STATUS"

          exit "$STATUS"
