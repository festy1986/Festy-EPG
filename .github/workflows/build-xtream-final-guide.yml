name: Build 24/7 Xtream Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Build 24/7 Guide
      run: |
        python3 <<'PY'

        import json
        import xml.etree.ElementTree as ET
        import re
        import gzip
        import os
        from datetime import datetime, timedelta


        CHANNEL_FILE = "xtream-epg/channels.json"
        INPUT_XML = "xtream-epg/xtream.xml"

        OUTPUT_XML = "guides/24-7.xml"
        OUTPUT_GZ = "guides/24-7.xml.gz"

        DISPLAY_FILE = "guides/24-7-channel-list.txt"


        os.makedirs("guides", exist_ok=True)


        print("Loading channels")

        with open(CHANNEL_FILE, "r", encoding="utf-8") as f:
            channels = json.load(f)


        print("Total channels:", len(channels))


        #
        # Load existing guide
        #

        tree = ET.parse(INPUT_XML)
        root = tree.getroot()


        existing = set()

        for p in root.findall("programme"):
            existing.add(
                p.get("channel")
            )


        now = datetime.utcnow()
        future = now + timedelta(days=7)



        def clean_name(name):

            remove = [
                "4K",
                "8K",
                "HD",
                "FHD",
                "UHD",
                "RAW",
                "LIVE",
                "EXCLUSIVE"
            ]

            name = re.sub(
                r'^(US|CA|UK|GB):\s*',
                '',
                name,
                flags=re.I
            )


            for item in remove:
                name = re.sub(
                    r'\b' + item + r'\b',
                    '',
                    name,
                    flags=re.I
                )


            name = re.sub(
                r'\s+',
                ' ',
                name
            )


            return name.strip(" #-")



        def find_time(name):

            match = re.search(
                r'(\d{1,2}):(\d{2})',
                name
            )

            if not match:
                return None


            hour = int(match.group(1))
            minute = match.group(2)


            suffix = "AM"

            if hour >= 12:
                suffix = "PM"


            hour = hour % 12

            if hour == 0:
                hour = 12


            return f"{hour}:{minute} {suffix}"



        added = 0



        with open(DISPLAY_FILE, "w", encoding="utf-8") as display:


            display.write(
                "24/7 CHANNEL DISPLAY LIST\n"
                "=========================\n\n"
            )


            for channel in channels:


                cid = str(
                    channel.get("stream_id")
                )


                raw_name = (
                    channel.get("name")
                    or "Unknown"
                )


                display_name = clean_name(
                    raw_name
                )


                display.write(
                    f"{cid} | {display_name}\n"
                )


                #
                # Only create fake guide if none exists
                #

                if cid not in existing:


                    title = display_name


                    t = find_time(raw_name)

                    if t:
                        title = title.replace(
                            t,
                            ""
                        ).strip()


                    programme = ET.SubElement(
                        root,
                        "programme",
                        {
                            "start":
                            now.strftime(
                                "%Y%m%d%H%M%S +0000"
                            ),

                            "stop":
                            future.strftime(
                                "%Y%m%d%H%M%S +0000"
                            ),

                            "channel": cid
                        }
                    )


                    title_node = ET.SubElement(
                        programme,
                        "title"
                    )

                    title_node.text = title


                    added += 1



        ET.indent(root)


        tree.write(
            OUTPUT_XML,
            encoding="utf-8",
            xml_declaration=True
        )


        #
        # gzip XMLTV
        #

        with open(
            OUTPUT_XML,
            "rb"
        ) as source:

            with gzip.open(
                OUTPUT_GZ,
                "wb"
            ) as gz:

                gz.writelines(source)



        print()
        print("Missing guide entries created:", added)
        print("Created:", OUTPUT_GZ)
        print("Created:", DISPLAY_FILE)


        PY



    - name: Upload 24/7 Guide
      uses: actions/upload-artifact@v4
      with:
        name: 24-7-guide
        path: |
          guides/24-7.xml.gz
          guides/24-7-channel-list.txt
