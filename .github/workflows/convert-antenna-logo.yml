name: Convert Antenna Logo PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-antenna-logo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SVG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Convert Antenna SVG to PNG and remove SVG files
        run: |
          set -e

          INPUT="logos/Antenna_TV_logo.svg"
          OUTPUT="logos/Antenna_TV_logo.png"

          if [ ! -f "$INPUT" ]; then
            echo "Missing $INPUT"
            exit 1
          fi

          rsvg-convert "$INPUT" -w 512 -h 512 -o "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "PNG conversion failed"
            exit 1
          fi

          find logos -type f -name "*.svg" -delete

          echo "Created $OUTPUT"
          echo "Deleted all .svg files in logos/"

      - name: Commit converted PNG and SVG cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logos

          if git diff --cached --quiet; then
            echo "No logo changes to commit"
            exit 0
          fi

          git commit -m "Convert Antenna logo to PNG and remove SVG files"
          git push
