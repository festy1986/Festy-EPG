name: FAST Channel Matching Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match-fast-channels:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify fastchannels.txt
        run: |
          if [ ! -f "fastchannels.txt" ]; then
            echo "fastchannels.txt was not found"
            exit 1
          fi

          echo "fastchannels.txt found"
          echo "Provider channel records:"
          wc -l fastchannels.txt

          echo ""
          echo "File size:"
          ls -lh fastchannels.txt

      - name: Download Jessman FAST guide
        run: |
          mkdir -p fast

          echo "Downloading Jessman FAST guide..."

          curl -L --fail --retry 5 --retry-delay 10 "https://epg.guru/7dayiptv/USFast.xml" -o fast/source.xml

          test -s fast/source.xml

          echo ""
          echo "Jessman FAST guide downloaded"
          ls -lh fast/source.xml

      - name: Match provider channels against FAST guide
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          import xml.etree.ElementTree as ET

          from collections import defaultdict


          PROVIDER_FILE = "fastchannels.txt"
          GUIDE_FILE = "fast/source.xml"
          REPORT_FILE = "fast/match-report.txt"


          # --------------------------------------------------
          # Normalize channel names for matching
          # --------------------------------------------------

          def normalize_text(value):

              if not value:
                  return ""

              value = str(value)

              value = unicodedata.normalize(
                  "NFKC",
                  value
              )

              value = value.upper()

              # Remove country prefixes
              value = re.sub(
                  r"^\s*(US|UK|CA|AU)\s*:\s*",
                  "",
                  value
              )

              # Remove provider-specific prefixes
              value = re.sub(
                  r"^\s*-\s*NO EVENT STREAMING\s*-\s*\|\s*",
                  "",
                  value
              )

              value = re.sub(
                  r"^\s*8K EXCLUSIVE\s*\|\s*",
                  "",
                  value
              )

              # Remove quality markers
              value = re.sub(
                  r"\b(HD|FHD|UHD|SD|4K|8K)\b",
                  "",
                  value
              )

              # Remove RAW/FPS/codec markers
              value = re.sub(
                  r"\bRAW\b",
                  "",
                  value
              )

              value = re.sub(
                  r"\b\d+\s*FPS\b",
                  "",
                  value
              )

              value = re.sub(
                  r"\b(HEVC|H265|H\.265|H264|H\.264)\b",
                  "",
                  value
              )

              # Remove audio markers
              value = re.sub(
                  r"\b(DOLBY|AUDIO|ATMOS)\b",
                  "",
                  value
              )

              # Convert punctuation to spaces
              value = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  value
              )

              # Normalize spaces
              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # --------------------------------------------------
          # Load provider channels
          # --------------------------------------------------

          provider_channels = []

          with open(
              PROVIDER_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              for line_number, line in enumerate(
                  file,
                  1
              ):

                  line = line.strip()

                  if not line:
                      continue

                  try:

                      channel = json.loads(line)

                  except Exception as error:

                      print(
                          f"WARNING: Could not parse line "
                          f"{line_number}: {error}"
                      )

                      continue

                  name = str(
                      channel.get(
                          "name",
                          ""
                      )
                  ).strip()

                  stream_id = str(
                      channel.get(
                          "stream_id",
                          ""
                      )
                  )

                  if not name:
                      continue

                  provider_channels.append(
                      {
                          "name": name,
                          "normalized": normalize_text(name),
                          "stream_id": stream_id,
                          "num": channel.get(
                              "num",
                              ""
                          ),
                          "category_id": channel.get(
                              "category_id",
                              ""
                          )
                      }
                  )


          print("")

          print(
              f"Provider channels loaded: "
              f"{len(provider_channels)}"
          )


          if not provider_channels:

              raise SystemExit(
                  "No provider channels were loaded"
              )


          # --------------------------------------------------
          # Read Jessman channels
          # --------------------------------------------------

          guide_channel_names = defaultdict(list)

          guide_channel_count = 0


          print("")

          print(
              "Reading Jessman FAST channel list..."
          )


          for event, element in ET.iterparse(
              GUIDE_FILE,
              events=("end",)
          ):

              if element.tag == "channel":

                  guide_channel_count += 1

                  channel_id = element.get(
                      "id",
                      ""
                  ).strip()

                  display_names = []

                  for display_name in element.findall(
                      "display-name"
                  ):

                      if display_name.text:

                          display_names.append(
                              display_name.text.strip()
                          )


                  for name in display_names:

                      normalized = normalize_text(
                          name
                      )

                      if normalized:

                          guide_channel_names[
                              normalized
                          ].append(
                              {
                                  "id": channel_id,
                                  "name": name
                              }
                          )


                  element.clear()


          print("")

          print(
              f"Jessman guide channels loaded: "
              f"{guide_channel_count}"
          )


          # --------------------------------------------------
          # Match provider channels
          # --------------------------------------------------

          matched = []

          unmatched = []


          for provider in provider_channels:

              normalized = provider[
                  "normalized"
              ]

              matches = guide_channel_names.get(
                  normalized,
                  []
              )


              if matches:

                  matched.append(
                      {
                          "provider": provider,
                          "guide_matches": matches
                      }
                  )

              else:

                  unmatched.append(
                      provider
                  )


          # --------------------------------------------------
          # Write report
          # --------------------------------------------------

          with open(
              REPORT_FILE,
              "w",
              encoding="utf-8"
          ) as report:

              report.write(
                  "FAST CHANNEL MATCH REPORT\n"
              )

              report.write(
                  "=========================\n\n"
              )

              report.write(
                  f"Provider channels: "
                  f"{len(provider_channels)}\n"
              )

              report.write(
                  f"Matched channels: "
                  f"{len(matched)}\n"
              )

              report.write(
                  f"Unmatched channels: "
                  f"{len(unmatched)}\n\n"
              )


              report.write(
                  "MATCHED CHANNELS\n"
              )

              report.write(
                  "================\n\n"
              )


              for item in matched:

                  provider = item[
                      "provider"
                  ]

                  report.write(
                      f"PROVIDER: "
                      f"{provider['name']}\n"
                  )

                  report.write(
                      f"STREAM ID: "
                      f"{provider['stream_id']}\n"
                  )

                  report.write(
                      f"NORMALIZED: "
                      f"{provider['normalized']}\n"
                  )

                  report.write(
                      "GUIDE MATCHES:\n"
                  )


                  for guide in item[
                      "guide_matches"
                  ]:

                      report.write(
                          f"  {guide['name']}"
                          f" | ID: "
                          f"{guide['id']}\n"
                      )


                  report.write(
                      "\n"
                  )


              report.write(
                  "\n"
              )


              report.write(
                  "UNMATCHED CHANNELS\n"
              )

              report.write(
                  "==================\n\n"
              )


              for provider in unmatched:

                  report.write(
                      f"{provider['name']}"
                      f" | STREAM ID: "
                      f"{provider['stream_id']}"
                      f" | NORMALIZED: "
                      f"{provider['normalized']}\n"
                  )


          # --------------------------------------------------
          # Console summary
          # --------------------------------------------------

          print("")

          print(
              "======================================"
          )

          print(
              "FAST MATCHING COMPLETE"
          )

          print(
              "======================================"
          )

          print("")

          print(
              f"Provider channels: "
              f"{len(provider_channels)}"
          )

          print(
              f"Matched channels: "
              f"{len(matched)}"
          )

          print(
              f"Unmatched channels: "
              f"{len(unmatched)}"
          )

          print("")

          print(
              f"Report created: "
              f"{REPORT_FILE}"
          )

          print("")

          print(
              "First 25 unmatched channels:"
          )

          for provider in unmatched[:25]:

              print(
                  f"  {provider['name']}"
              )

          PY

      - name: Show matching results
        run: |
          echo "======================================"
          echo "FAST MATCHING RESULTS"
          echo "======================================"

          echo ""

          ls -lh fast/match-report.txt

          echo ""

          echo "Report preview:"

          head -n 100 fast/match-report.txt

      - name: Commit matching report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add fast/match-report.txt

          git commit -m "Add FAST channel match report" || echo "No changes"

          git push
