name: Build Premium Test Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-guide:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build temporary premium test guide
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("guides/tvguide.xml")
          out = Path("guides/premium-test.xml")

          raw = src.read_text(encoding="utf-8", errors="ignore")

          candidates = [
              # HBO official/current names
              ("HBO.MOVIES.TEST.us", "HBO MOVIES TEST", "HBO.ZONE.us", "HBO Zone / Movies"),
              ("HBO.HITS.TEST.us", "HBO HITS TEST", "HBO.HITS.us", "HBO Hits"),
              ("HBO.DRAMA.TEST.us", "HBO DRAMA TEST", "HBO.DRAMA.us", "HBO Drama"),
              ("HBO.COMEDY.TEST.us", "HBO COMEDY TEST", "HBO.COMEDY.us", "HBO Comedy"),
              ("HBO.LATINO.TEST.us", "HBO LATINO TEST", "HBO.LATINO.us", "HBO Latino"),
              ("HBO.FAMILY.TEST.us", "HBO FAMILY TEST", "HBO.FAMILY.us", "HBO Family"),
              ("HBO.SIGNATURE.TEST.us", "HBO SIGNATURE TEST", "HBO.SIGNATURE.us", "HBO Signature old"),
              ("HBO2.TEST.us", "HBO2 TEST", "HBO2.us", "HBO2 old"),

              # Raw duplicated HBO.us site_id candidates
              ("HBO.RAW.1.TEST.us", "HBO RAW 1 TEST", "HBO.us", "9100002976#9233009491"),
              ("HBO.RAW.2.TEST.us", "HBO RAW 2 TEST", "HBO.us", "9100002976#9233001970"),
              ("HBO.RAW.3.TEST.us", "HBO RAW 3 TEST", "HBO.us", "9100002976#9200000652"),
              ("HBO.RAW.4.TEST.us", "HBO RAW 4 TEST", "HBO.us", "9100002976#9233011831"),
              ("HBO.RAW.5.TEST.us", "HBO RAW 5 TEST", "HBO.us", "9100002976#9233000263"),
              ("HBO.RAW.6.TEST.us", "HBO RAW 6 TEST", "HBO.us", "9100002976#9200009688"),
              ("HBO.RAW.7.TEST.us", "HBO RAW 7 TEST", "HBO.us", "9100002976#9200016631"),
              ("HBO.RAW.8.TEST.us", "HBO RAW 8 TEST", "HBO.us", "9100002976#9233009922"),

              # Showtime Showcase raw candidates
              ("SHOWCASE.RAW.1.TEST.us", "SHOWCASE RAW 1 TEST", "SHOWTIME.SHOWCASE.us", "9100002976#9233017279"),
              ("SHOWCASE.RAW.2.TEST.us", "SHOWCASE RAW 2 TEST", "SHOXBET.us", "9100002976#9200022063"),
              ("SHOWCASE.RAW.3.TEST.us", "SHOWCASE RAW 3 TEST", "SHO.us", "9100002976#9233003805"),
              ("SHOWCASE.RAW.4.TEST.us", "SHOWCASE RAW 4 TEST", "SHO.us", "9100002976#9233015599"),
              ("SHOWCASE.RAW.5.TEST.us", "SHOWCASE RAW 5 TEST", "SHO.us", "9100002976#9200002670"),
              ("SHOWCASE.RAW.6.TEST.us", "SHOWCASE RAW 6 TEST", "SHO.us", "9100002976#9200000854"),
              ("SHOWCASE.RAW.7.TEST.us", "SHOWCASE RAW 7 TEST", "SHO.us", "9100002976#9200004693"),
              ("SHOWCASE.RAW.8.TEST.us", "SHOWCASE RAW 8 TEST", "SHO.us", "9100002976#9233005988"),
              ("SHOWCASE.RAW.9.TEST.us", "SHOWCASE RAW 9 TEST", "SHO.us", "9100002976#9233009930"),
              ("SHOWCASE.RAW.10.TEST.us", "SHOWCASE RAW 10 TEST", "SHO.us", "9100002976#9200012474"),
          ]

          def find_site_id(xmltv_id, explicit):
              if explicit.startswith("9100002976#"):
                  return explicit
              m = re.search(
                  rf'<channel\s+site="tvguide\.com"\s+lang="en"\s+xmltv_id="{re.escape(xmltv_id)}"\s+site_id="([^"]+)">[^<]+</channel>',
                  raw
              )
              return m.group(1) if m else None

          lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<channels>']
          missing = []

          for test_id, display, source_xmltv, source_or_site in candidates:
              site_id = find_site_id(source_xmltv, source_or_site)
              if not site_id:
                  missing.append((test_id, source_xmltv, source_or_site))
                  continue
              lines.append(
                  f'  <channel site="tvguide.com" lang="en" xmltv_id="{test_id}" site_id="{site_id}">{display}</channel>'
              )

          lines.append('</channels>')
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Wrote", out)
          print("Missing source candidates:")
          for item in missing:
              print("  ", item)
          PY

      - name: Show test guide
        run: cat guides/premium-test.xml

      - name: Commit premium test guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add guides/premium-test.xml
          git commit -m "Add premium test guide" || exit 0
          git push
