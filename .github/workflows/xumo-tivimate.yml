name: Xumo-Tivimate

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */12 * * *"

permissions:
  contents: write

concurrency:
  group: xumo-guide-writes-main
  cancel-in-progress: false

jobs:
  build-xumo-tivimate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Write custom Xumo config
        run: |
          mkdir -p epg/sites/xumo.tv

          cat > epg/sites/xumo.tv/xumo.tv.config.js <<'EOF'
          const axios = require('axios')
          const dayjs = require('dayjs')

          const API_ENDPOINT = 'https://valencia-app-mds.xumo.com/v2'
          const XUMO_TIMEOUT = Number(process.env.XUMO_TIMEOUT || 15000)

          const client = axios.create({
            baseURL: API_ENDPOINT,
            responseType: 'arraybuffer',
            timeout: XUMO_TIMEOUT,
            headers: {
              Referer: 'https://www.xumo.tv/',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
            }
          })

          module.exports = {
            site: 'xumo.tv',
            delay: 200,
            days: 2,

            request: {
              method: 'GET',
              timeout: XUMO_TIMEOUT,
              cache: {
                ttl: 60 * 60 * 1000
              },
              headers() {
                return {
                  Referer: 'https://www.xumo.tv/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            url({ date, channel }) {
              const [offset] = String(channel.site_id).split('#')

              return `${API_ENDPOINT}/epg/10006/${date.format(
                'YYYYMMDD'
              )}/0.json?f=asset.title&f=asset.descriptions&limit=50&offset=${offset}`
            },

            async parser({ content, channel, date }) {
              let programs = []
              let items = parseItems(content, channel)
              if (!items.length) return programs

              const d = date.format('YYYYMMDD')
              const [offset] = String(channel.site_id).split('#')

              const promises = [
                client.get(`/epg/10006/${d}/1.json?f=asset.title&f=asset.descriptions&limit=50&offset=${offset}`),
                client.get(`/epg/10006/${d}/2.json?f=asset.title&f=asset.descriptions&limit=50&offset=${offset}`),
                client.get(`/epg/10006/${d}/3.json?f=asset.title&f=asset.descriptions&limit=50&offset=${offset}`)
              ]

              const results = await Promise.allSettled(promises)
              results.forEach(r => {
                if (r.status === 'fulfilled') {
                  items = items.concat(parseItems(r.value.data, channel))
                }
              })

              items.forEach(item => {
                const title = cleanTitle(item.title)
                const episodeTitle = cleanSpaces(item.episodeTitle || item.subtitle || item.subTitle || '')
                const description = cleanSpaces(parseDescription(item) || '')

                const program = {
                  title,
                  description: buildPackedDescription({ episodeTitle, description }),
                  start: parseStart(item),
                  stop: parseStop(item),
                  category: guessCategories(item)
                }

                programs.push(program)
              })

              console.log(`[XUMO PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${programs.length}`)
              return programs
            },

            async channels() {
              const channels = await axios
                .get(`${API_ENDPOINT}/channels/list/10006.json?sort=hybrid&geoId=unknown`, {
                  timeout: XUMO_TIMEOUT,
                  headers: {
                    Referer: 'https://www.xumo.tv/',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                  }
                })
                .then(r => r.data.channel.item)
                .catch(err => {
                  console.log(`[XUMO CHANNEL LIST FAIL] ${err.message}`)
                  return []
                })

              const promises = []
              for (let offset = 0; offset <= 450; offset += 50) {
                promises.push(
                  axios.get(`${API_ENDPOINT}/epg/10006/19700101/0.json?limit=50&offset=${offset}`, {
                    timeout: XUMO_TIMEOUT,
                    headers: {
                      Referer: 'https://www.xumo.tv/',
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                    }
                  })
                )
              }

              const output = []
              const seen = new Set()
              const results = await Promise.allSettled(promises)

              results.forEach((r, i) => {
                if (r.status !== 'fulfilled') return

                const dataChannels = r.value.data?.channels || []
                dataChannels.forEach(item => {
                  const info = channels.find(c => String(c.guid?.value || '') === String(item.channelId))
                  const name = cleanSpaces(info?.title || item.callsign || item.title || item.channelId)
                  const siteId = `${i * 50}#${item.channelId}`

                  if (!name || !item.channelId || seen.has(siteId)) return
                  seen.add(siteId)

                  output.push({
                    lang: 'en',
                    site_id: siteId,
                    name
                  })
                })
              })

              console.log(`[XUMO CHANNELS] built=${output.length}`)
              return output
            }
          }

          function parseDescription(item) {
            if (!item.descriptions) return null
            return item.descriptions.medium || item.descriptions.small || item.descriptions.tiny || null
          }

          function parseStart(item) {
            return dayjs(item.start)
          }

          function parseStop(item) {
            return dayjs(item.end)
          }

          function parseItems(content, channel) {
            if (!content) return []

            const [, channelId] = String(channel.site_id).split('#')
            const data = JSON.parse(content)
            if (!data || !Array.isArray(data.channels)) return []

            const channelData = data.channels.find(c => String(c.channelId) === String(channelId))
            if (!channelData || !Array.isArray(channelData.schedule)) return []

            return channelData.schedule
              .map(item => {
                const details = data.assets?.[item.assetId]
                if (!details) return null
                return { ...item, ...details }
              })
              .filter(Boolean)
          }

          function buildPackedDescription({ episodeTitle, description }) {
            const parts = []
            if (episodeTitle) parts.push(episodeTitle)
            if (description) parts.push(description)
            return cleanPackedDescription(parts.join('. '))
          }

          function guessCategories(item) {
            const haystack = [
              item.type,
              item.programType,
              item.entityType,
              item.category,
              item.subcategory,
              item.genres
            ]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            if (/movie|film|feature/.test(haystack)) return ['Movie']
            if (/series|episode|tv show|television/.test(haystack)) return ['Series']
            if (/news/.test(haystack)) return ['News']
            if (/sport|game|match|football|basketball|baseball|hockey|soccer|golf|tennis|racing/.test(haystack)) return ['Sports']
            return ['Program']
          }

          function cleanTitle(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function cleanPackedDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }
          EOF

      - name: Validate curated Xumo channel list
        run: |
          if [ ! -f guides/xumcurated.xml ]; then
            echo "Missing guides/xumcurated.xml"
            exit 1
          fi

          CH=$(grep -c '<channel ' guides/xumcurated.xml || true)
          echo "Curated Xumo channels: $CH"

          if [ "$CH" -lt 1 ]; then
            echo "Invalid curated Xumo channel list - no channels found"
            exit 1
          fi

      - name: Grab Xumo guide with schedule recovery
        run: |
          cd epg

          rm -f ../guides/xumotivimateguide.xml
          rm -f ../guides/xumotivimateguide.pass*.xml
          rm -f ../guides/xumotivimateguide.pass*.log
          rm -f ../guides/xumotivimateguide.pass*.count

          run_pass() {
            PASS_NAME="$1"
            MAX_CONNECTIONS="$2"
            XUMO_TIMEOUT_VALUE="$3"

            echo ""
            echo "============================================================"
            echo "Starting $PASS_NAME"
            echo "maxConnections=$MAX_CONNECTIONS"
            echo "XUMO_TIMEOUT=$XUMO_TIMEOUT_VALUE"
            echo "============================================================"

            export XUMO_TIMEOUT="$XUMO_TIMEOUT_VALUE"

            set +e
            npx tsx scripts/commands/epg/grab.ts \
              --channels=../guides/xumcurated.xml \
              --output="../guides/xumotivimateguide.${PASS_NAME}.xml" \
              --days=2 \
              --maxConnections="$MAX_CONNECTIONS" \
              2>&1 | tee "../guides/xumotivimateguide.${PASS_NAME}.log"

            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -ne 0 ]; then
              echo "$PASS_NAME exited with status $STATUS"
            fi

            if [ ! -f "../guides/xumotivimateguide.${PASS_NAME}.xml" ]; then
              echo "$PASS_NAME did not create an XML file"
              echo "0" > "../guides/xumotivimateguide.${PASS_NAME}.programmes.count"
              echo "0" > "../guides/xumotivimateguide.${PASS_NAME}.descriptions.count"
              echo "999999" > "../guides/xumotivimateguide.${PASS_NAME}.issues.count"
              return 0
            fi

            PR=$(grep -c '<programme ' "../guides/xumotivimateguide.${PASS_NAME}.xml" || true)
            DESC=$(grep -c '<desc ' "../guides/xumotivimateguide.${PASS_NAME}.xml" || true)
            ISSUE_COUNT=$(grep -Eic 'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' "../guides/xumotivimateguide.${PASS_NAME}.log" || true)

            echo "$PR" > "../guides/xumotivimateguide.${PASS_NAME}.programmes.count"
            echo "$DESC" > "../guides/xumotivimateguide.${PASS_NAME}.descriptions.count"
            echo "$ISSUE_COUNT" > "../guides/xumotivimateguide.${PASS_NAME}.issues.count"

            echo "$PASS_NAME programmes: $PR"
            echo "$PASS_NAME descriptions: $DESC"
            echo "$PASS_NAME possible issues: $ISSUE_COUNT"
          }

          run_pass "pass1-fast" 10 15000

          PASS1_ISSUES=$(cat ../guides/xumotivimateguide.pass1-fast.issues.count)

          if [ "$PASS1_ISSUES" -gt 0 ]; then
            echo "Fast pass had possible issues, running backup pass..."
            run_pass "pass2-backup" 5 25000
          else
            echo "Fast pass had no obvious issues. Skipping backup pass."
          fi

          BEST_PASS="pass1-fast"
          BEST_PR=$(cat ../guides/xumotivimateguide.pass1-fast.programmes.count)
          BEST_DESC=$(cat ../guides/xumotivimateguide.pass1-fast.descriptions.count)
          BEST_ISSUES=$(cat ../guides/xumotivimateguide.pass1-fast.issues.count)

          if [ -f ../guides/xumotivimateguide.pass2-backup.programmes.count ]; then
            PASS2_PR=$(cat ../guides/xumotivimateguide.pass2-backup.programmes.count)
            PASS2_DESC=$(cat ../guides/xumotivimateguide.pass2-backup.descriptions.count)
            PASS2_ISSUES=$(cat ../guides/xumotivimateguide.pass2-backup.issues.count)

            if [ "$PASS2_PR" -gt "$BEST_PR" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            elif [ "$PASS2_PR" -eq "$BEST_PR" ] && [ "$PASS2_DESC" -gt "$BEST_DESC" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            elif [ "$PASS2_PR" -eq "$BEST_PR" ] && [ "$PASS2_DESC" -eq "$BEST_DESC" ] && [ "$PASS2_ISSUES" -lt "$BEST_ISSUES" ]; then
              BEST_PASS="pass2-backup"
              BEST_PR="$PASS2_PR"
              BEST_DESC="$PASS2_DESC"
              BEST_ISSUES="$PASS2_ISSUES"
            fi
          fi

          if [ "$BEST_ISSUES" -gt 0 ]; then
            echo "Best pass still had possible issues, running micro pass..."
            run_pass "pass3-micro" 2 40000
          else
            echo "Best pass has no obvious issues. Skipping micro pass."
          fi

          BEST_PASS="pass1-fast"
          BEST_PR=$(cat ../guides/xumotivimateguide.pass1-fast.programmes.count)
          BEST_DESC=$(cat ../guides/xumotivimateguide.pass1-fast.descriptions.count)
          BEST_ISSUES=$(cat ../guides/xumotivimateguide.pass1-fast.issues.count)

          for PASS in pass2-backup pass3-micro; do
            if [ -f "../guides/xumotivimateguide.${PASS}.programmes.count" ]; then
              CANDIDATE_PR=$(cat "../guides/xumotivimateguide.${PASS}.programmes.count")
              CANDIDATE_DESC=$(cat "../guides/xumotivimateguide.${PASS}.descriptions.count")
              CANDIDATE_ISSUES=$(cat "../guides/xumotivimateguide.${PASS}.issues.count")

              if [ "$CANDIDATE_PR" -gt "$BEST_PR" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -gt "$BEST_DESC" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -eq "$BEST_DESC" ] && [ "$CANDIDATE_ISSUES" -lt "$BEST_ISSUES" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              fi
            fi
          done

          echo "Selected best Xumo pass: $BEST_PASS"
          echo "Best programmes: $BEST_PR"
          echo "Best descriptions: $BEST_DESC"
          echo "Best possible issues: $BEST_ISSUES"

          cp "../guides/xumotivimateguide.${BEST_PASS}.xml" "../guides/xumotivimateguide.xml"

          cd ..

      - name: Fill missing Xumo metadata from TVMaze
        run: |
          node <<'EOF'
          const fs = require('fs')

          const guidePath = 'guides/xumotivimateguide.xml'
          const cachePath = 'guides/.tvmaze-xumo-cache.json'

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(guidePath, 'utf8')
          let cache = {}

          if (fs.existsSync(cachePath)) {
            try {
              cache = JSON.parse(fs.readFileSync(cachePath, 'utf8'))
            } catch {
              cache = {}
            }
          }

          const stats = {
            programmes: 0,
            skippedMovies: 0,
            searchedShows: 0,
            matchedShows: 0,
            enriched: 0,
            addedCategories: 0,
            addedDescriptions: 0
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function stripTags(s) {
            return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim())
          }

          function getTag(block, tag) {
            const m = block.match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i'))
            return m ? stripTags(m[1]) : ''
          }

          function getTags(block, tag) {
            return [...block.matchAll(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'gi'))]
              .map(m => stripTags(m[1]))
              .filter(Boolean)
          }

          function hasTag(block, tag) {
            return new RegExp(`<${tag}\\b`, 'i').test(block)
          }

          function hasCategory(block, category) {
            return getTags(block, 'category').some(c => c.toLowerCase() === category.toLowerCase())
          }

          function hasAnyCategory(block) {
            return hasTag(block, 'category')
          }

          function getStartDate(block) {
            const m = block.match(/start="(\d{8})/i)
            if (!m) return ''
            return `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}`
          }

          function cleanTitleForSearch(title) {
            return String(title || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function isMovie(block) {
            if (hasCategory(block, 'Movie')) return true
            if (hasCategory(block, 'Film')) return true
            return false
          }

          function needsTvmaze(block) {
            if (!hasAnyCategory(block)) return true

            const desc = getTag(block, 'desc')
            if (!desc) return true

            const hasPackedDisplayDate = /\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/.test(desc)
            if (!hasPackedDisplayDate && hasCategory(block, 'Series')) return true

            return false
          }

          function tvmazeShowIsMovieLike(show) {
            const type = String(show?.type || '').toLowerCase()
            return type === 'movie' || type === 'film'
          }

          function tvmazeShowIsMiniseries(show) {
            const type = String(show?.type || '').toLowerCase()
            const name = String(show?.name || '').toLowerCase()
            const summary = String(show?.summary || '').toLowerCase()

            return (
              type.includes('mini') ||
              type.includes('limited') ||
              name.includes('miniseries') ||
              summary.includes('miniseries') ||
              summary.includes('limited series')
            )
          }

          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function scoreShow(title, show) {
            const a = normalize(title)
            const b = normalize(show?.name || '')
            if (!a || !b) return 0
            if (a === b) return 100
            if (a.includes(b) || b.includes(a)) return 80
            return 0
          }

          async function tvmazeSearchShow(title) {
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]

            const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`
            const result = await fetchJsonWithRetries(url, `search ${title}`)
            const candidates = Array.isArray(result) ? result.map(x => x.show).filter(Boolean) : []

            let best = null
            let bestScore = 0

            for (const show of candidates) {
              if (tvmazeShowIsMovieLike(show)) continue

              const score = scoreShow(title, show)
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null

            cache[key] = best
            await sleep(250)
            return best
          }

          async function tvmazeEpisodes(showId) {
            const key = `episodes:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key]

            const url = `https://api.tvmaze.com/shows/${showId}/episodes`
            const episodes = await fetchJsonWithRetries(url, `episodes ${showId}`)
            cache[key] = Array.isArray(episodes) ? episodes : []
            await sleep(250)
            return cache[key]
          }

          async function fetchJsonWithRetries(url, label) {
            const attempts = 4

            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    'User-Agent': 'festy-epg-tvmaze-xumo-fill-missing-only/1.0'
                  }
                })

                if (response.status === 404) return null
                if (response.status === 429 || response.status >= 500) {
                  throw new Error(`HTTP ${response.status}`)
                }

                if (!response.ok) return null

                return await response.json()
              } catch (err) {
                if (attempt === attempts) {
                  console.log(`[TVMAZE FAIL] ${label} | ${err.message}`)
                  return null
                }

                const delay = 1000 * attempt + Math.floor(Math.random() * 500)
                console.log(`[TVMAZE RETRY] ${label} | ${err.message} | attempt=${attempt}/${attempts}`)
                await sleep(delay)
              }
            }

            return null
          }

          function findEpisodeForProgramme(episodes, block) {
            const scheduleDate = getStartDate(block)
            const subtitle = getTag(block, 'sub-title')
            const desc = getTag(block, 'desc')

            const codeMatch = desc.match(/\bS(\d+)E(\d+)\b/i)
            if (codeMatch) {
              const season = Number(codeMatch[1])
              const number = Number(codeMatch[2])
              const byCode = episodes.find(ep => Number(ep.season) === season && Number(ep.number) === number)
              if (byCode) return byCode
            }

            if (subtitle) {
              const subNorm = normalize(subtitle)
              const byName = episodes.find(ep => normalize(ep.name) === subNorm)
              if (byName) return byName
            }

            const packedTitle = getPackedEpisodeTitleFromDesc(desc)
            if (packedTitle) {
              const packedNorm = normalize(packedTitle)
              const byPackedTitle = episodes.find(ep => normalize(ep.name) === packedNorm)
              if (byPackedTitle) return byPackedTitle
            }

            if (scheduleDate) {
              const exact = episodes.find(ep => ep.airdate === scheduleDate)
              if (exact) return exact
            }

            return null
          }

          function getPackedEpisodeTitleFromDesc(desc) {
            const cleaned = cleanPackedTvmazeDescription(desc)
              .replace(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/, '')
              .trim()
            if (!cleaned) return ''

            const firstSentence = cleaned.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            if (!first) return ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            if (prefixMatch) return prefixMatch[1].trim()

            if (/^S\d+E\d+$/i.test(first)) return ''
            if (first.length > 80) return ''
            return first
          }

          function cleanTvmazeSummary(value) {
            return decodeXml(String(value || '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim())
          }

          function formatDateDisplay(date) {
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return ''
            return `${date.slice(5, 7)}/${date.slice(8, 10)}/${date.slice(0, 4)}`
          }

          function buildTvmazeEpisodeCode(season, episode) {
            const s = Number(season)
            const e = Number(episode)
            if (!Number.isFinite(s) || !Number.isFinite(e) || s < 1 || e < 1) return ''
            return `S${s}E${e}`
          }

          function descHasEpisodeName(desc, episodeName) {
            if (!desc || !episodeName) return false
            const descNorm = normalize(desc)
            const nameNorm = normalize(episodeName)
            return Boolean(nameNorm && descNorm.includes(nameNorm))
          }

          function descHasEpisodeCode(desc, season, episode) {
            const code = buildTvmazeEpisodeCode(season, episode)
            if (!desc || !code) return false
            return new RegExp(`\\b${code}\\b`, 'i').test(desc)
          }

          function descHasDisplayDate(desc, airdate) {
            const displayDate = formatDateDisplay(airdate)
            if (!desc || !displayDate) return false
            return desc.includes(`(${displayDate})`) || desc.includes(displayDate)
          }

          function shouldSuppressTvmazeDisplayDate(block, airdate) {
            if (!airdate) return false

            const title = getTag(block, 'title')
            const desc = getTag(block, 'desc')
            const categories = getTags(block, 'category')
            const haystack = [title, desc, categories]
              .flat()
              .filter(Boolean)
              .join(' ')
              .toLowerCase()

            const liveOrCurrent = /\b(live|news|newscast|weather|sports|sporting|game|match|tournament|football|basketball|baseball|hockey|soccer|golf|tennis|racing|wwe|ufc|mma|boxing|pregame|postgame|post-game|pre-game|paid programming|infomercial)\b/.test(haystack)
            if (!liveOrCurrent) return false

            const scheduleDateText = getStartDate(block)
            if (!scheduleDateText || !/^\d{4}-\d{2}-\d{2}$/.test(scheduleDateText) || !/^\d{4}-\d{2}-\d{2}$/.test(airdate)) return true

            const scheduleDate = new Date(`${scheduleDateText}T00:00:00Z`)
            const parsedAirDate = new Date(`${airdate}T00:00:00Z`)

            if (Number.isNaN(scheduleDate.getTime()) || Number.isNaN(parsedAirDate.getTime())) return true

            return Math.abs(scheduleDate.getTime() - parsedAirDate.getTime()) / 86400000 <= 45
          }

          function cleanPackedTvmazeDescription(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }

          function splitTrailingDisplayDate(desc) {
            const cleaned = cleanPackedTvmazeDescription(desc)
            const match = cleaned.match(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/)
            if (!match) return { body: cleaned, dateText: '' }
            return {
              body: cleaned.slice(0, match.index).trim(),
              dateText: match[1]
            }
          }

          function parsePackedDescription(desc) {
            const split = splitTrailingDisplayDate(desc)
            const withoutDate = split.body
            const firstSentence = withoutDate.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            const rest = firstSentence && firstSentence[0].length < withoutDate.length
              ? withoutDate.slice(firstSentence[0].length).trim()
              : ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            if (prefixMatch) {
              return {
                episodeTitle: prefixMatch[1].trim(),
                episodeCode: prefixMatch[2].toUpperCase(),
                body: rest,
                dateText: split.dateText,
                hadPrefix: true
              }
            }

            const codeOnlyMatch = first.match(/^(S\d+E\d+|S\d+|E\d+)$/i)
            if (codeOnlyMatch) {
              return {
                episodeTitle: '',
                episodeCode: codeOnlyMatch[1].toUpperCase(),
                body: rest,
                dateText: split.dateText,
                hadPrefix: true
              }
            }

            return {
              episodeTitle: '',
              episodeCode: '',
              body: withoutDate,
              dateText: split.dateText,
              hadPrefix: false
            }
          }

          function buildTvmazePackedDescription(existingDesc, show, episode, block) {
            const existing = cleanPackedTvmazeDescription(existingDesc)
            const parsed = parsePackedDescription(existing)

            const episodeName = cleanTvmazeSummary(episode?.name || '')
            const episodeCode = buildTvmazeEpisodeCode(episode?.season, episode?.number)
            const episodeSummary = cleanTvmazeSummary(episode?.summary || '')
            const showSummary = cleanTvmazeSummary(show?.summary || '')
            const displayDate = formatDateDisplay(episode?.airdate)

            let titlePart = parsed.episodeTitle
            let codePart = parsed.episodeCode
            let bodyPart = parsed.body
            let datePart = parsed.dateText

            const packedTitle = getPackedEpisodeTitleFromDesc(existing)
            if (!titlePart && episodeName && packedTitle && normalize(packedTitle) === normalize(episodeName)) {
              titlePart = packedTitle
              const firstSentence = bodyPart.match(/^(.+?)(?:\.\s+|$)/)
              if (firstSentence) bodyPart = bodyPart.slice(firstSentence[0].length).trim()
            }

            if (!titlePart && episodeName && !descHasEpisodeName(existing, episodeName)) {
              titlePart = episodeName
            }

            if (!codePart && episodeCode && !descHasEpisodeCode(existing, episode?.season, episode?.number)) {
              codePart = episodeCode
            }

            if (!bodyPart || bodyPart === titlePart || bodyPart === codePart || bodyPart === `${titlePart} - ${codePart}`) {
              bodyPart = episodeSummary || showSummary || ''
            }

            if (!datePart && displayDate && !shouldSuppressTvmazeDisplayDate(block, episode?.airdate) && !descHasDisplayDate(existing, episode?.airdate)) {
              datePart = displayDate
            }

            const parts = []
            if (titlePart && codePart) parts.push(`${titlePart} - ${codePart}`)
            else if (titlePart) parts.push(titlePart)
            else if (codePart) parts.push(codePart)

            if (bodyPart) {
              const bodyNorm = normalize(bodyPart)
              const prefixNorm = normalize(parts[0] || '')
              if (!prefixNorm || bodyNorm !== prefixNorm) parts.push(bodyPart)
            }

            let desc = cleanPackedTvmazeDescription(parts.join('. '))
            if (datePart) desc = desc ? `${desc} (${datePart})` : `(${datePart})`
            return cleanPackedTvmazeDescription(desc)
          }

          function replaceTag(block, tag, value) {
            const escaped = escapeXml(value)
            const tagXml = `  <${tag} lang="en">${escaped}</${tag}>`

            if (hasTag(block, tag)) {
              return block.replace(new RegExp(`<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`, 'i'), tagXml.trim())
            }

            return insertBeforeProgrammeEnd(block, tagXml)
          }

          function insertBeforeProgrammeEnd(block, tagXml) {
            return block.replace(/<\/programme>\s*$/i, `${tagXml}\n</programme>`)
          }

          function enrichBlockMissingOnly(block, show, episode) {
            let updated = block
            let changed = false

            if (!hasAnyCategory(updated)) {
              const category = tvmazeShowIsMiniseries(show) ? 'Miniseries' : 'Series'
              updated = insertBeforeProgrammeEnd(updated, `  <category lang="en">${category}</category>`)
              changed = true
              stats.addedCategories++
            }

            const existingDesc = getTag(updated, 'desc')
            const packedDesc = buildTvmazePackedDescription(existingDesc, show, episode, updated)

            if (packedDesc && packedDesc !== existingDesc) {
              updated = replaceTag(updated, 'desc', packedDesc)
              changed = true
              stats.addedDescriptions++
            }

            if (changed) stats.enriched++
            return updated
          }

          async function main() {
            const parts = xml.split(/(<programme\b[\s\S]*?<\/programme>)/gi)
            const out = []

            for (const part of parts) {
              if (!/^<programme\b/i.test(part)) {
                out.push(part)
                continue
              }

              stats.programmes++

              let block = part
              const title = cleanTitleForSearch(getTag(block, 'title'))

              if (!title) {
                out.push(block)
                continue
              }

              if (isMovie(block)) {
                stats.skippedMovies++
                out.push(block)
                continue
              }

              if (!needsTvmaze(block)) {
                out.push(block)
                continue
              }

              stats.searchedShows++
              const show = await tvmazeSearchShow(title)

              if (!show) {
                out.push(block)
                continue
              }

              if (tvmazeShowIsMovieLike(show)) {
                stats.skippedMovies++
                out.push(block)
                continue
              }

              stats.matchedShows++

              const episodes = await tvmazeEpisodes(show.id)
              const episode = findEpisodeForProgramme(episodes, block)

              block = enrichBlockMissingOnly(block, show, episode)
              out.push(block)
            }

            fs.writeFileSync(guidePath, out.join(''))
            fs.writeFileSync(cachePath, JSON.stringify(cache, null, 2))

            console.log('[TVMAZE] Xumo missing-only enrichment complete')
            console.log(`[TVMAZE] programmes scanned: ${stats.programmes}`)
            console.log(`[TVMAZE] movies skipped: ${stats.skippedMovies}`)
            console.log(`[TVMAZE] shows searched: ${stats.searchedShows}`)
            console.log(`[TVMAZE] shows matched: ${stats.matchedShows}`)
            console.log(`[TVMAZE] programmes enriched: ${stats.enriched}`)
            console.log(`[TVMAZE] categories added: ${stats.addedCategories}`)
            console.log(`[TVMAZE] descriptions added: ${stats.addedDescriptions}`)
          }

          main().catch(err => {
            console.error(err)
            process.exit(1)
          })
          EOF

      - name: Validate Xumo TiviMate output
        run: |
          CH=$(grep -c '<channel ' guides/xumotivimateguide.xml || true)
          PR=$(grep -c '<programme ' guides/xumotivimateguide.xml || true)
          DESC=$(grep -c '<desc ' guides/xumotivimateguide.xml || true)

          echo "Xumo channels: $CH"
          echo "Xumo programmes: $PR"
          echo "Xumo descriptions: $DESC"

          if [ "$CH" -lt 1 ]; then
            echo "Invalid Xumo output - no channels"
            exit 1
          fi

          if [ "$PR" -lt 1 ]; then
            echo "Invalid Xumo output - no programmes"
            exit 1
          fi

          if [ "$DESC" -lt 1 ]; then
            echo "Invalid Xumo output - no descriptions"
            exit 1
          fi

      - name: Compress Xumo TiviMate guide
        run: |
          gzip -c guides/xumotivimateguide.xml > guides/xumotivimateguide.xml.gz

      - name: Commit and push Xumo TiviMate guide safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main

          git checkout origin/main -- guides/TVPassport.xml.gz guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

          git add guides/xumotivimateguide.xml guides/xumotivimateguide.xml.gz guides/.tvmaze-xumo-cache.json
          git add guides/TVPassport.xml.gz guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No Xumo guide changes to commit"
            exit 0
          fi

          git commit -m "Update Xumo TiviMate guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, retrying after fresh fetch/rebase..."

            git fetch origin main
            git rebase origin/main

            git checkout origin/main -- guides/TVPassport.xml.gz guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

            git add guides/xumotivimateguide.xml guides/xumotivimateguide.xml.gz guides/.tvmaze-xumo-cache.json
            git add guides/TVPassport.xml.gz guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No new commit needed after rebase, retrying push..."
            else
              git commit -m "Update Xumo TiviMate guide"
            fi

            sleep 5
          done

          echo "Push failed after retries"
          exit 1
