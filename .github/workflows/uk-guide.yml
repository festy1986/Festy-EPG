name: UK Guide

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'

permissions:
  contents: write

concurrency:
  group: uk-guide
  cancel-in-progress: false

jobs:
  build-uk-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting UK guide processing..."
          sleep 60

      - name: Download fresh UK IPTV-org guide
        run: |
          mkdir -p uk/source
          mkdir -p uk/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://iptv-epg.org/files/epg-gb.xml.gz \
            -o uk/source/epg-gb.xml.gz

          test -s uk/source/epg-gb.xml.gz
          gzip -t uk/source/epg-gb.xml.gz

          echo "Fresh UK IPTV-org guide downloaded"
          ls -lh uk/source/epg-gb.xml.gz

      - name: Process and rebuild UK guide
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cat > /tmp/build_uk_guide.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const inputPath = 'uk/source/epg-gb.xml.gz'
          const outputPath = 'uk/work/uk.xml'

          const now = new Date()
          const pastCutoff = new Date(now.getTime() - 3 * 24 * 60 * 60 * 1000)
          const futureCutoff = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000)

          const channels = new Map()
          const programmes = []
          const tvmazeShowCache = new Map()
          const tvmazeEpisodeCache = new Map()
          const tmdbTvCache = new Map()
          const tmdbMovieCache = new Map()

          let channelsRead = 0
          let programmesScanned = 0
          let programmesKept = 0
          let programmesSkipped = 0
          let titlesChanged = 0
          let descriptionsChanged = 0
          let actorsRemoved = 0
          let creditsRemoved = 0
          let episodeTagsRemoved = 0
          let tvmazeMatches = 0
          let tvmazeFieldsUsed = 0
          let tmdbMatches = 0
          let tmdbFieldsUsed = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;')
          }

          function cleanSpaces(value) {
            return String(value || '').replace(/\s+/g, ' ').trim()
          }

          function getAttribute(block, attribute) {
            const match = block.match(new RegExp('\\b' + attribute + '="([^"]*)"', 'i'))
            return match ? decodeXml(match[1]) : ''
          }

          function getTag(block, tag) {
            const match = block.match(new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)</' + tag + '>', 'i'))
            if (!match) return ''
            return cleanSpaces(decodeXml(match[1].replace(/<[^>]+>/g, '')))
          }

          function getAllTags(block, tag) {
            const regex = new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)</' + tag + '>', 'gi')
            return [...block.matchAll(regex)].map(match =>
              cleanSpaces(decodeXml(match[1].replace(/<[^>]+>/g, '')))
            )
          }

          function getTagBySystem(block, tag, system) {
            const regex = new RegExp(
              '<' + tag + '\\b[^>]*\\bsystem="' + system + '"[^>]*>([\\s\\S]*?)</' + tag + '>',
              'i'
            )
            const match = block.match(regex)
            return match ? cleanSpaces(decodeXml(match[1].replace(/<[^>]+>/g, ''))) : ''
          }

          function replaceTag(block, tag, value) {
            const regex = new RegExp('<' + tag + '\\b[^>]*>[\\s\\S]*?</' + tag + '>', 'i')
            const replacement = '<' + tag + ' lang="en">' + escapeXml(value) + '</' + tag + '>'
            if (regex.test(block)) return block.replace(regex, replacement)
            return block.replace(/<\/programme>\s*$/i, '  ' + replacement + '\n</programme>')
          }

          function removeTag(block, tag) {
            return block.replace(new RegExp('\\s*<' + tag + '\\b[^>]*>[\\s\\S]*?</' + tag + '>', 'gi'), '')
          }

          function removeEpisodeNumBySystem(block, system) {
            return block.replace(
              new RegExp('\\s*<episode-num\\b[^>]*\\bsystem="' + system + '"[^>]*>[\\s\\S]*?</episode-num>', 'gi'),
              ''
            )
          }

          function setProgrammeIcon(block, url) {
            if (!url) return block
            const iconRegex = /<icon\b[^>]*\bsrc="[^"]*"[^>]*\/?\s*>/i
            const replacement = '<icon src="' + escapeXml(url) + '" />'
            if (iconRegex.test(block)) return block.replace(iconRegex, replacement)
            return block.replace(/<\/programme>\s*$/i, '  ' + replacement + '\n</programme>')
          }

          function cleanProgrammeTitle(value) {
            return cleanSpaces(value)
              .replace(/\s+\((?:19|20)\d{2}\)\s*$/, '')
              .replace(/\s*[.\-–—:]?\s*S(?:eason)?\s*\d{1,3}\s*E(?:pisode)?\s*\d{1,3}\s*$/i, '')
              .trim()
          }

          function extractTitleYear(value) {
            const match = cleanSpaces(value).match(/\(((?:19|20)\d{2})\)\s*$/)
            return match ? match[1] : ''
          }

          function normalizeTitle(value) {
            return cleanProgrammeTitle(value).toLowerCase().replace(/[^a-z0-9]+/g, '')
          }

          function removeEmbeddedCredits(value) {
            let result = cleanSpaces(value)
            const protectedValues = []

            result = result.replace(/\(\d{2}\/\d{2}\/\d{4}\)/g, match => {
              const token = '__DATE_' + protectedValues.length + '__'
              protectedValues.push(match)
              return token
            })

            result = result
              .replace(/\([^()]*\)/g, '')
              .replace(/\s+[A-Z][A-Za-z.'-]*(?:\s*,\s*[A-Z][A-Za-z.'-]*)*(?:\s+(?:and|&)\s+[A-Z][A-Za-z.'-]*)\s+(?:star|stars|starring)\.?\s*$/i, '')
              .replace(/\s+(?:with|featuring|featuring performances by|with performances by)\s+[^.!?]*[.!?]?\s*$/i, '')
              .replace(/\s+\*+\s*$/g, '')
              .replace(/\s+\.\s*$/g, '')
              .replace(/\s{2,}/g, ' ')
              .trim()

            result = result.replace(/__DATE_(\d+)__/g, (_, index) => protectedValues[Number(index)] || '')
            return cleanSpaces(result)
          }

          function parseXmltvDate(value) {
            const match = String(value || '').match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/)
            if (!match) return null
            return new Date(Date.UTC(
              Number(match[1]), Number(match[2]) - 1, Number(match[3]),
              Number(match[4]), Number(match[5]), Number(match[6])
            ))
          }

          function parseOriginalAirDate(value) {
            const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})/)
            return match ? match[2] + '/' + match[3] + '/' + match[1] : ''
          }

          function parseCompactAirDate(value) {
            const match = String(value || '').match(/^(\d{4})(\d{2})(\d{2})$/)
            return match ? match[2] + '/' + match[3] + '/' + match[1] : ''
          }

          function normalizeEpisode(value) {
            const text = cleanSpaces(value)
            let match = text.match(/^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i)
            if (match) return 'S' + Number(match[1]) + 'E' + Number(match[2])

            match = text.match(/^(\d{1,3})\.(\d{1,3})\.?$/)
            if (match) return 'S' + (Number(match[1]) + 1) + 'E' + (Number(match[2]) + 1)

            return ''
          }

          function extractEpisodeNumber(block) {
            return normalizeEpisode(
              getTagBySystem(block, 'episode-num', 'common') ||
              getTagBySystem(block, 'episode-num', 'onscreen') ||
              getTagBySystem(block, 'episode-num', 'xmltv_ns') ||
              getTag(block, 'episode-num')
            )
          }

          function extractEpisodeTitle(block) {
            return cleanSpaces(getTag(block, 'sub-title'))
          }

          function extractAirDate(block) {
            return parseOriginalAirDate(getTagBySystem(block, 'episode-num', 'original-air-date')) ||
              parseCompactAirDate(getTag(block, 'date'))
          }

          function isMovie(block, rawTitle, episodeNumber) {
            if (episodeNumber) return false
            const categories = getAllTags(block, 'category').map(value => value.toLowerCase())
            return categories.some(value => /^(movie|film|movies|films)$/.test(value)) || Boolean(extractTitleYear(rawTitle))
          }

          function appendSentence(base, addition) {
            const left = cleanSpaces(base).replace(/[.\s]+$/, '')
            const right = cleanSpaces(addition)
            if (!left) return right
            if (!right) return left
            return left + '. ' + right
          }

          function buildDescription(programme) {
            let result = ''

            if (!programme.movie && (programme.episodeTitle || programme.episodeNumber)) {
              if (programme.episodeTitle && programme.episodeNumber) {
                result = programme.episodeTitle + ' - ' + programme.episodeNumber
              } else {
                result = programme.episodeTitle || programme.episodeNumber
              }
            }

            result = appendSentence(result, programme.baseDescription)

            if (programme.movie && programme.year) {
              result = result.replace(new RegExp('\\s*\\(' + programme.year + '\\)\\s*$', 'i'), '')
              result = cleanSpaces(result) + (result ? ' ' : '') + '(' + programme.year + ')'
            } else if (!programme.movie && programme.airDate) {
              result = result.replace(/\s*\(\d{2}\/\d{2}\/\d{4}\)\s*$/, '')
              result = cleanSpaces(result) + (result ? ' ' : '') + '(' + programme.airDate + ')'
            }

            return cleanSpaces(result)
          }

          function sleep(milliseconds) {
            return new Promise(resolve => setTimeout(resolve, milliseconds))
          }

          async function fetchJson(url, headers = {}) {
            try {
              const response = await fetch(url, { headers })
              if (!response.ok) return null
              return await response.json()
            } catch {
              return null
            }
          }

          function fillMissing(programme, field, value, source) {
            if (programme[field] || !value) return false
            programme[field] = cleanSpaces(value)
            if (source === 'tvmaze') tvmazeFieldsUsed++
            if (source === 'tmdb') tmdbFieldsUsed++
            return true
          }

          async function getTvmazeShow(title) {
            const key = normalizeTitle(title)
            if (tvmazeShowCache.has(key)) return tvmazeShowCache.get(key)
            const data = await fetchJson('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(title))
            await sleep(250)
            const show = data && data.length ? data[0].show : null
            tvmazeShowCache.set(key, show)
            return show
          }

          async function enrichFromTvmaze(programme) {
            if (programme.movie || !programme.episodeNumber) return
            const match = programme.episodeNumber.match(/^S(\d+)E(\d+)$/i)
            if (!match) return

            const show = await getTvmazeShow(programme.title)
            if (!show) return

            const key = show.id + ':' + Number(match[1]) + ':' + Number(match[2])
            let episode = tvmazeEpisodeCache.get(key)
            if (episode === undefined) {
              episode = await fetchJson(
                'https://api.tvmaze.com/shows/' + show.id + '/episodebynumber?season=' +
                Number(match[1]) + '&number=' + Number(match[2])
              )
              await sleep(250)
              tvmazeEpisodeCache.set(key, episode || null)
            }
            if (!episode) return

            let used = false
            used = fillMissing(programme, 'episodeTitle', episode.name, 'tvmaze') || used
            used = fillMissing(
              programme,
              'baseDescription',
              episode.summary ? episode.summary.replace(/<[^>]+>/g, '') : '',
              'tvmaze'
            ) || used
            used = fillMissing(programme, 'airDate', parseOriginalAirDate(episode.airdate), 'tvmaze') || used
            used = fillMissing(
              programme,
              'icon',
              episode.image ? (episode.image.original || episode.image.medium) : '',
              'tvmaze'
            ) || used
            if (used) tvmazeMatches++
          }

          async function tmdbRequest(path) {
            if (!process.env.TMDB_API_TOKEN) return null
            return fetchJson('https://api.themoviedb.org/3' + path, {
              Authorization: 'Bearer ' + process.env.TMDB_API_TOKEN,
              accept: 'application/json'
            })
          }

          async function enrichTvFromTmdb(programme) {
            if (programme.movie || !programme.episodeNumber || !process.env.TMDB_API_TOKEN) return
            const match = programme.episodeNumber.match(/^S(\d+)E(\d+)$/i)
            if (!match) return

            const key = normalizeTitle(programme.title)
            let show = tmdbTvCache.get(key)
            if (show === undefined) {
              const search = await tmdbRequest('/search/tv?query=' + encodeURIComponent(programme.title))
              await sleep(250)
              show = search && search.results && search.results.length ? search.results[0] : null
              tmdbTvCache.set(key, show)
            }
            if (!show) return

            const episode = await tmdbRequest(
              '/tv/' + show.id + '/season/' + Number(match[1]) + '/episode/' + Number(match[2])
            )
            await sleep(250)
            if (!episode) return

            let used = false
            used = fillMissing(programme, 'episodeTitle', episode.name, 'tmdb') || used
            used = fillMissing(programme, 'baseDescription', episode.overview, 'tmdb') || used
            used = fillMissing(programme, 'airDate', parseOriginalAirDate(episode.air_date), 'tmdb') || used
            used = fillMissing(
              programme,
              'icon',
              episode.still_path ? 'https://image.tmdb.org/t/p/original' + episode.still_path : '',
              'tmdb'
            ) || used
            if (used) tmdbMatches++
          }

          async function enrichMovieFromTmdb(programme) {
            if (!programme.movie || !process.env.TMDB_API_TOKEN) return
            const key = normalizeTitle(programme.title) + '|' + programme.year
            let movie = tmdbMovieCache.get(key)
            if (movie === undefined) {
              let path = '/search/movie?query=' + encodeURIComponent(programme.title)
              if (programme.year) path += '&year=' + encodeURIComponent(programme.year)
              const search = await tmdbRequest(path)
              await sleep(250)
              movie = search && search.results && search.results.length ? search.results[0] : null
              tmdbMovieCache.set(key, movie)
            }
            if (!movie) return

            let used = false
            used = fillMissing(programme, 'baseDescription', movie.overview, 'tmdb') || used
            used = fillMissing(
              programme,
              'icon',
              movie.backdrop_path || movie.poster_path
                ? 'https://image.tmdb.org/t/p/original' + (movie.backdrop_path || movie.poster_path)
                : '',
              'tmdb'
            ) || used
            if (!programme.year && movie.release_date) {
              used = fillMissing(programme, 'year', movie.release_date.slice(0, 4), 'tmdb') || used
            }
            if (used) tmdbMatches++
          }

          function cleanProgrammeBlock(block) {
            const rawTitle = getTag(block, 'title')
            const title = cleanProgrammeTitle(rawTitle)
            const episodeNumber = extractEpisodeNumber(block)
            const movie = isMovie(block, rawTitle, episodeNumber)
            const originalDescription = cleanSpaces(getTag(block, 'desc'))

            const programme = {
              block,
              channel: getAttribute(block, 'channel'),
              start: getAttribute(block, 'start'),
              stop: getAttribute(block, 'stop'),
              title,
              episodeTitle: movie ? '' : extractEpisodeTitle(block),
              episodeNumber: movie ? '' : episodeNumber,
              airDate: movie ? '' : extractAirDate(block),
              year: extractTitleYear(rawTitle) || (/^(?:19|20)\d{2}$/.test(getTag(block, 'date')) ? getTag(block, 'date') : ''),
              movie,
              baseDescription: removeEmbeddedCredits(originalDescription),
              icon: getAttribute(block.match(/<icon\b[^>]*>/i)?.[0] || '', 'src')
            }

            if (title !== rawTitle) titlesChanged++
            if (programme.baseDescription !== originalDescription) descriptionsChanged++
            if (/<actor\b/i.test(block)) actorsRemoved++
            if (/<credits\b/i.test(block)) creditsRemoved++
            if (/<episode-num\b/i.test(block)) episodeTagsRemoved++

            let output = block
            output = replaceTag(output, 'title', title)
            output = removeTag(output, 'sub-title')
            output = removeEpisodeNumBySystem(output, 'onscreen')
            output = removeEpisodeNumBySystem(output, 'common')
            output = removeEpisodeNumBySystem(output, 'xmltv_ns')
            output = removeTag(output, 'actor')
            output = removeTag(output, 'credits')
            programme.block = output

            return programme
          }

          function buildProgramme(programme) {
            let block = programme.block
            block = replaceTag(block, 'title', programme.title)
            block = replaceTag(block, 'desc', buildDescription(programme))
            block = setProgrammeIcon(block, programme.icon)
            return block.trimEnd() + '\n'
          }

          function parseXmlStream(stream, callback) {
            return new Promise((resolve, reject) => {
              const rl = readline.createInterface({ input: stream, crlfDelay: Infinity })
              let type = ''
              let buffer = ''

              ;(async () => {
                try {
                  for await (const line of rl) {
                    if (!type && line.includes('<channel ')) {
                      type = 'channel'
                      buffer = line + '\n'
                      if (line.includes('</channel>')) {
                        await callback(type, buffer)
                        type = ''
                        buffer = ''
                      }
                      continue
                    }

                    if (!type && line.includes('<programme ')) {
                      type = 'programme'
                      buffer = line + '\n'
                      if (line.includes('</programme>')) {
                        await callback(type, buffer)
                        type = ''
                        buffer = ''
                      }
                      continue
                    }

                    if (type) {
                      buffer += line + '\n'
                      if (
                        (type === 'channel' && line.includes('</channel>')) ||
                        (type === 'programme' && line.includes('</programme>'))
                      ) {
                        await callback(type, buffer)
                        type = ''
                        buffer = ''
                      }
                    }
                  }
                  resolve()
                } catch (error) {
                  reject(error)
                }
              })()
            })
          }

          async function loadGuide() {
            const input = fs.createReadStream(inputPath)
            const gunzip = zlib.createGunzip()
            input.pipe(gunzip)

            await parseXmlStream(gunzip, async (type, block) => {
              if (type === 'channel') {
                const id = getAttribute(block, 'id')
                if (id && !channels.has(id)) {
                  channels.set(id, block.trimEnd() + '\n')
                  channelsRead++
                }
                return
              }

              programmesScanned++
              const start = getAttribute(block, 'start')
              const startDate = parseXmltvDate(start)

              if (!startDate || startDate < pastCutoff || startDate >= futureCutoff) {
                programmesSkipped++
                return
              }

              programmes.push(cleanProgrammeBlock(block))
              programmesKept++
            })
          }

          async function enrichGuide() {
            for (const programme of programmes) {
              await enrichFromTvmaze(programme)
              await enrichTvFromTmdb(programme)
              await enrichMovieFromTmdb(programme)
            }
          }

          async function writeGuide() {
            programmes.sort((a, b) => a.start.localeCompare(b.start) || a.channel.localeCompare(b.channel))
            const output = fs.createWriteStream(outputPath, { encoding: 'utf8' })

            await new Promise((resolve, reject) => {
              output.once('error', reject)
              output.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              output.write('<tv generator-info-name="UK Guide">\n')

              for (const block of channels.values()) output.write(block)
              for (const programme of programmes) output.write(buildProgramme(programme))

              output.write('</tv>\n')
              output.end(resolve)
            })
          }

          async function main() {
            await loadGuide()
            await enrichGuide()
            await writeGuide()

            console.log('')
            console.log('========================================')
            console.log('CANADA GUIDE PROCESSING COMPLETE')
            console.log('========================================')
            console.log('Channels written: ' + channelsRead)
            console.log('Programmes scanned: ' + programmesScanned)
            console.log('Programmes kept: ' + programmesKept)
            console.log('Programmes skipped: ' + programmesSkipped)
            console.log('Titles cleaned: ' + titlesChanged)
            console.log('Descriptions cleaned: ' + descriptionsChanged)
            console.log('Actor tags removed: ' + actorsRemoved)
            console.log('Credits tags removed: ' + creditsRemoved)
            console.log('Programmes with episode tags removed: ' + episodeTagsRemoved)
            console.log('TVMaze matched programmes: ' + tvmazeMatches)
            console.log('TVMaze fields filled: ' + tvmazeFieldsUsed)
            console.log('TMDB matched programmes: ' + tmdbMatches)
            console.log('TMDB fields filled: ' + tmdbFieldsUsed)
            console.log('Output: ' + outputPath)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

          node /tmp/build_uk_guide.js

      - name: Validate UK guide
        run: |
          CHANNELS=$(grep -c '<channel ' uk/work/uk.xml || true)
          PROGRAMMES=$(grep -c '<programme ' uk/work/uk.xml || true)
          CHANNEL_LOGOS=$(sed -n '/<channel /,/<\/channel>/p' uk/work/uk.xml | grep -c '<icon src=' || true)
          PROGRAMME_ICONS=$(sed -n '/<programme /,/<\/programme>/p' uk/work/uk.xml | grep -c '<icon src=' || true)
          DESCRIPTIONS=$(grep -c '<desc ' uk/work/uk.xml || true)
          YEAR_TITLES=$(grep -E -c '<title[^>]*>.*\((19|20)[0-9]{2}\)</title>' uk/work/uk.xml || true)

          echo "UK channels: $CHANNELS"
          echo "UK programmes: $PROGRAMMES"
          echo "Channel logos: $CHANNEL_LOGOS"
          echo "Programme icons: $PROGRAMME_ICONS"
          echo "Description tags: $DESCRIPTIONS"
          echo "Titles still ending in a year: $YEAR_TITLES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "UK guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "UK guide contains no programmes"
            exit 1
          fi

          if [ "$YEAR_TITLES" -gt 0 ]; then
            echo "UK guide still contains movie years in titles"
            exit 1
          fi

          test -s uk/work/uk.xml

      - name: Compress UK guide
        run: |
          gzip -c uk/work/uk.xml > guides/uk.xml.gz
          test -s guides/uk.xml.gz

          echo "UK guide:"
          ls -lh guides/uk.xml.gz

      - name: Commit and push UK guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/uk.xml.gz

          if git diff --cached --quiet; then
            echo "No UK guide changes to commit"
            exit 0
          fi

          git commit -m "Update UK guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Synchronizing with remote before retry..."
            git fetch origin main
            git rebase origin/main
            echo "Waiting before retry..."
            sleep 10
          done

          echo "Push failed after all retries"
          exit 1
