name: Fix Tivimate Channels Temp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove bad entries and add confirmed channels in both guides
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("guides/tvguidetivimate.xml"),
              Path("guides/tvguidetivimateguide.xml"),
          ]

          confirmed = {
              "HIST.us": ("9100002976#9233008002", "HISTORY"),
              "FYIHD.us": ("9100002976#9233000161", "FYI"),
              "RETRPLEXHD.us": ("9100002976#9200006666", "RETROPLEX"),
              "CNN.us": ("9100002976#9233013812", "CNN"),
              "FX.us": ("9100002976#9200006932", "FX"),
              "MTV.us": ("9100002976#9200014754", "MTV"),
              "SHOWTIME.SHOWCASE.us": ("9100002976#9233003805", "SHOWTIME SHOWCASE"),
              "FREEFRM.us": ("9100002976#9200006942", "FREEFORM"),
              "HBO.us": ("9100002976#9200004886", "HBO"),
              "HBO.MOVIES.us": ("9100002976#9233009866", "HBO MOVIES"),
          }

          def confirmed_line(xmltv_id, site_id, name):
              return f'  <channel site="tvguide.com" lang="en" xmltv_id="{xmltv_id}" site_id="{site_id}">{name}</channel>'

          def remove_entries(text, xmltv_id):
              total = 0

              # Remove raw tvguide-style entries:
              # <channel site="tvguide.com" lang="en" xmltv_id="CNN.us" site_id="...">CNN</channel>
              raw_pattern = re.compile(
                  rf'\s*<channel\b[^>]*\bxmltv_id="{re.escape(xmltv_id)}"[^>]*>.*?</channel>',
                  re.DOTALL,
              )
              text, count = raw_pattern.subn("", text)
              total += count

              # Remove XMLTV/Tivimate-style entries:
              # <channel id="CNN.us"> ... </channel>
              tivi_pattern = re.compile(
                  rf'\s*<channel\b[^>]*\bid="{re.escape(xmltv_id)}"[^>]*>.*?</channel>',
                  re.DOTALL,
              )
              text, count = tivi_pattern.subn("", text)
              total += count

              return text, total

          for file_path in files:
              if not file_path.exists():
                  raise SystemExit(f"Missing required file: {file_path}")

              text = file_path.read_text(encoding="utf-8")
              print(f"\n--- Fixing {file_path} ---")

              for xmltv_id in confirmed:
                  text, removed = remove_entries(text, xmltv_id)
                  print(f"Removed {removed} old entries for {xmltv_id}")

              block = "\n".join(
                  confirmed_line(xmltv_id, site_id, name)
                  for xmltv_id, (site_id, name) in confirmed.items()
              )

              if "</channels>" in text:
                  text = text.replace("</channels>", block + "\n</channels>")
              elif "</tv>" in text:
                  first_programme = text.find("<programme ")
                  if first_programme != -1:
                      text = text[:first_programme].rstrip() + "\n" + block + "\n" + text[first_programme:]
                  else:
                      text = text.replace("</tv>", block + "\n</tv>")
              else:
                  raise SystemExit(f"Could not find </channels> or </tv> in {file_path}")

              file_path.write_text(text.strip() + "\n", encoding="utf-8")

          print("\nFinal confirmed channels added to BOTH guides:")
          for xmltv_id, (site_id, name) in confirmed.items():
              print(f"{xmltv_id} -> {site_id} -> {name}")
          PY

      - name: Verify no duplicate confirmed IDs remain
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          files = [
              Path("guides/tvguidetivimate.xml"),
              Path("guides/tvguidetivimateguide.xml"),
          ]

          ids = [
              "HIST.us",
              "FYIHD.us",
              "RETRPLEXHD.us",
              "CNN.us",
              "FX.us",
              "MTV.us",
              "SHOWTIME.SHOWCASE.us",
              "FREEFRM.us",
              "HBO.us",
              "HBO.MOVIES.us",
          ]

          failed = False

          for file_path in files:
              text = file_path.read_text(encoding="utf-8")
              print(f"\n--- Verifying {file_path} ---")

              for xmltv_id in ids:
                  raw_count = len(re.findall(rf'\bxmltv_id="{re.escape(xmltv_id)}"', text))
                  id_count = len(re.findall(rf'\bid="{re.escape(xmltv_id)}"', text))
                  total = raw_count + id_count
                  print(f"{xmltv_id}: {total}")

                  if total != 1:
                      failed = True
                      print(f"ERROR: expected exactly 1 entry for {xmltv_id}, found {total}")

          if failed:
              sys.exit(1)
          PY

      - name: Show focused diff
        shell: bash
        run: |
          git diff -- guides/tvguidetivimate.xml guides/tvguidetivimateguide.xml | grep -E 'HIST|FYIHD|RETRPLEXHD|CNN|FX|MTV|SHOWTIME|FREEFRM|HBO|^[+-]' || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add guides/tvguidetivimate.xml guides/tvguidetivimateguide.xml
          git commit -m "Fix confirmed Tivimate channel mappings in both guides" || exit 0
          git push
