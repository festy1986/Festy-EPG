name: Fix Tivimate Direct

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch both Tivimate guides
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          FILES = [
              Path("guides/tvguidetivimate.xml"),
              Path("guides/tvguidetivimateguide.xml"),
          ]

          confirmed = {
              "HIST.us": ("9100002976#9233008002", "HISTORY"),
              "FYIHD.us": ("9100002976#9233000161", "FYI"),
              "RETRPLEXHD.us": ("9100002976#9200006666", "RETROPLEX"),
              "CNN.us": ("9100002976#9233013812", "CNN"),
              "FX.us": ("9100002976#9200006932", "FX"),
              "MTV.us": ("9100002976#9200014754", "MTV"),
              "SHOWTIME.SHOWCASE.us": ("9100002976#9233003805", "SHOWTIME SHOWCASE"),
              "FREEFRM.us": ("9100002976#9200006942", "FREEFORM"),
              "HBO.us": ("9100002976#9200004886", "HBO"),
              "HBO.MOVIES.us": ("9100002976#9233009866", "HBO MOVIES"),
          }

          def channel_line(xmltv_id, site_id, name):
              return f'  <channel site="tvguide.com" lang="en" xmltv_id="{xmltv_id}" site_id="{site_id}">{name}</channel>'

          for FILE in FILES:
              if not FILE.exists():
                  raise SystemExit(f"Missing required file: {FILE}")

              text = FILE.read_text(encoding="utf-8")

              print(f"\n--- Patching {FILE} ---")

              # Remove ALL old/duplicate raw-style entries for these xmltv_ids
              for xmltv_id in confirmed:
                  pattern = re.compile(
                      rf'\s*<channel\s+site="tvguide\.com"\s+lang="en"\s+xmltv_id="{re.escape(xmltv_id)}"\s+site_id="[^"]+">[^<]*</channel>',
                      re.MULTILINE,
                  )
                  text, count = pattern.subn("", text)
                  print(f"Removed {count} old raw-style entries for {xmltv_id}")

              block = "\n".join(
                  channel_line(xmltv_id, site_id, name)
                  for xmltv_id, (site_id, name) in confirmed.items()
              )

              if "</channels>" in text:
                  text = text.replace("</channels>", block + "\n</channels>")
              elif "</tv>" in text:
                  first_programme = text.find("<programme ")
                  if first_programme != -1:
                      text = text[:first_programme].rstrip() + "\n" + block + "\n" + text[first_programme:]
                  else:
                      text = text.replace("</tv>", block + "\n</tv>")
              else:
                  raise SystemExit(f"Could not find </channels> or </tv> in {FILE}")

              FILE.write_text(text.strip() + "\n", encoding="utf-8")

          print("\nAdded/fixed:")
          for xmltv_id, (site_id, name) in confirmed.items():
              print(f"{xmltv_id} -> {site_id} -> {name}")
          PY

      - name: Show focused diff
        run: |
          git diff -- guides/tvguidetivimate.xml guides/tvguidetivimateguide.xml | grep -E 'HIST|FYIHD|RETRPLEXHD|CNN|FX|MTV|SHOWTIME|FREEFRM|HBO|^[+-]' || true

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add guides/tvguidetivimate.xml guides/tvguidetivimateguide.xml
          git commit -m "Fix Tivimate confirmed channel mappings in both guides" || exit 0
          git push
