name: CLEANSOURCEFASTCHANNELS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-sourcefastchannels
  cancel-in-progress: false

jobs:
  clean-source-fast-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean SOURCEFASTCHANNELS
        run: |
          node <<'EOF'
          const fs = require('fs')

          const inputPath =
            'SOURCEFASTCHANNELS.txt'

          const outputPath =
            'SOURCEFASTCHANNELS2.txt'

          const input =
            fs.readFileSync(
              inputPath,
              'utf8'
            )

          const lines =
            input.split(
              /\r?\n/
            )

          const uniqueChannels =
            new Set()

          let channelsRead =
            0

          let channelsKept =
            0

          let localChannelsRemoved =
            0

          let duplicateChannelsRemoved =
            0

          let invalidLinesSkipped =
            0

          const localCallSignPattern =
            /\((?:W|K)[A-Z]{3}\)\.us$/i

          for (
            const line of lines
          ) {
            const trimmed =
              line.trim()

            if (
              !trimmed
            ) {
              continue
            }

            if (
              trimmed ===
                'SOURCE FAST CHANNELS'
            ) {
              continue
            }

            if (
              trimmed ===
                'SOURCE FAST CHANNELS CLEANED'
            ) {
              continue
            }

            if (
              trimmed.startsWith(
                'Generated:'
              )
            ) {
              continue
            }

            if (
              trimmed.startsWith(
                'Total channels:'
              )
            ) {
              continue
            }

            if (
              !trimmed.includes(
                ' | '
              )
            ) {
              invalidLinesSkipped++

              continue
            }

            const parts =
              trimmed.split(
                ' | '
              )

            const displayName =
              parts[0]
                ? parts[0].trim()
                : ''

            const channelId =
              parts[1]
                ? parts[1].trim()
                : ''

            if (
              !displayName ||
              !channelId
            ) {
              invalidLinesSkipped++

              continue
            }

            channelsRead++

            if (
              !channelId.endsWith(
                '.us'
              )
            ) {
              invalidLinesSkipped++

              continue
            }

            if (
              localCallSignPattern.test(
                channelId
              )
            ) {
              localChannelsRemoved++

              continue
            }

            const outputLine =
              displayName +
              ' | ' +
              channelId

            if (
              uniqueChannels.has(
                outputLine
              )
            ) {
              duplicateChannelsRemoved++

              continue
            }

            uniqueChannels.add(
              outputLine
            )

            channelsKept++
          }

          const sortedChannels =
            Array.from(
              uniqueChannels
            ).sort(
              (
                a,
                b
              ) =>
                a.localeCompare(
                  b,
                  undefined,
                  {
                    sensitivity: 'base'
                  }
                )
            )

          const header = [
            'SOURCE FAST CHANNELS CLEANED',
            'Generated: ' +
              new Date().toISOString(),
            'Total channels: ' +
              sortedChannels.length,
            ''
          ]

          fs.writeFileSync(
            outputPath,
            header
              .concat(
                sortedChannels
              )
              .join(
                '\n'
              ) +
              '\n',
            'utf8'
          )

          console.log(
            'SOURCEFASTCHANNELS cleanup complete'
          )

          console.log(
            'Channels read: ' +
              channelsRead
          )

          console.log(
            'Channels kept: ' +
              channelsKept
          )

          console.log(
            'Local channels removed: ' +
              localChannelsRemoved
          )

          console.log(
            'Exact duplicates removed: ' +
              duplicateChannelsRemoved
          )

          console.log(
            'Invalid lines skipped: ' +
              invalidLinesSkipped
          )

          console.log(
            'Output: ' +
              outputPath
          )
          EOF

      - name: Validate SOURCEFASTCHANNELS2
        run: |
          test -s SOURCEFASTCHANNELS2.txt

          CHANNEL_COUNT=$(grep -c ' | ' SOURCEFASTCHANNELS2.txt || true)

          echo "Cleaned channels written: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -lt 1 ]; then
            echo "No cleaned channels were written"
            exit 1
          fi

      - name: Show cleaned channel preview
        run: |
          echo "First 25 cleaned channels:"
          head -n 30 SOURCEFASTCHANNELS2.txt

          echo ""

          echo "File size:"
          ls -lh SOURCEFASTCHANNELS2.txt

      - name: Commit SOURCEFASTCHANNELS2
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add SOURCEFASTCHANNELS2.txt

          if git diff --cached --quiet; then
            echo "No SOURCEFASTCHANNELS2 changes to commit"
            exit 0
          fi

          git commit -m "Update SOURCEFASTCHANNELS2"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Fetching latest remote changes..."

            git fetch origin main

            if git rebase origin/main; then
              echo "Rebase succeeded"
            else
              echo "Rebase failed. Aborting rebase."

              git rebase --abort || true
            fi

            echo "Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
