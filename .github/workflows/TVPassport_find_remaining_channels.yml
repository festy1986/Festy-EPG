name: TVPassport-Find-Remaining-Channels

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-tvpassport-remaining
  cancel-in-progress: false

jobs:
  find-remaining-tvpassport-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

