name: Fix SVG Logos In TiviMate Curated List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-svg-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Replace SVG logo URLs with PNG
        run: |
          python3 << 'PY'
          from pathlib import Path

          path = Path("guides/tvguidetivimate.xml")
          xml = path.read_text(encoding="utf-8")

          xml = xml.replace(
              "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Action_2025.svg",
              "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/Cinemax_Action_2025.png"
          )

          xml = xml.replace(
              "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/National%20Geographic%20Wild.svg",
              "https://raw.githubusercontent.com/festy1986/festy-epg/main/logos/National%20Geographic%20Wild.png"
          )

          path.write_text(xml, encoding="utf-8")

          print("Fixed:")
          print("- CINEMAX.ACTION.us")
          print("- NAT.GEO.WILD.us")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/tvguidetivimate.xml

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Fix SVG logos in TiviMate curated list"
          git push
