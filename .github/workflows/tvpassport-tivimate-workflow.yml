name: TVPassport-TiviMate

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-tvpassport
  cancel-in-progress: false

jobs:
  build-tvpassport-tivimate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg
          git clone --depth 1 https://github.com/iptv-org/epg.git epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Use prepared TVPassport channel source
        run: |
          mkdir -p epg/sites/tvpassport.com

          SOURCE="guides/TVPassport.channels.xml"
          OUTPUT="epg/sites/tvpassport.com/festy-tvpassport.channels.xml"

          if [ ! -s "$SOURCE" ]; then
            echo "Missing or empty $SOURCE"
            exit 1
          fi

          CHANNELS=$(grep -c '<channel ' "$SOURCE" || true)
          SITE_IDS=$(grep -c 'site_id="' "$SOURCE" || true)

          echo "Prepared TVPassport channels: $CHANNELS"
          echo "Prepared TVPassport site_ids: $SITE_IDS"

          if [ "$CHANNELS" -lt 100 ]; then
            echo "Invalid prepared channel source - expected at least 100 channels"
            exit 1
          fi

          if [ "$SITE_IDS" -lt 100 ]; then
            echo "Invalid prepared channel source - expected at least 100 site_id entries"
            exit 1
          fi

          cp "$SOURCE" "$OUTPUT"


      - name: Write enriched TVPassport config
        run: |
          cat > epg/sites/tvpassport.com/tvpassport.com.config.js <<'EOFJS'
          const axios = require('axios')
          const dayjs = require('dayjs')
          const cheerio = require('cheerio')
          const utc = require('dayjs/plugin/utc')
          const timezone = require('dayjs/plugin/timezone')
          const customParseFormat = require('dayjs/plugin/customParseFormat')

          dayjs.extend(utc)
          dayjs.extend(timezone)
          dayjs.extend(customParseFormat)

          module.exports = {
            site: 'tvpassport.com',
            days: 14,

            url({ channel, date }) {
              return `https://www.tvpassport.com/tv-listings/stations/${channel.site_id}/${date.format('YYYY-MM-DD')}`
            },

            async request() {
              return {
                timeout: Number(process.env.TVPASSPORT_SCHEDULE_TIMEOUT || 30000),
                headers: {
                  Cookie: await getCookie(),
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'
                }
              }
            },

            parser({ content, channel, date }) {
              const programs = []
              const currentTimezone = parseCurrentTimezone(content)
              const items = parseItems(content)

              console.log(`[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${items.length}`)

              for (const item of items) {
                const $item = cheerio.load(item)
                const start = parseStart($item, currentTimezone)
                const duration = parseDuration($item)
                const stop = start.add(duration, 'm')

                let title = cleanTitle(parseTitle($item))
                let episodeTitle = cleanSpaces(parseSubTitle($item))
                const description = cleanPassportDescription(cleanSpaces(parseDescription($item)))
                const image = parseImage($item)
                const rating = parseRating($item)
                const year = parseYear($item)
                const categories = parseCategory($item)
                const actors = parseActors($item)
                const guest = parseGuest($item)
                const director = parseDirector($item)

                if (title === 'Movie' || title === 'Cinéma') {
                  title = episodeTitle
                  episodeTitle = ''
                }

                const programType = classifyProgramType({
                  title,
                  episodeTitle,
                  description,
                  year,
                  categories,
                  duration
                })

                const finalDescription = buildPackedDescription({
                  programType,
                  episodeTitle,
                  episodeCode: '',
                  description,
                  airDate: '',
                  releaseYear: year,
                  suppressDisplayDate: false
                })

                const program = {
                  title,
                  description: finalDescription,
                  start,
                  stop,
                  category: buildCategories(programType, categories)
                }

                if (image) program.image = image
                if (rating) program.rating = rating
                if (actors.length) program.actors = actors
                if (guest.length) program.guest = guest
                if (director.length) program.director = director

                // Keep TiviMate display clean:
                // - <title> only for row title
                // - episode/year/date text packed into <desc>
                // - no separate sub-title, episode-num, or date fields

                programs.push(program)
              }

              return programs
            }
          }

          async function getCookie() {
            const res = await axios.get('https://www.tvpassport.com/tv-listings')
            const setCookie = res.headers['set-cookie']
            if (!setCookie || setCookie.length === 0) return ''
            const cookies = setCookie.map(cookie => cookie.split(';')[0])
            return cookies.join('; ')
          }

          function parseDescription($item) {
            return $item('*').data('description') || ''
          }

          function parseImage($item) {
            const showpicture = $item('*').data('showpicture')
            if (!showpicture) return null
            try {
              return new URL(showpicture, 'https://cdn.tvpassport.com/image/show/960x540/').href
            } catch {
              return null
            }
          }

          function parseTitle($item) {
            return $item('*').data('showname')?.toString() || ''
          }

          function parseSubTitle($item) {
            return $item('*').data('episodetitle')?.toString() || ''
          }

          function parseYear($item) {
            return $item('*').data('year')?.toString() || ''
          }

          function parseCategory($item) {
            const showtype = $item('*').data('showtype')
            return showtype ? String(showtype).split(', ').filter(Boolean) : []
          }

          function parseActors($item) {
            const cast = $item('*').data('cast')
            return cast ? String(cast).split(', ').filter(Boolean) : []
          }

          function parseDirector($item) {
            const director = $item('*').data('director')
            return director ? String(director).split(', ').filter(Boolean) : []
          }

          function parseGuest($item) {
            const guest = $item('*').data('guest')
            return guest ? String(guest).split(', ').filter(Boolean) : []
          }

          function parseRating($item) {
            const rating = $item('*').data('rating')
            return rating
              ? {
                  system: 'MPA',
                  value: String(rating).replace(/^TV/, 'TV-')
                }
              : null
          }

          function parseStart($item, currentTimezone) {
            const time = $item('*').data('st')
            return dayjs.tz(time, 'YYYY-MM-DD HH:mm:ss', currentTimezone)
          }

          function parseDuration($item) {
            const duration = $item('*').data('duration')
            return parseInt(duration || 0, 10)
          }

          function parseItems(content) {
            if (!content) return []
            const $ = cheerio.load(content)
            return $('.station-listings .list-group-item').toArray()
          }

          function parseCurrentTimezone(content) {
            if (!content) return 'America/New_York'
            const $ = cheerio.load(content)
            return $('#timezone_selector').val() || 'America/New_York'
          }

          function classifyProgramType({ title, episodeTitle, description, year, categories, duration }) {
            const haystack = [title, description, categories].flat().filter(Boolean).join(' ').toLowerCase()

            const hasEpisodeSignals = Boolean(episodeTitle)
            if (/mini[\s-]?series|limited series|limited-series/.test(haystack)) return 'miniseries'
            if (/series|episode|tv show|television|scripted|reality|documentary series/.test(haystack)) return 'series'
            if (hasEpisodeSignals) return 'series'
            if (/movie|film|feature film|cinema/.test(haystack)) return 'movie'
            if (duration >= 75 && year && !hasEpisodeSignals) return 'movie'

            return 'program'
          }

          function buildCategories(programType, originalCategories) {
            const categories = Array.isArray(originalCategories) ? originalCategories.filter(Boolean) : []

            if (programType === 'movie') return unique(['Movie', ...categories])
            if (programType === 'miniseries') return unique(['Miniseries', 'Series', ...categories])
            if (programType === 'series') return unique(['Series', ...categories])
            return unique(categories.length ? categories : ['Program'])
          }

          function buildPackedDescription({ programType, episodeTitle, episodeCode, description, airDate, releaseYear, suppressDisplayDate }) {
            const parts = []

            let prefix = ''
            if (programType === 'series' || programType === 'miniseries') {
              if (episodeTitle && episodeCode) prefix = `${episodeTitle} - ${episodeCode}`
              else if (episodeTitle) prefix = episodeTitle
              else if (episodeCode) prefix = episodeCode
            }

            if (prefix) parts.push(prefix)
            if (description) parts.push(description)

            let finalDescription = cleanPackedDescription(parts.join('. '))

            if (programType === 'movie') {
              if (releaseYear && !descriptionIncludesDisplayDate(finalDescription, releaseYear)) {
                finalDescription = finalDescription ? `${finalDescription} (${releaseYear})` : `(${releaseYear})`
              }
              return finalDescription
            }

            if (programType === 'series' || programType === 'miniseries') {
              if (airDate && !suppressDisplayDate && !descriptionIncludesDisplayDate(finalDescription, airDate)) {
                finalDescription = finalDescription ? `${finalDescription} (${airDate})` : `(${airDate})`
              }
              return finalDescription
            }

            const dateOrYear = suppressDisplayDate ? releaseYear : airDate || releaseYear
            if (dateOrYear && !descriptionIncludesDisplayDate(finalDescription, dateOrYear)) {
              finalDescription = finalDescription ? `${finalDescription} (${dateOrYear})` : `(${dateOrYear})`
            }

            return finalDescription
          }

          function cleanPassportDescription(value) {
            return cleanSpaces(value)
              // Remove actor-name parentheticals from Passport descriptions.
              // Example:
              // "James Bond (Daniel Craig) must..." -> "James Bond must..."
              // Keeps years/dates like (2012), ratings, and normal description text.
              .replace(/\s*\(([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})(?:,\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})*\)/g, '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function cleanPackedDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(/\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g, ' ($2)')
              .trim()
          }

          function descriptionIncludesDisplayDate(description, dateOrYear) {
            if (!description || !dateOrYear) return false
            const escaped = String(dateOrYear).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            return new RegExp(`\\(${escaped}\\)\\s*$`).test(description) || description.includes(String(dateOrYear))
          }

          function cleanTitle(value) {
            return cleanSpaces(value)
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function unique(values) {
            return [...new Set(values.filter(Boolean))]
          }
          EOFJS

      - name: Grab TVPassport guide
        run: |
          cd epg

          rm -f ../guides/TVPassport.xml
          rm -f ../guides/TVPassport.pass*.xml
          rm -f ../guides/TVPassport.pass*.log
          rm -f ../guides/TVPassport.pass*.count

          run_pass() {
            PASS_NAME="$1"
            MAX_CONNECTIONS="$2"
            SCHEDULE_TIMEOUT="$3"

            echo ""
            echo "============================================================"
            echo "Starting $PASS_NAME"
            echo "maxConnections=$MAX_CONNECTIONS"
            echo "TVPASSPORT_SCHEDULE_TIMEOUT=$SCHEDULE_TIMEOUT"
            echo "============================================================"

            export TVPASSPORT_SCHEDULE_TIMEOUT="$SCHEDULE_TIMEOUT"

            set +e
            npx tsx scripts/commands/epg/grab.ts \
              --channels=sites/tvpassport.com/festy-tvpassport.channels.xml \
              --output="../guides/TVPassport.${PASS_NAME}.xml" \
              --days=14 \
              --maxConnections="$MAX_CONNECTIONS" \
              2>&1 | tee "../guides/TVPassport.${PASS_NAME}.log"

            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -ne 0 ]; then
              echo "$PASS_NAME exited with status $STATUS"
            fi

            if [ ! -f "../guides/TVPassport.${PASS_NAME}.xml" ]; then
              echo "$PASS_NAME did not create an XML file"
              echo "0" > "../guides/TVPassport.${PASS_NAME}.programmes.count"
              echo "0" > "../guides/TVPassport.${PASS_NAME}.descriptions.count"
              echo "999999" > "../guides/TVPassport.${PASS_NAME}.issues.count"
              return 0
            fi

            PR=$(grep -c '<programme ' "../guides/TVPassport.${PASS_NAME}.xml" || true)
            DESC=$(grep -c '<desc ' "../guides/TVPassport.${PASS_NAME}.xml" || true)

            ISSUE_COUNT=$(grep -Eic 'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' "../guides/TVPassport.${PASS_NAME}.log" || true)

            echo "$PR" > "../guides/TVPassport.${PASS_NAME}.programmes.count"
            echo "$DESC" > "../guides/TVPassport.${PASS_NAME}.descriptions.count"
            echo "$ISSUE_COUNT" > "../guides/TVPassport.${PASS_NAME}.issues.count"

            echo "$PASS_NAME programmes: $PR"
            echo "$PASS_NAME descriptions: $DESC"
            echo "$PASS_NAME possible issues: $ISSUE_COUNT"
          }

          run_pass "pass1-fast" 8 30000

          PASS1_ISSUES=$(cat ../guides/TVPassport.pass1-fast.issues.count)

          if [ "$PASS1_ISSUES" -gt 0 ]; then
            echo ""
            echo "Fast pass had possible issues, running backup pass..."
            run_pass "pass2-backup" 4 45000
          else
            echo ""
            echo "Fast pass had no obvious issues. Skipping backup pass."
          fi

          BEST_PASS="pass1-fast"
          BEST_PR=$(cat ../guides/TVPassport.pass1-fast.programmes.count)
          BEST_DESC=$(cat ../guides/TVPassport.pass1-fast.descriptions.count)
          BEST_ISSUES=$(cat ../guides/TVPassport.pass1-fast.issues.count)

          for PASS in pass2-backup; do
            if [ -f "../guides/TVPassport.${PASS}.programmes.count" ]; then
              CANDIDATE_PR=$(cat "../guides/TVPassport.${PASS}.programmes.count")
              CANDIDATE_DESC=$(cat "../guides/TVPassport.${PASS}.descriptions.count")
              CANDIDATE_ISSUES=$(cat "../guides/TVPassport.${PASS}.issues.count")

              if [ "$CANDIDATE_PR" -gt "$BEST_PR" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -gt "$BEST_DESC" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -eq "$BEST_DESC" ] && [ "$CANDIDATE_ISSUES" -lt "$BEST_ISSUES" ]; then
                BEST_PASS="$PASS"
                BEST_PR="$CANDIDATE_PR"
                BEST_DESC="$CANDIDATE_DESC"
                BEST_ISSUES="$CANDIDATE_ISSUES"
              fi
            fi
          done

          echo ""
          echo "Selected best pass: $BEST_PASS"
          echo "Best programmes: $BEST_PR"
          echo "Best descriptions: $BEST_DESC"
          echo "Best possible issues: $BEST_ISSUES"

          cp "../guides/TVPassport.${BEST_PASS}.xml" "../guides/TVPassport.xml"

          cd ..

      - name: Fill missing TVPassport metadata from TMDB, then TVMaze
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          node <<'EOFJS'
          const fs = require('fs')

          const guidePath = 'guides/TVPassport.xml'
          const cachePath = 'guides/.tvmaze-tvpassport-cache.json'
          const tmdbApiKey = process.env.TMDB_API_KEY || ''

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing ${guidePath}`)
            process.exit(1)
          }

          const xml = fs.readFileSync(guidePath, 'utf8')
          let cache = { tmdb: {}, tvmaze: {} }

          if (fs.existsSync(cachePath)) {
            try {
              const loaded = JSON.parse(fs.readFileSync(cachePath, 'utf8'))
              if (loaded && typeof loaded === 'object' && (loaded.tmdb || loaded.tvmaze)) {
                cache = { tmdb: loaded.tmdb || {}, tvmaze: loaded.tvmaze || {} }
              } else if (loaded && typeof loaded === 'object') {
                // Backward-compatible with the old TVMaze-only cache format.
                cache = { tmdb: {}, tvmaze: loaded }
              }
            } catch {
              cache = { tmdb: {}, tvmaze: {} }
            }
          }

          const stats = {
            programmes: 0,
            moviesSkipped: 0,
            tmdbSkippedNoKey: 0,
            tmdbShowsSearched: 0,
            tmdbShowsMatched: 0,
            tmdbEpisodesMatched: 0,
            tmdbProgrammesEnriched: 0,
            tvmazeShowsSearched: 0,
            tvmazeShowsMatched: 0,
            tvmazeEpisodesMatched: 0,
            tvmazeProgrammesEnriched: 0,
            tmdbAddedCategory: 0,
            tmdbAddedEpisodeTitle: 0,
            tmdbAddedEpisodeCode: 0,
            tmdbAddedDate: 0,
            tmdbAddedDescription: 0,
            tvmazeAddedCategory: 0,
            tvmazeAddedEpisodeTitle: 0,
            tvmazeAddedEpisodeCode: 0,
            tvmazeAddedDate: 0,
            tvmazeAddedDescription: 0,
            categoriesAdded: 0,
            descriptionsChanged: 0
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms))
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function stripTags(s) {
            return decodeXml(String(s || '').replace(/<[^>]+>/g, '').trim())
          }

          function getTag(block, tag) {
            const m = block.match(new RegExp(`<${tag}\\b[^>]*>([\s\S]*?)<\/${tag}>`, 'i'))
            return m ? stripTags(m[1]) : ''
          }

          function getTags(block, tag) {
            return [...block.matchAll(new RegExp(`<${tag}\\b[^>]*>([\s\S]*?)<\/${tag}>`, 'gi'))]
              .map(m => stripTags(m[1]))
              .filter(Boolean)
          }

          function hasTag(block, tag) {
            return new RegExp(`<${tag}\\b`, 'i').test(block)
          }

          function hasCategory(block, category) {
            return getTags(block, 'category').some(c => c.toLowerCase() === category.toLowerCase())
          }

          function hasAnyCategory(block) {
            return hasTag(block, 'category')
          }

          function isMovie(block) {
            return hasCategory(block, 'Movie') || hasCategory(block, 'Film')
          }

          function cleanTitleForSearch(title) {
            return String(title || '')
              .replace(/\s+/g, ' ')
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/\+/g, 'plus')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function sameNorm(a, b) {
            return normalize(a) === normalize(b)
          }

          function scoreName(title, candidate) {
            const a = normalize(title)
            const b = normalize(candidate)
            if (!a || !b) return 0
            if (a === b) return 100
            if (a.includes(b) || b.includes(a)) return 82
            const aw = new Set(a.split(' ').filter(Boolean))
            const bw = b.split(' ').filter(Boolean)
            const overlap = bw.filter(w => aw.has(w)).length
            return Math.round((overlap / Math.max(aw.size, bw.length, 1)) * 75)
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function cleanSummary(value) {
            return decodeXml(String(value || '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\s+/g, ' ')
              .trim())
          }

          function formatDateDisplay(date) {
            if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return ''
            return `${date.slice(5, 7)}/${date.slice(8, 10)}/${date.slice(0, 4)}`
          }

          function getStartDate(block) {
            const m = block.match(/start="(\d{8})/i)
            if (!m) return ''
            return `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}`
          }

          function parseEpisodeCode(value) {
            const m = String(value || '').match(/\bS(\d+)E(\d+)\b/i)
            if (!m) return null
            return { season: Number(m[1]), episode: Number(m[2]), code: `S${Number(m[1])}E${Number(m[2])}` }
          }

          function buildEpisodeCode(season, episode) {
            const s = Number(season)
            const e = Number(episode)
            if (!Number.isFinite(s) || !Number.isFinite(e) || s < 1 || e < 1) return ''
            return `S${s}E${e}`
          }

          function parsePackedDescription(desc) {
            const original = cleanSpaces(desc)
            let working = original
            let dateText = ''

            const dateMatch = working.match(/\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/)
            if (dateMatch) {
              dateText = dateMatch[1]
              working = working.slice(0, dateMatch.index).trim()
            }

            let episodeTitle = ''
            let episodeCode = ''
            let body = working
            const firstSentence = working.match(/^(.+?)(?:\.\s+|$)/)
            const first = firstSentence ? firstSentence[1].trim() : ''
            const rest = firstSentence && firstSentence[0].length < working.length
              ? working.slice(firstSentence[0].length).trim()
              : ''

            const prefixMatch = first.match(/^(.+?)\s+-\s+(S\d+E\d+|S\d+|E\d+)$/i)
            const codeOnlyMatch = first.match(/^(S\d+E\d+|S\d+|E\d+)$/i)

            if (prefixMatch) {
              episodeTitle = prefixMatch[1].trim()
              episodeCode = prefixMatch[2].toUpperCase()
              body = rest
            } else if (codeOnlyMatch) {
              episodeCode = codeOnlyMatch[1].toUpperCase()
              body = rest
            } else if (first && rest && first.length <= 80 && !/[!?]$/.test(first)) {
              // Provider often packs episode title as the first sentence.
              // Treat it as provider-owned episode title, but keep the body untouched.
              episodeTitle = first
              body = rest
            } else {
              const code = parseEpisodeCode(working)
              if (code) episodeCode = code.code
              body = working
            }

            return {
              original,
              episodeTitle,
              episodeCode,
              body,
              dateText
            }
          }

          function descHasDisplayDate(desc, date) {
            const display = formatDateDisplay(date)
            if (!desc || !display) return false
            return desc.includes(`(${display})`) || desc.includes(display)
          }

          function buildPackedDescription(parts) {
            const prefixParts = []
            if (parts.episodeTitle) prefixParts.push(parts.episodeTitle)
            if (parts.episodeCode) {
              if (prefixParts.length) prefixParts[0] = `${prefixParts[0]} - ${parts.episodeCode}`
              else prefixParts.push(parts.episodeCode)
            }

            const out = []
            if (prefixParts[0]) out.push(prefixParts[0])
            if (parts.body) {
              const prefixNorm = normalize(prefixParts[0] || '')
              const bodyNorm = normalize(parts.body)
              if (!prefixNorm || prefixNorm !== bodyNorm) out.push(parts.body)
            }

            let finalDesc = cleanSpaces(out.join('. '))
            if (parts.dateText) finalDesc = finalDesc ? `${finalDesc} (${parts.dateText})` : `(${parts.dateText})`
            return cleanSpaces(finalDesc)
          }

          function replaceTag(block, tag, value) {
            const escaped = escapeXml(value)
            const tagXml = `  <${tag} lang="en">${escaped}</${tag}>`
            if (hasTag(block, tag)) {
              return block.replace(new RegExp(`<${tag}\\b[^>]*>[\s\S]*?<\/${tag}>`, 'i'), tagXml.trim())
            }
            return insertBeforeProgrammeEnd(block, tagXml)
          }

          function insertBeforeProgrammeEnd(block, tagXml) {
            return block.replace(/<\/programme>\s*$/i, `${tagXml}\n</programme>`)
          }

          function missingPieces(block) {
            const desc = getTag(block, 'desc')
            const parsed = parsePackedDescription(desc)
            return {
              missingCategory: !hasAnyCategory(block),
              missingEpisodeTitle: !parsed.episodeTitle,
              missingEpisodeCode: !parsed.episodeCode,
              missingBody: !parsed.body,
              missingDate: !parsed.dateText,
              parsed
            }
          }

          function needsEnrichment(block) {
            const m = missingPieces(block)
            return m.missingCategory || m.missingEpisodeTitle || m.missingEpisodeCode || m.missingBody || m.missingDate
          }

          async function fetchJson(url, label, headers = {}) {
            const attempts = 4
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, { headers })
                if (response.status === 404) return null
                if (response.status === 429 || response.status >= 500) throw new Error(`HTTP ${response.status}`)
                if (!response.ok) return null
                return await response.json()
              } catch (err) {
                if (attempt === attempts) {
                  console.log(`[FETCH FAIL] ${label} | ${err.message}`)
                  return null
                }
                const delay = 800 * attempt + Math.floor(Math.random() * 400)
                console.log(`[FETCH RETRY] ${label} | ${err.message} | attempt=${attempt}/${attempts}`)
                await sleep(delay)
              }
            }
            return null
          }

          function tmdbUrl(path, params = {}) {
            const url = new URL(`https://api.themoviedb.org/3${path}`)
            url.searchParams.set('api_key', tmdbApiKey)
            url.searchParams.set('language', 'en-US')
            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, value)
            }
            return url.href
          }

          async function tmdbSearchShow(title) {
            if (!tmdbApiKey) return null
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]

            stats.tmdbShowsSearched++
            const data = await fetchJson(tmdbUrl('/search/tv', { query: title }), `tmdb search ${title}`, { 'User-Agent': 'festy-epg-tvpassport-tmdb-tvmaze-missing-only/1.0' })
            const results = Array.isArray(data?.results) ? data.results : []

            let best = null
            let bestScore = 0
            for (const show of results) {
              const score = Math.max(scoreName(title, show.name), scoreName(title, show.original_name))
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null
            if (best) stats.tmdbShowsMatched++

            cache.tmdb[key] = best
            await sleep(125)
            return best
          }

          async function tmdbShowDetails(showId) {
            if (!tmdbApiKey || !showId) return null
            const key = `details:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]
            const details = await fetchJson(tmdbUrl(`/tv/${showId}`), `tmdb details ${showId}`, { 'User-Agent': 'festy-epg-tvpassport-tmdb-tvmaze-missing-only/1.0' })
            cache.tmdb[key] = details || null
            await sleep(125)
            return cache.tmdb[key]
          }

          async function tmdbSeason(showId, seasonNumber) {
            if (!tmdbApiKey || !showId || !seasonNumber) return null
            const key = `season:${showId}:${seasonNumber}`
            if (Object.prototype.hasOwnProperty.call(cache.tmdb, key)) return cache.tmdb[key]
            const season = await fetchJson(tmdbUrl(`/tv/${showId}/season/${seasonNumber}`), `tmdb season ${showId}/${seasonNumber}`, { 'User-Agent': 'festy-epg-tvpassport-tmdb-tvmaze-missing-only/1.0' })
            cache.tmdb[key] = season || null
            await sleep(125)
            return cache.tmdb[key]
          }

          async function tmdbFindEpisode(show, parsed) {
            if (!show?.id) return null

            const code = parseEpisodeCode(parsed.episodeCode)
            if (code) {
              const season = await tmdbSeason(show.id, code.season)
              const episode = season?.episodes?.find(ep => Number(ep.episode_number) === code.episode)
              if (episode) return episode
            }

            const episodeTitle = parsed.episodeTitle
            if (!episodeTitle) return null

            const details = await tmdbShowDetails(show.id)
            const seasons = Array.isArray(details?.seasons) ? details.seasons : []
            const regularSeasons = seasons
              .map(s => Number(s.season_number))
              .filter(n => Number.isFinite(n) && n > 0)
              .slice(0, 60)

            for (const seasonNumber of regularSeasons) {
              const season = await tmdbSeason(show.id, seasonNumber)
              const episodes = Array.isArray(season?.episodes) ? season.episodes : []
              const exact = episodes.find(ep => sameNorm(ep.name, episodeTitle))
              if (exact) return exact
              const fuzzy = episodes.find(ep => scoreName(episodeTitle, ep.name) >= 92)
              if (fuzzy) return fuzzy
            }

            return null
          }

          async function tmdbEnrichState(state, title, block) {
            if (!tmdbApiKey) {
              stats.tmdbSkippedNoKey++
              return state
            }

            const show = await tmdbSearchShow(title)
            if (!show) return state

            const details = await tmdbShowDetails(show.id)
            const episode = await tmdbFindEpisode(show, state)
            if (episode) stats.tmdbEpisodesMatched++

            let changed = false
            const next = { ...state }

            if (!next.category) {
              const type = String(details?.type || '').toLowerCase()
              next.category = type.includes('mini') ? 'Miniseries' : 'Series'
              changed = true
              stats.tmdbAddedCategory++
            }

            if (episode) {
              if (!next.episodeTitle && episode.name) { next.episodeTitle = cleanSummary(episode.name); changed = true; stats.tmdbAddedEpisodeTitle++ }
              if (!next.episodeCode) {
                const code = buildEpisodeCode(episode.season_number, episode.episode_number)
                if (code) { next.episodeCode = code; changed = true; stats.tmdbAddedEpisodeCode++ }
              }
              if (!next.dateText && episode.air_date) {
                const display = formatDateDisplay(episode.air_date)
                if (display) { next.dateText = display; changed = true; stats.tmdbAddedDate++ }
              }
              if (!next.body && episode.overview) { next.body = cleanSummary(episode.overview); changed = true; stats.tmdbAddedDescription++ }
            }

            if (!next.body && details?.overview) { next.body = cleanSummary(details.overview); changed = true; stats.tmdbAddedDescription++ }

            if (changed) stats.tmdbProgrammesEnriched++
            return next
          }

          async function tvmazeSearchShow(title) {
            const key = `show:${normalize(title)}`
            if (Object.prototype.hasOwnProperty.call(cache.tvmaze, key)) return cache.tvmaze[key]

            stats.tvmazeShowsSearched++
            const url = `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(title)}`
            const result = await fetchJson(url, `tvmaze search ${title}`, { 'User-Agent': 'festy-epg-tvpassport-tmdb-tvmaze-missing-only/1.0' })
            const candidates = Array.isArray(result) ? result.map(x => x.show).filter(Boolean) : []

            let best = null
            let bestScore = 0
            for (const show of candidates) {
              const type = String(show?.type || '').toLowerCase()
              if (type === 'movie' || type === 'film') continue
              const score = scoreName(title, show.name)
              if (score > bestScore) {
                best = show
                bestScore = score
              }
            }

            if (bestScore < 80) best = null
            if (best) stats.tvmazeShowsMatched++

            cache.tvmaze[key] = best
            await sleep(250)
            return best
          }

          async function tvmazeEpisodes(showId) {
            const key = `episodes:${showId}`
            if (Object.prototype.hasOwnProperty.call(cache.tvmaze, key)) return cache.tvmaze[key]

            const episodes = await fetchJson(`https://api.tvmaze.com/shows/${showId}/episodes`, `tvmaze episodes ${showId}`, { 'User-Agent': 'festy-epg-tvpassport-tmdb-tvmaze-missing-only/1.0' })
            cache.tvmaze[key] = Array.isArray(episodes) ? episodes : []
            await sleep(250)
            return cache.tvmaze[key]
          }

          async function tvmazeFindEpisode(show, state, block) {
            if (!show?.id) return null
            const episodes = await tvmazeEpisodes(show.id)
            const code = parseEpisodeCode(state.episodeCode)
            if (code) {
              const byCode = episodes.find(ep => Number(ep.season) === code.season && Number(ep.number) === code.episode)
              if (byCode) return byCode
            }

            if (state.episodeTitle) {
              const byTitle = episodes.find(ep => sameNorm(ep.name, state.episodeTitle)) ||
                episodes.find(ep => scoreName(state.episodeTitle, ep.name) >= 92)
              if (byTitle) return byTitle
            }

            const scheduleDate = getStartDate(block)
            if (scheduleDate) {
              const byDate = episodes.find(ep => ep.airdate === scheduleDate)
              if (byDate) return byDate
            }

            return null
          }

          async function tvmazeEnrichState(state, title, block) {
            const show = await tvmazeSearchShow(title)
            if (!show) return state

            const episode = await tvmazeFindEpisode(show, state, block)
            if (episode) stats.tvmazeEpisodesMatched++

            let changed = false
            const next = { ...state }

            if (!next.category) {
              const type = String(show?.type || '').toLowerCase()
              next.category = type.includes('mini') || type.includes('limited') ? 'Miniseries' : 'Series'
              changed = true
              stats.tvmazeAddedCategory++
            }

            if (episode) {
              if (!next.episodeTitle && episode.name) { next.episodeTitle = cleanSummary(episode.name); changed = true; stats.tvmazeAddedEpisodeTitle++ }
              if (!next.episodeCode) {
                const code = buildEpisodeCode(episode.season, episode.number)
                if (code) { next.episodeCode = code; changed = true; stats.tvmazeAddedEpisodeCode++ }
              }
              if (!next.dateText && episode.airdate) {
                const display = formatDateDisplay(episode.airdate)
                if (display) { next.dateText = display; changed = true; stats.tvmazeAddedDate++ }
              }
              if (!next.body && episode.summary) { next.body = cleanSummary(episode.summary); changed = true }
            }

            if (!next.body && show?.summary) { next.body = cleanSummary(show.summary); changed = true }

            if (changed) stats.tvmazeProgrammesEnriched++
            return next
          }

          function stateFromBlock(block) {
            const desc = getTag(block, 'desc')
            const parsed = parsePackedDescription(desc)
            const categories = getTags(block, 'category')
            return {
              episodeTitle: parsed.episodeTitle,
              episodeCode: parsed.episodeCode,
              body: parsed.body,
              dateText: parsed.dateText,
              category: categories[0] || '',
              originalDesc: parsed.original
            }
          }

          function applyStateMissingOnly(block, before, after) {
            let updated = block
            let changed = false

            if (!before.category && after.category && !hasAnyCategory(updated)) {
              updated = insertBeforeProgrammeEnd(updated, `  <category lang="en">${escapeXml(after.category)}</category>`)
              changed = true
              stats.categoriesAdded++
            }

            const beforeDesc = buildPackedDescription(before)
            const afterDesc = buildPackedDescription(after)
            const existingDesc = getTag(updated, 'desc')

            if (afterDesc && afterDesc !== existingDesc && afterDesc !== beforeDesc) {
              updated = replaceTag(updated, 'desc', afterDesc)
              changed = true
              stats.descriptionsChanged++
            }

            return { block: updated, changed }
          }

          async function main() {
            const parts = xml.split(/(<programme\b[\s\S]*?<\/programme>)/gi)
            const out = []

            for (const part of parts) {
              if (!/^<programme\b/i.test(part)) {
                out.push(part)
                continue
              }

              stats.programmes++
              let block = part
              const title = cleanTitleForSearch(getTag(block, 'title'))

              if (!title || isMovie(block) || !needsEnrichment(block)) {
                if (isMovie(block)) stats.moviesSkipped++
                out.push(block)
                continue
              }

              const providerState = stateFromBlock(block)
              let currentState = { ...providerState }

              currentState = await tmdbEnrichState(currentState, title, block)
              currentState = await tvmazeEnrichState(currentState, title, block)

              const applied = applyStateMissingOnly(block, providerState, currentState)
              out.push(applied.block)
            }

            fs.writeFileSync(guidePath, out.join(''))
            fs.writeFileSync(cachePath, JSON.stringify(cache, null, 2))

            console.log('[TMDB+TVMAZE] missing-only enrichment complete')
            console.log(`[TMDB+TVMAZE] programmes scanned: ${stats.programmes}`)
            console.log(`[TMDB+TVMAZE] movies skipped: ${stats.moviesSkipped}`)
            console.log(`[TMDB+TVMAZE] tmdb skipped no key: ${stats.tmdbSkippedNoKey}`)
            console.log(`[TMDB+TVMAZE] tmdb shows searched: ${stats.tmdbShowsSearched}`)
            console.log(`[TMDB+TVMAZE] tmdb shows matched: ${stats.tmdbShowsMatched}`)
            console.log(`[TMDB+TVMAZE] tmdb episodes matched: ${stats.tmdbEpisodesMatched}`)
            console.log(`[TMDB+TVMAZE] tmdb programmes enriched: ${stats.tmdbProgrammesEnriched}`)
            console.log(`[TMDB+TVMAZE] tvmaze shows searched: ${stats.tvmazeShowsSearched}`)
            console.log(`[TMDB+TVMAZE] tvmaze shows matched: ${stats.tvmazeShowsMatched}`)
            console.log(`[TMDB+TVMAZE] tvmaze episodes matched: ${stats.tvmazeEpisodesMatched}`)
            console.log(`[TMDB+TVMAZE] tvmaze programmes enriched: ${stats.tvmazeProgrammesEnriched}`)
            console.log(`[TMDB FIXED] categories: ${stats.tmdbAddedCategory}`)
            console.log(`[TMDB FIXED] episode titles: ${stats.tmdbAddedEpisodeTitle}`)
            console.log(`[TMDB FIXED] episode codes: ${stats.tmdbAddedEpisodeCode}`)
            console.log(`[TMDB FIXED] dates: ${stats.tmdbAddedDate}`)
            console.log(`[TMDB FIXED] descriptions: ${stats.tmdbAddedDescription}`)
            console.log(`[TVMAZE FIXED] categories: ${stats.tvmazeAddedCategory}`)
            console.log(`[TVMAZE FIXED] episode titles: ${stats.tvmazeAddedEpisodeTitle}`)
            console.log(`[TVMAZE FIXED] episode codes: ${stats.tvmazeAddedEpisodeCode}`)
            console.log(`[TVMAZE FIXED] dates: ${stats.tvmazeAddedDate}`)
            console.log(`[TVMAZE FIXED] descriptions: ${stats.tvmazeAddedDescription}`)
            console.log(`[TMDB+TVMAZE] categories added to XML: ${stats.categoriesAdded}`)
            console.log(`[TMDB+TVMAZE] descriptions changed in XML: ${stats.descriptionsChanged}`)
          }

          main().catch(err => {
            console.error(err)
            process.exit(1)
          })
          EOFJS

      - name: Validate TVPassport output
        run: |
          CH=$(grep -c '<channel ' guides/TVPassport.xml || true)
          PR=$(grep -c '<programme ' guides/TVPassport.xml || true)
          DESC=$(grep -c '<desc ' guides/TVPassport.xml || true)

          echo "TVPassport channels: $CH"
          echo "TVPassport programmes: $PR"
          echo "TVPassport descriptions: $DESC"

          if [ "$CH" -lt 100 ]; then
            echo "Invalid TVPassport output - expected at least 100 channels"
            exit 1
          fi

          if [ "$PR" -lt 1 ]; then
            echo "Invalid TVPassport output - no programmes"
            exit 1
          fi

          if [ "$DESC" -lt 1 ]; then
            echo "Invalid TVPassport output - no descriptions"
            exit 1
          fi


      - name: Inject curated TVPassport logos into generated guide
        run: |
          node <<'EOFJS'
          const fs = require('fs')

          const curatedPath = 'guides/TVPassport.channels.xml'
          const guidePath = 'guides/TVPassport.xml'

          if (!fs.existsSync(curatedPath)) {
            console.error(`Missing curated channel list: ${curatedPath}`)
            process.exit(1)
          }

          if (!fs.existsSync(guidePath)) {
            console.error(`Missing generated guide: ${guidePath}`)
            process.exit(1)
          }

          function decodeXml(s) {
            return String(s || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(s) {
            return String(s || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function attr(attrs, name) {
            const m = attrs.match(new RegExp(`${name}="([^"]*)"`, 'i'))
            return m ? decodeXml(m[1]).trim() : ''
          }

          function normalize(s) {
            return decodeXml(s)
              .toLowerCase()
              .replace(/&/g, 'and')
              .replace(/\+/g, 'plus')
              .replace(/\.us$/i, '')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
          }

          function channelName(block) {
            const display = block.match(/<display-name\b[^>]*>([\s\S]*?)<\/display-name>/i)
            if (display) return decodeXml(display[1].replace(/<[^>]+>/g, '').trim())
            return decodeXml(block.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim())
          }

          function iconFromCurated(block, attrs) {
            const iconMatch = block.match(/<icon\b[^>]*src="([^"]+)"/i)
            if (iconMatch) return decodeXml(iconMatch[1]).trim()

            const logoAttr = attr(attrs, 'logo')
            if (logoAttr) return logoAttr

            return ''
          }

          const curatedXml = fs.readFileSync(curatedPath, 'utf8')
          let guideXml = fs.readFileSync(guidePath, 'utf8')

          const logoById = new Map()
          const logoByName = new Map()

          for (const match of curatedXml.matchAll(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi)) {
            const attrs = match[1]
            const block = match[0]
            const id = attr(attrs, 'xmltv_id') || attr(attrs, 'id')
            const name = channelName(block)
            const logo = iconFromCurated(block, attrs)

            if (!logo) continue

            if (id) logoById.set(id, logo)
            if (id) logoById.set(decodeXml(id).replace(/&amp;/g, '&'), logo)
            if (name) logoByName.set(normalize(name), logo)
          }

          let scanned = 0
          let matched = 0
          let alreadyCorrect = 0
          let added = 0
          let updated = 0
          let missing = 0

          guideXml = guideXml.replace(/<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi, (block, attrs) => {
            scanned++

            const id = attr(attrs, 'id') || attr(attrs, 'xmltv_id')
            const name = channelName(block)

            const logo =
              logoById.get(id) ||
              logoById.get(decodeXml(id).replace(/&amp;/g, '&')) ||
              logoByName.get(normalize(name))

            if (!logo) {
              missing++
              return block
            }

            matched++

            const existingIcon = block.match(/<icon\b[^>]*src="([^"]+)"/i)
            if (existingIcon) {
              const existingLogo = decodeXml(existingIcon[1]).trim()
              if (existingLogo === logo) {
                alreadyCorrect++
                return block
              }

              updated++
              return block.replace(/<icon\b[^>]*src="[^"]*"[^/]*\/>/i, `<icon src="${escapeXml(logo)}"/>`)
            }

            added++
            return block.replace(/(<display-name\b[^>]*>[\s\S]*?<\/display-name>)/i, `$1<icon src="${escapeXml(logo)}"/>`)
          })

          fs.writeFileSync(guidePath, guideXml)

          console.log(`Generated TVPassport channels scanned: ${scanned}`)
          console.log(`Curated TVPassport logos available by id: ${logoById.size}`)
          console.log(`Curated TVPassport logos available by name: ${logoByName.size}`)
          console.log(`TVPassport channels matched to curated logos: ${matched}`)
          console.log(`TVPassport icons already correct: ${alreadyCorrect}`)
          console.log(`TVPassport icons added: ${added}`)
          console.log(`TVPassport icons updated: ${updated}`)
          console.log(`TVPassport channels still missing curated logo match: ${missing}`)

          if (scanned < 100) {
            console.error(`Expected at least 100 TVPassport channels, scanned ${scanned}`)
            process.exit(1)
          }

          if (matched < 100) {
            console.error('Refusing to continue: expected at least 100 TVPassport channels to match curated logos')
            process.exit(1)
          }
          EOFJS

      - name: Compress TVPassport guide
        run: |
          gzip -c guides/TVPassport.xml > guides/TVPassport.xml.gz

      - name: Commit and push TVPassport guide safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main

          # Preserve compressed guides created by the other workflows.
          # This workflow should only update its own XML/GZ output.
          git checkout origin/main -- guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

          git add guides/TVPassport.xml guides/TVPassport.xml.gz
          git add guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No TVPassport guide changes to commit"
            exit 0
          fi

          git commit -m "Update TVPassport guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, retrying after fresh fetch/rebase..."

            git fetch origin main
            git rebase origin/main

            git checkout origin/main -- guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

            git add guides/TVPassport.xml guides/TVPassport.xml.gz
            git add guides/OTALocalsguide.xml.gz guides/tvguidetivimateguide.xml.gz 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No new commit needed after rebase, retrying push..."
            else
              git commit -m "Update TVPassport guide"
            fi

            sleep 5
          done

          echo "Push failed after retries"
          exit 1
