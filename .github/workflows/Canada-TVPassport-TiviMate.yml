      - name: Inject equivalent curated logos
        run: |

          node <<'EOFJS'

          const fs =
            require(
              'fs'
            )


          const guidePath =
            'guides/TVPassportCanada.xml'


          const candidates = [

            'guides/TVPassport.channels.xml',

            'guides/tvguide.xml',

            'guides/tvguidetivimateguide.xml',

            'guides/OTALocalsguide.xml'

          ]


          const curatedPath =
            candidates.find(

              file =>
                fs.existsSync(
                  file
                )

            )


          if (!curatedPath) {

            console.log(

              'No existing curated logo source found; keeping generated logos.'

            )

            process.exit(
              0
            )

          }


          function decodeXml(s) {

            return String(
              s || ''
            )

              .replace(
                /&amp;/g,
                '&'
              )

              .replace(
                /&quot;/g,
                '"'
              )

              .replace(
                /&apos;/g,
                "'"
              )

              .replace(
                /&lt;/g,
                '<'
              )

              .replace(
                /&gt;/g,
                '>'
              )

          }


          function escapeXml(s) {

            return String(
              s || ''
            )

              .replace(
                /&/g,
                '&amp;'
              )

              .replace(
                /"/g,
                '&quot;'
              )

              .replace(
                /</g,
                '&lt;'
              )

              .replace(
                />/g,
                '&gt;'
              )

          }


          function normalize(s) {

            return decodeXml(
              s
            )

              .toLowerCase()

              .replace(
                /&/g,
                'and'
              )

              .replace(
                /\+/g,
                'plus'
              )

              .replace(
                /[^a-z0-9]+/g,
                ' '
              )

              .replace(
                /\s+/g,
                ' '
              )

              .trim()

          }


          function compact(s) {

            return normalize(
              s
            ).replace(

              /[^a-z0-9]/g,

              ''

            )

          }


          function attr(

            attrs,

            name

          ) {


            const match =
              attrs.match(

                new RegExp(

                  `${name}="([^"]*)"`,

                  'i'

                )

              )


            return match

              ? decodeXml(
                  match[1]
                ).trim()

              : ''

          }


          function channelName(
            block
          ) {


            const display =
              block.match(

                /<display-name\b[^>]*>([\s\S]*?)<\/display-name>/i

              )


            if (display)

              return decodeXml(

                display[1]

                  .replace(
                    /<[^>]+>/g,
                    ''
                  )

                  .trim()

              )


            return decodeXml(

              block

                .replace(
                  /<[^>]+>/g,
                  ' '
                )

                .replace(
                  /\s+/g,
                  ' '
                )

                .trim()

            )

          }


          function iconFromBlock(

            block,

            attrs

          ) {


            const icon =
              block.match(

                /<icon\b[^>]*src="([^"]+)"/i

              )


            if (icon)

              return decodeXml(

                icon[1]
              ).trim()


            return attr(

              attrs,

              'logo'

            )

          }


          function score(

            target,

            candidate

          ) {


            const a =
              normalize(
                target
              )


            const b =
              normalize(
                candidate
              )


            if (
              !a
              || !b
            )

              return 0


            const ac =
              compact(
                target
              )


            const bc =
              compact(
                candidate
              )


            if (
              ac === bc
            )

              return 100


            if (

              ac.includes(
                bc
              )

              || bc.includes(
                ac
              )

            )

              return 80


            const at =
              new Set(

                a.split(
                  ' '
                )

              )


            const bt =
              new Set(

                b.split(
                  ' '
                )

              )


            let overlap = 0


            for (
              const token of at
            ) {


              if (

                token.length > 1

                && bt.has(
                  token
                )

              )

                overlap++

            }


            return overlap * 15

          }


          const curatedXml =
            fs.readFileSync(

              curatedPath,

              'utf8'

            )


          let guideXml =
            fs.readFileSync(

              guidePath,

              'utf8'

            )


          const logos = []


          for (

            const match of curatedXml.matchAll(

              /<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi

            )

          ) {


            const attrs =
              match[1]


            const block =
              match[0]


            const name =
              channelName(
                block
              )


            const logo =
              iconFromBlock(

                block,

                attrs

              )


            if (!logo)

              continue


            logos.push(

              {

                name,

                logo

              }

            )

          }


          let scanned = 0

          let matched = 0

          let added = 0

          let updated = 0


          guideXml =
            guideXml.replace(

              /<channel\b([^>]*)>([\s\S]*?)<\/channel>/gi,

              (

                block,

                attrs

              ) => {


                scanned++


                const name =
                  channelName(
                    block
                  )


                let best = null

                let bestScore = 0


                for (

                  const candidate of logos

                ) {


                  const candidateScore =
                    score(

                      name,

                      candidate.name

                    )


                  if (

                    candidateScore > bestScore

                  ) {


                    bestScore =
                      candidateScore

                    best =
                      candidate

                  }

                }


                if (

                  !best

                  || bestScore < 80

                )

                  return block


                matched++


                const existing =
                  block.match(

                    /<icon\b[^>]*src="([^"]+)"/i

                  )


                if (existing) {


                  const existingLogo =
                    decodeXml(

                      existing[1]

                    ).trim()


                  if (

                    existingLogo === best.logo

                  )

                    return block


                  updated++


                  return block.replace(

                    /<icon\b[^>]*src="[^"]*"[^/]*\/>/i,

                    `<icon src="${escapeXml(best.logo)}"/>`

                  )

                }


                added++


                return block.replace(

                  /(<display-name\b[^>]*>[\s\S]*?<\/display-name>)/i,

                  `$1<icon src="${escapeXml(best.logo)}"/>`

                )

              }

            )


          fs.writeFileSync(

            guidePath,

            guideXml

          )


          console.log(

            `Existing logo source: ${curatedPath}`

          )


          console.log(

            `Canada channels scanned: ${scanned}`

          )


          console.log(

            `Equivalent curated logos matched: ${matched}`

          )


          console.log(

            `Canada logos added: ${added}`

          )


          console.log(

            `Canada logos updated: ${updated}`

          )

          EOFJS

      - name: Compress Canada TVPassport guide
        run: |

          gzip -c \

            guides/TVPassportCanada.xml \

            > guides/TVPassportCanada.xml.gz

      - name: Commit and push Canada TVPassport guide safely
        run: |

          git config \

            user.name \

            "github-actions"


          git config \

            user.email \

            "github-actions@github.com"


          git fetch origin main


          git add \

            guides/TVPassportCanada.xml \

            guides/TVPassportCanada.xml.gz \

            config/TVPassportCanada-matching.txt


          if git diff --cached --quiet; then

            echo "No Canada TVPassport guide or matching report changes to commit"

            exit 0

          fi


          git commit \

            -m "Update Canada TVPassport guide"


          for attempt in 1 2 3 4 5; do


            echo "Push attempt $attempt"


            if git push origin HEAD:main; then

              echo "Push succeeded"

              exit 0

            fi


            echo "Push failed, retrying after fresh fetch/rebase..."


            git fetch origin main


            git rebase origin/main


            git add \

              guides/TVPassportCanada.xml \

              guides/TVPassportCanada.xml.gz \

              config/TVPassportCanada-matching.txt


            if git diff --cached --quiet; then

              echo "No new commit needed after rebase"

            else

              git commit \

                -m "Update TVPassport Canada guide"

            fi


            sleep 5

          done


          echo "Push failed after retries"

          exit 1
