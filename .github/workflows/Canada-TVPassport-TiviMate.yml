name: TVPassport-Canada-TiviMate

on:
  workflow_dispatch:

  schedule:
    - cron: "35 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-tvpassport-canada
  cancel-in-progress: false

jobs:

  build-tvpassport-canada-tivimate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg

          git clone \
            --depth 1 \
            https://github.com/iptv-org/epg.git \
            epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Build Canada TVPassport channel source
        run: |

          python3 - <<'PY'

          import re
          import html
          from pathlib import Path
          import xml.etree.ElementTree as ET


          MASTER_FILE = Path(
              "config/canada_channels.txt"
          )

          RAW_FILE = Path(
              "config/TVPassportCanada/TVPassportCanadaRAW.xml"
          )

          OUTPUT_FILE = Path(
              "epg/sites/tvpassport.com/festy-tvpassport-canada.channels.xml"
          )

          MATCH_FILE = Path(
              "config/TVPassportCanada-matching.txt"
          )


          if not MASTER_FILE.exists():

              raise SystemExit(
                  f"Missing {MASTER_FILE}"
              )


          if not RAW_FILE.exists():

              raise SystemExit(
                  f"Missing {RAW_FILE}"
              )


          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          def decode(value):

              return html.unescape(
                  str(value or "")
              )


          def normalize(value):

              value = decode(
                  value
              ).lower()

              value = value.replace(
                  "&",
                  "and"
              )

              value = value.replace(
                  "+",
                  " plus "
              )

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          def compact(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  normalize(value)
              )


          def is_on_demand(value):

              normalized = normalize(
                  value
              )

              return (
                  "on demand" in normalized
                  or "ondemand" in normalized
              )


          def tokens(value):

              return set(
                  normalize(value).split()
              )


          def significant_tokens(value):

              ignored = {

                  "ca",
                  "canada",
                  "canadian",
                  "hd",
                  "sd",
                  "east",
                  "west",
                  "central",
                  "north",
                  "south",
                  "network",
                  "channel",
                  "tv",
                  "television",
                  "the",
                  "and",
                  "plus"

              }

              return {

                  token

                  for token in tokens(
                      value
                  )

                  if token not in ignored
                  and len(token) > 1

              }


          def extract_master_channels():

              channels = []

              for line_number, raw_line in enumerate(

                  MASTER_FILE.read_text(
                      encoding="utf-8"
                  ).splitlines(),

                  start=1

              ):

                  line = raw_line.strip()

                  if not line:

                      continue

                  if line.startswith("#"):

                      continue


                  parts = [

                      part.strip()

                      for part in line.split(
                          "|",
                          3
                      )

                  ]


                  if len(parts) != 4:

                      continue


                  stream_id = parts[0]

                  category_id = parts[1]

                  epg_channel_id = parts[2]

                  channel_name = parts[3]


                  if not stream_id.isdigit():

                      continue


                  if not channel_name:

                      continue


                  channels.append(

                      {

                          "stream_id":
                              stream_id,

                          "category_id":
                              category_id,

                          "epg_channel_id":
                              epg_channel_id,

                          "channel_name":
                              channel_name

                      }

                  )


              return channels


          def load_raw_channels():

              raw_text = RAW_FILE.read_text(
                  encoding="utf-8"
              )


              raw_text = raw_text.lstrip(
                  "\ufeff"
              )


              try:

                  root = ET.fromstring(
                      raw_text
                  )


                  return root.findall(
                      ".//channel"
                  )


              except ET.ParseError:

                  wrapped = (

                      "<root>"

                      + raw_text

                      + "</root>"

                  )


                  root = ET.fromstring(
                      wrapped
                  )


                  return root.findall(
                      ".//channel"
                  )


          def channel_values(element):

              site_id = (

                  element.attrib.get(
                      "site_id",
                      ""
                  ).strip()

              )


              passport_xmltv_id = (

                  element.attrib.get(
                      "xmltv_id",
                      ""
                  ).strip()

              )


              channel_name = (

                  element.text or ""
              ).strip()


              return (

                  site_id,

                  passport_xmltv_id,

                  channel_name

              )


          def score_match(

              provider_name,
              provider_epg_id,
              site_id,
              passport_xmltv_id,
              passport_name

          ):


              if is_on_demand(
                  site_id
              ):

                  return -100000


              if is_on_demand(
                  passport_name
              ):

                  return -100000


              provider_name_normalized_lower = normalize(
                  provider_name
              )


              provider_name_compact = compact(
                  provider_name
              )


              provider_epg_id_normalized = normalize(
                  provider_epg_id
              )


              provider_epg_id_compact = compact(
                  provider_epg_id
              )


              site_normalized = normalize(
                  site_id
              )


              site_compact = compact(
                  site_id
              )


              passport_name_normalized = normalize(
                  passport_name
              )


              passport_name_compact = compact(
                  passport_name
              )


              score = 0


              if (

                  provider_name_normalized_lower
                  == passport_name_normalized

              ):

                  score += 300


              if (

                  provider_name_compact
                  == passport_name_compact

              ):

                  score += 300


              if (

                  provider_name_compact
                  in passport_name_compact

              ):

                  score += 150


              if (

                  passport_name_compact
                  in provider_name_compact

              ):

                  score += 150


              if (

                  provider_epg_id_normalized
                  and provider_epg_id_normalized
                  in site_normalized

              ):

                  score += 250


              if (

                  provider_epg_id_compact
                  and provider_epg_id_compact
                  in site_compact

              ):

                  score += 250


              provider_tokens = significant_tokens(
                  provider_name
              )


              passport_tokens = significant_tokens(
                  passport_name
              )


              site_tokens = significant_tokens(
                  site_id
              )


              name_overlap = (

                  provider_tokens
                  & passport_tokens

              )


              site_overlap = (

                  provider_tokens
                  & site_tokens

              )


              score += (

                  len(name_overlap)
                  * 60

              )


              score += (

                  len(site_overlap)
                  * 35

              )


              aliases = {

                  "food network":

                      [

                          "food network canada",

                          "flavour network",

                          "flavour network canada"

                      ],


                  "history":

                      [

                          "history canada",

                          "history channel canada"

                      ],


                  "discovery":

                      [

                          "discovery channel canada"

                      ],


                  "global":

                      [

                          "global tv",

                          "global news"

                      ],


                  "a and e":

                      [

                          "a e",

                          "a&e",

                          "a and e"

                      ]

              }


              for alias, alternatives in aliases.items():


                  if (

                      normalize(
                          provider_name
                      )

                      ==

                      normalize(
                          alias
                      )

                  ):


                      for alternative in alternatives:


                          alternative_normalized = normalize(
                              alternative
                          )


                          if (

                              alternative_normalized
                              in passport_name_normalized

                          ):

                              score += 150


                          if (

                              alternative_normalized
                              in site_normalized

                          ):

                              score += 150


              return score


          master_channels = extract_master_channels()

          raw_channels = load_raw_channels()


          print(
              "Master Canada channels:",
              len(
                  master_channels
              )
          )


          print(
              "Raw TVPassport channels:",
              len(
                  raw_channels
              )
          )


          matches = []

          unmatched = []


          for master in master_channels:


              candidate_matches = []


              for raw_channel in raw_channels:


                  (

                      site_id,

                      passport_xmltv_id,

                      passport_name

                  ) = channel_values(
                      raw_channel
                  )


                  if not site_id:

                      continue


                  if is_on_demand(
                      site_id
                  ):

                      continue


                  if is_on_demand(
                      passport_name
                  ):

                      continue


                  score = score_match(

                      master[
                          "channel_name"
                      ],

                      master[
                          "epg_channel_id"
                      ],

                      site_id,

                      passport_xmltv_id,

                      passport_name

                  )


                  if score >= 70:


                      candidate_matches.append(

                          {

                              "score":
                                  score,

                              "site_id":
                                  site_id,

                              "passport_xmltv_id":
                                  passport_xmltv_id,

                              "passport_name":
                                  passport_name

                          }

                      )


              if not candidate_matches:


                  unmatched.append(
                      master
                  )


                  print(

                      "[NO CONFIDENT MATCH]",

                      master[
                          "stream_id"
                      ],

                      "|",

                      master[
                          "channel_name"
                      ]

                  )


                  continue


              candidate_matches.sort(

                  key=lambda item:
                      item[
                          "score"
                      ],

                  reverse=True

              )


              for candidate in candidate_matches:


                  matches.append(

                      {

                          "stream_id":
                              master[
                                  "stream_id"
                              ],

                          "category_id":
                              master[
                                  "category_id"
                              ],

                          "epg_channel_id":
                              master[
                                  "epg_channel_id"
                              ],

                          "provider_name":
                              master[
                                  "channel_name"
                              ],

                          "site_id":
                              candidate[
                                  "site_id"
                              ],

                          "passport_xmltv_id":
                              candidate[
                                  "passport_xmltv_id"
                              ],

                          "passport_name":
                              candidate[
                                  "passport_name"
                              ],

                          "match_score":
                              candidate[
                                  "score"
                              ]

                      }

                  )


          seen_provider_ids = set()

          seen_site_ids = set()

          final_matches = []

          duplicate_matches = []


          for match in matches:


              provider_id = match[
                  "stream_id"
              ]


              site_id = match[
                  "site_id"
              ]


              if provider_id in seen_provider_ids:

                  duplicate_matches.append(
                      match
                  )

                  continue


              if site_id in seen_site_ids:

                  duplicate_matches.append(
                      match
                  )

                  continue


              seen_provider_ids.add(
                  provider_id
              )


              seen_site_ids.add(
                  site_id
              )


              final_matches.append(
                  match
              )


          with OUTPUT_FILE.open(

              "w",

              encoding="utf-8"

          ) as file:


              file.write(

                  '<?xml version="1.0" encoding="UTF-8"?>\n'

              )


              file.write(
                  "<channels>\n"
              )


              for match in final_matches:


                  provider_id = html.escape(

                      match[
                          "stream_id"
                      ],

                      quote=True

                  )


                  provider_name = html.escape(

                      match[
                          "provider_name"
                      ]

                  )


                  site_id = html.escape(

                      match[
                          "site_id"
                      ],

                      quote=True

                  )


                  file.write(

                      f'  <channel '

                      f'site="tvpassport.com" '

                      f'site_id="{site_id}" '

                      f'lang="en" '

                      f'xmltv_id="{provider_id}">'

                      f'{provider_name}'

                      f'</channel>\n'

                  )


              file.write(
                  "</channels>\n"
              )


          print()

          print(
              "Canada TVPassport matches:",
              len(
                  final_matches
              )
          )


          print(
              "Canada channels unmatched:",
              len(
                  unmatched
              )
          )


          print(
              "Duplicate/rejected matches:",
              len(
                  duplicate_matches
              )
          )


          print()

          print(
              "Matched channels:"
          )


          for match in final_matches:


              print(

                  f'{match["stream_id"]} | '

                  f'{match["provider_name"]} '

                  f'-> '

                  f'{match["passport_name"]} '

                  f'[{match["site_id"]}] '

                  f'(score {match["match_score"]})'

              )


          if unmatched:


              print()

              print(
                  "UNMATCHED MASTER CHANNELS:"
              )


              for channel in unmatched:


                  print(

                      f'{channel["stream_id"]} | '

                      f'{channel["channel_name"]}'

                  )


          if not final_matches:


              raise SystemExit(

                  "No Canada channels matched"

              )


          MATCH_FILE.parent.mkdir(

              parents=True,

              exist_ok=True

          )


          with MATCH_FILE.open(

              "w",

              encoding="utf-8"

          ) as file:


              file.write(

                  "TVPassport Canada Channel Matching Report\n"

              )


              file.write(

                  "==========================================\n\n"

              )


              file.write(

                  "This report is updated automatically by the "

                  "TVPassport-Canada-TiviMate workflow.\n\n"

              )


              file.write(

                  f"MASTER CHANNELS: "

                  f"{len(master_channels)}\n"

              )


              file.write(

                  f"MATCHED CHANNELS: "

                  f"{len(final_matches)}\n"

              )


              file.write(

                  f"UNMATCHED CHANNELS: "

                  f"{len(unmatched)}\n"

              )


              file.write(

                  f"DUPLICATE/REJECTED MATCHES: "

                  f"{len(duplicate_matches)}\n\n"

              )


              file.write(

                  "MATCHED CHANNELS\n"

              )


              file.write(

                  "----------------\n\n"

              )


              for match in final_matches:


                  file.write(

                      f'Provider Stream ID: '

                      f'{match["stream_id"]}\n'

                  )


                  file.write(

                      f'Provider Category ID: '

                      f'{match["category_id"]}\n'

                  )


                  file.write(

                      f'Provider EPG Channel ID: '

                      f'{match["epg_channel_id"]}\n'

                  )


                  file.write(

                      f'Provider Channel Name: '

                      f'{match["provider_name"]}\n'

                  )


                  file.write(

                      f'TVPassport Name: '

                      f'{match["passport_name"]}\n'

                  )


                  file.write(

                      f'TVPassport Site ID: '

                      f'{match["site_id"]}\n'

                  )


                  file.write(

                      f'TVPassport XMLTV ID: '

                      f'{match["passport_xmltv_id"]}\n'

                  )


                  file.write(

                      f'Match Score: '

                      f'{match["match_score"]}\n'

                  )


                  file.write(

                      'EPG DATA: CHECKING AFTER GUIDE GENERATION\n\n'

                  )


              file.write(

                  "UNMATCHED CHANNELS\n"

              )


              file.write(

                  "------------------\n\n"

              )


              for channel in unmatched:


                  file.write(

                      f'{channel["stream_id"]} | '

                      f'{channel["category_id"]} | '

                      f'{channel["epg_channel_id"]} | '

                      f'{channel["channel_name"]}\n'

                  )


          PY

      - name: Write Canada TVPassport config
        run: |

          cat > epg/sites/tvpassport.com/tvpassport.com.config.js <<'EOFJS'

          const axios = require('axios')
          const dayjs = require('dayjs')
          const cheerio = require('cheerio')
          const utc = require('dayjs/plugin/utc')
          const timezone = require('dayjs/plugin/timezone')
          const customParseFormat = require('dayjs/plugin/customParseFormat')

          dayjs.extend(utc)
          dayjs.extend(timezone)
          dayjs.extend(customParseFormat)


          module.exports = {

            site: 'tvpassport.com',

            days: 14,


            url({ channel, date }) {

              return `https://www.tvpassport.com/tv-listings/stations/${channel.site_id}/${date.format('YYYY-MM-DD')}`

            },


            async request() {

              return {

                timeout: Number(

                  process.env.TVPASSPORT_SCHEDULE_TIMEOUT
                  || 30000

                ),

                headers: {

                  Cookie:
                    await getCookie(),

                  'User-Agent':
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'

                }

              }

            },


            parser({ content, channel, date }) {

              const programs = []

              const currentTimezone =
                parseCurrentTimezone(
                  content
                )

              const items =
                parseItems(
                  content
                )

              console.log(

                `[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${items.length}`

              )

              for (const item of items) {

                const $item =
                  cheerio.load(
                    item
                  )

                const start =
                  parseStart(

                    $item,

                    currentTimezone

                  )

                const duration =
                  parseDuration(
                    $item
                  )

                const stop =
                  start.add(
                    duration,
                    'm'
                  )

                let title =
                  cleanTitle(

                    parseTitle(
                      $item
                    )

                  )

                let episodeTitle =
                  cleanSpaces(

                    parseSubTitle(
                      $item
                    )

                  )

                const description =
                  cleanPassportDescription(

                    cleanSpaces(

                      parseDescription(
                        $item
                      )

                    )

                  )

                const image =
                  parseImage(
                    $item
                  )

                const rating =
                  parseRating(
                    $item
                  )

                const year =
                  parseYear(
                    $item
                  )

                const categories =
                  parseCategory(
                    $item
                  )

                const actors =
                  parseActors(
                    $item
                  )

                const guest =
                  parseGuest(
                    $item
                  )

                const director =
                  parseDirector(
                    $item
                  )

                if (

                  title === 'Movie'
                  || title === 'Cinéma'

                ) {

                  title =
                    episodeTitle

                  episodeTitle =
                    ''

                }

                const programType =
                  classifyProgramType({

                    title,

                    episodeTitle,

                    description,

                    year,

                    categories,

                    duration

                  })

                const finalDescription =
                  buildPackedDescription({

                    programType,

                    episodeTitle,

                    episodeCode: '',

                    description,

                    airDate: '',

                    releaseYear: year,

                    suppressDisplayDate: false

                  })

                const program = {

                  title,

                  description:
                    finalDescription,

                  start,

                  stop,

                  category:
                    buildCategories(

                      programType,

                      categories

                    )

                }

                if (image)
                  program.image =
                    image

                if (rating)
                  program.rating =
                    rating

                if (actors.length)
                  program.actors =
                    actors

                if (guest.length)
                  program.guest =
                    guest

                if (director.length)
                  program.director =
                    director

                programs.push(
                  program
                )

              }

              return programs

            }

          }


          async function getCookie() {

            const res =
              await axios.get(

                'https://www.tvpassport.com/tv-listings'

              )

            const setCookie =
              res.headers[
                'set-cookie'
              ]

            if (

              !setCookie
              || setCookie.length === 0

            )

              return ''

            const cookies =
              setCookie.map(

                cookie =>
                  cookie.split(
                    ';'
                  )[0]

              )

            return cookies.join(
              '; '
            )

          }


          function parseDescription($item) {

            return $item('*').data(
              'description'
            ) || ''

          }


          function parseImage($item) {

            const showpicture =
              $item('*').data(
                'showpicture'
              )

            if (!showpicture)
              return null

            try {

              return new URL(

                showpicture,

                'https://cdn.tvpassport.com/image/show/960x540/'

              ).href

            } catch {

              return null

            }

          }


          function parseTitle($item) {

            return $item('*').data(
              'showname'
            )?.toString() || ''

          }


          function parseSubTitle($item) {

            return $item('*').data(
              'episodetitle'
            )?.toString() || ''

          }


          function parseYear($item) {

            return $item('*').data(
              'year'
            )?.toString() || ''

          }


          function parseCategory($item) {

            const showtype =
              $item('*').data(
                'showtype'
              )

            return showtype

              ? String(
                  showtype
                )

                  .split(
                    ', '
                  )

                  .filter(
                    Boolean
                  )

              : []

          }


          function parseActors($item) {

            const cast =
              $item('*').data(
                'cast'
              )

            return cast

              ? String(
                  cast
                )

                  .split(
                    ', '
                  )

                  .filter(
                    Boolean
                  )

              : []

          }


          function parseDirector($item) {

            const director =
              $item('*').data(
                'director'
              )

            return director

              ? String(
                  director
                )

                  .split(
                    ', '
                  )

                  .filter(
                    Boolean
                  )

              : []

          }


          function parseGuest($item) {

            const guest =
              $item('*').data(
                'guest'
              )

            return guest

              ? String(
                  guest
                )

                  .split(
                    ', '
                  )

                  .filter(
                    Boolean
                  )

              : []

          }


          function parseRating($item) {

            const rating =
              $item('*').data(
                'rating'
              )

            return rating

              ? {

                  system:
                    'MPA',

                  value:
                    String(
                      rating
                    ).replace(
                      /^TV/,
                      'TV-'
                    )

                }

              : null

          }


          function parseStart(

            $item,

            currentTimezone

          ) {

            const time =
              $item('*').data(
                'st'
              )

            return dayjs.tz(

              time,

              'YYYY-MM-DD HH:mm:ss',

              currentTimezone

            )

          }


          function parseDuration($item) {

            const duration =
              $item('*').data(
                'duration'
              )

            return parseInt(

              duration || 0,

              10

            )

          }


          function parseItems(content) {

            if (!content)
              return []

            const $ =
              cheerio.load(
                content
              )

            return $(
              '.station-listings .list-group-item'
            ).toArray()

          }


          function parseCurrentTimezone(content) {

            if (!content)
              return 'America/New_York'

            const $ =
              cheerio.load(
                content
              )

            return $(
              '#timezone_selector'
            ).val()

              || 'America/New_York'

          }


          function classifyProgramType({

            title,

            episodeTitle,

            description,

            year,

            categories,

            duration

          }) {

            const haystack = [

              title,

              description,

              categories

            ]

              .flat()

              .filter(
                Boolean
              )

              .join(
                ' '
              )

              .toLowerCase()

            const hasEpisodeSignals =
              Boolean(
                episodeTitle
              )

            if (

              /mini[\s-]?series|limited series|limited-series/

                .test(
                  haystack
                )

            )

              return 'miniseries'

            if (

              /series|episode|tv show|television|scripted|reality|documentary series/

                .test(
                  haystack
                )

            )

              return 'series'

            if (
              hasEpisodeSignals
            )

              return 'series'

            if (

              /movie|film|feature film|cinema/

                .test(
                  haystack
                )

            )

              return 'movie'

            if (

              duration >= 75
              && year
              && !hasEpisodeSignals

            )

              return 'movie'

