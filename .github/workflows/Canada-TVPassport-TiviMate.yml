name: TVPassport-Canada-TiviMate

on:
  workflow_dispatch:

  schedule:
    - cron: "35 */12 * * *"

permissions:
  contents: write

concurrency:
  group: epg-guide-writes-tvpassport-canada
  cancel-in-progress: false

jobs:

  build-tvpassport-canada-tivimate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone IPTV-org EPG engine
        run: |
          rm -rf epg

          git clone \
            --depth 1 \
            https://github.com/iptv-org/epg.git \
            epg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epg/package-lock.json

      - name: Install EPG dependencies
        run: |
          cd epg
          npm ci

      - name: Build Canada TVPassport channel source
        run: |

          python3 - <<'PY'

          import re
          import html
          from pathlib import Path
          import xml.etree.ElementTree as ET


          MASTER_FILE = Path(
              "config/canada_channels.txt"
          )

          RAW_FILE = Path(
              "config/TVPassportCanada/TVPassportCanadaRAW.xml"
          )

          OUTPUT_FILE = Path(
              "epg/sites/tvpassport.com/festy-tvpassport-canada.channels.xml"
          )

          MATCH_FILE = Path(
              "config/TVPassportCanada-matching.txt"
          )


          if not MASTER_FILE.exists():
              raise SystemExit(
                  f"Missing {MASTER_FILE}"
              )


          if not RAW_FILE.exists():
              raise SystemExit(
                  f"Missing {RAW_FILE}"
              )


          OUTPUT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          def decode(value):

              return html.unescape(
                  str(value or "")
              )


          def normalize(value):

              value = decode(
                  value
              ).lower()

              value = value.replace(
                  "&",
                  "and"
              )

              value = value.replace(
                  "+",
                  " plus "
              )

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          def compact(value):

              return re.sub(
                  r"[^a-z0-9]",
                  "",
                  normalize(value)
              )


          def is_on_demand(value):

              normalized = normalize(
                  value
              )

              return (
                  "on demand" in normalized
                  or "ondemand" in normalized
              )


          def tokens(value):

              return set(
                  normalize(value).split()
              )


          def significant_tokens(value):

              ignored = {
                  "ca",
                  "canada",
                  "canadian",
                  "hd",
                  "sd",
                  "east",
                  "west",
                  "central",
                  "north",
                  "south",
                  "network",
                  "channel",
                  "tv",
                  "television",
                  "the",
                  "and",
                  "plus"
              }

              return {
                  token
                  for token in tokens(value)
                  if token not in ignored
                  and len(token) > 1
              }


          def extract_master_channels():

              channels = []

              lines = MASTER_FILE.read_text(
                  encoding="utf-8"
              ).splitlines()

              current = {}

              for raw_line in lines:

                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue


                  if line.startswith(
                      "CHANNEL NAME:"
                  ):

                      if current.get(
                          "display_name"
                      ):

                          channels.append(
                              current
                          )

                      current = {

                          "display_name":
                              line[
                                  len(
                                      "CHANNEL NAME:"
                                  ):
                              ].strip(),

                          "category_id":
                              "",

                          "stream_id":
                              "",

                          "epg_channel_id":
                              ""

                      }

                      continue


                  if line.startswith(
                      "CATEGORY ID:"
                  ):

                      if current:

                          current[
                              "category_id"
                          ] = line[
                              len(
                                  "CATEGORY ID:"
                              ):
                          ].strip()

                      continue


                  if line.startswith(
                      "STREAM ID:"
                  ):

                      if current:

                          current[
                              "stream_id"
                          ] = line[
                              len(
                                  "STREAM ID:"
                              ):
                          ].strip()

                      continue


                  if line.startswith(
                      "EPG CHANNEL ID:"
                  ):

                      if current:

                          current[
                              "epg_channel_id"
                          ] = line[
                              len(
                                  "EPG CHANNEL ID:"
                              ):
                          ].strip()

                      continue


              if current.get(
                  "display_name"
              ):

                  channels.append(
                      current
                  )


              return channels


          def load_raw_channels():

              raw_text = RAW_FILE.read_text(
                  encoding="utf-8"
              )

              raw_text = raw_text.lstrip(
                  "\ufeff"
              )

              try:

                  root = ET.fromstring(
                      raw_text
                  )

                  return [
                      element
                      for element in root.findall(
                          ".//channel"
                      )
                  ]

              except ET.ParseError:

                  wrapped = (
                      "<root>"
                      + raw_text
                      + "</root>"
                  )

                  root = ET.fromstring(
                      wrapped
                  )

                  return [
                      element
                      for element in root.findall(
                          ".//channel"
                      )
                  ]


          def channel_values(element):

              site_id = (
                  element.attrib.get(
                      "site_id",
                      ""
                  ).strip()
              )

              channel_name = (
                  element.text or ""
              ).strip()

              return (
                  site_id,
                  channel_name
              )


          def score_match(
              master_name,
              site_id,
              raw_name
          ):

              if is_on_demand(
                  site_id
              ):

                  return -100000


              if is_on_demand(
                  raw_name
              ):

                  return -100000


              master_normalized = normalize(
                  master_name
              )

              site_normalized = normalize(
                  site_id
              )

              raw_normalized = normalize(
                  raw_name
              )

              master_compact = compact(
                  master_name
              )

              site_compact = compact(
                  site_id
              )

              raw_compact = compact(
                  raw_name
              )


              score = 0


              if master_compact in site_compact:

                  score += 100


              if master_compact in raw_compact:

                  score += 100


              master_tokens = significant_tokens(
                  master_name
              )

              site_tokens = significant_tokens(
                  site_id
              )

              raw_tokens = significant_tokens(
                  raw_name
              )


              if master_tokens:

                  site_overlap = (
                      master_tokens
                      & site_tokens
                  )

                  raw_overlap = (
                      master_tokens
                      & raw_tokens
                  )

                  score += (
                      len(site_overlap)
                      * 35
                  )

                  score += (
                      len(raw_overlap)
                      * 35
                  )


              aliases = {

                  "food network":
                      [
                          "food network canada",
                          "flavour network",
                          "flavour network canada"
                      ],

                  "history":
                      [
                          "history canada",
                          "history channel canada"
                      ],

                  "discovery":
                      [
                          "discovery channel canada"
                      ],

                  "bbc canada":
                      [
                          "bbc canada"
                      ],

                  "bbc world news":
                      [
                          "bbc world news"
                      ],

                  "global":
                      [
                          "global tv",
                          "global news"
                      ],

                  "a and e":
                      [
                          "a e",
                          "a&e",
                          "a and e"
                      ]

              }


              for alias, alternatives in aliases.items():

                  if normalize(
                      master_name
                  ) == normalize(
                      alias
                  ):

                      for alternative in alternatives:

                          alternative_normalized = normalize(
                              alternative
                          )

                          if (
                              alternative_normalized
                              in site_normalized
                          ):

                              score += 150

                          if (
                              alternative_normalized
                              in raw_normalized
                          ):

                              score += 150


              if (
                  master_normalized
                  == raw_normalized
              ):

                  score += 200


              if (
                  master_normalized
                  == site_normalized
              ):

                  score += 250


              return score


          master_channels = extract_master_channels()

          raw_channels = load_raw_channels()


          print(
              "Master Canada channels:",
              len(
                  master_channels
              )
          )

          print(
              "Raw TVPassport channels:",
              len(
                  raw_channels
              )
          )


          matches = []

          unmatched = []


          for master in master_channels:

              best = None

              best_score = 0


              for raw_channel in raw_channels:

                  site_id, raw_name = channel_values(
                      raw_channel
                  )


                  if not site_id:

                      continue


                  if is_on_demand(
                      site_id
                  ):

                      continue


                  if is_on_demand(
                      raw_name
                  ):

                      continue


                  score = score_match(
                      master["display_name"],
                      site_id,
                      raw_name
                  )


                  if score > best_score:

                      best_score = score

                      best = (
                          site_id,
                          raw_name
                      )


              if best is None:

                  unmatched.append(
                      master
                  )

                  continue


              site_id, raw_name = best


              if best_score < 70:

                  unmatched.append(
                      master
                  )

                  print(
                      "[NO CONFIDENT MATCH]",
                      master["display_name"],
                      "best:",
                      raw_name,
                      site_id,
                      "score:",
                      best_score
                  )

                  continue


              matches.append(
                  {
                      "output_id":
                          master["display_name"],

                      "display_name":
                          master["display_name"],

                      "site_id":
                          site_id,

                      "source_name":
                          raw_name,

                      "match_score":
                          best_score
                  }
              )


          seen_output_ids = set()

          seen_site_ids = set()

          final_matches = []

          duplicate_matches = []


          for match in matches:

              output_id = match[
                  "output_id"
              ]

              site_id = match[
                  "site_id"
              ]


              if output_id in seen_output_ids:

                  duplicate_matches.append(
                      match
                  )

                  continue


              if site_id in seen_site_ids:

                  duplicate_matches.append(
                      match
                  )

                  continue


              seen_output_ids.add(
                  output_id
              )

              seen_site_ids.add(
                  site_id
              )

              final_matches.append(
                  match
              )


          with OUTPUT_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
              )

              file.write(
                  "<channels>\n"
              )


              for match in final_matches:

                  display_name = html.escape(
                      match["display_name"]
                  )

                  site_id = html.escape(
                      match["site_id"],
                      quote=True
                  )


                  file.write(
                      f'  <channel site="tvpassport.com" '
                      f'site_id="{site_id}" '
                      f'lang="en" '
                      f'xmltv_id="{display_name}">'
                      f'{display_name}</channel>\n'
                  )


              file.write(
                  "</channels>\n"
              )


          print()

          print(
              "Canada TVPassport matches:",
              len(
                  final_matches
              )
          )

          print(
              "Canada channels unmatched:",
              len(
                  unmatched
              )
          )

          print()

          print(
              "Matched channels:"
          )


          for match in final_matches:

              print(
                  f'{match["display_name"]} '
                  f'-> '
                  f'{match["source_name"]} '
                  f'[{match["site_id"]}] '
                  f'(score {match["match_score"]})'
              )


          if unmatched:

              print()

              print(
                  "UNMATCHED MASTER CHANNELS:"
              )


              for channel in unmatched:

                  print(
                      channel["display_name"]
                  )


          if not final_matches:

              raise SystemExit(
                  "No Canada channels matched"
              )


          MATCH_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          with MATCH_FILE.open(
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "TVPassport Canada Channel Matching Report\n"
              )

              file.write(
                  "==========================================\n\n"
              )

              file.write(
                  "This report is updated automatically by the "
                  "TVPassport-Canada-TiviMate workflow.\n"
              )

              file.write(
                  "EPG data status is filled in after the guide is generated.\n\n"
              )

              file.write(
                  f"MASTER CHANNELS: {len(master_channels)}\n"
              )

              file.write(
                  f"MATCHED CHANNELS: {len(final_matches)}\n"
              )

              file.write(
                  f"UNMATCHED CHANNELS: {len(unmatched)}\n"
              )

              file.write(
                  f"DUPLICATE/REJECTED MATCHES: "
                  f"{len(duplicate_matches)}\n\n"
              )

              file.write(
                  "MATCHED CHANNELS\n"
              )

              file.write(
                  "----------------\n\n"
              )


              for match in final_matches:

                  file.write(
                      f'Festy Channel: '
                      f'{match["display_name"]}\n'
                  )

                  file.write(
                      f'TVPassport Name: '
                      f'{match["source_name"]}\n'
                  )

                  file.write(
                      f'TVPassport Site ID: '
                      f'{match["site_id"]}\n'
                  )

                  file.write(
                      f'Match Score: '
                      f'{match["match_score"]}\n'
                  )

                  file.write(
                      'EPG DATA: CHECKING AFTER GUIDE GENERATION\n'
                  )

                  file.write(
                      '\n'
                  )


              file.write(
                  "UNMATCHED CHANNELS\n"
              )

              file.write(
                  "------------------\n\n"
              )


              for channel in unmatched:

                  file.write(
                      f'{channel["display_name"]}\n'
                  )


          PY

      - name: Write Canada TVPassport config
        run: |

          cat > epg/sites/tvpassport.com/tvpassport.com.config.js <<'EOFJS'

          const axios = require('axios')
          const dayjs = require('dayjs')
          const cheerio = require('cheerio')
          const utc = require('dayjs/plugin/utc')
          const timezone = require('dayjs/plugin/timezone')
          const customParseFormat = require('dayjs/plugin/customParseFormat')

          dayjs.extend(utc)
          dayjs.extend(timezone)
          dayjs.extend(customParseFormat)

          module.exports = {

            site: 'tvpassport.com',

            days: 14,

            url({ channel, date }) {

              return `https://www.tvpassport.com/tv-listings/stations/${channel.site_id}/${date.format('YYYY-MM-DD')}`

            },

            async request() {

              return {

                timeout: Number(
                  process.env.TVPASSPORT_SCHEDULE_TIMEOUT || 30000
                ),

                headers: {

                  Cookie: await getCookie(),

                  'User-Agent':
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36'

                }

              }

            },

            parser({ content, channel, date }) {

              const programs = []

              const currentTimezone =
                parseCurrentTimezone(content)

              const items =
                parseItems(content)


              console.log(
                `[PULL] ${channel.name} | ${date.format('YYYY-MM-DD')} | programs=${items.length}`
              )


              for (const item of items) {

                const $item =
                  cheerio.load(item)


                const start =
                  parseStart(
                    $item,
                    currentTimezone
                  )


                const duration =
                  parseDuration(
                    $item
                  )


                const stop =
                  start.add(
                    duration,
                    'm'
                  )


                let title =
                  cleanTitle(
                    parseTitle(
                      $item
                    )
                  )


                let episodeTitle =
                  cleanSpaces(
                    parseSubTitle(
                      $item
                    )
                  )


                const description =
                  cleanPassportDescription(
                    cleanSpaces(
                      parseDescription(
                        $item
                      )
                    )
                  )


                const image =
                  parseImage(
                    $item
                  )


                const rating =
                  parseRating(
                    $item
                  )


                const year =
                  parseYear(
                    $item
                  )


                const categories =
                  parseCategory(
                    $item
                  )


                const actors =
                  parseActors(
                    $item
                  )


                const guest =
                  parseGuest(
                    $item
                  )


                const director =
                  parseDirector(
                    $item
                  )


                if (
                  title === 'Movie'
                  || title === 'Cinéma'
                ) {

                  title =
                    episodeTitle

                  episodeTitle =
                    ''

                }


                const programType =
                  classifyProgramType({

                    title,

                    episodeTitle,

                    description,

                    year,

                    categories,

                    duration

                  })


                const finalDescription =
                  buildPackedDescription({

                    programType,

                    episodeTitle,

                    episodeCode: '',

                    description,

                    airDate: '',

                    releaseYear: year,

                    suppressDisplayDate: false

                  })


                const program = {

                  title,

                  description:
                    finalDescription,

                  start,

                  stop,

                  category:
                    buildCategories(
                      programType,
                      categories
                    )

                }


                if (image)
                  program.image =
                    image


                if (rating)
                  program.rating =
                    rating


                if (actors.length)
                  program.actors =
                    actors


                if (guest.length)
                  program.guest =
                    guest


                if (director.length)
                  program.director =
                    director


                programs.push(
                  program
                )

              }


              return programs

            }

          }


          async function getCookie() {

            const res =
              await axios.get(
                'https://www.tvpassport.com/tv-listings'
              )


            const setCookie =
              res.headers['set-cookie']


            if (
              !setCookie
              || setCookie.length === 0
            ) {

              return ''

            }


            const cookies =
              setCookie.map(
                cookie =>
                  cookie.split(';')[0]
              )


            return cookies.join('; ')

          }


          function parseDescription($item) {

            return $item('*').data(
              'description'
            ) || ''

          }


          function parseImage($item) {

            const showpicture =
              $item('*').data(
                'showpicture'
              )


            if (!showpicture)
              return null


            try {

              return new URL(
                showpicture,
                'https://cdn.tvpassport.com/image/show/960x540/'
              ).href

            } catch {

              return null

            }

          }


          function parseTitle($item) {

            return $item('*').data(
              'showname'
            )?.toString() || ''

          }


          function parseSubTitle($item) {

            return $item('*').data(
              'episodetitle'
            )?.toString() || ''

          }


          function parseYear($item) {

            return $item('*').data(
              'year'
            )?.toString() || ''

          }


          function parseCategory($item) {

            const showtype =
              $item('*').data(
                'showtype'
              )


            return showtype
              ? String(showtype)
                  .split(', ')
                  .filter(Boolean)
              : []

          }


          function parseActors($item) {

            const cast =
              $item('*').data(
                'cast'
              )


            return cast
              ? String(cast)
                  .split(', ')
                  .filter(Boolean)
              : []

          }


          function parseDirector($item) {

            const director =
              $item('*').data(
                'director'
              )


            return director
              ? String(director)
                  .split(', ')
                  .filter(Boolean)
              : []

          }


          function parseGuest($item) {

            const guest =
              $item('*').data(
                'guest'
              )


            return guest
              ? String(guest)
                  .split(', ')
                  .filter(Boolean)
              : []

          }


          function parseRating($item) {

            const rating =
              $item('*').data(
                'rating'
              )


            return rating

              ? {

                  system:
                    'MPA',

                  value:
                    String(
                      rating
                    ).replace(
                      /^TV/,
                      'TV-'
                    )

                }

              : null

          }


          function parseStart(
            $item,
            currentTimezone
          ) {

            const time =
              $item('*').data(
                'st'
              )


            return dayjs.tz(
              time,
              'YYYY-MM-DD HH:mm:ss',
              currentTimezone
            )

          }


          function parseDuration($item) {

            const duration =
              $item('*').data(
                'duration'
              )


            return parseInt(
              duration || 0,
              10
            )

          }


          function parseItems(content) {

            if (!content)
              return []


            const $ =
              cheerio.load(
                content
              )


            return $(
              '.station-listings .list-group-item'
            ).toArray()

          }


          function parseCurrentTimezone(content) {

            if (!content)
              return 'America/New_York'


            const $ =
              cheerio.load(
                content
              )


            return $(
              '#timezone_selector'
            ).val()
              || 'America/New_York'

          }


          function classifyProgramType({

            title,

            episodeTitle,

            description,

            year,

            categories,

            duration

          }) {


            const haystack =
              [

                title,

                description,

                categories

              ]

                .flat()

                .filter(Boolean)

                .join(' ')

                .toLowerCase()


            const hasEpisodeSignals =
              Boolean(
                episodeTitle
              )


            if (
              /mini[\s-]?series|limited series|limited-series/
                .test(
                  haystack
                )
            )

              return 'miniseries'


            if (
              /series|episode|tv show|television|scripted|reality|documentary series/
                .test(
                  haystack
                )
            )

              return 'series'


            if (
              hasEpisodeSignals
            )

              return 'series'


            if (
              /movie|film|feature film|cinema/
                .test(
                  haystack
                )
            )

              return 'movie'


            if (
              duration >= 75
              && year
              && !hasEpisodeSignals
            )

              return 'movie'


            return 'program'

          }


          function buildCategories(
            programType,
            originalCategories
          ) {


            const categories =
              Array.isArray(
                originalCategories
              )

                ? originalCategories.filter(
                    Boolean
                  )

                : []


            if (
              programType === 'movie'
            )

              return unique(
                [
                  'Movie',
                  ...categories
                ]
              )


            if (
              programType === 'miniseries'
            )

              return unique(
                [
                  'Miniseries',
                  'Series',
                  ...categories
                ]
              )


            if (
              programType === 'series'
            )

              return unique(
                [
                  'Series',
                  ...categories
                ]
              )


            return unique(
              categories.length
                ? categories
                : ['Program']
            )

          }


          function buildPackedDescription({

            programType,

            episodeTitle,

            episodeCode,

            description,

            airDate,

            releaseYear,

            suppressDisplayDate

          }) {


            const parts =
              []


            let prefix =
              ''


            if (
              programType === 'series'
              || programType === 'miniseries'
            ) {


              if (
                episodeTitle
                && episodeCode
              )

                prefix =
                  `${episodeTitle} - ${episodeCode}`


              else if (
                episodeTitle
              )

                prefix =
                  episodeTitle


              else if (
                episodeCode
              )

                prefix =
                  episodeCode

            }


            if (
              prefix
            )

              parts.push(
                prefix
              )


            if (
              description
            )

              parts.push(
                description
              )


            let finalDescription =
              cleanPackedDescription(
                parts.join(
                  '. '
                )
              )


            if (
              programType === 'movie'
            ) {


              if (
                releaseYear
                && !descriptionIncludesDisplayDate(
                  finalDescription,
                  releaseYear
                )
              ) {


                finalDescription =
                  finalDescription

                    ? `${finalDescription} (${releaseYear})`

                    : `(${releaseYear})`

              }


              return finalDescription

            }


            if (
              programType === 'series'
              || programType === 'miniseries'
            ) {


              if (
                airDate
                && !suppressDisplayDate
                && !descriptionIncludesDisplayDate(
                  finalDescription,
                  airDate
                )
              ) {


                finalDescription =
                  finalDescription

                    ? `${finalDescription} (${airDate})`

                    : `(${airDate})`

              }


              return finalDescription

            }


            const dateOrYear =
              suppressDisplayDate
                ? releaseYear
                : airDate || releaseYear


            if (
              dateOrYear
              && !descriptionIncludesDisplayDate(
                finalDescription,
                dateOrYear
              )
            ) {


              finalDescription =
                finalDescription

                  ? `${finalDescription} (${dateOrYear})`

                  : `(${dateOrYear})`

            }


            return finalDescription

          }


          function cleanPassportDescription(value) {

            return cleanSpaces(
              value
            )

              .replace(
                /\s*\(([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})(?:,\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})*\)/g,
                ''
              )

              .replace(
                /\s+/g,
                ' '
              )

              .trim()

          }


          function cleanPackedDescription(value) {

            return cleanSpaces(
              value
            )

              .replace(
                /\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i,
                ' ($1)'
              )

              .replace(
                /\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g,
                ' ($2)'
              )

              .trim()

          }


          function descriptionIncludesDisplayDate(
            description,
            dateOrYear
          ) {


            if (
              !description
              || !dateOrYear
            )

              return false


            const escaped =
              String(
                dateOrYear
              ).replace(
                /[.*+?^${}()|[\]\\]/g,
                '\\$&'
              )


            return new RegExp(
              `\\(${escaped}\\)\\s*$`
            ).test(
              description
            )

              || description.includes(
                String(
                  dateOrYear
                )
              )

          }


          function cleanTitle(value) {

            return cleanSpaces(
              value
            )

              .replace(
                /^\s*(New|Live|Repeat)\s*[:\-]\s*/i,
                ''
              )

              .replace(
                /\s*\((New|Live|Repeat)\)\s*$/i,
                ''
              )

              .replace(
                /\s*[-–—]\s*(New|Live|Repeat)\s*$/i,
                ''
              )

              .trim()

          }


          function cleanSpaces(value) {

            return String(
              value || ''
            )

              .replace(
                /\s+/g,
                ' '
              )

              .replace(
                /\s+([.,!?;:])/g,
                '$1'
              )

              .replace(
                /([.,!?;:])([A-Za-z0-9])/g,
                '$1 $2'
              )

              .trim()

          }


          function unique(values) {

            return [
              ...new Set(
                values.filter(
                  Boolean
                )
              )
            ]

          }

          EOFJS

      - name: Grab Canada TVPassport guide
        run: |

          cd epg

          rm -f ../guides/TVPassportCanada.xml
          rm -f ../guides/TVPassportCanada.pass*.xml
          rm -f ../guides/TVPassportCanada.pass*.log
          rm -f ../guides/TVPassportCanada.pass*.count


          run_pass() {

            PASS_NAME="$1"

            MAX_CONNECTIONS="$2"

            SCHEDULE_TIMEOUT="$3"


            echo ""

            echo "============================================================"

            echo "Starting $PASS_NAME"

            echo "maxConnections=$MAX_CONNECTIONS"

            echo "TVPASSPORT_SCHEDULE_TIMEOUT=$SCHEDULE_TIMEOUT"

            echo "============================================================"


            export TVPASSPORT_SCHEDULE_TIMEOUT="$SCHEDULE_TIMEOUT"


            set +e


            npx tsx scripts/commands/epg/grab.ts \
              --channels=sites/tvpassport.com/festy-tvpassport-canada.channels.xml \
              --output="../guides/TVPassportCanada.${PASS_NAME}.xml" \
              --days=14 \
              --maxConnections="$MAX_CONNECTIONS" \
              2>&1 | tee "../guides/TVPassportCanada.${PASS_NAME}.log"


            STATUS=${PIPESTATUS[0]}


            set -e


            if [ "$STATUS" -ne 0 ]; then

              echo "$PASS_NAME exited with status $STATUS"

            fi


            if [ ! -f "../guides/TVPassportCanada.${PASS_NAME}.xml" ]; then

              echo "$PASS_NAME did not create an XML file"

              echo "0" \
                > "../guides/TVPassportCanada.${PASS_NAME}.programmes.count"

              echo "0" \
                > "../guides/TVPassportCanada.${PASS_NAME}.descriptions.count"

              echo "999999" \
                > "../guides/TVPassportCanada.${PASS_NAME}.issues.count"

              return 0

            fi


            PR=$(
              grep -c '<programme ' \
              "../guides/TVPassportCanada.${PASS_NAME}.xml" \
              || true
            )


            DESC=$(
              grep -c '<desc ' \
              "../guides/TVPassportCanada.${PASS_NAME}.xml" \
              || true
            )


            ISSUE_COUNT=$(
              grep -Eic \
              'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' \
              "../guides/TVPassportCanada.${PASS_NAME}.log" \
              || true
            )


            echo "$PR" \
              > "../guides/TVPassportCanada.${PASS_NAME}.programmes.count"


            echo "$DESC" \
              > "../guides/TVPassportCanada.${PASS_NAME}.descriptions.count"


            echo "$ISSUE_COUNT" \
              > "../guides/TVPassportCanada.${PASS_NAME}.issues.count"


            echo "$PASS_NAME programmes: $PR"

            echo "$PASS_NAME descriptions: $DESC"

            echo "$PASS_NAME possible issues: $ISSUE_COUNT"

          }


          run_pass \
            "pass1-fast" \
            8 \
            30000


          PASS1_ISSUES=$(
            cat \
              ../guides/TVPassportCanada.pass1-fast.issues.count
          )


          if [ "$PASS1_ISSUES" -gt 0 ]; then

            echo ""

            echo "Fast pass had possible issues, running backup pass..."


            run_pass \
              "pass2-backup" \
              4 \
              45000

          else

            echo ""

            echo "Fast pass had no obvious issues. Skipping backup pass."

          fi


          BEST_PASS="pass1-fast"

          BEST_PR=$(
            cat \
              ../guides/TVPassportCanada.pass1-fast.programmes.count
          )


          BEST_DESC=$(
            cat \
              ../guides/TVPassportCanada.pass1-fast.descriptions.count
          )


          BEST_ISSUES=$(
            cat \
              ../guides/TVPassportCanada.pass1-fast.issues.count
          )


          for PASS in pass2-backup; do

            if [ -f "../guides/TVPassportCanada.${PASS}.programmes.count" ]; then

              CANDIDATE_PR=$(
                cat \
                  "../guides/TVPassportCanada.${PASS}.programmes.count"
              )


              CANDIDATE_DESC=$(
                cat \
                  "../guides/TVPassportCanada.${PASS}.descriptions.count"
              )


              CANDIDATE_ISSUES=$(
                cat \
                  "../guides/TVPassportCanada.${PASS}.issues.count"
              )


              if [ "$CANDIDATE_PR" -gt "$BEST_PR" ]; then

                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"


              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -gt "$BEST_DESC" ]; then

                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"


              elif [ "$CANDIDATE_PR" -eq "$BEST_PR" ] && [ "$CANDIDATE_DESC" -eq "$BEST_DESC" ] && [ "$CANDIDATE_ISSUES" -lt "$BEST_ISSUES" ]; then

                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"

              fi

            fi

          done


          echo ""

          echo "Selected best pass: $BEST_PASS"

          echo "Best programmes: $BEST_PR"

          echo "Best descriptions: $BEST_DESC"

          echo "Best possible issues: $BEST_ISSUES"


          cp \
            "../guides/TVPassportCanada.${BEST_PASS}.xml" \
            "../guides/TVPassportCanada.xml"


          cd ..

      - name: Validate Canada guide
        run: |

          CH=$(
            grep -c '<channel ' \
            guides/TVPassportCanada.xml \
            || true
          )


          PR=$(
            grep -c '<programme ' \
            guides/TVPassportCanada.xml \
            || true
          )


          DESC=$(
            grep -c '<desc ' \
            guides/TVPassportCanada.xml \
            || true
          )


          echo "Canada channels: $CH"

          echo "Canada programmes: $PR"

          echo "Canada descriptions: $DESC"


          if [ "$CH" -lt 1 ]; then

            echo "Invalid Canada output - no channels"

            exit 1

          fi


          if [ "$PR" -lt 1 ]; then

            echo "Invalid Canada output - no programmes"

            exit 1

          fi


          if [ "$DESC" -lt 1 ]; then

            echo "Invalid Canada output - no descriptions"

            exit 1

          fi

      - name: Compress Canada TVPassport guide
        run: |

          gzip -c \
            guides/TVPassportCanada.xml \
            > guides/TVPassportCanada.xml.gz

      - name: Commit and push Canada TVPassport guide safely
        run: |

          git config \
            user.name \
            "github-actions"


          git config \
            user.email \
            "github-actions@github.com"


          git fetch origin main


          git add \
            guides/TVPassportCanada.xml \
            guides/TVPassportCanada.xml.gz \
            config/TVPassportCanada-matching.txt


          if git diff --cached --quiet; then

            echo "No Canada TVPassport guide or matching report changes to commit"

            exit 0

          fi


          git commit \
            -m "Update Canada TVPassport guide"


          for attempt in 1 2 3 4 5; do

            echo "Push attempt $attempt"


            if git push origin HEAD:main; then

              echo "Push succeeded"

              exit 0

            fi


            echo "Push failed, retrying after fresh fetch/rebase..."


            git fetch origin main


            git rebase origin/main


            git add \
              guides/TVPassportCanada.xml \
              guides/TVPassportCanada.xml.gz \
              config/TVPassportCanada-matching.txt


            if git diff --cached --quiet; then

              echo "No new commit needed after rebase"

            else

              git commit \
                -m "Update Canada TVPassport guide"

            fi


            sleep 5

          done


          echo "Push failed after retries"

          exit 1
