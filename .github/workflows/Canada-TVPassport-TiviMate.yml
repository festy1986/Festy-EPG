          async function getCookie() {

            const res =
              await axios.get(

                'https://www.tvpassport.com/tv-listings'

              )


            const setCookie =
              res.headers[
                'set-cookie'
              ]


            if (

              !setCookie
              || setCookie.length === 0

            )

              return ''


            const cookies =
              setCookie.map(

                cookie =>
                  cookie.split(
                    ';'
                  )[0]

              )


            return cookies.join(
              '; '
            )

