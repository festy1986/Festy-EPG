            STATUS=${PIPESTATUS[0]}


            set -e


            if [

              "$STATUS"

              -ne

              0

            ]; then

              echo "$PASS_NAME exited with status $STATUS"

            fi


            if [

              ! -f

              "../guides/TVPassportCanada.${PASS_NAME}.xml"

            ]; then

              echo "$PASS_NAME did not create an XML file"

              echo "0" >

                "../guides/TVPassportCanada.${PASS_NAME}.programmes.count"

              echo "0" >

                "../guides/TVPassportCanada.${PASS_NAME}.descriptions.count"

              echo "999999" >

                "../guides/TVPassportCanada.${PASS_NAME}.issues.count"

              return 0

            fi


            PR=$(

              grep -c '<programme ' \

              "../guides/TVPassportCanada.${PASS_NAME}.xml" \

              || true

            )


            DESC=$(

              grep -c '<desc ' \

              "../guides/TVPassportCanada.${PASS_NAME}.xml" \

              || true

            )


            ISSUE_COUNT=$(

              grep -Eic \

              'ERR:|timeout|programs=0|ECONNABORTED|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN| 408 | 429 | 500 | 502 | 503 | 504 ' \

              "../guides/TVPassportCanada.${PASS_NAME}.log" \

              || true

            )


            echo "$PR" >

              "../guides/TVPassportCanada.${PASS_NAME}.programmes.count"


            echo "$DESC" >

              "../guides/TVPassportCanada.${PASS_NAME}.descriptions.count"


            echo "$ISSUE_COUNT" >

              "../guides/TVPassportCanada.${PASS_NAME}.issues.count"


            echo "$PASS_NAME programmes: $PR"

            echo "$PASS_NAME descriptions: $DESC"

            echo "$PASS_NAME possible issues: $ISSUE_COUNT"

          }


          run_pass \

            "pass1-fast" \

            8 \

            30000


          PASS1_ISSUES=$(

            cat \

              ../guides/TVPassportCanada.pass1-fast.issues.count

          )


          if [

            "$PASS1_ISSUES"

            -gt

            0

          ]; then


            echo ""

            echo "Fast pass had possible issues, running backup pass..."


            run_pass \

              "pass2-backup" \

              4 \

              45000

          else


            echo ""

            echo "Fast pass had no obvious issues. Skipping backup pass."

          fi


          BEST_PASS="pass1-fast"


          BEST_PR=$(

            cat \

              ../guides/TVPassportCanada.pass1-fast.programmes.count

          )


          BEST_DESC=$(

            cat \

              ../guides/TVPassportCanada.pass1-fast.descriptions.count

          )


          BEST_ISSUES=$(

            cat \

              ../guides/TVPassportCanada.pass1-fast.issues.count

          )


          for PASS in pass2-backup; do


            if [

              -f

              "../guides/TVPassportCanada.${PASS}.programmes.count"

            ]; then


              CANDIDATE_PR=$(

                cat \

                  "../guides/TVPassportCanada.${PASS}.programmes.count"

              )


              CANDIDATE_DESC=$(

                cat \

                  "../guides/TVPassportCanada.${PASS}.descriptions.count"

              )


              CANDIDATE_ISSUES=$(

                cat \

                  "../guides/TVPassportCanada.${PASS}.issues.count"

              )


              if [

                "$CANDIDATE_PR"

                -gt

                "$BEST_PR"

              ]; then


                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"


              elif [

                "$CANDIDATE_PR"

                -eq

                "$BEST_PR"

              ]

              && [

                "$CANDIDATE_DESC"

                -gt

                "$BEST_DESC"

              ]; then


                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"
                              elif [

                "$CANDIDATE_PR"

                -eq

                "$BEST_PR"

              ]

              && [

                "$CANDIDATE_DESC"

                -eq

                "$BEST_DESC"

              ]

              && [

                "$CANDIDATE_ISSUES"

                -lt

                "$BEST_ISSUES"

              ]; then


                BEST_PASS="$PASS"

                BEST_PR="$CANDIDATE_PR"

                BEST_DESC="$CANDIDATE_DESC"

                BEST_ISSUES="$CANDIDATE_ISSUES"

              fi

            fi

          done


          echo ""

          echo "Selected best pass: $BEST_PASS"

          echo "Best programmes: $BEST_PR"

          echo "Best descriptions: $BEST_DESC"

          echo "Best possible issues: $BEST_ISSUES"


          cp \

            "../guides/TVPassportCanada.${BEST_PASS}.xml" \

            "../guides/TVPassportCanada.xml"


          cd ..

      - name: Create Canada TVPassport channel data report
        run: |

          python3 - <<'PY'

          import re

          from pathlib import Path

          import xml.etree.ElementTree as ET


          MATCH_FILE = Path(

              "config/TVPassportCanada-matching.txt"

          )


          GUIDE_FILE = Path(

              "guides/TVPassportCanada.xml"

          )


          if not MATCH_FILE.exists():

              raise SystemExit(

                  f"Missing {MATCH_FILE}"

              )


          if not GUIDE_FILE.exists():

              raise SystemExit(

                  f"Missing {GUIDE_FILE}"

              )


          guide_text = GUIDE_FILE.read_text(

              encoding="utf-8"

          )


          root = ET.fromstring(

              guide_text

          )


          programs_by_channel = {}


          for programme in root.findall(

              ".//programme"

          ):


              channel_id = programme.attrib.get(

                  "channel",

                  ""

              ).strip()


              if not channel_id:

                  continue


              programs_by_channel.setdefault(

                  channel_id,

                  0

              )


              programs_by_channel[channel_id] += 1


          original_lines = MATCH_FILE.read_text(

              encoding="utf-8"

          ).splitlines()


          output = []

          current_channel = None

          matched_count = 0

          unmatched_count = 0

          data_count = 0

          no_data_count = 0


          for line in original_lines:


              stripped = line.strip()


              match = re.match(

                  r"^Provider Stream ID:\s*(\d+)$",

                  stripped

              )


              if match:


                  current_channel = {

                      "stream_id":

                          match.group(1),

                      "category_id":

                          "",

                      "epg_channel_id":

                          "",

                      "provider_name":

                          "",

                      "passport_name":

                          "",

                      "site_id":

                          "",

                      "passport_xmltv_id":

                          "",

                      "score":

                          ""

                  }


                  matched_count += 1

                  continue


              if current_channel is None:

                  continue


              match = re.match(

                  r"^Provider Category ID:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "category_id"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^Provider EPG Channel ID:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "epg_channel_id"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^Provider Channel Name:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "provider_name"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^TVPassport Name:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "passport_name"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^TVPassport Site ID:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "site_id"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^TVPassport XMLTV ID:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "passport_xmltv_id"

                  ] = match.group(1)

                  continue


              match = re.match(

                  r"^Match Score:\s*(.*)$",

                  stripped

              )


              if match:

                  current_channel[

                      "score"

                  ] = match.group(1)

                  continue


              if stripped == (

                  "EPG DATA: CHECKING AFTER GUIDE GENERATION"

              ):


                  channel_id = current_channel[

                      "stream_id"

                  ]


                  program_count = programs_by_channel.get(

                      channel_id,

                      0

                  )


                  if program_count > 0:

                      status = "YES"

                      data_count += 1

                  else:

                      status = "NO"

                      no_data_count += 1


                  output.append(

                      f'Provider Stream ID: '

                      f'{current_channel["stream_id"]}'

                  )


                  output.append(

                      f'Provider Category ID: '

                      f'{current_channel["category_id"]}'

                  )


                  output.append(

                      f'Provider EPG Channel ID: '

                      f'{current_channel["epg_channel_id"]}'

                  )


                  output.append(

                      f'Provider Channel Name: '

                      f'{current_channel["provider_name"]}'

                  )


                  output.append(

                      f'TVPassport Name: '

                      f'{current_channel["passport_name"]}'

                  )


                  output.append(

                      f'TVPassport Site ID: '

                      f'{current_channel["site_id"]}'

                  )


                  output.append(

                      f'TVPassport XMLTV ID: '

                      f'{current_channel["passport_xmltv_id"]}'

                  )


                  output.append(

                      f'Match Score: '

                      f'{current_channel["score"]}'

                  )


                  output.append(

                      f'EPG DATA: {status}'

                  )


                  output.append(

                      f'PROGRAMS RETURNED: '

                      f'{program_count}'

                  )


                  output.append("")


                  current_channel = None


          unmatched_start = False


          for line in original_lines:


              if line.strip() == "UNMATCHED CHANNELS":


                  unmatched_start = True

                  output.append(

                      "UNMATCHED CHANNELS"

                  )

                  output.append(

                      "------------------"

                  )

                  output.append("")

                  continue


              if unmatched_start:

                  if line.strip():

                      output.append(line)


                      unmatched_count += 1


          total_channels = (

              matched_count

              + unmatched_count

          )


          summary = [

              "TVPassport Canada Channel Matching Report",

              "==========================================",

              "",

              f"MASTER CHANNELS: {total_channels}",

              f"MATCHED CHANNELS: {matched_count}",

              f"UNMATCHED CHANNELS: {unmatched_count}",

              "",

              f"MATCHED CHANNELS WITH EPG DATA: {data_count}",

              f"MATCHED CHANNELS WITH NO EPG DATA: {no_data_count}",

              "",

              "The guide was checked after generation.",

              "PROGRAMS RETURNED is the number of programme entries",

              "found in the final TVPassportCanada.xml guide.",

              "",

              "CHANNEL DETAILS",

              "---------------",

              ""

          ]


          MATCH_FILE.write_text(

              "\n".join(

                  summary

                  + output

              )

              + "\n",

              encoding="utf-8"

          )


          print(

              "============================================================"

          )

          print(

              "CANADA TVPASSPORT CHANNEL REPORT"

          )

          print(

              "============================================================"

          )

          print(

              "Matched channels:",

              matched_count

          )

          print(

              "Unmatched channels:",

              unmatched_count

          )

          print(

              "Matched channels with EPG data:",

              data_count

          )

          print(

              "Matched channels with NO EPG data:",

              no_data_count

          )

          print(

              "============================================================"

          )

          PY

