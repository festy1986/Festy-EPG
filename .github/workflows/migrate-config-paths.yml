name: Migrate Files To Config

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-config-paths:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move files to config and update all workflows
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = require('path')

          const configDir = 'config'
          const reportPath = 'config/workflow-migration-report.txt'

          fs.mkdirSync(configDir, { recursive: true })

          const migrations = [
            {
              oldPath: '.tvmaze-fast-cache.json',
              newPath: 'config/.tvmaze-fast-cache.json'
            },
            {
              oldPath: 'guides/.tvmaze-fast-cache.json',
              newPath: 'config/.tvmaze-fast-cache.json'
            },
            {
              oldPath: '.tvmaze-tivimate-cache.json',
              newPath: 'config/.tvmaze-tivimate-cache.json'
            },
            {
              oldPath: 'guides/.tvmaze-tivimate-cache.json',
              newPath: 'config/.tvmaze-tivimate-cache.json'
            },
            {
              oldPath: '.tvmaze-ota-cache.json',
              newPath: 'config/.tvmaze-ota-cache.json'
            },
            {
              oldPath: 'guides/.tvmaze-ota-cache.json',
              newPath: 'config/.tvmaze-ota-cache.json'
            },
            {
              oldPath: '24-7-channel-list.txt',
              newPath: 'config/24-7-channel-list.txt'
            },
            {
              oldPath: 'guides/24-7-channel-list.txt',
              newPath: 'config/24-7-channel-list.txt'
            },
            {
              oldPath: 'fastchannels.txt',
              newPath: 'config/fastchannels.txt'
            },
            {
              oldPath: 'channels.txt',
              newPath: 'config/channels.txt'
            },
            {
              oldPath: 'iptvorg-channels.txt',
              newPath: 'config/iptvorg-channels.txt'
            },
            {
              oldPath: 'guides/iptvorg-channels.txt',
              newPath: 'config/iptvorg-channels.txt'
            },
            {
              oldPath: 'generate_247.py',
              newPath: 'config/generate_247.py'
            },
            {
              oldPath: 'generate_matched_guide.py',
              newPath: 'config/generate_matched_guide.py'
            },
            {
              oldPath: 'generate_sports.py',
              newPath: 'config/generate_sports.py'
            },
            {
              oldPath: 'matcheverychannel.txt',
              newPath: 'config/matcheverychannel.txt'
            },
            {
              oldPath: 'matcheverychannel.tx',
              newPath: 'config/matcheverychannel.tx'
            },
            {
              oldPath: 'metadata_cache.json',
              newPath: 'config/metadata_cache.json'
            },
            {
              oldPath: 'sports_channels.txt',
              newPath: 'config/sports_channels.txt'
            }
          ]

          const report = []

          report.push('============================================================')
          report.push('WORKFLOW CONFIG PATH MIGRATION REPORT')
          report.push('============================================================')
          report.push(`Generated: ${new Date().toISOString()}`)
          report.push('')

          const workflowDir = '.github/workflows'

          if (!fs.existsSync(workflowDir)) {
            report.push('ERROR: .github/workflows directory does not exist.')
            fs.writeFileSync(reportPath, report.join('\n') + '\n')
            process.exit(1)
          }

          const workflowFiles = fs.readdirSync(workflowDir)
            .filter(file => /\.(yml|yaml)$/i.test(file))

          report.push(`Workflows found: ${workflowFiles.length}`)
          report.push('')

          const workflowChanges = []

          for (const file of workflowFiles) {
            const filePath = path.join(workflowDir, file)
            let content = fs.readFileSync(filePath, 'utf8')
            const originalContent = content
            const changes = []

            for (const migration of migrations) {
              const oldPath = migration.oldPath
              const newPath = migration.newPath

              const escapedOldPath = oldPath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')

              const regex = new RegExp(
                `(?<![A-Za-z0-9_./-])${escapedOldPath}(?![A-Za-z0-9_./-])`,
                'g'
              )

              const matches = content.match(regex)

              if (matches && matches.length > 0) {
                content = content.replace(regex, newPath)

                changes.push({
                  oldPath,
                  newPath,
                  count: matches.length
                })
              }
            }

            if (content !== originalContent) {
              fs.writeFileSync(filePath, content)

              workflowChanges.push({
                file,
                changes
              })

              report.push(`UPDATED WORKFLOW: ${file}`)

              for (const change of changes) {
                report.push(
                  `  REPLACED ${change.count} time(s): ${change.oldPath} -> ${change.newPath}`
                )
              }

              report.push('')
            } else {
              report.push(`NO PATH CHANGES NEEDED: ${file}`)
              report.push('')
            }
          }

          report.push('============================================================')
          report.push('FILE MIGRATION STATUS')
          report.push('============================================================')
          report.push('')

          for (const migration of migrations) {
            const oldPath = migration.oldPath
            const newPath = migration.newPath

            const oldExists = fs.existsSync(oldPath)
            const newExists = fs.existsSync(newPath)

            if (oldExists && newExists) {
              report.push(`SKIPPED - BOTH EXIST:`)
              report.push(`  OLD: ${oldPath}`)
              report.push(`  NEW: ${newPath}`)
              report.push('  REASON: Destination already exists. Nothing was moved.')
              report.push('')
              continue
            }

            if (oldExists && !newExists) {
              fs.mkdirSync(path.dirname(newPath), { recursive: true })

              fs.renameSync(oldPath, newPath)

              report.push(`MOVED:`)
              report.push(`  OLD: ${oldPath}`)
              report.push(`  NEW: ${newPath}`)
              report.push('')
              continue
            }

            if (!oldExists && newExists) {
              report.push(`ALREADY IN NEW LOCATION:`)
              report.push(`  ${newPath}`)
              report.push('')
              continue
            }

            report.push(`NOT FOUND / SKIPPED:`)
            report.push(`  OLD: ${oldPath}`)
            report.push(`  NEW: ${newPath}`)
            report.push('')
          }

          report.push('============================================================')
          report.push('FINAL SUMMARY')
          report.push('============================================================')
          report.push('')
          report.push(`Workflow files scanned: ${workflowFiles.length}`)
          report.push(`Workflows changed: ${workflowChanges.length}`)
          report.push('')

          if (workflowChanges.length > 0) {
            report.push('WORKFLOWS THAT WERE CHANGED:')

            for (const workflow of workflowChanges) {
              report.push(`  ${workflow.file}`)

              for (const change of workflow.changes) {
                report.push(
                  `    ${change.oldPath} -> ${change.newPath} (${change.count} replacement(s))`
                )
              }
            }
          } else {
            report.push('No workflow files required path changes.')
          }

          report.push('')
          report.push('============================================================')
          report.push('END OF REPORT')
          report.push('============================================================')

          fs.writeFileSync(
            reportPath,
            report.join('\n') + '\n'
          )

          console.log(report.join('\n'))
          EOF

      - name: Commit migration changes and report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .github/workflows
          git add config
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Move configuration files to config directory"

          git push origin HEAD:main
