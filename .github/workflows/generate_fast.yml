name: FAST

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create FAST working directory
        run: |
          mkdir -p fast

      - name: Download FAST source
        run: |
          curl -L --fail \
            https://epg.guru/7dayiptv/USFast.xml \
            -o fast/source.xml

          test -s fast/source.xml

          echo "FAST source downloaded successfully"
          echo "Channels: $(grep -c '<channel ' fast/source.xml || true)"
          echo "Programmes: $(grep -c '<programme ' fast/source.xml || true)"

      - name: Process FAST metadata
        run: |
          node <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath = 'fast/source.xml'
          const outputPath = 'fast/processed.xml'

          if (!fs.existsSync(inputPath)) {
            console.error(`Missing ${inputPath}`)
            process.exit(1)
          }

          const input = fs.createReadStream(inputPath, {
            encoding: 'utf8'
          })

          const output = fs.createWriteStream(outputPath, {
            encoding: 'utf8'
          })

          const rl = readline.createInterface({
            input,
            crlfDelay: Infinity
          })

          let programmeBuffer = ''
          let insideProgramme = false
          let programmeCount = 0
          let changedTitles = 0
          let cleanedDescriptions = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/"/g, '&quot;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .replace(/\s+([.,!?;:])/g, '$1')
              .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
              .trim()
          }

          function cleanTitle(value) {
            return cleanSpaces(value)
              .replace(/^\s*(New|Live|Repeat)\s*[:\-]\s*/i, '')
              .replace(/\s*\((New|Live|Repeat)\)\s*$/i, '')
              .replace(/\s*[-–—]\s*(New|Live|Repeat)\s*$/i, '')
              .trim()
          }

          function cleanDescription(value) {
            return cleanSpaces(value)
              .replace(/\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i, ' ($1)')
              .replace(
                /\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g,
                ' ($2)'
              )
              .trim()
          }

          function getTag(block, tag) {
            const match = block.match(
              new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i')
            )

            return match
              ? decodeXml(match[1].replace(/<[^>]+>/g, '').trim())
              : ''
          }

          function getTags(block, tag) {
            return [
              ...block.matchAll(
                new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'gi')
              )
            ]
              .map(match =>
                decodeXml(match[1].replace(/<[^>]+>/g, '').trim())
              )
              .filter(Boolean)
          }

          function getProgrammeType(block) {
            const categories = getTags(block, 'category')
              .map(value => value.toLowerCase())

            if (
              categories.includes('movie') ||
              categories.includes('film')
            ) {
              return 'movie'
            }

            if (
              categories.includes('series') ||
              categories.includes('tv series') ||
              categories.includes('miniseries')
            ) {
              return 'series'
            }

            const title = getTag(block, 'title').toLowerCase()
            const subtitle = getTag(block, 'sub-title')
            const episodeNum = block.match(/<episode-num\b/i)

            if (
              subtitle ||
              episodeNum ||
              /\b(series|episode|season)\b/i.test(title)
            ) {
              return 'series'
            }

            return 'program'
          }

          function getEpisodeCode(block) {
            const episodeNum = getTag(block, 'episode-num')

            if (!episodeNum) return ''

            const xmltvMatch = episodeNum.match(/^(\d+)\.(\d+)\.$/)

            if (xmltvMatch) {
              return `S${Number(xmltvMatch[1]) + 1}E${Number(xmltvMatch[2]) + 1}`
            }

            const directMatch = episodeNum.match(/\bS(\d+)E(\d+)\b/i)

            if (directMatch) {
              return `S${directMatch[1]}E${directMatch[2]}`
            }

            return episodeNum
          }

          function getDisplayDate(block) {
            const start = block.match(
              /<programme\b[^>]*start="(\d{8})/
            )

            if (!start) return ''

            const value = start[1]

            return `${value.slice(4, 6)}/${value.slice(6, 8)}/${value.slice(0, 4)}`
          }

          function hasTrailingDate(value) {
            return /\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/.test(value)
          }

          function replaceTag(block, tag, value) {
            const escaped = escapeXml(value)

            const replacement =
              `<${tag} lang="en">${escaped}</${tag}>`

            const regex = new RegExp(
              `<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
              'i'
            )

            if (regex.test(block)) {
              return block.replace(regex, replacement)
            }

            return block.replace(
              /<\/programme>\s*$/i,
              `  ${replacement}\n</programme>`
            )
          }

          function removeTag(block, tag) {
            return block.replace(
              new RegExp(
                `\\s*<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
                'gi'
              ),
              ''
            )
          }

          function processProgramme(block) {
            programmeCount++

            const originalTitle = getTag(block, 'title')
            const originalDescription = getTag(block, 'desc')
            const episodeTitle = getTag(block, 'sub-title')
            const episodeCode = getEpisodeCode(block)
            const programmeType = getProgrammeType(block)

            const title = cleanTitle(originalTitle)

            if (title !== originalTitle) {
              changedTitles++
            }

            let description = cleanDescription(originalDescription)

            if (description !== originalDescription) {
              cleanedDescriptions++
            }

            if (
              (programmeType === 'series' ||
                episodeTitle ||
                episodeCode) &&
              episodeTitle &&
              episodeCode
            ) {
              const prefix =
                `${cleanSpaces(episodeTitle)} - ${episodeCode}`

              if (!description.startsWith(prefix)) {
                description = description
                  ? `${prefix}. ${description}`
                  : prefix
              }
            } else if (
              (programmeType === 'series' ||
                episodeTitle ||
                episodeCode) &&
              episodeTitle
            ) {
              if (!description.startsWith(episodeTitle)) {
                description = description
                  ? `${cleanSpaces(episodeTitle)}. ${description}`
                  : cleanSpaces(episodeTitle)
              }
            } else if (
              (programmeType === 'series' || episodeCode) &&
              episodeCode
            ) {
              if (
                !new RegExp(
                  `\\b${episodeCode}\\b`,
                  'i'
                ).test(description)
              ) {
                description = description
                  ? `${episodeCode}. ${description}`
                  : episodeCode
              }
            }

            if (
              programmeType === 'movie' &&
              !hasTrailingDate(description)
            ) {
              const yearMatch = originalDescription.match(
                /\b(19|20)\d{2}\b/
              )

              if (yearMatch) {
                description = description
                  ? `${description} (${yearMatch[0]})`
                  : `(${yearMatch[0]})`
              }
            }

            if (
              programmeType !== 'movie' &&
              !hasTrailingDate(description)
            ) {
              const displayDate = getDisplayDate(block)

              if (displayDate) {
                description = description
                  ? `${description} (${displayDate})`
                  : `(${displayDate})`
              }
            }

            let output = block

            if (title && title !== originalTitle) {
              output = replaceTag(output, 'title', title)
            }

            if (description !== originalDescription) {
              output = replaceTag(output, 'desc', description)
            }

            output = removeTag(output, 'sub-title')
            output = removeTag(output, 'episode-num')
            output = removeTag(output, 'date')

            return output
          }

          function writeOutput(value) {
            return new Promise((resolve, reject) => {
              if (output.write(value)) {
                resolve()
              } else {
                output.once('drain', resolve)
                output.once('error', reject)
              }
            })
          }

          async function main() {
            for await (const line of rl) {
              if (!insideProgramme) {
                if (line.includes('<programme ')) {
                  insideProgramme = true
                  programmeBuffer = line + '\n'

                  if (line.includes('</programme>')) {
                    insideProgramme = false
                    await writeOutput(
                      processProgramme(programmeBuffer)
                    )
                    programmeBuffer = ''
                  }
                } else {
                  await writeOutput(line + '\n')
                }
              } else {
                programmeBuffer += line + '\n'

                if (line.includes('</programme>')) {
                  insideProgramme = false

                  await writeOutput(
                    processProgramme(programmeBuffer)
                  )

                  programmeBuffer = ''
                }
              }
            }

            if (programmeBuffer) {
              await writeOutput(programmeBuffer)
            }

            await new Promise((resolve, reject) => {
              output.end(resolve)
              output.on('error', reject)
            })

            console.log('FAST metadata processing complete')
            console.log(`Programmes processed: ${programmeCount}`)
            console.log(`Titles cleaned: ${changedTitles}`)
            console.log(`Descriptions cleaned: ${cleanedDescriptions}`)
            console.log(`Output: ${outputPath}`)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

      - name: Validate processed FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' fast/processed.xml || true)
          PROGRAMMES=$(grep -c '<programme ' fast/processed.xml || true)

          echo "Processed FAST channels: $CHANNELS"
          echo "Processed FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Processed FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Processed FAST guide contains no programmes"
            exit 1
          fi

          test -s fast/processed.xml

      - name: Show processed FAST size
        run: |
          ls -lh fast/source.xml
          ls -lh fast/processed.xml

      - name: Split FAST guide into GitHub-safe files
        run: |
          node <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath = 'fast/processed.xml'
          const outputDir = 'fast/chunks'

          fs.rmSync(outputDir, { recursive: true, force: true })
          fs.mkdirSync(outputDir, { recursive: true })

          const input = fs.createReadStream(inputPath, {
            encoding: 'utf8'
          })

          const rl = readline.createInterface({
            input,
            crlfDelay: Infinity
          })

          const MAX_BYTES = 75 * 1024 * 1024

          let header = ''
          let channels = []
          let programmes = []
          let currentProgramme = ''
          let insideProgramme = false
          let chunkNumber = 1
          let chunkBytes = 0
          let channelCount = 0
          let programmeCount = 0

          function getChannelId(block) {
            const match = block.match(
              /<channel\b[^>]*\bid="([^"]+)"/i
            )

            return match ? match[1] : ''
          }

          function getProgrammeChannel(block) {
            const match = block.match(
              /<programme\b[^>]*\bchannel="([^"]+)"/i
            )

            return match ? match[1] : ''
          }

          const channelMap = new Map()

          function writeChunk() {
            if (!channels.length && !programmes.length) return

            const content =
              `${header}` +
              channels.join('') +
              programmes.join('') +
              '</tv>\n'

            const outputPath =
              `${outputDir}/FAST-${String(chunkNumber).padStart(3, '0')}.xml`

            fs.writeFileSync(outputPath, content)

            console.log(
              `Created ${outputPath} | ` +
              `${(Buffer.byteLength(content) / 1024 / 1024).toFixed(2)} MB | ` +
              `channels=${channels.length} | ` +
              `programmes=${programmes.length}`
            )

            chunkNumber++
            channels = []
            programmes = []
            chunkBytes = 0
          }

          function addChannel(block) {
            const id = getChannelId(block)

            if (!id) return

            if (
              chunkBytes > 0 &&
              chunkBytes + Buffer.byteLength(block) > MAX_BYTES
            ) {
              writeChunk()
            }

            channelMap.set(id, chunkNumber)

            channels.push(block)
            chunkBytes += Buffer.byteLength(block)
            channelCount++
          }

          async function main() {
            for await (const line of rl) {
              if (!insideProgramme) {
                if (line.includes('<tv')) {
                  header += line + '\n'
                  continue
                }

                if (line.includes('<channel ')) {
                  addChannel(line + '\n')
                  continue
                }

                if (line.includes('<programme ')) {
                  insideProgramme = true
                  currentProgramme = line + '\n'

                  if (line.includes('</programme>')) {
                    insideProgramme = false
                    programmes.push(currentProgramme)
                    programmeCount++
                    currentProgramme = ''
                  }

                  continue
                }

                if (line.includes('</tv>')) {
                  continue
                }

                if (line.trim()) {
                  header += line + '\n'
                }
              } else {
                currentProgramme += line + '\n'

                if (line.includes('</programme>')) {
                  insideProgramme = false
                  programmes.push(currentProgramme)
                  programmeCount++
                  currentProgramme = ''
                }
              }
            }

            writeChunk()

            console.log(`Total channels: ${channelCount}`)
            console.log(`Total programmes: ${programmeCount}`)
            console.log(`Total chunks: ${chunkNumber - 1}`)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          EOF

      - name: Compress FAST chunks
        run: |
          for file in fast/chunks/*.xml; do
            gzip -c "$file" > "$file.gz"
          done

          rm -f fast/chunks/*.xml

          echo "Compressed FAST chunks:"
          ls -lh fast/chunks

      - name: Validate FAST chunks
        run: |
          COUNT=$(find fast/chunks -name '*.xml.gz' | wc -l)

          echo "FAST chunk count: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "No FAST chunks were created"
            exit 1
          fi

          for file in fast/chunks/*.xml.gz; do
            SIZE=$(stat -c%s "$file")

            echo "$(basename "$file"): $SIZE bytes"

            if [ "$SIZE" -ge 100000000 ]; then
              echo "ERROR: $file is too large for GitHub"
              exit 1
            fi
          done

      - name: Commit FAST chunks
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git rebase origin/main

          git add fast/chunks

          if git diff --cached --quiet; then
            echo "No FAST changes to commit"
            exit 0
          fi

          git commit -m "Update FAST guide chunks"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, refreshing branch..."

            git fetch origin main
            git rebase origin/main

            sleep 5
          done

          echo "Push failed after retries"
          exit 1
