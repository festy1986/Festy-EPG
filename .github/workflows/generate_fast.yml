name: FAST

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create FAST working directory
        run: |
          mkdir -p fast

      - name: Download FAST source
        run: |
          curl -L --fail \
            https://epg.guru/7dayiptv/USFast.xml \
            -o fast/source.xml

          test -s fast/source.xml

          echo "FAST source downloaded successfully"
          echo "Channels: $(grep -c '<channel ' fast/source.xml || true)"
          echo "Programmes: $(grep -c '<programme ' fast/source.xml || true)"

      - name: Validate FAST source
        run: |
          CHANNELS=$(grep -c '<channel ' fast/source.xml || true)
          PROGRAMMES=$(grep -c '<programme ' fast/source.xml || true)

          echo "FAST source channels: $CHANNELS"
          echo "FAST source programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "FAST source contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "FAST source contains no programmes"
            exit 1
          fi
