name: FAST

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create FAST working directory
        run: |
          mkdir -p fast
          mkdir -p guides

      - name: Download FAST source
        run: |
          curl -L --fail \
            https://epg.guru/7dayiptv/USFast.xml \
            -o fast/source.xml

          test -s fast/source.xml

          echo "FAST source downloaded successfully"
          echo "Channels: $(grep -c '<channel ' fast/source.xml || true)"
          echo "Programmes: $(grep -c '<programme ' fast/source.xml || true)"

      - name: Copy FAST source as initial output
        run: |
          cp fast/source.xml guides/FAST.xml

      - name: Validate FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' guides/FAST.xml || true)
          PROGRAMMES=$(grep -c '<programme ' guides/FAST.xml || true)

          echo "FAST channels: $CHANNELS"
          echo "FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "FAST guide contains no programmes"
            exit 1
          fi

      - name: Compress FAST guide
        run: |
          gzip -c guides/FAST.xml > guides/FAST.xml.gz

      - name: Commit FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/FAST.xml guides/FAST.xml.gz

          if git diff --cached --quiet; then
            echo "No FAST guide changes to commit"
            exit 0
          fi

          git commit -m "Update FAST guide"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
