name: TEST TVPassport Canada Raw Extraction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-tvpassport-canada-extraction
  cancel-in-progress: false

jobs:
  extract-canada-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract TEST Canadian channels from TVPassport RAW
        run: |
          mkdir -p config/TVPassportCanada

          python3 - <<'PY'
          import re
          from pathlib import Path

          source_path = Path("guides/TVPassportRAW.xml")
          output_path = Path(
              "config/TVPassportCanada/TEST_TVPassportCanada.xml"
          )

          if not source_path.exists():
              raise SystemExit(
                  f"ERROR: Source file not found: {source_path}"
              )

          source = source_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          channel_blocks = re.findall(
              r"<channel\b[^>]*>.*?</channel>",
              source,
              flags=re.IGNORECASE | re.DOTALL
          )

          canadian_provinces = {
              "AB",
              "BC",
              "MB",
              "NB",
              "NL",
              "NS",
              "NT",
              "NU",
              "ON",
              "PE",
              "QC",
              "SK",
              "YT"
          }

          canadian_matches = []

          for block in channel_blocks:
              site_id_match = re.search(
                  r'\bsite_id="([^"]*)"',
                  block,
                  flags=re.IGNORECASE
              )

              xmltv_id_match = re.search(
                  r'\bxmltv_id="([^"]*)"',
                  block,
                  flags=re.IGNORECASE
              )

              channel_name_match = re.search(
                  r">([^<>]+)</channel>",
                  block,
                  flags=re.IGNORECASE
              )

              site_id = (
                  site_id_match.group(1).strip()
                  if site_id_match
                  else ""
              )

              xmltv_id = (
                  xmltv_id_match.group(1).strip()
                  if xmltv_id_match
                  else ""
              )

              channel_name = (
                  channel_name_match.group(1).strip()
                  if channel_name_match
                  else ""
              )

              searchable_text = " ".join(
                  [
                      site_id,
                      xmltv_id,
                      channel_name
                  ]
              )

              searchable_lower = searchable_text.lower()

              is_canadian = False
              match_reason = ""

              if re.search(
                  r"\bcanada\b",
                  searchable_lower
              ):
                  is_canadian = True
                  match_reason = "Canada"

              elif re.search(
                  r"\.ca(?:@|$|\b)",
                  xmltv_id.lower()
              ):
                  is_canadian = True
                  match_reason = ".ca XMLTV ID"

              else:
                  province_pattern = (
                      r"(?<![A-Za-z])"
                      r"("
                      + "|".join(
                          sorted(
                              canadian_provinces,
                              key=len,
                              reverse=True
                          )
                      )
                      + r")"
                      r"(?![A-Za-z])"
                  )

                  province_match = re.search(
                      province_pattern,
                      searchable_text,
                      flags=re.IGNORECASE
                  )

                  if province_match:
                      is_canadian = True
                      match_reason = (
                          "Canadian province "
                          + province_match.group(1).upper()
                      )

              if is_canadian:
                  canadian_matches.append(
                      (
                          channel_name,
                          site_id,
                          match_reason,
                          block.strip()
                      )
                  )

          output_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              "<!--",
              "  TEST TVPassport Canada channel extraction",
              "",
              "  Source:",
              "  guides/TVPassportRAW.xml",
              "",
              "  This file contains complete channel blocks",
              "  identified as Canadian / Canada / Canadian province",
              "  / .ca XMLTV channels by the TEST extraction.",
              "-->",
              "<tv>"
          ]

          for (
              channel_name,
              site_id,
              match_reason,
              block
          ) in canadian_matches:
              output_lines.append(
                  f"  <!-- TEST MATCH: {match_reason} -->"
              )

              output_lines.append(
                  "  " +
                  block.replace(
                      "\n",
                      "\n  "
                  )
              )

          output_lines.append("</tv>")

          output_path.write_text(
              "\n".join(output_lines) + "\n",
              encoding="utf-8"
          )

          print(
              "TEST TVPassport Canada extraction complete"
          )

          print(
              f"Total channel blocks scanned: "
              f"{len(channel_blocks)}"
          )

          print(
              f"Canadian channel blocks extracted: "
              f"{len(canadian_matches)}"
          )

          print(
              f"Output: {output_path}"
          )

          print("")

          print(
              "Extracted Canadian channels:"
          )

          for (
              channel_name,
              site_id,
              match_reason,
              block
          ) in canadian_matches:
              print(
                  f"  {channel_name} "
                  f"[{site_id}] "
                  f"({match_reason})"
              )
          PY

      - name: Commit TEST Canadian channel extraction
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/TVPassportCanada/TEST_TVPassportCanada.xml

          git diff --cached --quiet || \
            git commit -m "TEST TVPassport Canada channel extraction"

          git pull --rebase origin main
          git push origin main
