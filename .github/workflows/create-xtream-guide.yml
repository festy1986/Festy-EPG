name: Create Xtream Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Create guide files
      shell: python3 {0}
      run: |
        import json
        import xml.etree.ElementTree as ET
        import os
        import html

        INPUT = "xtream-epg/channels.json"

        OUT_XML = "xtream-epg/xtream-guide.xml"
        OUT_LIST = "xtream-epg/channel-display-list.txt"

        if not os.path.exists(INPUT):
            raise Exception("channels.json missing")

        with open(INPUT, "r", encoding="utf-8") as f:
            channels = json.load(f)


        tv = ET.Element("tv")


        with open(OUT_LIST, "w", encoding="utf-8") as listing:

            listing.write(
                "XTREAM CHANNEL DISPLAY LIST\n"
                "===========================\n\n"
            )

            for ch in channels:

                stream_id = str(
                    ch.get("stream_id","")
                )

                name = (
                    ch.get("name")
                    or "UNKNOWN"
                ).strip()


                if not stream_id:
                    continue


                # XMLTV channel entry
                channel = ET.SubElement(
                    tv,
                    "channel",
                    {
                        "id": stream_id
                    }
                )


                display = ET.SubElement(
                    channel,
                    "display-name"
                )

                display.text = name


                # manual list
                listing.write(
                    f"{stream_id} | {name}\n"
                )


        tree = ET.ElementTree(tv)

        tree.write(
            OUT_XML,
            encoding="utf-8",
            xml_declaration=True
        )


        print(
            f"Created {len(channels)} channels"
        )

        print(OUT_XML)
        print(OUT_LIST)


    - name: Upload guide files
      uses: actions/upload-artifact@v4
      with:
        name: xtream-guide
        path: |
          xtream-epg/xtream-guide.xml
          xtream-epg/channel-display-list.txt
