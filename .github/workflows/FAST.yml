name: FAST

on:
workflow_dispatch:
schedule:
- cron: '45 5 * * *'

permissions:
contents: write

concurrency:
group: epg-fast
cancel-in-progress: false

jobs:
build-fast:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: 24

  - name: Create FAST working directory
    run: |
      mkdir -p fast

  - name: Download FAST source
    run: |
      curl -L --fail \
        https://epg.guru/7dayiptv/USFast.xml \
        -o fast/source.xml

      test -s fast/source.xml

      echo "FAST source downloaded successfully"
      echo "Source size:"
      ls -lh fast/source.xml

      echo "Channels: $(grep -c '<channel ' fast/source.xml || true)"
      echo "Programmes: $(grep -c '<programme ' fast/source.xml || true)"

  - name: Process FAST guide
    run: |
      node --max-old-space-size=6144 <<'EOF'
      const fs = require('fs')
      const readline = require('readline')

      const inputPath = 'fast/source.xml'
      const outputPath = 'fast/processed.xml'

      const now = new Date()

      const cutoff = new Date(
        now.getTime() +
        3 * 24 * 60 * 60 * 1000
      )

      let programmesScanned = 0
      let programmesKept = 0
      let programmesSkipped = 0
      let titlesCleaned = 0
      let descriptionsChanged = 0
      let creditsRemoved = 0
      let episodeNumbersRemoved = 0

      function decodeXml(value) {
        return String(value || '')
          .replace(/&amp;/g, '&')
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
      }

      function escapeXml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '>')
      }

      function cleanSpaces(value) {
        return String(value || '')
          .replace(/\s+/g, ' ')
          .replace(/\s+([.,!?;:])/g, '$1')
          .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
          .trim()
      }

      function cleanTitle(value) {
        return cleanSpaces(value)
          .replace(
            /^\s*(New|Live|Repeat)\s*[:\-]\s*/i,
            ''
          )
          .replace(
            /\s*\((New|Live|Repeat)\)\s*$/i,
            ''
          )
          .replace(
            /\s*[-–—]\s*(New|Live|Repeat)\s*$/i,
            ''
          )
          .trim()
      }

      function cleanDescription(value) {
        return cleanSpaces(value)
          .replace(
            /\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i,
            ' ($1)'
          )
          .replace(
            /\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/g,
            ' ($2)'
          )
          .trim()
      }

      function getTag(block, tag) {
        const match = block.match(
          new RegExp(
            `<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`,
            'i'
          )
        )

        return match
          ? decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          : ''
      }

      function getTags(block, tag) {
        return [
          ...block.matchAll(
            new RegExp(
              `<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`,
              'gi'
            )
          )
        ]
          .map(match =>
            decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          )
          .filter(Boolean)
      }

      function parseXmltvDate(value) {
        if (!value) return null

        const match =
          String(value).match(
            /^(\\d{4})(\\d{2})(\\d{2})(\\d{2})(\\d{2})(\\d{2})/
          )

        if (!match) return null

        const [
          ,
          year,
          month,
          day,
          hour,
          minute,
          second
        ] = match

        return new Date(
          Date.UTC(
            Number(year),
            Number(month) - 1,
            Number(day),
            Number(hour),
            Number(minute),
            Number(second)
          )
        )
      }

      function programmeIsWithinThreeDays(block) {
        const match =
          block.match(
            /<programme\\b[^>]*\\bstart="([^"]+)"/i
          )

        if (!match) return false

        const start =
          parseXmltvDate(match[1])

        if (
          !start ||
          Number.isNaN(start.getTime())
        ) {
          return false
        }

        return (
          start >= now &&
          start < cutoff
        )
      }

      function getProgrammeType(block) {
        const categories =
          getTags(block, 'category')
            .map(value =>
              value.toLowerCase()
            )

        if (
          categories.includes('movie') ||
          categories.includes('film')
        ) {
          return 'movie'
        }

        if (
          categories.includes('series') ||
          categories.includes('tv series') ||
          categories.includes('miniseries') ||
          categories.includes('episode')
        ) {
          return 'series'
        }

        const title =
          getTag(
            block,
            'title'
          ).toLowerCase()

        const subtitle =
          getTag(
            block,
            'sub-title'
          )

        const episodeNum =
          getTag(
            block,
            'episode-num'
          )

        if (
          subtitle ||
          episodeNum ||
          /\\b(series|episode|season)\\b/i.test(title)
        ) {
          return 'series'
        }

        return 'program'
      }

      function getDisplayDate(block) {
        const match =
          block.match(
            /<programme\\b[^>]*\\bstart="(\\d{8})/
          )

        if (!match) return ''

        const value =
          match[1]

        return (
          `${value.slice(4, 6)}/` +
          `${value.slice(6, 8)}/` +
          `${value.slice(0, 4)}`
        )
      }

      function hasTrailingDate(value) {
        return /\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/
          .test(value)
      }

      function replaceTag(
        block,
        tag,
        value
      ) {
        const escaped =
          escapeXml(value)

        const replacement =
          `<${tag} lang="en">${escaped}</${tag}>`

        const regex =
          new RegExp(
            `<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
            'i'
          )

        if (
          regex.test(block)
        ) {
          return block.replace(
            regex,
            replacement
          )
        }

        return block.replace(
          /<\/programme>\s*$/i,
          `  ${replacement}\n</programme>`
        )
      }

      function removeTag(
        block,
        tag
      ) {
        return block.replace(
          new RegExp(
            `\\s*<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
            'gi'
          ),
          ''
        )
      }

      function removeCredits(block) {
        const hadCredits =
          /<credits\\b/i.test(block)

        const output =
          removeTag(
            block,
            'credits'
          )

        if (
          hadCredits
        ) {
          creditsRemoved++
        }

        return output
      }

      function removeEpisodeNumber(block) {
        const hadEpisodeNumber =
          /<episode-num\\b/i.test(block)

        const output =
          removeTag(
            block,
            'episode-num'
          )

        if (
          hadEpisodeNumber
        ) {
          episodeNumbersRemoved++
        }

        return output
      }

      function processProgramme(block) {
        programmesScanned++

        if (
          !programmeIsWithinThreeDays(
            block
          )
        ) {
          programmesSkipped++
          return ''
        }

        programmesKept++

        const originalTitle =
          getTag(
            block,
            'title'
          )

        const originalDescription =
          getTag(
            block,
            'desc'
          )

        const episodeTitle =
          getTag(
            block,
            'sub-title'
          )

        const programmeType =
          getProgrammeType(
            block
          )

        const title =
          cleanTitle(
            originalTitle
          )

        if (
          title !==
          originalTitle
        ) {
          titlesCleaned++
        }

        let description =
          cleanDescription(
            originalDescription
          )

        if (
          description !==
          originalDescription
        ) {
          descriptionsChanged++
        }

        if (
          episodeTitle
        ) {
          const prefix =
            cleanSpaces(
              episodeTitle
            )

          if (
            !description.startsWith(
              prefix
            )
          ) {
            description =
              description
                ? `${prefix}. ${description}`
                : prefix
          }
        }

        if (
          programmeType === 'movie' &&
          !hasTrailingDate(
            description
          )
        ) {
          const yearMatch =
            originalDescription.match(
              /\b(19|20)\d{2}\b/
            )

          if (
            yearMatch
          ) {
            description =
              description
                ? `${description} (${yearMatch[0]})`
                : `(${yearMatch[0]})`
          }
        }

        if (
          programmeType !== 'movie' &&
          !hasTrailingDate(
            description
          )
        ) {
          const displayDate =
            getDisplayDate(
              block
            )

          if (
            displayDate
          ) {
            description =
              description
                ? `${description} (${displayDate})`
                : `(${displayDate})`
          }
        }

        let output =
          block

        if (
          title &&
          title !== originalTitle
        ) {
          output =
            replaceTag(
              output,
              'title',
              title
            )
        }

        if (
          description !==
          originalDescription
        ) {
          output =
            replaceTag(
              output,
              'desc',
              description
            )
        }

        output =
          removeTag(
            output,
            'sub-title'
          )

        output =
          removeEpisodeNumber(
            output
          )

        output =
          removeTag(
            output,
            'date'
          )

        output =
          removeCredits(
            output
          )

        return output
      }

      async function main() {
        const input =
          fs.createReadStream(
            inputPath,
            {
              encoding: 'utf8'
            }
          )

        const output =
          fs.createWriteStream(
            outputPath,
            {
              encoding: 'utf8'
            }
          )

        const rl =
          readline.createInterface(
            {
              input,
              crlfDelay: Infinity
            }
          )

        let insideProgramme =
          false

        let programmeBuffer =
          ''

        function writeOutput(value) {
          return new Promise(
            (
              resolve,
              reject
            ) => {
              if (
                output.write(
                  value
                )
              ) {
                resolve()
              } else {
                output.once(
                  'drain',
                  resolve
                )

                output.once(
                  'error',
                  reject
                )
              }
            }
          )
        }

        for await (
          const line of rl
        ) {
          if (
            !insideProgramme
          ) {
            if (
              line.includes(
                '<programme '
              )
            ) {
              insideProgramme =
                true

              programmeBuffer =
                line + '\n'

              if (
                line.includes(
                  '</programme>'
                )
              ) {
                insideProgramme =
                  false

                const processed =
                  processProgramme(
                    programmeBuffer
                  )

                if (
                  processed
                ) {
                  await writeOutput(
                    processed
                  )
                }

                programmeBuffer =
                  ''
              }
            } else {
              await writeOutput(
                line + '\n'
              )
            }
          } else {
            programmeBuffer +=
              line + '\n'

            if (
              line.includes(
                '</programme>'
              )
            ) {
              insideProgramme =
                false

              const processed =
                processProgramme(
                  programmeBuffer
                )

              if (
                processed
              ) {
                await writeOutput(
                  processed
                )
              }

              programmeBuffer =
                ''
            }
          }
        }

        if (
          programmeBuffer
        ) {
          const processed =
            processProgramme(
              programmeBuffer
            )

          if (
            processed
          ) {
            await writeOutput(
              processed
            )
          }
        }

        await new Promise(
          (
            resolve,
            reject
          ) => {
            output.end(
              resolve
            )

            output.on(
              'error',
              reject
            )
          }
        )

        console.log(
          'FAST processing complete'
        )

        console.log(
          `Programmes scanned: ${programmesScanned}`
        )

        console.log(
          `Programmes kept: ${programmesKept}`
        )

        console.log(
          `Programmes skipped: ${programmesSkipped}`
        )

        console.log(
          `Titles cleaned: ${titlesCleaned}`
        )

        console.log(
          `Descriptions changed: ${descriptionsChanged}`
        )

        console.log(
          `Credits blocks removed: ${creditsRemoved}`
        )

        console.log(
          `Episode numbers removed: ${episodeNumbersRemoved}`
        )

        console.log(
          `Output: ${outputPath}`
        )
      }

      main().catch(
        error => {
          console.error(error)
          process.exit(1)
        }
      )
      EOF

  - name: Validate processed FAST guide
    run: |
      CHANNELS=$(grep -c '<channel ' fast/processed.xml || true)
      PROGRAMMES=$(grep -c '<programme ' fast/processed.xml || true)

      echo "Processed FAST channels: $CHANNELS"
      echo "Processed FAST programmes: $PROGRAMMES"

      if [ "$CHANNELS" -lt 1 ]; then
        echo "Processed FAST guide contains no channels"
        exit 1
      fi

      if [ "$PROGRAMMES" -lt 1 ]; then
        echo "Processed FAST guide contains no programmes"
        exit 1
      fi

      test -s fast/processed.xml

  - name: Show processed FAST size
    run: |
      ls -lh fast/source.xml
      ls -lh fast/processed.xml

  - name: Compress FAST guide
    run: |
      gzip -c fast/processed.xml > fast/FAST.xml.gz

  - name: Validate compressed FAST guide
    run: |
      ls -lh fast/FAST.xml.gz

      SIZE=$(stat -c%s fast/FAST.xml.gz)

      echo "Compressed FAST size: $SIZE bytes"
      echo "Compressed FAST size in MB: $((SIZE / 1000000)) MB"

      if [ "$SIZE" -ge 100000000 ]; then
        echo "FAST guide is too large for GitHub's normal file limit"
        exit 1
      fi

      echo "FAST guide size is valid for upload"

  - name: Commit FAST guide
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git fetch origin main
      git rebase origin/main

      git add fast/FAST.xml.gz

      if git diff --cached --quiet; then
        echo "No FAST guide changes to commit"
        exit 0
      fi

      git commit -m "Update FAST guide"

      for attempt in 1 2 3 4 5; do
        echo "Push attempt $attempt"

        if git push origin HEAD:main; then
          echo "Push succeeded"
          exit 0
        fi

        echo "Push failed, refreshing branch..."

        git fetch origin main
        git rebase origin/main

        sleep 5
      done

      echo "Push failed after retries"
      exit 1
```
