name: FAST

on:
workflow_dispatch:
schedule:
- cron: '45 5 * * *'

permissions:
contents: write

concurrency:
group: epg-fast
cancel-in-progress: false

jobs:
build-fast:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: 24

  - name: Create FAST working directory
    run: |
      mkdir -p fast

  - name: Download FAST source
    run: |
      curl -L --fail --retry 5 --retry-delay 10 \
        https://epg.guru/7dayiptv/USFast.xml \
        -o fast/source.xml

      test -s fast/source.xml

      echo "FAST source downloaded successfully"
      echo "Source size:"
      ls -lh fast/source.xml

      echo "Channels: $(grep -c '<channel ' fast/source.xml || true)"
      echo "Programmes: $(grep -c '<programme ' fast/source.xml || true)"

  - name: Process FAST guide
    run: |
      node --max-old-space-size=6144 <<'EOF'
      const fs = require('fs')
      const readline = require('readline')

      const inputPath = 'fast/source.xml'
      const outputPath = 'fast/processed.xml'

      const now = new Date()

      const cutoff = new Date(
        now.getTime() +
        3 * 24 * 60 * 60 * 1000
      )

      let programmesScanned = 0
      let programmesKept = 0
      let programmesSkipped = 0
      let titlesCleaned = 0
      let descriptionsChanged = 0
      let actorsRemoved = 0
      let episodeNumbersConverted = 0

      function decodeXml(value) {
        return String(value || '')
          .replace(/&amp;/g, '&')
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
      }

      function escapeXml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
      }

      function cleanSpaces(value) {
        return String(value || '')
          .replace(/\s+/g, ' ')
          .replace(/\s+([.,!?;:])/g, '$1')
          .replace(/([.,!?;:])([A-Za-z0-9])/g, '$1 $2')
          .trim()
      }

      function cleanTitle(value) {
        return cleanSpaces(value)
          .replace(
            /^\s*(New|Live|Repeat)\s*[:\-]\s*/i,
            ''
          )
          .replace(
            /\s*\((New|Live|Repeat)\)\s*$/i,
            ''
          )
          .replace(
            /\s*[-–—]\s*(New|Live|Repeat)\s*$/i,
            ''
          )
          .trim()
      }

      function cleanDescription(value) {
        return cleanSpaces(value)
          .replace(
            /\s+Aired\s+(\d{1,2}\/\d{1,2}\/\d{4})\.?\s*$/i,
            ' ($1)'
          )
          .replace(
            /\s+\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/i,
            ' ($2)'
          )
          .trim()
      }

      function getTag(block, tag) {
        const match = block.match(
          new RegExp(
            `<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`,
            'i'
          )
        )

        return match
          ? decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          : ''
      }

      function getDisplayDate(block) {
        const match = block.match(
          /<programme\b[^>]*\bstart="(\d{8})/i
        )

        if (!match) {
          return ''
        }

        const value = match[1]

        return (
          `${value.slice(4, 6)}/` +
          `${value.slice(6, 8)}/` +
          `${value.slice(0, 4)}`
        )
      }

      function parseXmltvDate(value) {
        if (!value) {
          return null
        }

        const match = String(value).match(
          /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
        )

        if (!match) {
          return null
        }

        const [
          ,
          year,
          month,
          day,
          hour,
          minute,
          second
        ] = match

        return new Date(
          Date.UTC(
            Number(year),
            Number(month) - 1,
            Number(day),
            Number(hour),
            Number(minute),
            Number(second)
          )
        )
      }

      function programmeIsWithinThreeDays(block) {
        const match = block.match(
          /<programme\b[^>]*\bstart="([^"]+)"/i
        )

        if (!match) {
          return false
        }

        const start =
          parseXmltvDate(
            match[1]
          )

        if (
          !start ||
          Number.isNaN(
            start.getTime()
          )
        ) {
          return false
        }

        return (
          start >= now &&
          start < cutoff
        )
      }

      function replaceTag(
        block,
        tag,
        value
      ) {
        const escaped =
          escapeXml(
            value
          )

        const replacement =
          `<${tag} lang="en">${escaped}</${tag}>`

        const regex =
          new RegExp(
            `<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
            'i'
          )

        if (
          regex.test(
            block
          )
        ) {
          return block.replace(
            regex,
            replacement
          )
        }

        return block.replace(
          /<\/programme>\s*$/i,
          `  ${replacement}\n</programme>`
        )
      }

      function removeTag(
        block,
        tag
      ) {
        return block.replace(
          new RegExp(
            `\\s*<${tag}\\b[^>]*>[\\s\\S]*?<\\/${tag}>`,
            'gi'
          ),
          ''
        )
      }

      function extractEpisodeFromTitle(
        originalTitle
      ) {
        const title =
          cleanSpaces(
            originalTitle
          )

        const match =
          title.match(
            /\bS(\d{1,3})\s*E(\d{1,3})\b/i
          )

        if (!match) {
          return {
            showTitle: title,
            episodeTitle: '',
            episodeCode: ''
          }
        }

        const episodeCode =
          `S${Number(match[1])}` +
          `E${Number(match[2])}`

        let before =
          title
            .slice(
              0,
              match.index
            )
            .trim()

        let after =
          title
            .slice(
              match.index +
              match[0].length
            )
            .trim()

        before =
          before
            .replace(
              /[:\-–—]\s*$/,
              ''
            )
            .trim()

        after =
          after
            .replace(
              /^[:\-–—]\s*/,
              ''
            )
            .trim()

        let showTitle =
          before

        let episodeTitle =
          after

        if (
          !episodeTitle &&
          showTitle.includes(':')
        ) {
          const parts =
            showTitle.split(':')

          showTitle =
            parts.shift().trim()

          episodeTitle =
            parts.join(':').trim()
        }

        if (
          !episodeTitle &&
          showTitle.includes(' - ')
        ) {
          const parts =
            showTitle.split(' - ')

          showTitle =
            parts.shift().trim()

          episodeTitle =
            parts.join(' - ').trim()
        }

        return {
          showTitle,
          episodeTitle,
          episodeCode
        }
      }

      function hasTrailingDate(
        value
      ) {
        return /\((\d{1,2}\/\d{1,2}\/\d{4}|\d{4})\)\s*$/
          .test(
            value
          )
      }

      function processProgramme(
        block
      ) {
        programmesScanned++

        if (
          !programmeIsWithinThreeDays(
            block
          )
        ) {
          programmesSkipped++

          return ''
        }

        programmesKept++

        const originalTitle =
          getTag(
            block,
            'title'
          )

        const originalDescription =
          getTag(
            block,
            'desc'
          )

        const parsed =
          extractEpisodeFromTitle(
            originalTitle
          )

        let title =
          cleanTitle(
            parsed.showTitle
          )

        let description =
          cleanDescription(
            originalDescription
          )

        const episodeTitle =
          cleanSpaces(
            parsed.episodeTitle
          )

        const episodeCode =
          parsed.episodeCode

        if (
          title !==
          originalTitle
        ) {
          titlesCleaned++
        }

        if (
          description !==
          originalDescription
        ) {
          descriptionsChanged++
        }

        if (
          episodeTitle &&
          episodeCode
        ) {
          const prefix =
            `${episodeTitle} - ${episodeCode}`

          if (
            !description.startsWith(
              prefix
            )
          ) {
            description =
              description
                ? `${prefix}. ${description}`
                : prefix

            episodeNumbersConverted++
          }
        } else if (
          episodeTitle &&
          !description.startsWith(
            episodeTitle
          )
        ) {
          description =
            description
              ? `${episodeTitle}. ${description}`
              : episodeTitle

          episodeNumbersConverted++
        }

        if (
          !hasTrailingDate(
            description
          )
        ) {
          const displayDate =
            getDisplayDate(
              block
            )

          if (
            displayDate
          ) {
            description =
              description
                ? `${description} (${displayDate})`
                : `(${displayDate})`
          }
        }

        let output =
          block

        if (
          title !==
          originalTitle
        ) {
          output =
            replaceTag(
              output,
              'title',
              title
            )
        }

        if (
          description !==
          originalDescription
        ) {
          output =
            replaceTag(
              output,
              'desc',
              description
            )
        }

        if (
          /<actor\b/i.test(
            output
          )
        ) {
          actorsRemoved++

          output =
            removeTag(
              output,
              'actor'
            )
        }

        output =
          removeTag(
            output,
            'credits'
          )

        output =
          removeTag(
            output,
            'sub-title'
          )

        output =
          removeTag(
            output,
            'episode-num'
          )

        output =
          removeTag(
            output,
            'date'
          )

        return output
      }

      async function main() {
        const input =
          fs.createReadStream(
            inputPath,
            {
              encoding: 'utf8'
            }
          )

        const output =
          fs.createWriteStream(
            outputPath,
            {
              encoding: 'utf8'
            }
          )

        const rl =
          readline.createInterface(
            {
              input,
              crlfDelay: Infinity
            }
          )

        let inside =
          false

        let buffer =
          ''

        function write(
          value
        ) {
          return new Promise(
            (
              resolve,
              reject
            ) => {
              if (
                output.write(
                  value
                )
              ) {
                resolve()
              } else {
                output.once(
                  'drain',
                  resolve
                )

                output.once(
                  'error',
                  reject
                )
              }
            }
          )
        }

        for await (
          const line of rl
        ) {
          if (
            !inside
          ) {
            if (
              line.includes(
                '<programme '
              )
            ) {
              inside =
                true

              buffer =
                line + '\n'

              if (
                line.includes(
                  '</programme>'
                )
              ) {
                inside =
                  false

                const processed =
                  processProgramme(
                    buffer
                  )

                await write(
                  processed
                )

                buffer =
                  ''
              }
            } else {
              await write(
                line + '\n'
              )
            }
          } else {
            buffer +=
              line + '\n'

            if (
              line.includes(
                '</programme>'
              )
            ) {
              inside =
                false

              const processed =
                processProgramme(
                  buffer
                )

              await write(
                processed
              )

              buffer =
                ''
            }
          }
        }

        await new Promise(
          (
            resolve,
            reject
          ) => {
            output.once(
              'error',
              reject
            )

            output.end(
              resolve
            )
          }
        )

        console.log(
          'FAST processing complete'
        )

        console.log(
          `Programmes scanned: ${programmesScanned}`
        )

        console.log(
          `Programmes kept: ${programmesKept}`
        )

        console.log(
          `Programmes skipped: ${programmesSkipped}`
        )

        console.log(
          `Titles cleaned: ${titlesCleaned}`
        )

        console.log(
          `Descriptions changed: ${descriptionsChanged}`
        )

        console.log(
          `Actors removed: ${actorsRemoved}`
        )

        console.log(
          `Episode numbers converted: ${episodeNumbersConverted}`
        )

        console.log(
          `Output: ${outputPath}`
        )
      }

      main().catch(
        error => {
          console.error(error)
          process.exit(1)
        }
      )
      EOF

  - name: Validate processed FAST guide
    run: |
      CHANNELS=$(grep -c '<channel ' fast/processed.xml || true)
      PROGRAMMES=$(grep -c '<programme ' fast/processed.xml || true)

      echo "Processed FAST channels: $CHANNELS"
      echo "Processed FAST programmes: $PROGRAMMES"

      if [ "$CHANNELS" -lt 1 ]; then
        echo "Processed FAST guide contains no channels"
        exit 1
      fi

      if [ "$PROGRAMMES" -lt 1 ]; then
        echo "Processed FAST guide contains no programmes"
        exit 1
      fi

      test -s fast/processed.xml

  - name: Show processed FAST size
    run: |
      ls -lh fast/source.xml
      ls -lh fast/processed.xml

  - name: Compress FAST guide
    run: |
      gzip -c fast/processed.xml > fast/FAST.xml.gz

  - name: Validate compressed FAST guide
    run: |
      ls -lh fast/FAST.xml.gz

      SIZE=$(stat -c%s fast/FAST.xml.gz)

      echo "Compressed FAST size: $SIZE bytes"

      SIZE_MB=$((SIZE / 1024 / 1024))

      echo "Compressed FAST size in MB: $SIZE_MB MB"

      if [ "$SIZE" -le 0 ]; then
        echo "FAST guide is empty"
        exit 1
      fi

      echo "FAST guide size is valid for upload"

  - name: Commit FAST guide
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git fetch origin main
      git reset --hard origin/main

      git add fast/FAST.xml.gz

      if git diff --cached --quiet; then
        echo "No FAST guide changes to commit"
        exit 0
      fi

      git commit -m "Update FAST guide"

      for attempt in 1 2 3 4 5; do
        echo "Push attempt $attempt"

        git fetch origin main
        git reset --hard origin/main

        git add fast/FAST.xml.gz

        if git diff --cached --quiet; then
          echo "FAST guide already up to date"
          exit 0
        fi

        git commit -m "Update FAST guide" || true

        if git push origin HEAD:main; then
          echo "Push succeeded"
          exit 0
        fi

        echo "Push failed. Waiting before retry..."
        sleep 10
      done

      echo "Push failed after all retries"
      exit 1
```
