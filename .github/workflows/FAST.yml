name: FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

            - name: Download FAST source
        run: |
          mkdir -p fast

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7dayiptv/USFast.xml \
            -o fast/source.xml

          test -s fast/source.xml

          echo "FAST source downloaded successfully"

      - name: Process FAST guide
        run: |
          node <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath = 'fast/source.xml'
          const outputPath = 'fast/processed.xml'

          const now = new Date()

          const cutoff = new Date(
            now.getTime() +
            3 * 24 * 60 * 60 * 1000
          )

          let programmesScanned = 0
          let programmesKept = 0
          let programmesSkipped = 0
          let titlesCleaned = 0
          let descriptionsChanged = 0
          let actorsRemoved = 0
          let episodeNumbersConverted = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;')
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function getTag(block, tag) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b[^>]*>([\\s\\S]*?)</' +
              tag +
              '>',
              'i'
            )

            const match =
              block.match(regex)

            if (!match) {
              return ''
            }

            return decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          }

          function getStart(block) {
            const match =
              block.match(
                /<programme\b[^>]*\bstart="([^"]+)"/i
              )

            return match
              ? match[1]
              : ''
          }

          function parseXmltvDate(value) {
            const match =
              String(value || '').match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (!match) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(match[1]),
                Number(match[2]) - 1,
                Number(match[3]),
                Number(match[4]),
                Number(match[5]),
                Number(match[6])
              )
            )
          }

          function formatAirDate(start) {
            const match =
              String(start || '').match(
                /^(\d{4})(\d{2})(\d{2})/
              )

            if (!match) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function replaceTag(block, tag, value) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(value) +
              '</' +
              tag +
              '>'

            if (regex.test(block)) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(block, tag) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          function parseTitle(originalTitle) {
            let title =
              cleanSpaces(
                originalTitle
              )

            /*
             * Handles all of these types:
             *
             * Show S1 E2
             * Show S01E02
             * Show S01 E02
             * Show - S1E2
             * Show: S1E2 - Episode
             * Show (S1 E2)
             * Show [S1E2]
             * Show 1x02
             * Show - 1x02
             * Show Season 1 Episode 2
             * Show Season 01 Episode 02
             */

            let match =
              title.match(
                /\bS(?:EASON\s*)?(\d{1,3})\s*[-_. ]?\s*E(?:PISODE\s*)?(\d{1,3})\b/i
              )

            let format =
              'SEASON_EPISODE'

            if (!match) {
              match =
                title.match(
                  /\b(\d{1,3})\s*[xX]\s*(\d{1,3})\b/
                )

              format =
                'X_FORMAT'
            }

            if (!match) {
              match =
                title.match(
                  /\bSEASON\s*(\d{1,3})\s+EPISODE\s*(\d{1,3})\b/i
                )

              format =
                'SEASON_WORDS'
            }

            if (!match) {
              return {
                showTitle: title,
                episodeTitle: '',
                episodeCode: ''
              }
            }

            const season =
              Number(
                match[1]
              )

            const episode =
              Number(
                match[2]
              )

            const episodeCode =
              'S' +
              season +
              'E' +
              episode

            const before =
              title
                .slice(
                  0,
                  match.index
                )
                .trim()

            const after =
              title
                .slice(
                  match.index +
                  match[0].length
                )
                .trim()

            let showTitle =
              before

            let episodeTitle =
              after

            /*
             * Remove common separators
             * left behind by the episode code.
             */

            episodeTitle =
              episodeTitle
                .replace(
                  /^[-:|–—]+/,
                  ''
                )
                .trim()

            /*
             * If the title is:
             *
             * Show: Episode Name S1E2
             *
             * separate the show from
             * the episode title.
             */

            const separator =
              before.match(
                /^(.+?)\s*[:\-–—|]\s*(.+)$/
              )

            if (separator) {
              showTitle =
                separator[1].trim()

              if (!episodeTitle) {
                episodeTitle =
                  separator[2].trim()
              }
            }

            /*
             * Remove brackets that only
             * surrounded the episode code.
             */

            showTitle =
              showTitle
                .replace(
                  /[\[(]\s*$/,
                  ''
                )
                .trim()

            episodeTitle =
              episodeTitle
                .replace(
                  /^[\])}]+/,
                  ''
                )
                .trim()

            return {
              showTitle,
              episodeTitle,
              episodeCode
            }
          }

          function hasAirDate(description) {
            return /\(\d{1,2}\/\d{1,2}\/\d{4}\)\s*$/
              .test(
                description
              )
          }

          function processProgramme(block) {
            programmesScanned++

            const start =
              getStart(
                block
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              programmesSkipped++

              return ''
            }

            programmesKept++

            const originalTitle =
              getTag(
                block,
                'title'
              )

            const originalDescription =
              getTag(
                block,
                'desc'
              )

            const parsed =
              parseTitle(
                originalTitle
              )

            const newTitle =
              cleanSpaces(
                parsed.showTitle
              )

            let newDescription =
              cleanSpaces(
                originalDescription
              )

            if (
              parsed.episodeTitle &&
              parsed.episodeCode
            ) {
              const prefix =
                parsed.episodeTitle +
                ' - ' +
                parsed.episodeCode

              /*
               * Remove any existing
               * season/episode formatting
               * from the beginning of the
               * description before rebuilding it.
               */

              newDescription =
                newDescription.replace(
                  /^.*?\bS\d{1,3}\s*E\d{1,3}\b\.?\s*/i,
                  ''
                )

              newDescription =
                newDescription.replace(
                  /^.*?\bS\d{1,3}E\d{1,3}\b\.?\s*/i,
                  ''
                )

              newDescription =
                newDescription.replace(
                  /^.*?\b\d{1,3}x\d{1,3}\b\.?\s*/i,
                  ''
                )

              newDescription =
                newDescription
                  ? prefix +
                    '. ' +
                    newDescription
                  : prefix

              episodeNumbersConverted++
            }

            if (
              !hasAirDate(
                newDescription
              )
            ) {
              const airDate =
                formatAirDate(
                  start
                )

              if (airDate) {
                newDescription =
                  newDescription
                    ? newDescription +
                      ' (' +
                      airDate +
                      ')'
                    : '(' +
                      airDate +
                      ')'
              }
            }

            if (
              newTitle !==
              cleanSpaces(
                originalTitle
              )
            ) {
              titlesCleaned++
            }

            if (
              newDescription !==
              cleanSpaces(
                originalDescription
              )
            ) {
              descriptionsChanged++
            }

            let output =
              block

            output =
              replaceTag(
                output,
                'title',
                newTitle
              )

            output =
              replaceTag(
                output,
                'desc',
                newDescription
              )

            if (
              /<actor\b/i.test(
                output
              )
            ) {
              actorsRemoved++
            }

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            return output
          }

          async function main() {
            const input =
              fs.createReadStream(
                inputPath,
                {
                  encoding: 'utf8'
                }
              )

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding: 'utf8'
                }
              )

            const rl =
              readline.createInterface(
                {
                  input,
                  crlfDelay: Infinity
                }
              )

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            function write(value) {
              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  if (
                    output.write(
                      value
                    )
                  ) {
                    resolve()
                  } else {
                    output.once(
                      'drain',
                      resolve
                    )

                    output.once(
                      'error',
                      reject
                    )
                  }
                }
              )
            }

            for await (
              const line of rl
            ) {
              if (
                !insideProgramme
              ) {
                if (
                  line.includes(
                    '<programme '
                  )
                ) {
                  insideProgramme =
                    true

                  programmeBuffer =
                    line +
                    '\n'

                  if (
                    line.includes(
                      '</programme>'
                    )
                  ) {
                    insideProgramme =
                      false

                    const processed =
                      processProgramme(
                        programmeBuffer
                      )

                    if (
                      processed
                    ) {
                      await write(
                        processed
                      )
                    }

                    programmeBuffer =
                      ''
                  }
                } else {
                  await write(
                    line +
                    '\n'
                  )
                }
              } else {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  const processed =
                    processProgramme(
                      programmeBuffer
                    )

                  if (
                    processed
                  ) {
                    await write(
                      processed
                    )
                  }

                  programmeBuffer =
                    ''
                }
              }
            }

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.end(
                  resolve
                )
              }
            )

            console.log(
              'FAST processing complete'
            )

            console.log(
              'Programmes scanned: ' +
              programmesScanned
            )

            console.log(
              'Programmes kept: ' +
              programmesKept
            )

            console.log(
              'Programmes skipped: ' +
              programmesSkipped
            )

            console.log(
              'Titles cleaned: ' +
              titlesCleaned
            )

            console.log(
              'Descriptions changed: ' +
              descriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              actorsRemoved
            )

            console.log(
              'Episode numbers converted: ' +
              episodeNumbersConverted
            )

            console.log(
              'Output: ' +
              outputPath
            )
          }

          main().catch(
            error => {
              console.error(
                error
              )

              process.exit(
                1
              )
            }
          )
          EOF

      - name: Validate processed FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' fast/processed.xml || true)
          PROGRAMMES=$(grep -c '<programme ' fast/processed.xml || true)

          echo "Processed FAST channels: $CHANNELS"
          echo "Processed FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Processed FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Processed FAST guide contains no programmes"
            exit 1
          fi

          test -s fast/processed.xml

      - name: Compress FAST guide
        run: |
          gzip -c fast/processed.xml > fast/FAST.xml.gz

          test -s fast/FAST.xml.gz

          ls -lh fast/FAST.xml.gz

      - name: Commit and push FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git reset --hard origin/main

          git add fast/FAST.xml.gz

          if git diff --cached --quiet; then
            echo "No FAST guide changes to commit"
            exit 0
          fi

          git commit -m "Update FAST guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            git add fast/FAST.xml.gz

            if git diff --cached --quiet; then
              echo "FAST guide already up to date"
              exit 0
            fi

            git commit -m "Update FAST guide" || true

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
