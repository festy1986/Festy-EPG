name: FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download FAST source
        run: |
          mkdir -p fast

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7dayiptv/USFast.xml \
            -o fast/source.xml

          test -s fast/source.xml

          echo "FAST source downloaded successfully"

      - name: Process FAST guide
        run: |
          node <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath = 'fast/source.xml'
          const outputPath = 'fast/processed.xml'

          const now = new Date()

          const cutoff = new Date(
            now.getTime() +
            3 * 24 * 60 * 60 * 1000
          )

          let programmesScanned = 0
          let programmesKept = 0
          let programmesSkipped = 0
          let titlesCleaned = 0
          let descriptionsChanged = 0
          let actorsRemoved = 0
          let creditsRemoved = 0
          let subtitlesRemoved = 0
          let episodeNumbersConverted = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function getTag(block, tag) {
            const regex = new RegExp(
              '<' + tag + '\\b[^>]*>([\\s\\S]*?)</' + tag + '>',
              'i'
            )

            const match = block.match(regex)

            if (!match) {
              return ''
            }

            return decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          }

          function getStart(block) {
            const match = block.match(
              /<programme\b[^>]*\bstart="([^"]+)"/i
            )

            return match
              ? match[1]
              : ''
          }

          function parseXmltvDate(value) {
            const match = String(value || '').match(
              /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
            )

            if (!match) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(match[1]),
                Number(match[2]) - 1,
                Number(match[3]),
                Number(match[4]),
                Number(match[5]),
                Number(match[6])
              )
            )
          }

          function formatAirDate(start) {
            const match = String(start || '').match(
              /^(\d{4})(\d{2})(\d{2})/
            )

            if (!match) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function replaceTag(block, tag, value) {
            const regex = new RegExp(
              '<' + tag + '\\b[^>]*>[\\s\\S]*?</' + tag + '>',
              'i'
            )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(value) +
              '</' +
              tag +
              '>'

            if (regex.test(block)) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(block, tag) {
            const regex = new RegExp(
              '\\s*<' +
              tag +
              '\\b[^>]*>[\\s\\S]*?</' +
              tag +
              '>',
              'gi'
            )

            return block.replace(
              regex,
              ''
            )
          }

          /*
           * Extract season and episode numbers from many formats:
           *
           * S01E02
           * S 01 E 02
           * S01 E02
           * Season 1 Episode 2
           * Season 01, Episode 02
           * 1x02
           */

          function extractEpisodeInfo(title) {
            const patterns = [
              /\bS\s*(\d{1,3})\s*E\s*(\d{1,3})\b/i,

              /\bSEASON\s*(\d{1,3})\s*[,:\-]?\s*EPISODE\s*(\d{1,3})\b/i,

              /\b(\d{1,3})\s*x\s*(\d{1,3})\b/i
            ]

            for (
              const pattern of patterns
            ) {
              const match =
                title.match(pattern)

              if (
                match
              ) {
                return {
                  season:
                    Number(match[1]),

                  episode:
                    Number(match[2]),

                  index:
                    match.index,

                  length:
                    match[0].length
                }
              }
            }

            return null
          }

          function parseTitle(originalTitle) {
            let title =
              cleanSpaces(
                originalTitle
              )

            const episode =
              extractEpisodeInfo(
                title
              )

            if (
              !episode
            ) {
              return {
                showTitle:
                  title,

                episodeTitle:
                  '',

                episodeCode:
                  ''
              }
            }

            const episodeCode =
              'S' +
              episode.season +
              'E' +
              episode.episode

            const before =
              title
                .slice(
                  0,
                  episode.index
                )
                .trim()

            const after =
              title
                .slice(
                  episode.index +
                  episode.length
                )
                .trim()

            let showTitle =
              before

            let episodeTitle =
              after

            /*
             * Handles:
             *
             * Show Name: Episode Title S01E02
             * Show Name - Episode Title S01E02
             * Show Name S01E02: Episode Title
             */

            const separator =
              before.match(
                /^(.+?)\s*[:\-–—]\s*(.+)$/
              )

            if (
              separator
            ) {
              showTitle =
                separator[1].trim()

              if (
                !episodeTitle
              ) {
                episodeTitle =
                  separator[2].trim()
              }
            }

            /*
             * Remove any remaining season/episode
             * notation from the show title.
             */

            showTitle =
              showTitle
                .replace(
                  /\bS\s*\d{1,3}\s*E\s*\d{1,3}\b/gi,
                  ''
                )
                .replace(
                  /\bSEASON\s*\d{1,3}\s*[,:\-]?\s*EPISODE\s*\d{1,3}\b/gi,
                  ''
                )
                .replace(
                  /\b\d{1,3}\s*x\s*\d{1,3}\b/gi,
                  ''
                )

            showTitle =
              cleanSpaces(
                showTitle
              )

            return {
              showTitle,

              episodeTitle:
                cleanSpaces(
                  episodeTitle
                ),

              episodeCode
            }
          }

          function hasAirDate(description) {
            return /\(\d{1,2}\/\d{1,2}\/\d{4}\)\s*$/
              .test(
                description
              )
          }

          function processProgramme(block) {
            programmesScanned++

            const start =
              getStart(
                block
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              programmesSkipped++

              return ''
            }

            programmesKept++

            const originalTitle =
              getTag(
                block,
                'title'
              )

            const originalDescription =
              getTag(
                block,
                'desc'
              )

            const parsed =
              parseTitle(
                originalTitle
              )

            const newTitle =
              cleanSpaces(
                parsed.showTitle
              )

            let newDescription =
              cleanSpaces(
                originalDescription
              )

            if (
              parsed.episodeTitle &&
              parsed.episodeCode
            ) {
              const prefix =
                parsed.episodeTitle +
                ' - ' +
                parsed.episodeCode

              if (
                !newDescription.startsWith(
                  prefix
                )
              ) {
                newDescription =
                  newDescription
                    ? prefix +
                      '. ' +
                      newDescription
                    : prefix

                episodeNumbersConverted++
              }
            }

            if (
              !hasAirDate(
                newDescription
              )
            ) {
              const airDate =
                formatAirDate(
                  start
                )

              if (
                airDate
              ) {
                newDescription =
                  newDescription
                    ? newDescription +
                      ' (' +
                      airDate +
                      ')'
                    : '(' +
                      airDate +
                      ')'
              }
            }

            if (
              newTitle !==
              cleanSpaces(
                originalTitle
              )
            ) {
              titlesCleaned++
            }

            if (
              newDescription !==
              cleanSpaces(
                originalDescription
              )
            ) {
              descriptionsChanged++
            }

            let output =
              block

            output =
              replaceTag(
                output,
                'title',
                newTitle
              )

            output =
              replaceTag(
                output,
                'desc',
                newDescription
              )

            if (
              /<actor\b/i.test(
                output
              )
            ) {
              actorsRemoved++
            }

            if (
              /<credits\b/i.test(
                output
              )
            ) {
              creditsRemoved++
            }

            if (
              /<sub-title\b/i.test(
                output
              )
            ) {
              subtitlesRemoved++
            }

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            return output
          }

          async function main() {
            const input =
              fs.createReadStream(
                inputPath,
                {
                  encoding:
                    'utf8'
                }
              )

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding:
                    'utf8'
                }
              )

            const rl =
              readline.createInterface(
                {
                  input,

                  crlfDelay:
                    Infinity
                }
              )

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            function write(value) {
              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  if (
                    output.write(
                      value
                    )
                  ) {
                    resolve()
                  } else {
                    output.once(
                      'drain',
                      resolve
                    )

                    output.once(
                      'error',
                      reject
                    )
                  }
                }
              )
            }

            for await (
              const line of rl
            ) {
              if (
                !insideProgramme
              ) {
                if (
                  line.includes(
                    '<programme '
                  )
                ) {
                  insideProgramme =
                    true

                  programmeBuffer =
                    line +
                    '\n'

                  if (
                    line.includes(
                      '</programme>'
                    )
                  ) {
                    insideProgramme =
                      false

                    const processed =
                      processProgramme(
                        programmeBuffer
                      )

                    if (
                      processed
                    ) {
                      await write(
                        processed
                      )
                    }

                    programmeBuffer =
                      ''
                  }
                } else {
                  await write(
                    line +
                    '\n'
                  )
                }
              } else {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  const processed =
                    processProgramme(
                      programmeBuffer
                    )

                    if (
                      processed
                    ) {
                      await write(
                        processed
                      )
                    }

                    programmeBuffer =
                      ''
                }
              }
            }

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.end(
                  resolve
                )
              }
            )

            console.log(
              'FAST processing complete'
            )

            console.log(
              'Programmes scanned: ' +
              programmesScanned
            )

            console.log(
              'Programmes kept: ' +
              programmesKept
            )

            console.log(
              'Programmes skipped: ' +
              programmesSkipped
            )

            console.log(
              'Titles cleaned: ' +
              titlesCleaned
            )

            console.log(
              'Descriptions changed: ' +
              descriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              actorsRemoved
            )

            console.log(
              'Credits removed: ' +
              creditsRemoved
            )

            console.log(
              'Subtitles removed: ' +
              subtitlesRemoved
            )

            console.log(
              'Episode numbers converted: ' +
              episodeNumbersConverted
            )

            console.log(
              'Output: ' +
              outputPath
            )
          }

          main().catch(
            error => {
              console.error(
                error
              )

              process.exit(
                1
              )
            }
          )
          EOF
                - name: Validate processed FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' fast/processed.xml || true)
          PROGRAMMES=$(grep -c '<programme ' fast/processed.xml || true)

          echo "Processed FAST channels: $CHANNELS"
          echo "Processed FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Processed FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Processed FAST guide contains no programmes"
            exit 1
          fi

          test -s fast/processed.xml

      - name: Compress FAST guide
        run: |
          gzip -c fast/processed.xml > fast/FAST.xml.gz

          test -s fast/FAST.xml.gz

          ls -lh fast/FAST.xml.gz

      - name: Commit and push FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main

          git reset --hard origin/main

          git add fast/FAST.xml.gz

          if git diff --cached --quiet; then
            echo "No FAST guide changes to commit"
            exit 0
          fi

          git commit -m "Update FAST guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main

            git reset --hard origin/main

            git add fast/FAST.xml.gz

            if git diff --cached --quiet; then
              echo "FAST guide already up to date"
              exit 0
            fi

            git commit -m "Update FAST guide" || true

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
