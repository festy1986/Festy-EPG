name: FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: write

concurrency:
  group: epg-fast
  cancel-in-progress: false

jobs:
  build-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Jessman FAST source
        run: |
          mkdir -p guides

          curl -L --fail --retry 5 --retry-delay 10 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o guides/festyfast.xml

          test -s guides/festyfast.xml

          echo "Jessman FAST source downloaded successfully"
          ls -lh guides/festyfast.xml

      - name: Process Jessman source into FAST guide
        run: |
          cat > /tmp/process_fast.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')

          const inputPath = 'guides/festyfast.xml'
          const outputPath = 'guides/FAST.xml'

          const now = new Date()

          const cutoff = new Date(
            now.getTime() +
            3 * 24 * 60 * 60 * 1000
          )

          let programmesScanned = 0
          let programmesKept = 0
          let programmesSkipped = 0
          let titlesCleaned = 0
          let descriptionsChanged = 0
          let actorsRemoved = 0
          let episodeNumbersUsed = 0
          let originalAirDatesUsed = 0

          function decodeXml(value) {
            return String(value || '')
              .replace(/&amp;/g, '&')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
          }

          function escapeXml(value) {
            return String(value || '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
          }

          function cleanSpaces(value) {
            return String(value || '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function getTag(block, tag) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b[^>]*>([\\s\\S]*?)</' +
              tag +
              '>',
              'i'
            )

            const match = block.match(regex)

            if (!match) {
              return ''
            }

            return decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          }

          function getTagBySystem(block, tag, system) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b[^>]*\\bsystem="' +
              system +
              '"[^>]*>([\\s\\S]*?)</' +
              tag +
              '>',
              'i'
            )

            const match = block.match(regex)

            if (!match) {
              return ''
            }

            return decodeXml(
              match[1]
                .replace(/<[^>]+>/g, '')
                .trim()
            )
          }

          function getStart(block) {
            const match = block.match(
              /<programme\b[^>]*\bstart="([^"]+)"/i
            )

            return match
              ? match[1]
              : ''
          }

          function parseXmltvDate(value) {
            const match = String(value || '').match(
              /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
            )

            if (!match) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(match[1]),
                Number(match[2]) - 1,
                Number(match[3]),
                Number(match[4]),
                Number(match[5]),
                Number(match[6])
              )
            )
          }

          function parseOriginalAirDate(value) {
            const match = String(value || '').match(
              /^(\d{4})-(\d{2})-(\d{2})/
            )

            if (!match) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function replaceTag(block, tag, value) {
            const regex = new RegExp(
              '<' +
              tag +
              '\\b[^>]*>[\\s\\S]*?</' +
              tag +
              '>',
              'i'
            )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(value) +
              '</' +
              tag +
              '>'

            if (regex.test(block)) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(block, tag) {
            const regex = new RegExp(
              '\\s*<' +
              tag +
              '\\b[^>]*>[\\s\\S]*?</' +
              tag +
              '>',
              'gi'
            )

            return block.replace(
              regex,
              ''
            )
          }

          function getEpisodeNumber(block) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (!episodeNumber) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            const match =
              episodeNumber.match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (!match) {
              return ''
            }

            return (
              'S' +
              Number(match[1]) +
              'E' +
              Number(match[2])
            )
          }

          function processProgramme(block) {
            programmesScanned++

            const start =
              getStart(
                block
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < now ||
              startDate >= cutoff
            ) {
              programmesSkipped++

              return ''
            }

            programmesKept++

            const originalTitle =
              cleanSpaces(
                getTag(
                  block,
                  'title'
                )
              )

            const episodeTitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const episodeNumber =
              getEpisodeNumber(
                block
              )

            const originalAirDate =
              parseOriginalAirDate(
                getTagBySystem(
                  block,
                  'episode-num',
                  'original-air-date'
                )
              )

            let newTitle =
              originalTitle

            let newDescription =
              originalDescription

            if (
              episodeTitle &&
              episodeNumber
            ) {
              newDescription =
                episodeTitle +
                ' - ' +
                episodeNumber +
                (
                  originalDescription
                    ? '. ' +
                      originalDescription
                    : ''
                )

              episodeNumbersUsed++
            }

            if (
              originalAirDate
            ) {
              newDescription =
                newDescription
                  ? newDescription +
                    ' (' +
                    originalAirDate +
                    ')'
                  : '(' +
                    originalAirDate +
                    ')'

              originalAirDatesUsed++
            }

            if (
              newTitle !==
              originalTitle
            ) {
              titlesCleaned++
            }

            if (
              newDescription !==
              originalDescription
            ) {
              descriptionsChanged++
            }

            let output =
              block

            output =
              replaceTag(
                output,
                'title',
                newTitle
              )

            output =
              replaceTag(
                output,
                'desc',
                newDescription
              )

            if (
              /<actor\b/i.test(
                output
              )
            ) {
              actorsRemoved++
            }

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeTag(
                output,
                'episode-num'
              )

            output =
              removeTag(
                output,
                'date'
              )

            return output
          }

          async function main() {
            const input =
              fs.createReadStream(
                inputPath,
                {
                  encoding: 'utf8'
                }
              )

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding: 'utf8'
                }
              )

            const rl =
              readline.createInterface(
                {
                  input,
                  crlfDelay: Infinity
                }
              )

            let insideProgramme =
              false

            let programmeBuffer =
              ''

            function write(value) {
              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  if (
                    output.write(
                      value
                    )
                  ) {
                    resolve()
                  } else {
                    output.once(
                      'drain',
                      resolve
                    )

                    output.once(
                      'error',
                      reject
                    )
                  }
                }
              )
            }

            for await (
              const line of rl
            ) {
              if (
                !insideProgramme
              ) {
                if (
                  line.includes(
                    '<programme '
                  )
                ) {
                  insideProgramme =
                    true

                  programmeBuffer =
                    line +
                    '\n'

                  if (
                    line.includes(
                      '</programme>'
                    )
                  ) {
                    insideProgramme =
                      false

                    const processed =
                      processProgramme(
                        programmeBuffer
                      )

                    if (
                      processed
                    ) {
                      await write(
                        processed
                      )
                    }

                    programmeBuffer =
                      ''
                  }
                } else {
                  await write(
                    line +
                    '\n'
                  )
                }
              } else {
                programmeBuffer +=
                  line +
                  '\n'

                if (
                  line.includes(
                    '</programme>'
                  )
                ) {
                  insideProgramme =
                    false

                  const processed =
                    processProgramme(
                      programmeBuffer
                    )

                  if (
                    processed
                  ) {
                    await write(
                      processed
                    )
                  }

                  programmeBuffer =
                    ''
                }
              }
            }

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.end(
                  resolve
                )
              }
            )

            console.log(
              'FAST processing complete'
            )

            console.log(
              'Programmes scanned: ' +
              programmesScanned
            )

            console.log(
              'Programmes kept: ' +
              programmesKept
            )

            console.log(
              'Programmes skipped: ' +
              programmesSkipped
            )

            console.log(
              'Titles cleaned: ' +
              titlesCleaned
            )

            console.log(
              'Descriptions changed: ' +
              descriptionsChanged
            )

            console.log(
              'Actors removed: ' +
              actorsRemoved
            )

            console.log(
              'Episode numbers used: ' +
              episodeNumbersUsed
            )

            console.log(
              'Original air dates used: ' +
              originalAirDatesUsed
            )

            console.log(
              'Output: ' +
              outputPath
            )
          }

          main().catch(
            error => {
              console.error(
                error
              )

              process.exit(
                1
              )
            }
          )
          EOF

          node /tmp/process_fast.js

      - name: Validate processed FAST guide
        run: |
          CHANNELS=$(grep -c '<channel ' guides/FAST.xml || true)
          PROGRAMMES=$(grep -c '<programme ' guides/FAST.xml || true)

          echo "Processed FAST channels: $CHANNELS"
          echo "Processed FAST programmes: $PROGRAMMES"

          if [ "$CHANNELS" -lt 1 ]; then
            echo "Processed FAST guide contains no channels"
            exit 1
          fi

          if [ "$PROGRAMMES" -lt 1 ]; then
            echo "Processed FAST guide contains no programmes"
            exit 1
          fi

          test -s guides/FAST.xml
          test -s guides/festyfast.xml

      - name: Compress FAST guide
        run: |
          gzip -c guides/FAST.xml > guides/FAST.xml.gz

          test -s guides/FAST.xml.gz

          ls -lh guides/festyfast.xml
          ls -lh guides/FAST.xml
          ls -lh guides/FAST.xml.gz

      - name: Commit and push FAST guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add guides/festyfast.xml
          git add guides/FAST.xml.gz

          if git diff --cached --quiet; then
            echo "No FAST guide changes to commit"
            exit 0
          fi

          git commit -m "Update FAST guide"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Synchronizing with remote before retry..."

            git fetch origin main

            git rebase origin/main

            echo "Waiting before retry..."

            sleep 10
          done

          echo "Push failed after all retries"

          exit 1
