name: Get Matched Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-matched-channels:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          echo "Provider credentials loaded"

          if [ -z "$XTREAM_URL" ]; then

            echo "XTREAM_URL missing"

            exit 1

          fi

          if [ -z "$XTREAM_USERNAME" ]; then

            echo "XTREAM_USERNAME missing"

            exit 1

          fi

          if [ -z "$XTREAM_PASSWORD" ]; then

            echo "XTREAM_PASSWORD missing"

            exit 1

          fi

          echo "XTREAM_URL exists"

          echo "XTREAM_USERNAME exists"

          echo "XTREAM_PASSWORD exists"

      - name: Install Python requirements
        run: |

          python -m pip install requests

      - name: Retrieve all channels from selected groups
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

        run: |

          python - <<'PY'

          import os
          import re
          import time
          import requests


          FILE = "matcheverychannel.txt"


          XTREAM_URL = os.environ["XTREAM_URL"].rstrip("/")

          USERNAME = os.environ["XTREAM_USERNAME"]

          PASSWORD = os.environ["XTREAM_PASSWORD"]


          # ---------------------------------
          # Normalize Xtream URL
          # ---------------------------------

          if XTREAM_URL.startswith("https://"):

              XTREAM_URL = XTREAM_URL.replace(
                  "https://",
                  "http://"
              )


          if ":80" not in XTREAM_URL and ":443" not in XTREAM_URL:

              XTREAM_URL += ":80"


          # ---------------------------------
          # Read selected groups
          # ---------------------------------

          selected_category_ids = set()


          with open(

              FILE,

              "r",

              encoding="utf-8"

          ) as file:


              for line in file:


                  line = line.strip()


                  if not line:

                      continue


                  # Existing group lines look like:
                  #
                  # [188] 24/7 HD
                  #
                  # or:
                  #
                  # 188 | 188 |  | ###### 24/7 HD ######


                  match = re.match(

                      r"^\[(\d+)\]",

                      line

                  )


                  if match:


                      selected_category_ids.add(

                          match.group(1)

                      )


                      continue


                  match = re.match(

                      r"^(\d+)\s*\|\s*\1\s*\|\s*\|\s*######",

                      line

                  )


                  if match:


                      selected_category_ids.add(

                          match.group(1)

                      )


          if not selected_category_ids:

              raise SystemExit(

                  "No selected category IDs found in "

                  "matcheverychannel.txt"

              )


          print("")

          print(

              "Selected category IDs:"

          )


          for category_id in sorted(

              selected_category_ids,

              key=lambda x: int(x)

          ):


              print(category_id)


          print("")

          print(

              f"Selected groups: "

              f"{len(selected_category_ids)}"

          )


          # ---------------------------------
          # Create session
          # ---------------------------------

          session = requests.Session()


          session.headers.update(

              {

                  "User-Agent": "Mozilla/5.0"

              }

          )


          # ---------------------------------
          # Download categories
          # ---------------------------------

          categories_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_categories"

          )


          categories = None


          for attempt in range(1, 6):


              try:


                  print(

                      f"Downloading provider groups "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      categories_url,

                      timeout=(30, 300)

                  )


                  response.raise_for_status()


                  categories = response.json()


                  break


              except Exception as e:


                  print(e)


                  time.sleep(10)


          if categories is None:

              raise SystemExit(

                  "Provider groups download failed"

              )


          category_lookup = {}


          for category in categories:


              category_id = str(

                  category.get(

                      "category_id",

                      ""

                  )

              ).strip()


              if category_id in selected_category_ids:


                  category_lookup[category_id] = category


          print("")

          print(

              f"Selected groups found: "

              f"{len(category_lookup)}"

          )


          # ---------------------------------
          # Download all provider channels
          # ---------------------------------

          streams_url = (

              f"{XTREAM_URL}/player_api.php"

              f"?username={USERNAME}"

              f"&password={PASSWORD}"

              f"&action=get_live_streams"

          )


          streams = None


          for attempt in range(1, 6):


              try:


                  print(

                      f"Downloading provider channels "

                      f"(attempt {attempt}/5)..."

                  )


                  response = session.get(

                      streams_url,

                      timeout=(30, 300)

                  )


                  response.raise_for_status()


                  streams = response.json()


                  break


              except Exception as e:


                  print(e)


                  time.sleep(10)


          if streams is None:

              raise SystemExit(

                  "Provider channels download failed"

              )


          if not isinstance(streams, list):

              print(

                  "Unexpected provider response:"

              )


              print(streams)


              raise SystemExit(1)


          print("")

          print(

              f"Provider channels downloaded: "

              f"{len(streams)}"

          )


          # ---------------------------------
          # Match channels to selected groups
          # ---------------------------------

          matched = {}


          for stream in streams:


              category_id = str(

                  stream.get(

                      "category_id",

                      ""

                  )

              ).strip()


              if category_id not in selected_category_ids:

                  continue


              if category_id not in matched:

                  matched[category_id] = []


              matched[category_id].append(

                  stream

              )


          # ---------------------------------
          # Write same file in pipe format
          # ---------------------------------

          total_channels = 0


          with open(

              FILE,

              "w",

              encoding="utf-8"

          ) as file:


              for category_id in sorted(

                  selected_category_ids,

                  key=lambda x: (

                      category_lookup.get(

                          x,

                          {}

                      ).get(

                          "category_name",

                          ""

                      ).upper(),

                      x

                  )

              ):


                  category = category_lookup.get(

                      category_id,

                      {}

                  )


                  category_name = category.get(

                      "category_name",

                      "UNKNOWN GROUP"

                  )


                  channels = matched.get(

                      category_id,

                      []

                  )


                  channels.sort(

                      key=lambda stream: (

                          str(

                              stream.get(

                                  "name",

                                  ""

                              )

                          ).upper(),

                          str(

                              stream.get(

                                  "stream_id",

                                  ""

                              )

                          )

                      )

                  )


                  # Group header

                  file.write(

                      f"{category_id} | "

                      f"{category_id} |  | "

                      f"###### "

                      f"{category_name}"

                      f" ######\n"

                  )


                  # Channels

                  for stream in channels:


                      stream_id = str(

                          stream.get(

                              "stream_id",

                              ""

                          )

                      ).strip()


                      channel_name = str(

                          stream.get(

                              "name",

                              ""

                          )

                      ).strip()


                      if not stream_id:

                          continue


                      file.write(

                          f"{stream_id} | "

                          f"{category_id} |  | "

                          f"{channel_name}\n"

                      )


                      total_channels += 1


                  file.write("\n")


          print("")

          print(

              f"Matched channels: "

              f"{total_channels}"

          )


          print("")

          print(

              "Updated: "

              f"{FILE}"

          )

          PY

      - name: Commit and push channel list
        run: |

          git config --global user.name "github-actions"

          git config --global user.email "github-actions@github.com"

          git add matcheverychannel.txt

          git commit -m "Update matched provider channels" || echo "No changes"

          git push
