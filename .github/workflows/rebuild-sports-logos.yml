name: Rebuild Sports Logo Library

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-sports-logos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow cairosvg

      - name: Rebuild sports logos
        run: |
          python config/rebuild_sports_logos.py

      - name: Commit updated logos
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add sports-logos/

          if git diff --cached --quiet; then
            echo "No logo changes detected"
            exit 0
          fi

          git commit -m "Update sports logos"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, fetching latest main and rebasing..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

          echo "Push failed after retries"
          exit 1
