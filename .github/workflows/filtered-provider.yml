name: Build Filtered Provider

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: filtered-provider
  cancel-in-progress: false

jobs:
  build-filtered-provider:
    name: Build Filtered Provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify Xtream credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Xtream credentials verified."

      - name: Build filtered provider categories
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/provider/build_filtered_provider.py

      - name: Commit updated provider files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filtered-provider/

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Update filtered provider categories"

      - name: Push changes
        run: |
          for attempt in 1 2 3
          do
            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin HEAD:main
            then
              echo "Push successful."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed."
          exit 1

      - name: Upload filtered provider artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filtered-provider
          path: |
            filtered-provider/
