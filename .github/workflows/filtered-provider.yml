name: Build Filtered Provider

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  test-xtream-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Credentials found."

      - name: Test Xtream API
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |

          BASE_URL="${XTREAM_URL%/}"

          echo "Testing Xtream API..."
          echo

          curl \
            --silent \
            --show-error \
            --location \
            --get \
            --data-urlencode "username=$XTREAM_USERNAME" \
            --data-urlencode "password=$XTREAM_PASSWORD" \
            --data-urlencode "action=get_live_categories" \
            "$BASE_URL/player_api.php" \
            -o live_categories.json

          echo "Downloaded bytes:"
          wc -c live_categories.json

          echo
          echo "First 1000 characters:"
          head -c 1000 live_categories.json
          echo

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: xtream-api-test
          path: live_categories.json
