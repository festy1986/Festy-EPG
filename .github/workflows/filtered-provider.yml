name: Build Filtered Provider

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-filtered-provider
  cancel-in-progress: false

jobs:
  build-filtered-provider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          test -n "$XTREAM_URL"
          test -n "$XTREAM_USERNAME"
          test -n "$XTREAM_PASSWORD"

          echo "Provider credentials found."

      - name: Build filtered provider
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/provider/build_filtered_provider.py

      - name: Verify filtered output
        run: |
          test -f filtered-provider/categories/live-categories.json
          test -f filtered-provider/categories/vod-categories.json
          test -f filtered-provider/categories/series-categories.json

          test -f filtered-provider/streams/live-streams.json.gz
          test -f filtered-provider/streams/vod-streams.json.gz
          test -f filtered-provider/streams/series.json.gz

          test -f filtered-provider/category-summary.json
          test -f filtered-provider/stream-summary.json

          echo "All filtered provider files were created."

          ls -lh filtered-provider/categories/
          ls -lh filtered-provider/streams/
          ls -lh filtered-provider/reports/

      - name: Commit filtered provider files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A filtered-provider/

          if git diff --cached --quiet; then
            echo "No filtered provider changes to commit."
            exit 0
          fi

          git commit -m "Update filtered provider data"

      - name: Push filtered provider files
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No commit available to push."
            exit 0
          fi

          if ! git log -1 --pretty=%B | grep -q "Update filtered provider data"; then
            echo "No new filtered provider commit was created."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            if git push origin HEAD:main; then
              echo "Filtered provider files pushed successfully."
              exit 0
            fi

            echo "Push failed. Rebasing onto the latest main branch..."

            git fetch origin main
            git rebase origin/main

            sleep $((attempt * 5))
          done

          echo "Unable to push after 5 attempts."
          exit 1

      - name: Upload filtered provider backup
        uses: actions/upload-artifact@v4
        with:
          name: filtered-provider
          path: filtered-provider/
          retention-days: 7
          compression-level: 0
