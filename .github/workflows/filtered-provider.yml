name: Build Filtered Provider

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build-filtered-provider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build filtered provider files
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/provider/build_filtered_provider.py

      - name: Commit filtered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filtered-provider/

          if git diff --cached --quiet; then
            echo "No filtered provider changes"
            exit 0
          fi

          git commit -m "Update filtered provider"
          git pull --rebase origin main
          git push origin HEAD:main
