name: Build Filtered Provider

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: filtered-provider
  cancel-in-progress: false

jobs:
  build-filtered-provider:
    name: Build Filtered Provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify provider credentials
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          test -n "$XTREAM_URL" || {
            echo "XTREAM_URL secret is missing"
            exit 1
          }

          test -n "$XTREAM_USERNAME" || {
            echo "XTREAM_USERNAME secret is missing"
            exit 1
          }

          test -n "$XTREAM_PASSWORD" || {
            echo "XTREAM_PASSWORD secret is missing"
            exit 1
          }

          echo "Provider credentials found"

      - name: Build filtered provider playlist
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python config/provider/build_filtered_provider.py

      - name: Commit filtered provider playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filtered-provider/filtered-provider.m3u

          if git diff --cached --quiet; then
            echo "No filtered provider changes to commit"
            exit 0
          fi

          git commit -m "Update filtered provider playlist"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Filtered provider playlist pushed successfully"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Failed to push after 3 attempts"
          exit 1
