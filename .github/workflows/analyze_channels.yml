name: Analyze Xtream Channels

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Analyze channels.json
        run: |
          python3 <<'PY'
          import json
          from collections import defaultdict

          FILE = "xtream-epg/channels.json"

          with open(FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          categories = defaultdict(list)

          for ch in data:
              category = str(ch.get("category_id", "unknown"))
              name = ch.get("name", "")
              stream_id = ch.get("stream_id", "")

              categories[category].append({
                  "id": stream_id,
                  "name": name
              })

          print("\nCATEGORY SUMMARY")
          print("=" * 50)

          for cat, items in sorted(categories.items(), key=lambda x: len(x[1]), reverse=True):
              print(f"Category {cat}: {len(items)} channels")

          print("\nSAMPLES")
          print("=" * 50)

          for cat, items in sorted(categories.items(), key=lambda x: len(x[1]), reverse=True)[:20]:
              print(f"\n--- CATEGORY {cat} ({len(items)}) ---")
              for item in items[:10]:
                  print(f"{item['id']} | {item['name']}")
          PY
