name: Analyze Xtream Channels

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Xtream files
        run: |
          echo "Xtream directory:"
          ls -lh xtream-epg

      - name: Inspect channels.json
        run: |
          python3 <<'PY'
          import json

          INPUT = "xtream-epg/channels.json"

          with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:
              data = json.load(f)

          print()
          print("TOTAL CHANNELS:")
          print(len(data))

          print()
          print("FIRST CHANNEL KEYS:")
          print("===================")

          for key in data[0].keys():
              print(key)

          print()
          print("FIRST CHANNEL DATA:")
          print("===================")

          print(json.dumps(data[0], indent=2)[:5000])

          print()
          print("SECOND CHANNEL DATA:")
          print("====================")

          print(json.dumps(data[1], indent=2)[:3000])

          PY
