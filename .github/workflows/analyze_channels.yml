name: Analyze Xtream Channels

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Xtream files
        run: |
          echo "Checking Xtream directory..."
          ls -lh xtream-epg

      - name: Analyze channels.json
        run: |
          python3 <<'PY'
          import json
          from collections import defaultdict
          import os

          INPUT = "xtream-epg/channels.json"
          OUTPUT = "xtream-epg/channel-analysis.txt"

          if not os.path.exists(INPUT):
              raise FileNotFoundError(INPUT)

          with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:
              data = json.load(f)

          print(f"Loaded {len(data)} channels")

          categories = defaultdict(list)

          for ch in data:

              category_id = str(
                  ch.get("category_id")
                  or ch.get("category")
                  or ch.get("group_id")
                  or "UNKNOWN"
              )

              category_name = (
                  ch.get("category_name")
                  or ch.get("group_title")
                  or ch.get("category_name")
                  or "UNKNOWN"
              )

              name = (
                  ch.get("name")
                  or ch.get("channel_name")
                  or ch.get("title")
                  or "UNKNOWN"
              )

              channel_id = (
                  ch.get("stream_id")
                  or ch.get("id")
                  or ch.get("channel_id")
                  or ""
              )

              categories[category_id].append({
                  "category_name": category_name,
                  "id": channel_id,
                  "name": name
              })


          with open(OUTPUT, "w", encoding="utf-8") as out:

              out.write("XTREAM CHANNEL ANALYSIS\n")
              out.write("=======================\n\n")

              for cat, items in sorted(
                  categories.items(),
                  key=lambda x: len(x[1]),
                  reverse=True
              ):

                  category_name = items[0]["category_name"]

                  out.write(
                      f"CATEGORY ID: {cat}\n"
                  )
                  out.write(
                      f"CATEGORY NAME: {category_name}\n"
                  )
                  out.write(
                      f"CHANNEL COUNT: {len(items)}\n"
                  )
                  out.write("-" * 60 + "\n")

                  for item in items[:50]:
                      out.write(
                          f"{item['id']} | {item['name']}\n"
                      )

                  out.write("\n\n")


          print("\nCATEGORY SUMMARY")
          print("================")

          for cat, items in sorted(
              categories.items(),
              key=lambda x: len(x[1]),
              reverse=True
          ):

              print(
                  f"{cat} | {items[0]['category_name']} | {len(items)} channels"
              )


          print(f"\nCreated {OUTPUT}")

          PY

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: channel-analysis
          path: xtream-epg/channel-analysis.txt
