name: Analyze Xtream Channel Map

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Analyze channel-map.txt
        run: |
          python3 <<'PY'

          from collections import defaultdict

          INPUT = "xtream-epg/channel-map.txt"
          OUTPUT = "xtream-epg/category-analysis.txt"


          categories = defaultdict(list)


          with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:

              for line in f:

                  line=line.strip()

                  if not line:
                      continue

                  parts=[x.strip() for x in line.split("|")]


                  if len(parts) < 3:
                      continue


                  stream_id = parts[0]
                  category_id = parts[1]
                  name = parts[-1]


                  categories[category_id].append({
                      "id": stream_id,
                      "name": name
                  })


          print("Categories found:",len(categories))


          with open(OUTPUT,"w",encoding="utf-8") as out:

              out.write("XTREAM CATEGORY ANALYSIS\n")
              out.write("========================\n\n")


              for cat,items in sorted(
                  categories.items(),
                  key=lambda x:len(x[1]),
                  reverse=True
              ):

                  out.write(
                      f"CATEGORY {cat} - {len(items)} CHANNELS\n"
                  )

                  out.write("-"*60+"\n")


                  for item in items[:30]:

                      out.write(
                          f"{item['id']} | {item['name']}\n"
                      )

                  out.write("\n\n")


          print("\nCATEGORY SUMMARY")
          print("================")

          for cat,items in sorted(
              categories.items(),
              key=lambda x:len(x[1]),
              reverse=True
          ):

              print(
                  cat,
                  "|",
                  len(items),
                  "channels"
              )

          print("\nCreated:",OUTPUT)

          PY


      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: category-analysis
          path: xtream-epg/category-analysis.txt
