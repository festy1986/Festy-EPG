name: Analyze Xtream Channel Map

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze channel-map
        run: |
          python3 <<'PY'

          from collections import defaultdict

          INPUT = "xtream-epg/channel-map.txt"
          OUTPUT = "xtream-epg/channel-map-analysis.txt"

          categories = defaultdict(list)

          with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:
              for line in f:

                  line = line.strip()

                  if not line:
                      continue

                  parts = line.split("|")

                  if len(parts) < 4:
                      continue

                  stream_id = parts[0].strip()
                  category = parts[1].strip()
                  name = parts[-1].strip()

                  categories[category].append(
                      {
                          "id": stream_id,
                          "name": name
                      }
                  )


          with open(OUTPUT, "w", encoding="utf-8") as out:

              out.write("XTREAM CHANNEL MAP ANALYSIS\n")
              out.write("===========================\n\n")

              for cat, channels in sorted(
                  categories.items(),
                  key=lambda x: len(x[1]),
                  reverse=True
              ):

                  out.write(
                      f"CATEGORY {cat}\n"
                      f"CHANNEL COUNT: {len(channels)}\n"
                  )

                  out.write("-"*60 + "\n")

                  for ch in channels[:100]:
                      out.write(
                          f"{ch['id']} | {ch['name']}\n"
                      )

                  out.write("\n\n")


          print("Categories:", len(categories))

          print("\nSUMMARY")
          print("=======")

          for cat, channels in sorted(
              categories.items(),
              key=lambda x: len(x[1]),
              reverse=True
          ):
              print(
                  cat,
                  "|",
                  len(channels),
                  "channels"
              )


          print("\nCreated:", OUTPUT)

          PY


      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: channel-map-analysis
          path: xtream-epg/channel-map-analysis.txt
