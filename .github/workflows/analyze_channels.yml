name: Analyze Xtream Categories

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze Xtream Categories
        run: |
          python3 <<'PY'

          import json
          import re
          from collections import defaultdict

          INPUT = "xtream-epg/channels.json"
          OUTPUT = "xtream-epg/category-analysis.txt"

          with open(INPUT, "r", encoding="utf-8") as f:
              channels = json.load(f)


          categories = defaultdict(list)


          for ch in channels:

              cat = str(ch.get("category_id","UNKNOWN"))

              name = ch.get("name","UNKNOWN")

              categories[cat].append(name)



          def classify(names):

              text = " ".join(names[:50]).lower()

              if any(x in text for x in ["ppv","pay per view","event"]):
                  return "PPV / EVENTS"

              if any(x in text for x in ["radio","music","hits","jazz"]):
                  return "MUSIC / RADIO"

              if any(x in text for x in ["24/7","247"]):
                  return "24/7 CHANNELS"

              if any(x in text for x in ["movie","cinema","film"]):
                  return "MOVIES"

              if any(x in text for x in ["espn","nba","nfl","sports","tsn","dazn"]):
                  return "SPORTS"

              return "UNKNOWN"



          with open(OUTPUT,"w",encoding="utf-8") as out:

              out.write("XTREAM CATEGORY ANALYSIS\n")
              out.write("========================\n\n")


              for cat,names in sorted(
                  categories.items(),
                  key=lambda x: len(x[1]),
                  reverse=True
              ):

                  group = classify(names)

                  out.write(
                      f"CATEGORY {cat}\n"
                      f"TYPE: {group}\n"
                      f"COUNT: {len(names)}\n"
                  )

                  out.write("-"*60+"\n")


                  for n in names[:30]:
                      out.write(n+"\n")

                  out.write("\n\n")



          print("Categories found:",len(categories))
          print()
          print("CATEGORY SUMMARY")
          print("================")

          for cat,names in sorted(
              categories.items(),
              key=lambda x: len(x[1]),
              reverse=True
          ):

              print(
                  cat,
                  "|",
                  classify(names),
                  "|",
                  len(names),
                  "channels"
              )


          print()
          print("Created:",OUTPUT)

          PY


      - name: Upload Analysis
        uses: actions/upload-artifact@v4
        with:
          name: xtream-category-analysis
          path: xtream-epg/category-analysis.txt
