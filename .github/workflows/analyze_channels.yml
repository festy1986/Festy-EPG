name: Analyze Channels

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find channel file
        run: |
          echo "Looking for channel files..."
          find . -iname "channels.txt" -o -iname "*.txt"

      - name: Analyze channels
        shell: python
        run: |
          from collections import defaultdict
          import os

          INPUT_FILE = "channels.txt"

          # Find channels.txt anywhere in repo
          for root, dirs, files in os.walk("."):
              if "channels.txt" in files:
                  INPUT_FILE = os.path.join(root, "channels.txt")
                  break

          print(f"Using file: {INPUT_FILE}")

          categories = defaultdict(list)

          with open(INPUT_FILE, "r", encoding="utf-8", errors="ignore") as f:
              for line in f:
                  line = line.strip()

                  if not line:
                      continue

                  parts = [x.strip() for x in line.split("|")]

                  if len(parts) < 3:
                      continue

                  channel_id = parts[0]
                  category_id = parts[1]
                  name = parts[-1]

                  categories[category_id].append({
                      "id": channel_id,
                      "name": name
                  })

          print("\nCATEGORY SUMMARY")
          print("=" * 50)

          for cat, items in sorted(categories.items(), key=lambda x: len(x[1]), reverse=True):
              print(f"Category {cat}: {len(items)} channels")

          print("\nCHANNEL EXAMPLES")
          print("=" * 50)

          for cat, items in sorted(categories.items(), key=lambda x: len(x[1]), reverse=True):

              print(f"\n--- CATEGORY {cat} ({len(items)}) ---")

              for item in items[:10]:
                  print(f"{item['id']} | {item['name']}")
