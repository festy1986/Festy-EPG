name: PRIMECROSSCHECK

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: write

concurrency:
  group: primecrosscheck
  cancel-in-progress: false

jobs:
  prime-crosscheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify input files
        run: |
          test -s fastchannels.txt
          test -s SOURCEFASTCHANNELS2.txt

          echo "fastchannels.txt found"
          echo "SOURCEFASTCHANNELS2.txt found"

      - name: Match PRIME provider channels to Jessman FAST channels
        run: |
          node <<'EOF'
          const fs = require('fs')

          const providerPath = 'fastchannels.txt'
          const sourcePath = 'SOURCEFASTCHANNELS2.txt'
          const outputPath = 'PRIMECROSSCHECK.txt'

          const providerText =
            fs.readFileSync(
              providerPath,
              'utf8'
            )

          const sourceText =
            fs.readFileSync(
              sourcePath,
              'utf8'
            )

          function cleanText(value) {
            return String(value || '')
              .normalize('NFKC')
              .replace(/[ᴿᴬᵂ]/g, '')
              .replace(/\[FAST\]/gi, '')
              .replace(/\s+/g, ' ')
              .trim()
          }

          function normalizeTitle(value) {
            return cleanText(value)
              .toLowerCase()
              .replace(/&/g, ' and ')
              .replace(/[’']/g, '')
              .replace(/[^a-z0-9]+/g, '')
          }

          function providerTitle(value) {
            return cleanText(value)
              .replace(/^PRIME\s*:\s*/i, '')
          }

          function sourceTitle(value) {
            return cleanText(value)
          }

          function extractPrimeChannels(text) {
            const channels = []

            for (
              const rawLine of text.split(/\r?\n/)
            ) {
              const line =
                rawLine.trim()

              if (
                !line ||
                !/^PRIME\s*:/i.test(line)
              ) {
                continue
              }

              const parts =
                line.split('|')

              const providerNumber =
                parts[0]
                  ? parts[0].trim()
                  : ''

              const providerName =
                parts[1]
                  ? parts[1].trim()
                  : line

              const providerId =
                parts[2]
                  ? parts[2].trim()
                  : ''

              channels.push({
                providerNumber,
                providerName,
                providerId,
                title: providerTitle(
                  providerName
                ),
                normalizedTitle:
                  normalizeTitle(
                    providerTitle(
                      providerName
                    )
                  )
              })
            }

            return channels
          }

          function extractSourceChannels(text) {
            const channels = []

            for (
              const rawLine of text.split(/\r?\n/)
            ) {
              const line =
                rawLine.trim()

              if (
                !line ||
                line.startsWith(
                  'SOURCE FAST CHANNELS'
                ) ||
                line.startsWith(
                  'Generated:'
                ) ||
                line.startsWith(
                  'Total channels:'
                )
              ) {
                continue
              }

              const parts =
                line.split('|')

              if (
                parts.length < 2
              ) {
                continue
              }

              const displayName =
                parts[0]
                  .trim()

              const channelId =
                parts[1]
                  .trim()

              if (
                !channelId.endsWith(
                  '.us'
                )
              ) {
                continue
              }

              channels.push({
                displayName,
                channelId,
                normalizedTitle:
                  normalizeTitle(
                    sourceTitle(
                      displayName
                    )
                  )
              })
            }

            return channels
          }

          const providerChannels =
            extractPrimeChannels(
              providerText
            )

          const sourceChannels =
            extractSourceChannels(
              sourceText
            )

          const output =
            []

          const matchedProviderNumbers =
            new Set()

          const matchedSourceIds =
            new Set()

          let exactMatches =
            0

          let totalMatches =
            0

          for (
            const provider
              of providerChannels
          ) {
            const matches =
              sourceChannels.filter(
                source =>
                  source.normalizedTitle ===
                  provider.normalizedTitle
              )

            if (
              matches.length === 0
            ) {
              continue
            }

            for (
              const match
                of matches
            ) {
              const key =
                [
                  provider.providerNumber,
                  provider.providerId,
                  match.channelId
                ].join('|')

              if (
                matchedSourceIds.has(
                  key
                )
              ) {
                continue
              }

              matchedSourceIds.add(
                key
              )

              output.push(
                [
                  provider.providerNumber,
                  provider.providerName,
                  provider.providerId,
                  match.displayName,
                  match.channelId,
                  'MATCH: 100%'
                ].join(
                  ' | '
                )
              )

              matchedProviderNumbers.add(
                provider.providerNumber
              )

              totalMatches++
              exactMatches++
            }
          }

          output.sort(
            (
              a,
              b
            ) =>
              a.localeCompare(
                b,
                undefined,
                {
                  numeric: true,
                  sensitivity: 'base'
                }
              )
          )

          const lines =
            []

          lines.push(
            'PRIME CROSS-CHECKED CHANNELS'
          )

          lines.push(
            `Generated: ${new Date().toISOString()}`
          )

          lines.push(
            `PRIME provider channels checked: ${providerChannels.length}`
          )

          lines.push(
            `PRIME provider channels matched: ${matchedProviderNumbers.size}`
          )

          lines.push(
            `Total Jessman matches: ${totalMatches}`
          )

          lines.push(
            `Exact matches: ${exactMatches}`
          )

          lines.push(
            `Unmatched PRIME provider channels: ${
              providerChannels.length -
              matchedProviderNumbers.size
            }`
          )

          lines.push(
            ''
          )

          lines.push(
            ...output
          )

          fs.writeFileSync(
            outputPath,
            lines.join('\n') +
              '\n',
            'utf8'
          )

          console.log(
            `PRIME provider channels checked: ${providerChannels.length}`
          )

          console.log(
            `PRIME provider channels matched: ${matchedProviderNumbers.size}`
          )

          console.log(
            `Total Jessman matches: ${totalMatches}`
          )

          console.log(
            `Exact matches: ${exactMatches}`
          )

          console.log(
            `Output: ${outputPath}`
          )
          EOF

      - name: Validate PRIME cross-check
        run: |
          test -s PRIMECROSSCHECK.txt

          MATCH_COUNT=$(grep -c ' | MATCH: 100%' PRIMECROSSCHECK.txt || true)

          echo "Total matches written: $MATCH_COUNT"

          if [ "$MATCH_COUNT" -lt 1 ]; then
            echo "No PRIME matches were found"
            exit 1
          fi

      - name: Show PRIME cross-check summary
        run: |
          head -n 25 PRIMECROSSCHECK.txt

          echo ""
          echo "File size:"
          ls -lh PRIMECROSSCHECK.txt

      - name: Commit and push PRIME cross-check
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add PRIMECROSSCHECK.txt

          if git diff --cached --quiet; then
            echo "No PRIMECROSSCHECK changes to commit"
            exit 0
          fi

          git commit -m "Update PRIMECROSSCHECK"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            git add PRIMECROSSCHECK.txt

            if git diff --cached --quiet; then
              echo "PRIMECROSSCHECK already up to date"
              exit 0
            fi

            git commit -m "Update PRIMECROSSCHECK" || true

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed. Waiting before retry..."
            sleep 10
          done

          echo "Push failed after all retries"
          exit 1
