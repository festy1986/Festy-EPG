name: ESPN Team Logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-espn-logos:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      # ============================================================
      # FETCH ESPN LOGOS
      #
      # This creates:
      #
      # _temp_espn_logos/
      #   MLB/
      #   NBA/
      #   NFL/
      #   NHL/
      #
      # The source images are ESPN's direct 500px PNG logos.
      # ============================================================

      - name: Fetch ESPN team logos
        shell: python
        run: |
          import os
          import sys
          import requests
          from pathlib import Path
          from PIL import Image
          from io import BytesIO


          # ========================================================
          # CONFIG
          # ========================================================

          OUTPUT_ROOT = Path("_temp_espn_logos")

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0 Safari/537.36"
              ),
              "Accept": "image/avif,image/webp,image/apng,image/png,image/*,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          TIMEOUT = 30


          # ========================================================
          # ESPN TEAM LISTS
          #
          # These are ESPN's official abbreviations used by the
          # direct CDN logo URLs.
          # ========================================================

          TEAMS = {

              "MLB": {
                  "Arizona Diamondbacks": "ari",
                  "Athletics": "oak",
                  "Atlanta Braves": "atl",
                  "Baltimore Orioles": "bal",
                  "Boston Red Sox": "bos",
                  "Chicago Cubs": "chc",
                  "Chicago White Sox": "chw",
                  "Cincinnati Reds": "cin",
                  "Cleveland Guardians": "cle",
                  "Colorado Rockies": "col",
                  "Detroit Tigers": "det",
                  "Houston Astros": "hou",
                  "Kansas City Royals": "kc",
                  "Los Angeles Angels": "laa",
                  "Los Angeles Dodgers": "lad",
                  "Miami Marlins": "mia",
                  "Milwaukee Brewers": "mil",
                  "Minnesota Twins": "min",
                  "New York Mets": "nym",
                  "New York Yankees": "nyy",
                  "Philadelphia Phillies": "phi",
                  "Pittsburgh Pirates": "pit",
                  "San Diego Padres": "sd",
                  "San Francisco Giants": "sf",
                  "Seattle Mariners": "sea",
                  "St Louis Cardinals": "stl",
                  "Tampa Bay Rays": "tb",
                  "Texas Rangers": "tex",
                  "Toronto Blue Jays": "tor",
                  "Washington Nationals": "wsh",
              },

              "NBA": {
                  "Atlanta Hawks": "atl",
                  "Boston Celtics": "bos",
                  "Brooklyn Nets": "bkn",
                  "Charlotte Hornets": "cha",
                  "Chicago Bulls": "chi",
                  "Cleveland Cavaliers": "cle",
                  "Dallas Mavericks": "dal",
                  "Denver Nuggets": "den",
                  "Detroit Pistons": "det",
                  "Golden State Warriors": "gs",
                  "Houston Rockets": "hou",
                  "Indiana Pacers": "ind",
                  "LA Clippers": "lac",
                  "Los Angeles Lakers": "lal",
                  "Memphis Grizzlies": "mem",
                  "Miami Heat": "mia",
                  "Milwaukee Bucks": "mil",
                  "Minnesota Timberwolves": "min",
                  "New Orleans Pelicans": "no",
                  "New York Knicks": "ny",
                  "Oklahoma City Thunder": "okc",
                  "Orlando Magic": "orl",
                  "Philadelphia 76ers": "phi",
                  "Phoenix Suns": "phx",
                  "Portland Trail Blazers": "por",
                  "Sacramento Kings": "sac",
                  "San Antonio Spurs": "sa",
                  "Toronto Raptors": "tor",
                  "Utah Jazz": "utah",
                  "Washington Wizards": "wsh",
              },

              "NFL": {
                  "Arizona Cardinals": "ari",
                  "Atlanta Falcons": "atl",
                  "Baltimore Ravens": "bal",
                  "Buffalo Bills": "buf",
                  "Carolina Panthers": "car",
                  "Chicago Bears": "chi",
                  "Cincinnati Bengals": "cin",
                  "Cleveland Browns": "cle",
                  "Dallas Cowboys": "dal",
                  "Denver Broncos": "den",
                  "Detroit Lions": "det",
                  "Green Bay Packers": "gb",
                  "Houston Texans": "hou",
                  "Indianapolis Colts": "ind",
                  "Jacksonville Jaguars": "jax",
                  "Kansas City Chiefs": "kc",
                  "Las Vegas Raiders": "lv",
                  "Los Angeles Chargers": "lac",
                  "Los Angeles Rams": "lar",
                  "Miami Dolphins": "mia",
                  "Minnesota Vikings": "min",
                  "New England Patriots": "ne",
                  "New Orleans Saints": "no",
                  "New York Giants": "nyg",
                  "New York Jets": "nyj",
                  "Philadelphia Eagles": "phi",
                  "Pittsburgh Steelers": "pit",
                  "San Francisco 49ers": "sf",
                  "Seattle Seahawks": "sea",
                  "Tampa Bay Buccaneers": "tb",
                  "Tennessee Titans": "ten",
                  "Washington Commanders": "wsh",
              },

              "NHL": {
                  "Anaheim Ducks": "ana",
                  "Boston Bruins": "bos",
                  "Buffalo Sabres": "buf",
                  "Calgary Flames": "cgy",
                  "Carolina Hurricanes": "car",
                  "Chicago Blackhawks": "chi",
                  "Colorado Avalanche": "col",
                  "Columbus Blue Jackets": "cbj",
                  "Dallas Stars": "dal",
                  "Detroit Red Wings": "det",
                  "Edmonton Oilers": "edm",
                  "Florida Panthers": "fla",
                  "Los Angeles Kings": "la",
                  "Minnesota Wild": "min",
                  "Montreal Canadiens": "mtl",
                  "Nashville Predators": "nsh",
                  "New Jersey Devils": "nj",
                  "New York Islanders": "nyi",
                  "New York Rangers": "nyr",
                  "Ottawa Senators": "ott",
                  "Philadelphia Flyers": "phi",
                  "Pittsburgh Penguins": "pit",
                  "San Jose Sharks": "sj",
                  "Seattle Kraken": "sea",
                  "St Louis Blues": "stl",
                  "Tampa Bay Lightning": "tb",
                  "Toronto Maple Leafs": "tor",
                  "Utah Mammoth": "uta",
                  "Vancouver Canucks": "van",
                  "Vegas Golden Knights": "vgk",
                  "Washington Capitals": "wsh",
                  "Winnipeg Jets": "wpg",
              },
          }


          # ========================================================
          # DOWNLOAD
          # ========================================================

          session = requests.Session()
          session.headers.update(HEADERS)

          total = sum(
              len(teams)
              for teams in TEAMS.values()
          )

          downloaded = 0
          skipped = 0
          failed = []


          print()
          print("=" * 70)
          print("ESPN TEAM LOGO DOWNLOADER")
          print("=" * 70)
          print()
          print("Source: ESPN CDN")
          print("Format: 500px PNG")
          print(f"Total teams: {total}")
          print()
          print(
              "Existing files in the temporary folder are "
              "NOT overwritten."
          )
          print()


          for league, teams in TEAMS.items():

              league_dir = OUTPUT_ROOT / league
              league_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              print()
              print("=" * 70)
              print(f"{league}: {len(teams)} teams")
              print("=" * 70)

              for number, (team, abbreviation) in enumerate(
                  teams.items(),
                  start=1
              ):

                  destination = (
                      league_dir
                      / f"{team}.png"
                  )

                  print()
                  print(
                      f"[{league} {number}/{len(teams)}] "
                      f"{team}"
                  )

                  # ------------------------------------------------
                  # Do not overwrite manually curated logos.
                  # ------------------------------------------------

                  if destination.exists():

                      try:

                          with Image.open(
                              destination
                          ) as image:

                              image.verify()

                          print(
                              "  Existing logo found - "
                              "preserving it."
                          )

                          skipped += 1
                          continue

                      except Exception:

                          print(
                              "  Existing file is invalid - "
                              "downloading replacement."
                          )

                  url = (
                      f"https://a.espncdn.com/"
                      f"i/teamlogos/{league.lower()}/500/"
                      f"{abbreviation}.png"
                  )

                  print(
                      f"  ESPN CDN: {url}"
                  )

                  try:

                      response = session.get(
                          url,
                          timeout=TIMEOUT,
                          allow_redirects=True
                      )

                      response.raise_for_status()

                      if not response.content:

                          raise RuntimeError(
                              "ESPN returned an empty response."
                          )

                      image = Image.open(
                          BytesIO(
                              response.content
                          )
                      )

                      image.load()

                      image = image.convert(
                          "RGBA"
                      )

                      if (
                          image.width <= 0
                          or image.height <= 0
                      ):

                          raise RuntimeError(
                              "Invalid image dimensions."
                          )

                      image.save(
                          destination,
                          "PNG",
                          optimize=True
                      )

                      # --------------------------------------------
                      # Verify the saved file.
                      # --------------------------------------------

                      with Image.open(
                          destination
                      ) as verify:

                          verify.load()

                          if verify.format != "PNG":

                              raise RuntimeError(
                                  "Saved file is not PNG."
                              )

                          if (
                              verify.width <= 0
                              or verify.height <= 0
                          ):

                              raise RuntimeError(
                                  "Saved image has invalid dimensions."
                              )

                      downloaded += 1

                      print(
                          f"  Saved: {destination}"
                      )

                      print(
                          f"  Size: "
                          f"{image.width}x{image.height}"
                      )

                  except Exception as exc:

                      failed.append(
                          (
                              league,
                              team,
                              url,
                              str(exc)
                          )
                      )

                      print(
                          f"  ERROR: {exc}"
                      )


          # ========================================================
          # FINAL REPORT
          # ========================================================

          print()
          print("=" * 70)
          print("ESPN LOGO DOWNLOAD COMPLETE")
          print("=" * 70)
          print()
          print(
              f"New logos downloaded: {downloaded}"
          )
          print(
              f"Existing logos preserved: {skipped}"
          )
          print(
              f"Failed downloads: {len(failed)}"
          )
          print()

          if failed:

              print("FAILED LOGOS")
              print("-" * 70)

              for league, team, url, error in failed:

                  print()
                  print(
                      f"{league}: {team}"
                  )

                  print(
                      f"  URL: {url}"
                  )

                  print(
                      f"  ERROR: {error}"
                  )

              print()
              print("=" * 70)
              print(
                  "WARNING: Some logos could not be downloaded."
              )
              print("=" * 70)

              sys.exit(1)

          print(
              f"Temporary logo library: {OUTPUT_ROOT}"
          )

          print()
          print(
              "The existing sports-logos library was "
              "NOT modified."
          )

      # ============================================================
      # SHOW WHAT WAS CREATED
      # ============================================================

      - name: Show downloaded logo library
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "TEMPORARY ESPN LOGO LIBRARY"
          echo "============================================================"
          echo

          find _temp_espn_logos \
            -type f \
            -name "*.png" \
            | sort

          echo
          echo "============================================================"
          echo "LOGO COUNTS"
          echo "============================================================"

          for league in MLB NBA NFL NHL; do
            count=$(find "_temp_espn_logos/$league" \
              -type f \
              -name "*.png" 2>/dev/null | wc -l)

            echo "$league: $count"
          done

      # ============================================================
      # COMMIT TEMPORARY LOGO LIBRARY
      # ============================================================

      - name: Commit ESPN logo library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _temp_espn_logos

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update ESPN team logo library"
          git push
